# network-engine/topology/lab.conf
# ==============================================================================
# BLOQUE 2 - MODELOS GENERALES
# ==============================================================================
# ------------------------------------------------------------------------------
# A - Modelos de NameSpaces
# ------------------------------------------------------------------------------
NS_INTERNET="INTERNET"
NS_EDGE_1="EDGE-1"
NS_CORE_EDGE="CORE-EDGE"
NS_CORE_MGMT="CORE-MGMT"
NS_CORE_SVC="CORE-SVC"
NS_CORE_ADM="CORE-ADM"

# Lista para iterar (opcional, para compatibilidad)
NAMESPACES=(
  "$NS_INTERNET"
  "$NS_EDGE_1"
  "$NS_CORE_EDGE"
  "$NS_CORE_MGMT"
  "$NS_CORE_SVC"
  "$NS_CORE_ADM"
  
)
# ------------------------------------------------------------------------------
# B - Modelo de Cables (usando VARIABLES)
# Formato: $NS_A:$INTERFACE_A:$NS_B:$INTERFACE_B
# ------------------------------------------------------------------------------
CABLES=(
  "$NS_EDGE_1:eth1:$NS_INTERNET:eth1"
  "$NS_EDGE_1:eth0:$NS_CORE_EDGE:eth0"
  "$NS_CORE_SVC:eth1:$NS_CORE_EDGE:eth1"
  "$NS_CORE_MGMT:eth2:$NS_CORE_EDGE:eth2"

  #Cable desde NS_CORE_ADM a NS_CORE_EDGE
  "$NS_CORE_ADM:eth3:$NS_CORE_EDGE:eth3"

)
# ------------------------------------------------------------------------------
# C - Modelo de IPs
# Formato: $NAMESPACE:$INTERFACE:$IP_CIDR
# ------------------------------------------------------------------------------
IPS=(
  # Solo interfaces físicas y enlaces punto a punto
  "$NS_EDGE_1:eth1:203.0.113.1/30"
  "$NS_INTERNET:eth1:203.0.113.2/30"
  "$NS_EDGE_1:eth0:10.255.255.1/30"
  "$NS_CORE_EDGE:eth0:10.255.255.2/30"
  "$NS_CORE_EDGE:eth1:10.255.255.5/30"
  "$NS_CORE_SVC:eth1:10.255.255.6/30"
  "$NS_CORE_EDGE:eth2:10.255.255.9/30"
  "$NS_CORE_MGMT:eth2:10.255.255.10/30"
  "$NS_CORE_EDGE:eth3:10.255.255.13/30"
  "$NS_CORE_ADM:eth3:10.255.255.14/30"
)

#--------------------------------------
# D - Modelo de Rutas
# Formato: $NAMESPACE:$DESTINO:$VIA
# ------------------------------------------------------------------------------
# NOTA IMPORTANTE SOBRE GATEWAYS POR DEFECTO:
#   - El gateway default DEBE ser una IP que esté **directamente conectada** al namespace
#     (es decir, en la misma subred /30 del enlace físico veth o cable).
#   - NO se puede usar directamente una IP de VLAN (10.10.0.2, 10.50.0.2, etc.) como nexthop
#     porque esa IP reside en una subinterfaz (ethX.Y) del CORE-EDGE y no está en el enlace L2
#     directo del namespace que quiere usarla.
#   - Solución: todos los namespaces leaf (SVC, MGMT, ADM) apuntan su default al CORE-EDGE
#     vía su IP física en el enlace punto-a-punto correspondiente.
#   - Luego CORE-EDGE se encarga de enrutar hacia las VLANs correspondientes.
# ------------------------------------------------------------------------------
ROUTES=(
  # === GATEWAYS POR DEFECTO (Default Routes) ===
  # Salida real hacia Internet (solo EDGE-1 tiene salida externa)
  "$NS_EDGE_1:default:203.0.113.2"       # Salida al ISP (INTERNET namespace)

  # CORE-EDGE envía todo lo que no conoce hacia EDGE-1
  "$NS_CORE_EDGE:default:10.255.255.1"   # Hacia EDGE-1 (enlace eth0)

  # Los namespaces "leaf" (SVC, MGMT, ADM) apuntan SIEMPRE al CORE-EDGE físico
  "$NS_CORE_SVC:default:10.255.255.5"    # Hacia CORE-EDGE eth1 (enlace físico)
  "$NS_CORE_MGMT:default:10.255.255.9"   # Hacia CORE-EDGE eth2 (enlace físico)
  "$NS_CORE_ADM:default:10.255.255.13"   # Hacia CORE-EDGE eth3 (enlace físico)

  # === RUTAS DE RETORNO DESDE EDGE-1 (hacia las subredes de clientes/VLANs) ===
  # EDGE-1 necesita saber que todas las VLANs de servicios están detrás de CORE-EDGE
  "$NS_EDGE_1:10.10.0.0/24:10.255.255.2"   # VLAN 10 → CORE-EDGE
  "$NS_EDGE_1:10.20.0.0/24:10.255.255.2"   # VLAN 20 → CORE-EDGE
  "$NS_EDGE_1:10.30.0.0/24:10.255.255.2"   # VLAN 30 → CORE-EDGE
  "$NS_EDGE_1:10.40.0.0/24:10.255.255.2"   # VLAN 40 → CORE-EDGE
  "$NS_EDGE_1:10.50.0.0/24:10.255.255.2"   # VLAN 50 (ADM) → CORE-EDGE

  # === RUTAS HACIA LOS ENLACES DE TRANSPORTE / MANAGEMENT ===
  # Estas rutas son opcionales pero útiles para depuración y reachability
  # desde EDGE-1 hacia las IPs de CORE-EDGE en los enlaces punto-a-punto
  "$NS_EDGE_1:10.255.255.4/30:10.255.255.2"   # Subred CORE-SVC (eth1)
  "$NS_EDGE_1:10.255.255.8/30:10.255.255.2"   # Subred CORE-MGMT (eth2)
  "$NS_EDGE_1:10.255.255.12/30:10.255.255.2"  # Subred CORE-ADM (eth3)
)
# ------------------------------------------------------------------------------
# E - Roles de Network Function
# ------------------------------------------------------------------------------
# Namespaces que actúan como routers L3 (forwarding, NAT, FW)
ROUTERS=(
  "$NS_EDGE_1"
  "$NS_CORE_EDGE"
  "$NS_CORE_MGMT"
  "$NS_CORE_SVC"
  "$NS_CORE_ADM"
  
)

# ------------------------------------------------------------------------------
# F - NAT / EGRESS
# Formato: NAMESPACE:OUT_IFACE
# ------------------------------------------------------------------------------
NAT_ROUTERS=(
  "$NS_EDGE_1:eth1"
)


# ------------------------------------------------------------------------------
# G - Modelo de FIREWALL por Namespace (Zonas + Políticas)
# ------------------------------------------------------------------------------
# Namespaces con firewall activo
FW_NAMESPACES=(
  "$NS_EDGE_1"
  "$NS_CORE_EDGE"
  "$NS_CORE_MGMT"
  "$NS_CORE_SVC"
  "$NS_CORE_ADM"
  
)

# Zonas por namespace:interface → policy (drop|accept)
declare -A FW_ZONES=(
  ["$NS_EDGE_1:eth1"]="wan"
  ["$NS_EDGE_1:eth0"]="lan"

  ["$NS_CORE_EDGE:eth0"]="transit"
  ["$NS_CORE_EDGE:eth1"]="transit"
  ["$NS_CORE_EDGE:eth2"]="transit"

  ["$NS_CORE_MGMT:eth2"]="mgmt"

  ["$NS_CORE_SVC:eth1"]="core"

  # ZONES para CORE-ADM
  ["$NS_CORE_ADM:eth3"]="users"
)

# Políticas entre zonas (zoneA->zoneB)
declare -A FW_POLICIES=(
  ["lan->wan"]="accept"
  ["wan->lan"]="accept"

  ["transit->transit"]="accept"
  ["lan->transit"]="accept"
  ["transit->lan"]="accept"  
  
  ["core->transit"]="accept"
  ["transit->core"]="accept"

  ["mgmt->transit"]="accept"
  ["transit->mgmt"]="accept"
  ["mgmt->lan"]="accept"     
  ["lan->mgmt"]="accept"     
  
  ["mgmt->core"]="accept"
  ["core->mgmt"]="drop"

  # Politicas Minimas para CORE-ADM
  ["users->transit"]="accept"
  ["transit->users"]="accept"
)


# BUENO (una línea por regla)
# CORREGIR estas reglas:
declare -A FW_RULES=(
  ["$NS_EDGE_1"]="tcp dport 22 accept; tcp dport 80 accept; tcp dport 443 accept; ip protocol icmp accept"
  
  ["$NS_CORE_EDGE"]="ip protocol icmp accept"  # SIMPLIFICAR
  
  ["$NS_CORE_MGMT"]="tcp dport 22 accept; ip protocol icmp accept"  # QUITAR regla incorrecta
  
  ["$NS_CORE_SVC"]="ip protocol icmp accept"

  #Reglas Basicas para CORE-ADM
  ["$NS_CORE_ADM"]="ip protocol icmp accept"
)



# ------------------------------------------------------------------------------
# H - Modelo de VLANs (802.1Q)
# Formato: NAMESPACE:PARENT_IFACE:VLAN_ID:IP_CIDR
# ------------------------------------------------------------------------------
VLANS=(
  # === VLANs en CORE-EDGE (Nodos de Tránsito / Gateways .2) ===
  "$NS_CORE_EDGE:eth1:10:10.10.0.2/24"
  "$NS_CORE_EDGE:eth1:20:10.20.0.2/24"
  "$NS_CORE_EDGE:eth1:30:10.30.0.2/24"
  "$NS_CORE_EDGE:eth1:40:10.40.0.2/24"
  "$NS_CORE_EDGE:eth3:50:10.50.0.2/24"

  # === VLANs en CORE-SVC (Endpoints .1) ===
  "$NS_CORE_SVC:eth1:10:10.10.0.1/24"
  "$NS_CORE_SVC:eth1:20:10.20.0.1/24"
  "$NS_CORE_SVC:eth1:30:10.30.0.1/24"
  "$NS_CORE_SVC:eth1:40:10.40.0.1/24"

  # === VLANs en CORE-ADM (Endpoints .1) ===
  "$NS_CORE_ADM:eth3:50:10.50.0.1/24"
)
