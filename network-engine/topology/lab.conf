# network-engine/topology/lab.conf
# ==============================================================================
# BLOQUE 2 - MODELOS GENERALES
# ==============================================================================
# ------------------------------------------------------------------------------
# A - Modelos de NameSpaces
# ------------------------------------------------------------------------------
NS_EDGE_1="EDGE-1"
NS_CORE_1="CORE-1"
NS_INTERNET="INTERNET"
# Lista para iterar (opcional, para compatibilidad)
NAMESPACES=(
  "$NS_EDGE_1"
  "$NS_CORE_1"
  "$NS_INTERNET"
)
# ------------------------------------------------------------------------------
# B - Modelo de Cables (usando VARIABLES)
# Formato: $NS_A:$INTERFACE_A:$NS_B:$INTERFACE_B
# ------------------------------------------------------------------------------
CABLES=(
  "$NS_EDGE_1:eth0:$NS_CORE_1:eth0"
  "$NS_EDGE_1:eth1:$NS_INTERNET:eth1"

)
# ------------------------------------------------------------------------------
# C - Modelo de IPs
# Formato: $NAMESPACE:$INTERFACE:$IP_CIDR
# ------------------------------------------------------------------------------
IPS=(
  "$NS_EDGE_1:eth0:10.255.255.1/30"
  "$NS_CORE_1:eth0:10.255.255.2/30"

  "$NS_EDGE_1:eth1:203.0.113.1/30"
  "$NS_INTERNET:eth1:203.0.113.2/30"
)
# ------------------------------------------------------------------------------
# D - Modelo de Rutas
# Formato:
# $NAMESPACE:$DESTINO:$VIA
# ------------------------------------------------------------------------------
ROUTES=(
  "$NS_CORE_1:default:10.255.255.1"
  "$NS_EDGE_1:default:203.0.113.2"
)

# ------------------------------------------------------------------------------
# E - Roles de Network Function
# ------------------------------------------------------------------------------
# Namespaces que actúan como routers L3 (forwarding, NAT, FW)
ROUTERS=(
  "$NS_EDGE_1"
  "$NS_CORE_1"
)

# ------------------------------------------------------------------------------
# F - NAT / EGRESS
# Formato: NAMESPACE:OUT_IFACE
# ------------------------------------------------------------------------------
NAT_ROUTERS=(
  "$NS_EDGE_1:eth1"
)

