# network-engine/topology/lab.conf
# ==============================================================================
# BLOQUE 2 - MODELOS GENERALES
# ==============================================================================
# ------------------------------------------------------------------------------
# A - Modelos de NameSpaces
# ------------------------------------------------------------------------------
NS_EDGE_1="EDGE-1"
NS_CORE_1="CORE-1"
NS_INTERNET="INTERNET"
# Lista para iterar (opcional, para compatibilidad)
NAMESPACES=(
  "$NS_INTERNET"
  "$NS_EDGE_1"
  "$NS_CORE_1"
  
)
# ------------------------------------------------------------------------------
# B - Modelo de Cables (usando VARIABLES)
# Formato: $NS_A:$INTERFACE_A:$NS_B:$INTERFACE_B
# ------------------------------------------------------------------------------
CABLES=(
  "$NS_EDGE_1:eth1:$NS_INTERNET:eth1"
  "$NS_EDGE_1:eth0:$NS_CORE_1:eth0"
  

)
# ------------------------------------------------------------------------------
# C - Modelo de IPs
# Formato: $NAMESPACE:$INTERFACE:$IP_CIDR
# ------------------------------------------------------------------------------
IPS=(
  "$NS_EDGE_1:eth0:10.255.255.1/30"
  "$NS_CORE_1:eth0:10.255.255.2/30"

  "$NS_EDGE_1:eth1:203.0.113.1/30"
  "$NS_INTERNET:eth1:203.0.113.2/30"
)
# ------------------------------------------------------------------------------
# D - Modelo de Rutas
# Formato:
# $NAMESPACE:$DESTINO:$VIA
# ------------------------------------------------------------------------------
ROUTES=(
  "$NS_CORE_1:default:10.255.255.1"
  "$NS_EDGE_1:default:203.0.113.2"
)

# ------------------------------------------------------------------------------
# E - Roles de Network Function
# ------------------------------------------------------------------------------
# Namespaces que actúan como routers L3 (forwarding, NAT, FW)
ROUTERS=(
  "$NS_EDGE_1"
  "$NS_CORE_1"
)

# ------------------------------------------------------------------------------
# F - NAT / EGRESS
# Formato: NAMESPACE:OUT_IFACE
# ------------------------------------------------------------------------------
NAT_ROUTERS=(
  "$NS_EDGE_1:eth1"
)


# ------------------------------------------------------------------------------
# G - Modelo de FIREWALL por Namespace (Zonas + Políticas)
# ------------------------------------------------------------------------------

# Zonas por namespace:interface → policy (drop|accept)
declare -A FW_ZONES=(
  # EDGE-1: WAN drop, LAN accept
  ["$NS_EDGE_1:eth1"]="drop"      # WAN → INTERNET
  ["$NS_EDGE_1:eth0"]="accept"    # LAN → COREs
  # CORE-1: Transit accept
  ["$NS_CORE_1:eth0"]="accept"
)

# BUENO (una línea por regla)
declare -A FW_RULES=(
  ["$NS_EDGE_1"]="tcp dport {22,80,443} accept; ip protocol icmp accept"
  ["$NS_CORE_1"]="ip protocol icmp accept"
)


# Namespaces con firewall activo
FW_NAMESPACES=(
  "$NS_EDGE_1"
  "$NS_CORE_1"
)
