# network-engine/topology/lab.conf
# ==============================================================================
# BLOQUE 2 - MODELOS GENERALES
# ==============================================================================
# ------------------------------------------------------------------------------
# A - Modelos de NameSpaces
# ------------------------------------------------------------------------------
NS_INTERNET="INTERNET"
NS_EDGE_1="EDGE-1"
NS_CORE_EDGE="CORE-EDGE"
NS_CORE_MGMT="CORE-MGMT"
NS_CORE_SVC="CORE-SVC"

# Lista para iterar (opcional, para compatibilidad)
NAMESPACES=(
  "$NS_INTERNET"
  "$NS_EDGE_1"
  "$NS_CORE_EDGE"
  "$NS_CORE_MGMT"
  "$NS_CORE_SVC"
  
)
# ------------------------------------------------------------------------------
# B - Modelo de Cables (usando VARIABLES)
# Formato: $NS_A:$INTERFACE_A:$NS_B:$INTERFACE_B
# ------------------------------------------------------------------------------
CABLES=(
  "$NS_EDGE_1:eth1:$NS_INTERNET:eth1"
  "$NS_EDGE_1:eth0:$NS_CORE_EDGE:eth0"
  "$NS_CORE_SVC:eth1:$NS_CORE_EDGE:eth1"
  "$NS_CORE_MGMT:eth2:$NS_CORE_EDGE:eth2"

)
# ------------------------------------------------------------------------------
# C - Modelo de IPs
# Formato: $NAMESPACE:$INTERFACE:$IP_CIDR
# ------------------------------------------------------------------------------
IPS=(
    # IPs entre EDGE-1 <--> INTERNET
  "$NS_EDGE_1:eth1:203.0.113.1/30"
  "$NS_INTERNET:eth1:203.0.113.2/30"

  # IPs entre EDGE-1 <-->CORE-EDGE
  "$NS_EDGE_1:eth0:10.255.255.1/30"
  "$NS_CORE_EDGE:eth0:10.255.255.2/30"

  #IPs entre CORE-EDGE <--> CORE-SVC
  "$NS_CORE_EDGE:eth1:10.255.255.5/30"
  "$NS_CORE_SVC:eth1:10.255.255.6/30"

  # IPs entre CORE-EDGE <--> CORE-MGMT
  "$NS_CORE_EDGE:eth2:10.255.255.9/30"
  "$NS_CORE_MGMT:eth2:10.255.255.10/30"
)
# ------------------------------------------------------------------------------
# D - Modelo de Rutas
# Formato:
# $NAMESPACE:$DESTINO:$VIA
# ------------------------------------------------------------------------------
ROUTES=(
  "$NS_EDGE_1:default:203.0.113.2"
  "$NS_CORE_EDGE:default:10.255.255.1"
  "$NS_CORE_SVC:default:10.255.255.5"
  "$NS_CORE_MGMT:default:10.255.255.9"
  
)

# ------------------------------------------------------------------------------
# E - Roles de Network Function
# ------------------------------------------------------------------------------
# Namespaces que actúan como routers L3 (forwarding, NAT, FW)
ROUTERS=(
  "$NS_EDGE_1"
  "$NS_CORE_EDGE"
  "$NS_CORE_MGMT"
  "$NS_CORE_SVC"
  
)

# ------------------------------------------------------------------------------
# F - NAT / EGRESS
# Formato: NAMESPACE:OUT_IFACE
# ------------------------------------------------------------------------------
NAT_ROUTERS=(
  "$NS_EDGE_1:eth1"
)


# ------------------------------------------------------------------------------
# G - Modelo de FIREWALL por Namespace (Zonas + Políticas)
# ------------------------------------------------------------------------------
# Namespaces con firewall activo
FW_NAMESPACES=(
  "$NS_EDGE_1"
  "$NS_CORE_MGMT"
  "$NS_CORE_SVC"
  
)

# Zonas por namespace:interface → policy (drop|accept)
declare -A FW_ZONES=(
  ["$NS_EDGE_1:eth1"]="wan"
  ["$NS_EDGE_1:eth0"]="lan"

  ["$NS_CORE_MGMT:eth2"]="mgmt"

  ["$NS_CORE_SVC:eth1"]="core"
)

# Políticas entre zonas (zoneA->zoneB)
declare -A FW_POLICIES=(
  ["lan->wan"]="accept"
  ["wan->lan"]="drop"

  ["transit->transit"]="accept"

  ["transit->lan"]="accept"
  ["lan->transit"]="accept"
  ["core->transit"]="accept"
  ["transit->core"]="accept"

  # MGMT
  ["mgmt->transit"]="accept"
  ["transit->mgmt"]="drop"

  ["mgmt->core"]="accept"
  ["core->mgmt"]="drop"
)


# BUENO (una línea por regla)
declare -A FW_RULES=(
  ["$NS_EDGE_1"]="tcp dport {22,80,443} accept; ip protocol icmp accept"
  ["$NS_CORE_MGMT"]="tcp dport 22 accept; ip protocol icmp accept"
  ["$NS_CORE_SVC"]="ip protocol icmp accept"
)






