# network-engine/topology/lab.conf
# ==============================================================================
# BLOQUE 2 - MODELOS GENERALES
# ==============================================================================
# ------------------------------------------------------------------------------
# A - Modelos de NameSpaces
# ------------------------------------------------------------------------------
NS_INTERNET="INTERNET"
NS_EDGE_1="EDGE-1"
NS_CORE_EDGE="CORE-EDGE"
NS_CORE_MGMT="CORE-MGMT"
NS_CORE_SVC="CORE-SVC"
NS_CORE_ADM="CORE-ADM"

# Lista para iterar (opcional, para compatibilidad)
NAMESPACES=(
  "$NS_INTERNET"
  "$NS_EDGE_1"
  "$NS_CORE_EDGE"
  "$NS_CORE_MGMT"
  "$NS_CORE_SVC"
  "$NS_CORE_ADM"
  
)
# ------------------------------------------------------------------------------
# B - Modelo de Cables (usando VARIABLES)
# Formato: $NS_A:$INTERFACE_A:$NS_B:$INTERFACE_B
# ------------------------------------------------------------------------------
CABLES=(
  "$NS_EDGE_1:eth1:$NS_INTERNET:eth1"
  "$NS_EDGE_1:eth0:$NS_CORE_EDGE:eth0"
  "$NS_CORE_SVC:eth1:$NS_CORE_EDGE:eth1"
  "$NS_CORE_MGMT:eth2:$NS_CORE_EDGE:eth2"

  #Cable desde NS_CORE_ADM a NS_CORE_EDGE
  "$NS_CORE_ADM:eth3:$NS_CORE_EDGE:eth3"

)
# ------------------------------------------------------------------------------
# C - Modelo de IPs
# Formato: $NAMESPACE:$INTERFACE:$IP_CIDR
# ------------------------------------------------------------------------------
IPS=(
  # === TRANSPORTE EXTERNO (WAN) ===
  "$NS_EDGE_1:eth1:203.0.113.1/30"
  "$NS_INTERNET:eth1:203.0.113.2/30"

  # === TRANSPORTE INTERNO (BACKBONE) ===
  # Enlace EDGE-1 <--> CORE-EDGE
  "$NS_EDGE_1:eth0:10.255.255.1/30"
  "$NS_CORE_EDGE:eth0:10.255.255.2/30"

  # Enlace CORE-EDGE <--> CORE-SVC (Físico/Trunk)
  "$NS_CORE_EDGE:eth1:10.255.255.5/30"
  "$NS_CORE_SVC:eth1:10.255.255.6/30"

  # Enlace CORE-EDGE <--> CORE-MGMT
  "$NS_CORE_EDGE:eth2:10.255.255.9/30"
  "$NS_CORE_MGMT:eth2:10.255.255.10/30"

  # Enlace CORE-EDGE <--> CORE-ADM
  "$NS_CORE_EDGE:eth3:10.255.255.13/30"
  "$NS_CORE_ADM:eth3:10.255.255.14/30"

  # === SEGMENTACIÓN VLAN (GATEWAYS EN CORE-EDGE) ===
  # Estos actúan como la puerta de enlace para los servicios
  "$NS_CORE_EDGE:eth1.10:10.10.0.2/24"
  "$NS_CORE_EDGE:eth1.20:10.20.0.2/24"
  "$NS_CORE_EDGE:eth1.30:10.30.0.2/24"
  "$NS_CORE_EDGE:eth1.40:10.40.0.2/24"
  
  # Gateway para la VLAN de Administración
  "$NS_CORE_EDGE:eth3.50:10.50.0.2/24"
)
# ------------------------------------------------------------------------------
# D - Modelo de Rutas
# Formato: $NAMESPACE:$DESTINO:$VIA
# ------------------------------------------------------------------------------
ROUTES=(
  # === GATEWAYS POR DEFECTO (Salida a Internet) ===
  "$NS_EDGE_1:default:203.0.113.2"       # Salida de la red al ISP
  "$NS_CORE_EDGE:default:10.255.255.1"  # El Core envía todo lo externo al Edge
  "$NS_CORE_SVC:default:10.10.0.2"      # SVC sale por su Gateway VLAN 10 en Core
  "$NS_CORE_MGMT:default:10.255.255.9"  # MGMT sale por su enlace directo al Core
  "$NS_CORE_ADM:default:10.50.0.2"      # ADM sale por su Gateway VLAN 50 en Core

  # === RUTAS DE RETORNO DESDE EL EDGE (Hacia el interior) ===
  # El EDGE-1 necesita saber que las subredes de clientes están detrás del CORE-EDGE
  "$NS_EDGE_1:10.10.0.0/24:10.255.255.2"
  "$NS_EDGE_1:10.20.0.0/24:10.255.255.2"
  "$NS_EDGE_1:10.30.0.0/24:10.255.255.2"
  "$NS_EDGE_1:10.40.0.0/24:10.255.255.2"
  "$NS_EDGE_1:10.50.0.0/24:10.255.255.2"

  # === RUTAS HACIA SEGMENTOS DE GESTIÓN / TRANSPORTE ===
  "$NS_EDGE_1:10.255.255.8/30:10.255.255.2"  # Para alcanzar CORE-MGMT
  "$NS_EDGE_1:10.255.255.4/30:10.255.255.2"  # Para alcanzar CORE-SVC (IP física)
  "$NS_EDGE_1:10.255.255.12/30:10.255.255.2" # Para alcanzar CORE-ADM (IP física)
)
# ------------------------------------------------------------------------------
# E - Roles de Network Function
# ------------------------------------------------------------------------------
# Namespaces que actúan como routers L3 (forwarding, NAT, FW)
ROUTERS=(
  "$NS_EDGE_1"
  "$NS_CORE_EDGE"
  "$NS_CORE_MGMT"
  "$NS_CORE_SVC"
  "$NS_CORE_ADM"
  
)

# ------------------------------------------------------------------------------
# F - NAT / EGRESS
# Formato: NAMESPACE:OUT_IFACE
# ------------------------------------------------------------------------------
NAT_ROUTERS=(
  "$NS_EDGE_1:eth1"
)


# ------------------------------------------------------------------------------
# G - Modelo de FIREWALL por Namespace (Zonas + Políticas)
# ------------------------------------------------------------------------------
# Namespaces con firewall activo
FW_NAMESPACES=(
  "$NS_EDGE_1"
  "$NS_CORE_EDGE"
  "$NS_CORE_MGMT"
  "$NS_CORE_SVC"
  "$NS_CORE_ADM"
  
)

# Zonas por namespace:interface → policy (drop|accept)
declare -A FW_ZONES=(
  ["$NS_EDGE_1:eth1"]="wan"
  ["$NS_EDGE_1:eth0"]="lan"

  ["$NS_CORE_EDGE:eth0"]="transit"
  ["$NS_CORE_EDGE:eth1"]="transit"
  ["$NS_CORE_EDGE:eth2"]="transit"

  ["$NS_CORE_MGMT:eth2"]="mgmt"

  ["$NS_CORE_SVC:eth1"]="core"

  # ZONES para CORE-ADM
  ["$NS_CORE_ADM:eth3"]="users"
)

# Políticas entre zonas (zoneA->zoneB)
declare -A FW_POLICIES=(
  ["lan->wan"]="accept"
  ["wan->lan"]="accept"

  ["transit->transit"]="accept"
  ["lan->transit"]="accept"
  ["transit->lan"]="accept"  
  
  ["core->transit"]="accept"
  ["transit->core"]="accept"

  ["mgmt->transit"]="accept"
  ["transit->mgmt"]="accept"
  ["mgmt->lan"]="accept"     
  ["lan->mgmt"]="accept"     
  
  ["mgmt->core"]="accept"
  ["core->mgmt"]="drop"

  # Politicas Minimas para CORE-ADM
  ["users->transit"]="accept"
  ["transit->users"]="accept"
)


# BUENO (una línea por regla)
# CORREGIR estas reglas:
declare -A FW_RULES=(
  ["$NS_EDGE_1"]="tcp dport 22 accept; tcp dport 80 accept; tcp dport 443 accept; ip protocol icmp accept"
  
  ["$NS_CORE_EDGE"]="ip protocol icmp accept"  # SIMPLIFICAR
  
  ["$NS_CORE_MGMT"]="tcp dport 22 accept; ip protocol icmp accept"  # QUITAR regla incorrecta
  
  ["$NS_CORE_SVC"]="ip protocol icmp accept"

  #Reglas Basicas para CORE-ADM
  ["$NS_CORE_ADM"]="ip protocol icmp accept"
)



# ------------------------------------------------------------------------------
# H - Modelo de VLANs (802.1Q)
# Formato: NAMESPACE:PARENT_IFACE:VLAN_ID:IP_CIDR
#
# NOTA: Se definen tanto en los nodos de SERVICIOS (endpoints) como en el 
# CORE-EDGE (gateways). Esto garantiza que el tráfico viaje etiquetado en 
# ambos sentidos del trunk.
# ------------------------------------------------------------------------------
VLANS=(
  # === VLANs en CORE-EDGE (Nodos de Tránsito / Gateways) ===
  # Estas interfaces reciben el tráfico del SVC y ADM y actúan como Gateways .2
  "$NS_CORE_EDGE:eth1:10:10.10.0.2/24"
  "$NS_CORE_EDGE:eth1:20:10.20.0.2/24"
  "$NS_CORE_EDGE:eth1:30:10.30.0.2/24"
  "$NS_CORE_EDGE:eth1:40:10.40.0.2/24"
  "$NS_CORE_EDGE:eth3:50:10.50.0.2/24"

  # === VLANs en CORE-SVC (Nodo de Servicios - Endpoints .1) ===
  "$NS_CORE_SVC:eth1:10:10.10.0.1/24"
  "$NS_CORE_SVC:eth1:20:10.20.0.1/24"
  "$NS_CORE_SVC:eth1:30:10.30.0.1/24"
  "$NS_CORE_SVC:eth1:40:10.40.0.1/24"

  # === VLANs en CORE-ADM (Nodo de Administración - Endpoint .1) ===
  "$NS_CORE_ADM:eth3:50:10.50.0.1/24"
)
