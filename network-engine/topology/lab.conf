# network-engine/topology/lab.conf
# network-engine/topology/lab.conf
set -Eeuo pipefail

TOPOLOGY_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

source "$TOPOLOGY_DIR/namespaces.conf"
source "$TOPOLOGY_DIR/links.conf"
source "$TOPOLOGY_DIR/addressing.conf"

# FIREWALL
source "$TOPOLOGY_DIR/firewall/base.conf"
source "$TOPOLOGY_DIR/firewall/policies.conf"

source "$TOPOLOGY_DIR/firewall/edge.conf"
source "$TOPOLOGY_DIR/firewall/core-edge.conf"
source "$TOPOLOGY_DIR/firewall/core-mgmt.conf"
source "$TOPOLOGY_DIR/firewall/core-svc.conf"
source "$TOPOLOGY_DIR/firewall/core-adm.conf"

# ------------------------------------------------------------------------------
# ROUTING (MODULAR)
# ------------------------------------------------------------------------------
source "$TOPOLOGY_DIR/routing/base.conf"
source "$TOPOLOGY_DIR/routing/edge.conf"
source "$TOPOLOGY_DIR/routing/core-edge.conf"
source "$TOPOLOGY_DIR/routing/core-svc.conf"
source "$TOPOLOGY_DIR/routing/core-mgmt.conf"
source "$TOPOLOGY_DIR/routing/core-adm.conf"








# ------------------------------------------------------------------------------
# E - Roles de Network Function
# ------------------------------------------------------------------------------
# Namespaces que actúan como routers L3 (forwarding, NAT, FW)
ROUTERS=(
  "$NS_EDGE_1"
  "$NS_CORE_EDGE"
  "$NS_CORE_MGMT"
  "$NS_CORE_SVC"
  "$NS_CORE_ADM"
  
)

# ------------------------------------------------------------------------------
# F - NAT / EGRESS
# Formato: NAMESPACE:OUT_IFACE
# ------------------------------------------------------------------------------
NAT_ROUTERS=(
  "$NS_EDGE_1:eth1"
)






# ------------------------------------------------------------------------------
# H - Modelo de VLANs (802.1Q)
# Formato: NAMESPACE:PARENT_IFACE:VLAN_ID:IP_CIDR
# ------------------------------------------------------------------------------
VLANS=(
  # === VLANs en CORE-EDGE (Nodos de Tránsito / Gateways .2) ===
  "$NS_CORE_EDGE:eth1:10:10.10.0.2/24"
  "$NS_CORE_EDGE:eth1:20:10.20.0.2/24"
  "$NS_CORE_EDGE:eth1:30:10.30.0.2/24"
  "$NS_CORE_EDGE:eth1:40:10.40.0.2/24"
  "$NS_CORE_EDGE:eth3:50:10.50.0.2/24"

  # === VLANs en CORE-SVC (Endpoints .1) ===
  "$NS_CORE_SVC:eth1:10:10.10.0.1/24"
  "$NS_CORE_SVC:eth1:20:10.20.0.1/24"
  "$NS_CORE_SVC:eth1:30:10.30.0.1/24"
  "$NS_CORE_SVC:eth1:40:10.40.0.1/24"

  # === VLANs en CORE-ADM (Endpoints .1) ===
  "$NS_CORE_ADM:eth3:50:10.50.0.1/24"
)
