# network-engine/topology/lab.conf
set -Eeuo pipefail

debug() {
  [[ "${DEBUG:-0}" == "1" ]] && echo "$@" >&2
}


TOPOLOGY_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

source "$TOPOLOGY_DIR/namespaces.conf"
source "$TOPOLOGY_DIR/links.conf"
source "$TOPOLOGY_DIR/addressing.conf"

load_conf_dir() {
  local dir="$1"

  [[ -d "$dir" ]] || return 0

  if [[ -f "$dir/base.conf" ]]; then
    debug "[LAB] Cargando $(basename "$dir") -> base.conf"
    source "$dir/base.conf"
  fi

  for f in "$dir"/*.conf; do
    [[ "$(basename "$f")" == "base.conf" ]] && continue
    debug "[LAB] Cargando $(basename "$dir") -> $(basename "$f")"
    source "$f"
  done
}


# Modular loaders
load_conf_dir "$TOPOLOGY_DIR/firewall"
load_conf_dir "$TOPOLOGY_DIR/routing"
load_conf_dir "$TOPOLOGY_DIR/vlans"




# ------------------------------------------------------------------------------
# E - Roles de Network Function
# ------------------------------------------------------------------------------
# Namespaces que actúan como routers L3 (forwarding, NAT, FW)
ROUTERS=(
  "$NS_EDGE_1"
  "$NS_CORE_EDGE"
  "$NS_CORE_MGMT"
  "$NS_CORE_SVC"
  "$NS_CORE_ADM"
  
)

# ------------------------------------------------------------------------------
# F - NAT / EGRESS
# Formato: NAMESPACE:OUT_IFACE
# ------------------------------------------------------------------------------
NAT_ROUTERS=(
  "$NS_EDGE_1:eth1"
)


