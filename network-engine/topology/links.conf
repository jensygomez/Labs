# ------------------------------------------------------------------------------
# network-engine/topology/links.conf
# B - Modelo de Cables
# ------------------------------------------------------------------------------
CABLES=(
  # INTERNET <-> EDGE
  "$NS_EDGE_1:eth1:$NS_INTERNET:eth1"

  # EDGE <-> CORE-EDGE
  "$NS_EDGE_1:eth0:$NS_CORE_EDGE:eth0"

  # CORE-EDGE <-> CORES
  "$NS_CORE_SVC:eth1:$NS_CORE_EDGE:eth1"
  "$NS_CORE_MGMT:eth2:$NS_CORE_EDGE:eth2"
  "$NS_CORE_ADM:eth3:$NS_CORE_EDGE:eth3"
  "$NS_CORE_RH:eth4:$NS_CORE_EDGE:eth4"

  # CORE-RH <-> USER
  "$NS_CORE_RH:eth1:$NS_USER_RH_01:eth0"
)
