IPS=(
  # INTERNET <-> EDGE
  "$NS_EDGE_1:eth1:203.0.113.1/30"
  "$NS_INTERNET:eth1:203.0.113.2/30"

  # EDGE <-> CORE-EDGE (Transit)
  "$NS_EDGE_1:eth0:10.255.255.1/30"
  "$NS_CORE_EDGE:eth0:10.255.255.2/30"

  # CORE-EDGE <-> CORE-SVC
  "$NS_CORE_EDGE:eth1:10.255.255.5/30"
  "$NS_CORE_SVC:eth1:10.255.255.6/30"

  # CORE-EDGE <-> CORE-MGMT
  "$NS_CORE_EDGE:eth2:10.255.255.9/30"
  "$NS_CORE_MGMT:eth2:10.255.255.10/30"

  # CORE-EDGE <-> CORE-ADM
  "$NS_CORE_EDGE:eth3:10.255.255.13/30"
  "$NS_CORE_ADM:eth3:10.255.255.14/30"



)
