# ------------------------------------------------------------------------------
# network-engine/topology/firewall/core-edge.conf
# FIREWALL - CORE-EDGE (Policy Enforcement Point) 
# TOPOLOGÍA: L3 Transit Point-to-Point /30 (SIN VLANs simuladas)
# ------------------------------------------------------------------------------

FW_NAMESPACES+=("$NS_CORE_EDGE")

# ------------------------------------------------------------------------------
# ZONAS FÍSICAS - MAPEADAS A CABLES REALES (links.conf)
# ------------------------------------------------------------------------------
# REALIDAD: eth0=EDGE-1, eth1=CORE-SVC, eth2=CORE-MGMT, eth3=CORE-ADM
FW_ZONES["$NS_CORE_EDGE:eth0"]="transit"     # 10.255.255.2 ↔ EDGE-1 (Internet)
FW_ZONES["$NS_CORE_EDGE:eth1"]="svc"         # 10.255.255.5 ↔ CORE-SVC (Servicios)
FW_ZONES["$NS_CORE_EDGE:eth2"]="mgmt"        # 10.255.255.9 ↔ CORE-MGMT (Bastión)
FW_ZONES["$NS_CORE_EDGE:eth3"]="adm"         # 10.255.255.13 ↔ CORE-ADM (Admin)

# ------------------------------------------------------------------------------
# POLÍTICAS DE CONFIANZA - TRUST MODEL DECLARATIVO
# ------------------------------------------------------------------------------
# 1. CORE-MGMT (Bastión): ACCESO TOTAL (puede TODO, nadie entra)
FW_POLICIES["mgmt->*"]="accept comment \"MGMT puede acceder a todas las zonas\""
FW_POLICIES["*->mgmt"]="drop comment \"Nadie inicia conexiones a MGMT\""

# 2. CORE-EDGE ↔ INTERNET (Stateful Egress)

# 3. CORE-SVC (Servicios): Acceso controlado, NO inicia
FW_POLICIES["mgmt->svc"]="accept comment \"Gestión → Servicios\""
FW_POLICIES["adm->svc"]="accept comment \"ADM → Apps internas\""
FW_POLICIES["svc->*"]="drop comment \"Servicios son pasivos\""

# 4. CORE-ADM (Administración): Limitada a servicios
FW_POLICIES["mgmt->adm"]="accept comment \"Soporte administrativo MGMT→ADM\""
FW_POLICIES["adm->svc"]="accept comment \"ADM → Servicios internos\""

# ------------------------------------------------------------------------------
# RULES LOCALES - Tráfico hacia/desde CORE-EDGE mismo
# ------------------------------------------------------------------------------
FW_RULES["$NS_CORE_EDGE"]="ip protocol icmp accept comment \"ICMP local CORE-EDGE\""
