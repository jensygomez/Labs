# ------------------------------------------------------------------------------
# FIREWALL - CORE-EDGE (Policy Enforcement Point)
# TOPOLOGÍA: L3 Transit Point-to-Point /30 (SIN VLANs simuladas)
# ROL: Enforcement + Routing + NAT (no host, no workload)
# ------------------------------------------------------------------------------

FW_NAMESPACES+=("$NS_CORE_EDGE")

# ------------------------------------------------------------------------------
# ZONAS FÍSICAS - MAPEADAS A CABLES REALES (links.conf)
# ------------------------------------------------------------------------------
# REALIDAD:
#   eth0 = EDGE-1     (Internet / ISP simulado)
#   eth1 = CORE-SVC   (Servicios)
#   eth2 = CORE-MGMT  (Bastión / Operación)
#   eth3 = CORE-ADM   (Administración)
#
FW_ZONES["$NS_CORE_EDGE:eth0"]="transit"   # 10.255.255.2  ↔ EDGE-1
FW_ZONES["$NS_CORE_EDGE:eth1"]="svc"       # 10.255.255.5  ↔ CORE-SVC
FW_ZONES["$NS_CORE_EDGE:eth2"]="mgmt"      # 10.255.255.9  ↔ CORE-MGMT
FW_ZONES["$NS_CORE_EDGE:eth3"]="adm"       # 10.255.255.13 ↔ CORE-ADM
FW_ZONES["$NS_CORE_EDGE:eth4"]="rh"        # 10.255.255.17 ↔ CORE-RH


# ------------------------------------------------------------------------------
# MODELO DE CONFIANZA (DECLARATIVO)
# ------------------------------------------------------------------------------
# Principios:
# - CORE-EDGE no es destino funcional
# - Solo MGMT puede operar / monitorear
# - Tráfico es stateful (conntrack)
# - Todo lo no explícito → DROP

# ------------------------------------------------------------------------------
# 1. CORE-MGMT (Bastión / Operación)
# ------------------------------------------------------------------------------
FW_POLICIES["mgmt->*"]="accept comment \"MGMT puede acceder a todas las zonas\""
FW_POLICIES["*->mgmt"]="drop  comment \"Nadie inicia conexiones hacia MGMT\""

# ------------------------------------------------------------------------------
# 2. SALIDA A INTERNET (EGRESS)
# ------------------------------------------------------------------------------
# MGMT: diagnóstico, updates, observabilidad
FW_POLICIES["mgmt->transit"]="accept comment \"MGMT egress a Internet\""

# ADM: acceso administrativo externo (opcional, pero permitido)
FW_POLICIES["adm->transit"]="accept comment \"ADM egress controlado a Internet\""

# SVC: NO inicia tráfico externo
FW_POLICIES["svc->transit"]="drop comment \"Servicios no tienen egress a Internet\""

# POLITICAS de RH
FW_POLICIES["rh->svc"]="accept comment \"Usuarios RH Acceden a servicios internos\""
FW_POLICIES["rh->transit"]="accept comment \"Usuarios RH egress a Internet\""
FW_POLICIES["rh->mgmt"]="drop comment \"Usuarios RH no acceden a MGMT\""
FW_POLICIES["rh->adm"]="drop comment \"Usuarios RH no acceden a ADM\""
FW_POLICIES["mgmt->rh"]="accept comment \"MGMT gestiona usuarios RH\""

# ------------------------------------------------------------------------------
# 3. CORE-SVC (Servicios)
# ------------------------------------------------------------------------------
# Servicios son pasivos: solo reciben
FW_POLICIES["adm->svc"]="accept comment \"ADM → Servicios internos\""
FW_POLICIES["mgmt->svc"]="accept comment \"MGMT → Servicios (gestión)\""
FW_POLICIES["svc->*"]="drop   comment \"Servicios no inician conexiones\""

# ------------------------------------------------------------------------------
# 4. CORE-ADM (Administración)
# ------------------------------------------------------------------------------
FW_POLICIES["mgmt->adm"]="accept comment \"MGMT → ADM (soporte / gestión)\""

# ------------------------------------------------------------------------------
# DEFAULT IMPLÍCITO
# ------------------------------------------------------------------------------
# Todo tráfico no definido explícitamente queda DROP por diseño
# (fail-closed, zero-trust inter-zonas)

# ------------------------------------------------------------------------------
# RULES LOCALES - Tráfico dirigido AL CORE-EDGE (INPUT)
# ------------------------------------------------------------------------------
# CORE-EDGE solo responde ICMP desde CORE-MGMT (eth2)
FW_RULES["$NS_CORE_EDGE"]="iifname \"eth2\" ip protocol icmp ct state new accept \
  comment \"ICMP local CORE-EDGE solo desde MGMT\""
