# ------------------------------------------------------------------------------
# network-engine/topology/firewall/core-edge.conf
# FIREWALL - CORE-EDGE (Inter-VLAN Policy Engine) - VERSIÓN CORREGIDA
# ------------------------------------------------------------------------------

FW_NAMESPACES+=("$NS_CORE_EDGE")

# ------------------------------------------------------------------------------
# ZONES - CORREGIDAS (nombres alineados con tests/documentación)
# ------------------------------------------------------------------------------
         

# ZONAS entre CORE-EDGE <--> CORE-MGMT
FW_ZONES["$NS_CORE_EDGE:eth2"]="mgmt" 
FW_ZONES["$NS_CORE_EDGE:eth0"]="transit"  


FW_ZONES["$NS_CORE_EDGE:eth1.10"]="mgmt"           # VLAN 10: CORE-MGMT ✓
FW_ZONES["$NS_CORE_EDGE:eth1.30"]="servicios"      # VLAN 30: CORE-SVC ✓
FW_ZONES["$NS_CORE_EDGE:eth1.40"]="adm"            # VLAN 40: CORE-ADM (CORREGIDO) ✓
FW_ZONES["$NS_CORE_EDGE:eth1.60"]="rh"             # VLAN 60: CORE-RH (CORREGIDO) ✓

# ------------------------------------------------------------------------------
# POLICIES - DECLARATIVAS COMPLETAS (alineadas con tests FASE 100)
# ------------------------------------------------------------------------------

# 1. CORE-MGMT (mgmt): Acceso administrativo completo
FW_POLICIES["mgmt->*"]="accept comment \"Gestión puede TODO\""       # MGMT puede acceder a todo
FW_POLICIES["*->mgmt"]="drop comment \"Nadie inicia a gestión\""     # Nadien entra a MGMT

# 2. INTERNET (transit): Egress/ingress stateful
FW_POLICIES["*->transit"]="accept comment \"Salida a internet\""
FW_POLICIES["transit->*"]="accept comment \"Respuestas internet\""

# 3. CORE-SVC (servicios): Acceso controlado
FW_POLICIES["mgmt->servicios"]="accept comment \"Gestión → Servicios\""
FW_POLICIES["rh->servicios"]="accept comment \"RH → Servicios\""
FW_POLICIES["adm->servicios"]="accept comment \"ADM → Apps internas\""  # ← NUEVA
FW_POLICIES["servicios->*"]="drop comment \"Servicios pasivos\""

# 4. CORE-RH (rh): Usuarios limitados
FW_POLICIES["rh->servicios"]="accept comment \"RH → Servicios\""
FW_POLICIES["rh->transit"]="accept comment \"RH → Internet\""           # ← EXPLÍCITA
FW_POLICIES["rh->rh"]="drop comment \"Aislamiento horizontal RH\""

# 5. CORE-ADM (adm): Soporte + servicios internos
FW_POLICIES["mgmt->adm"]="accept comment \"Soporte administrativo\""    # ← CLAVE
FW_POLICIES["adm->servicios"]="accept comment \"ADM → Apps internas\""  # ← CLAVE
FW_POLICIES["adm->*"]="drop comment \"ADM restringida\""

# ------------------------------------------------------------------------------
# RULES LOCALES - CORE-EDGE mismo
# ------------------------------------------------------------------------------
FW_RULES["$NS_CORE_EDGE"]="ip protocol icmp accept comment \"ICMP local\""
