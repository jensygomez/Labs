
# network-engine/topology/firewall/core-edge.conf
# ------------------------------------------------------------------------------
# FIREWALL - CORE-EDGE (Inter-VLAN Policy Engine)
# ------------------------------------------------------------------------------

FW_NAMESPACES+=("$NS_CORE_EDGE")

# ------------------------------------------------------------------------------
# ZONES
# Zonas por VLAN (eth1 = trunk con múltiples VLANs)
# ------------------------------------------------------------------------------
FW_ZONES["$NS_CORE_EDGE:eth0"]="transit"           # Hacia EDGE-1
FW_ZONES["$NS_CORE_EDGE:eth2"]="mgmt-transit" 
FW_ZONES["$NS_CORE_EDGE:eth1.10"]="mgmt"           # VLAN 10: Gestión
FW_ZONES["$NS_CORE_EDGE:eth1.30"]="servicios"      # VLAN 30: Data Center  
FW_ZONES["$NS_CORE_EDGE:eth1.20"]="vlan20"         # VLAN 20
FW_ZONES["$NS_CORE_EDGE:eth1.40"]="vlan40"         # VLAN 40
FW_ZONES["$NS_CORE_EDGE:eth3.50"]="rh"             # VLAN 50: Recursos Humanos



# ------------------------------------------------------------------------------
# POLICIES
# Políticas inter-VLAN (CORE-EDGE decide TODO)
# ------------------------------------------------------------------------------

# 1. VLAN 10 (mgmt): Puede TODO, nadie a ella excepto respuestas
FW_POLICIES["mgmt->*"]="accept"                    # Gestión puede TODO
FW_POLICIES["*->mgmt"]="drop"                      # Nadie a gestión (excepto transit para respuestas)

# 2. Salida a internet
FW_POLICIES["*->transit"]="accept"                 # Todos pueden salir
FW_POLICIES["transit->*"]="accept"                 # Respuestas desde internet

# 3. VLAN 30 (servicios): Solo desde mgmt y rh
FW_POLICIES["mgmt->servicios"]="accept"            # Gestión → Servicios
FW_POLICIES["rh->servicios"]="accept"              # RH → Servicios
FW_POLICIES["servicios->*"]="drop"                 # Servicios no inicia nada

# 4. VLAN 50 (rh): Solo servicios e internet
FW_POLICIES["rh->servicios"]="accept"              # RH → Servicios
FW_POLICIES["rh->rh"]="drop"                       # Aislamiento horizontal

# 5. VLANs 20 y 40 (sin uso por ahora)
FW_POLICIES["vlan20->*"]="drop"
FW_POLICIES["vlan40->*"]="drop"



# ------------------------------------------------------------------------------
# RULES
# Reglas adicionales para CORE-EDGE mismo
# ------------------------------------------------------------------------------
FW_RULES["$NS_CORE_EDGE"]="ip protocol icmp accept"