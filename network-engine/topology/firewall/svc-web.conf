# ------------------------------------------------------------------------------
# network-engine/topology/firewall/svc-web.conf
# FIREWALL - SVC-WEB (Servidor HTTP)
# ------------------------------------------------------------------------------

FW_NAMESPACES+=("$NS_SVC_WEB")

# Servidor web básico - solo acepta HTTP (puerto 80)
FW_RULES["$NS_SVC_WEB"]="\
  ct state established,related accept comment \"Respuestas establecidas\"; \
  tcp dport 80 ct state new accept comment \"Servicio HTTP público\"; \
  ip protocol icmp accept comment \"ICMP para monitoreo\"; \
  drop comment \"Política por defecto - servidor pasivo\""