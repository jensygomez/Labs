# ------------------------------------------------------------------------------
# FIREWALL - SVC-WEB (Servidor HTTP RH)
# ROL: Workload pasivo (NO routing, NO transit)
# MODELO: Zero-trust por origen
# ------------------------------------------------------------------------------

FW_NAMESPACES+=("$NS_SVC_WEB")

# ------------------------------------------------------------------------------
# REGLAS LOCALES (INPUT)
# ------------------------------------------------------------------------------
FW_RULES["$NS_SVC_WEB"]="\
  ct state established,related accept \
    comment \"Respuestas a conexiones establecidas\"; \
  ip saddr ${CORE_RH_NET} tcp dport 8080 ct state new accept \
    comment \"CORE-RH accede al servicio web\"; \
  ip saddr ${USR_RH_1_NET} tcp dport 8080 ct state new accept \
    comment \"Usuarios RH acceden al servicio web\"; \
  ip saddr ${CORE_MGMT_NET} accept \
    comment \"Gestión y monitoreo desde MGMT\"; \
  ip protocol icmp accept \
    comment \"ICMP para health-check\"; \
  drop comment \"DROP por defecto - servidor pasivo\""
