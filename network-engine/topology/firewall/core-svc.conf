# ------------------------------------------------------------------------------
# network-engine/topology/firewall/core-svc.conf
#
# FIREWALL - CORE-SVC (Data Center / Servidores)
# ------------------------------------------------------------------------------

FW_NAMESPACES+=("$NS_CORE_SVC")

# Zonas (CORE-SVC es terminal, no necesita muchas zonas)
FW_ZONES["$NS_CORE_SVC:eth1.10"]="mgmt"       # VLAN 10 - Gestión
FW_ZONES["$NS_CORE_SVC:eth1.30"]="servicios"  # VLAN 30 - Servicios

# Políticas simples (como host, no como router)
FW_POLICIES["mgmt->servicios"]="accept"       # MGMT puede acceder a servicios
FW_POLICIES["*->mgmt"]="drop"                 # Nadie accede a MGMT en CORE-SVC

# Reglas básicas del host
FW_RULES["$NS_CORE_SVC"]="
    tcp dport 22 accept      # SSH
    tcp dport 80 accept      # HTTP
    tcp dport 443 accept     # HTTPS
    tcp dport 445 accept     # SMB (archivos)
    ip protocol icmp accept  # Ping
"

# Permitir forwarding de eth1 (CORE-EDGE) a eth2 (SVC-WEB)
# En core-svc.conf, añade:
FW_FORWARD["$NS_CORE_SVC"]="
    iifname \"eth1*\" oifname \"eth2*\" accept
"