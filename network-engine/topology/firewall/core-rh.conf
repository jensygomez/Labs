# ------------------------------------------------------------------------------
# network-engine/topology/firewall/core-rh.conf
# FIREWALL - CORE-RH (User Segment)
# ------------------------------------------------------------------------------

FW_NAMESPACES+=("$NS_CORE_RH")

# ------------------------------------------------------------------------------
# ZONAS FÍSICAS - MAPEADAS A CABLES REALES (links.conf)
# ------------------------------------------------------------------------------
# REALIDAD:
#   eth0 = CORE-EDGE     (Upstream / Core Network) - 10.255.255.18/30
#   eth1 = USER-RH-01    (Downstream / Usuarios RH) - 192.168.10.1/24
FW_ZONES["$NS_CORE_RH:eth0"]="rh"          # 10.255.255.18 ↔ CORE-EDGE
FW_ZONES["$NS_CORE_RH:eth1"]="rh-users"    # 192.168.10.1 ↔ USER-RH-01 (y futuros usuarios)

# ------------------------------------------------------------------------------
# MODELO DE CONFIANZA (DECLARATIVO)
# ------------------------------------------------------------------------------
# Principios:
# - CORE-RH es gateway de departamento
# - Usuarios RH pueden acceder a servicios y a Internet
# - Solo MGMT puede gestionar CORE-RH
# - Tráfico es stateful (conntrack)

# ------------------------------------------------------------------------------
# 1. USUARIOS RH → CORP SERVICES & INTERNET
# ------------------------------------------------------------------------------
FW_POLICIES["rh-users->rh"]="accept comment \"Usuarios RH → Core (servicios + Internet)\""
# ------------------------------------------------------------------------------
# 2. CORE → USUARIOS RH (Respuestas)
# ------------------------------------------------------------------------------
FW_POLICIES["rh->rh-users"]="accept comment \"Core → Usuarios RH (respuestas)\""
# ------------------------------------------------------------------------------
# 3. CORE-MGMT → CORE-RH (Gestión)
# ------------------------------------------------------------------------------
# A través de CORE-EDGE (eth0 está en zona "rh")
# Se manejará en CORE-EDGE con política "mgmt->rh"
# ------------------------------------------------------------------------------
# 4. RESTRICCIONES
# ------------------------------------------------------------------------------
# Usuarios RH no pueden comunicarse entre sí a través del gateway
# (comunicación directa L2 en la misma subred 192.168.10.0/24)
FW_POLICIES["rh-users->rh-users"]="drop comment \"Usuarios RH no comunican entre sí vía gateway\""

# ------------------------------------------------------------------------------
# RULES LOCALES - Tráfico dirigido AL CORE-RH (INPUT)
# ------------------------------------------------------------------------------
# CORE-RH solo acepta:
# 1. ICMP para diagnóstico desde MGMT
# 2. SSH solo desde CORE-MGMT (a través de CORE-EDGE)
FW_RULES["$NS_CORE_RH"]="iifname \"eth0\" ip saddr 172.16.30.0/24 ip protocol icmp ct state new accept \
  comment \"ICMP desde MGMT (diagnóstico)\""

FW_RULES["$NS_CORE_RH"]+="; iifname \"eth0\" ip saddr 172.16.30.0/24 tcp dport 22 ct state new accept \
  comment \"SSH solo desde MGMT (gestión)\""

FW_RULES["$NS_CORE_RH"]+="; iifname \"eth1\" ip protocol icmp ct state new accept \
  comment \"ICMP local desde usuarios RH (health-check)\""

FW_RULES["$NS_CORE_RH"]+="; ct state established,related accept \
  comment \"Tráfico establecido\""

FW_RULES["$NS_CORE_RH"]+="; drop comment \"Política por defecto\""