# ==============================================================================
# INCIDENT INJECTION PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
# ==============================================================================
# PREREQUISITOS DE PLATAFORMA (ejecutar ANTES de cualquier incident_XXX.yml):
#
#   1. setup_users.yml
#      - Crea grupos, usuarios y reglas sudoers desde group_vars/all/system_users.yml
#      - 'jensyg' ya viene definido ahí con target_groups: ["all"] y password
#        real vía default_user_password.
#      - NO recrear usuarios dentro de un playbook de incidente: ya están sanos.
#
#   2. dns01.yml
#      - Configura /etc/hosts en TODOS los nodos de la infraestructura
#        (hosts: all) desde el inventario dinámico.
#      - NO duplicar esta tarea dentro de un playbook de incidente.
#
#   Un incident_XXX.yml SOLO debe encargarse de:
#     a) Resolución DNS del CONTROL NODE (dns01.yml no lo cubre, corre contra
#        'hosts: all' del inventario, no contra 'localhost').
#     b) Seleccionar el/los nodo(s) objetivo.
#     c) Inyectar el fallo puntual del escenario.
#     d) Decoys/logs realistas para practicar troubleshooting.
# ==============================================================================
#
# INCIDENT ID    : 012
# TITLE          : Un nodo de aplicación va lentísimo (huérfano CPU / zombie)
# TARGET NODE    : Random node from app_nodes (Asymmetric Cluster State)
# TARGET SERVICE : Proceso en espacio de usuario (no un servicio systemd)
# DIFFICULTY     : 5/10 (L1 Junior/Mid)
# ESTIMATED TIME : 2 Hours
#
# ==============================================================================
# RESUMEN DE EJECUCIÓN (LÓGICA DEL INCIDENTE 012):
# 1. RESOLUCIÓN DE NOMBRES (PLAY 1): Actualiza /etc/hosts localmente en el
#    control node para permitir troubleshooting por nombre DNS.
# 2. GUARD DE FLOTA (PLAY 2): Verifica que NINGÚN app_node tenga ya el
#    incidente 012 activo, ANTES de sortear el objetivo (evita doble-inyección
#    cuando el random cae en un nodo distinto en corridas sucesivas).
# 3. SELECCIÓN ALEATORIA (PLAY 3): Elige UN SOLO nodo limpio del grupo
#    'app_nodes' para crear un estado asimétrico en el clúster HA.
# 4. INYECCIÓN DEL FALLO (PLAY 4), en este orden:
#    a) Marker de idempotencia.
#    b) Decoys: script de mantenimiento falso en /opt/scripts + rastro
#       narrativo en .bash_history de jensyg (nohup sin disown).
#    c) Proceso huérfano CPU-heavy, disfrazado vía exec -a, reparentado a
#       PID 1 (setsid).
#    d) Zombie decorativo: fork() en Python sin wait(), hijo queda en
#       estado Z bajo el mismo padre disfrazado.
#    e) Estado consolidado en un único JSON (para la futura recuperación).
# ==============================================================================
#
# TABLA DE TRAZABILIDAD (inyección -> recuperación, regla 6 del skill):
#   32 | Crear marker file             -> Eliminar marker file
#   80 | Crear /opt/scripts            -> Eliminar directorio (validar si preexistía)
#   81 | Deployar script decoy         -> Eliminar /opt/scripts/app_reindex_worker.sh
#   82 | Touch .bash_history           -> NO borrar el archivo (preexistía con datos reales)
#   83 | Agregar 2 líneas al historial -> Eliminar exactamente esas 2 líneas
#   50 | Lanzar huérfano CPU-heavy     -> kill -9 sobre orphan_pid (leído del JSON)
#   55 | Lanzar padre-zombie           -> kill -9 sobre zombie_parent_pid (leído del JSON)
#   70 | Crear state_file JSON         -> Eliminar state_file
# ==============================================================================
---
---
- name: "Incident 012 - Ensure Name Resolution on Control Node"
  hosts: localhost
  connection: local
  become: yes
  gather_facts: false
  tasks:
    - name: "01 | Update /etc/hosts on control node with full inventory"
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED HOSTS (SYSTECH CONTROL NODE)"
        unsafe_writes: yes
        block: |
          {% for host in groups['all'] %}
          {% if hostvars[host].ansible_host is defined %}
          {{ hostvars[host].ansible_host }} {{ host }} {{ host }}.systech.local
          {% endif %}
          {% endfor %}

- name: "Incident 012 | Fleet-Wide Marker Check (Idempotency Guard)"
  hosts: app_nodes
  become: yes
  gather_facts: false
  vars:
    incident_id: "012"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
  tasks:
    - name: "05 | Check marker on every app_node BEFORE selecting a target"
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: incident_012_check

- name: "Incident 012 - Select Random Target (Only if Fleet is Clean)"
  hosts: localhost
  connection: local
  gather_facts: false
  become: no
  vars:
    target_group: "app_nodes"
  tasks:
    - name: "07 | Build list of nodes with an ALREADY ACTIVE incident 012"
      ansible.builtin.set_fact:
        nodes_with_active_incident: >-
          {{ groups[target_group]
             | map('extract', hostvars, 'incident_012_check')
             | map(attribute='stat.exists')
             | zip(groups[target_group])
             | selectattr(0)
             | map(attribute=1)
             | list }}

    - name: "08 | Abort entirely if ANY node in the fleet already has incident 012 active"
      ansible.builtin.fail:
        msg: "Incident 012 already active on: {{ nodes_with_active_incident }}. Run recovery playbook first — do NOT re-inject on a fresh random node."
      when: nodes_with_active_incident | length > 0

    - name: "10 | Pick random target from {{ target_group }} (fleet confirmed clean)"
      ansible.builtin.set_fact:
        target_node: "{{ groups[target_group] | random }}"

    - name: "11 | Display selected target"
      ansible.builtin.debug:
        msg: "Selected target: {{ target_node }}"

    - name: "20 | Add target to dynamic group"
      ansible.builtin.add_host:
        name: "{{ target_node }}"
        groups: incident_012_target

- name: "Incident 012 | Inject Marker, Decoys, Orphan Process and Decorative Zombie"
  hosts: incident_012_target
  become: yes
  vars:
    incident_id: "012"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
    state_file: "/var/run/.incident_{{ incident_id }}_state.json"
    disguise_orphan: "app_reindex_worker"
    disguise_zombie_parent: "legacy_cleanup_monitor"
    decoy_user: "jensyg"
    decoy_group: "sysadmins"
  tasks:
    # ------------------------------------------------------------------
    # MARKER GUARD
    # ------------------------------------------------------------------
    - name: "32 | Create marker file on selected target"
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: touch
        mode: '0644'

    # ------------------------------------------------------------------
    # BLOQUE 3 - DECOYS (script en disco + bash_history)
    # ------------------------------------------------------------------
    - name: "80 | Ensure /opt/scripts directory exists (decoy maintenance scripts location)"
      ansible.builtin.file:
        path: /opt/scripts
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "81 | Deploy decoy maintenance script matching orphan process disguise"
      ansible.builtin.copy:
        dest: /opt/scripts/app_reindex_worker.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          # Legacy reindexing worker - rebuilds search index cache for uploaded evidence files.
          # NOTE: intended to run only via cron/systemd timer, NOT launched interactively.
          while true; do
              find /var/www/html/uploads -newer /tmp/.last_reindex -type f 2>/dev/null
              touch /tmp/.last_reindex
              sleep 5
          done

    - name: "82 | Ensure jensyg's .bash_history file exists (do not overwrite ownership if already present)"
      ansible.builtin.file:
        path: "/home/{{ decoy_user }}/.bash_history"
        state: touch
        owner: "{{ decoy_user }}"
        group: "{{ decoy_group }}"
        mode: '0600'
        modification_time: preserve
        access_time: preserve

    - name: "83 | Inject misleading bash_history entries (manual launch without disown)"
      ansible.builtin.lineinfile:
        path: "/home/{{ decoy_user }}/.bash_history"
        line: "{{ item }}"
        insertafter: EOF
        owner: "{{ decoy_user }}"
        group: "{{ decoy_group }}"
        mode: '0600'
      loop:
        - "cd /opt/scripts"
        - "nohup ./app_reindex_worker.sh &"

    # ------------------------------------------------------------------
    # BLOQUE 4 - Huérfano CPU-heavy disfrazado
    # ------------------------------------------------------------------
    - name: "50 | Launch disguised orphaned CPU-heavy process (setsid + exec -a)"
      ansible.builtin.shell:
        cmd: |
          setsid bash -c 'exec -a {{ disguise_orphan }} bash -c "while true; do :; done"' </dev/null >/dev/null 2>&1 &
        executable: /bin/bash
      changed_when: true

    - name: "51 | Allow orphan process to fully detach and reparent to PID 1"
      ansible.builtin.pause:
        seconds: 2

    - name: "52 | Capture PID of the disguised orphaned process"
      ansible.builtin.command:
        cmd: "pgrep -f {{ disguise_orphan }}"
      register: orphan_pid
      changed_when: false
      failed_when: orphan_pid.stdout == ""

    - name: "53 | Verify orphan's parent PID confirms orphan status (PPID should be 1)"
      ansible.builtin.command:
        cmd: "ps -o ppid= -p {{ orphan_pid.stdout_lines[0] }}"
      register: orphan_ppid
      changed_when: false

    # ------------------------------------------------------------------
    # BLOQUE 5 - Zombie decorativo (python3 fork sin wait())
    # ------------------------------------------------------------------
    - name: "54 | Confirm python3 is available (sanity check)"
      ansible.builtin.command:
        cmd: "python3 --version"
      register: python3_check
      changed_when: false

    - name: "55 | Launch disguised parent that forks a child without reaping it (zombie)"
      ansible.builtin.shell:
        cmd: |
          setsid bash -c 'exec -a {{ disguise_zombie_parent }} python3 -c "
          import os, time
          pid = os.fork()
          if pid == 0:
              os._exit(0)
          else:
              time.sleep(100000)
          "' </dev/null >/dev/null 2>&1 &
        executable: /bin/bash
      changed_when: true

    - name: "56 | Allow zombie fork + detach to settle"
      ansible.builtin.pause:
        seconds: 2

    - name: "57 | Capture PID of the disguised zombie-parent process"
      ansible.builtin.command:
        cmd: "pgrep -f {{ disguise_zombie_parent }}"
      register: zombie_parent_pid
      changed_when: false
      failed_when: zombie_parent_pid.stdout == ""

    - name: "58 | Verify a zombie child exists under this parent"
      ansible.builtin.shell:
        cmd: "ps -o pid,stat,comm --ppid {{ zombie_parent_pid.stdout_lines[0] }}"
      register: zombie_check
      changed_when: false

    # ------------------------------------------------------------------
    # ESTADO CONSOLIDADO - un solo archivo JSON para recovery
    # ------------------------------------------------------------------
    - name: "70 | Persist consolidated incident state (single JSON file)"
      ansible.builtin.copy:
        dest: "{{ state_file }}"
        mode: '0644'
        content: |
          {
            "incident_id": "{{ incident_id }}",
            "target_node": "{{ inventory_hostname }}",
            "orphan_pid": {{ orphan_pid.stdout_lines[0] }},
            "orphan_disguise": "{{ disguise_orphan }}",
            "zombie_parent_pid": {{ zombie_parent_pid.stdout_lines[0] }},
            "zombie_disguise": "{{ disguise_zombie_parent }}"
          }

    - name: "71 | Display Full Injection Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 012 SUCCESSFULLY INJECTED
          =========================================
          Target Node          : {{ inventory_hostname }} (ASYMMETRIC STATE)

          --- Decoys ---
          Script deployed      : /opt/scripts/app_reindex_worker.sh
          History injected     : /home/{{ decoy_user }}/.bash_history (2 lines appended)

          --- Orphaned CPU-heavy process ---
          Disguised as         : {{ disguise_orphan }}
          PID                  : {{ orphan_pid.stdout_lines[0] }}
          PPID                 : {{ orphan_ppid.stdout | trim }} (should be 1)

          --- Decorative zombie ---
          Parent disguised as  : {{ disguise_zombie_parent }}
          Parent PID           : {{ zombie_parent_pid.stdout_lines[0] }}
          Zombie child status  :
          {{ zombie_check.stdout }}

          State file           : {{ state_file }}
          Other app_nodes remain HEALTHY.
          =========================================
