# ==============================================================================
# INCIDENT INJECTION PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
# ==============================================================================
# PREREQUISITOS DE PLATAFORMA (ejecutar ANTES de cualquier incident_XXX.yml):
#
#   1. setup_users.yml
#      - Crea grupos, usuarios y reglas sudoers desde group_vars/all/system_users.yml
#      - 'jensyg' ya viene definido ahí con target_groups: ["all"] y password
#        real vía default_user_password ('LabPassword123!' hasheado con salt fijo)
#      - NO recrear usuarios dentro de un playbook de incidente: ya están sanos.
#
#   2. dns01.yml
#      - Configura /etc/hosts en TODOS los nodos de la infraestructura
#        (hosts: all) desde el inventario dinámico.
#      - NO duplicar esta tarea dentro de un playbook de incidente.
#
#   Un incident_XXX.yml SOLO debe encargarse de:
#     a) Resolución DNS del CONTROL NODE (dns01.yml no lo cubre, corre contra
#        'hosts: all' del inventario, no contra 'localhost').
#     b) Seleccionar el/los nodo(s) objetivo.
#     c) Inyectar el fallo puntual del escenario.
#     d) Decoys/logs realistas para practicar troubleshooting.
#
# ==============================================================================
# RESUMEN DE EJECUCIÓN (LÓGICA DEL INCIDENTE 011):
# 1. RESOLUCIÓN DE NOMBRES EN EL CONTROL NODE (PLAY 1): Actualiza /etc/hosts
#    localmente para permitir troubleshooting por nombre DNS desde el control node.
# 2. SELECCIÓN ALEATORIA (PLAY 2): Elige UN SOLO nodo al azar del grupo 'app_nodes' 
#    para crear un estado asimétrico en el clúster HA.
# 3. INYECCIÓN DEL FALLO (PLAY 3): Bloquea el tráfico NFS (puerto 2049) desde 
#    storage01 hacia el nodo objetivo, creando un mount NFS colgado ("Server not 
#    responding") solo en ese nodo. Inyecta decoys (logs falsos, fstab misleading).
# ==============================================================================
# INCIDENT INJECTION PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
# ==============================================================================
# INCIDENT ID    : 011
# TITLE          : Apps no pueden leer/escribir en el share compartido (NFS Hang)
# TARGET NODE    : Random node from app_nodes (Asymmetric Cluster State)
# TARGET SERVICE : NFS Mount /var/www/html (storage01:/exports/webdata)
# DIFFICULTY     : 5/10 (L1 Junior/Mid)
# ESTIMATED TIME : 2 Hours
# ==============================================================================


# ==============================================================================
# INCIDENT INJECTION PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
# ==============================================================================



---
- name: "Incident 012 - Ensure Name Resolution on Control Node"
  hosts: localhost
  connection: local
  become: yes
  gather_facts: false
  tasks:
    - name: "01 | Update /etc/hosts on control node with full inventory"
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED HOSTS (SYSTECH CONTROL NODE)"
        unsafe_writes: yes
        block: |
          {% for host in groups['all'] %}
          {% if hostvars[host].ansible_host is defined %}
          {{ hostvars[host].ansible_host }} {{ host }} {{ host }}.systech.local
          {% endif %}
          {% endfor %}

- name: "Incident 012 | Fleet-Wide Marker Check (Idempotency Guard)"
  hosts: app_nodes
  become: yes
  gather_facts: false
  vars:
    incident_id: "012"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
  tasks:
    - name: "05 | Check marker on every app_node BEFORE selecting a target"
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: incident_012_check

- name: "Incident 012 - Select Random Target (Only if Fleet is Clean)"
  hosts: localhost
  connection: local
  gather_facts: false
  become: no
  vars:
    target_group: "app_nodes"
  tasks:
    - name: "06 | Build list of nodes with an ALREADY ACTIVE incident 012"
      ansible.builtin.set_fact:
        nodes_with_active_incident: "{{ groups[target_group] | select('in', hostvars.keys()) | select('test_marker_active') | list }}"
      vars:
        # Ansible no tiene un filtro 'test_marker_active' nativo, así que lo
        # resolvemos con un list comprehension estilo jinja en la línea de abajo
      when: false  # placeholder, ver tarea 07 (versión real, sin filtro custom)

    - name: "07 | Build list of nodes with an ALREADY ACTIVE incident 012 (real)"
      ansible.builtin.set_fact:
        nodes_with_active_incident: >-
          {{ groups[target_group]
             | map('extract', hostvars, 'incident_012_check')
             | map(attribute='stat.exists')
             | zip(groups[target_group])
             | selectattr(0)
             | map(attribute=1)
             | list }}

    - name: "08 | Abort entirely if ANY node in the fleet already has incident 012 active"
      ansible.builtin.fail:
        msg: "Incident 012 already active on: {{ nodes_with_active_incident }}. Run recovery playbook first — do NOT re-inject on a fresh random node."
      when: nodes_with_active_incident | length > 0

    - name: "10 | Pick random target from {{ target_group }} (fleet confirmed clean)"
      ansible.builtin.set_fact:
        target_node: "{{ groups[target_group] | random }}"

    - name: "11 | Display selected target"
      ansible.builtin.debug:
        msg: "Selected target: {{ target_node }}"

    - name: "20 | Add target to dynamic group"
      ansible.builtin.add_host:
        name: "{{ target_node }}"
        groups: incident_012_target

- name: "Incident 012 | Create Marker and Install Prerequisite Tooling"
  hosts: incident_012_target
  become: yes
  vars:
    incident_id: "012"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
  tasks:
    - name: "32 | Create marker file on selected target"
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: touch
        mode: '0644'

    - name: "40 | Ensure EPEL repository is present (stress-ng lives there on AlmaLinux 9)"
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: "41 | Install stress-ng (prerequisite tooling, not a vestige of the incident)"
      ansible.builtin.dnf:
        name: stress-ng
        state: present

    - name: "42 | Verify stress-ng binary is available"
      ansible.builtin.command:
        cmd: "stress-ng --version"
      register: stressng_check
      changed_when: false

    - name: "43 | Display stress-ng version"
      ansible.builtin.debug:
        msg: "stress-ng installed: {{ stressng_check.stdout }}"
