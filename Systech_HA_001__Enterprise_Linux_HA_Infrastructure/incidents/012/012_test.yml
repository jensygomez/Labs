---
- name: "TEST Bloque 3 - Decoys (script en disco + bash_history)"
  hosts: app02
  become: yes
  vars:
    decoy_user: "jensyg"
    decoy_group: "sysadmins"
  tasks:
    - name: "80 | Ensure /opt/scripts directory exists (decoy maintenance scripts location)"
      ansible.builtin.file:
        path: /opt/scripts
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "81 | Deploy decoy maintenance script matching orphan process disguise"
      ansible.builtin.copy:
        dest: /opt/scripts/app_reindex_worker.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          # Legacy reindexing worker - rebuilds search index cache for uploaded evidence files.
          # NOTE: intended to run only via cron/systemd timer, NOT launched interactively.
          while true; do
              find /var/www/html/uploads -newer /tmp/.last_reindex -type f 2>/dev/null
              touch /tmp/.last_reindex
              sleep 5
          done

    - name: "82 | Ensure jensyg's .bash_history file exists (do not overwrite ownership if already present)"
      ansible.builtin.file:
        path: "/home/{{ decoy_user }}/.bash_history"
        state: touch
        owner: "{{ decoy_user }}"
        group: "{{ decoy_group }}"
        mode: '0600'
        modification_time: preserve
        access_time: preserve

    - name: "83 | Inject misleading bash_history entries (manual launch without disown)"
      ansible.builtin.lineinfile:
        path: "/home/{{ decoy_user }}/.bash_history"
        line: "{{ item }}"
        insertafter: EOF
        owner: "{{ decoy_user }}"
        group: "{{ decoy_group }}"
        mode: '0600'
      loop:
        - "cd /opt/scripts"
        - "nohup ./app_reindex_worker.sh &"

    - name: "84 | Display Decoy Injection Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 012 - DECOYS INJECTED
          =========================================
          Script deployed  : /opt/scripts/app_reindex_worker.sh
          History injected : /home/{{ decoy_user }}/.bash_history (3 lines appended)
          =========================================
