---
- name: "TEST Bloque 5 - Zombie decorativo (validación de mecánica, target fijo)"
  hosts: app02
  become: yes
  vars:
    disguise_parent: "legacy_cleanup_monitor"
    zombie_parent_pid_file: "/var/run/.incident_012_zombie_parent_pid"
  tasks:
    - name: "59 | Confirm python3 is available (sanity check, should always be true)"
      ansible.builtin.command:
        cmd: "python3 --version"
      register: python3_check
      changed_when: false

    - name: "60 | Launch disguised parent that forks a child without reaping it (zombie)"
      ansible.builtin.shell:
        cmd: |
          setsid bash -c 'exec -a {{ disguise_parent }} python3 -c "
          import os, time
          pid = os.fork()
          if pid == 0:
              os._exit(0)
          else:
              time.sleep(100000)
          "' </dev/null >/dev/null 2>&1 &
        executable: /bin/bash
      changed_when: true

    - name: "61 | Allow fork + detach to settle"
      ansible.builtin.pause:
        seconds: 2

    - name: "62 | Capture PID of the disguised zombie-parent process"
      ansible.builtin.command:
        cmd: "pgrep -f {{ disguise_parent }}"
      register: zombie_parent_pid
      changed_when: false
      failed_when: zombie_parent_pid.stdout == ""

    - name: "63 | Persist zombie-parent PID for recovery traceability"
      ansible.builtin.copy:
        dest: "{{ zombie_parent_pid_file }}"
        content: "{{ zombie_parent_pid.stdout_lines[0] }}"
        mode: '0644'

    - name: "64 | Verify a zombie child exists under this parent"
      ansible.builtin.shell:
        cmd: "ps -o pid,stat,comm --ppid {{ zombie_parent_pid.stdout_lines[0] }}"
      register: zombie_check
      changed_when: false

    - name: "65 | Display Zombie Injection Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 012 - DECORATIVE ZOMBIE INJECTED
          =========================================
          Disguised parent : {{ disguise_parent }}
          Parent PID       : {{ zombie_parent_pid.stdout_lines[0] }}
          Child status      :
          {{ zombie_check.stdout }}
          =========================================
