# ==============================================================================
# INCIDENT INJECTION PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
# ==============================================================================
# INCIDENT ID   : 003
# TITLE         : NFS export permissions corruption (Web uploads fail)
# TARGET NODE   : storage01 (10.10.10.50)
# TARGET FS     : /exports/webdata (XFS on LVM /dev/vg_storage/lv_webdata)
# DIFFICULTY    : 6/10 (L1 Junior)
# ESTIMATED TIME: 3 Hours
# ==============================================================================
#
# 📖 SCENARIO CONTEXT:
# Simulates a scenario where an administrator accidentally changed permissions
# on the NFS export directory, causing all app_nodes to lose write access.
# The L1 will see:
# - NFS mounts successfully on app_nodes
# - httpd cannot write to /var/www/html/uploads (Permission denied)
# - findmnt shows the mount is active and rw
# - dmesg shows network errors (decoy)
#
# 💥 WHAT THIS PLAYBOOK BREAKS:
# 1. Ensures the filesystem is mounted normally with correct permissions (0777)
# 2. Changes permissions to 0000 (no read/write/execute for anyone)
# 3. Generates realistic network error logs in dmesg (decoy)
# 4. Restarts NFS so clients see the permission denied errors
#
# 🕵️ EXPECTED L1 DIAGNOSIS PATH:
# - ssh app01, try: touch /var/www/html/uploads/test.txt → Permission denied
# - Check dmesg on app01 → shows network errors (decoy, misleading)
# - Check storage01: ls -ld /exports/webdata → shows drwx------ (0000)
# - Fix: chmod 0777 /exports/webdata on storage01
# ==============================================================================

---
- name: "Incident 003 | Inject NFS Export Permissions Corruption on storage01"
  hosts: storage01
  become: yes
  vars:
    incident_id: "003"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
    target_export: "/exports/webdata"

  tasks:
    # -------------------------------------------------------------------------
    # PHASE 1: PRE-FLIGHT & IDEMPOTENCY CHECK
    # -------------------------------------------------------------------------
    - name: "01 | Check if incident was already injected (Marker Guard)"
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: check_inject

    - name: "02 | Abort if incident is already active"
      ansible.builtin.debug:
        msg: "Incident {{ incident_id }} is already injected. Skipping."
      when: check_inject.stat.exists

    - name: "03 | Create marker file to prevent double-injection"
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: touch
        mode: '0644'
      when: not check_inject.stat.exists

    # -------------------------------------------------------------------------
    # PHASE 2: ENSURE FILESYSTEM IS MOUNTED WITH CORRECT PERMISSIONS
    # -------------------------------------------------------------------------
    - name: "04 | Stop NFS server to release filesystem locks"
      ansible.builtin.systemd:
        name: nfs-server
        state: stopped
      when: not check_inject.stat.exists

    - name: "05 | Ensure /exports/webdata has correct permissions (0777)"
      ansible.builtin.file:
        path: "{{ target_export }}"
        state: directory
        mode: '0777'
        owner: root
        group: root
      when: not check_inject.stat.exists

    - name: "06 | Verify filesystem is writable"
      ansible.builtin.command:
        cmd: "touch {{ target_export }}/.healthcheck"
      changed_when: false
      when: not check_inject.stat.exists

    - name: "07 | Remove healthcheck file"
      ansible.builtin.file:
        path: "{{ target_export }}/.healthcheck"
        state: absent
      when: not check_inject.stat.exists

    # -------------------------------------------------------------------------
    # PHASE 3: CORRUPT PERMISSIONS (Simulating admin error)
    # -------------------------------------------------------------------------
    - name: "08 | Change permissions to 0000 (no access for anyone)"
      ansible.builtin.file:
        path: "{{ target_export }}"
        mode: '0000'
      when: not check_inject.stat.exists

    - name: "09 | Generate realistic network error logs in dmesg (DECOY)"
      ansible.builtin.shell: |
        # Simulate network connectivity issues (misleading the L1)
        echo "nfs: server 10.10.10.50 not responding, still trying" > /dev/kmsg || true
        echo "nfs: RPC call returned error -13 (EACCES)" > /dev/kmsg || true
        echo "nfs: permission denied while accessing /exports/webdata" > /dev/kmsg || true
        echo "nfs: failed to complete operation, error -13" > /dev/kmsg || true
      ignore_errors: yes
      when: not check_inject.stat.exists

    - name: "10 | Wait for kernel to process logs"
      ansible.builtin.pause:
        seconds: 2
      when: not check_inject.stat.exists

    # -------------------------------------------------------------------------
    # PHASE 4: FINALIZE & EXPOSE TO CLIENTS
    # -------------------------------------------------------------------------
    - name: "11 | Start NFS server (it will export the directory with 0000 permissions)"
      ansible.builtin.systemd:
        name: nfs-server
        state: started
      when: not check_inject.stat.exists

    - name: "12 | Verify injection status"
      ansible.builtin.command:
        cmd: "stat -c '%a' {{ target_export }}"
      register: final_perms
      changed_when: false
      when: not check_inject.stat.exists

    - name: "13 | Display Injection Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 003 SUCCESSFULLY INJECTED
          =========================================
          Target: {{ target_export }}
          Current Permissions: {{ final_perms.stdout | default('Failed') }}
          
          The NFS export now has NO permissions (0000).
          App nodes can mount but cannot write.
          L1 must check 'ls -ld /exports/webdata' on storage01
          and fix permissions with 'chmod 0777'.
          =========================================
      when: not check_inject.stat.exists
