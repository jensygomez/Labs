# ==============================================================================
# INCIDENT RECOVERY PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
# ==============================================================================
# INCIDENT ID   : 003
# TITLE         : NFS export permissions corruption (Web uploads fail)
# TARGET NODE   : storage01 (10.10.10.50)
# TARGET FS     : /exports/webdata
# ==============================================================================
#
# 🔧 WHAT THIS PLAYBOOK FIXES:
# 1. Restores correct permissions (0777) on /exports/webdata
# 2. Removes the marker file to allow re-injection if needed
# 3. Restarts NFS server to apply changes
# 4. Verifies the fix by testing write access
# ==============================================================================

---
- name: "Incident 003 | Recover NFS Export Permissions on storage01"
  hosts: storage01
  become: yes
  vars:
    incident_id: "003"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
    target_export: "/exports/webdata"

  tasks:
    # -------------------------------------------------------------------------
    # PHASE 1: PRE-FLIGHT CHECK
    # -------------------------------------------------------------------------
    - name: "01 | Check if incident marker exists"
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: check_marker

    - name: "02 | Skip if incident was never injected"
      ansible.builtin.debug:
        msg: "Incident {{ incident_id }} marker not found. Nothing to recover."
      when: not check_marker.stat.exists

    - name: "03 | End play if no incident to recover"
      meta: end_play
      when: not check_marker.stat.exists

    # -------------------------------------------------------------------------
    # PHASE 2: RESTORE CORRECT PERMISSIONS
    # -------------------------------------------------------------------------
    - name: "04 | Stop NFS server to apply permission changes"
      ansible.builtin.systemd:
        name: nfs-server
        state: stopped

    - name: "05 | Restore correct permissions (0777) on NFS export"
      ansible.builtin.file:
        path: "{{ target_export }}"
        state: directory
        mode: '0777'
        owner: root
        group: root

    - name: "06 | Start NFS server"
      ansible.builtin.systemd:
        name: nfs-server
        state: started

    # -------------------------------------------------------------------------
    # PHASE 3: VERIFICATION
    # -------------------------------------------------------------------------
    - name: "07 | Verify permissions are correct"
      ansible.builtin.command:
        cmd: "stat -c '%a' {{ target_export }}"
      register: recovered_perms
      changed_when: false

    - name: "08 | Test write access"
      ansible.builtin.command:
        cmd: "touch {{ target_export }}/.recovery_test"
      changed_when: false

    - name: "09 | Clean up test file"
      ansible.builtin.file:
        path: "{{ target_export }}/.recovery_test"
        state: absent

    # -------------------------------------------------------------------------
    # PHASE 4: CLEANUP MARKER
    # -------------------------------------------------------------------------
    - name: "10 | Remove incident marker file"
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: absent

    - name: "11 | Display Recovery Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 003 SUCCESSFULLY RECOVERED
          =========================================
          Target: {{ target_export }}
          Restored Permissions: {{ recovered_perms.stdout }}
          
          The NFS export is now writable again.
          App nodes can write to /var/www/html/uploads.
          =========================================
