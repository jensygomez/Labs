# ==============================================================================
# INC-003 | Web file writes corrupt intermittently (NFS lock issue)
# Family: systech-ha-001 | Category: Storage & Filesystems | Level: L2
# ==============================================================================
# RECOVERY:
#   Reverts the NFS client mount for /var/www/html to local_lock=none (the
#   NFSv4 default), restoring cross-node lock visibility via the NFS server.
#   Symmetrically removes the synthetic symptom log line and, where recorded
#   in the state file, the decoy log line — driven entirely by the state
#   file's own "decoy_applied" field rather than re-deriving it from vars,
#   so recovery is self-describing per BUG-009.
# ==============================================================================

---
- name: "INC-003 | Web file writes corrupt intermittently (NFS lock issue) - Incident Recovery"
  hosts: "{{ target_group | default('app_nodes') }}"
  become: yes
  gather_facts: yes

  vars:
    incident_id: "INC-003"
    target_service: "httpd"
    target_group: "app_nodes"
    web_mount_point: "/var/www/html"

    state_file: "/tmp/.systech_{{ incident_id }}_state.json"

    # Must match the exact lines written by 003_incidente.yml so removal is exact
    symptom_log_path: "/var/log/httpd/error_log"
    symptom_log_line: "[systech-sim] [error] PHP Warning: flock(): NFS lock request timed out for /var/www/html/uploads/upload_handler.php, stale lock suspected"

    decoy_log_path: "/var/log/messages"
    decoy_log_line: "2026-09-12T00:00:00Z app02 kernel: EXT4-fs warning (device dm-0): ext4_dx_add_entry:2361: Directory index full!"

  tasks:
    # ========================================================================
    # 1. PRE-FLIGHT & IDEMPOTENCY CHECK (Single State File — BUG-009)
    # ========================================================================
    - name: "Check if state file exists on this node"
      ansible.builtin.stat:
        path: "{{ state_file }}"
      register: state_file_check

    - name: "Skip host entirely if it was never the target of this incident"
      meta: end_host
      when: not state_file_check.stat.exists

    - name: "Read incident state to confirm root cause and decoy status"
      ansible.builtin.slurp:
        src: "{{ state_file }}"
      register: state_file_raw

    - name: "Parse state file content"
      ansible.builtin.set_fact:
        current_state: "{{ state_file_raw.content | b64decode | from_json }}"

    - name: "Skip host if incident is already recovered"
      meta: end_host
      when: current_state.status == "recovered"

    - name: "Debug current state before recovery"
      ansible.builtin.debug:
        msg: "Recovering {{ current_state.incident_id }} on {{ inventory_hostname }}. Recorded root cause: {{ current_state.root_cause }}"

    # ========================================================================
    # 2. CORE RECOVERY (THE FIX)
    # ========================================================================
    - name: "CORE RECOVERY: Restore NFS client-side lock coordination"
      block:
        - name: "Check current NFS mount options for the web mount"
          ansible.builtin.command:
            cmd: "findmnt -no OPTIONS {{ web_mount_point }}"
          register: current_mount_opts
          changed_when: false

        - name: "Determine if local_lock override is still active"
          ansible.builtin.set_fact:
            lock_break_active: "{{ 'local_lock=all' in current_mount_opts.stdout }}"

        - name: "Get current NFS mount source"
          ansible.builtin.command:
            cmd: "findmnt -no SOURCE {{ web_mount_point }}"
          register: mount_source
          changed_when: false
          when: lock_break_active | bool

        - name: "Stop target service to allow safe unmount"
          ansible.builtin.systemd:
            name: "{{ target_service }}"
            state: stopped
          when: lock_break_active | bool

        - name: "Unmount the web mount to remove bad NFS options"
          ansible.builtin.command:
            cmd: "umount {{ web_mount_point }}"
          register: umount_result
          when: lock_break_active | bool

        - name: "Remount with default options (reads from /etc/fstab)"
          ansible.builtin.command:
            cmd: "mount {{ web_mount_point }}"
          register: recovery_result
          changed_when: true
          when: lock_break_active | bool

        - name: "Start target service after remount"
          ansible.builtin.systemd:
            name: "{{ target_service }}"
            state: started
          when: lock_break_active | bool

        - name: "Remove synthetic PHP lock-timeout symptom from httpd error log"
          ansible.builtin.lineinfile:
            path: "{{ symptom_log_path }}"
            line: "{{ symptom_log_line }}"
            state: absent

        - name: "Remove decoy log entry if it was applied to this node"
          ansible.builtin.lineinfile:
            path: "{{ decoy_log_path }}"
            line: "{{ decoy_log_line }}"
            state: absent
          when: current_state.decoy_applied | default(false) | bool

      rescue:
        - name: "ALERT: Recovery failed"
          ansible.builtin.fail:
            msg: "INC-003 recovery failed on {{ inventory_hostname }}. Manual intervention required."

    # ========================================================================
    # 3. LIGHTWEIGHT SELF-TEST (VALIDATION)
    # ========================================================================
    - name: "SELF-TEST: Verify service is active"
      ansible.builtin.systemd:
        name: "{{ target_service }}"
      register: service_check
      failed_when: service_check.status.ActiveState != "active"

    - name: "SELF-TEST: Verify local_lock override is gone"
      ansible.builtin.command:
        cmd: "findmnt -no OPTIONS {{ web_mount_point }}"
      register: post_recovery_opts
      changed_when: false
      failed_when: "'local_lock=all' in post_recovery_opts.stdout"

    - name: "SELF-TEST: Verify the web mount is writable"
      block:
        - name: "Write a self-test file"
          ansible.builtin.command:
            cmd: "touch {{ web_mount_point }}/.self_test_write"
          changed_when: true
          register: write_test

        - name: "Clean up self-test file"
          ansible.builtin.file:
            path: "{{ web_mount_point }}/.self_test_write"
            state: absent
          when: write_test.changed
      ignore_errors: no

    # ========================================================================
    # 4. STATE UPDATE (Single JSON state file — BUG-009)
    # ========================================================================
    - name: "Update state file to 'recovered'"
      ansible.builtin.copy:
        content: |
          {
            "incident_id": "{{ incident_id }}",
            "timestamp": "{{ current_state.timestamp }}",
            "recovery_timestamp": "{{ ansible_date_time.iso8601 }}",
            "target_node": "{{ inventory_hostname }}",
            "target_service": "{{ target_service }}",
            "root_cause": "{{ current_state.root_cause }}",
            "decoy_applied": {{ 'true' if (current_state.decoy_applied | default(false) | bool) else 'false' }},
            "status": "recovered"
          }
        dest: "{{ state_file }}"
        mode: '0600'

  # ==========================================================================
  # HANDLERS
  # ==========================================================================
  handlers:
    - name: "Restart target service"
      ansible.builtin.systemd:
        name: "{{ target_service }}"
        state: restarted
        daemon_reload: yes
