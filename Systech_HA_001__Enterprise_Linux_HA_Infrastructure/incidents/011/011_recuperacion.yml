==============================================================================
INCIDENT RECOVERY PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
==============================================================================
INCIDENT ID   : 011
PURPOSE       : Recover stale NFS mount on target node, clean decoys, 
                and restore infrastructure to pre-incident state.
NOTE          : Runs against all app_nodes (checks marker), plus localhost.
==============================================================================
-----------------------------------------------------------------------------
PLAY 1: RECOVER REMOTE APP NODES
-----------------------------------------------------------------------------
- name: "Recovery 011 | Recover Stale NFS Mount on Remote Nodes"
  hosts: app_nodes
  become: yes
  vars:
    incident_id: "011"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
    nfs_mount: "/var/www/html"
  tasks:
    - name: "01 | Check if incident marker exists on this node"
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: check_inject

    - name: "02 | Force lazy unmount of stale NFS mount"
      ansible.builtin.command:
        cmd: "umount -l {{ nfs_mount }}"
      register: umount_result
      failed_when: umount_result.rc != 0 and 'not mounted' not in umount_result.stderr
      when: check_inject.stat.exists

    - name: "03 | Remount all filesystems from /etc/fstab"
      ansible.builtin.command:
        cmd: "mount -a"
      register: mount_result
      when: check_inject.stat.exists

    - name: "04 | Verify NFS mount is active and responsive"
      ansible.builtin.command:
        cmd: "df -h {{ nfs_mount }}"
      register: df_check
      changed_when: false
      when: check_inject.stat.exists

    - name: "05 | Remove misleading comment from /etc/fstab"
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^# WARNING: NFS mount unstable"
        state: absent
      when: check_inject.stat.exists

    - name: "06 | Remove fake NFS timeout logs from /var/log/messages"
      ansible.builtin.lineinfile:
        path: /var/log/messages
        regexp: "NFS: server 10.10.10.50 not responding"
        state: absent
      when: check_inject.stat.exists

    - name: "07 | Remove misleading Apache error log entry"
      ansible.builtin.lineinfile:
        path: /var/log/httpd/error_log
        regexp: "AH00035: access to /index.php denied"
        state: absent
      when: check_inject.stat.exists

    - name: "08 | Remove the incident marker file"
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: absent
      when: check_inject.stat.exists

    - name: "09 | Display Recovery Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 011 SUCCESSFULLY RECOVERED
          =========================================
          Target Node : {{ inventory_hostname }}
          Mount Point : {{ nfs_mount }}
          df -h Output: {{ df_check.stdout_lines }}
          
          CLEANUP COMPLETED ON REMOTE NODE:
          - Stale NFS mount force-unmounted and remounted.
          - Fake /etc/fstab warning removed.
          - Fake /var/log/messages NFS errors removed.
          - Misleading Apache error_log entry removed.
          - Marker file cleaned up.
          =========================================
      when: check_inject.stat.exists

-----------------------------------------------------------------------------
PLAY 2: CLEAN LOCAL CONTROL NODE (/etc/hosts)
-----------------------------------------------------------------------------
- name: "Recovery 011 | Clean Local Control Node (/etc/hosts)"
  hosts: localhost
  connection: local
  become: yes
  gather_facts: false
  tasks:
    - name: "10 | Remove control-node /etc/hosts block"
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED HOSTS (SYSTECH CONTROL NODE)"
        state: absent
        unsafe_writes: yes

    - name: "11 | Display Control Node Cleanup Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          CONTROL NODE /etc/hosts CLEANUP COMPLETE
          =========================================
          Removed block marked:
          'ANSIBLE MANAGED HOSTS (SYSTECH CONTROL NODE)'
          =========================================
