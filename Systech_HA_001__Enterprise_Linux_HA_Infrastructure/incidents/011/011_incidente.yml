# ==============================================================================
# INCIDENT INJECTION PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
# ==============================================================================
# PREREQUISITOS DE PLATAFORMA (ejecutar ANTES de cualquier incident_XXX.yml):
#
#   1. setup_users.yml
#      - Crea grupos, usuarios y reglas sudoers desde group_vars/all/system_users.yml
#      - 'jensyg' ya viene definido ahí con target_groups: ["all"] y password
#        real vía default_user_password ('LabPassword123!' hasheado con salt fijo)
#      - NO recrear usuarios dentro de un playbook de incidente: ya están sanos.
#
#   2. dns01.yml
#      - Configura /etc/hosts en TODOS los nodos de la infraestructura
#        (hosts: all) desde el inventario dinámico.
#      - NO duplicar esta tarea dentro de un playbook de incidente.
#
#   Un incident_XXX.yml SOLO debe encargarse de:
#     a) Resolución DNS del CONTROL NODE (dns01.yml no lo cubre, corre contra
#        'hosts: all' del inventario, no contra 'localhost').
#     b) Seleccionar el/los nodo(s) objetivo.
#     c) Inyectar el fallo puntual del escenario.
#     d) Decoys/logs realistas para practicar troubleshooting.
#
# ==============================================================================
# RESUMEN DE EJECUCIÓN (LÓGICA DEL INCIDENTE 011):
# 1. RESOLUCIÓN DE NOMBRES EN EL CONTROL NODE (PLAY 1): Actualiza /etc/hosts
#    localmente para permitir troubleshooting por nombre DNS desde el control node.
# 2. SELECCIÓN ALEATORIA (PLAY 2): Elige UN SOLO nodo al azar del grupo 'app_nodes' 
#    para crear un estado asimétrico en el clúster HA.
# 3. INYECCIÓN DEL FALLO (PLAY 3): Simula un corte abrupto de NFS bloqueando el 
#    puerto 2049 temporalmente para forzar un "Stale file handle" en el mount 
#    /var/www/html, e inyecta decoys (logs falsos de timeout, permisos erróneos 
#    en Apache y comentarios misleading en fstab).
# ==============================================================================
# INCIDENT ID    : 011
# TITLE          : Apps no pueden leer/escribir en el share compartido (stale NFS)
# TARGET NODE    : Random node from app_nodes (Asymmetric Cluster State)
# TARGET SERVICE : NFS Mount /var/www/html (storage01:/exports/webdata)
# DIFFICULTY     : 5/10 (L1 Junior/Mid)
# ESTIMATED TIME : 2 Hours
# ==============================================================================
---

-----------------------------------------------------------------------------
PLAY 1: POPULATE /ETC/HOSTS ON THE CONTROL NODE ITSELF
(La resolución DNS de la infraestructura remota ya la gestiona dns01.yml)
-----------------------------------------------------------------------------
- name: "Incident 011 - Ensure Name Resolution on Control Node"
  hosts: localhost
  connection: local
  become: yes
  gather_facts: false
  tasks:
    - name: "01 | Update /etc/hosts on control node with full inventory"
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED HOSTS (SYSTECH CONTROL NODE)"
        unsafe_writes: yes
        block: |
          {% for host in groups['all'] %}
          {% if hostvars[host].ansible_host is defined %}
          {{ hostvars[host].ansible_host }} {{ host }} {{ host }}.systech.local
          {% endif %}
          {% endfor %}

-----------------------------------------------------------------------------
PLAY 2: SELECT RANDOM NODE AND INJECT THE ASYMMETRIC FAULT
-----------------------------------------------------------------------------
- name: "Incident 011 - Select Random Target and Inject Fault"
  hosts: localhost
  connection: local
  gather_facts: false
  become: no
  vars:
    target_group: "app_nodes"
  tasks:
    - name: "10 | Pick random target from {{ target_group }}"
      ansible.builtin.set_fact:
        target_node: "{{ groups[target_group] | random }}"

    - name: "20 | Add target to dynamic group"
      ansible.builtin.add_host:
        name: "{{ target_node }}"
        groups: incident_011_target

- name: "Incident 011 | Inject Stale NFS Handle on Single Node"
  hosts: incident_011_target
  become: yes
  vars:
    incident_id: "011"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
    storage_ip: "10.10.10.50"
    nfs_mount: "/var/www/html"
  tasks:
    --- Marker Guard ---
    - name: "30 | Check if incident was already injected"
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: check_inject

    - name: "31 | Abort if already active"
      ansible.builtin.debug:
        msg: "Incident {{ incident_id }} already injected on {{ inventory_hostname }}."
      when: check_inject.stat.exists

    - name: "32 | Create marker file"
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: touch
        mode: '0644'
      when: not check_inject.stat.exists

    --- INJECT THE FAULT (Simulate Storage Blip & Stale Handle) ---
    - name: "40 | Block outgoing NFS traffic to storage01 temporarily"
      ansible.posix.firewalld:
        rich_rule: 'rule family="ipv4" destination address="{{ storage_ip }}" port port="2049" protocol="tcp" drop'
        permanent: false
        immediate: true
        state: enabled
      when: not check_inject.stat.exists

    - name: "41 | Trigger background I/O to force kernel stale state"
      ansible.builtin.shell:
        cmd: "cat {{ nfs_mount }}/index.php > /dev/null 2>&1 &"
      changed_when: false
      when: not check_inject.stat.exists

    - name: "42 | Wait for kernel to mark mount as stale"
      ansible.builtin.wait_for:
        timeout: 8
      when: not check_inject.stat.exists

    - name: "43 | Remove firewall rule (mount remains stale until remounted)"
      ansible.posix.firewalld:
        rich_rule: 'rule family="ipv4" destination address="{{ storage_ip }}" port port="2049" protocol="tcp" drop'
        permanent: false
        immediate: true
        state: disabled
      when: not check_inject.stat.exists

    --- DECOYS & LOGS (Enhanced Realism) ---
    - name: "50 | Ensure /var/log/messages exists before writing"
      ansible.builtin.file:
        path: /var/log/messages
        state: touch
        mode: '0644'
      when: not check_inject.stat.exists

    - name: "51 | Inject fake NFS timeout logs in /var/log/messages"
      ansible.builtin.lineinfile:
        path: /var/log/messages
        line: "{{ item }}"
        create: yes
        mode: '0644'
      loop:
        - "{{ '%b %d %H:%M:%S' | strftime }} {{ inventory_hostname }} kernel: NFS: server {{ storage_ip }} not responding, still trying"
        - "{{ '%b %d %H:%M:%S' | strftime }} {{ inventory_hostname }} kernel: nfs: server {{ storage_ip }} not responding, timed out"
      when: not check_inject.stat.exists

    - name: "52 | Ensure Apache error log exists before writing"
      ansible.builtin.file:
        path: /var/log/httpd/error_log
        state: touch
        mode: '0644'
      when: not check_inject.stat.exists

    - name: "53 | Inject misleading 'Permission denied' in Apache logs"
      ansible.builtin.lineinfile:
        path: /var/log/httpd/error_log
        line: "[Mon Sep 06 02:15:00.123456 2026] [core:error] [pid 1234] (13)Permission denied: [client 10.10.10.11:54321] AH00035: access to /index.php denied"
        create: yes
        mode: '0644'
      when: not check_inject.stat.exists

    - name: "54 | Add misleading comment to /etc/fstab"
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "# WARNING: NFS mount unstable - use local storage instead"
        state: present
      when: not check_inject.stat.exists

    --- FINALIZE ---
    - name: "60 | Display Injection Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 011 SUCCESSFULLY INJECTED
          =========================================
          Target Node  : {{ inventory_hostname }} (ASYMMETRIC STATE)
          Storage IP   : {{ storage_ip }}
          Mount Point  : {{ nfs_mount }}
          
          The NFS mount is now STALE on this node.
          Other app_nodes remain HEALTHY.
          L1 must check all nodes to detect the asymmetry.
          
          DECOYS INJECTED:
          - Fake NFS timeout logs in /var/log/messages
          - Misleading 'Permission denied' in Apache error_log
          - Fake warning comment in /etc/fstab
          =========================================
      when: not check_inject.stat.exists
