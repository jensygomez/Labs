---
- name: "011 Remediation - Diagnose and clean NFS hang on app nodes"
  hosts: app_nodes
  become: true
  gather_facts: false
  vars:
    nfs_mount: "/var/www/html"
  tasks:
    - name: "1.1 | Check if NFS mount responds"
      ansible.builtin.command: "timeout 2 stat -t {{ nfs_mount }}"
      register: nfs_check
      failed_when: false
      changed_when: false

    - name: "1.2 | Define affected nodes fact"
      ansible.builtin.set_fact:
        nfs_affected: "{{ nfs_check.rc != 0 }}"

    - name: "1.3 | Kill stuck mount.nfs processes (only if affected)"
      ansible.builtin.command: "pkill -9 -f mount.nfs"
      register: pkill_result
      failed_when: false
      changed_when: pkill_result.rc == 0
      when: nfs_affected

    - name: "1.4 | Lazy unmount NFS (only if affected)"
      ansible.builtin.command: "umount -f -l {{ nfs_mount }}"
      register: umount_result
      failed_when: false
      changed_when: umount_result.rc == 0
      when: nfs_affected

    - name: "1.5 | Remove incident marker file (only if affected)"
      ansible.builtin.file:
        path: "/var/run/.incident_011_marker"
        state: absent
      when: nfs_affected

- name: "011 Remediation - Remove NFS network block on storage01"
  hosts: storage01
  become: true
  gather_facts: false
  vars:
    nfs_port: 2049
  tasks:
    - name: "2.1 | Remove firewalld rich rule blocking NFS (via shell)"
      ansible.builtin.shell:
        cmd: |
          firewall-cmd --remove-rich-rule='rule family="ipv4" source address="{{ hostvars[item].ansible_host }}" port port="{{ nfs_port }}" protocol="tcp" drop' --zone=public
          firewall-cmd --runtime-to-permanent
        executable: /bin/bash
      loop: "{{ groups['app_nodes'] }}"
      register: firewall_result
      changed_when: "'success' in firewall_result.stdout or firewall_result.rc == 0"
      failed_when: firewall_result.rc not in [0, 112]  # 112 = rule not found (no error)
      when: hostvars[item].nfs_affected | default(false)

    - name: "2.2 | Flush conntrack sessions for NFS (port 2049)"
      ansible.builtin.command: "conntrack -D -p tcp --dport {{ nfs_port }}"
      register: conntrack_result
      failed_when: false
      changed_when: conntrack_result.rc == 0

- name: "011 Remediation - Remount NFS and restart services on affected nodes"
  hosts: app_nodes
  become: true
  gather_facts: false
  vars:
    nfs_mount: "/var/www/html"
    nfs_src: "10.10.10.50:/exports/webdata"
    nfs_fstype: "nfs"
    nfs_opts: "defaults,soft,timeo=10,retrans=3"
  tasks:
    - name: "3.1 | Ensure mount point exists"
      ansible.builtin.file:
        path: "{{ nfs_mount }}"
        state: directory
        mode: '0755'

    - name: "3.2 | Mount NFS with proper options (only if affected)"
      ansible.posix.mount:
        path: "{{ nfs_mount }}"
        src: "{{ nfs_src }}"
        fstype: "{{ nfs_fstype }}"
        opts: "{{ nfs_opts }}"
        state: mounted
      when: nfs_affected | default(false)
      register: mount_res
      until: mount_res is success
      retries: 3
      delay: 5

    - name: "3.3 | Restart Apache (httpd) to refresh file descriptors"
      ansible.builtin.systemd:
        name: httpd
        state: restarted
      when: nfs_affected | default(false)

    - name: "3.4 | Display remediation summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 011 REMEDIATION COMPLETED
          =========================================
          Node: {{ inventory_hostname }}
          Affected: {{ nfs_affected | default(false) }}
          Mount: {{ nfs_mount }}
          Status: mounted
          =========================================
      when: nfs_affected | default(false)
