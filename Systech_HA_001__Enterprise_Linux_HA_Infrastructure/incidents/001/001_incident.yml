# ==============================================================================
# INC-001 | User cannot authenticate (correct password) - Incident Injection
# Family: systech-ha-001
# ==============================================================================

---
# ------------------------------------------------------------------------------
# PLAY 1: CONTROL NODE DNS RESOLUTION (Required per BUG-010B)
# ------------------------------------------------------------------------------
- name: "INC-001 | Play 1 - Ensure Control Node can resolve app_nodes hostnames"
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: "Add app_nodes hostnames to Control Node /etc/hosts"
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED HOSTS (SYSTECH CONTROL NODE)"
        create: yes
        unsafe_writes: yes
        block: |
          {% for host in groups['app_nodes'] %}
          {{ hostvars[host].ansible_host }} {{ host }}
          {% endfor %}

# ------------------------------------------------------------------------------
# PLAY 2: CORE INCIDENT INJECTION (app_nodes)
# ------------------------------------------------------------------------------
- name: "INC-001 | User cannot authenticate (correct password) - Incident Injection"
  hosts: "{{ target_group | default('app_nodes') }}"
  become: yes
  gather_facts: yes

  vars:
    incident_id: "INC-001"
    target_service: "sshd"
    target_group: "app_nodes"
    affected_user: "jensyg"

    # Single State File Pattern (per BUG-009)
    state_file: "/tmp/.systech_{{ incident_id }}_state.json"

    inject_decoy: true
    use_random_node: true

  tasks:
    # ========================================================================
    # 1. PRE-FLIGHT & STATE CHECK (Single State File Pattern)
    # ========================================================================
    - name: "Check if state file already exists"
      ansible.builtin.stat:
        path: "{{ state_file }}"
      register: state_file_check

    - name: "Read existing state file content (if present)"
      ansible.builtin.slurp:
        src: "{{ state_file }}"
      register: state_content_raw
      when: state_file_check.stat.exists

    - name: "Parse current status from state file (if present)"
      ansible.builtin.set_fact:
        current_status: "{{ (state_content_raw.content | b64decode | from_json).status }}"
      when: state_file_check.stat.exists

    - name: "Skip play if incident is already active (status = injected)"
      meta: end_play
      when:
        - state_file_check.stat.exists
        - current_status == "injected"

    - name: "Verify target service is currently healthy before breaking it"
      ansible.builtin.systemd:
        name: "{{ target_service }}"
      register: service_status
      failed_when: service_status.status.ActiveState != "active"

    # ========================================================================
    # 2. DYNAMIC NODE SELECTION (Safe Randomness)
    # ========================================================================
    - name: "Select random target node (Safe evaluation)"
      ansible.builtin.set_fact:
        selected_target: "{{ groups[target_group] | random }}"
      run_once: true
      when: use_random_node | bool

    - name: "Restrict play to selected node if random mode is active"
      meta: end_host
      when:
        - use_random_node | bool
        - inventory_hostname != selected_target

    # ========================================================================
    # 3. DECOY INJECTION (Same node as real target, per BUG-010A design)
    # ========================================================================
    - name: "DECOY: Misleading noise on the affected node"
      block:
        - name: "Decoy action 1: Fake security audit log with unrelated denials"
          ansible.builtin.copy:
            content: |
              [WARN] pam_unix(sudo:auth): authentication failure; logname= uid=0 euid=0 tty=/dev/pts/1 ruser= rhost=  user=root
              [WARN] Multiple failed su attempts detected for user root
              [INFO] fail2ban: Ban 10.10.10.99 (unrelated scan activity)
              [WARN] Repeated invalid password attempts for user backup_svc
            dest: /var/log/security_audit.log
            owner: root
            group: root
            mode: '0640'
            force: no

        - name: "Decoy action 2: Misleading password-expiry warning in .bashrc"
          ansible.builtin.lineinfile:
            path: "/home/{{ affected_user }}/.bashrc"
            line: 'echo "WARNING: Your password will expire soon. Contact IT."'
            insertafter: EOF
            create: no
      when: inject_decoy | bool

    # ========================================================================
    # 4. CORE INCIDENT INJECTION
    # ========================================================================
    # STRICT RULE (ARCHITECTURE_CARD §6): jensyg is a pre-existing user.
    # NEVER use ansible.builtin.user here. Use command + chage/passwd only,
    # exactly as established in 010_incidente.yml.
    - name: "CORE INJECTION: Set past account expiration date for jensyg"
      block:
        - name: "Apply breaking change: expire jensyg's account (asymmetric, this node only)"
          ansible.builtin.command:
            cmd: "chage -E 2020-01-01 {{ affected_user }}"
          register: injection_result
          changed_when: true

        - name: "Restart service to apply the break"
          ansible.builtin.systemd:
            name: "{{ target_service }}"
            state: restarted
            daemon_reload: yes
          when: injection_result.changed
      rescue:
        - name: "ROLLBACK: Revert changes if injection fails unexpectedly"
          ansible.builtin.command:
            cmd: "chage -E -1 {{ affected_user }}"
          ignore_errors: yes

    # ========================================================================
    # 5. STATE RECORDING (Single State File — write or overwrite to "injected")
    # ========================================================================
    - name: "Record incident state as 'injected'"
      ansible.builtin.copy:
        content: |
          {
            "incident_id": "{{ incident_id }}",
            "timestamp": "{{ ansible_date_time.iso8601 }}",
            "target_node": "{{ inventory_hostname }}",
            "target_service": "{{ target_service }}",
            "affected_user": "{{ affected_user }}",
            "root_cause": "Account expiration date set to the past for jensyg on a single asymmetric node, while other cluster nodes remain unaffected.",
            "decoys_injected": {{ inject_decoy | bool | lower }},
            "status": "injected"
          }
        dest: "{{ state_file }}"
        mode: '0600'

  handlers:
    - name: "Restart target service"
      ansible.builtin.systemd:
        name: "{{ target_service }}"
        state: restarted
        daemon_reload: yes
