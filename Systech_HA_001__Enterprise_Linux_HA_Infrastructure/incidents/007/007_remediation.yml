---
# Playbook para Ansible idenpotente para los 3 app
#
- name: "OPS-1073 - Normalizar permisos SSH de devuser en app_nodes"
  hosts: app_nodes
  gather_facts: false
  become: true
  
  tasks:
    - name: "01 - Probar conectividad con los nodos"
      ansible.builtin.ping:

    - name: "02 - Asegurar permisos del directorio home de devvuser"
      ansible.builtin.file:
        path: /home/devuser
        state: directory
        owner: devuser
        group: devuser
        mode: '0755'

    - name: "03 - Asegurar permisos del directorio .ssh"
      ansible.builtin.file:
        path: /home/devuser/.ssh
        state: directory
        owner: devuser
        group: devuser
        mode: '0700'

    - name: "04 - Asegurar permisos del archivo authorized_keys"
      ansible.builtin.file:
        path: /home/devuser/.ssh/authorized_keys
        state: file
        owner: devuser
        group: devuser
        mode: '0600'





