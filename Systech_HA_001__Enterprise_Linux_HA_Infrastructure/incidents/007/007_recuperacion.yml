---
- name: "Recovery - Remove devuser from all app nodes"
  hosts: app_nodes
  become: true
  gather_facts: false
  vars:
    target_user: "devuser"
    marker_file: "/var/run/.incident_007_marker"

  tasks:
    - name: "Remove {{ target_user }} user (with home directory)"
      ansible.builtin.user:
        name: "{{ target_user }}"
        state: absent
        remove: true

    - name: "Ensure marker is removed"
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: absent

    - name: "Restore SELinux context on /etc/hosts (if changed)"
      ansible.builtin.command:
        cmd: "restorecon -v /etc/hosts"
      when: ansible_selinux is defined and ansible_selinux.status == "enabled"
      failed_when: false

    - name: "Debug completion"
      ansible.builtin.debug:
        msg: "Recovery completed on {{ inventory_hostname }}. devuser removed."
