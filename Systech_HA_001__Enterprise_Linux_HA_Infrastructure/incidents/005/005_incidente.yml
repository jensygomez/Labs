---
- name: "System Deployment Validation - Incident 005 Injection"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "10 - Select target node"
      ansible.builtin.set_fact:
        target_node: "{{ groups['client_nodes'] | default(['client01']) | first }}"

    - name: "20 - Add target to dynamic group"
      ansible.builtin.add_host:
        name: "{{ target_node }}"
        groups: incident_005_target

- name: "Inject Fault and Red Herrings"
  hosts: incident_005_target
  become: true
  gather_facts: true
  tasks:
    - name: "30 - Check if already injected"
      ansible.builtin.stat:
        path: /var/run/.incident_005_marker
      register: check_inject

    # =========================================================
    # TRAMPA 1 (Falso Positivo): Logs de Firewall UFW bloqueando DNS
    # =========================================================
    - name: "40 - Inject Fake UFW Block Logs (Red Herring)"
      ansible.builtin.shell: |
        logger "UFW BLOCK IN= OUT=eth0 SRC=10.10.10.11 DST=10.10.10.20 LEN=60 PROTO=UDP SPT=41234 DPT=53"
        logger "UFW BLOCK IN= OUT=eth0 SRC=10.10.10.11 DST=8.8.8.8 LEN=60 PROTO=UDP SPT=55123 DPT=53"
      when: not check_inject.stat.exists

    # =========================================================
    # TRAMPA 2 (Falso Positivo): Logs de NetworkManager caído
    # =========================================================
    - name: "50 - Inject Fake NetworkManager Error Logs (Red Herring)"
      ansible.builtin.shell: |
        logger -p daemon.err "NetworkManager[890]: <error> [1690000000.123] manager: (eth0): failed to activate connection: Connection 'Wired connection 1' is not available"
        logger -p daemon.err "NetworkManager[890]: <warn>  [1690000005.456] dns-mgr-dummy: failed to update resolv.conf"
      when: not check_inject.stat.exists

    # =========================================================
    # CAUSA RAÍZ REAL: Netplan Override (Ubuntu 24.04 LXC)
    # =========================================================
    - name: "60 - Create malicious Netplan override config"
      ansible.builtin.copy:
        dest: /etc/netplan/99-dns-override.yaml
        content: |
          # Applied by junior admin to "fix" slow network
          network:
            version: 2
            ethernets:
              eth0:
                addresses:
                  - 10.10.10.11/24
                routes:
                  - to: default
                    via: 10.10.10.1
                nameservers:
                  addresses:
                    - 10.10.10.99
                    - 192.168.100.1
        mode: '0600'
      when: not check_inject.stat.exists

    - name: "70 - Apply Netplan to overwrite resolv.conf"
      ansible.builtin.command:
        cmd: netplan apply
      when: not check_inject.stat.exists
      changed_when: true


    # =========================================================
    # TRAMPA 3 (Corregida): Forzar resolv.conf roto directamente
    # =========================================================
    - name: "80 - Overwrite resolv.conf with malicious DNS"
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          # Generated by NetworkManager - DO NOT EDIT MANUALLY
          nameserver 10.10.10.99
          nameserver 192.168.100.1
        mode: '0644'
      when: not check_inject.stat.exists

    - name: "90 - Create injection marker"
      ansible.builtin.file:
        path: /var/run/.incident_005_marker
        state: touch
        mode: '0400'
      when: not check_inject.stat.exists

    - name: "100 - Debug completion"
      ansible.builtin.debug:
        msg: "Incident 005 injected successfully on {{ inventory_hostname }}."
