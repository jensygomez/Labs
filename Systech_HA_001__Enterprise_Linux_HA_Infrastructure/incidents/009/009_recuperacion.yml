---
# ==============================================================================
# INCIDENT RECOVERY PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
# ==============================================================================
# INCIDENT ID   : 009
# PURPOSE       : Revert the Read-Only filesystem injection on storage01.
# ==============================================================================

- name: "Recovery 009 | Restore Read-Only Filesystem on storage01"
  hosts: storage01
  become: yes
  vars:
    incident_id: "009"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
    target_lv_path: "/dev/vg_storage/lv_webdata"
    target_mount: "/exports/webdata"

  tasks:
    - name: "01 | Check if incident marker exists (Was it actually injected?)"
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: check_inject

    - name: "02 | Abort if incident was not injected"
      ansible.builtin.debug:
        msg: "Incident {{ incident_id }} marker not found. Nothing to recover."
      when: not check_inject.stat.exists

    - name: "03 | Stop NFS server to release filesystem"
      ansible.builtin.systemd:
        name: nfs-server
        state: stopped
      when: check_inject.stat.exists

    - name: "04 | Remount filesystem in Read-Write mode"
      ansible.builtin.command:
        cmd: "mount -o remount,rw {{ target_mount }}"
      when: check_inject.stat.exists

    - name: "05 | Verify filesystem is now writable"
      ansible.builtin.command:
        cmd: "touch {{ target_mount }}/.recovery_test"
      changed_when: false
      when: check_inject.stat.exists

    - name: "06 | Remove recovery test file"
      ansible.builtin.file:
        path: "{{ target_mount }}/.recovery_test"
        state: absent
      when: check_inject.stat.exists

    - name: "07 | Restart NFS server"
      ansible.builtin.systemd:
        name: nfs-server
        state: started
      when: check_inject.stat.exists

    - name: "08 | Remove the incident marker file"
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: absent
      when: check_inject.stat.exists

    - name: "09 | Display Recovery Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 009 SUCCESSFULLY RECOVERED
          =========================================
          - Filesystem remounted in Read-Write mode.
          - NFS service restarted.
          - Marker file cleaned up.
          =========================================
      when: check_inject.stat.exists
