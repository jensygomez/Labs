# ==============================================================================
# ROL: WEB APP SETUP — Clúster de Aplicaciones (app01, app02, app03)
# ==============================================================================
#
# IPS: 10.10.10.31, 10.10.10.32, 10.10.10.33
# HOSTNAMES: app01, app02, app03
# SISTEMA OPERATIVO: AlmaLinux 9 (LXC Privilegiado en Proxmox)
#
# PROPÓSITO:
#   Este rol configura los nodos de aplicación del clúster, que ejecutan el
#   servidor web Apache con PHP y sirven la aplicación dinámica que se conecta
#   a PostgreSQL en db01 (10.10.10.40). El código de la aplicación y los
#   archivos de evidencia de los clientes de tráfico se almacenan en un
#   volumen NFS compartido desde storage01 (10.10.10.50).
#
# CARACTERÍSTICAS PRINCIPALES:
#   - Instalación de Apache (httpd), PHP, módulo php-pgsql y cliente NFS.
#   - Montaje NFSv4 de /exports/webdata (storage01) en /var/www/html.
#   - Despliegue de la aplicación PHP (feed_app.php.j2) en /var/www/html/index.php.
#   - Configuración de SELinux:
#       * httpd_use_nfs → permite a Apache acceder a archivos NFS.
#       * httpd_can_network_connect_db → permite conexiones a PostgreSQL.
#   - Firewalld con el servicio http (puerto 80) abierto.
#   - Servicio httpd habilitado e iniciado.
#
# DEPENDENCIAS:
#   - El nodo storage01 (10.10.10.50) debe tener el volumen /exports/webdata
#     creado y exportado correctamente.
#   - El nodo db01 (10.10.10.40) debe tener PostgreSQL corriendo y accesible.
#   - Los app_nodes deben tener conectividad TCP a db01 en el puerto 5432.
#   - Los load balancers (lb01/lb02) deben estar configurados para enviar
#     tráfico a los app_nodes a través de la VIP (10.10.10.30).
#
# VARIABLES UTILIZADAS:
#   - storage_host_ip: IP de storage01 (10.10.10.50) para el montaje NFS.
#   - db_host_ip, db_name, db_user, db_pass: Variables para la conexión
#     a PostgreSQL (definidas en group_vars o vault).
#
# NOTAS DE SEGURIDAD:
#   - Los booleanos de SELinux se habilitan persistentemente.
#   - El firewall permite solo el tráfico HTTP (puerto 80).
#   - La aplicación PHP tiene acceso a la base de datos con credenciales
#     definidas en vault.
#
# RECUPERACIÓN ANTE FALLOS:
#   - Si un nodo de aplicación falla, HAProxy (lb01/lb02) envía el tráfico
#     a los nodos restantes.
#   - Si el clúster completo de app_nodes falla, la aplicación web no estará
#     disponible hasta que al menos un nodo se recupere.
#   - Los archivos de evidencia (uploads) persisten en storage01, por lo que
#     no se pierden al reiniciar un app_node.
#   - Se recomienda implementar health checks en HAProxy para detectar nodos
#     caídos y retirarlos automáticamente del pool de backend.
#
# ==============================================================================

---
# ==============================================================================
# WEB APP SETUP — AlmaLinux 9 (LXC Privilegiado)
# ==============================================================================

# ======================================================================
# BLOQUE 1: INSTALACIÓN DE PAQUETES DE APLICACIÓN Y NFS
# ======================================================================

- name: "Instalar Apache, PHP, cliente NFS y Firewalld"
  ansible.builtin.dnf:
    name:
      - httpd
      - php
      - php-pgsql
      - nfs-utils
      - firewalld
    state: present
    update_cache: true

# ======================================================================
# BLOQUE 2: MONTAJE DEL RECURSO COMPARTIDO NFS
# ======================================================================

- name: "Forzar desmontaje perezoso (lazy) de /var/www/html para evitar Stale Mounts"
  ansible.builtin.shell:
    cmd: "umount -l /var/www/html || true"
  changed_when: false

- name: "Asegurar existencia del directorio local /var/www/html"
  ansible.builtin.file:
    path: /var/www/html
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "Montar recurso NFS compartido desde storage01 en /var/www/html"
  ansible.posix.mount:
    path: /var/www/html
    src: "{{ storage_host_ip }}:/exports/webdata"
    fstype: nfs
    opts: "rw,sync,noatime,nodev,nosuid,vers=4"
    state: mounted

# ======================================================================
# BLOQUE 3: DESPLIEGUE DE LA APLICACIÓN PHP
# ======================================================================

- name: "Desplegar aplicación PHP dinámica (index.php)"
  ansible.builtin.template:
    src: feed_app.php.j2
    dest: /var/www/html/index.php
    owner: apache
    group: apache
    mode: '0644'

# ======================================================================
# BLOQUE 4: SEGURIDAD — SELinux (Protegido para LXC)
# ======================================================================

- name: "Habilitar booleanos de SELinux para Apache (Si SELinux está activo)"
  ansible.posix.seboolean:
    name: "{{ item }}"
    state: true
    persistent: true
  loop:
    - httpd_use_nfs
    - httpd_can_network_connect_db
  when:
    - ansible_selinux is defined
    - ansible_selinux.status == "enabled"

# ======================================================================
# BLOQUE 5: CONFIGURACIÓN DE FIREWALL (Firewalld)
# ======================================================================

- name: "Asegurar servicio Firewalld activo"
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: "Permitir tráfico HTTP (Puerto 80) en Firewalld"
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true

# ======================================================================
# BLOQUE 6: SERVICIOS Y REINICIO
# ======================================================================

- name: "Iniciar y habilitar el servicio Web (httpd)"
  ansible.builtin.systemd:
    name: httpd
    state: started
    enabled: true
