---
- name: "Restart NFS"
  ansible.builtin.systemd:
    name: nfs-server
    state: restarted

- name: "Restart PostgreSQL"
  ansible.builtin.systemd:
    name: postgresql
    state: restarted

- name: "Restart Apache"
  ansible.builtin.systemd:
    name: httpd
    state: restarted

- name: "Reiniciar SSHD"
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: "Reiniciar HAProxy"
  ansible.builtin.systemd:
    name: haproxy
    state: restarted

- name: "Reiniciar Keepalived"
  ansible.builtin.systemd:
    name: keepalived
    state: restarted

- name: "Reiniciar Apache"
  ansible.builtin.systemd:
    name: apache2
    state: restarted
    
- name: Reiniciar dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted
