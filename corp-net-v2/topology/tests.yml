# topology/tests.yml
# Suite de pruebas para infraestructura CorpNet-v2

# ==========================================
# TESTS DE CONECTIVIDAD BÁSICA
# ==========================================
tests:
  - name: "🔌 Ping Gateway desde RRHH-1"
    from: "USR-RH-1"
    cmd: "ping -c 3 10.0.2.1"
  
  - name: "🔌 Ping Gateway desde IT-ADMIN"
    from: "USR-IT-ADMIN"
    cmd: "ping -c 3 10.0.3.1"

# ==========================================
# TESTS DE ENRUTAMIENTO INTER-VLAN
# ==========================================
  - name: "🌐 RRHH-1 → SVC-WEB (Cross-VLAN)"
    from: "USR-RH-1"
    cmd: "ping -c 3 10.0.1.10"
  
  - name: "🌐 IT-ADMIN → SVC-DNS (Cross-VLAN)"
    from: "USR-IT-ADMIN"
    cmd: "ping -c 3 10.0.1.53"

# ==========================================
# TESTS DE SITIOS WEB - VIRTUAL HOSTS
# ==========================================
  
  # Portal RRHH (HTTP - Puerto 80)
  - name: "🌐 Portal RRHH: HTTP (puerto 80)"
    from: "USR-RH-1"
    cmd: "curl -v -m 5 http://10.0.1.10 2>&1 | grep -E '(Connected|HTTP)'"
    requires: [curl]
  
  - name: "📄 Portal RRHH: Contenido HTML"
    from: "USR-RH-1"
    cmd: "curl -s http://10.0.1.10 | grep -i 'recursos humanos' && echo '✅ Contenido correcto'"
    requires: [curl]
  
  # Monitor TI (HTTPS - Puerto 443)
  - name: "🔒 Monitor TI: HTTPS (puerto 443)"
    from: "USR-IT-ADMIN"
    cmd: "curl -k -v -m 5 https://10.0.1.10 2>&1 | grep -E '(Connected|HTTP|SSL)'"
    requires: [curl]
  
  - name: "📄 Monitor TI: Contenido HTML"
    from: "USR-IT-ADMIN"
    cmd: "curl -k -s https://10.0.1.10 | grep -i 'monitor' && echo '✅ Contenido correcto'"
    requires: [curl]
  
  # Intranet (Puerto 8080)
  - name: "🏢 Intranet: HTTP (puerto 8080)"
    from: "USR-IT-ADMIN"
    cmd: "curl -v -m 5 http://10.0.1.10:8080 2>&1 | grep -E '(Connected|HTTP)'"
    requires: [curl]
  
  - name: "📄 Intranet: Contenido HTML"
    from: "USR-RH-1"
    cmd: "curl -s http://10.0.1.10:8080 | grep -i 'intranet' && echo '✅ Contenido correcto'"
    requires: [curl]
  
  # Wiki Técnica (Puerto 8081)
  - name: "📚 Wiki: HTTP (puerto 8081)"
    from: "USR-IT-ADMIN"
    cmd: "curl -v -m 5 http://10.0.1.10:8081 2>&1 | grep -E '(Connected|HTTP)'"
    requires: [curl]
  
  - name: "📄 Wiki: Contenido HTML"
    from: "USR-IT-ADMIN"
    cmd: "curl -s http://10.0.1.10:8081 | grep -i 'wiki' && echo '✅ Contenido correcto'"
    requires: [curl]

# ==========================================
# TESTS DE FIREWALL (Microsegmentación)
# ==========================================
  
  - name: "🛡️ RRHH-1 bloqueado al puerto 443"
    from: "USR-RH-1"
    cmd: "timeout 3 curl -k https://10.0.1.10 || echo '✅ BLOQUEADO CORRECTAMENTE'"
    requires: [curl]
  
  - name: "🛡️ RRHH-2 puede acceder puerto 443"
    from: "USR-RH-2"
    cmd: "curl -k -I -m 5 https://10.0.1.10 2>&1 | head -1"
    requires: [curl]

  - name: "🛡️ IT-ADMIN tiene acceso total"
    from: "USR-IT-ADMIN"
    cmd: "nc -zv -w 2 10.0.1.10 80 443 8080 2>&1 | grep succeeded | wc -l"
    requires: [netcat]

# ==========================================
# TESTS DE DNS (FUTURO)
# ==========================================
  
  - name: "🔍 Consulta DNS a SVC-DNS"
    from: "USR-RH-1"
    cmd: "nslookup corp.local 10.0.1.53 || echo '⚠️ DNS no configurado aún'"
    requires: [bind-utils]
  
  - name: "🔍 Resolución: rh.corp.local"
    from: "USR-RH-1"
    cmd: "nslookup rh.corp.local 10.0.1.53 || echo '⚠️ DNS no configurado'"
    requires: [bind-utils]
  
  - name: "🔍 Resolución: wiki.corp.local"
    from: "USR-IT-ADMIN"
    cmd: "nslookup wiki.corp.local 10.0.1.53 || echo '⚠️ DNS no configurado'"
    requires: [bind-utils]

# ==========================================
# TESTS DE DIAGNÓSTICO
# ==========================================
  
  - name: "🔧 Ver rutas en RRHH-1"
    from: "USR-RH-1"
    cmd: "ip route show"
  
  - name: "🔧 Ver reglas iptables en SVC-WEB"
    from: "SVC-WEB"
    cmd: "iptables -L INPUT -n -v --line-numbers | head -15"
  
  - name: "🔧 Verificar procesos Nginx"
    from: "SVC-WEB"
    cmd: "ps aux | grep nginx | grep -v grep || echo '❌ Nginx no está corriendo'"
  
  - name: "🔧 Listar sitios configurados"
    from: "SVC-WEB"
    cmd: "ls -1 /etc/nginx/conf.d/ | sed 's/.conf$//' || echo 'Sin configuraciones'"

# ==========================================
# TESTS DE PERFORMANCE (OPCIONAL)
# ==========================================
  
  - name: "⚡ Benchmark: 10 requests HTTP"
    from: "USR-RH-1"
    cmd: "time for i in {1..10}; do curl -s http://10.0.1.10 > /dev/null; done"
    requires: [curl]
  
  - name: "⚡ Latencia promedio (ping)"
    from: "USR-IT-ADMIN"
    cmd: "ping -c 10 10.0.1.10 | tail -1 | awk '{print $4}'"