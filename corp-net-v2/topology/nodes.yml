networks:
  - name: br-mgmt
    subnet: 10.0.1.0/24
  - name: br-rh
    subnet: 10.0.2.0/24  # Podemos segmentar más las IPs luego
  - name: br-it
    subnet: 10.0.3.0/24  # IT ahora tiene su propio segmento limpio

nodes:
  - name: CORE-GW
    role: router
    # El router ahora tiene una "pata" en cada switch
    interfaces: [br-mgmt, br-rh, br-it]

  - name: SVC-WEB
    role: server
    bridge: br-mgmt
    ip: 10.0.1.10

  - name: USR-RH-1
    role: client
    bridge: br-rh
    ip: 10.0.2.10

  - name: USR-IT-ADMIN
    role: client
    bridge: br-it
    ip: 10.0.3.100