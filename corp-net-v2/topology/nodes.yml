# ======================================================
# CONFIGURACIÓN GLOBAL DE LA INFRAESTRUCTURA
# ======================================================
infra:
  organization: "CorpNet Global"
  domain: "corpnet.local"
  version: "2.0"

# ======================================================
# DEFINICIÓN DE SEGMENTOS (SWITCHES VIRTUALES)
# ======================================================
# Aquí es donde definimos los "cables" donde se enchufan los nodos.
networks:
  - name: br-mgmt     # Zona de Servidores / Core Services
    subnet: 10.0.1.0/24
  - name: br-rh       # Segmento Acceso RRHH
    subnet: 10.0.2.0/24
  - name: br-it       # Segmento Acceso TI
    subnet: 10.0.3.0/24
  - name: br-backbone # PREPARADO: Para inter-conexión de Routers futuros
    subnet: 172.16.0.0/24

# ======================================================
# NODOS DE RED (ROUTERS, SERVIDORES Y CLIENTES)
# ======================================================
nodes:
  # --- CAPA CORE (Enrutamiento Central) ---
  - name: CORE-GW
    role: router
    # El router central tiene una pata en cada switch departamental
    subnets:
      - { name: br-mgmt, network: 10.0.1.0/24 }
      - { name: br-rh,   network: 10.0.2.0/24 }
      - { name: br-it,   network: 10.0.3.0/24 }
    # PREPARADO: para jerarquías superiores
    parent: "" 
    uplink: "external"

  # --- CAPA DE SERVICIOS (Zona MGMT) ---
  - name: SVC-WEB
    role: server
    subnet: br-mgmt
    ip: 10.0.1.10
    services: [80, 443]
    allow_inbound:
      - { from: "10.0.2.10", port: 80 }   # Acceso desde RH-1
      - { from: "10.0.2.20", port: 443 }  # Acceso desde RH-2
      - { from: "10.0.3.0/24", port: "any" } # TI tiene acceso total

  - name: SVC-DNS
    role: server
    subnet: br-mgmt
    ip: 10.0.1.53
    services: [53] # PREPARADO: El próximo paso es configurar este servicio

  # --- CAPA DE ACCESO: DEPARTAMENTO RRHH ---
  - name: USR-RH-1
    role: client
    subnet: br-rh
    ip: 10.0.2.10

  - name: USR-RH-2
    role: client
    subnet: br-rh
    ip: 10.0.2.20

  # --- CAPA DE ACCESO: DEPARTAMENTO TI ---
  - name: USR-IT-ADMIN
    role: client
    subnet: br-it
    ip: 10.0.3.100

