nodes:
  - name: CORE-GW
    role: router
    subnets:
      - name: MGMT
        network: 10.0.1.0/24
      - name: USERS
        network: 10.0.2.0/24
  
  - name: SVC-WEB
    role: server
    subnet: MGMT
    ip: 10.0.1.10
    services: [80, 443]

  - name: USR-RH-1
    role: client
    subnet: USERS
    ip: 10.0.2.10

  - name: USR-RH-2
    role: client
    subnet: USERS
    ip: 10.0.2.20