# topology/websites.yml
# Configuración de sitios web multi-tenant para CorpNet-v2
# Cada sitio se despliega automáticamente en SVC-WEB con su propio Virtual Host

sites:
  # ============================================
  # SITIO 1: Portal de RRHH
  # ============================================
  - name: "portal-rh"
    server_name: "rh.corp.local"
    port: 80
    ssl: false
    root: "/var/www/html/rh"
    template: "rh/index.html"
    description: "Portal interno para recursos humanos"
    
  # ============================================
  # SITIO 2: Monitor de Seguridad (TI)
  # ============================================
  - name: "monitor-ti"
    server_name: "monitor.corp.local"
    port: 443
    ssl: true
    root: "/var/www/html/monitor"
    template: "monitor/index.html"
    description: "Dashboard de monitoreo para equipo TI"
    
  # ============================================
  # SITIO 3: Intranet Corporativa
  # ============================================
  - name: "intranet"
    server_name: "intranet.corp.local"
    port: 8080
    ssl: false
    root: "/var/www/html/intranet"
    template: "intranet/index.html"
    description: "Portal general de la empresa"
    
  # ============================================
  # SITIO 4: Wiki Técnica
  # ============================================
  - name: "wiki"
    server_name: "wiki.corp.local"
    port: 8081
    ssl: false
    root: "/var/www/html/wiki"
    template: "wiki/index.html"
    description: "Base de conocimientos técnicos"

# ============================================
# CONFIGURACIÓN FUTURA DE DNS
# ============================================
# Cuando implementes SVC-DNS, estas entradas
# deben agregarse a la zona corp.local:
#
# rh.corp.local.       IN A  10.0.1.10
# monitor.corp.local.  IN A  10.0.1.10
# intranet.corp.local. IN A  10.0.1.10
# wiki.corp.local.     IN A  10.0.1.10
# ============================================