# corp-net-v2/lib/services/web/nginx.conf
# Configuración Principal de Nginx - CorpNet v2
# Los Virtual Hosts se generan dinámicamente en /etc/nginx/conf.d/

events {
    worker_connections 1024;
    use epoll;
}

http {
    # ==========================================
    # CONFIGURACIÓN GLOBAL
    # ==========================================
    include /root/corp-net-v2/lib/services/web/mime.types;
    default_type application/octet-stream;
    
    # Optimizaciones
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Logs principales
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # ==========================================
    # INCLUIR VIRTUAL HOSTS DINÁMICOS
    # ==========================================
    # Cada sitio definido en topology/websites.yml
    # genera su propia configuración en este directorio
    include /etc/nginx/conf.d/*.conf;
}