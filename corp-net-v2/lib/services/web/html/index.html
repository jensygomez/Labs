<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            background-color: #050505; 
            color: #00ff41; /* Verde Matrix */
            font-family: 'Courier New', monospace; 
            padding: 30px; 
        }
        .border-box { 
            border: 2px double #00ff41; 
            padding: 20px; 
            box-shadow: 0 0 15px #00ff41;
        }
        h1 { text-align: center; text-transform: uppercase; letter-spacing: 5px; }
        .data-line { margin: 10px 0; border-bottom: 1px dashed #004411; }
        .label { color: #ffffff; font-weight: bold; }
        .value { color: #00bcff; }
    </style>
</head>
<body>
    <div class="border-box">
        <h1>-- CORPNET SECURITY --</h1>
        <div class="data-line">
            <span class="label">[ NODO ]:</span> 
            <span class="value">${NODE_NAME}</span>
        </div>
        <div class="data-line">
            <span class="label">[ STATUS ]:</span> 
            <span style="background: #00ff41; color: black; padding: 0 5px;">PROTEGIDO (TLS 1.3)</span>
        </div>
        <div class="data-line">
            <span class="label">[ DESPLIEGUE ]:</span> 
            <span class="value">${DEPLOY_DATE}</span>
        </div>
        <div class="data-line">
            <span class="label">[ ACCESO ]:</span> 
            <span class="value">Autorizado para RRHH</span>
        </div>
        <br>
        <p style="text-align: center; font-size: 0.7em;">*** MONITOREO DE RED EN TIEMPO REAL ACTIVO ***</p>
    </div>
</body>
</html>
