- hosts: lab-vm
  become: true

  vars:
    student_user: student
    student_ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIByFDKwjMDeGJ5GRhXmZHa75h7dK9JcPHvWWtesSO3/x student@lab-3tier"

  tasks:

    # --------------------------------------------------
    # SISTEMA BASE
    # --------------------------------------------------
    - name: Install base packages
      dnf:
        name:
          - iproute
          - nginx
          - mariadb-server
          - dnsmasq
          - tcpdump
          - nmap
          - htop
          - python3
          - openssh-server
        state: present

    # --------------------------------------------------
    # USUARIO STUDENT
    # --------------------------------------------------
    - name: Create student user
      user:
        name: "{{ student_user }}"
        groups: wheel
        shell: /bin/bash
        password: "{{ 'redhat' | password_hash('sha512') }}"
        create_home: yes

    - name: Create .ssh directory
      file:
        path: "/home/{{ student_user }}/.ssh"
        state: directory
        owner: "{{ student_user }}"
        group: "{{ student_user }}"
        mode: "0700"

    - name: Install SSH public key for student
      authorized_key:
        user: "{{ student_user }}"
        key: "{{ student_ssh_key }}"

    - name: Passwordless sudo for student
      copy:
        dest: /etc/sudoers.d/student
        content: "student ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"

    # --------------------------------------------------
    # NETWORKING
    # --------------------------------------------------
    - name: Enable IP forwarding (persistente)
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: yes

    # --------------------------------------------------
    # SSH HARDENING (SIN ROMPER ACCESO)
    # --------------------------------------------------
    - name: Ensure SSH settings
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^{{ item.key }}"
        line: "{{ item.key }} {{ item.value }}"
        create: yes
        backup: yes
      loop:
        - { key: "Port", value: "22" }
        - { key: "PermitRootLogin", value: "yes" }
        - { key: "PasswordAuthentication", value: "yes" }
        - { key: "PubkeyAuthentication", value: "yes" }
        - { key: "AuthorizedKeysFile", value: ".ssh/authorized_keys" }
        - { key: "UseDNS", value: "no" }
      notify: restart sshd

  handlers:
    - name: restart sshd
      systemd:
        name: sshd
        state: restarted
        enabled: true
