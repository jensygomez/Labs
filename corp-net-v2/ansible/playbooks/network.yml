# corp-net-v2/ansible/playbooks/network.yml
- hosts: lab-vm
  become: true
  gather_facts: false

  vars:
    nmcli_bin: /usr/bin/nmcli

  tasks:

    # --------------------------------------------------
    # DETECTAR INTERFAZ
    # --------------------------------------------------
    - name: Detect default interface
      command: ip -o route show default
      register: default_route
      changed_when: false

    - name: Extract interface
      set_fact:
        iface: "{{ default_route.stdout.split()[-1] }}"

    - name: Validate interface detection
      assert:
        that:
          - iface is defined
          - iface | length > 0
        fail_msg: "No se pudo detectar la interfaz por defecto"

    # --------------------------------------------------
    # OBTENER CONEXIÓN NM
    # --------------------------------------------------
    - name: Get active NM connections
      command: "{{ nmcli_bin }} -t -f NAME,DEVICE connection show --active"
      register: nm_conns
      changed_when: false

    - name: Map NM connection to interface
      set_fact:
        nm_connection: >-
          {{
            nm_conns.stdout_lines
            | select('search', ':' ~ iface ~ '$')
            | first
            | split(':')
            | first
          }}

    - name: Validate NM connection
      assert:
        that:
          - nm_connection is defined
          - nm_connection | length > 0
        fail_msg: "No se encontró conexión NetworkManager para {{ iface }}"

    # --------------------------------------------------
    # PREPARAR CONFIGURACIÓN ESTÁTICA
    # --------------------------------------------------
    - name: Prepare static IP (persistent)
      command: >
        {{ nmcli_bin }} connection modify "{{ nm_connection }}"
        ipv4.method manual
        ipv4.addresses {{ static_ip }}/{{ netmask }}
        ipv4.gateway {{ gateway }}
        ipv4.dns "{{ dns_servers | join(',') }}"
        connection.autoconnect yes
      register: nmcli_cfg
      changed_when: "'successfully' in nmcli_cfg.stdout | lower"
      notify: reboot system

    # --------------------------------------------------
    # RESUMEN
    # --------------------------------------------------
    - name: Show summary
      debug:
        msg: |
          ✅ Red preparada correctamente
          • Interfaz: {{ iface }}
          • Conexión: {{ nm_connection }}
          • IP final: {{ static_ip }}

  handlers:

    # --------------------------------------------------
    # REBOOT CONTROLADO
    # --------------------------------------------------
    - name: reboot system
      reboot:
        msg: "Applying static network configuration"
        reboot_timeout: 600
        connect_timeout: 5
        test_command: whoami
