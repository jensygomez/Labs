---
# tasks/03-network.yml - SOLO CONFIGURAR, NO ACTIVAR

- name: Obtener interfaz de red principal
  shell: ip route | grep default | awk '{print $5}' | head -n1
  register: default_interface
  changed_when: false

- name: Configurar IP estática (PREPARAR solo)
  nmcli:
    conn_name: "{{ default_interface.stdout }}"
    type: ethernet
    state: present
    ip4: "{{ static_ip }}/{{ netmask }}"
    gw4: "{{ gateway }}"
    dns4: "{{ dns_servers | join(',') }}"
    method4: manual
    autoconnect: yes
  register: network_configured

- name: Mostrar resumen de configuración de red
  debug:
    msg: |
      📡 CONFIGURACIÓN DE RED PREPARADA:
      • Interfaz: {{ default_interface.stdout }}
      • Nueva IP: {{ static_ip }}/{{ netmask }}
      • Gateway: {{ gateway }}
      • DNS: {{ dns_servers }}
      
      ⚠️  La nueva IP se ACTIVARÁ en el último paso del playbook.
      Esto puede causar desconexión SSH si cambias de segmento IP.