- name: Configurar IP estática con NetworkManager
  nmcli:
    conn_name: "{{ default_interface.stdout }}"
    type: ethernet
    state: present        # ← NO aplica cambios inmediatos
    ip4: "{{ static_ip }}/{{ netmask }}"
    gw4: "{{ gateway }}"
    method4: manual
    autoconnect: yes
  register: network_config  # ← Registra si hubo cambios

- name: Activar conexión de red
  nmcli:
    conn_name: "{{ default_interface.stdout }}"
    state: up
  when: network_config.changed  # ← Solo reactiva SI hubo cambios