---
# tasks/01-packages.yml - VERSIÓN UNIVERSAL ROBUSTA

- name: "1. Actualizar repositorios y sistema base"
  dnf:
    update_cache: yes
    name: "*"
    state: latest

- name: "2. Instalar EPEL Repository"
  dnf:
    name: epel-release
    state: present

- name: "3. Instalar paquetes CRÍTICOS primero"
  dnf:
    name:
      - iproute
      - iptables
      - nginx
      - mariadb-server
      - openssh-server
      - python3
      - curl
      - wget
    state: present

- name: "4. Instalar resto de paquetes del laboratorio"
  dnf:
    name: "{{ base_packages }}"
    state: present

- name: "5. Limpieza opcional del sistema"
  block:
    # Método 1: Usando módulo dnf (si está disponible)
    - name: Intentar autoremove con módulo dnf
      dnf:
        autoremove: yes
      ignore_errors: yes
    
    # Método 2: Comando directo (fallback universal)
    - name: Limpiar cache con comando directo
      shell: |
        dnf autoremove -y || true
        dnf clean all || true
      changed_when: false
      args:
        executable: /bin/bash
      
  always:
    - name: Confirmar instalación exitosa
      debug:
        msg: "✅ Paquetes del laboratorio instalados correctamente"
