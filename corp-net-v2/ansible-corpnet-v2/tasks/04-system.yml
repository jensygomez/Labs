---
- name: Crear directorios base
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/lab-configs
    - /usr/share/nginx/html

- name: Detener y deshabilitar firewalld
  service:
    name: firewalld
    state: stopped
    enabled: no

- name: Habilitar y arrancar MariaDB
  service:
    name: mariadb
    state: started
    enabled: yes

- name: Habilitar y arrancar crond
  service:
    name: crond
    state: started
    enabled: yes

- name: Crear script de verificación post-reinicio
  template:
    src: check-post-reboot.sh.j2
    dest: /root/check-post-reboot.sh
    mode: '0755'

- name: Configurar crontab para verificación post-reinicio
  cron:
    name: "Lab post-reboot check"
    minute: "0"
    hour: "0"
    job: "/root/check-post-reboot.sh > /var/log/lab-post-reboot.log 2>&1"
    state: present