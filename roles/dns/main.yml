---
# ==============================================================================
# DNS SERVER SETUP (dnsmasq)
# ==============================================================================
- name: "Instalar dnsmasq en el servidor DNS"
  ansible.builtin.apt:
    name: dnsmasq
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  tags: ['dns']

- name: "Detener y deshabilitar systemd-resolved para liberar el puerto 53"
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  ignore_errors: true
  tags: ['dns']

- name: "Desplegar configuración principal de dnsmasq"
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reiniciar dnsmasq
  tags: ['dns']

- name: "Desplegar archivo de hosts locales para resolución interna"
  ansible.builtin.template:
    src: dnsmasq.hosts.j2
    dest: /etc/dnsmasq.hosts
    owner: root
    group: root
    mode: '0644'
  notify: Reiniciar dnsmasq
  tags: ['dns']

- name: "Asegurar que dnsmasq esté iniciado y habilitado"
  ansible.builtin.systemd:
    name: dnsmasq
    state: started
    enabled: true
  tags: ['dns']

- name: "Permitir SSH en UFW (CRÍTICO: no bloquearnos fuera)"
  ansible.builtin.ufw:
    rule: allow
    port: "22"
    proto: "tcp"
    state: enabled
  ignore_errors: true
  tags: ['dns']

- name: "Permitir tráfico DNS (UDP/TCP 53) en UFW"
  ansible.builtin.ufw:
    rule: allow
    port: "53"
    proto: "any"
    state: enabled
  ignore_errors: true
  tags: ['dns']
