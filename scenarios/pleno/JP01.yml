# ============================================================================
# JP01 — Service Deployed but Fails Across One Tier (PRODUCTION READY)
# Nivel: Junior → Junior-Pleno (≈24 meses)
# Tecnología: Ansible
#
# Objetivo:
# - El servicio httpd está correctamente instalado y operativo en el tier web
# - Solo web01 presenta un fallo
# - La causa raíz cambia en cada ejecución (variante A–D)
# - El operador NO conoce la variante
# - No hay remediación automática
# ============================================================================

---

# -----------------------------------------------------------------------------
# PLAY 0 — Ticket de incidente (visible para el operador)
# -----------------------------------------------------------------------------
- name: "JP01 | Ticket de incidente"
  hosts: all
  gather_facts: false

  vars:
    jp01_variants: ['A', 'B', 'C', 'D']
    variant: "{{ variant | default(jp01_variants | random) }}"

  tasks:
    - name: "Mostrar ticket"
      debug:
        msg: |
          🎫 INCIDENTE #JP01
          Servicio afectado: HTTP
          Impacto: Cliente no accede a http://web01
          Síntoma: Timeout / 403 / conexión rechazada
          Prioridad: Media
          Nota: Servicio aparentemente instalado y habilitado

# -----------------------------------------------------------------------------
# PLAY 1 — Baseline corporativo (estado sano esperado)
# -----------------------------------------------------------------------------
- name: "JP01 | Baseline del servicio web"
  hosts: web
  become: true

  tasks:
    - name: "Instalar httpd"
      package:
        name: httpd
        state: present

    - name: "Asegurar httpd habilitado y en ejecución"
      service:
        name: httpd
        enabled: true
        state: started

    - name: "Permitir HTTP en firewall"
      firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

    - name: "Asegurar SELinux en Enforcing"
      command: getenforce
      register: selinux_state
      changed_when: false

    - name: "Abortar si SELinux no está Enforcing"
      fail:
        msg: "SELinux no está en Enforcing; no se puede garantizar la variante D"
      when: selinux_state.stdout != "Enforcing"

# -----------------------------------------------------------------------------
# PLAY 2 — Inyección de fallo controlado (SOLO web01)
# -----------------------------------------------------------------------------
- name: "JP01 | Inyección de fallo (variante aleatoria)"
  hosts: web
  become: true

  tasks:
    # -------------------------
    # VARIANTE A — Configuración inválida
    # -------------------------
    - name: "VAR A | Configuración inválida de httpd"
      when:
        - inventory_hostname == 'web01'
        - variant == 'A'
      copy:
        dest: /etc/httpd/conf.d/jp01_broken.conf
        content: "Listen 99999"

    # -------------------------
    # VARIANTE B — Permisos incorrectos (403)
    # -------------------------
    - name: "VAR B | Permisos incorrectos en DocumentRoot"
      when:
        - inventory_hostname == 'web01'
        - variant == 'B'
      file:
        path: /var/www/html
        owner: root
        group: root
        mode: '0640'

    # -------------------------
    # VARIANTE C — Servicio escucha en puerto incorrecto
    # -------------------------
    - name: "VAR C | Cambiar puerto HTTP a 8080"
      when:
        - inventory_hostname == 'web01'
        - variant == 'C'
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^Listen '
        line: 'Listen 8080'

    # -------------------------
    # VARIANTE D — SELinux bloquea acceso a contenido web
    # -------------------------
    - name: "VAR D | Contexto SELinux incorrecto"
      when:
        - inventory_hostname == 'web01'
        - variant == 'D'
      command: chcon -R -t user_home_t /var/www/html

    - name: "Reiniciar httpd para aplicar fallo"
      service:
        name: httpd
        state: restarted
      ignore_errors: true

# -----------------------------------------------------------------------------
# PLAY 3 — Observabilidad (SIN corrección)
# -----------------------------------------------------------------------------
- name: "JP01 | Observabilidad del servicio"
  hosts: web
  become: true

  tasks:
    - name: "Recolectar facts de servicios"
      service_facts:

    - name: "Estado de httpd"
      debug:
        msg: "httpd en {{ inventory_hostname }}: {{ ansible_facts.services['httpd.service'].state | default('no instalado') }}"

    - name: "Puertos en escucha por httpd"
      shell: ss -lntp | grep httpd || true
      changed_when: false

# -----------------------------------------------------------------------------
# PLAY 4 — Validación desde cliente (síntoma visible)
# -----------------------------------------------------------------------------
- name: "JP01 | Validación desde cliente"
  hosts: client

  tasks:
    - name: "Probar acceso HTTP a web01"
      uri:
        url: http://web01
        return_content: no
      register: web_test
      failed_when: false

    - name: "Resultado desde cliente"
      debug:
        msg: "Resultado HTTP desde cliente: {{ web_test.status | default('sin respuesta') }}"

# -----------------------------------------------------------------------------
# CRITERIOS DE ÉXITO (para el operador)
# -----------------------------------------------------------------------------
# - Identificar que solo web01 está afectado
# - Confirmar que httpd está instalado y/o activo
# - Determinar la causa raíz según evidencia (config, permisos, puerto, SELinux)
# - Proponer corrección SIN alterar el baseline corporativo
# -----------------------------------------------------------------------------