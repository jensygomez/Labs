---
# ==============================================================================
# baselines/ssh.yml — ACCESO REMOTO
# ==============================================================================

- name: SSH | OpenSSH instalado
  dnf:
    name: openssh-server
    state: present
  become: yes

- name: SSH | Servicio activo
  systemd:
    name: sshd
    state: started
    enabled: yes
  become: yes
