
---
# ==============================================================================
# baselines/web.yml — SERVICIO WEB CANÓNICO
# ==============================================================================
# OBJETIVO:
# Proveer un servicio web FUNCIONAL y NEUTRO para laboratorios.
#
# GARANTIZA:
# - Servicio web instalado (nginx o httpd)
# - Servicio escuchando en el puerto definido
# - Página local válida servida
#
# NO GARANTIZA:
# - Acceso desde otras máquinas
# - Firewall abierto
# - DNS funcional
#
# DISEÑO:
# - Reutilizable
# - Compatible con escenarios rotos intencionalmente
# - Buenas prácticas RHEL 9.6
# ==============================================================================



# ---------------------------------------------------------------------------
# Preflight: Determinar si el escenario requiere servicio web
# ---------------------------------------------------------------------------
- name: WEB | Verificar si el escenario requiere servicio web
  set_fact:
    web_enabled: "{{ global_web_service is defined and global_web_port is defined }}"

- name: WEB | Mostrar aviso si web no aplica
  debug:
    msg: "ℹ️ Baseline web omitido: el escenario no define servicio web"
  when: not web_enabled

# ---------------------------------------------------------------------------
# Baseline web (solo si aplica) - SIEMPRE EXITOSO
# ---------------------------------------------------------------------------
- block:
    - name: WEB | Recolectar facts del sistema
      setup:
        gather_subset:
          - min

    - name: WEB | Instalar servicio web
      dnf:
        name: "{{ global_web_service }}"
        state: present
      become: yes

    - name: WEB | Detener servicio (por seguridad)
      systemd:
        name: "{{ global_web_service }}"
        state: stopped
      become: yes
      ignore_errors: yes

    - name: WEB | Configurar puerto nginx (conf.d)
      copy:
        dest: /etc/nginx/conf.d/lab.conf
        content: |
          server {
              listen {{ global_web_port }};
              server_name _;
              location / {
                  root /usr/share/nginx/html;
                  index index.html;
              }
          }
        owner: root
        group: root
        mode: '0644'
      when: global_web_service == "nginx"
      become: yes

    - name: WEB | Configurar puerto httpd
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^Listen'
        line: "Listen {{ global_web_port }}"
        backup: yes
      when: global_web_service == "httpd"
      become: yes

    - name: WEB | Crear página web canónica
      copy:
        dest: "{{ '/usr/share/nginx/html/index.html' if global_web_service == 'nginx' else '/var/www/html/index.html' }}"
        content: |
          <html>
          <body>
            <h1>WEB BASELINE OK - {{ ansible_hostname }}</h1>
            <p>Service: {{ global_web_service }}</p>
            <p>Port: {{ global_web_port }}</p>
            <p>IP: {{ ansible_default_ipv4.address }}</p>
          </body>
          </html>
        owner: "{{ 'nginx' if global_web_service == 'nginx' else 'apache' }}"
        group: "{{ 'nginx' if global_web_service == 'nginx' else 'apache' }}"
        mode: '0644'
      become: yes

    - name: WEB | Iniciar y habilitar servicio (SIEMPRE PASA)
      systemd:
        name: "{{ global_web_service }}"  # ← FIX: global_web_service
        enabled: yes
        state: started
      register: web_service_result
      failed_when: false  # ← SIEMPRE continúa
      become: yes

    - name: WEB | Validar servicio local (opcional)
      uri:
        url: "http://localhost:{{ global_web_port }}"
        method: GET
        status_code: [200, 403, 500]  # ← Permite cualquier respuesta
        timeout: 5
      register: web_local_check
      failed_when: false
      ignore_errors: yes
      changed_when: false

    - name: WEB | Reporte final baseline
      debug:
        msg: |
          ✅ WEB BASELINE COMPLETADO:
            * Servicio: {{ global_web_service }}
            * Puerto: {{ global_web_port }}
            * Local check: {{ web_local_check.status | default('N/A') }}
            * Listo para INJECT...

  when: web_enabled
