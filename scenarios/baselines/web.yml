
---
# ==============================================================================
# baselines/web.yml — SERVICIO WEB CANÓNICO
# ==============================================================================
# OBJETIVO:
# Proveer un servicio web FUNCIONAL y NEUTRO para laboratorios.
#
# GARANTIZA:
# - Servicio web instalado (nginx o httpd)
# - Servicio escuchando en el puerto definido
# - Página local válida servida
#
# NO GARANTIZA:
# - Acceso desde otras máquinas
# - Firewall abierto
# - DNS funcional
#
# DISEÑO:
# - Reutilizable
# - Compatible con escenarios rotos intencionalmente
# - Buenas prácticas RHEL 9.6
# ==============================================================================

# ---------------------------------------------------------------------------
# Preflight: Validación de variables requeridas
# ---------------------------------------------------------------------------
- name: WEB | Validar variables requeridas
  assert:
    that:
      - global_web_service is defined
      - global_web_port is defined
    fail_msg: "❌ Variables web no definidas (global_web_service / global_web_port)"

# ---------------------------------------------------------------------------
# Recolección mínima de facts
# ---------------------------------------------------------------------------
- name: WEB | Recolectar facts del sistema
  setup:
    gather_subset:
      - min

# ---------------------------------------------------------------------------
# Instalación del servicio
# ---------------------------------------------------------------------------
- name: WEB | Instalar servicio web
  dnf:
    name: "{{ global_web_service }}"
    state: present
  become: yes

# ---------------------------------------------------------------------------
# Detener servicio antes de configurar
# ---------------------------------------------------------------------------
- name: WEB | Detener servicio
  systemd:
    name: "{{ global_web_service }}"
    state: stopped
  become: yes

# ---------------------------------------------------------------------------
# Configuración del puerto (RHEL 9 compliant)
# ---------------------------------------------------------------------------
- name: WEB | Configurar puerto nginx (conf.d)
  copy:
    dest: /etc/nginx/conf.d/lab.conf
    content: |
      server {
          listen {{ global_web_port }};
          server_name _;
          location / {
              root /usr/share/nginx/html;
              index index.html;
          }
      }
    owner: root
    group: root
    mode: '0644'
  when: global_web_service == "nginx"
  become: yes

- name: WEB | Configurar puerto httpd
  lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: '^Listen'
    line: "Listen {{ global_web_port }}"
    backup: yes
  when: global_web_service == "httpd"
  become: yes

# ---------------------------------------------------------------------------
# Página de prueba estándar
# ---------------------------------------------------------------------------
- name: WEB | Crear página web canónica
  copy:
    dest: "{{ '/usr/share/nginx/html/index.html'
             if global_web_service == 'nginx'
             else '/var/www/html/index.html' }}"
    content: |
      <html>
      <body>
        <h1>WEB BASELINE OK</h1>
        <p>Service: {{ global_web_service }}</p>
        <p>Port: {{ global_web_port }}</p>
      </body>
      </html>
    owner: "{{ 'nginx' if global_web_service == 'nginx' else 'apache' }}"
    group: "{{ 'nginx' if global_web_service == 'nginx' else 'apache' }}"
    mode: '0644'
  become: yes

# ---------------------------------------------------------------------------
# Iniciar servicio
# ---------------------------------------------------------------------------
- name: WEB | Iniciar y habilitar servicio
  systemd:
    name: "{{ global_web_service }}"
    state: started
    enabled: yes
  become: yes

# ---------------------------------------------------------------------------
# Validación LOCAL del servicio
# ---------------------------------------------------------------------------
- name: WEB | Validar servicio web local
  uri:
    url: "http://localhost:{{ global_web_port }}"
    method: GET
    status_code: 200
  register: web_local_check
  failed_when:
    - web_local_check.status != 200
    - not inject_expected | default(false)
