---
# ==============================================================================
# baselines/firewall.yml — FIREWALL CANÓNICO
# ==============================================================================
# OBJETIVO:
# Proveer un estado BASE y NEUTRO de firewalld para laboratorios.
#
# GARANTIZA:
# - firewalld instalado
# - firewalld activo y habilitado
# - Zonas por defecto intactas
#
# NO HACE:
# - No abre puertos
# - No cierra puertos
# - No cambia zonas
# - No aplica reglas
#
# DISEÑO:
# - Reutilizable en todos los labs
# - Compatible con inyección de fallos
# - Buenas prácticas RHEL 9.6
# ==============================================================================

# ---------------------------------------------------------------------------
# Instalación
# ---------------------------------------------------------------------------
- name: FIREWALL | Instalar firewalld
  dnf:
    name: firewalld
    state: present
  become: yes

# ---------------------------------------------------------------------------
# Servicio activo
# ---------------------------------------------------------------------------
- name: FIREWALL | Iniciar y habilitar firewalld
  systemd:
    name: firewalld
    state: started
    enabled: yes
  become: yes

# ---------------------------------------------------------------------------
# Validación básica
# ---------------------------------------------------------------------------
- name: FIREWALL | Verificar estado del servicio
  command: firewall-cmd --state
  register: firewall_state
  changed_when: false
  failed_when: firewall_state.stdout != "running"
  become: yes

# ---------------------------------------------------------------------------
# Información diagnóstica (no rompe)
# ---------------------------------------------------------------------------
- name: FIREWALL | Obtener zona por defecto
  command: firewall-cmd --get-default-zone
  register: firewall_default_zone
  changed_when: false
  become: yes

- name: FIREWALL | Obtener zonas activas
  command: firewall-cmd --get-active-zones
  register: firewall_active_zones
  changed_when: false
  become: yes