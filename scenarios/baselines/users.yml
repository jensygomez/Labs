---
# ==============================================================================
# baselines/users.yml — USUARIOS CORPORATIVOS
# ==============================================================================
# OBJETIVO:
# Crear usuarios estándar para operación y troubleshooting
# ==============================================================================

- name: USERS | Crear grupo sysadmin
  group:
    name: sysadmin
    state: present
  become: yes

- name: USERS | Crear usuario sysadmin
  user:
    name: sysadmin
    groups: sysadmin,wheel
    shell: /bin/bash
    create_home: yes
    state: present
  become: yes

- name: USERS | Configurar sudo sin password
  copy:
    dest: /etc/sudoers.d/sysadmin
    content: |
      %sysadmin ALL=(ALL) NOPASSWD: ALL
    owner: root
    group: root
    mode: '0440'
  become: yes
