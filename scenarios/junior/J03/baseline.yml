# ==============================================================================
# baseline.yml — ESTADO ÓPTIMO DEL LABORATORIO J03
# ==============================================================================
# 🧱 FUNDAMENTO CONCEPTUAL:
# Este archivo establece el ESTADO SANO, FUNCIONAL y DE REFERENCIA del
# laboratorio J03, previo a la inyección de cualquier incidente.
# En troubleshooting, definir con precisión cómo DEBERÍA funcionar
# el sistema es esencial para identificar qué capa se ha roto.
#
# 🎯 OBJETIVO PRINCIPAL:
# Configurar una infraestructura de 3 nodos geográficamente distribuidos donde:
#   1. web01 (Frankfurt, Alemania) ofrece un servicio web accesible por nombre DNS
#   2. client01 (Shanghái, China) puede consumir el servicio usando curl
#   3. admin01 (San Juan, Puerto Rico) dispone de herramientas de diagnóstico
#
# 🔧 CARACTERÍSTICAS TÉCNICAS DEL ESTADO ÓPTIMO:
# • web01 posee DUAL-IP:
#     - 192.168.122.22 → IP administrativa (SSH / gestión)
#     - 192.168.122.50 → IP del servicio web (expuesta a clientes)
# • Resolución de nombres mediante /etc/hosts (sin DNS externos)
# • Firewalld correctamente configurado (puerto HTTP permitido)
# • nginx vinculado explícitamente a la IP del servicio (no a 0.0.0.0)
# • Herramientas mínimas de diagnóstico instaladas en todos los nodos
#
# 🌍 CONTEXTO GEOGRÁFICO SIMULADO:
#   ┌─────────────────────────────────────────────────────────┐
#   │  web01    │ Frankfurt, Alemania  │ Centro de Datos      │
#   │  client01 │ Shanghái, China      │ Oficina Regional    │
#   │  admin01  │ San Juan, Puerto Rico│ Sede Corporativa    │
#   └─────────────────────────────────────────────────────────┘
#
# 📡 ARQUITECTURA DE COMUNICACIÓN:
#   client01 (curl) → DNS: server.eu → 192.168.122.50 → nginx:80
#   admin01  (curl) → DNS: server.eu → 192.168.122.50 → nginx:80
#
#   NOTA:
#   Los clientes NO conocen la IP administrativa (192.168.122.22).
#   Toda comunicación funcional ocurre únicamente vía nombre DNS
#   y la IP del servicio.
#
# 🛡️ RELACIÓN CON LAS VARIANTES DEL LABORATORIO:
# Este baseline representa el estado CORRECTO y COMPARTIDO para todas
# las variantes del laboratorio J03.
#
# Las variantes NO redefinen este estado.
# Las variantes SOLO introducen fallos específicos en UNA capa:
#   • V1 — Firewall (permisos vs política)
#   • V2 — IP estática (configuración vs expectativa)
#   • V3 — Enrutamiento (trayectoria vs destino)
#   • V4 — Servicio (proceso vs escucha)
#
# 🧪 VERIFICACIONES ESPERADAS EN ESTE ESTADO:
#   1. Desde client01: curl http://server.eu → HTTP 200 OK
#   2. Desde admin01:  curl http://server.eu → HTTP 200 OK
#   3. En web01: ss -tlnp | grep :80 → nginx escuchando correctamente
#   4. En web01: firewall-cmd --list-all → puerto 80 permitido
#
# ⚠️ ADVERTENCIA DE DISEÑO (CRÍTICA):
# Este baseline NO contiene errores intencionales.
# Cualquier fallo en este punto invalida el ejercicio completo,
# ya que las variantes dependen de este estado como referencia.
#
# 🔄 FLUJO DEL LABORATORIO:
#   1. BASELINE → Sistema sano y completamente funcional
#   2. INJECT   → Introducción controlada de una falla
#   3. FIX      → Diagnóstico y restauración del estado óptimo
#
# 🎓 OBJETIVO EDUCATIVO:
# Demostrar que en infraestructuras distribuidas un servicio puede
# estar activo localmente y aun así ser inalcanzable remotamente.
#
# La conectividad real emerge de la alineación correcta entre:
#   red, firewall, enrutamiento y binding del servicio.
#
# ==============================================================================


---

# ==============================================================================
# BASELINE J03 — Estado sano del ecosistema
# Solo TASKS (el PLAY vive en J03.yml)
# ==============================================================================


# ------------------------------------------------------------------------------
# BASELINE | admin01 — Nodo de control
# ------------------------------------------------------------------------------

- name: BASELINE | ADMIN01 | INICIO
  debug:
    msg: "🧭 ADMIN01 activo. Nodo de control sin cambios de red."
  when: "'admin' in group_names"


# ------------------------------------------------------------------------------
# BASELINE | web01 — Servidor EU
# ------------------------------------------------------------------------------

- name: BASELINE | WEB01 | INICIO BLOQUE
  debug:
    msg: "🌍 Iniciando baseline de web01 (red + servicio web)"
  when: "'web' in group_names"


# --- Validaciones previas ------------------------------------------------------

- name: WEB01 | ASSERT | Variables críticas definidas
  assert:
    that:
      - global_web_ip is defined
      - global_web_port is defined
    fail_msg: "❌ Variables global_web_ip o global_web_port NO definidas"
    success_msg: "✅ Variables críticas definidas"
  when: "'web' in group_names"


# --- Red: detección de interfaz ------------------------------------------------

- name: WEB01 | Detectar ruta por defecto
  command: ip route show default
  register: web_default_route
  changed_when: false
  when: "'web' in group_names"

- name: WEB01 | DEBUG | Ruta por defecto
  debug:
    var: web_default_route.stdout
  when: "'web' in group_names"

- name: WEB01 | Definir interfaz primaria
  set_fact:
    primary_iface: "{{ web_default_route.stdout.split(' dev ')[1].split()[0] }}"
  when: "'web' in group_names"

- name: WEB01 | DEBUG | Interfaz primaria detectada
  debug:
    msg: "🧩 Interfaz primaria: {{ primary_iface }}"
  when: "'web' in group_names"


# --- Red: IP secundaria (runtime) ----------------------------------------------

- name: WEB01 | Estado actual de IPs
  command: ip addr show {{ primary_iface }}
  register: web_ip_state
  changed_when: false
  when: "'web' in group_names"

- name: WEB01 | DEBUG | IPs actuales
  debug:
    var: web_ip_state.stdout_lines
  when: "'web' in group_names"

- name: WEB01 | Añadir IP secundaria (si falta)
  command: ip addr add {{ global_web_ip }}/24 dev {{ primary_iface }}
  when:
    - "'web' in group_names"
    - global_web_ip not in web_ip_state.stdout

- name: WEB01 | ASSERT | IP secundaria presente
  assert:
    that:
      - global_web_ip in web_ip_state.stdout or
        global_web_ip in lookup('pipe', 'ip addr show ' ~ primary_iface)
    fail_msg: "❌ IP secundaria NO aplicada en web01"
    success_msg: "✅ IP secundaria aplicada correctamente"
  when: "'web' in group_names"


# --- Persistencia mínima -------------------------------------------------------

- name: WEB01 | Crear script de persistencia de IP
  copy:
    dest: /usr/local/sbin/j03-add-service-ip.sh
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/bash
      IFACE="{{ primary_iface }}"
      IP="{{ global_web_ip }}/24"
      ip addr show "$IFACE" | grep -q "{{ global_web_ip }}" || \
        ip addr add "$IP" dev "$IFACE"
  when: "'web' in group_names"

- name: WEB01 | Registrar script en rc.local
  lineinfile:
    path: /etc/rc.local
    line: "/usr/local/sbin/j03-add-service-ip.sh"
    create: yes
    mode: '0755'
  when: "'web' in group_names"


# --- Servicio web --------------------------------------------------------------

- name: WEB01 | Instalar nginx
  package:
    name: nginx
    state: present
  when: "'web' in group_names"

- name: WEB01 | Configurar nginx
  copy:
    dest: /etc/nginx/conf.d/j03.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      server {
          listen {{ global_web_port }};
          server_name _;
          location / {
              return 200 "J03 BASELINE OK\n";
          }
      }
  when: "'web' in group_names"

- name: WEB01 | Arrancar nginx
  service:
    name: nginx
    state: started
    enabled: yes
  when: "'web' in group_names"

- name: WEB01 | ASSERT | nginx escuchando
  command: ss -tlnp
  register: nginx_ports
  changed_when: false
  when: "'web' in group_names"

- assert:
    that:
      - "'nginx' in nginx_ports.stdout"
    fail_msg: "❌ nginx NO está escuchando"
    success_msg: "✅ nginx activo y escuchando"
  when: "'web' in group_names"


# --- Firewall ------------------------------------------------------------------

- name: WEB01 | Asegurar firewalld
  package:
    name: firewalld
    state: present
  when: "'web' in group_names"

- name: WEB01 | Arrancar firewalld
  service:
    name: firewalld
    state: started
    enabled: yes
  when: "'web' in group_names"

- name: WEB01 | Abrir puerto web
  firewalld:
    port: "{{ global_web_port }}/tcp"
    permanent: yes
    immediate: yes
    state: enabled
  when: "'web' in group_names"


# ------------------------------------------------------------------------------
# BASELINE | client01 — Cliente remoto
# ------------------------------------------------------------------------------

- name: BASELINE | CLIENT01 | INICIO BLOQUE
  debug:
    msg: "🧪 Iniciando baseline de client01"
  when: "'client' in group_names"

- name: CLIENT01 | Resolver servicio vía /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "{{ global_web_ip }} {{ web_url | regex_replace('^https?://', '') }}"
    state: present
  when: "'client' in group_names"

- name: CLIENT01 | ASSERT | Resolución de nombre
  command: getent hosts {{ web_url | regex_replace('^https?://', '') }}
  register: dns_check
  changed_when: false
  failed_when: dns_check.rc != 0
  when: "'client' in group_names"

- name: CLIENT01 | Instalar curl
  package:
    name: curl
    state: present
  when: "'client' in group_names"


# ------------------------------------------------------------------------------
# FIN DEL BASELINE
# ------------------------------------------------------------------------------

- name: BASELINE | FIN
  debug:
    msg: "✅ BASELINE COMPLETADO — Ecosistema alineado"
