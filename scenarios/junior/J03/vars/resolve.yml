---
# ==============================================================================
# scenarios/junior/J03/vars/resolve.yml — RESOLVER DEL ESCENARIO J03
# ==============================================================================
#
# 🎯 PROPÓSITO:
# Resolver y FIJAR todos los valores variables del laboratorio J03
# de forma determinística para una única ejecución del escenario.
#
# Este archivo actúa como el "cerebro declarativo" del laboratorio:
# toma catálogos abstractos (vars/main.yml) y los convierte en valores
# CONCRETOS que serán utilizados por:
#
#   - Baselines   → para construir el estado ÓPTIMO del sistema
#   - Variants    → para romper ese estado de forma controlada
#   - Tickets     → para mostrar síntomas REALISTAS
#
# ------------------------------------------------------------------------------
# 📐 PRINCIPIOS DE DISEÑO
#
# 1. DETERMINISMO
#    Una vez que un valor se resuelve aquí:
#      → NO cambia durante toda la ejecución del laboratorio.
#
# 2. SEPARACIÓN DE RESPONSABILIDADES
#    - resolve.yml   → SOLO selecciona valores (NO configura sistemas)
#    - baselines/*   → construyen el estado sano
#    - inject/*      → introducen fallos
#
# 3. REUTILIZACIÓN
#    Este resolver puede copiarse casi intacto a:
#      J04, J05, J07… cambiando únicamente vars/main.yml
#
# ------------------------------------------------------------------------------
# 🚫 LO QUE **NO** HACE ESTE ARCHIVO
#
# ✗ NO ejecuta comandos (nmcli, firewall-cmd, systemctl)
# ✗ NO modifica servicios ni archivos
# ✗ NO valida conectividad
# ✗ NO introduce fallos
#
# ------------------------------------------------------------------------------
# 📦 DEPENDENCIAS
#
# Requiere obligatoriamente:
#   vars/main.yml
#
# Donde se definen los catálogos:
#   random_elements.*
#   variants
#
# ------------------------------------------------------------------------------
# 🌍 VARIABLES GLOBALES PUBLICADAS
#
# Infraestructura:
#   global_interface
#   global_web_port
#   global_web_service
#
# Fallos potenciales:
#   global_wrong_ip
#   global_firewall_zone
#   global_firewall_service
#
# Contexto del laboratorio:
#   global_selected_variant
#   web_url
#   symptom_description
#
# Estas variables se consideran INMUTABLES después de este punto.
#
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. CARGANDO ARCHIVO VARS/MAIN.YML
# ----------------------------------------------------------------

- name: J03 | Cargar variables base del escenario
  include_vars: vars/main.yml


# ------------------------------------------------------------------------------
# 1. SELECCIÓN ALEATORIA DE PARÁMETROS BASE
# ------------------------------------------------------------------------------
# Se elige un valor por categoría desde los catálogos definidos
# en vars/main.yml. Esta selección ocurre UNA SOLA VEZ.

- name: J03 | Resolver parámetros aleatorios del escenario
  set_fact:
    global_interface: "{{ random_elements.interfaces | random }}"
    global_web_port: "{{ random_elements.web_ports | random }}"
    global_wrong_ip: "{{ random_elements.wrong_ips | random }}"
    global_firewall_zone: "{{ random_elements.firewall_zones | random }}"
    global_firewall_service: "{{ random_elements.firewalld_services | random }}"
    global_web_service: "{{ random_elements.systemd_web_services | random }}"
  run_once: true

# ------------------------------------------------------------------------------
# 2. VARIABLES DERIVADAS (NO TOCAN EL SISTEMA)
# ------------------------------------------------------------------------------
# Estas variables se construyen a partir de los valores resueltos
# y se usan para:
#   - Tickets
#   - Mensajes de diagnóstico
#   - Validaciones lógicas

- name: J03 | Construir variables derivadas de contexto
  set_fact:
    web_url: "http://192.168.122.22:{{ global_web_port }}"
    symptom_description: >-
      El cliente client01 no puede acceder al servicio web en
      192.168.122.22:{{ global_web_port }}
  run_once: true

# ------------------------------------------------------------------------------
# 3. SELECCIÓN DE VARIANTE DEL INCIDENTE
# ------------------------------------------------------------------------------
# Se elige exactamente UNA variante de fallo que será inyectada
# después del baseline.
#
# Ejemplos:
#   - variant_1.yml → Firewalld bloquea puerto
#   - variant_2.yml → IP incorrecta
#   - variant_3.yml → Interfaz DOWN
#   - variant_4.yml → Puerto cambiado sin firewall

- name: J03 | Seleccionar variante del incidente
  set_fact:
    global_selected_variant: "{{ variants | random }}"
  run_once: true

# ------------------------------------------------------------------------------
# 4. MARCA DE CONTROL
# ------------------------------------------------------------------------------
# Bandera simple para permitir validaciones posteriores
# (por ejemplo, evitar ejecutar inject si resolve falló).

- name: J03 | Marcar resolución del escenario como completada
  set_fact:
    j03_resolved: true
  run_once: true
