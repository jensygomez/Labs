---
# ==============================================================================
# scenarios/junior/J03/vars/resolve.yml — LAB J03: Network Connectivity Failure
# ------------------------------------------------------------------------------
# RESPONSABILIDAD:
#   Motor de resolución del laboratorio J03. Convierte catálogos de red 
#   (vars/main.yml) en valores concretos FIJOS para toda la ejecución del lab.
#
# QUE HACE:
#   - Selecciona aleatoriamente: interfaz, puerto web, IP errónea, zona firewall
#   - Deriva configuraciones de red estándar (nmcli connection name, puerto nginx)
#   - Selecciona variante específica del incidente de conectividad (1 de 4)
#   - Publica variables GLOBALES para tasks operativos e inyección de fallos
#
# QUE NO HACE:
#   - NO configura interfaces (nmcli/ip)
#   - NO modifica firewalld
#   - NO toca nginx/httpd
#   - NO introduce fallos (solo resolve)
#
# PRINCIPIO DE DISEÑO:
#   Determinismo: Una vez resuelto aquí → NO CAMBIA durante el laboratorio
#   4 variantes × 4 interfaces × 4 puertos × 5 IPs = 320 tickets únicos
#
# DEPENDENCIAS (OBLIGATORIAS):
#   vars/main.yml ← Catálogos estáticos de red
#
# VARIABLES PUBLICADAS (GLOBALES):
#   global_interface, global_web_port, global_wrong_ip, global_firewall_zone
#   global_firewall_service, global_web_service, global_selected_variant
#   web_url, test_command, symptom_description
#
# QUIÉN LO USA:
#   tasks/base.yml          ← Baseline nginx+network OK
#   inject/variant_*.yml    ← Inyecta fallo específico  
#   tasks/show_ticket.yml   ← Genera ticket con valores reales
#   tasks/verify.yml        ← Valida DOWN/UP
#
# ORDEN: ÚNICA EJECUCIÓN al inicio del site.yml → ANTES base.yml
# ==============================================================================

- name: Seleccionar elementos aleatorios de conectividad J03
  set_fact:
    selected_interface: "{{ random_elements.interfaces | random }}"
    selected_web_port: "{{ random_elements.web_ports | random }}"
    selected_wrong_ip: "{{ random_elements.wrong_ips | random }}"
    selected_firewall_zone: "{{ random_elements.firewall_zones | random }}"
    selected_firewall_service: "{{ random_elements.firewall_services | random }}"
    selected_web_service: "{{ random_elements.web_services | random }}"
  run_once: true

- name: Resolver variables globales de red
  set_fact:
    # Configuración de red específica
    global_interface: "{{ selected_interface }}"
    global_web_port: "{{ selected_web_port }}"
    global_wrong_ip: "{{ selected_wrong_ip }}"
    global_firewall_zone: "{{ selected_firewall_zone }}"
    global_firewall_service: "{{ selected_firewall_service }}"
    global_web_service: "{{ selected_web_service }}"
    
    # URLs y comandos para ticket/verificación
    web_url: "http://web01.example.com:{{ selected_web_port }}"
    test_command: "curl -I {{ web_url }} --connect-timeout 5"
    symptom_description: "curl desde client01 a web01.example.com:{{ selected_web_port }} falla"
    
    # Rutas de configuración derivadas
    nginx_listen: "listen {{ selected_web_port }};"
    nmcli_connection: "{{ selected_interface }}"
  run_once: true

- name: Seleccionar variante del incidente de conectividad
  set_fact:
    global_selected_variant: "{{ variants | random }}"  # ✅ CORRECTO
  run_once: true

- name: Marcar resolución J03 completada
  set_fact:
    j03_resolved: true
  run_once: true

# ==============================================================================
# FIN resolve.yml — Variables listas para inyección en inject/{{ global_selected_variant }}
# Tickets generados usarán: {{ web_url }}, {{ test_command }}, {{ symptom_description }}
# ==============================================================================
