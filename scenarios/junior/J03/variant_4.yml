---
# ==============================================================================
# scenarios/junior/J03/inject/variant_4.yml — Puerto Nginx Cambiado sin Firewall
# ==============================================================================
#
# PROPÓSITO DEL INCIDENTE:
#   Simular "Deploy de config nginx nueva rompió acceso web". Nginx escucha en 
#   puerto diferente ({{ global_web_port + 1000}}) sin abrir en firewalld.
#
# CONTEXTO DEL LAB:
#   - nginx corriendo, firewalld con puerto ORIGINAL abierto
#   - Config previa: nginx {{ global_web_port }}, firewall {{ global_web_port }} OK
#   - ANTES: curl DESDE client01 funcionaba perfectamente
#
# PROBLEMAS INYECTADOS:
#
#   1. Causa raíz (nginx):
#      nginx.conf: listen {{ global_web_port }} → listen {{ global_web_port + 1000 }}
#
#   2. Firewall NO actualizado:
#      firewalld sigue abierto {{ global_web_port }}/tcp (NO nuevo puerto)
#
#   3. Ruido secundario:
#      - nginx error_log con "bind() failed" antiguo → Confunde
#      - Puerto original sigue "pareciendo" abierto en netstat
#      - Workers nginx OK → "Servicio parece vivo"
#
# RESULTADO ESPERADO:
#   - ss -tuln → nginx :{{ global_web_port + 1000 }} (NO :{{ global_web_port }})
#   - firewall-cmd → {{ global_web_port }}/tcp ABIERTO (pero nginx NO escucha ahí)
#   - curl DESDE client01 → Connection refused
#
# DIAGNÓSTICO SECUENCIAL:
#   1. nmcli con show → UP ✓
#   2. ip a → 192.168.122.22 ✓
#   3. firewall-cmd → puerto OK ✓
#   4. ss -tuln → nginx NO en {{ global_web_port }} ✗ ← FIX AQUÍ
#
# OBJETIVO DIDÁCTICO:
#   - ss -tuln | grep :PUERTO vs nginx.conf listen
#   - Deploy config sin actualizar firewall
#   - systemctl reload vs restart impacto
#
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Backup nginx.conf original
# ------------------------------------------------------------------------------
- name: V4 | Backup nginx.conf funcional
  copy:
    src: /etc/nginx/nginx.conf
    dest: /etc/nginx/nginx.conf.j03v4backup
    remote_src: yes
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# 2. CAUSA RAÍZ: Cambiar puerto nginx a uno NUEVO
# ------------------------------------------------------------------------------
- name: V4 | nginx.conf listen {{ global_web_port }} → {{ global_web_port + 1000 }} (RAÍZ)
  lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^(\s*listen\s+){{ global_web_port }};'
    line: '    listen {{ (global_web_port | int + 1000) }};'
    backup: yes

# ------------------------------------------------------------------------------
# 3. Ruido: Puerto original SIGUE en firewall (confunde)
# ------------------------------------------------------------------------------
# ✅ FIX shell (igual que base.yml)
- name: V4 | Asegurar puerto ORIGINAL sigue abierto (ruido)
  shell: |
    firewall-cmd --zone="{{ global_firewall_zone }}" \
      --add-port="{{ global_web_port }}/tcp" \
      --permanent || true
    firewall-cmd --reload || true
  become: yes
  args:
    executable: /bin/bash

# ------------------------------------------------------------------------------
# 4. Recargar nginx (sin restart - workers sobreviven)
# ------------------------------------------------------------------------------
- name: V4 | Recargar nginx con nuevo puerto
  systemd:
    name: "{{ global_web_service }}"
    state: reloaded

# ------------------------------------------------------------------------------
# 5. Verificar nginx ESCUCHA puerto NUEVO
# ------------------------------------------------------------------------------
- name: V4 | Confirmar nginx en puerto {{ global_web_port + 1000 }}
  shell: ss -tuln | grep :{{ (global_web_port | int + 1000) }} | grep LISTEN
  register: new_port_check
  changed_when: false
  failed_when: new_port_check.rc != 0

# ------------------------------------------------------------------------------
# 6. Verificar puerto ORIGINAL vacío
# ------------------------------------------------------------------------------
- name: V4 | Confirmar puerto {{ global_web_port }} VACÍO
  shell: ss -tuln | grep :{{ global_web_port }} | grep -v grep
  register: old_port_check
  changed_when: false
  failed_when: old_port_check.rc == 0

# ------------------------------------------------------------------------------
# 7. Confirmar conectividad REMOTA FALLA
# ------------------------------------------------------------------------------
- name: V4 | client01 curl puerto original → FAIL
  uri:
    url: "{{ web_url }}"
    method: HEAD
  delegate_to: client01
  register: remote_test
  failed_when: false

# ------------------------------------------------------------------------------
# 8. Log técnico inyección
# ------------------------------------------------------------------------------
- name: V4 | Registrar cambio puerto nginx
  lineinfile:
    path: /var/log/j03-inject.log
    create: yes
    line: "[J03-V4-{{ ansible_date_time.epoch }}] nginx {{ global_web_port }} → {{ global_web_port + 1000 }} (firewall sin actualizar)"
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# 9. Archivo diagnóstico instructor
# ------------------------------------------------------------------------------
- name: V4 | Guía diagnóstico J03-V4
  copy:
    dest: "/tmp/j03_variant_4_diagnosis.txt"
    content: |
      =============================================
      J03 VARIANT 4 — NGINX PUERTO CAMBIADO sin FIREWALL
      Puerto nginx: {{ (global_web_port | int + 1000) }}
      Puerto firewall: {{ global_web_port }}
      =============================================

      SYMPTOMS:
      ✓ nmcli con show → connected
      ✓ ip a → 192.168.122.22/24
      ✓ firewall-cmd --list-ports → {{ global_web_port }}/tcp
      ✗ ss -tuln | grep :{{ global_web_port }} → VACÍO
      ✓ ss -tuln | grep :{{ (global_web_port | int + 1000) }} → nginx LISTEN
      ✗ curl {{ web_url }} → Connection refused

      ROOT CAUSE:
      nginx.conf: listen {{ (global_web_port | int + 1000) }}; 
      Firewall: {{ global_web_port }}/tcp (DESINCronizados)

      FIX #1 (rápido - 30s):
      firewall-cmd --zone={{ global_firewall_zone }} --add-port={{ (global_web_port | int + 1000) }}/tcp --permanent
      firewall-cmd --reload

      FIX #2 (nginx a puerto original):
      nginx.conf: listen {{ global_web_port }};
      systemctl reload nginx

      VERIFICAR:
      ss -tuln | grep :PUERTO_NUEVO
      curl http://web01.example.com:{{ (global_web_port | int + 1000) }} → 200 OK
    owner: root
    group: root
    mode: '0600'
