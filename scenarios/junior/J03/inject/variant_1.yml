---
# ==============================================================================
# J03 | VARIANT 1 — Firewalld bloquea puerto web + TICKET EMBEBIDO
# ==============================================================================
# INCIDENTE:
#   Servicio web inaccesible desde client01
#   Causa real: firewalld bloquea {{ global_web_port }}/tcp
#
# ESTADO ESPERADO PREVIO:
#   - nginx/httpd LISTEN OK
#   - Red OK
#   - Acceso cliente → web01 FUNCIONABA
#
# 🎯 NUEVA ARQUITECTURA:
#   ✓ INJECT + TICKET en UN SOLO archivo
#   ✓ Sin paths relativos complicados
#   ✓ Ticket sincronizado con inyección
# ==============================================================================



# ------------------------------------------------------------------------------
# 1. Backup configuración firewalld (FIX: sintaxis corregida)
# ------------------------------------------------------------------------------
- name: V1 | Backup zona firewalld actual
  copy:
    src: "/etc/firewalld/zones/{{ global_firewall_zone | default('public') }}.xml"
    dest: "/etc/firewalld/zones/{{ global_firewall_zone | default('public') }}.xml.j03v1.bak"
    remote_src: yes
    owner: root
    group: root
    mode: '0644'
  ignore_errors: yes
  become: yes

# ------------------------------------------------------------------------------
# 2. Ruido secundario: remover servicios conocidos
# ------------------------------------------------------------------------------
- name: V1 | Remover servicios web conocidos (ruido diagnóstico)
  shell: |
    for svc in http https {{ global_firewall_service | default('http') }}; do
      firewall-cmd --zone="{{ global_firewall_zone | default('public') }}" --remove-service="$svc" --permanent || true
    done
  args:
    executable: /bin/bash
  become: yes

# ------------------------------------------------------------------------------
# 3. CAUSA RAÍZ: bloquear puerto web
# ------------------------------------------------------------------------------
- name: V1 | CAUSA RAÍZ — bloquear {{ global_web_port }}/tcp
  shell: |
    firewall-cmd --zone="{{ global_firewall_zone | default('public') }}" \
      --remove-port="{{ global_web_port }}/tcp" \
      --permanent || true
  args:
    executable: /bin/bash
  become: yes

# ------------------------------------------------------------------------------
# 4. Ruido realista: rich-rule REJECT
# ------------------------------------------------------------------------------
- name: V1 | Ruido visual — rich rule REJECT HTTP
  shell: |
    firewall-cmd --zone="{{ global_firewall_zone | default('public') }}" \
      --add-rich-rule='rule family=ipv4 port port="{{ global_web_port }}" protocol=tcp reject' \
      --permanent || true
  args:
    executable: /bin/bash
  become: yes

# ------------------------------------------------------------------------------
# 5. Aplicar cambios firewalld
# ------------------------------------------------------------------------------
- name: V1 | Recargar firewalld
  command: firewall-cmd --reload
  become: yes

# ------------------------------------------------------------------------------
# 6. VERIFICAR QUE SIGUE ESCUCHANDO LOCAL
# ------------------------------------------------------------------------------
- name: V1 | Verificar nginx sigue vivo localmente
  uri:
    url: "http://localhost:{{ global_web_port }}"
    method: HEAD
    timeout: 5
  register: local_check
  failed_when: false

# ------------------------------------------------------------------------------
# 7. MOSTRAR TICKET AL ESTUDIANTE 🎫
# ------------------------------------------------------------------------------
- name: V1 | 🎫 MOSTRAR TICKET — Incidente NOC detectado
  debug:
    msg:
      - "==================================================================================================="
      - " 🚨 LAB J03 — INCIDENTE NOC CRÍTICO 🚨"
      - " VARIANTE 1: SERVICIO WEB INACCESIBLE DESDE CHINA"
      - "==================================================================================================="
      - ""
      - "📋 ESCENARIO:"
      - "   Cliente chino (client01) reporta \"Connection refused\" en {{ web_url }}"
      - "   ✅ nginx localhost:{{ global_web_port }} sigue RESPONDIENDO 200 OK"
      - "   ❌ Pero desde client01 → Connection refused"
      - ""
      - "📍 DETALLES:"
      - "   Puerto: {{ global_web_port }}/tcp"
      - "   Zona: {{ global_firewall_zone | default('public') }}"
      - "   Local check: {{ local_check.status | default('OK') }}"
      - ""
      - "🔍 COMANDOS PARA DIAGNÓSTICO:"
      - "   ss -tuln | grep :{{ global_web_port }}     → LISTEN ✓"
      - "   systemctl status {{ global_web_service }}  → active ✓"
      - "   firewall-cmd --list-all                   → Puerto AUSENTE ❌"
      - ""
      - "🎯 SOLUCIÓN ESPERADA:"
      - "   firewall-cmd --zone={{ global_firewall_zone }} --add-port={{ global_web_port }}/tcp --permanent"
      - "   firewall-cmd --reload"
      - ""
      - "👤 ACCESO: ssh student@192.168.122.22"
      - "==================================================================================================="
    verbosity: 0
  run_once: true
