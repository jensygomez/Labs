---
# ==============================================================================
# J03 | VARIANT 1 — Firewalld bloquea puerto web + TICKET EMBEBIDO
# ==============================================================================
# INCIDENTE:
#   Servicio web inaccesible desde client01
#   Causa real: firewalld bloquea {{ global_web_port }}/tcp
#
# ESTADO ESPERADO PREVIO:
#   - nginx/httpd LISTEN OK
#   - Red OK
#   - Acceso cliente → web01 FUNCIONABA
#
# 🎯 NUEVA ARQUITECTURA:
#   ✓ INJECT + TICKET en UN SOLO archivo
#   ✓ Sin paths relativos complicados
#   ✓ Ticket sincronizado con inyección
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Backup configuración firewalld (reversible, silencioso)
# ------------------------------------------------------------------------------
- name: V1 | Backup zona firewalld actual
  copy:
    src: "/etc/firewalld/zones/{{ global_firewall_zone }}.xml"
    dest: "/etc/firewalld/zones/{{ global_firewall_zone }}.xml.j03v1.bak"
    remote_src: yes
    owner: root
    group: root
    mode: '0644'
  ignore_errors: yes
  become: yes

# ------------------------------------------------------------------------------
# 2. Ruido secundario: remover servicios conocidos
# ------------------------------------------------------------------------------
- name: V1 | Remover servicios web conocidos (ruido diagnóstico)
  shell: |
    for svc in http https {{ global_firewall_service }}; do
      firewall-cmd --zone="{{ global_firewall_zone }}" --remove-service="$svc" --permanent || true
    done
  args:
    executable: /bin/bash
  become: yes

# ------------------------------------------------------------------------------
# 3. CAUSA RAÍZ: bloquear puerto web
# ------------------------------------------------------------------------------
- name: V1 | CAUSA RAÍZ — bloquear {{ global_web_port }}/tcp
  shell: |
    firewall-cmd --zone="{{ global_firewall_zone }}" \
      --remove-port="{{ global_web_port }}/tcp" \
      --permanent || true
  args:
    executable: /bin/bash
  become: yes

# ------------------------------------------------------------------------------
# 4. Ruido realista: rich-rule REJECT (confunde con ataque)
# ------------------------------------------------------------------------------
- name: V1 | Ruido visual — rich rule REJECT HTTP
  shell: |
    firewall-cmd --zone="{{ global_firewall_zone }}" \
      --add-rich-rule='rule family=ipv4 port port="{{ global_web_port }}" protocol=tcp reject' \
      --permanent || true
  args:
    executable: /bin/bash
  become: yes

# ------------------------------------------------------------------------------
# 5. Aplicar cambios firewalld (único reload)
# ------------------------------------------------------------------------------
- name: V1 | Recargar firewalld
  command: firewall-cmd --reload
  become: yes

# ------------------------------------------------------------------------------
# 6. Verificación local (NO es firewall)
# ------------------------------------------------------------------------------
- name: V1 | Verificar servicio web local (localhost)
  uri:
    url: "http://localhost:{{ global_web_port }}"
    method: HEAD
    timeout: 5
  register: local_web_check
  failed_when: false

# ------------------------------------------------------------------------------
# 7. Log técnico de inyección
# ------------------------------------------------------------------------------
- name: V1 | Registrar inyección
  lineinfile:
    path: /var/log/j03-inject.log
    create: yes
    line: "[J03][V1][{{ ansible_date_time.iso8601 }}] firewalld bloqueó {{ global_web_port }}/tcp en {{ global_firewall_zone }}"
    owner: root
    group: root
    mode: '0644'
  become: yes

# ------------------------------------------------------------------------------
# 8. MOSTRAR TICKET AL ESTUDIANTE (EMBEDDED)
# ------------------------------------------------------------------------------
- name: V1 | MOSTRAR TICKET — Incidente NOC detectado
  debug:
    msg:
      - "==============================================================================="
      - " LAB J03 — INCIDENTE NOC"
      - " VARIANTE 1: Firewalld bloquea puerto web"
      - "==============================================================================="
      - ""
      - "📋 ESCENARIO"
      - "----------------------------------------------------------------------------"
      - "El servicio web en {{ web_url }} se reporta como inaccesible desde estaciones"
      - "de trabajo externas. Los clientes reportan \"Connection refused\" al intentar"
      - "acceder a la aplicación web crítica."
      - ""
      - "El servicio estaba funcionando correctamente hasta hace 30 minutos, cuando se"
      - "aplicaron cambios de seguridad en firewalld."
      - ""
      - "📍 Puerto afectado : {{ global_web_port }}"
      - "📍 Zona firewall   : {{ global_firewall_zone }}"
      - ""
      - "🔍 SÍNTOMAS OBSERVADOS"
      - "----------------------------------------------------------------------------"
      - "- {{ test_command }} DESDE client01 falla con \"Connection refused\""
      - "- ss -tuln | grep :{{ global_web_port }}  → LISTEN ✓"
      - "- systemctl status {{ global_web_service }} → active (running)"
      - "- nmcli con show → interfaz conectada con IP válida"
      - "- ip a → 192.168.122.22/24 asignada correctamente"
      - "- firewall-cmd --list-all → {{ global_web_port }}/tcp NO presente"
      - ""
      - "🎯 TAREA"
      - "----------------------------------------------------------------------------"
      - "Diagnosticar y restaurar la conectividad del servicio web en:"
      - ""
      - "  {{ web_url }}"
      - ""
      - "Pasos esperados:"
      - "1. Verificar conectividad DESDE client01:"
      - "   {{ test_command }}"
      - ""
      - "2. Confirmar servicio web activo:"
      - "   ss -tuln | grep :{{ global_web_port }}"
      - ""
      - "3. Validar red:"
      - "   nmcli con show"
      - "   ip a"
      - ""
      - "4. Revisar firewalld:"
      - "   firewall-cmd --list-all"
      - ""
      - "5. Restaurar acceso externo con persistencia tras reboot."
      - ""
      - "⚠️  RESTRICCIONES"
      - "----------------------------------------------------------------------------"
      - "- NO reiniciar nginx/httpd (el servicio funciona correctamente)"
      - "- NO cambiar IP ni configuración nmcli"
      - "- NO modificar nginx.conf (puerto correcto)"
      - "- NO deshabilitar firewalld completamente"
      - "- La solución DEBE usar --permanent"
      - "- Validar DESDE client01: {{ test_command }} → debe retornar 200 OK"
      - ""
      - "================================================================================"
      - " ACCESO PARA DIAGNÓSTICO"
      - "----------------------------------------------------------------------------"
      - "SSH web01:"
      - "  ssh student@192.168.122.22"
      - ""
      - "OBJETIVO: DIAGNOSTICAR Y RESOLVER"
      - "==============================================================================="
    verbosity: 0
  run_once: true
