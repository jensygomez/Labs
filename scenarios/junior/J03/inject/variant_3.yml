---
# ==============================================================================
# scenarios/junior/J03/inject/variant_3.yml — Interfaz de Red Down
# ==============================================================================
#
# PROPÓSITO DEL INCIDENTE:
#   Simular ticket NOC clásico: "Servidor web desapareció de red después de reboot".
#   Interfaz de red principal ({{ global_interface }}) está DOWN por nmcli.
#
# CONTEXTO DEL LAB:
#   - nginx funciona (puerto {{ global_web_port }} LISTEN)
#   - Firewall OK (puerto abierto)
#   - IP correcta configurada en nmcli
#   - ANTES: Interface UP + curl OK desde client01
#
# PROBLEMAS INYECTADOS:
#
#   1. Causa raíz:
#      nmcli con down {{ global_interface }} → Interface DOWN
#      ip link → STATE DOWN
#
#   2. Ruido secundario:
#      - NetworkManager autoconnect=NO → "No sube sola"
#      - Servicio de red "reiniciado" → journalctl ruido
#      - Ping local OK → "No es nginx"
#
# RESULTADO ESPERADO:
#   - nmcli con show → {{ global_interface }} (disconnected)
#   - ip link → STATE DOWN
#   - ip a → NO IP asignada
#   - curl DESDE client01 → Network unreachable
#
# MENSAJES TÍPICOS:
#   - "curl: (101) Network is unreachable"
#   - "ping: web01: Name or service not known"
#   - "nmcli con show → disconnected"
#
# DIAGNÓSTICO SECUENCIAL:
#   1. ping web01 → FAIL
#   2. nmcli con show → {{ global_interface }} disconnected ✗
#   3. ip link → STATE DOWN ✗
#   4. nmcli con up → FIXED
#
# OBJETIVO DIDÁCTICO:
#   - nmcli con up/down vs ifup/ifdown
#   - NetworkManager states (disconnected vs disconnected)
#   - systemctl restart NetworkManager impacto
#
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Backup configuración nmcli (reversible)
# ------------------------------------------------------------------------------
- name: V3 | Backup conexión nmcli
  copy:
    src: "/etc/NetworkManager/system-connections/{{ global_interface }}.nmconnection"
    dest: "/etc/NetworkManager/system-connections/{{ global_interface }}.nmconnection.j03v3backup"
    remote_src: yes
    owner: root
    group: root
    mode: '0600'

# ------------------------------------------------------------------------------
# 2. Ruido: Desactivar autoconnect (no sube sola)
# ------------------------------------------------------------------------------
- name: V3 | Desactivar autoconnect (ruido post-reboot)
  shell: nmcli con mod "{{ global_interface }}" connection.autoconnect no
  become: yes

# ------------------------------------------------------------------------------
# 3. CAUSA RAÍZ: Interfaz DOWN
# ------------------------------------------------------------------------------
- name: V3 | APAGAR INTERFAZ {{ global_interface }} (CAUSA RAÍZ)
  shell: nmcli con down "{{ global_interface }}"
  become: yes

# ------------------------------------------------------------------------------
# 4. Ruido: Reiniciar NetworkManager (journalctl ruido)
# ------------------------------------------------------------------------------
- name: V3 | Reiniciar NetworkManager (ruido en logs)
  systemd:
    name: NetworkManager
    state: restarted
  ignore_errors: yes

# ------------------------------------------------------------------------------
# 5. Verificar interface REALMENTE down
# ------------------------------------------------------------------------------
- name: V3 | Confirmar interface DOWN
  shell: nmcli con show "{{ global_interface }}" | grep STATE | awk '{print $2}'
  register: interface_state
  changed_when: false
  failed_when: "'down' not in interface_state.stdout and 'disconnected' not in interface_state.stdout"

# ------------------------------------------------------------------------------
# 6. Confirmar nginx LOCAL sigue vivo
# ------------------------------------------------------------------------------
- name: V3 | nginx localhost OK (solo red caída)
  uri:
    url: "http://localhost:{{ global_web_port }}"
    method: HEAD
  register: local_check
  failed_when: local_check.status != 200

# ------------------------------------------------------------------------------
# 7. Verificar conectividad REMOTA IMPOSIBLE
# ------------------------------------------------------------------------------
- name: V3 | client01 NO alcanza web01 (sin IP)
  shell: ping -c 1 -W 2 web01.example.com
  delegate_to: client01
  register: ping_test
  failed_when: false
  changed_when: false

# ------------------------------------------------------------------------------
# 8. Log técnico de inyección
# ------------------------------------------------------------------------------
- name: V3 | Registrar interfaz DOWN
  lineinfile:
    path: /var/log/j03-inject.log
    create: yes
    line: "[J03-V3-{{ ansible_date_time.epoch }}] Interfaz {{ global_interface }} DOWN (autoconnect=off)"
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# 9. Archivo diagnóstico instructor
# ------------------------------------------------------------------------------
- name: V3 | Guía diagnóstico J03-V3
  copy:
    dest: "/tmp/j03_variant_3_diagnosis.txt"
    content: |
      =============================================
      J03 VARIANT 3 — INTERFAZ DE RED DOWN
      Interfaz: {{ global_interface }}
      Estado: disconnected/down
      =============================================

      SYMPTOMS:
      ✗ nmcli con show → {{ global_interface }} "disconnected"
      ✗ ip link show → STATE DOWN  
      ✗ ip a → NO IP en {{ global_interface }}
      ✓ ss -tuln | grep :{{ global_web_port }} → nginx LISTEN
      ✓ curl http://localhost:{{ global_web_port }} → 200 OK
      ✗ ping web01.example.com → Network unreachable
      ✗ curl {{ web_url }} → Network unreachable

      ROOT CAUSE:
      nmcli con show {{ global_interface }}
      → STATE: disconnected/down

      FIX (1 COMANDO):
      nmcli con up {{ global_interface }}
      
      VERIFICAR:
      nmcli con show → "connected"
      ip a → inet 192.168.122.22/24
      ping 192.168.122.22 → OK
      curl {{ web_url }} → 200 OK

      OPCIONAL:
      nmcli con mod {{ global_interface }} connection.autoconnect yes
    owner: root
    group: root
    mode: '0600'
