---
# ==============================================================================
# J03.yml — ORQUESTADOR PRINCIPAL DEL LABORATORIO J03
# ==============================================================================
# OBJETIVO:
# Orquestar el laboratorio J03 en 3 fases estrictas:
#
#   1. RESOLVE   → resolver variables finales del escenario
#   2. BASELINE  → dejar las VMs en estado óptimo (por tema)
#   3. INJECT    → inyectar el fallo según la variante seleccionada
#
# PRINCIPIOS:
# - J03.yml NO contiene lógica técnica
# - Los baselines son reutilizables
# - Las variantes SOLO rompen
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. RESOLVE — Resolver variables globales del laboratorio
# ------------------------------------------------------------------------------
- name: J03 | Resolve variables del escenario
  hosts: all
  gather_facts: no
  tasks:
    - name: Resolver variables J03
      include_tasks: vars/resolve.yml


# ------------------------------------------------------------------------------
# 1.5 PROPAGAR VARIABLES GLOBALES A TODOS LOS HOSTS
# ------------------------------------------------------------------------------
- name: J03 | Propagar variables globales
  hosts: all
  gather_facts: no
  tasks:
    - name: Obtener variable del admin01
      set_fact:
        global_selected_variant: "{{ hostvars['admin01']['global_selected_variant'] }}"
        global_web_port: "{{ hostvars['admin01']['global_web_port'] }}"
        global_firewall_zone: "{{ hostvars['admin01']['global_firewall_zone'] }}"
        global_web_service: "{{ hostvars['admin01']['global_web_service'] }}"
        web_url: "{{ hostvars['admin01']['web_url'] }}"
        test_command: "curl -I {{ hostvars['admin01']['web_url'] }}"
      run_once: true



# ------------------------------------------------------------------------------
# 2. BASELINE — Estado óptimo (por tema)
# ------------------------------------------------------------------------------
- name: J03 | Aplicar baselines canónicos
  hosts: all
  gather_facts: no
  tasks:
    - name: Baseline | Usuarios corporativos
      include_tasks: ../../baselines/users.yml

    - name: Baseline | Red funcional
      include_tasks: ../../baselines/network.yml

    - name: Baseline | Acceso SSH
      include_tasks: ../../baselines/ssh.yml

    - name: Baseline | Servicio Web
      include_tasks: ../../baselines/web.yml
      when: "'web' in group_names"

    - name: Baseline | Firewall limpio
      include_tasks: ../../baselines/firewall.yml
      when: "'web' in group_names"



# ------------------------------------------------------------------------------
# 2.5 VALIDAR - Confirmar que TODO funciona perfectamente
# ------------------------------------------------------------------------------
- name: J03 | Validar baseline (TODO FUNCIONA)
  hosts: client01
  gather_facts: no
  tasks:
    - name: VALIDAR | Conectividad web01 → 200 OK
      uri:
        url: "{{ web_url }}"
        method: HEAD
      register: pre_inject_test
      failed_when: false

    - name: VALIDAR | Reporte PRE-INJECT
      debug:
        msg: |
          ✅ SISTEMA FUNCIONAL ANTES DE INJECT:
            * web_url: {{ web_url }}
            * Status: {{ pre_inject_test.status | default('N/A') }}
            * Listo para INYECCIÓN DE FALLA...

    - name: VALIDAR | Pausa dramática
      pause:
        seconds: 2
        prompt: "🎬 Presiona Enter para INYECTAR el incidente..."

