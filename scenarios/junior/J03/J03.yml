# ==============================================================================
# J03.yml — ORQUESTADOR PRINCIPAL DEL LABORATORIO J03
# ==============================================================================
# ⚡ TEMA CENTRAL: "Ilusiones de Conectividad en Redes Distribuidas"
# 
# En arquitecturas distribuidas, la percepción de conectividad suele ser engañosa.
# Un servicio puede estar "vivo" localmente pero inalcanzable desde el mundo exterior.
# Este laboratorio explora las múltiples capas donde puede romperse la comunicación
# entre sistemas remotos en una infraestructura global simulada.
#
# 🌍 ECOSISTEMA SIMULADO:
#   admin01  → Sede Corporativa (San Juan, Puerto Rico)
#   client01 → Oficina Regional (Shanghái, China) 
#   web01    → Centro de Datos (Frankfurt, Alemania)
#
# 📡 ARQUITECTURA:
#   Cada VM representa un nodo crítico con diferentes roles, zonas horarias
#   y configuraciones regionales, simulando los desafíos de infraestructuras
#   geográficamente distribuidas.
#
# 🔄 FLUJO DEL LABORATORIO:
#   1. RESOLVE   → Establecer el contexto del escenario (dónde, qué, cómo)
#   2. BASELINE  → Llevar cada nodo a su estado óptimo por tema
#   3. INJECT    → Introducir una falla específica según la variante
#
# 🎯 VARIANTES (4 perspectivas de fallo):
#   V1 → FIREWALL: Permisos vs. Política (el muro invisible)
#   V2 → IP ESTÁTICA: Configuración vs. Expectativa (la dirección fantasma)
#   V3 → ENRUTAMIENTO: Trayectoria vs. Destino (el camino equivocado)
#   V4 → SERVICIO: Proceso vs. Escucha (el puerto silencioso)
#
# 💡 FILOSOFÍA DEL LABORATORIO:
#   "En redes, lo visible localmente no garantiza lo alcanzable remotamente.
#    Un servicio puede respirar, latir y responder en su host, mientras
#    permanece como un fantasma para el resto del mundo. La verdadera
#    conectividad vive en la intersección de múltiples capas: configuración,
#    enrutamiento, firewall y binding del servicio."
#
# 📐 PRINCIPIOS DE DISEÑO:
#   - J03.yml es únicamente ORQUESTADOR, sin lógica técnica
#   - Los baselines son reutilizables y atómicos
#   - Las variantes SOLO rompen, NUNCA reparan
#   - Cada fallo enseña una capa diferente del stack de red
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. RESOLVE — Resolver variables globales del laboratorio
# ------------------------------------------------------------------------------
- name: J03 | Resolve variables del escenario
  hosts: all
  gather_facts: no
  tasks:
    - name: Resolver variables J03
      include_tasks: vars/resolve.yml


# ------------------------------------------------------------------------------
# 1.5 PROPAGAR VARIABLES GLOBALES A TODOS LOS HOSTS
# ------------------------------------------------------------------------------
# ⚠️  NOTA CRÍTICA DE DISEÑO:
# Estas variables fueron resueltas en vars/resolve.yml. Aquí solo se propagan
# desde admin01 (nodo maestro) hacia todos los hosts. Las variantes NUNCA deben
# definir sus propias variables; consumen estas variables globales.
# ------------------------------------------------------------------------------
- name: J03 | Propagar variables globales
  hosts: all
  gather_facts: no
  tasks:
    - name: Obtener variables del admin01
      set_fact:
        # Contexto general del lab
        global_selected_variant: "{{ hostvars['admin01']['global_selected_variant'] }}"
        web_url: "{{ hostvars['admin01']['web_url'] }}"
        test_command: "curl -I {{ hostvars['admin01']['web_url'] }}"

        # Servicio web
        global_web_port: "{{ hostvars['admin01']['global_web_port'] }}"
        global_web_service: "{{ hostvars['admin01']['global_web_service'] }}"

        # Firewall (Variant 1)
        global_firewall_zone: "{{ hostvars['admin01']['global_firewall_zone'] }}"

        # Networking / nmcli (Variant 2)
        global_connection_name: "{{ hostvars['admin01']['global_connection_name'] }}"
        global_web_ip: "{{ hostvars['admin01']['global_web_ip'] }}"
        global_wrong_ip: "{{ hostvars['admin01']['global_wrong_ip'] }}"
        global_wrong_gw: "{{ hostvars['admin01']['global_wrong_gw'] }}"
      run_once: true


# ------------------------------------------------------------------------------
# 2. BASELINE — Estado óptimo CANÓNICO
# ------------------------------------------------------------------------------
# 🏗️  ESTADO DE REFERENCIA GLOBAL:
# Este baseline representa la infraestructura en su forma SANA y FUNCIONAL,
# común a TODAS las variantes del laboratorio J03.
#
# PRINCIPIOS:
#   - Un único baseline compartido
#   - Totalmente funcional desde TODAS las perspectivas
#   - Independiente de la variante seleccionada
#
# RESPONSABILIDAD:
#   - J03.yml ejecuta SIEMPRE este baseline
#   - Las variantes SOLO degradan, nunca preparan
#
# ⚠️  REGLA CRÍTICA:
# Este baseline NO puede contener fallos intencionales ni
# anticipar ninguna variante.
# ------------------------------------------------------------------------------

- name: J03 | Ejecutar baseline canónico (estado sano)
  hosts: all
  become: yes
  gather_facts: no
  tasks:
    - name: Incluir baseline global
      include_tasks: baseline.yml






# ------------------------------------------------------------------------------
# 2.5 BASELINE - Confirmar que el servicio funciona ANTES del incidente
# ------------------------------------------------------------------------------
- name: J03 | Validar baseline (TODO FUNCIONA)
  hosts: client01
  gather_facts: no
  tasks:
    - name: VALIDAR | Conectividad web01 → 200 OK
      uri:
        url: "{{ web_url }}"
        method: HEAD
      register: pre_inject_test
      failed_when: false

    - name: VALIDAR | Reporte PRE-INJECT
      debug:
        msg: |
          🌐 SISTEMA FUNCIONAL - CONEXIÓN GLOBAL ESTABLECIDA
          ══════════════════════════════════════════════════
          • Origen:       client01 (Shanghái, China)
          • Destino:      web01 (Frankfurt, Alemania)
          • Servicio:     {{ web_url }}
          • Estado HTTP:  {{ pre_inject_test.status | default('N/A') }}
          • Latencia:     {{ pre_inject_test.elapsed | default('N/A') }}s
          
          ✅ La infraestructura opera dentro de parámetros normales.
          ✅ La comunicación intercontinental fluye sin obstrucciones.

    - name: VALIDAR | 🧠 PREPARACIÓN MENTAL PARA EL INCIDENTE
      pause:
        seconds: 3
        prompt: |
          ════════════════════════════════════════════════════════════════════
          🧭 FILOSOFÍA LINUX PARA EL SYSADMIN:
          
          "En sistemas distribuidos, la verdad no es absoluta sino contextual.
           Lo que un nodo ve como 'conectado', otro puede verlo como 'inalcanzable'.
           Tu tarea no es buscar al culpable, sino encontrar la capa donde
           se rompió la percepción compartida de la realidad de red."
           
          Presiona ENTER cuando estés listo para enfrentar la discontinuidad...
          ════════════════════════════════════════════════════════════════════


