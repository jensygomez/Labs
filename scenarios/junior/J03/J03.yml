---
# ==============================================================================
# J03.yml — ORQUESTADOR PRINCIPAL
# ------------------------------------------------------------------------------
# OBJETIVO:
# Orquestar el laboratorio J03 en 3 fases estrictas:
#   1. Resolve   → resolver variables finales
#   2. Baseline  → estado óptimo validado
#   3. Inject    → inyección de fallo (variante)
#
# NOTA:
# - J03.yml no contiene lógica técnica
# - Toda la inteligencia vive en tasks/ y variants/
# ==============================================================================

- name: J03 | Resolve variables
  hosts: admin01
  gather_facts: no
  tasks:
    - name: Include resolve phase
      include_tasks: tasks/resolve.yml

- name: J03 | Apply baseline (estado óptimo)
  hosts: web01
  gather_facts: no
  tasks:
    - name: Include baseline phase
      include_tasks: tasks/baseline.yml

- name: J03 | Inject failure (variant)
  hosts: web01
  gather_facts: no
  tasks:
    - name: Include inject phase
      include_tasks: "variants/{{ inject_variant }}.yml"
