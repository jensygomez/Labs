---
# ==============================================================================
# scenarios/junior/J03/tickets/variant_2.yml — TICKET IP Estática Errónea
# ==============================================================================
#
# 🏢 PROPÓSITO DEL TICKET:
#   Plantilla para variante 2 J03: IP estática configurada fuera de rango de red.
#   Genera ticket NOC real con valores DINÁMICOS de vars/resolve.yml.
#
# 🔄 FLUJO DE GENERACIÓN:
#   J03.yml → resolve.yml → inject/variant_2.yml → tasks/show_ticket.yml
#   → {{ global_wrong_ip }} → /tmp/J03_ticket.txt (192.168.122.99 reales)
#
# 📋 VALORES DINÁMICOS SUSTITUIDOS:
#   {{ global_wrong_ip }} → 192.168.122.99 (wrong_ips aleatorio)
#   {{ global_interface }} → Wired connection 1
#   {{ web_url }} → http://web01.example.com:8080
#   {{ test_command }} → curl -I http://web01.example.com:8080
#
# USADO POR: tasks/show_ticket.yml → Sustituye y escribe ticket final
# ==============================================================================

variant:
  description: |
    El servidor web01 dejó de ser accesible desde la red interna después de 
    mantenimiento de red realizado por el equipo de infraestructura. Los clientes 
    reportan "No route to host" al intentar conectar. El servicio web funciona 
    localmente pero no responde a conexiones externas. Se sospecha cambio 
    accidental de configuración IP durante actualización de NetworkManager.

  symptoms:
    - "`{{ test_command }}` DESDE client01 falla con 'No route to host'"
    - "`ip a` muestra IP {{ global_wrong_ip }}/24 en lugar de 192.168.122.22/24"
    - "`nmcli con show {{ global_interface }}` confirma IP incorrecta"
    - "`ss -tuln | grep :{{ global_web_port }}` muestra nginx/httpd LISTEN ✓"
    - "`systemctl status {{ global_web_service }}` reporta active (running)"
    - "`ping web01.example.com` DESDE client01 falla (ARP no responde)"
    - "`curl http://localhost:{{ global_web_port }}` LOCALMENTE funciona ✓"

  task: |
    Diagnosticar y corregir configuración de red que impide acceso externo al 
    servicio web en {{ web_url }}.
    
    1. Verificar conectividad DESDE client01: `{{ test_command }}`
    2. Validar IP actual: `ip a` y `nmcli con show {{ global_interface }}`
    3. Confirmar nginx/httpd ejecutándose: `ss -tuln | grep :{{ global_web_port }}`
    4. Revisar reglas firewalld: `firewall-cmd --list-all`
    5. Restaurar IP correcta 192.168.122.22/24 con persistencia.

  restrictions:
    - "NO reiniciar nginx/httpd (funciona correctamente)"
    - "NO modificar firewall (reglas correctas)"
    - "IP correcta OBLIGATORIA: 192.168.122.22/24 gateway 192.168.122.1"
    - "NO cambiar puerto nginx (escucha correctamente)"
    - "Usar nmcli connection modify para corrección persistente"
    - "Verificar DESDE client01: `{{ test_command }}` debe retornar 200 OK"
