---
# ==============================================================================
# scenarios/junior/J03/tickets/variant_4.yml — TICKET Puerto Nginx Desincronizado
# ==============================================================================
#
# 🏢 PROPÓSITO DEL TICKET:
#   Plantilla para variante 4 J03: nginx cambió puerto sin actualizar firewall.
#   Simula deploy config nueva que "rompió" acceso externo.
#
# 🔄 FLUJO DE GENERACIÓN:
#   J03.yml → resolve.yml → inject/variant_4.yml → tasks/show_ticket.yml
#
# 📋 VALORES DINÁMICOS:
#   {{ global_web_port }} → 8080 (puerto original)
#   Nuevo puerto: {{ global_web_port + 1000 }} → 9080
#   {{ web_url }} → http://web01.example.com:8080
#
# USADO POR: tasks/show_ticket.yml → Genera /tmp/J03_ticket.txt
# ==============================================================================

variant:
  description: |
    Después de un deploy de nueva configuración de nginx, el servicio web dejó 
    de responder desde estaciones externas. Los clientes reportan "Connection 
    refused" en el puerto documentado. El equipo de desarrollo confirma que 
    nginx está ejecutándose sin errores críticos, pero sospechan que la nueva 
    configuración cambió el puerto de escucha durante el reload.

  symptoms:
    - "`{{ test_command }}` DESDE client01 falla con 'Connection refused'"
    - "`nmcli con show` y `ip a` muestran red correcta 192.168.122.22/24 ✓"
    - "`firewall-cmd --list-ports` muestra {{ global_web_port }}/tcp ABIERTO ✓"
    - "`ss -tuln | grep :{{ global_web_port }}` NO muestra nginx escuchando ✗"
    - "`ss -tuln | grep :{{ (global_web_port | int + 1000) }}` muestra nginx ✓"
    - "`systemctl status {{ global_web_service }}` reporta active (running)"
    - "`curl http://localhost:{{ global_web_port }}` LOCAL falla, pero otro puerto funciona"

  task: |
    Diagnosticar desincronización entre configuración nginx y reglas firewall.
    
    1. Verificar conectividad DESDE client01: `{{ test_command }}`
    2. Validar red: `nmcli con show` y `ip a`
    3. Revisar firewalld: `firewall-cmd --list-ports`
    4. Identificar puerto REAL de nginx: `ss -tuln`
    5. Sincronizar nginx/firewalld para restaurar acceso externo.

  restrictions:
    - "NO reiniciar NetworkManager ni cambiar IP (red correcta)"
    - "NO detener nginx completamente (workers funcionan)"
    - "NO deshabilitar firewalld (reglas base correctas)"
    - "Solución válida: Alinear firewall con puerto nginx O nginx con firewall"
    - "Cambios deben persistir tras `systemctl reload {{ global_web_service }}`"
    - "Verificar DESDE client01: `{{ test_command }}` retorna 200 OK"

