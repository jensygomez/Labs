---
# ==============================================================================
# scenarios/junior/J03/tickets/variant_3.yml — TICKET Interfaz de Red Down
# ==============================================================================
#
# 🏢 PROPÓSITO DEL TICKET:
#   Plantilla para variante 3 J03: Interfaz de red principal DOWN por nmcli.
#   Genera ticket NOC "servidor desapareció de red post-reboot/maintenance".
#
# 🔄 FLUJO DE GENERACIÓN:
#   J03.yml → resolve.yml → inject/variant_3.yml → tasks/show_ticket.yml
#   → {{ global_interface }} → /tmp/J03_ticket.txt (Wired connection 1 real)
#
# 📋 VALORES DINÁMICOS SUSTITUIDOS:
#   {{ global_interface }} → Wired connection 1 (interfaces aleatorio)
#   {{ web_url }} → http://web01.example.com:8080
#   {{ test_command }} → curl -I http://web01.example.com:8080
#
# USADO POR: tasks/show_ticket.yml → Sustituye y escribe ticket final
# ==============================================================================

variant:
  description: |
    El servidor web01 desapareció completamente de la red después de un reboot 
    programado por mantenimiento. No responde ping ni conexiones HTTP desde 
    ninguna estación de trabajo. El servicio web nginx/httpd funciona correctamente 
    en localhost pero la interfaz de red principal no está activa. NetworkManager 
    muestra la conexión como "disconnected".

  symptoms:
    - "`{{ test_command }}` DESDE client01 falla con 'Network is unreachable'"
    - "`nmcli con show` muestra `{{ global_interface }}` como disconnected/down"
    - "`ip link` reporta interfaz STATE DOWN (NO IP asignada)"
    - "`ip a` NO muestra 192.168.122.22/24 en interfaz principal"
    - "`ss -tuln | grep :{{ global_web_port }}` muestra nginx/httpd LISTEN ✓"
    - "`curl http://localhost:{{ global_web_port }}` LOCALMENTE funciona ✓"
    - "`ping web01.example.com` DESDE client01 falla completamente"

  task: |
    Diagnosticar y reactivar conectividad de red del servidor web01.
    
    1. Verificar conectividad DESDE client01: `{{ test_command }}`
    2. Revisar estado de interfaces: `nmcli con show` y `ip link`
    3. Confirmar nginx/httpd ejecutándose localmente: `ss -tuln | grep :{{ global_web_port }}`
    4. Reactivar interfaz de red principal
    5. Verificar IP 192.168.122.22/24 asignada y conectividad restaurada.

  restrictions:
    - "NO reiniciar nginx/httpd (funciona correctamente en localhost)"
    - "NO modificar configuración IP (ya está correcta en nmcli)"
    - "NO reiniciar NetworkManager completamente (usa nmcli connection)"
    - "NO usar ifup/ifdown (NetworkManager environment)"
    - "Solución debe persistir con autoconnect=yes"
    - "Verificar DESDE client01: `{{ test_command }}` debe retornar 200 OK"
