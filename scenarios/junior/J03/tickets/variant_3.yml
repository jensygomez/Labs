# ==============================================================================
# TICKET PARA LA VARIANTE 3
# ==============================================================================

variant:
  description: |
    Un servicio del sistema está configurado con múltiples condiciones (Condition*)
    y aserciones (Assert*) de systemd que no se cumplen en el entorno actual,
    impidiendo que el servicio se cargue o inicie. Estas condiciones verifican
    la existencia de archivos, contenido específico, tipo de virtualización y
    parámetros del kernel que no coinciden con el estado real del sistema,
    causando que systemd omita o rechace silenciosamente la activación del servicio.

  symptoms:
    - "`systemctl start <service>.service` no genera errores, pero el servicio no inicia"
    - "`systemctl status` muestra el servicio como 'inactive (dead)'"
    - "`systemctl cat <service>.service` revela múltiples Condition y Assert"
    - "El journal no contiene errores de arranque (el servicio se omite)"
    - "`systemd-analyze verify` muestra advertencias relacionadas con condiciones"
    - "Archivos o rutas requeridas por condiciones no existen"
    - "Scripts usados en ExecCondition fallan durante la evaluación"

  task: |
    Diagnosticar y corregir las condiciones y aserciones de systemd que están
    bloqueando el inicio del servicio. Identificar qué condiciones no se cumplen,
    determinar si siguen siendo necesarias, y corregir el entorno para satisfacerlas
    o ajustar/remover únicamente las condiciones incorrectas. Asegurar que el
    servicio pueda cargarse e iniciarse de forma normal y predecible.

  restrictions:
    - "NO eliminar todas las condiciones o aserciones indiscriminadamente"
    - "NO modificar parámetros del kernel ni el tipo de virtualización del host"
    - "NO usar opciones de forzado para evadir condiciones al iniciar el servicio"
    - "NO alterar la lógica interna de scripts usados por ExecCondition"
    - "Debe mantenerse al menos una condición de seguridad si estaba prevista"
    - "Las correcciones deben respetar la intención original de las condiciones"
