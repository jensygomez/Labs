---
# ==============================================================================
# tasks/baseline.yml — ESTADO BASE CANÓNICO J03
# ------------------------------------------------------------------------------
# OBJETIVO:
# Dejar las 3 VMs en estado ÓPTIMO y VALIDADO.
#
# GARANTIZA:
# - Servicio web activo en web01
# - Red correcta y funcional
# - Acceso exitoso DESDE client01
#
# SI FALLA:
# → El laboratorio es INVÁLIDO y debe abortar
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. WEB01 — Instalación del servicio web
# ------------------------------------------------------------------------------
- name: BASELINE | Instalar servicio web
  dnf:
    name: "{{ global_web_service }}"
    state: present
  become: yes

- name: BASELINE | Detener servicio antes de configurar
  systemd:
    name: "{{ global_web_service }}"
    state: stopped
  become: yes

# ------------------------------------------------------------------------------
# 2. WEB01 — Configuración del puerto
# ------------------------------------------------------------------------------
- name: BASELINE | Configurar puerto nginx
  lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*listen\s+'
    line: "    listen {{ global_web_port }};"
    backup: yes
  when: global_web_service == "nginx"
  become: yes

- name: BASELINE | Configurar puerto httpd
  lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: '^Listen'
    line: "Listen {{ global_web_port }}"
    backup: yes
  when: global_web_service == "httpd"
  become: yes

# ------------------------------------------------------------------------------
# 3. WEB01 — Página de prueba
# ------------------------------------------------------------------------------
- name: BASELINE | Crear página web de prueba
  copy:
    dest: "{{ '/usr/share/nginx/html/index.html'
             if global_web_service == 'nginx'
             else '/var/www/html/index.html' }}"
    content: |
      <html>
      <body>
        <h1>J03 BASELINE OK</h1>
        <p>Servicio: {{ global_web_service }}</p>
        <p>Puerto: {{ global_web_port }}</p>
        <p>IP: 192.168.122.22</p>
      </body>
      </html>
    owner: "{{ 'nginx' if global_web_service == 'nginx' else 'apache' }}"
    group: "{{ 'nginx' if global_web_service == 'nginx' else 'apache' }}"
    mode: '0644'
  become: yes

# ------------------------------------------------------------------------------
# 4. WEB01 — Iniciar servicio
# ------------------------------------------------------------------------------
- name: BASELINE | Iniciar y habilitar servicio web
  systemd:
    name: "{{ global_web_service }}"
    state: started
    enabled: yes
  become: yes

# ------------------------------------------------------------------------------
# 5. WEB01 — Configuración de red
# ------------------------------------------------------------------------------
- name: BASELINE | Configurar IP estática correcta
  shell: |
    nmcli con mod "{{ global_interface }}" \
      ipv4.method manual \
      ipv4.addresses 192.168.122.22/24 \
      ipv4.gateway 192.168.122.1 \
      connection.autoconnect yes || \
    nmcli con add con-name "{{ global_interface }}" \
      ifname "{{ global_interface }}" \
      type ethernet \
      ipv4.method manual \
      ipv4.addresses 192.168.122.22/24 \
      ipv4.gateway 192.168.122.1 \
      connection.autoconnect yes
  args:
    executable: /bin/bash
  become: yes

- name: BASELINE | Activar interfaz de red
  shell: nmcli con up "{{ global_interface }}"
  become: yes

# ------------------------------------------------------------------------------
# 6. WEB01 — Firewall
# ------------------------------------------------------------------------------
- name: BASELINE | Abrir puerto web en firewalld
  shell: |
    firewall-cmd --zone="{{ global_firewall_zone }}" \
      --add-port="{{ global_web_port }}/tcp" \
      --permanent
    firewall-cmd --reload
  args:
    executable: /bin/bash
  become: yes

# ------------------------------------------------------------------------------
# 7. VALIDACIONES — WEB01 LOCAL
# ------------------------------------------------------------------------------
- name: BASELINE | Verificar web LOCAL en web01
  uri:
    url: "http://localhost:{{ global_web_port }}"
    method: HEAD
  register: local_check
  failed_when: local_check.status != 200

# ------------------------------------------------------------------------------
# 8. VALIDACIONES — CLIENT01 REMOTO
# ------------------------------------------------------------------------------
- name: BASELINE | Verificar acceso DESDE client01
  uri:
    url: "{{ web_url }}"
    method: HEAD
  delegate_to: client01
  register: client_check
  failed_when: client_check.status != 200

# ------------------------------------------------------------------------------
# 9. CONFIRMACIÓN FINAL
# ------------------------------------------------------------------------------
- name: BASELINE | Estado óptimo confirmado
  debug:
    msg: "✓ BASELINE OK: web01 accesible desde client01 en {{ global_web_port }}"
