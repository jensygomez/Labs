---
# ==============================================================================
# scenarios/junior/J03/tasks/base.yml — LAB J03: Network Connectivity Failure
# ------------------------------------------------------------------------------
# RESPONSABILIDAD:
#   Prepara baseline FUNCIONAL de nginx + red en web01 para laboratorio J03.
#   Estado inicial: curl http://web01.example.com:8080 DESDE client01 funciona.
#
# QUE HACE:
#   - Instala nginx/httpd según variante
#   - Configura puerto correcto ({{ global_web_port }})
#   - Configura red correcta (IP 192.168.122.22/24, interface UP)
#   - Abre puerto en firewalld (http/https/puerto custom)
#   - Verifica conectividad client01→web01 OK
#   - NO introduce fallos
#
# QUE NO HACE:
#   - NO selecciona variables (lo hace resolve.yml)
#   - NO rompe conectividad (lo hacen variants/)
#   - NO crea usuarios custom
#
# DEPENDENCIAS (OBLIGATORIAS):
#   Debe ejecutarse DESPUÉS de:
#     - vars/main.yml     → Catálogos
#     - tasks/resolve.yml → Variables globales resueltas
#
# VARIABLES REQUERIDAS:
#   global_interface, global_web_port, global_web_service, global_firewall_service
#   web_url, test_command
#
# QUIÉN LO USA:
#   site.yml → tasks/base.yml → inject/{{ global_selected_variant }} → ticket
#
# ORDEN DE EJECUCIÓN:
#   1. vars/main.yml      (catálogos)
#   2. tasks/resolve.yml (globals: puerto=8080, interface=...)
#   3. tasks/base.yml    (nginx UP, red OK, curl OK)
#   4. inject/variant_X  (ROMPER)
#   5. show_ticket.yml   (generar ticket)
# ==============================================================================


- name: Instalar servicio web según variante
  dnf:
    name: "{{ global_web_service }}"
    state: present

- name: Asegurar puerto libre antes de configurar
  systemd:
    name: "{{ global_web_service }}"
    state: stopped

- name: Configurar puerto nginx ({{ global_web_port }})
  lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^(\s*listen\s+).*'
    line: '    listen {{ global_web_port }};'
    backup: yes
  when: global_web_service == "nginx"

- name: Configurar puerto httpd ({{ global_web_port }})
  lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: '^(\s*Listen).*'
    line: 'Listen {{ global_web_port }}'
    backup: yes
  when: global_web_service == "httpd"

# AGREGAR después "Configurar puerto httpd" (antes "Iniciar servicio"):
- name: Crear página de prueba para baseline
  copy:
    content: |
      <html><body><h1>J03 Lab - Baseline FUNCIONAL</h1>
      <p>Servicio: {{ global_web_service }}</p>
      <p>Puerto: {{ global_web_port }}</p>
      <p>IP: 192.168.122.22</p>
      <p><a href="/">RHCSA Training Lab</a></p>
      </body></html>
    dest: "{{ '/usr/share/nginx/html/index.html' if global_web_service == 'nginx' else '/var/www/html/index.html' }}"
  become: yes

- name: Asegurar permisos página de prueba
  file:
    path: "{{ '/usr/share/nginx/html/index.html' if global_web_service == 'nginx' else '/var/www/html/index.html' }}"
    mode: '0644'
    owner: "{{ 'nginx' if global_web_service == 'nginx' else 'apache' }}"
    group: "{{ 'nginx' if global_web_service == 'nginx' else 'apache' }}"
  become: yes



- name: Iniciar y habilitar servicio web
  systemd:
    name: "{{ global_web_service }}"
    state: started
    enabled: yes

- name: Configurar IP correcta 192.168.122.22/24 (baseline)
  shell: |
    nmcli con mod "{{ global_interface }}" \
      ipv4.method manual \
      ipv4.addresses 192.168.122.22/24 \
      ipv4.gateway 192.168.122.1 \
      connection.autoconnect yes || \
    nmcli con add con-name "{{ global_interface }}" \
      ifname "{{ 'enp1s0' if 'enp1s0' in global_interface else 'eth0' }}" \
      type ethernet \
      ipv4.method manual \
      ipv4.addresses 192.168.122.22/24 \
      ipv4.gateway 192.168.122.1 \
      connection.autoconnect yes
  args:
    executable: /bin/bash
  become: yes

- name: Activar interfaz de red
  shell: nmcli con up "{{ global_interface }}" || true
  become: yes

# ✅ FIX firewalld → shell (reemplaza las 2 tareas firewalld)
- name: Abrir puerto {{ global_web_port }}/tcp en firewalld (baseline)
  shell: |
    firewall-cmd --zone="{{ global_firewall_zone }}" --list-ports | grep -q "{{ global_web_port }}/tcp" || \
    firewall-cmd --zone="{{ global_firewall_zone }}" --add-port="{{ global_web_port }}/tcp" --permanent
    firewall-cmd --reload
  become: yes
  args:
    executable: /bin/bash



- name: Reload firewalld
  command: firewall-cmd --reload
  become: yes

- name: Alternativa - Abrir servicio firewalld
  shell: |
    firewall-cmd --zone="{{ global_firewall_zone }}" \
      --add-service="{{ global_firewall_service }}" \
      --permanent || true
    firewall-cmd --reload || true
  become: yes
  args:
    executable: /bin/bash

- name: Verificar conectividad web DESDE client01
  uri:
    url: "{{ web_url }}"
    method: HEAD
    timeout: 5
  delegate_to: client01
  register: web_check
  failed_when: >
    (web_check.status is defined and web_check.status != 200)
    and (not inject_expected)
  ignore_errors: "{{ inject_expected }}"

- name: Confirmar estado esperado de conectividad
  debug:
    msg: >-
      {% if inject_expected %}
      ✓ INCIDENCIA INYECTADA CORRECTAMENTE:
      El acceso a {{ web_url }} desde client01 está BLOQUEADO (esperado)
      {% else %}
      ✓ BASELINE OK:
      El acceso a {{ web_url }} desde client01 funciona correctamente
      {% endif %}


- name: Confirmar baseline OK (curl funciona)
  debug:
    msg: "✓ BASELINE OK: {{ test_command }} responde desde client01 ({{ global_web_port }})"
  when: baseline_check.status == 200
