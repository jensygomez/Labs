---
# ==============================================================================
# J03 | VARIANT 2 — IP Estática Errónea (nmcli) + TICKET EMBEBIDO
# ==============================================================================
# INCIDENTE:
#   Servicio web inaccesible desde client01
#   Causa real: IP del servidor cambiada fuera del rango esperado
#
# ESTADO ESPERADO PREVIO:
#   - nginx/httpd LISTEN OK
#   - Firewall OK
#   - IP: {{ global_web_ip }} /24
#   - Acceso cliente → web01 FUNCIONABA
#
# 🎯 NUEVA ARQUITECTURA:
#   ✓ INJECT + TICKET en UN SOLO archivo
#   ✓ Sin paths relativos complicados
#   ✓ Ticket sincronizado con inyección
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. Detectar interfaz activa y asignar variables NMCLI
# ------------------------------------------------------------------------------
- name: V2 | Detectar interfaz activa automáticamente
  command: nmcli -t -f NAME,DEVICE connection show --active
  register: active_conns
  changed_when: false
  become: yes

- name: V2 | Asignar global_connection_name e interfaz
  set_fact:
    global_connection_name: "{{ (active_conns.stdout_lines[0].split(':'))[0] }}"
    global_interface: "{{ (active_conns.stdout_lines[0].split(':'))[1] }}"

# ------------------------------------------------------------------------------
# 1. Backup conexión actual
# ------------------------------------------------------------------------------
- name: V2 | Backup conexión actual
  command: nmcli connection show "{{ global_connection_name }}"
  register: nmcli_backup
  failed_when: false
  become: yes

# ------------------------------------------------------------------------------
# 2. Ruido secundario: cambiar gateway y métrica
# ------------------------------------------------------------------------------
- name: V2 | Cambiar gateway y métrica (ruido)
  shell: |
    nmcli connection modify "{{ global_connection_name }}" \
      ipv4.gateway "{{ global_wrong_gw }}" \
      ipv4.route-metric 999 \
      ipv4.never-default no
  args:
    executable: /bin/bash
  become: yes

# ------------------------------------------------------------------------------
# 3. CAUSA RAÍZ: quitar IP correcta y poner IP errónea
# ------------------------------------------------------------------------------
- name: V2 | CAUSA RAÍZ — cambiar IP correcta por IP incorrecta
  shell: |
    # Primero quitar la IP correcta si existe
    nmcli connection modify "{{ global_connection_name }}" \
      ipv4.addresses "{{ global_wrong_ip }}/24" \
      ipv4.gateway "{{ global_wrong_gw }}" \
      ipv4.method manual
    nmcli connection up "{{ global_connection_name }}"
  args:
    executable: /bin/bash
  become: yes


# ------------------------------------------------------------------------------
# 4. Ruido visual: ip route / resolv.conf confuso
# ------------------------------------------------------------------------------
- name: V2 | Mostrar rutas y DNS para confusión
  shell: |
    ip route
    cat /etc/resolv.conf
  register: network_info
  failed_when: false
  become: yes

# ------------------------------------------------------------------------------
# 5. Verificar servicio local
# ------------------------------------------------------------------------------
- name: V2 | Verificar nginx sigue vivo localmente
  uri:
    url: "http://localhost:{{ global_web_port }}"
    method: HEAD
    timeout: 5
  register: local_check
  failed_when: false

# ------------------------------------------------------------------------------
# 6. MOSTRAR TICKET AL ESTUDIANTE 🎫
# ------------------------------------------------------------------------------
- name: V2 | 🎫 MOSTRAR TICKET — Incidente NOC detectado
  debug:
    msg:
      - "==================================================================================================="
      - " 🚨 LAB J03 — INCIDENTE NOC CRÍTICO 🚨"
      - " VARIANTE 2: IP ESTÁTICA ERRÓNEA (nmcli)"
      - "==================================================================================================="
      - ""
      - "📋 ESCENARIO:"
      - "   Cliente client01 reporta \"No route to host\" hacia {{ web_url }}"
      - "   ✅ nginx localhost:{{ global_web_port }} sigue RESPONDIENDO 200 OK"
      - "   ❌ Pero desde client01 → No se puede conectar, IP del servidor incorrecta"
      - ""
      - "📍 DETALLES:"
      - "   IP actual: {{ global_wrong_ip }}/24"
      - "   Gateway: {{ global_wrong_gw }}"
      - "   Interfaz física: {{ global_interface }}"
      - "   Local check: {{ local_check.status | default('OK') }}"
      - "   Rutas y DNS:"
      - "{{ network_info.stdout_lines | join('\n   ') }}"
      - ""
      - "🔍 COMANDOS PARA DIAGNÓSTICO:"
      - "   nmcli con show {{ global_connection_name }}  → IP incorrecta ✗"
      - "   ip a                                     → IP fuera de rango ✗"
      - "   ip route                                 → Gateway / métricas sospechosas"
      - "   ss -tuln                                 → nginx LISTEN ✓"
      - "   firewall-cmd --list-all                  → Puerto OK ✓"
      - ""
      - "🎯 SOLUCIÓN ESPERADA:"
      - "   nmcli connection modify {{ global_connection_name }} ipv4.addresses {{ global_web_ip }}/24 ipv4.method manual"
      - "   nmcli connection up {{ global_connection_name }}"
      - ""
      - "👤 ACCESO: ssh student@192.168.122.22"
      - "==================================================================================================="
    verbosity: 0
  run_once: true
