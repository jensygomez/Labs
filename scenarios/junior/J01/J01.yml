# ==============================================================================
# J01 — User Access Breaks Critical Service
# Nivel: Junior
# Tipo: Ansible (Producción Educativa)
# ==============================================================================

# ------------------------------------------------------------------------------
# Selección de variante (motor)
# ------------------------------------------------------------------------------
- name: J01 | Seleccionar variante del incidente
  hosts: localhost
  gather_facts: false

  vars:
    variants:
      - variant_1.yml
      - variant_2.yml
      - variant_3.yml
      - variant_4.yml

    selected_variant: "{{ variant | default(variants | random) }}"

  tasks:
    - name: Registrar variante seleccionada
      set_fact:
        j01_variant: "{{ selected_variant }}"

    - name: Mostrar variante seleccionada (solo motor)
      debug:
        msg: "Variante seleccionada: {{ j01_variant }}"

# ------------------------------------------------------------------------------
# Mostrar ticket del incidente (todos los nodos)
# ------------------------------------------------------------------------------
- name: J01 | Mostrar ticket del incidente
  hosts: all
  gather_facts: false

  vars_files:
    - "tickets/{{ j01_variant }}"  # <-- CAMBIADO: quitado hostvars['localhost']

  tasks:
    - name: Mostrar ticket
      import_tasks: tasks/show_ticket.yml

# ------------------------------------------------------------------------------
# Preparar baseline del servicio (web)
# ------------------------------------------------------------------------------
- name: J01 | Preparar baseline del servicio
  hosts: web
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  tasks:
    - name: Preparar estado base
      import_tasks: tasks/base.yml

# ------------------------------------------------------------------------------
# Inyectar fallo según variante seleccionada (web)
# ------------------------------------------------------------------------------
- name: J01 | Inyectar fallo (variante seleccionada)
  hosts: web
  become: true
  gather_facts: false

  vars_files:
    - vars/main.yml

  tasks:
    - name: Ejecutar inyección de la variante
      include_tasks: "inject/{{ j01_variant }}"  # <-- CAMBIADO: quitado hostvars['localhost']

# ------------------------------------------------------------------------------
# Observación desde cliente
# ------------------------------------------------------------------------------
- name: J01 | Observación del impacto desde cliente
  hosts: client
  gather_facts: false

  tasks:
    - name: Verificar estado lógico del servicio
      shell: |
        systemctl status internal-api >/dev/null 2>&1 || echo "SERVICE DOWN"
      register: client_check
      changed_when: false
      ignore_errors: true

    - name: Mostrar resultado observado por el cliente
      debug:
        msg: "Resultado cliente: {{ client_check.stdout | default('sin respuesta') }}"

# ------------------------------------------------------------------------------
# FIN DEL LABORATORIO J01
# ------------------------------------------------------------------------------