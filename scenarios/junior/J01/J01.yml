# ==============================================================================
# J01 — User Access Breaks Critical Service
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CONFIGURACIÓN INICIAL (SOLO admin01)
# ------------------------------------------------------------------------------
- name: J01 | Configuración inicial
  hosts: admin01
  gather_facts: false

  tasks:
    # Cargar variables base
    - name: Cargar variables principales
      include_vars:
        file: vars/main.yml

    # Seleccionar variante
    - name: Seleccionar variante aleatoria
      set_fact:
        selected_variant_file: "{{ variants | random }}"
      run_once: yes

    # Cargar datos del ticket
    - name: Cargar datos de la variante
      include_vars:
        file: "tickets/{{ selected_variant_file }}"
        name: ticket_data

    # Hacer variables disponibles GLOBALMENTE
    - name: Establecer variables globales
      set_fact:
        global_variant: "{{ ticket_data.variant }}"
        global_selected_variant: "{{ selected_variant_file }}"
      run_once: yes

    - name: Mostrar selección
      debug:
        msg: "Variante: {{ global_selected_variant }}"

# ------------------------------------------------------------------------------
# 2. MOSTRAR TICKET (admin01, web01, client01 - SIN localhost)
# ------------------------------------------------------------------------------
- name: J01 | Mostrar ticket del incidente
  hosts: admin01,web01,client01  # <-- EXPLÍCITAMENTE los 3 hosts
  gather_facts: false

  tasks:
    - name: Cargar variables globales
      set_fact:
        variant: "{{ hostvars['admin01'].global_variant }}"

    - name: Mostrar ticket
      import_tasks: tasks/show_ticket.yml

# ------------------------------------------------------------------------------
# 3. PREPARAR BASELINE (solo web01)
# ------------------------------------------------------------------------------
- name: J01 | Preparar baseline del servicio
  hosts: web01
  become: true
  gather_facts: true

  tasks:
    - name: Cargar variables
      include_vars:
        file: vars/main.yml

    - name: Preparar estado base
      import_tasks: tasks/base.yml

# ------------------------------------------------------------------------------
# 4. INYECTAR FALLO (solo web01)
# ------------------------------------------------------------------------------
- name: J01 | Inyectar fallo
  hosts: web01
  become: true
  gather_facts: false

  tasks:
    - name: Cargar variables
      include_vars:
        file: vars/main.yml

    - name: Ejecutar inyección
      include_tasks: "inject/{{ hostvars['admin01'].global_selected_variant }}"

# ------------------------------------------------------------------------------
# 5. OBSERVACIÓN (solo client01)
# ------------------------------------------------------------------------------
- name: J01 | Observación del impacto
  hosts: client01
  gather_facts: false

  tasks:
    - name: Verificar servicio
      shell: |
        systemctl status {{ service_name }} >/dev/null 2>&1 || echo "SERVICE DOWN"
      register: service_status
      changed_when: false

    - name: Mostrar resultado
      debug:
        msg: "Estado desde cliente: {{ service_status.stdout }}"