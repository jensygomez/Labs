---
# ==============================================================================
# J01 – Laboratorio de Redes y Conectividad (Junior) - NOC Simulation
# ==============================================================================
#
# 🎯 TEMA PRINCIPAL
# Diagnóstico de problemas de red en un ecosistema Linux corporativo realista.
#
# 🎯 OBJETIVO
# Practicar troubleshooting sin pistas explícitas, simulando tickets NOC donde
# el usuario solo reporta síntomas ("no funciona"), nunca la causa.
#
# El foco está en:
#   - Observación
#   - Correlación de señales
#   - Diferenciar fallo real vs comportamiento por diseño
#
# ==============================================================================
# VARIANTES DISPONIBLES (selección aleatoria)
# ==============================================================================
#
# VARIANT_1.yml — Bloqueo ICMP (firewalld icmp_block)
#   ✓ Ping falla
#   ✓ HTTP y MariaDB funcionan
#   ✓ Lección: ICMP = diagnóstico, no servicio crítico
#
# VARIANT_2.yml — Traceroute incompleto (TTL exceeded filtrado)
#   ✓ traceroute falla en hop intermedio
#   ✓ Ping parcial funciona
#   ✓ Servicios OK
#   ✓ Lección: routing ≠ disponibilidad de servicio
#
# VARIANT_3.yml — TCP Keepalive / timeouts agresivos (HAProxy)
#   ✓ Conexión TCP se corta prematuramente
#   ✓ Ping funciona
#   ✓ Backend MariaDB está sano
#   ✓ Error percibido desde cliente
#   ✓ Lección: tuning TCP vs comportamiento de aplicación
#
# VARIANT_4.yml — MTU mismatch en cliente
#   ✓ Ping con paquetes grandes falla
#   ✓ Ping pequeños funciona
#   ✓ HTTP aparentemente OK
#   ✓ Lección: PMTU y fragmentación afectan servicios de forma sutil
#
# ==============================================================================
# FILOSOFÍA LINUX / NOC (Junior → Senior)
# ==============================================================================
# - Observa el ecosistema completo antes de tocar nada
# - ICMP y traceroute no definen disponibilidad de negocio
# - "Se cae" puede ser política, tuning o diseño
# - Prioriza impacto al negocio antes que métricas técnicas
# - Documenta: qué funciona, qué falla y por qué
#
# ==============================================================================
# ECOSISTEMA DEL LABORATORIO
# ==============================================================================
#
# CLIENT01
#   IP: 192.168.122.21
#
# SERVER_EU (una VM, múltiples VIPs)
#   - 192.168.122.22 → IP administrativa (SSH / gestión)
#   - 192.168.122.50 → WEB (Nginx / HTTP)
#   - 192.168.122.60 → MariaDB (Backend real)
#   - 192.168.122.70 → HAProxy (Proxy TCP)
#
# Flujo real de producción:
#   CLIENT → HAProxy (.70) → MariaDB (.60)
#   CLIENT → WEB (.50)
#
# ==============================================================================
# FLUJO REAL NOC
# ==============================================================================
# 1. Usuario reporta: "No hay conectividad"
# 2. NOC analiza síntomas, no asume causas
# 3. Se identifica impacto real en negocio
# 4. Se determina causa raíz
# 5. Se documenta lección aprendida
# ==============================================================================





- name: J01 - Orquestador de variantes de redes
  hosts: web
  become: yes 
  gather_facts: no

  vars:
    variantes:
#      - variant_1.yml
#      - variant_2.yml
#      - variant_3.yml
      - variant_4.yml


  tasks:
    - name: Elegir variante aleatoriamente
      set_fact:
        global_selected_variant: "{{ variantes | random }}"
      run_once: true

    - name: Debug - Verificar variante seleccionada
      debug:
        var: global_selected_variant
      run_once: true


    - name: Ejecutar la variante seleccionada
      include_tasks: "{{ global_selected_variant }}"
