# ==============================================================================
# J01 — USER ACCESS BREAKS CRITICAL SERVICE
# ==============================================================================
# 
# 🏢 PROPÓSITO: Laboratorio automatizado para RHCSA/EX200
#    Simula fallo crítico donde un cambio de permisos de usuario
#    rompe un servicio web crítico (nginx/apache + app personalizada)
#
# 🎯 OBJETIVO DEL ALUMNO:
#    1. Recibir ticket con servicio caído
#    2. Diagnosticar: systemctl + journalctl + permisos
#    3. Identificar: chown/chmod/SELinux corrupto
#    4. Recuperar servicio
#
# 🔄 FLUJO AUTOMÁTICO (5 fases):
#    1. admin01: Selecciona variante aleatoria + variables globales
#    2. web01:  Prepara baseline (servicio OK)
#    3. web01:  Inyecta fallo específico (permisos rotos)
#    4. web01:  Verifica estado final (SERVICE DOWN)
#    5. admin01: Genera ticket con datos reales del fallo
#
# 📁 ARCHIVOS NECESARIOS:
#    - vars/main.yml          → service_name, service_user, service_dir
#    - tickets/*.yml          → Datos de variantes (10+ escenarios)
#    - tasks/base.yml         → Estado baseline limpio
#    - tasks/show_ticket.yml  → Plantilla de ticket final
#    - inject/variant_XX.yml  → Inyección específica por escenario
#
# 🚀 USO:
#    ansible-playbook labs/J01/site.yml
#    → Genera ticket único cada ejecución
#
# =================================================================================


# ------------------------------------------------------------------------------
# 1. CONFIGURACIÓN INICIAL (SOLO admin01)
# ------------------------------------------------------------------------------
- name: J01 | Configuración inicial
  hosts: admin01
  gather_facts: false

  tasks:
    - name: Cargar variables principales
      include_vars:
        file: vars/main.yml

    - name: Seleccionar variante aleatoria
      set_fact:
        selected_variant_file: "{{ variants | random }}"
      run_once: yes

    - name: Cargar datos de la variante
      include_vars:
        file: "tickets/{{ selected_variant_file }}"
        name: ticket_data

    - name: Establecer variables globales
      set_fact:
        global_variant: "{{ ticket_data.variant }}"
        global_selected_variant: "{{ selected_variant_file }}"
      run_once: yes

# ------------------------------------------------------------------------------
# 2. PREPARAR BASELINE
# ------------------------------------------------------------------------------
- name: J01 | Preparar baseline del servicio
  hosts: web01
  become: true
  gather_facts: true

  tasks:
    - name: Cargar variables
      include_vars:
        file: vars/main.yml

    - name: Preparar estado base
      import_tasks: tasks/base.yml

# ------------------------------------------------------------------------------
# 3. INYECTAR FALLO
# ------------------------------------------------------------------------------
- name: J01 | Inyectar fallo
  hosts: web01
  become: true
  gather_facts: false

  tasks:
    - name: Cargar variables
      include_vars:
        file: vars/main.yml

    - name: Ejecutar inyección
      include_tasks: "inject/{{ hostvars['admin01'].global_selected_variant }}"

# ------------------------------------------------------------------------------
# 4. VERIFICAR SERVICIO
# ------------------------------------------------------------------------------
- name: J01 | Verificar estado del servicio
  hosts: web01
  become: true
  gather_facts: false

  tasks:
    - name: Comprobar estado real del servicio
      systemd:
        name: "{{ service_name }}"
      register: service_status
      failed_when: false
      changed_when: false

    - name: Determinar estado para ticket
      set_fact:
        final_state: "{{ 'SERVICE DOWN' if (service_status is failed or (service_status.status is defined and service_status.status.ActiveState != 'active')) else 'SERVICE DOWN (baseline)' }}"
      delegate_to: admin01
      run_once: yes

# ------------------------------------------------------------------------------
# 5. MOSTRAR TICKET FINAL
# ------------------------------------------------------------------------------
- name: J01 | Mostrar resumen final
  hosts: admin01
  gather_facts: false

  tasks:
    - name: Preparar variables para TU show_ticket.yml
      set_fact:
        variant: "{{ hostvars['admin01'].global_variant }}"
        selected_variant_file: "{{ hostvars['admin01'].global_selected_variant }}"
        final_state: "{{ hostvars['admin01'].final_state | default('SERVICE DOWN') }}"
        service_user: "{{ hostvars['admin01'].service_user }}"
        service_name: "{{ hostvars['admin01'].service_name }}"
        service_dir: "{{ hostvars['admin01'].service_dir }}"

    - name: IMPORTAR TU show_ticket.yml EXISTENTE
      import_tasks: tasks/show_ticket.yml
      run_once: yes
