# ==============================================================================
# J01 — User Access Breaks Critical Service
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. PRIMERO: Cargar variables base (IMPORTANTE)
# ------------------------------------------------------------------------------
- name: J01 | Cargar configuración base
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Cargar variables principales
      include_vars:
        file: vars/main.yml

    - name: Definir service_name para contexto global
      set_fact:
        service_name: "{{ service_name }}"
        service_user: "{{ service_user }}"
        service_dir: "{{ service_dir }}"
      run_once: yes

# ------------------------------------------------------------------------------
# 1. Seleccionar y cargar variante (AHORA las variables están definidas)
# ------------------------------------------------------------------------------
- name: J01 | Cargar variante del incidente
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Seleccionar variante aleatoria
      set_fact:
        selected_variant_file: "{{ variants | random }}"
      run_once: yes

    - name: Cargar datos de la variante
      include_vars:
        file: "tickets/{{ selected_variant_file }}"
        name: ticket_data

    - name: Crear variable global 'variant'
      set_fact:
        variant: "{{ ticket_data.variant }}"
      run_once: yes

    - name: Mostrar selección
      debug:
        msg: "Variante cargada: {{ selected_variant_file }}"

# ------------------------------------------------------------------------------
# 2. Mostrar ticket a TODOS los hosts
# ------------------------------------------------------------------------------
- name: J01 | Mostrar ticket del incidente
  hosts: all
  gather_facts: false

  tasks:
    - name: Mostrar ticket
      import_tasks: tasks/show_ticket.yml

# ------------------------------------------------------------------------------
# 3. Preparar baseline (web)
# ------------------------------------------------------------------------------
- name: J01 | Preparar baseline del servicio
  hosts: web
  become: true
  gather_facts: true

  tasks:
    - name: Cargar variables para web
      include_vars:
        file: vars/main.yml

    - name: Preparar estado base
      import_tasks: tasks/base.yml

# ------------------------------------------------------------------------------
# 4. Inyectar fallo (web)
# ------------------------------------------------------------------------------
- name: J01 | Inyectar fallo
  hosts: web
  become: true
  gather_facts: false

  tasks:
    - name: Cargar variables para inyección
      include_vars:
        file: vars/main.yml

    - name: Ejecutar inyección
      include_tasks: "inject/{{ hostvars['localhost'].selected_variant_file }}"

# ------------------------------------------------------------------------------
# 5. Observación (cliente)
# ------------------------------------------------------------------------------
- name: J01 | Observación del impacto
  hosts: client
  gather_facts: false

  tasks:
    - name: Verificar servicio
      shell: |
        systemctl status {{ service_name }} >/dev/null 2>&1 || echo "SERVICE DOWN"
      register: client_check
      changed_when: false

    - name: Mostrar resultado
      debug:
        msg: "Resultado: {{ client_check.stdout }}"