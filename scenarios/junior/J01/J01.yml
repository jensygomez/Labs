# ==============================================================================
# J01 — User Access Breaks Critical Service
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CONFIGURACIÓN INICIAL (en admin01)
# ------------------------------------------------------------------------------
- name: J01 | Configuración inicial
  hosts: admin01
  gather_facts: false

  tasks:
    # Cargar variables base
    - name: Cargar variables principales
      include_vars:
        file: vars/main.yml

    # Seleccionar variante
    - name: Seleccionar variante aleatoria
      set_fact:
        selected_variant_file: "{{ variants | random }}"
      run_once: yes

    # Cargar datos del ticket (las variables ya están cargadas)
    - name: Cargar datos de la variante
      include_vars:
        file: "tickets/{{ selected_variant_file }}"
        name: ticket_data

    # Hacer 'variant' disponible en admin01
    - name: Establecer variable 'variant' en admin01
      set_fact:
        variant: "{{ ticket_data.variant }}"

    # Propagarla a todos los hosts
    - name: Propagar 'variant' a todos los hosts
      set_fact:
        variant: "{{ hostvars['admin01'].variant }}"
      delegate_to: "{{ item }}"
      loop: "{{ groups['all'] }}"

    - name: Mostrar selección
      debug:
        msg: "Variante seleccionada: {{ selected_variant_file }}"

# ------------------------------------------------------------------------------
# 2. MOSTRAR TICKET (todos ven el mismo ticket)
# ------------------------------------------------------------------------------
- name: J01 | Mostrar ticket del incidente
  hosts: all
  gather_facts: false

  tasks:
    - name: Mostrar ticket
      import_tasks: tasks/show_ticket.yml

# ------------------------------------------------------------------------------
# 3. PREPARAR BASELINE (solo web01)
# ------------------------------------------------------------------------------
- name: J01 | Preparar baseline del servicio
  hosts: web01
  become: true
  gather_facts: true

  tasks:
    - name: Cargar variables para web01
      include_vars:
        file: vars/main.yml

    - name: Preparar estado base
      import_tasks: tasks/base.yml

# ------------------------------------------------------------------------------
# 4. INYECTAR FALLO (solo web01, según variante)
# ------------------------------------------------------------------------------
- name: J01 | Inyectar fallo
  hosts: web01
  become: true
  gather_facts: false

  tasks:
    - name: Cargar variables para inyección
      include_vars:
        file: vars/main.yml

    - name: Ejecutar inyección de fallo
      include_tasks: "inject/{{ hostvars['admin01'].selected_variant_file }}"

# ------------------------------------------------------------------------------
# 5. OBSERVACIÓN (solo client01)
# ------------------------------------------------------------------------------
- name: J01 | Observación del impacto
  hosts: client01
  gather_facts: false

  tasks:
    - name: Verificar estado del servicio
      shell: |
        systemctl status {{ service_name }} >/dev/null 2>&1 || echo "SERVICE DOWN"
      register: service_status
      changed_when: false
      ignore_errors: yes

    - name: Mostrar resultado de la observación
      debug:
        msg: "Estado del servicio desde cliente: {{ service_status.stdout }}"