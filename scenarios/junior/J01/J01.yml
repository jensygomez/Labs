---
# ==============================================================================
# J01 – Laboratorio de Redes y Conectividad (Junior)
# ==============================================================================
#
# Tema principal: Diagnóstico de problemas de red en un ecosistema Linux corporativo
#
# Objetivo:
# Practicar troubleshooting de conectividad y servicios en un entorno Linux
# realista, comprendiendo el impacto de cada componente del ecosistema:
# cliente, servidor, firewall y servicios críticos.
#
# Este playbook selecciona aleatoriamente un escenario de laboratorio (variante)
# sin revelar qué se rompió, simulando la incertidumbre que se vive en un NOC
# o en una entrevista técnica.
#
# Filosofía Linux / Perspectiva Senior:
# - Un sysadmin senior observa el ecosistema completo antes de actuar.
# - No se enfoca en comandos inmediatos, sino en entender la raíz del problema.
# - Diferencia protocolos, servicios y conectividad: ICMP vs TCP/UDP, puertos,
#   VIPs, firewalld y servicios activos.
# - Evalúa impacto real en usuarios y aplicaciones antes de “arreglar” algo.
# - Documenta, reflexiona y planifica su diagnóstico paso a paso.
#
# Ecosistema:
# CLIENT01 (192.168.122.21) -> Cliente que realiza pruebas
# SERVER_EU (192.168.122.22) -> Servidor
#   - VIP 192.168.122.50: Nginx HTTP
#   - VIP 192.168.122.60: MariaDB TCP 3306
#   - Firewalld activo controlando acceso
#
# Objetivos de aprendizaje:
# 1. Observar y comprender el ecosistema antes de actuar.
# 2. Diferenciar protocolos y servicios.
# 3. Analizar impacto de fallos en el entorno corporativo.
# 4. Practicar documentación clara y pensamiento crítico.
# ==============================================================================

- name: J01 - Orquestador de variantes de redes
  hosts: localhost
  gather_facts: no

  vars:
    variantes:
      - "variant_1.yml"
      - "variant_2.yml"
      - "variant_3.yml"
      - "variant_4.yml"

  tasks:
    - name: Elegir una variante aleatoriamente
      set_fact:
        variante_elegida: "{{ variantes | random }}"

    - name: Mensaje filosófico Linux (caja ASCII)
      debug:
        msg: |
          +---------------------------------------------------------+
          | J01 – Laboratorio de Redes                              |
          | Junior, recuerda que en Linux todo es un ecosistema...  |
          | - Clientes, servidores, firewalls interactúan.         |
          | - Evalúa impacto antes de actuar.                      |
          | - Documenta y reflexiona antes de ejecutar acciones.   |
          +---------------------------------------------------------+




    




    - name: Esperar que el usuario presione Enter para continuar
      pause:
        prompt: "Presiona ENTER para continuar con la siguiente tarea..."

          

    - name: Ejecutar la variante seleccionada
      include_tasks: "{{ variante_elegida }}"
