---
# ==============================================================================
# J01 — User Access Breaks Critical Service
# Nivel: Junior
# Tipo: Ansible (Producción)
# ==============================================================================

# ------------------------------------------------------------------------------
- name: J01 | Seleccionar variante
  hosts: localhost
  gather_facts: false

  vars:
    variants:
      - variant_1.yml    
      - variant_2.yml   
      - variant_3.yml   
      - variant_4.yml   

    selected_variant: "{{ variant | default(variants | random) }}"

  tasks:
    - name: Guardar variante seleccionada
      set_fact:
        j01_variant: "{{ selected_variant }}"

# ------------------------------------------------------------------------------
- name: J01 | Mostrar ticket del incidente
  hosts: all
  gather_facts: false

  vars_files:
    - "tickets/{{ hostvars['localhost'].j01_variant }}"

  tasks:
    - import_tasks: tasks/show_ticket.yml

# ------------------------------------------------------------------------------
- name: J01 | Preparar baseline del servicio
  hosts: web
  become: true
  vars_files:
    - vars/main.yml

  tasks:
    - import_tasks: tasks/base.yml

# ------------------------------------------------------------------------------
- name: J01 | Inyectar fallo (variante seleccionada)
  hosts: web
  become: true
  vars_files:
    - vars/main.yml

  tasks:
    - name: Ejecutar variante
      import_tasks: "tasks/{{ hostvars['localhost'].j01_variant }}"

# ------------------------------------------------------------------------------
- name: J01 | Observación desde cliente
  hosts: client
  gather_facts: false

  tasks:
    - name: Probar acceso lógico al servicio (simulado)
      shell: systemctl status internal-api >/dev/null 2>&1 || echo "SERVICE DOWN"
      changed_when: false
      register: client_check
      ignore_errors: true

    - name: Resultado observado por el cliente
      debug:
        msg: "Resultado cliente: {{ client_check.stdout | default('sin respuesta') }}"

# ------------------------------------------------------------------------------
# FIN DEL LABORATORIO
# ------------------------------------------------------------------------------
