# ==============================================================================
# J01 — User Access Breaks Critical Service
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Seleccionar y cargar variante (TODO en localhost)
# ------------------------------------------------------------------------------
- name: J01 | Cargar variante del incidente
  hosts: localhost
  gather_facts: false

  vars:
    variants:
      - variant_1.yml
      - variant_2.yml
      - variant_3.yml
      - variant_4.yml

  tasks:
    - name: Seleccionar variante aleatoria
      set_fact:
        selected_variant_file: "{{ variants | random }}"
      run_once: yes

    - name: Cargar datos de la variante
      include_vars:
        file: "tickets/{{ selected_variant_file }}"
        name: loaded_data

    - name: Crear variable global 'variant'
      set_fact:
        variant: "{{ loaded_data.variant }}"
      run_once: yes

    - name: Crear variable global 'selected_variant' (para inyección)
      set_fact:
        selected_variant: "{{ selected_variant_file }}"
      run_once: yes

    - name: Mostrar selección
      debug:
        msg: "Variante cargada: {{ selected_variant_file }}"

# ------------------------------------------------------------------------------
# 2. Mostrar ticket a TODOS los hosts
# ------------------------------------------------------------------------------
- name: J01 | Mostrar ticket del incidente
  hosts: all
  gather_facts: false

  tasks:
    - name: Mostrar ticket
      import_tasks: tasks/show_ticket.yml

# ------------------------------------------------------------------------------
# 3. Preparar baseline (web)
# ------------------------------------------------------------------------------
- name: J01 | Preparar baseline del servicio
  hosts: web
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  tasks:
    - name: Preparar estado base
      import_tasks: tasks/base.yml

# ------------------------------------------------------------------------------
# 4. Inyectar fallo (web) - AHORA CON selected_variant
# ------------------------------------------------------------------------------
- name: J01 | Inyectar fallo
  hosts: web
  become: true
  gather_facts: false

  vars_files:
    - vars/main.yml

  tasks:
    - name: Ejecutar inyección
      include_tasks: "inject/{{ hostvars['localhost'].selected_variant }}"

# ------------------------------------------------------------------------------
# 5. Observación (cliente)
# ------------------------------------------------------------------------------
- name: J01 | Observación del impacto
  hosts: client
  gather_facts: false

  tasks:
    - name: Verificar servicio
      shell: |
        systemctl status internal-api >/dev/null 2>&1 || echo "SERVICE DOWN"
      register: client_check
      changed_when: false

    - name: Mostrar resultado
      debug:
        msg: "Resultado: {{ client_check.stdout }}"