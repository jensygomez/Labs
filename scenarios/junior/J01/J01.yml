# ==============================================================================
# J01 — User Access Breaks Critical Service
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CONFIGURACIÓN INICIAL (SOLO admin01)
# ------------------------------------------------------------------------------
- name: J01 | Configuración inicial
  hosts: admin01
  gather_facts: false

  tasks:
    - name: Cargar variables principales
      include_vars:
        file: vars/main.yml

    - name: Seleccionar variante aleatoria
      set_fact:
        selected_variant_file: "{{ variants | random }}"
      run_once: yes

    - name: Cargar datos de la variante
      include_vars:
        file: "tickets/{{ selected_variant_file }}"
        name: ticket_data

    - name: Establecer variables globales
      set_fact:
        global_variant: "{{ ticket_data.variant }}"
        global_selected_variant: "{{ selected_variant_file }}"
      run_once: yes

# ------------------------------------------------------------------------------
# 2. PREPARAR BASELINE (solo web01)
# ------------------------------------------------------------------------------
- name: J01 | Preparar baseline del servicio
  hosts: web01
  become: true
  gather_facts: true

  tasks:
    - name: Cargar variables
      include_vars:
        file: vars/main.yml

    - name: Preparar estado base
      import_tasks: tasks/base.yml

# ------------------------------------------------------------------------------
# 3. INYECTAR FALLO (solo web01)
# ------------------------------------------------------------------------------
- name: J01 | Inyectar fallo
  hosts: web01
  become: true
  gather_facts: false

  tasks:
    - name: Cargar variables
      include_vars:
        file: vars/main.yml

    - name: Ejecutar inyección
      include_tasks: "inject/{{ hostvars['admin01'].global_selected_variant }}"

# ------------------------------------------------------------------------------
# 4. OBSERVACIÓN (solo client01) - FIX SERVICE UNKNOWN
# ------------------------------------------------------------------------------
# 4. VERIFICAR SERVICIO (web01 → admin01)
- name: J01 | Verificar estado del servicio
  hosts: web01
  become: true
  gather_facts: false
  tasks:
    - name: Comprobar estado real
      systemd:
        name: "{{ service_name }}"
      register: service_status
      failed_when: false

    - name: Determinar estado para ticket
      set_fact:
        final_state: "{{ 'SERVICE DOWN' if (service_status is failed or service_status.status.ActiveState != 'active') else 'SERVICE OK (baseline)' }}"
      delegate_to: admin01
      run_once: yes

# ------------------------------------------------------------------------------
# 5. MOSTRAR TICKET (tu show_ticket.yml renderizado en admin01)
# ------------------------------------------------------------------------------

- name: J01 | Mostrar ticket final
  hosts: admin01
  tasks:
    - name: Preparar variables
      set_fact:
        variant: "{{ hostvars['admin01'].global_variant }}"
        selected_variant_file: "{{ hostvars['admin01'].global_selected_variant }}"
        service_user: "{{ service_user }}"
        service_name: "{{ service_name }}"
        service_dir: "{{ service_dir }}"

    - name: Renderizar TU show_ticket.yml en admin01
      shell: |
        cat > /tmp/J01_ticket.txt << EOF
{{ lookup('template', 'tasks/show_ticket.yml') | regex_replace('debug:\\s*msg:\\s*\\|', '') }}
EOF
        clear && cat /tmp/J01_ticket.txt && echo "🔧 SSH web01: ssh student@{{ hostvars['web01'].ansible_host }}"
      args:
        executable: /bin/bash
      run_once: yes
