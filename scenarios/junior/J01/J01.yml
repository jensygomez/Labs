---
# ==============================================================================
# J01 – Laboratorio de Redes y Conectividad (Junior) - NOC Simulation
# ==============================================================================
#
# Tema principal: Diagnóstico de problemas de red en ecosistema Linux corporativo
#
# Objetivo: 
# Practicar troubleshooting realista sin pistas, simulando tickets NOC donde
# el usuario nunca dice "lo que hay que hacer", solo "lo que no funciona".
#
# VARIA NTES DISPONIBLES (selección aleatoria):
# -----------------------------------------------------------------------------
# VARIANT_1.yml: Bloqueo ICMP echo-request (firewalld icmp_block)
#   ✓ Ping falla → "Pacote filtrado" 
#   ✓ HTTP/MariaDB funcionan normalmente
#   ✓ Lección: ICMP=diagnóstico ≠ servicios críticos
#
# VARIANT_2.yml: Bloqueo traceroute (firewalld TTL exceeded) 
#   ✓ traceroute falla en hop intermedio
#   ✓ Ping parcial funciona
#   ✓ HTTP/MariaDB normales
#   ✓ Lección: Routing vs conectividad servicios
#
# VARIANT_3.yml: Keepalive TCP conexión cerrada prematura
#   ✓ HTTP responde 200 pero cierra conexión rápido
#   ✓ Ping funciona
#   ✓ MariaDB OK
#   ✓ Lección: TCP stack tuning vs aplicación
#
# VARIANT_4.yml: MTU mismatch en cliente (Path MTU Discovery fallido)
#   ✓ Ping con paquetes grandes falla
#   ✓ Ping pequeños funciona
#   ✓ HTTP funciona (paquetes pequeños)
#   ✓ Lección: Fragmentación vs servicios reales
#
# -----------------------------------------------------------------------------
#
# Filosofía Linux Senior:
# - Observa el ecosistema COMPLETO antes de tocar nada
# - ICMP/traceroute ≠ Servicios críticos TCP/UDP
# - "No responde" puede ser diseño, no fallo
# - Siempre valida impacto NEGOCIO primero
# - Documenta TODO: qué probaste, qué funciona, qué NO
#
# Ecosistema lab:
# CLIENT01 (192.168.122.21) → WEB(192.168.122.50) + DB(192.168.122.60)
# Firewalld → Nginx → MariaDB → Keepalived VIPs
#
# Flujo real NOC:
# 1. Usuario: "No funciona conectividad"
# 2. Senior: Observa TODO el ecosistema
# 3. Diagnóstico: Causa raíz + impacto real
# 4. Documenta: Hallazgo + lección aprendida
# ==============================================================================




- name: J01 - Orquestador de variantes de redes
  hosts: web
  become: yes 
  gather_facts: no

  vars:
    variantes:
      - variant_2.yml


  tasks:
    - name: Elegir variante aleatoriamente
      set_fact:
        global_selected_variant: "{{ variantes | random }}"
      run_once: true

    - name: Debug - Verificar variante seleccionada
      debug:
        var: global_selected_variant
      run_once: true

    - name: Mostrar comandos de prueba desde CLIENT01 (solo VARIANT_2)
      debug:
        msg:
          - "======================================================"
          - "📌 Comandos de prueba recomendados"
          - "======================================================"
          - "traceroute -n 192.168.122.50"
          - "ping -c 4 192.168.122.50"
          - "curl http://192.168.122.50"
          - "mysql -h 192.168.122.60 -u root -p"
          - "======================================================"
      when: global_selected_variant == 'variant_2.yml'
      run_once: true

    - name: Mostrar ticket con estilo caja
      debug:
        msg:
          - "========================================================================"
          - "|                  J01 – Laboratorio de Redes                           |"
          - "-------------------------------------------------------------------------"
          - "| Jensy, recuerda que Linux es un ecosistema interconectado             |"
          - "| - Clientes, servidores, firewalls interactúan.                        |"
          - "| - Un fallo en la conectividad no siempre significa un servicio caído. |"
          - "| - Diferencia protocolos y evalúa el impacto antes de actuar.          |"
          - "========================================================================="


    - name: Mostrar comandos de prueba desde CLIENT01 (solo VARIANT_2)
      debug:
        msg:
          - "======================================================"
          - "📌 Comandos de prueba recomendados para VARIANT_2:"
          - "======================================================"
          - "traceroute -n 192.168.122.50"
          - "ping -c 4 192.168.122.50"
          - "curl http://192.168.122.50"
          - "mysql -h 192.168.122.60 -u root -p"
          - "======================================================"
      when: global_selected_variant == 'variant_2.yml'
      run_once: true


    - name: Esperar que el usuario presione Enter
      pause:
        prompt: "Presiona ENTER para continuar..."

    - name: Ejecutar la variante seleccionada
      include_tasks: "{{ global_selected_variant }}"
