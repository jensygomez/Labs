#cloud-config
###############################################################################
# ROLE: DB (MariaDB)
# LAB : J01 (Junior)
# VM  : Database Server
#
# PROPÓSITO
# ----------
# Este archivo define el estado BASE y SALUDABLE de la VM de Base de Datos.
# NO instala paquetes. NO redefine arquitectura.
#
# La imagen base (rocky-ir-base-junior-v1.qcow2) ya contiene:
# - mariadb-server instalado
# - bind-address = 0.0.0.0 configurado
# - base de datos appdb
# - usuario appuser con permisos
# - firewalld activo con puerto 3306/tcp permitido
# - SELinux en modo Enforcing
#
# Estado inicial esperado (Punto Cero):
# - mariadb: disabled / stopped
#
# Este rol se limita a:
# - Configurar red estática
# - Activar el servicio MariaDB
# - Validar accesibilidad y estado del servicio
###############################################################################

###############################################################################
# METADATOS DEL ROL (TRAZABILIDAD OPERATIVA)
###############################################################################
write_files:
  - path: /etc/lab/role
    permissions: "0644"
    content: |
      ROLE=db
      LAB=J01
      LEVEL=junior
      EXPECTED_SERVICE=mariadb
      EXPECTED_PORT=3306
      DB_NAME=appdb
      DB_USER=appuser

###############################################################################
# COMANDOS DE CONFIGURACIÓN Y ARRANQUE
###############################################################################
runcmd:
  # ---------------------------------------------------------------------------
  # 1. Configuración de red estática
  # ---------------------------------------------------------------------------
  # Red laboratorio: 192.168.122.0/24
  # IP DB Server   : 192.168.122.60
  # Gateway/DNS    : 192.168.122.1
  # ---------------------------------------------------------------------------

  - |
    echo "[DB] Configurando red estática..."
    nmcli connection modify "enp1s0" \
      ipv4.method manual \
      ipv4.addresses 192.168.122.60/24 \
      ipv4.gateway 192.168.122.1 \
      ipv4.dns 192.168.122.1

  - nmcli connection down "enp1s0"
  - nmcli connection up "enp1s0"

  # Validaciones básicas de red
  - ip a show enp1s0 || true
  - ip route || true

  # ---------------------------------------------------------------------------
  # 2. Activación del servicio MariaDB
  # ---------------------------------------------------------------------------
  # MariaDB ya está inicializado y configurado en la imagen base.
  # Aquí únicamente se habilita y se inicia.
  # ---------------------------------------------------------------------------

  - |
    echo "[DB] Habilitando e iniciando MariaDB..."
    systemctl enable mariadb
    systemctl start mariadb

  # ---------------------------------------------------------------------------
  # 3. Validaciones operativas
  # ---------------------------------------------------------------------------
  # No abortan el boot. Sirven para diagnóstico temprano.
  # ---------------------------------------------------------------------------

  - |
    echo "[DB] Validando estado del servicio MariaDB..."
    systemctl --no-pager status mariadb || true

  - |
    echo "[DB] Validando puerto 3306..."
    ss -lntp | grep ':3306' || true

  - |
    echo "[DB] Validando acceso lógico a la base de datos..."
    mysql -e "SHOW DATABASES;" || true

###############################################################################
# NOTAS DE ARQUITECTURA
# -----------------------------------------------------------------------------
# - El cliente NUNCA debe conectarse directamente a MariaDB.
# - El acceso remoto existe únicamente para:
#   - tests de red
#   - HAProxy
# - Cualquier fallo de conectividad o autenticación debe introducirse
#   EXCLUSIVAMENTE desde variants/V0x.yaml.
###############################################################################
