#cloud-config
###############################################################################
# ROLE: PROXY
# LAB : J01 (Junior)
# VM  : Proxy / Entry Point
#
# PROPÓSITO
# ----------
# Este nodo representa el punto de entrada del usuario al laboratorio.
# Todo acceso HTTP debe pasar por esta VM.
#
# Implementación:
# - HAProxy (Layer 7 HTTP)
# - Backend único: web.lab.local:80
#
# Estado inicial:
# - Servicio habilitado y funcional
# - Sin fallos intencionados
###############################################################################

###############################################################################
# METADATOS DEL ROL
###############################################################################
write_files:
  - path: /etc/lab/role
    permissions: "0644"
    content: |
      ROLE=proxy
      LAB=J01
      LEVEL=junior
      ENTRYPOINT=true
      EXPECTED_SERVICE=haproxy
      FRONTEND_PORT=80
      BACKEND=web.lab.local:80

###############################################################################
# CONFIGURACIÓN HAProxy
###############################################################################
write_files:
  - path: /etc/haproxy/haproxy.cfg
    permissions: "0644"
    content: |
      global
          log /dev/log local0
          log /dev/log local1 notice
          daemon
          maxconn 2048

      defaults
          log     global
          mode    http
          option  httplog
          option  dontlognull
          timeout connect 5s
          timeout client  30s
          timeout server  30s

      frontend http_front
          bind *:80
          default_backend web_backend

      backend web_backend
          balance roundrobin
          server web1 web.lab.local:80 check

###############################################################################
# COMANDOS DE CONFIGURACIÓN
###############################################################################
runcmd:
  # ---------------------------------------------------------------------------
  # 1. Configuración de red estática
  # ---------------------------------------------------------------------------
  - |
    echo "[PROXY] Configurando red estática..."
    nmcli connection modify "enp1s0" \
      ipv4.method manual \
      ipv4.addresses 192.168.122.70/24 \
      ipv4.gateway 192.168.122.1 \
      ipv4.dns 192.168.122.53

  - nmcli connection down "enp1s0"
  - nmcli connection up "enp1s0"

  - ip a show enp1s0 || true
  - ip route || true

  # ---------------------------------------------------------------------------
  # 2. Firewall
  # ---------------------------------------------------------------------------
  - |
    echo "[PROXY] Configurando firewall..."
    firewall-cmd --permanent --add-service=http
    firewall-cmd --reload
    firewall-cmd --list-all || true

  # ---------------------------------------------------------------------------
  # 3. Activación de HAProxy
  # ---------------------------------------------------------------------------
  - |
    echo "[PROXY] Habilitando HAProxy..."
    systemctl enable haproxy
    systemctl restart haproxy

  # ---------------------------------------------------------------------------
  # 4. Validaciones operativas
  # ---------------------------------------------------------------------------
  - |
    echo "[PROXY] Estado del servicio..."
    systemctl --no-pager status haproxy || true

  - |
    echo "[PROXY] Validando puerto 80..."
    ss -lntup | grep ':80' || true

  - |
    echo "[PROXY] Test HTTP local..."
    curl -I http://localhost || true

###############################################################################
# NOTAS OPERATIVAS
# -----------------------------------------------------------------------------
# - El cliente SIEMPRE accede al sistema vía esta VM.
# - La VM web NO es accesible directamente por el usuario.
# - Problemas de forwarding, DNS, backend caído, puertos incorrectos
#   se implementan exclusivamente en variants/V0x.yaml.
###############################################################################
