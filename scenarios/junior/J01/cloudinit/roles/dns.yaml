#cloud-config
###############################################################################
# ROLE: DNS
# LAB : J01 (Junior)
# VM  : DNS Server
#
# PROPÓSITO
# ----------
# Este archivo define el estado BASE y SALUDABLE del servidor DNS del laboratorio.
# NO introduce fallos. NO instala paquetes.
#
# El DNS se usa como dependencia transversal:
# - Web
# - DB
# - Proxy
#
# Todas las VMs deben resolver nombres vía este servidor.
#
# Implementación:
# - dnsmasq simple (forward + registros estáticos)
# - Pensado para troubleshooting de red, no para diseño DNS complejo
###############################################################################

###############################################################################
# METADATOS DEL ROL (TRAZABILIDAD)
###############################################################################
write_files:
  - path: /etc/lab/role
    permissions: "0644"
    content: |
      ROLE=dns
      LAB=J01
      LEVEL=junior
      EXPECTED_SERVICE=dnsmasq
      EXPECTED_PORT=53
      DOMAIN=lab.local

###############################################################################
# ARCHIVOS DE CONFIGURACIÓN DNS
###############################################################################
write_files:
  - path: /etc/dnsmasq.d/lab.conf
    permissions: "0644"
    content: |
      # DNS interno del laboratorio J01
      domain=lab.local
      local=/lab.local/

      # Registros estáticos
      address=/web.lab.local/192.168.122.50
      address=/db.lab.local/192.168.122.60
      address=/dns.lab.local/192.168.122.53
      address=/proxy.lab.local/192.168.122.70

      # Escuchar solo en la red del lab
      listen-address=127.0.0.1,192.168.122.53
      bind-interfaces

###############################################################################
# COMANDOS DE CONFIGURACIÓN
###############################################################################
runcmd:
  # ---------------------------------------------------------------------------
  # 1. Configuración de red estática
  # ---------------------------------------------------------------------------
  - |
    echo "[DNS] Configurando red estática..."
    nmcli connection modify "enp1s0" \
      ipv4.method manual \
      ipv4.addresses 192.168.122.53/24 \
      ipv4.gateway 192.168.122.1 \
      ipv4.dns 127.0.0.1

  - nmcli connection down "enp1s0"
  - nmcli connection up "enp1s0"

  - ip a show enp1s0 || true
  - ip route || true

  # ---------------------------------------------------------------------------
  # 2. Activación del servicio DNS
  # ---------------------------------------------------------------------------
  - |
    echo "[DNS] Habilitando e iniciando dnsmasq..."
    systemctl enable dnsmasq
    systemctl restart dnsmasq

  # ---------------------------------------------------------------------------
  # 3. Validaciones operativas
  # ---------------------------------------------------------------------------
  - |
    echo "[DNS] Validando servicio dnsmasq..."
    systemctl --no-pager status dnsmasq || true

  - |
    echo "[DNS] Validando puerto 53..."
    ss -lntup | grep ':53' || true

  - |
    echo "[DNS] Resolución de prueba (web.lab.local)..."
    dig @127.0.0.1 web.lab.local +short || true

###############################################################################
# NOTAS OPERATIVAS
# -----------------------------------------------------------------------------
# - Todas las VMs del laboratorio deben usar este DNS.
# - Fallos de resolución, registros incorrectos o servicio caído
#   deben implementarse EXCLUSIVAMENTE en variants/V0x.yaml.
# - Este rol representa el estado IDEAL del DNS.
###############################################################################
