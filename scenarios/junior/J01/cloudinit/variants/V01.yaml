#cloud-config
###############################################################################
# VARIANT: V01
# LAB    : J01 – Redes y Conectividad
# NIVEL  : Junior
#
# INCIDENTE
# ----------
# "El sitio no responde y no puedo hacer ping al servidor web"
#
# SÍNTOMAS OBSERVABLES
# --------------------
# - Desde el cliente:
#   * ping web.lab.local → FALLA
#   * traceroute llega al host
# - HTTP puede funcionar vía proxy
#
# CAUSA REAL
# ----------
# - ICMP (echo-request) bloqueado por firewalld en la VM WEB
#
# OBJETIVO PEDAGÓGICO
# -------------------
# - Entender que ICMP ≠ HTTP
# - Diagnosticar firewall
# - No asumir que "ping caído = servidor caído"
###############################################################################

###############################################################################
# METADATOS DEL INCIDENTE (TRAZABILIDAD)
###############################################################################
write_files:
  - path: /etc/lab/variant
    permissions: "0644"
    content: |
      VARIANT=V01
      INCIDENT=ICMP_BLOCKED
      AFFECTED_VM=web
      AFFECTED_COMPONENT=firewalld
      EXPECTED_FIX=ALLOW_ICMP

###############################################################################
# APLICACIÓN DEL FALLO
###############################################################################
runcmd:
  # ---------------------------------------------------------------------------
  # 1. Confirmación de contexto
  # ---------------------------------------------------------------------------
  - |
    echo "[V01] Aplicando variante ICMP bloqueado en WEB..."
    hostnamectl status || true

  # ---------------------------------------------------------------------------
  # 2. Bloqueo explícito de ICMP (echo-request)
  # ---------------------------------------------------------------------------
  - |
    echo "[V01] Bloqueando ICMP echo-request..."
    firewall-cmd --permanent --add-icmp-block=echo-request

  - firewall-cmd --reload

  # ---------------------------------------------------------------------------
  # 3. Validación del fallo inducido
  # ---------------------------------------------------------------------------
  - |
    echo "[V01] Estado del firewall:"
    firewall-cmd --list-all || true

  - |
    echo "[V01] Regla ICMP aplicada:"
    firewall-cmd --list-icmp-blocks || true

###############################################################################
# ESTADO FINAL ESPERADO
# -----------------------------------------------------------------------------
# - La VM responde por HTTP
# - La VM NO responde a ping
# - No hay fallos de DNS ni rutas
#
# NOTA IMPORTANTE:
# - Este archivo NO debe tocar servicios ni red IP
# - El alumno debe remover la regla ICMP para resolver el incidente
###############################################################################
