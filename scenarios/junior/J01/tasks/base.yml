---
# ==============================================================================
# BASELINE — Estado correcto esperado (ANTES del fallo)
# ==============================================================================

- name: Asegurar usuario del servicio
  user:
    name: "{{ service_user }}"
    system: true
    shell: /sbin/nologin
    state: present

- name: Crear directorio del servicio
  file:
    path: "{{ service_dir }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0750'

- name: Crear script de inicio del servicio
  copy:
    dest: "{{ service_dir }}/start.sh"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0750'
    content: |
      #!/bin/bash
      echo "Internal API running"
      sleep 300

- name: Crear unidad systemd del servicio
  template:
    src: internal-api.service.j2
    dest: "/etc/systemd/system/{{ service_name }}.service"
    owner: root
    group: root
    mode: '0644'

- name: Registrar baseline en log
  lineinfile:
    path: "{{ log_file }}"
    create: true
    line: "[BASELINE] Servicio {{ service_name }} preparado correctamente"
