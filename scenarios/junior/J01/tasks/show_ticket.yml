- name: Mostrar ticket final
  debug:
    msg: |
      ╔══════════════════════════════════════════════════════════╗
      ║                    LAB J01 - JUNIOR                      ║
      ║                VARIANTE: {{ selected_variant_file }}     ║
      ╚══════════════════════════════════════════════════════════╝
      
      📋 ESCENARIO:
      {{ variant.description }}
      
      🔍 SÍNTOMAS:
      {% for s in variant.symptoms %}
      • {{ s }}
      {% endfor %}
      
      🎯 TAREA:
      {{ variant.task }}
      
      ⚠️  RESTRICCIONES:
      {% for r in variant.restrictions %}
      • {{ r }}
      {% endfor %}
      
      💡 PISTAS:
      {% for p in variant.hints %}
      • {{ p | replace('SERVICE_USER', service_user) | replace('SERVICE_NAME', service_name) | replace('SERVICE_DIR', service_dir) }}
      {% endfor %}
      
      ═══════════════════════════════════════════════════════════
      📊 RESULTADO: {{ final_state }}
      ═══════════════════════════════════════════════════════════
      Laboratorio completado. Revisa arriba para ver las acciones ejecutadas.
  run_once: yes