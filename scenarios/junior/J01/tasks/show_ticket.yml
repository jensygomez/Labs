- name: Mostrar ticket final EN admin01 (SIMPLE + COLORES)
  shell: |
    # Colores
    RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[1;33m'
    BLUE='\033[0;34m'; PURPLE='\033[0;35m'; CYAN='\033[0;36m'
    WHITE='\033[1;37m'; NC='\033[0m'
    
    clear
    printf "${BLUE}%*s${NC}\n" 60 | tr ' ' '='
    echo "${WHITE}                    LAB J01 - JUNIOR                      ${NC}"
    echo "${WHITE}                VARIANTE: ${YELLOW}{{ selected_variant_file }}${NC}               "
    printf "${BLUE}%*s${NC}\n" 60 | tr ' ' '='
    echo ""
    
    echo "${CYAN}📋 ESCENARIO:${NC}"
    echo "${CYAN}En Linux, que un archivo exista no significa...${NC}"
    echo ""
    
    echo "${YELLOW}🔍 SÍNTOMAS:${NC}"
    echo "${YELLOW}• El servicio existe en systemd${NC}"
    echo "${YELLOW}• El usuario del servicio existe en el sistema${NC}"
    echo "${YELLOW}• El servicio falla al iniciar inmediatamente${NC}"
    echo ""
    
    echo "${GREEN}🎯 TAREA:${NC}"
    echo "${GREEN}Identificar por qué el servicio no logra ejecutar...${NC}"
    echo ""
    
    echo "${RED}⚠️  RESTRICCIONES:${NC}"
    echo "${RED}• NO ejecutar el servicio como root${NC}"
    echo "${RED}• NO usar chmod 777${NC}"
    echo "${RED}• NO cambiar el usuario del servicio${NC}"
    echo ""
    
    echo "${PURPLE}💡 PISTAS:${NC}"
    echo "${PURPLE}• ls -l {{ service_dir }}/start.sh → ¿ves el 'x'?${NC}"
    echo "${PURPLE}• chmod necesita +x para systemd${NC}"
    echo ""
    
    printf "${GREEN}═══════════════════════════════════════════════════════════${NC}\n"
    echo "${GREEN}📊 RESULTADO: ${RED}{{ final_state }}${NC}"
    printf "${GREEN}═══════════════════════════════════════════════════════════${NC}\n"
    echo ""
    echo "${WHITE}💻 SSH web01:${NC} ssh student@{{ hostvars['web01'].ansible_host }}"
  args:
    executable: /bin/bash
  run_once: yes
