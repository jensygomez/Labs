- name: Mostrar ticket final EN admin01
  shell: |
    cat > /tmp/J01_ticket.txt << 'EOF'
╔══════════════════════════════════════════════════════════╗
║                    LAB J01 - JUNIOR                      ║
║                VARIANTE: {{ selected_variant_file }}     ║
╚══════════════════════════════════════════════════════════╝

📋 ESCENARIO:
{{ variant.description }}

🔍 SÍNTOMAS:
{{ variant.symptoms | first }}
{{ variant.symptoms | list | length > 1 | ternary(variant.symptoms[1], '') }}
{{ variant.symptoms | list | length > 2 | ternary(variant.symptoms[2], '') }}

🎯 TAREA:
{{ variant.task }}

⚠️  RESTRICCIONES:
{{ variant.restrictions | first }}
{{ variant.restrictions | list | length > 1 | ternary(variant.restrictions[1], '') }}

💡 PISTAS:
{{ variant.hints | first | replace('SERVICE_USER', service_user) | replace('SERVICE_NAME', service_name) | replace('SERVICE_DIR', service_dir) }}

═══════════════════════════════════════════════════════════
📊 RESULTADO: {{ final_state }}
═══════════════════════════════════════════════════════════
SSH web01: ssh student@192.168.122.22
EOF
    cat /tmp/J01_ticket.txt
  args:
    executable: /bin/bash
  run_once: yes
