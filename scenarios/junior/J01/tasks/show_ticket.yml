---
- name: Mostrar ticket final EN admin01
  block:
    - name: Crear ticket con template heredoc
      shell: |
        cat > /tmp/J01_ticket.txt << 'EOF'
╔══════════════════════════════════════════════════════════╗
║                    LAB J01 - JUNIOR                      ║
║                VARIANTE: {{ selected_variant_file }}     ║
╚══════════════════════════════════════════════════════════╝

📋 ESCENARIO:
{{ variant.description }}

🔍 SÍNTOMAS:
{{ variant.symptoms | join('\n') }}

🎯 TAREA:
{{ variant.task }}

⚠️  RESTRICCIONES:
{{ variant.restrictions | join('\n') }}

💡 PISTAS:
{{ variant.hints | join('\n') | replace('SERVICE_USER', service_user) | replace('SERVICE_NAME', service_name) | replace('SERVICE_DIR', service_dir) }}

═══════════════════════════════════════════════════════════
📊 RESULTADO: {{ final_state }}
═══════════════════════════════════════════════════════════
SSH web01: ssh student@192.168.122.22
EOF
      args:
        executable: /bin/bash

    - name: Mostrar ticket
      shell: cat /tmp/J01_ticket.txt
      args:
        executable: /bin/bash
  run_once: yes
