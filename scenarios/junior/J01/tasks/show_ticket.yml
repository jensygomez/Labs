- name: Mostrar ticket final CON COLORES REALES
  shell: |
    # Colores ANSI
    RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[1;33m'
    BLUE='\033[0;34m'; PURPLE='\033[0;35m'; CYAN='\033[0;36m'
    WHITE='\033[1;37m'; NC='\033[0m'
    
    # MOSTRAR DIRECTO con colores (SIN archivo)
    clear
    printf "${BLUE}%*s${NC}\n" 60 | tr ' ' '='
    echo "${WHITE}                    LAB J01 - JUNIOR                      ${NC}"
    echo "${WHITE}                VARIANTE: ${YELLOW}${selected_variant_file}${NC}               "
    printf "${BLUE}%*s${NC}\n" 60 | tr ' ' '='
    echo ""
    
    echo "${CYAN}📋 ESCENARIO:${NC}"
    echo "${CYAN}{{ variant.description }}${NC}"
    echo ""
    
    echo "${YELLOW}🔍 SÍNTOMAS:${NC}"
    {% for s in variant.symptoms %}
    echo "${YELLOW}• {{ s }}${NC}"
    {% endfor %}
    echo ""
    
    echo "${GREEN}🎯 TAREA:${NC}"
    echo "${GREEN}{{ variant.task }}${NC}"
    echo ""
    
    echo "${RED}⚠️  RESTRICCIONES:${NC}"
    {% for r in variant.restrictions %}
    echo "${RED}• {{ r }}${NC}"
    {% endfor %}
    echo ""
    
    echo "${PURPLE}💡 PISTAS:${NC}"
    {% for p in variant.hints %}
    echo "${PURPLE}• {{ p | replace('SERVICE_USER', service_user) | replace('SERVICE_NAME', service_name) | replace('SERVICE_DIR', service_dir) }}${NC}"
    {% endfor %}
    echo ""
    
    printf "${GREEN}═══════════════════════════════════════════════════════════${NC}\n"
    echo "${GREEN}📊 RESULTADO:${RED} {{ final_state }}${NC}"
    printf "${GREEN}═══════════════════════════════════════════════════════════${NC}\n"
    echo ""
    echo "${WHITE}💻 SSH web01:${NC} ssh student@{{ hostvars['web01'].ansible_host | default('192.168.122.22') }}"
    echo ""
    echo "${WHITE}[Presiona Enter para mantener abierto]${NC}"
    read -r
  args:
    executable: /bin/bash
  run_once: yes
