---
- name: Mostrar ticket final EN admin01
  shell: |
    echo "╔══════════════════════════════════════════════════════════╗" > /tmp/J01_ticket.txt
    echo "║                    LAB J01 - JUNIOR                      ║" >> /tmp/J01_ticket.txt
    echo "║                VARIANTE: {{ selected_variant_file }}     ║" >> /tmp/J01_ticket.txt
    echo "╚══════════════════════════════════════════════════════════╝" >> /tmp/J01_ticket.txt
    echo "" >> /tmp/J01_ticket.txt
    echo "📋 ESCENARIO:" >> /tmp/J01_ticket.txt
    echo "{{ variant.description }}" >> /tmp/J01_ticket.txt
    echo "" >> /tmp/J01_ticket.txt
    echo "🔍 SÍNTOMAS:" >> /tmp/J01_ticket.txt
    echo "{{ variant.symptoms[0] }}" >> /tmp/J01_ticket.txt
    echo "{{ variant.symptoms[1] }}" >> /tmp/J01_ticket.txt
    echo "{{ variant.symptoms[2] }}" >> /tmp/J01_ticket.txt
    echo "" >> /tmp/J01_ticket.txt
    echo "🎯 TAREA:" >> /tmp/J01_ticket.txt
    echo "{{ variant.task }}" >> /tmp/J01_ticket.txt
    echo "" >> /tmp/J01_ticket.txt
    echo "⚠️  RESTRICCIONES:" >> /tmp/J01_ticket.txt
    echo "{{ variant.restrictions[0] }}" >> /tmp/J01_ticket.txt
    echo "{{ variant.restrictions[1] }}" >> /tmp/J01_ticket.txt
    echo "{{ variant.restrictions[2] }}" >> /tmp/J01_ticket.txt
    echo "" >> /tmp/J01_ticket.txt
    echo "💡 PISTAS:" >> /tmp/J01_ticket.txt
    echo "{{ variant.hints[0] | replace('SERVICE_USER', service_user) | replace('SERVICE_NAME', service_name) | replace('SERVICE_DIR', service_dir) }}" >> /tmp/J01_ticket.txt
    echo "{{ variant.hints[1] | replace('SERVICE_USER', service_user) | replace('SERVICE_NAME', service_name) | replace('SERVICE_DIR', service_dir) }}" >> /tmp/J01_ticket.txt
    echo "" >> /tmp/J01_ticket.txt
    echo "═══════════════════════════════════════════════════════════" >> /tmp/J01_ticket.txt
    echo "📊 RESULTADO: {{ final_state }}" >> /tmp/J01_ticket.txt
    echo "═══════════════════════════════════════════════════════════" >> /tmp/J01_ticket.txt
    echo "" >> /tmp/J01_ticket.txt
    echo "SSH web01: ssh student@192.168.122.22" >> /tmp/J01_ticket.txt
    
    clear
    cat /tmp/J01_ticket.txt
  args:
    executable: /bin/bash
  run_once: yes
