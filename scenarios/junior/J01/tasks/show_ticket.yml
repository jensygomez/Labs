- name: Mostrar ticket final EN admin01
  shell: |
    # Header
    echo "╔══════════════════════════════════════════════════════════╗" > /tmp/J01_ticket.txt
    echo "║                    LAB J01 - JUNIOR                      ║" >> /tmp/J01_ticket.txt
    echo "║                VARIANTE: {{ selected_variant_file }}     ║" >> /tmp/J01_ticket.txt
    echo "╚══════════════════════════════════════════════════════════╝" >> /tmp/J01_ticket.txt
    echo "" >> /tmp/J01_ticket.txt
    
    # ESCENARIO
    echo "📋 ESCENARIO:" >> /tmp/J01_ticket.txt
    echo "{{ variant.description }}" >> /tmp/J01_ticket.txt
    echo "" >> /tmp/J01_ticket.txt
    
    # SÍNTOMAS
    echo "🔍 SÍNTOMAS:" >> /tmp/J01_ticket.txt
    {% for s in variant.symptoms %}
    echo "• {{ s }}" >> /tmp/J01_ticket.txt
    {% endfor %}
    echo "" >> /tmp/J01_ticket.txt
    
    # TAREA (FALTABA)
    echo "🎯 TAREA:" >> /tmp/J01_ticket.txt
    echo "{{ variant.task }}" >> /tmp/J01_ticket.txt
    echo "" >> /tmp/J01_ticket.txt
    
    # RESTRICCIONES (FALTABA)
    echo "⚠️  RESTRICCIONES:" >> /tmp/J01_ticket.txt
    {% for r in variant.restrictions %}
    echo "• {{ r }}" >> /tmp/J01_ticket.txt
    {% endfor %}
    echo "" >> /tmp/J01_ticket.txt
    
    # PISTAS (FALTABA)
    echo "💡 PISTAS:" >> /tmp/J01_ticket.txt
    {% for p in variant.hints %}
    echo "• {{ p | replace('SERVICE_USER', service_user) | replace('SERVICE_NAME', service_name) | replace('SERVICE_DIR', service_dir) }}" >> /tmp/J01_ticket.txt
    {% endfor %}
    echo "" >> /tmp/J01_ticket.txt
    
    # RESULTADO
    echo "═══════════════════════════════════════════════════════════" >> /tmp/J01_ticket.txt
    echo "📊 RESULTADO: {{ final_state }}" >> /tmp/J01_ticket.txt
    echo "═══════════════════════════════════════════════════════════" >> /tmp/J01_ticket.txt
    echo "SSH web01: ssh student@{{ hostvars['web01'].ansible_host | default('192.168.122.22') }}" >> /tmp/J01_ticket.txt
    
    clear
    cat /tmp/J01_ticket.txt
  args:
    executable: /bin/bash
  run_once: yes
