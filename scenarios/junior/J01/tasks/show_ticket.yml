# tasks/show_ticket.yml
- name: Mostrar ticket final EN admin01
  shell: |
    cat > /tmp/J01_ticket.txt << 'EOF'
╔══════════════════════════════════════════════════════════╗
║                    LAB J01 - JUNIOR                      ║
║                VARIANTE: {{ selected_variant_file }}     ║
╚══════════════════════════════════════════════════════════╝

📋 ESCENARIO:
{{ variant.description }}

🔍 SÍNTOMAS:
{% for s in variant.symptoms %}
• {{ s }}
{% endfor %}

🎯 TAREA:
{{ variant.task }}

⚠️  RESTRICCIONES:
{% for r in variant.restrictions %}
• {{ r }}
{% endfor %}

💡 PISTAS:
{% for p in variant.hints %}
• {{ p | replace('SERVICE_USER', service_user) | 
       replace('SERVICE_NAME', service_name) | 
       replace('SERVICE_DIR', service_dir) }}
{% endfor %}

═══════════════════════════════════════════════════════════
📊 RESULTADO: {{ final_state }}
═══════════════════════════════════════════════════════════
SSH web01: ssh student@{{ hostvars['web01'].ansible_host | default('192.168.122.21') }}
EOF
    
    clear
    cat /tmp/J01_ticket.txt
  args:
    executable: /bin/bash
  run_once: yes
