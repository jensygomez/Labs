---
- name: J01 – Junior | Application fails due to execution identity mismatch
  hosts: web
  become: true
  gather_facts: false

  vars:
    service_name: internal-api
    service_user: apiuser
    service_dir: /opt/internal-api
    log_file: /var/log/lab_j01.log

  pre_tasks:
    - name: Mostrar ticket del laboratorio
      include_tasks: tasks/ticket.yml

    - name: Seleccionar variante aleatoria (1–5)
      set_fact:
        lab_variant: "{{ 1 + (9999 | random) % 5 }}"

    - name: Registrar variante seleccionada
      debug:
        msg: "VARIANTE SELECCIONADA: {{ lab_variant }}"

  tasks:
    - name: Preparación base del laboratorio
      include_tasks: tasks/base.yml

    - name: Aplicar variante 1
      include_tasks: tasks/variant_1.yml
      when: lab_variant == 1

    - name: Aplicar variante 2
      include_tasks: tasks/variant_2.yml
      when: lab_variant == 2

    - name: Aplicar variante 3
      include_tasks: tasks/variant_3.yml
      when: lab_variant == 3

    - name: Aplicar variante 4
      include_tasks: tasks/variant_4.yml
      when: lab_variant == 4

    - name: Aplicar variante 5
      include_tasks: tasks/variant_5.yml
      when: lab_variant == 5

  post_tasks:
    - name: Reload systemd
      command: systemctl daemon-reexec

    - name: Intentar iniciar servicio (debe fallar)
      service:
        name: "{{ service_name }}"
        state: started
      ignore_errors: true

    - name: Estado final del servicio
      command: systemctl is-active {{ service_name }}
      register: svc_status
      failed_when: false

    - debug:
        msg:
          - "Servicio: {{ service_name }}"
          - "Estado final: {{ svc_status.stdout | default('unknown') }}"
          - "Diagnóstico: journalctl -u {{ service_name }} -n 20"
