---
# ==============================================================================
# handlers/haproxy.yml
# ==============================================================================
#
# 🎯 PROPÓSITO
# Handler centralizado para la gestión del ciclo de vida del servicio HAProxy.
#
# Este handler se encarga exclusivamente de reiniciar HAProxy cuando:
#   - Se modifica su archivo de configuración (haproxy.cfg)
#   - Se aplica una VARIANTE que altera el comportamiento TCP
#   - Se restaura un baseline estable
#
# 🧠 PRINCIPIO DE DISEÑO
# - Separación clara entre:
#     * Declaración de estado (tasks)
#     * Acciones reactivas (handlers)
# - Evita reinicios innecesarios
# - Garantiza idempotencia
#
# 🧪 CONTEXTO DEL LABORATORIO
# Utilizado por:
#   - VARIANT_3 → Cierre prematuro de conexiones TCP (timeouts agresivos)
#   - Variantes futuras relacionadas con red, keepalive o HAProxy
#
# 🔁 COMPORTAMIENTO
# Este handler solo se ejecuta cuando es notificado explícitamente.
# No debe ser llamado directamente desde la CLI.
#
# ⚠️ NOTA OPERATIVA
# En entornos productivos, este handler podría evolucionar a:
#   - reload en lugar de restart
#   - lógica condicional según entorno
#
# ==============================================================================
- name: Restart haproxy
  service:
    name: haproxy
    state: restarted
