# ==============================================================================
# J01 – Variant 1: Bloqueo de ICMP (ping) desde CLIENT01
# ==============================================================================
#
# 🔹 Objetivo del laboratorio:
# Este escenario simula un problema muy común en entornos corporativos: el cliente
# no puede hacer ping ni traceroute hacia el servidor, aunque los servicios críticos
# como HTTP y MySQL siguen funcionando. Esto permite practicar troubleshooting de
# red y firewalls sin afectar los servicios reales.
#
# 🔹 Contexto:
# - CLIENT01: 192.168.122.21 (Cliente que hará las pruebas)
# - SERVER_EU: 192.168.122.22 (Servidor con Nginx 80, MariaDB 3306)
# - Firewalld activo en SERVER_EU
# 
# 🔹 Qué estamos rompiendo:
# - Bloqueo de paquetes ICMP tipo echo-request desde CLIENT01
# - Esto hará que ping y traceroute fallen desde CLIENT01
# 
# 🔹 Qué NO estamos rompiendo:
# - HTTP (puerto 80) sigue funcionando
# - MySQL (puerto 3306) sigue funcionando
# - Red física y demás servicios
#
# 🔹 Objetivos de aprendizaje:
# 1. Entender que el fallo de ping no significa que el servidor esté caído
# 2. Revisar reglas de firewall y cómo afectan distintos protocolos
# 3. Diagnosticar conectividad desde cliente y servidor
# 4. Diferenciar entre problemas de red y problemas de servicio
#
# 🔹 Pruebas recomendadas desde CLIENT01:
# - ping -c 2 192.168.122.50     # Debe fallar
# - ping -c 2 192.168.122.60     # Debe fallar
# - traceroute 192.168.122.50    # Debe fallar
# - curl http://www.paginaweb.com # Debe seguir funcionando
# - nc -zv 192.168.122.60 3306   # Debe seguir funcionando
#
# 🔹 Diagnóstico sugerido:
# - Revisar firewalld: firewall-cmd --list-all
# - Verificar rich rules que bloquean ICMP
# - Confirmar que HTTP y MySQL siguen accesibles
#
# 🔹 Reparación:
# - Eliminar la regla de ICMP en SERVER_EU y recargar firewalld
# ==============================================================================

# variant_1.yml - Bloqueo HTTP en firewall
# Lab: J01 - Variante 1
# Dificultad: Junior
# Tiempo estimado: 10-15 minutos

variant_id: "1"
title: "Bloqueo HTTP en firewall (puerto 80)"

# Servicios que deben estar HABILITADOS y CORRIENDO
enabled:
  - nginx      # Servicio web
  - firewalld  # Firewall activo

# Servicios que deben permanecer DESHABILITADOS
# (no se listan aquí, se asumen deshabilitados por defecto)

# Configuración de red
# VIP para el servicio web (opcional, el lab puede usarla)
# vip: "192.168.122.50"

# Errores a inyectar en el sistema
errors:
  # Bloqueo de puerto HTTP
  - description: "Bloquear acceso HTTP en puerto 80"
    commands:
      - firewall-cmd --zone=public --remove-port=80/tcp --permanent
      - firewall-cmd --reload
      - echo "✅ Puerto 80 bloqueado en firewall" > /tmp/firewall_status.txt

  # Verificación de que nginx está corriendo (para confirmar que no es problema del servicio)
  - description: "Asegurar que nginx está activo"
    commands:
      - systemctl is-active nginx || systemctl start nginx
      - systemctl enable nginx

# Información para diagnóstico (no se ejecuta, solo documentación)
diagnosis:
  symptoms:
    - "El sitio web no carga (http://192.168.122.50)"
    - "Ping al servidor funciona"
    - "SSH accesible"
    - "Otros servicios no afectados"
    
  commands:
    - "firewall-cmd --zone=public --list-all"
    - "systemctl status nginx"
    - "curl -v http://192.168.122.50"
    - "ss -tlnp | grep :80"