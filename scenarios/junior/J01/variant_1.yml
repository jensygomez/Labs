# ==============================================================================
# J01 – Variant 1: Bloqueo de ICMP (ping) desde el HOST
# ==============================================================================
#
# 🔹 Objetivo: Practicar troubleshooting de firewall
# 🔹 Fallo inyectado: Bloqueo de ping desde EL HOST (192.168.122.1)
# 🔹 Servicios afectados: Solo ICMP
# 🔹 Servicios FUNCIONANDO: HTTP (80), MySQL (3306)
#
# ==============================================================================

variant_id: "1"
title: "Bloqueo ICMP desde el HOST"

enabled:
  - nginx
  - mariadb
  - firewalld

errors:
  - description: "Asegurar servicios activos"
    commands:
      - systemctl is-active nginx || systemctl enable --now nginx
      - systemctl is-active mariadb || systemctl enable --now mariadb
      - systemctl is-active firewalld || systemctl enable --now firewalld
  
  - description: "Bloquear ICMP echo-request desde el HOST (192.168.122.1)"
    commands:
      - firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="192.168.122.1" icmp-type name="echo-request" drop'
      - firewall-cmd --reload
  
  - description: "Crear archivo de verificación"
    commands:
      - echo "LAB_J01_V1_COMPLETADO: $(date)" > /root/lab_j01_v1.status
      - echo "ICMP_BLOQUEADO_DESDE: 192.168.122.1 (HOST)" >> /root/lab_j01_v1.status
      - echo "SERVICIOS_ACTIVOS: nginx mariadb firewalld" >> /root/lab_j01_v1.status
      - echo "REGLA_FIREWALL:" >> /root/lab_j01_v1.status
      - firewall-cmd --list-rich-rules >> /root/lab_j01_v1.status 2>/dev/null || echo "No rich rules" >> /root/lab_j01_v1.status