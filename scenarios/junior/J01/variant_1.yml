---
# ==============================================================================
# J01 – Variant 1: Bloqueo de ICMP (ping) desde CLIENT01
# ==============================================================================
#
# 🔹 Objetivo del laboratorio:
# Este escenario simula un problema muy común en entornos corporativos: el cliente
# no puede hacer ping ni traceroute hacia el servidor, aunque los servicios críticos
# como HTTP y MySQL siguen funcionando. Esto permite practicar troubleshooting de
# red y firewalls sin afectar los servicios reales.
#
# 🔹 Contexto:
# - CLIENT01: 192.168.122.21 (Cliente que hará las pruebas)
# - SERVER_EU: 192.168.122.22 (Servidor con Nginx 80, MariaDB 3306)
# - Firewalld activo en SERVER_EU
# 
# 🔹 Qué estamos rompiendo:
# - Bloqueo de paquetes ICMP tipo echo-request desde CLIENT01
# - Esto hará que ping y traceroute fallen desde CLIENT01
# 
# 🔹 Qué NO estamos rompiendo:
# - HTTP (puerto 80) sigue funcionando
# - MySQL (puerto 3306) sigue funcionando
# - Red física y demás servicios
#
# 🔹 Objetivos de aprendizaje:
# 1. Entender que el fallo de ping no significa que el servidor esté caído
# 2. Revisar reglas de firewall y cómo afectan distintos protocolos
# 3. Diagnosticar conectividad desde cliente y servidor
# 4. Diferenciar entre problemas de red y problemas de servicio
#
# 🔹 Pruebas recomendadas desde CLIENT01:
# - ping -c 2 192.168.122.50     # Debe fallar
# - ping -c 2 192.168.122.60     # Debe fallar
# - traceroute 192.168.122.50    # Debe fallar
# - curl http://www.paginaweb.com # Debe seguir funcionando
# - nc -zv 192.168.122.60 3306   # Debe seguir funcionando
#
# 🔹 Diagnóstico sugerido:
# - Revisar firewalld: firewall-cmd --list-all
# - Verificar rich rules que bloquean ICMP
# - Confirmar que HTTP y MySQL siguen accesibles
#
# 🔹 Reparación:
# - Eliminar la regla de ICMP en SERVER_EU y recargar firewalld
# ==============================================================================

- name: Asegurar que firewalld esté activo en web servers
  systemd:
    name: firewalld
    state: started
    enabled: true

- name: Asegurar que zona public existe y está activa
  firewalld:
    zone: public
    state: present
    permanent: true
  

- name: Bloquear ICMP echo-request de CLIENT01 (idempotente)
  firewalld:
    zone: public
    rich_rule: 
      - "rule family=ipv4 source address=192.168.122.21 icmp-type name=echo-request drop"
    permanent: true
    state: present
    immediate: true





- name: Mostrar ticket / escenario estilo NOC con filosofía Linux
  debug:
    msg:
      - "========================================================================"
      - "|                  INC-J01-V1 – Bloqueo ICMP desde CLIENT01             |"
      - "------------------------------------------------------------------------"
      - "| Descripción:                                                            |"
      - "| - Ping y traceroute desde CLIENT01 a SERVER_EU fallan.                  |"
      - "| - HTTP (80) y MariaDB (3306) siguen funcionando.                        |"
      - "| - Posible bloqueo de ICMP por firewall.                                 |"
      - "------------------------------------------------------------------------"
      - "| Contexto:                                                               |"
      - "| - CLIENT01 (192.168.122.21): Cliente que realiza pruebas.               |"
      - "| - SERVER_EU (192.168.122.22): Servidor con Nginx y MariaDB.             |"
      - "| - Firewalld activo en SERVER_EU.                                        |"
      - "------------------------------------------------------------------------"
      - "| Filosofía Linux (perspectiva senior):                                   |"
      - "| - Linux permite observar todo el ecosistema: red, servicios y protocolos.|"
      - "| - Fallo de ping no implica fallo de servicio. ICMP es solo diagnóstico. |"
      - "| - TCP y UDP son independientes; servicios críticos siguen activos.       |"
      - "| - Antes de actuar, observa qué falló y qué sigue funcionando.           |"
      - "| - Reflexiona sobre impacto en usuarios y aplicaciones.                  |"
      - "| - Mentalidad de senior: diagnosticar con criterio y documentar todo.    |"
      - "------------------------------------------------------------------------"
      - "| Objetivos de aprendizaje:                                               |"
      - "| 1. Entender que fallo de ping no implica fallo de servicio.             |"
      - "| 2. Diagnosticar reglas de firewall que afectan ICMP.                     |"
      - "| 3. Diferenciar protocolos ICMP vs TCP.                                   |"
      - "| 4. Practicar observación y pensamiento crítico de un sysadmin senior.   |"
      - "------------------------------------------------------------------------"
      - "| Checklist recomendado:                                                  |"
      - "| - [ ] Desde CLIENT01: ping y traceroute hacia SERVER_EU                 |"
      - "| - [ ] Confirmar que HTTP funciona                                       |"
      - "| - [ ] Confirmar que MariaDB funciona                                    |"
      - "| - [ ] Revisar firewalld en SERVER_EU                                    |"
      - "| - [ ] Reflexión: ¿Por qué ICMP falla pero TCP sigue funcionando?        |"
      - "========================================================================"
  run_once: true