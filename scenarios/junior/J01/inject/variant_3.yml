---
# ==============================================================================
# VARIANTE 3 — Permisos incorrectos en el directorio del servicio
# ==============================================================================

- name: Asegurar usuario del servicio existe
  user:
    name: "{{ service_user }}"
    system: true
    shell: /sbin/nologin
    state: present

- name: Asegurar script con permisos correctos
  file:
    path: "{{ service_dir }}/start.sh"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0750'

- name: Romper acceso al directorio del servicio
  file:
    path: "{{ service_dir }}"
    owner: root
    group: root
    mode: '0700'

- name: Registrar variante 3 en log
  lineinfile:
    path: "{{ log_file }}"
    line: "[VARIANTE 3] Usuario {{ service_user }} sin permiso para acceder al directorio {{ service_dir }}"
