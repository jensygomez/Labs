---
# ==============================================================================
# VARIANTE 4 — Archivo de configuración inaccesible (EnvironmentFile)
# ==============================================================================

- name: Asegurar usuario del servicio existe
  user:
    name: "{{ service_user }}"
    system: true
    shell: /sbin/nologin
    state: present

- name: Asegurar script con permisos correctos
  file:
    path: "{{ service_dir }}/start.sh"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Crear archivo de configuración requerido por el servicio
  copy:
    dest: "{{ service_dir }}/config.env"
    content: |
      API_KEY=secret123
    owner: root
    group: root
    mode: '0600'

- name: Configurar unit file con EnvironmentFile
  copy:
    dest: "/etc/systemd/system/{{ service_name }}.service"
    content: |
      [Unit]
      Description=Internal API Service

      [Service]
      User={{ service_user }}
      ExecStart=/bin/bash {{ service_dir }}/start.sh
      EnvironmentFile={{ service_dir }}/config.env

      [Install]
      WantedBy=multi-user.target

- name: Recargar systemd
  command: systemctl daemon-reexec

- name: Intentar iniciar servicio (fallará)
  service:
    name: "{{ service_name }}"
    state: restarted
  ignore_errors: true

- name: Registrar variante 4 en log
  lineinfile:
    path: "{{ log_file }}"
    line: "[VARIANTE 4] EnvironmentFile {{ service_dir }}/config.env no es legible por {{ service_user }}"
