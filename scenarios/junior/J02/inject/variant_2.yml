
---
# ==============================================================================
# VARIANTE 2 — Wants/Requires mal definidos (dependencias incorrectas)
# ==============================================================================
#
# PROPÓSITO DEL INCIDENTE:
#   Simular un fallo de arranque provocado por el uso incorrecto de Requires
#   en lugar de Wants, haciendo que el servicio principal dependa
#   obligatoriamente de un servicio auxiliar que nunca puede iniciar.
#
# CONTEXTO DEL LAB:
#   - El servicio {{ global_service_name }} existe y funciona correctamente
#   - No hay errores en el binario ni en el script de inicio
#   - El fallo ocurre en la fase de resolución de dependencias systemd
#
# PROBLEMAS INYECTADOS:
#
#   1. Eliminación de una dependencia crítica legítima:
#      - Se elimina:
#          Requires=network-online.target
#      - El servicio deja de garantizar conectividad real
#      - Esto es RUÍDO secundario, no la causa raíz
#
#   2. Creación de un servicio auxiliar defectuoso:
#      - auth-{{ global_service_name }}.service
#      - ExecStart=/usr/bin/false → siempre falla
#
#   3. Dependencia dura incorrecta (CAUSA RAÍZ):
#
#      {{ global_service_name }}.service
#        Requires=auth-{{ global_service_name }}.service
#        After=auth-{{ global_service_name }}.service
#
#      auth-{{ global_service_name }}.service
#        → estado FAILED permanente
#
# RESULTADO ESPERADO:
#   - systemctl start {{ global_service_name }}.service falla
#   - El fallo es causado por dependencia obligatoria fallida
#   - El servicio principal nunca ejecuta ExecStart
#
# MENSAJES TÍPICOS:
#   - "Dependency failed"
#   - "Job canceled"
#   - "Unit auth-{{ global_service_name }}.service failed"
#
# OBJETIVO DIDÁCTICO:
#   - Entender cuándo usar Requires vs Wants
#   - Identificar dependencias demasiado fuertes
#   - Diagnosticar servicios bloqueados por fallos externos
#   - Corregir dependencias sin eliminar servicios
#
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Backup del unit original
# ------------------------------------------------------------------------------
# Permite revertir el estado tras finalizar el laboratorio
- name: V2 | Backup del unit original
  copy:
    src: "/etc/systemd/system/{{ global_service_name }}.service"
    dest: "/etc/systemd/system/{{ global_service_name }}.service.v2backup"
    remote_src: yes
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# 2. Remover dependencia crítica de red (ruido secundario)
# ------------------------------------------------------------------------------
# Esto no rompe directamente el servicio, pero degrada el diseño original
- name: V2 | Eliminar Requires=network-online.target
  lineinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    regexp: '^Requires=network-online\.target$'
    state: absent
    backup: yes

# ------------------------------------------------------------------------------
# 3. Crear servicio auxiliar que siempre falla
# ------------------------------------------------------------------------------
# Representa un backend externo (ej. autenticación) mal implementado
- name: V2 | Crear servicio auth-{{ global_service_name }} (siempre falla)
  copy:
    dest: "/etc/systemd/system/auth-{{ global_service_name }}.service"
    content: |
      [Unit]
      Description=Authentication Service for {{ global_service_name }}

      [Service]
      Type=simple
      ExecStart=/usr/bin/false
      Restart=no

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# 4. Introducir dependencia dura incorrecta (CAUSA RAÍZ)
# ------------------------------------------------------------------------------
# Requires obliga a que el servicio auxiliar esté ACTIVO para continuar
- name: V2 | Inyectar Requires hacia auth-{{ global_service_name }}
  blockinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    marker: "# {mark} J02 VARIANT 2 BAD DEPENDENCY"
    insertafter: '^\[Unit\]'
    block: |
      Requires=auth-{{ global_service_name }}.service
      After=auth-{{ global_service_name }}.service
    backup: yes

# ------------------------------------------------------------------------------
# 5. Recargar systemd
# ------------------------------------------------------------------------------
- name: V2 | Recargar daemon systemd
  systemd:
    daemon_reload: yes

# ------------------------------------------------------------------------------
# 6. Asegurar estado detenido
# ------------------------------------------------------------------------------
# Garantiza que el fallo se observe al intentar iniciar manualmente
- name: V2 | Detener servicios antes de la prueba
  systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - "{{ global_service_name }}.service"
    - "auth-{{ global_service_name }}.service"
  failed_when: false

# ------------------------------------------------------------------------------
# 7. Registrar inyección (log técnico)
# ------------------------------------------------------------------------------
- name: V2 | Registrar inyección de la variante
  lineinfile:
    path: "/var/log/j02-inject.log"
    create: yes
    line: "[J02-V2-{{ ansible_date_time.epoch }}] Requires incorrecto: {{ global_service_name }} depende de auth-{{ global_service_name }} (servicio siempre fallido)"
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# 8. Archivo de diagnóstico (uso instructor / corrección)
# ------------------------------------------------------------------------------
- name: V2 | Crear archivo de diagnóstico
  copy:
    dest: "/tmp/j02_variant_2_diagnosis.txt"
    content: |
      =============================================
      DIAGNOSIS: J02 Variant 2 — Wrong Wants/Requires
      Service: {{ global_service_name }}.service
      Timestamp: {{ ansible_date_time.iso8601 }}
      =============================================

      ROOT CAUSE:
      - Requires dependency on a service that always fails:
          auth-{{ global_service_name }}.service

      TECHNICAL DETAILS:
      - Requires enforces mandatory activation
      - auth service exits immediately with failure
      - systemd cancels the startup job

      SECONDARY NOISE:
      - Removed Requires=network-online.target

      EXPECTED SYMPTOMS:
      - systemctl start {{ global_service_name }}.service fails
      - Dependency failed messages
      - auth service in FAILED state

      VALID FIXES:
      - Replace Requires with Wants
      - Remove auth dependency if optional
      - Fix auth service implementation
      - Restore network-online.target if needed
    owner: root
    group: root
    mode: '0600'
