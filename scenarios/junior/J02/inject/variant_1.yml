---
# scenarios/junior/J02/inject/variant_1.yml
# ==============================================================================
# VARIANTE 1 — Usuario del servicio eliminado
# ==============================================================================

- name: Eliminar usuario real del servicio
  user:
    name: "{{ service_user }}"
    state: absent
    remove: false

- name: Crear usuario temporal incorrecto
  user:
    name: apiuser-temp
    system: true
    shell: /sbin/nologin
    state: present

- name: Cambiar ownership del script a usuario incorrecto
  file:
    path: "{{ service_dir }}/start.sh"
    owner: apiuser-temp
    group: apiuser-temp

- name: Registrar variante 1 en log
  lineinfile:
    path: "{{ log_file }}"
    line: "[VARIANTE 1] Usuario {{ service_user }} no existe pero systemd lo referencia"
