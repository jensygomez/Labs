---
# ==============================================================================
# VARIANTE 1 — Dependencias circulares y orden incorrecto en systemd
# ==============================================================================
#
# PROPÓSITO DEL INCIDENTE:
#   Simular un fallo de arranque causado por una mala definición de dependencias
#   entre unidades systemd, específicamente una dependencia circular dura
#   (Requires + After en ambos sentidos).
#
# CONTEXTO DEL LAB:
#   - El servicio {{ global_service_name }} ya existe y es funcional
#   - Esta variante NO rompe el binario ni el script
#   - El fallo ocurre ANTES de la ejecución del proceso
#
# PROBLEMAS INYECTADOS:
#
#   1. Ruido secundario:
#      - Se degrada la dependencia de red:
#          After=network-online.target  →  After=network.target
#      - Esto NO es la causa principal del fallo
#
#   2. Servicio auxiliar ficticio:
#      - Se crea db-{{ global_service_name }}.service
#      - Representa una dependencia externa (ej. base de datos)
#
#   3. Dependencia circular dura (causa raíz):
#
#      {{ global_service_name }}.service
#        Requires=db-{{ global_service_name }}.service
#        After=db-{{ global_service_name }}.service
#
#      db-{{ global_service_name }}.service
#        Requires={{ global_service_name }}.service
#        After={{ global_service_name }}.service
#
# RESULTADO ESPERADO:
#   - systemctl start {{ global_service_name }}.service falla
#   - El servicio nunca llega a ejecutarse
#   - systemd detecta una dependencia circular y cancela el job
#
# MENSAJES TÍPICOS:
#   - "Dependency failed"
#   - "Job canceled"
#   - "Found dependency cycle"
#
# OBJETIVO DIDÁCTICO:
#   - Comprender Requires vs Wants
#   - Entender que After define ORDEN, no activación
#   - Diagnosticar dependencias circulares en systemd
#   - Leer correctamente systemctl status y journalctl
#
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Backup del unit original
# ------------------------------------------------------------------------------
# Permite revertir el estado del sistema tras el laboratorio
- name: V1 | Backup del unit original
  copy:
    src: "/etc/systemd/system/{{ global_service_name }}.service"
    dest: "/etc/systemd/system/{{ global_service_name }}.service.v1backup"
    remote_src: yes
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# 2. Degradar dependencia de red (ruido secundario)
# ------------------------------------------------------------------------------
# No rompe el servicio por sí solo, pero confunde el análisis inicial
- name: V1 | Degradar dependencia de red (network-online → network)
  lineinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    regexp: '^After=network-online\.target$'
    line: 'After=network.target'
    backup: yes

# ------------------------------------------------------------------------------
# 3. Crear servicio auxiliar con dependencia circular
# ------------------------------------------------------------------------------
# Servicio ficticio que representa una base de datos u otro backend
- name: V1 | Crear servicio db-{{ global_service_name }} con dependencia circular
  copy:
    dest: "/etc/systemd/system/db-{{ global_service_name }}.service"
    content: |
      [Unit]
      Description=Database Service for {{ global_service_name }}
      Requires={{ global_service_name }}.service
      After={{ global_service_name }}.service

      [Service]
      Type=simple
      ExecStart=/usr/bin/sleep infinity
      User={{ global_service_user }}
      Group={{ global_service_user }}
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# 4. Introducir dependencia circular en el servicio principal
# ------------------------------------------------------------------------------
# Aquí se completa el ciclo de dependencia
- name: V1 | Inyectar Requires y After hacia el servicio db (circular)
  blockinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    marker: "# {mark} J02 VARIANT 1 CIRCULAR DEPENDENCY"
    insertafter: '^\[Unit\]'
    block: |
      Requires=db-{{ global_service_name }}.service
      After=db-{{ global_service_name }}.service
    backup: yes

# ------------------------------------------------------------------------------
# 5. Recargar systemd
# ------------------------------------------------------------------------------
- name: V1 | Recargar daemon systemd
  systemd:
    daemon_reload: yes

# ------------------------------------------------------------------------------
# 6. Asegurar estado detenido
# ------------------------------------------------------------------------------
# Garantiza que el fallo ocurra al intentar iniciar el servicio
- name: V1 | Detener servicio antes de la prueba
  systemd:
    name: "{{ global_service_name }}.service"
    state: stopped

# ------------------------------------------------------------------------------
# 7. Registrar inyección (log técnico)
# ------------------------------------------------------------------------------
- name: V1 | Registrar inyección de la variante
  lineinfile:
    path: "/var/log/j02-inject.log"
    create: yes
    line: "[J02-V1-{{ ansible_date_time.epoch }}] Dependencia circular inyectada entre {{ global_service_name }}.service y db-{{ global_service_name }}.service"
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# 8. Archivo de diagnóstico (uso instructor / corrección)
# ------------------------------------------------------------------------------
- name: V1 | Crear archivo de diagnóstico
  copy:
    dest: "/tmp/j02_variant_1_diagnosis.txt"
    content: |
      =============================================
      DIAGNOSIS: J02 Variant 1 — Circular Dependencies
      Service: {{ global_service_name }}.service
      Timestamp: {{ ansible_date_time.iso8601 }}
      =============================================

      ROOT CAUSE:
      - Circular dependency between:
          {{ global_service_name }}.service
          db-{{ global_service_name }}.service

      TECHNICAL DETAILS:
      - Requires + After used on both sides
      - systemd cannot resolve startup order
      - Job is canceled before ExecStart

      SECONDARY NOISE:
      - network-online.target degraded to network.target

      EXPECTED SYMPTOMS:
      - systemctl start {{ global_service_name }}.service fails
      - systemctl status shows dependency errors
      - journalctl reports dependency cycle

      VALID FIXES:
      - Remove one side of Requires
      - Replace Requires with Wants
      - Break the dependency loop
      - Restore correct network dependency if needed
    owner: root
    group: root
    mode: '0600'
