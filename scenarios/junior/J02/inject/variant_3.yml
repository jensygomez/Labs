---
# ==============================================================================
# VARIANTE 3 — Conditions / Assertions bloquean el arranque
# ==============================================================================
#
# DESCRIPCIÓN (para el alumno / instructor):
#
# Esta variante introduce condiciones (Condition*) y aserciones (Assert*)
# de systemd que no se cumplen en el entorno actual.
#
# El servicio NO muestra errores explícitos al iniciar, pero systemd
# lo omite silenciosamente debido a condiciones fallidas.
#
# PROBLEMAS INYECTADOS:
#
# 1. ConditionPathExists apunta a un archivo inexistente
# 2. ConditionFileNotEmpty apunta a un archivo vacío
# 3. ExecCondition ejecuta un script que siempre falla
#
# RESULTADO ESPERADO:
# - systemctl start {{ global_service_name }}.service no muestra error
# - systemctl status muestra "inactive (dead)"
# - journalctl no muestra fallo directo del servicio
#
# OBJETIVO DIDÁCTICO:
# - Entender diferencia entre Condition y Assert
# - Diagnosticar servicios que NO inician sin errores
# - Usar systemctl cat / systemd-analyze verify
#
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Backup del unit original
# ------------------------------------------------------------------------------
- name: V3 | Backup del unit original
  copy:
    src: "/etc/systemd/system/{{ global_service_name }}.service"
    dest: "/etc/systemd/system/{{ global_service_name }}.service.v3backup"
    remote_src: yes
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# 2. Romper ConditionPathExists
# ------------------------------------------------------------------------------
- name: V3 | Eliminar archivo requerido por ConditionPathExists
  file:
    path: "/etc/{{ global_service_name }}/enabled"
    state: absent

# ------------------------------------------------------------------------------
# 3. Romper ConditionFileNotEmpty
# ------------------------------------------------------------------------------
- name: V3 | Vaciar archivo de configuración
  copy:
    dest: "{{ config_path }}"
    content: ""
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0640'

# ------------------------------------------------------------------------------
# 4. Agregar condiciones bloqueantes al unit
# ------------------------------------------------------------------------------
- name: V3 | Agregar ConditionPathExists inválido
  blockinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    marker: "# {mark} J02 VARIANT 3 CONDITIONS"
    insertafter: '^\[Unit\]'
    block: |
      ConditionPathExists=/etc/{{ global_service_name }}/enabled
      ConditionFileNotEmpty={{ config_path }}
    backup: yes

# ------------------------------------------------------------------------------
# 5. Crear ExecCondition que siempre falla
# ------------------------------------------------------------------------------
- name: V3 | Crear script ExecCondition fallido
  copy:
    dest: "/usr/local/bin/check-{{ global_service_name }}.sh"
    content: |
      #!/bin/bash
      echo "ExecCondition failed intentionally for {{ global_service_name }}" >&2
      exit 1
    owner: root
    group: root
    mode: '0755'

# ------------------------------------------------------------------------------
# 6. Agregar ExecCondition al servicio
# ------------------------------------------------------------------------------
- name: V3 | Agregar ExecCondition al unit
  lineinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    line: 'ExecCondition=/usr/local/bin/check-{{ global_service_name }}.sh'
    insertafter: '^ExecStart='
    backup: yes

# ------------------------------------------------------------------------------
# 7. Recargar systemd
# ------------------------------------------------------------------------------
- name: V3 | Recargar daemon systemd
  systemd:
    daemon_reload: yes

# ------------------------------------------------------------------------------
# 8. Asegurar servicio detenido
# ------------------------------------------------------------------------------
- name: V3 | Detener servicio para evidenciar omisión
  systemd:
    name: "{{ global_service_name }}.service"
    state: stopped
  failed_when: false

# ------------------------------------------------------------------------------
# 9. Registrar inyección
# ------------------------------------------------------------------------------
- name: V3 | Registrar inyección de la variante
  lineinfile:
    path: "/var/log/j02-inject.log"
    create: yes
    line: "[J02-V3-{{ ansible_date_time.epoch }}] Conditions bloqueantes: ConditionPathExists + ConditionFileNotEmpty + ExecCondition fallido ({{ global_service_name }})"
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# 10. Archivo de diagnóstico para instructor
# ------------------------------------------------------------------------------
- name: V3 | Crear archivo de diagnóstico
  copy:
    dest: "/tmp/j02_variant_3_diagnosis.txt"
    content: |
      =============================================
      DIAGNOSIS: J02 Variant 3 — Condition / Assert
      Service: {{ global_service_name }}.service
      Timestamp: {{ ansible_date_time.iso8601 }}
      =============================================

      ISSUES INJECTED:
      - ConditionPathExists points to missing file
      - ConditionFileNotEmpty points to empty config
      - ExecCondition always fails

      EXPECTED SYMPTOMS:
      - systemctl start shows no error
      - systemctl status: inactive (dead)
      - Service silently skipped by systemd

      DIAGNOSTIC COMMANDS:
      - systemctl cat {{ global_service_name }}.service
      - systemd-analyze verify {{ global_service_name }}.service
      - journalctl -u {{ global_service_name }}.service

      EXPECTED FIXES:
      - Restore required files
      - Remove or correct conditions
      - Fix or remove ExecCondition
    owner: root
    group: root
    mode: '0600'
