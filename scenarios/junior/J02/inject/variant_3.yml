---
# ==============================================================================
# VARIANTE 3 — Conditions / Assertions bloquean el arranque
# ==============================================================================
#
# PROPÓSITO DEL INCIDENTE:
#   Simular un servicio que NO arranca pero tampoco muestra errores explícitos,
#   debido a condiciones (Condition*) y validaciones previas (ExecCondition)
#   que no se cumplen.
#
# CONTEXTO DEL LAB:
#   - El servicio {{ global_service_name }} está correctamente instalado
#   - El script de inicio existe y es válido
#   - No hay fallos de dependencias ni de permisos
#   - systemd decide NO ejecutar el servicio
#
# COMPORTAMIENTO CLAVE:
#   - El servicio es omitido silenciosamente
#   - ExecStart nunca se ejecuta
#   - systemctl start no devuelve error
#
# PROBLEMAS INYECTADOS:
#
#   1. ConditionPathExists:
#      - Apunta a un archivo inexistente:
#          /etc/{{ global_service_name }}/enabled
#
#   2. ConditionFileNotEmpty:
#      - Apunta a un archivo vacío:
#          {{ config_path }}
#
#   3. ExecCondition (CAUSA RAÍZ):
#      - Ejecuta un script que siempre retorna exit 1
#
# RESULTADO ESPERADO:
#   - systemctl start {{ global_service_name }}.service no muestra error
#   - systemctl status muestra: inactive (dead)
#   - journalctl no muestra fallos del proceso principal
#
# MENSAJES TÍPICOS:
#   - "Condition check resulted in ... not being met"
#   - Servicio omitido sin ejecución
#
# OBJETIVO DIDÁCTICO:
#   - Entender diferencia entre Condition y Assert
#   - Comprender por qué systemd puede omitir servicios silenciosamente
#   - Diagnosticar servicios que no fallan, pero tampoco arrancan
#   - Usar herramientas de inspección de units
#
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Backup del unit original
# ------------------------------------------------------------------------------
# Permite restaurar el servicio tras finalizar el laboratorio
- name: V3 | Backup del unit original
  copy:
    src: "/etc/systemd/system/{{ global_service_name }}.service"
    dest: "/etc/systemd/system/{{ global_service_name }}.service.v3backup"
    remote_src: yes
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# 2. Romper ConditionPathExists
# ------------------------------------------------------------------------------
# El archivo requerido por la condición deja de existir
- name: V3 | Eliminar archivo requerido por ConditionPathExists
  file:
    path: "/etc/{{ global_service_name }}/enabled"
    state: absent

# ------------------------------------------------------------------------------
# 3. Romper ConditionFileNotEmpty
# ------------------------------------------------------------------------------
# El archivo existe, pero queda vacío
- name: V3 | Vaciar archivo de configuración
  copy:
    dest: "{{ config_path }}"
    content: ""
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0640'

# ------------------------------------------------------------------------------
# 4. Inyectar condiciones bloqueantes en el unit
# ------------------------------------------------------------------------------
# Estas condiciones fallan y provocan que systemd omita el servicio
- name: V3 | Inyectar ConditionPathExists y ConditionFileNotEmpty
  blockinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    marker: "# {mark} J02 VARIANT 3 CONDITIONS"
    insertafter: '^\[Unit\]'
    block: |
      ConditionPathExists=/etc/{{ global_service_name }}/enabled
      ConditionFileNotEmpty={{ config_path }}
    backup: yes

# ------------------------------------------------------------------------------
# 5. Crear ExecCondition que siempre falla (CAUSA RAÍZ)
# ------------------------------------------------------------------------------
# ExecCondition se ejecuta antes de ExecStart y puede abortar el arranque
- name: V3 | Crear script ExecCondition fallido
  copy:
    dest: "/usr/local/bin/check-{{ global_service_name }}.sh"
    content: |
      #!/bin/bash
      echo "ExecCondition failed intentionally for {{ global_service_name }}" >&2
      exit 1
    owner: root
    group: root
    mode: '0755'

# ------------------------------------------------------------------------------
# 6. Asociar ExecCondition al servicio
# ------------------------------------------------------------------------------
# Aunque las Condition ya fallan, este refuerza el bloqueo
- name: V3 | Agregar ExecCondition al unit
  lineinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    line: 'ExecCondition=/usr/local/bin/check-{{ global_service_name }}.sh'
    insertafter: '^ExecStart='
    backup: yes

# ------------------------------------------------------------------------------
# 7. Recargar systemd
# ------------------------------------------------------------------------------
- name: V3 | Recargar daemon systemd
  systemd:
    daemon_reload: yes

# ------------------------------------------------------------------------------
# 8. Asegurar servicio detenido
# ------------------------------------------------------------------------------
# Garantiza que el comportamiento se observe al intentar iniciar
- name: V3 | Detener servicio para evidenciar omisión
  systemd:
    name: "{{ global_service_name }}.service"
    state: stopped
  failed_when: false

# ------------------------------------------------------------------------------
# 9. Registrar inyección (log técnico)
# ------------------------------------------------------------------------------
- name: V3 | Registrar inyección de la variante
  lineinfile:
    path: "/var/log/j02-inject.log"
    create: yes
    line: "[J02-V3-{{ ansible_date_time.epoch }}] Conditions bloqueantes: PathExists + FileNotEmpty + ExecCondition fallido ({{ global_service_name }})"
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# 10. Archivo de diagnóstico (uso instructor / corrección)
# ------------------------------------------------------------------------------
- name: V3 | Crear archivo de diagnóstico
  copy:
    dest: "/tmp/j02_variant_3_diagnosis.txt"
    content: |
      =============================================
      DIAGNOSIS: J02 Variant 3 — Conditions / ExecCondition
      Service: {{ global_service_name }}.service
      Timestamp: {{ ansible_date_time.iso8601 }}
      =============================================

      ROOT CAUSE:
      - One or more Condition* directives evaluate to false
      - ExecCondition returns non-zero exit code

      TECHNICAL DETAILS:
      - Condition* directives silently skip unit execution
      - ExecCondition aborts service start before ExecStart
      - systemd does not treat this as a service failure

      EXPECTED SYMPTOMS:
      - systemctl start shows no error
      - systemctl status: inactive (dead)
      - No ExecStart logs present

      DIAGNOSTIC COMMANDS:
      - systemctl status {{ global_service_name }}.service
      - systemctl cat {{ global_service_name }}.service
      - systemd-analyze verify {{ global_service_name }}.service
      - journalctl -u {{ global_service_name }}.service

      VALID FIXES:
      - Restore missing files
      - Ensure config file is not empty
      - Remove or fix ExecCondition
      - Simplify conditions when not strictly required
    owner: root
    group: root
    mode: '0600'
