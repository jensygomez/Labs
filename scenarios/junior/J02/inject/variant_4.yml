---
# ==============================================================================
# VARIANTE 4 — Resource Limits Too Restrictive
#
# OBJETIVO:
# Provocar el fallo del servicio configurando límites de recursos extremadamente
# bajos en systemd (FDs, procesos, memoria, CPU, tareas), mientras que el script
# de inicio exige explícitamente más recursos mediante validaciones con ulimit.
#
# RESULTADO ESPERADO:
# - El servicio falla al iniciar
# - systemd aplica límites demasiado restrictivos
# - El script detecta recursos insuficientes y aborta
#
# ENFOQUE DE DIAGNÓSTICO:
# - systemctl status → límites aplicados
# - journalctl → errores de recursos
# - Revisión de LimitNOFILE / LimitNPROC / MemoryMax / CPUQuota
# ==============================================================================

- name: V4 | Guardar estado original del servicio
  copy:
    src: "/etc/systemd/system/{{ global_service_name }}.service"
    dest: "/etc/systemd/system/{{ global_service_name }}.service.v4backup"
    remote_src: yes
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------------------------
# Aplicar límites extremadamente restrictivos en systemd
# ------------------------------------------------------------------------------

- name: V4 | Limitar file descriptors (NOFILE)
  lineinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    regexp: '^LimitNOFILE='
    line: 'LimitNOFILE=64'
    insertafter: '^\[Service\]'
    backup: yes

- name: V4 | Limitar número de procesos (NPROC)
  lineinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    regexp: '^LimitNPROC='
    line: 'LimitNPROC=8'
    insertafter: '^\[Service\]'
    backup: yes

- name: V4 | Limitar memoria máxima (MemoryMax)
  lineinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    regexp: '^MemoryMax='
    line: 'MemoryMax=16M'
    insertafter: '^\[Service\]'
    backup: yes

- name: V4 | Limitar CPU disponible
  lineinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    regexp: '^CPUQuota='
    line: 'CPUQuota=5%'
    insertafter: '^\[Service\]'
    backup: yes

- name: V4 | Limitar número máximo de tareas
  lineinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    regexp: '^TasksMax='
    line: 'TasksMax=4'
    insertafter: '^\[Service\]'
    backup: yes

- name: V4 | Reducir prioridad de I/O (puede ser ignorado según entorno)
  lineinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    regexp: '^IOWeight='
    line: 'IOWeight=10'
    insertafter: '^\[Service\]'
    backup: yes

- name: V4 | Deshabilitar core dumps
  lineinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    regexp: '^LimitCORE='
    line: 'LimitCORE=0'
    insertafter: '^\[Service\]'
    backup: yes

- name: V4 | Limitar memoria bloqueada
  lineinfile:
    path: "/etc/systemd/system/{{ global_service_name }}.service"
    regexp: '^LimitMEMLOCK='
    line: 'LimitMEMLOCK=65536'
    insertafter: '^\[Ser]()
