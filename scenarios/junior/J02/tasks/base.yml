# Añadir estas tareas a base.yml
- name: Crear servicio systemd desde template
  template:
    src: service-template.service.j2
    dest: "/etc/systemd/system/{{ global_service_name }}.service"
    owner: root
    group: root
    mode: '0644'

- name: Crear script de inicio desde template
  template:
    src: start.sh.j2
    dest: "{{ service_dir }}/start.sh"
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0755'

- name: Crear archivo de configuración desde template
  template:
    src: config-template.conf.j2
    dest: "{{ config_path }}"
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0640'

- name: Crear algunos archivos/directorios para condiciones
  file:
    path: "/etc/{{ global_service_name }}/enabled"
    state: touch
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0644'

- name: Crear directorio para socket/ready
  file:
    path: "/var/run/{{ global_service_name }}"
    state: directory
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0755'

- name: Crear archivo ready
  copy:
    dest: "/var/run/{{ global_service_name }}/ready"
    content: "ready"
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0644'