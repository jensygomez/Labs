# scenarios/junior/J02/tasks/base.yml
# ==============================================================================
# Preparación del baseline del servicio
# Usa SOLO variables globales ya definidas
# ==============================================================================

- name: Crear directorio del servicio
  file:
    path: "/opt/{{ global_service_name }}"
    state: directory
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0755'

- name: Crear directorio de configuración
  file:
    path: "/etc/{{ global_service_name }}"
    state: directory
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0755'

- name: Crear directorio de logs
  file:
    path: "/var/log/{{ global_service_name }}"
    state: directory
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0755'

- name: Crear servicio systemd desde template
  template:
    src: service-template.service.j2
    dest: "/etc/systemd/system/{{ global_service_name }}.service"
    owner: root
    group: root
    mode: '0644'

- name: Crear script de inicio desde template
  template:
    src: start.sh.j2
    dest: "/opt/{{ global_service_name }}/start.sh"
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0755'

- name: Crear archivo de configuración del servicio
  template:
    src: config-template.conf.j2
    dest: "{{ config_path }}"
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0640'

- name: Crear archivo de condición "enabled"
  file:
    path: "/etc/{{ global_service_name }}/enabled"
    state: touch
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0644'

- name: Crear directorio runtime
  file:
    path: "/var/run/{{ global_service_name }}"
    state: directory
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0755'

- name: Crear archivo ready
  copy:
    dest: "/var/run/{{ global_service_name }}/ready"
    content: "ready"
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0644'
