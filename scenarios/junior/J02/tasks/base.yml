- name: Crear usuario del servicio (aleatorio por ejecución)
  user:
    name: "{{ global_service_user }}"
    system: yes
    shell: /sbin/nologin
    state: present

- name: Crear directorio del servicio
  file:
    path: "{{ service_dir }}"
    state: directory
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0755'

- name: Crear archivo de configuración (nombre aleatorio)
  copy:
    dest: "{{ config_path }}"
    content: |
      # Configuración de {{ global_service_name }}
      port: {{ service_port }}
      log_file: {{ log_path }}
    owner: "{{ global_service_user }}"
    group: "{{ global_service_user }}"
    mode: '0640'