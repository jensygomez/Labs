---
# ==============================================================================
# VARIANT_FW_HTTP.yml — Bloqueo de HTTP en SERVER (firewalld)
# ==============================================================================
#
# 🎯 PROPÓSITO:
# Simular un fallo de conectividad a HTTP bloqueando el puerto 80 en el servidor.
# Este tipo de escenario es típico en entornos donde políticas de firewall limitan
# servicios públicos mientras otros servicios (DB, SSH, HTTPS) permanecen activos.
#
# 🔥 FALLA INTRODUCIDA:
# - Firewall (firewalld) bloquea el puerto TCP 80 en la zona activa
# - HTTP deja de ser accesible desde clientes
# - Otros servicios (MariaDB vía HAProxy, HTTPS, SSH) siguen funcionando
#
# 🧪 SÍNTOMAS ESPERADOS:
# ✔ Ping funciona (ICMP permitido)
# ✔ HTTP falla
# ✔ MariaDB sigue accesible vía HAProxy (TCP 3306)
#
# 🛠 COMANDOS DE DIAGNÓSTICO MANUAL:
#   firewall-cmd --zone=public --list-all
#   curl -v http://192.168.122.50
#   ping 192.168.122.50
#   mysql -h 192.168.122.70 -u user_prueba -p
#
# 🧠 LECCIÓN CLAVE:
# - Servicios TCP específicos pueden estar bloqueados aunque la conectividad ICMP funcione
# - Firewalld permite bloquear/permitir servicios por zona sin afectar la red completa
# - Siempre verifica qué zona y qué interfaz está activa antes de modificar reglas
#
# 📍 TOPOLOGÍA DEL LAB:
# CLIENT01 (192.168.122.21) → HTTP bloqueado
# SERVER_EU
#   - .50 → HTTP (bloqueado)
#   - .60 → MariaDB
#   - .70 → HAProxy
# ==============================================================================


- name: "[VARIANT_FW_HTTP] Detectar zona activa de firewalld"
  command: firewall-cmd --get-active-zones
  register: active_zone
  changed_when: false
  delegate_to: web01
  become: yes

- name: "[VARIANT_FW_HTTP] Extraer zona activa"
  set_fact:
    server_zone: "{{ active_zone.stdout.split()[0] }}"
  delegate_to: web01

- name: "[VARIANT_FW_HTTP] Verificar servicios y puertos antes de bloquear HTTP"
  command: firewall-cmd --zone={{ server_zone }} --list-all
  register: before
  changed_when: false
  delegate_to: web01

- name: "[VARIANT_FW_HTTP] Bloquear servicio HTTP en firewalld"
  command: firewall-cmd --zone={{ server_zone }} --remove-service=http --permanent
  delegate_to: web01
  become: yes

- name: "[VARIANT_FW_HTTP] Recargar firewalld para aplicar cambios"
  command: firewall-cmd --reload
  delegate_to: web01
  become: yes

- name: "[VARIANT_FW_HTTP] Verificar servicios y puertos después de bloquear HTTP"
  command: firewall-cmd --zone={{ server_zone }} --list-all
  register: after
  changed_when: false
  delegate_to: web01

- name: "[VARIANT_FW_HTTP] Debug: mostrar servicios antes y después"
  debug:
    msg:
      - "Antes de bloquear HTTP: {{ before.stdout }}"
      - "Después de bloquear HTTP: {{ after.stdout }}"
  delegate_to: web01


- name: "[TICKET NOC] INC-J02-V1 - HTTP bloqueado por Firewalld"
  debug:
    msg:
      - "========================================================================="
      - "| 🎫 INC-J02-V1 – SERVIDOR WEB NO RESPONDE EN HTTP                        |"
      - "| PRIORIDAD: 🟡 MEDIA | IMPACTO: REPORTADO POR USUARIO CLIENTE           |"
      - "========================================================================="
      - "| 📋 DESCRIPCIÓN USUARIO:                                                |"
      - "| 'Desde CLIENT01 (192.168.122.21) no puedo acceder a la web:'           |"
      - "| • Servidor Web (192.168.122.50) - puerto 80 inaccesible                |"
      - "| 'Los servicios TCP sobre HTTP parecen caídos, revisar conectividad.'   |"
      - "-------------------------------------------------------------------------"
      - "| 📊 METADATOS TÉCNICOS:                                                 |"
      - "| • Reportado: CLIENT01 → WEB(.50)                                       |"
      - "| • Protocolos reportados: HTTP / TCP                                    |"
      - "| • Impacto reportado: parcial (solo HTTP)                               |"
      - "-------------------------------------------------------------------------"
      - "| 💭 OBSERVACIONES INICIALES:                                             |"
      - "| • Ping a 192.168.122.50 funciona → red básica operativa                |"
      - "| • Conexión a MariaDB vía proxy (.70 → .60) funciona                    |"
      - "| • Firewalld puede estar bloqueando solo HTTP                           |"
      - "-------------------------------------------------------------------------"
      - "| 🎯 TU MISIÓN:                                                           |"
      - "| Diagnosticar el bloqueo en HTTP                                        |"
      - "| Validar impacto real en negocio: solo HTTP afecta al cliente           |"
      - "| Documentar hallazgo y preparar reporte NOC                             |"
      - "========================================================================="
      - "| ⏰ INICIAR DIAGNÓSTICO → Presiona ENTER cuando estés listo             |"
      - "========================================================================="
  run_once: true

