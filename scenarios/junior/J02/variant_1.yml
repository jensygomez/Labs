---
# ==============================================================================
# VARIANT_FW_HTTP.yml — Bloqueo de HTTP en SERVER (firewalld)
# ==============================================================================
#
# 🎯 PROPÓSITO:
# Simular un fallo de conectividad a HTTP bloqueando el puerto 80 en el servidor.
# Este tipo de escenario es típico en entornos donde políticas de firewall limitan
# servicios públicos mientras otros servicios (DB, SSH, HTTPS) permanecen activos.
#
# 🔥 FALLA INTRODUCIDA:
# - Firewall (firewalld) bloquea el puerto TCP 80 en la zona activa
# - HTTP deja de ser accesible desde clientes
# - Otros servicios (MariaDB vía HAProxy, HTTPS, SSH) siguen funcionando
#
# 🧪 SÍNTOMAS ESPERADOS:
# ✔ Ping funciona (ICMP permitido)
# ✔ HTTP falla
# ✔ MariaDB sigue accesible vía HAProxy (TCP 3306)
#
# 🛠 COMANDOS DE DIAGNÓSTICO MANUAL:
#   firewall-cmd --zone=public --list-all
#   curl -v http://192.168.122.50
#   ping 192.168.122.50
#   mysql -h 192.168.122.70 -u user_prueba -p
#
# 🧠 LECCIÓN CLAVE:
# - Servicios TCP específicos pueden estar bloqueados aunque la conectividad ICMP funcione
# - Firewalld permite bloquear/permitir servicios por zona sin afectar la red completa
# - Siempre verifica qué zona y qué interfaz está activa antes de modificar reglas
#
# 📍 TOPOLOGÍA DEL LAB:
# CLIENT01 (192.168.122.21) → HTTP bloqueado
# SERVER_EU
#   - .50 → HTTP (bloqueado)
#   - .60 → MariaDB
#   - .70 → HAProxy
# ==============================================================================


# /home/jensy/Labs/scenarios/junior/J01/variant_1.yml
---
metadata:
  lab_id: "J01"
  variant_id: "1"
  title: "Bloqueo HTTP en firewall (puerto 80)"
  description: "Firewalld bloquea el puerto 80, nginx corre pero es inaccesible"
  difficulty: "Junior"
  estimated_time: "10-15 minutos"

# SERVICIOS QUE ESTE LAB REQUIERE ACTIVOS
# (basado en sección 6 de tu documento base)
services:
  enabled:
    - nginx      # Servicio web debe estar corriendo
    - firewalld  # Firewall debe estar activo
  disabled:      # Servicios que deben permanecer apagados
    - mariadb
    - haproxy

# CONFIGURACIÓN DE RED PARA ESTE LAB
network:
  vips:
    - ip: "192.168.122.50"
      service: "nginx"
      interface: "enp1s0"
  # NOTA: 192.168.122.60 (mariadb) y .70 (haproxy) NO se asignan

# ERRORES A INYECTAR EN EL SISTEMA
errors:
  - type: "firewall_block"
    description: "Bloquear puerto TCP 80 en zona public"
    commands:
      - firewall-cmd --zone=public --remove-port=80/tcp --permanent
      - firewall-cmd --reload

  # Error adicional opcional para hacerlo más interesante:
  - type: "service_state"
    description: "Asegurar que nginx está corriendo (para confirmar que no es problema del servicio)"
    commands:
      - systemctl enable nginx
      - systemctl start nginx

# INFORMACIÓN PARA EL ESTUDIANTE
student_info:
  scenario: |
    Eres el administrador del servidor web corporativo.
    Usuarios reportan que el sitio web (http://192.168.122.50) no responde.
    Debes diagnosticar y resolver el problema.
    
  symptoms:
    - "El sitio web no carga (timeout)"
    - "Ping al servidor funciona normalmente"
    - "SSH al servidor funciona"
    - "Otros servicios no están afectados"
    
  diagnostic_commands:
    - "firewall-cmd --zone=public --list-all"
    - "systemctl status nginx"
    - "curl -v http://192.168.122.50"
    - "ss -tlnp | grep :80"
    - "ip a show enp1s0"
    
  resolution_hint: |
    Revisa las reglas de firewall en la zona public.
    El puerto 80/tcp debe estar abierto para tráfico HTTP.