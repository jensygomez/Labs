---
# ==============================================================================
# VARIANT_3.yml — SELinux Enforcing bloquea Nginx
# ==============================================================================
#
# 🎯 PROPÓSITO:
# Simular un incidente donde el servicio web deja de ser accesible desde el 
# cliente debido a SELinux Enforcing bloqueando acceso a archivos estáticos,
# mientras otros servicios (ping, MariaDB) continúan funcionando normalmente.
#
# Este escenario reproduce fallos reales en:
#   - Cambios accidentales de SELinux contextos
#   - Despliegues sin validación SELinux
#   - Restauraciones incorrectas de archivos
#
# ------------------------------------------------------------------------------
# 🔥 FALLA INTRODUCIDA:
# - SELinux pasa a Enforcing 
# - Contextos de /usr/share/nginx/html/ → user_home_t (no httpd_sys_content_t)
# - j03_web.conf se deshabilita (evita bypass hardcoded)
# - Nginx corriendo pero devuelve 403 Forbidden
#
# ------------------------------------------------------------------------------
# 🧪 SÍNTOMAS ESPERADOS (DESDE CLIENT01):
#
# ✔ Ping → FUNCIONA
# ✖ HTTP (192.168.122.50) → 403 Forbidden  
# ✔ MariaDB (vía proxy .70) → FUNCIONA
#
# Error típico nginx error.log:
#   "Permission denied (13)"
#
# ------------------------------------------------------------------------------
# 🧠 LECCIÓN CLAVE (NOC / SENIOR):
#
# - Nginx active ≠ HTTP funciona
# - Firewalld http OK ≠ contenido accesible
# - SELinux bloquea SILENCIOSAMENTE (no siempre AVC denials)
# - Revisar nginx error.log + ls -laZ + restorecon
#
# ==============================================================================

# ------------------------------------------------------------------------------
# INYECCIÓN DEL FALLO
# ------------------------------------------------------------------------------


- name: "[VARIANT_SELINUX_NGINX] Detectar si j03_web.conf existe"
  stat:
    path: /etc/nginx/conf.d/j03_web.conf
  register: j03_conf
  changed_when: false

- name: "[VARIANT_SELINUX_NGINX] Desactivar j03_web.conf (bypass hardcoded)"
  copy:
    src: /etc/nginx/conf.d/j03_web.conf
    dest: /etc/nginx/conf.d/j03_web.conf.disabled
    remote_src: yes
  when: j03_conf.stat.exists
  become: yes

- name: "[VARIANT_SELINUX_NGINX] Verificar contextos ANTES"
  shell: ls -laZ /usr/share/nginx/html/ | head -3
  register: contextos_antes
  changed_when: false
  become: yes

- name: "[VARIANT_SELINUX_NGINX] Asegurar SELinux Enforcing"
  command: setenforce 1
  become: yes

- name: "[VARIANT_SELINUX_NGINX] Romper contextos SELinux (CAUSA 403)"
  shell: chcon -R -t user_home_t /usr/share/nginx/html/
  become: yes

- name: "[VARIANT_SELINUX_NGINX] Restart nginx"
  systemd:
    name: nginx
    state: restarted
  become: yes

- name: "[VARIANT_SELINUX_NGINX] Verificar contextos DESPUÉS"
  shell: ls -laZ /usr/share/nginx/html/ | head -3
  register: contextos_despues
  changed_when: false
  become: yes

- name: "[VARIANT_SELINUX_NGINX] Verificar nginx error.log"
  shell: tail -1 /var/log/nginx/error.log
  register: error_log
  changed_when: false
  become: yes

- name: "[VARIANT_SELINUX_NGINX] Debug - Estado final del bloqueo"
  debug:
    msg:
      - "Contextos ANTES: {{ contextos_antes.stdout }}"
      - "Contextos DESPUÉS: {{ contextos_despues.stdout }}"
      - "Nginx error.log: {{ error_log.stdout }}"

- name: "[TICKET NOC] INC-J02-V3 - Sitio web no accesible"
  debug:
    msg:
      - "========================================================================="
      - "| 🎫 INC-J02-V3 – SITIO WEB NO RESPONDE (192.168.122.50)                |"
      - "| PRIORIDAD: 🔴 ALTA | IMPACTO: SERVICIO CLIENTES                      |"
      - "========================================================================="
      - "| 📋 DESCRIPCIÓN USUARIO:                                               |"
      - "| 'El sitio está caído para todos los clientes.'                        |"
      - "| 'Página de error 403 Forbidden en todos los navegadores.'             |"
      - "| 'El servidor responde ping pero no contenido web.'                    |"
      - "-------------------------------------------------------------------------"
      - "| 📊 METADATOS TÉCNICOS:                                                |"
      - "| • Cliente: 192.168.122.21 → HTTP 192.168.122.50: 403 Forbidden        |"
      - "| • Nginx: active | Firewall: http OK | SELinux: Enforcing             |"
      - "-------------------------------------------------------------------------"
      - "| 💭 PISTAS DIAGNÓSTICO:                                                |"
      - "| • systemctl status nginx → active                                     |"
      - "| • firewall-cmd --list-services → http https ssh                       |"
      - "| • tail /var/log/nginx/error.log → Permission denied (13)              |"
      - "| • ls -laZ /usr/share/nginx/html/ → user_home_t ❌                      |"
      - "-------------------------------------------------------------------------"
      - "| 🎯 TU MISIÓN:                                                         |"
      - "| 1. Validar: ping → OK, netstat :80 → LISTEN, HTTP → 403               |"
      - "| 2. Diferenciar: Firewall NO, SELinux SÍ                               |"
      - "| 3. FIX: restorecon -Rv /usr/share/nginx/html/                        |"
      - "========================================================================="
      - "| ⏰ INICIAR DIAGNÓSTICO → Presiona ENTER cuando estés listo            |"
      - "========================================================================="
  run_once: true
