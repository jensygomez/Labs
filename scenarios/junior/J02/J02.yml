# ==============================================================================
# J02 — Service Configuration and DNS Resolution Issue
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CONFIGURACIÓN INICIAL (SOLO admin-j02.example.com)
# ------------------------------------------------------------------------------
- name: J02 | Configuración inicial
  hosts: admin-j02.example.com
  gather_facts: false

  tasks:
    - name: Cargar variables principales
      include_vars:
        file: vars/main.yml

    - name: Seleccionar variante aleatoria
      set_fact:
        selected_variant_file: "{{ variants | random }}"
      run_once: yes

    - name: Cargar datos de la variante
      include_vars:
        file: "tickets/{{ selected_variant_file }}"
        name: ticket_data

    - name: Establecer variables globales
      set_fact:
        global_variant: "{{ ticket_data.variant }}"
        global_selected_variant: "{{ selected_variant_file }}"
      run_once: yes

# ------------------------------------------------------------------------------
# 2. PREPARAR BASELINE
# ------------------------------------------------------------------------------
- name: J02 | Preparar baseline del sistema
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Cargar variables
      include_vars:
        file: vars/main.yml

    - name: Preparar estado base
      import_tasks: tasks/base.yml

# ------------------------------------------------------------------------------
# 3. INYECTAR FALLO
# ------------------------------------------------------------------------------
- name: J02 | Inyectar fallo
  hosts: web-j02.example.com
  become: true
  gather_facts: false

  tasks:
    - name: Cargar variables
      include_vars:
        file: vars/main.yml

    - name: Ejecutar inyección
      include_tasks: "inject/{{ hostvars['admin-j02.example.com'].global_selected_variant }}"

# ------------------------------------------------------------------------------
# 4. VERIFICAR SERVICIO
# ------------------------------------------------------------------------------
- name: J02 | Verificar estado del servicio
  hosts: web-j02.example.com
  become: true
  gather_facts: false

  tasks:
    - name: Comprobar estado real del servicio
      systemd:
        name: "{{ service_name }}"
      register: service_status
      failed_when: false
      changed_when: false

    - name: Comprobar resolución DNS
      shell: |
        dig +short {{ inventory_hostname }}
        dig +short admin-j02.{{ domain }}
        dig +short web-j02.{{ domain }}
        dig +short client-j02.{{ domain }}
      register: dns_check
      failed_when: false
      changed_when: false

    - name: Determinar estado para ticket
      set_fact:
        final_state: >-
          {% if service_status is failed or (service_status.status is defined and service_status.status.ActiveState != 'active') %}
            SERVICE DOWN
          {% elif 'NXDOMAIN' in dns_check.stdout or dns_check.rc != 0 %}
            DNS RESOLUTION FAILED
          {% else %}
            SERVICE OPERATIONAL
          {% endif %}
      delegate_to: admin-j02.example.com
      run_once: yes

# ------------------------------------------------------------------------------
# 5. MOSTRAR TICKET FINAL
# ------------------------------------------------------------------------------
- name: J02 | Mostrar resumen final
  hosts: admin-j02.example.com
  gather_facts: false

  tasks:
    - name: Preparar variables para show_ticket.yml
      set_fact:
        variant: "{{ hostvars['admin-j02.example.com'].global_variant }}"
        selected_variant_file: "{{ hostvars['admin-j02.example.com'].global_selected_variant }}"
        final_state: "{{ hostvars['admin-j02.example.com'].final_state | default('SERVICE DOWN') }}"
        service_user: "{{ hostvars['admin-j02.example.com'].service_user }}"
        service_name: "{{ hostvars['admin-j02.example.com'].service_name }}"
        service_dir: "{{ hostvars['admin-j02.example.com'].service_dir }}"
        domain: "{{ hostvars['admin-j02.example.com'].domain }}"

    - name: Mostrar ticket
      import_tasks: tasks/show_ticket.yml
      run_once: yes