# ==============================================================================
# J02 — Systemd Service Misconfiguration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CONFIGURACIÓN INICIAL Y RANDOMIZACIÓN
# ------------------------------------------------------------------------------
- name: J02 | Configuración inicial
  hosts: admin-j02.example.com
  gather_facts: false

  tasks:
    - name: Cargar variables principales
      include_vars:
        file: vars/main.yml

    # RANDOMIZACIÓN POR EJECUCIÓN (run_once)
    - name: Seleccionar elementos aleatorios para esta ejecución
      set_fact:
        current_service_name: "{{ random_elements.services | random }}"
        current_service_user: "{{ random_elements.users | random }}"
        current_config_file: "{{ random_elements.config_files | random }}"
        current_log_file: "{{ random_elements.log_files | random }}"
        current_port: "{{ random_elements.ports | random }}"
        current_timeout: "{{ [30, 45, 60, 90, 120] | random }}"
      run_once: yes
      delegate_to: localhost

    - name: Seleccionar variante aleatoria
      set_fact:
        selected_variant_file: "{{ variants | random }}"
      run_once: yes

    - name: Cargar datos de la variante
      include_vars:
        file: "tickets/{{ selected_variant_file }}"
        name: ticket_data

    - name: Establecer variables globales de la ejecución
      set_fact:
        global_service_name: "{{ current_service_name }}"
        global_service_user: "{{ current_service_user }}"
        global_variant: "{{ ticket_data.variant }}"
        global_selected_variant: "{{ selected_variant_file }}"
      run_once: yes

# ------------------------------------------------------------------------------
# 2. PREPARAR BASELINE
# ------------------------------------------------------------------------------
- name: J02 | Preparar baseline del sistema
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Cargar variables
      include_vars:
        file: vars/main.yml

    - name: Preparar estado base
      import_tasks: tasks/base.yml

# ------------------------------------------------------------------------------
# 3. INYECTAR FALLO
# ------------------------------------------------------------------------------
- name: J02 | Inyectar fallo
  hosts: web-j02.example.com
  become: true
  gather_facts: false

  tasks:
    - name: Cargar variables
      include_vars:
        file: vars/main.yml

    - name: Ejecutar inyección
      include_tasks: "inject/{{ hostvars['admin-j02.example.com'].global_selected_variant }}"

# ------------------------------------------------------------------------------
# 4. VERIFICAR SERVICIO
# ------------------------------------------------------------------------------
- name: J02 | Verificar estado del servicio
  hosts: web-j02.example.com
  become: true
  gather_facts: false

  tasks:
    - name: Comprobar estado real del servicio
      systemd:
        name: "{{ global_service_name }}.service"
      register: service_status
      failed_when: false
      changed_when: false

    - name: Verificar dependencias de systemd
      shell: |
        systemctl is-active "{{ global_service_name }}.service" || true
        systemctl show "{{ global_service_name }}.service" | grep -E "(LoadState|ActiveState|SubState)" || true
      register: systemd_check
      failed_when: false
      changed_when: false

    - name: Determinar estado para ticket
      set_fact:
        final_state: >-
          {% if service_status is failed or (service_status.status is defined and service_status.status.ActiveState != 'active') %}
            SERVICE DOWN
          {% elif 'loaded' not in systemd_check.stdout %}
            SYSTEMD CONFIG ERROR
          {% else %}
            SERVICE OPERATIONAL
          {% endif %}
      delegate_to: admin-j02.example.com
      run_once: yes

# ------------------------------------------------------------------------------
# 5. MOSTRAR TICKET FINAL
# ------------------------------------------------------------------------------
- name: J02 | Mostrar resumen final
  hosts: admin-j02.example.com
  gather_facts: false

  tasks:
    - name: Preparar variables para show_ticket.yml
      set_fact:
        variant: "{{ hostvars['admin-j02.example.com'].global_variant }}"
        selected_variant_file: "{{ hostvars['admin-j02.example.com'].global_selected_variant }}"
        final_state: "{{ hostvars['admin-j02.example.com'].final_state | default('SERVICE DOWN') }}"
        service_user: "{{ hostvars['admin-j02.example.com'].global_service_user }}"
        service_name: "{{ hostvars['admin-j02.example.com'].global_service_name }}.service"
        service_dir: "/opt/{{ hostvars['admin-j02.example.com'].global_service_name }}"
        domain: "example.com"

    - name: Mostrar ticket
      import_tasks: tasks/show_ticket.yml
      run_once: yes
