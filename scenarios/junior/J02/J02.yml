# ==============================================================================
# J02 — Systemd Service Misconfiguration
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. CREAR USUARIO CORPORATIVO (ejecuta como student)
# ------------------------------------------------------------------------------
- name: J02 | Crear usuario corporativo
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Crear usuario sysadmin-junior
      user:
        name: sysadmin-junior
        comment: "Junior System Administrator"
        shell: /bin/bash
        groups: "wheel"
        append: yes
        password: "{{ 'redhat' | password_hash('sha512') }}"
        state: present

    - name: Configurar sudo sin password
      copy:
        dest: /etc/sudoers.d/sysadmin-junior
        content: |
          sysadmin-junior ALL=(ALL) NOPASSWD: ALL
        validate: /usr/sbin/visudo -cf %s

# ------------------------------------------------------------------------------
# 1. CONFIGURACIÓN INICIAL Y RANDOMIZACIÓN (ORQUESTADOR)
# ------------------------------------------------------------------------------
- name: J02 | Configuración inicial
  hosts: admin01
  remote_user: sysadmin-junior
  become: true
  gather_facts: false

  tasks:
    - name: Cargar variables principales
      include_vars:
        file: vars/main.yml

    - name: Seleccionar elementos aleatorios para esta ejecución
      set_fact:
        current_service_name: "{{ random_elements.services | random }}"
        current_service_user: "{{ random_elements.users | random }}"
        current_config_file: "{{ random_elements.config_files | random }}"
        current_log_file: "{{ random_elements.log_files | random }}"
        current_port: "{{ random_elements.ports | random }}"
      run_once: yes

    - name: Seleccionar variante aleatoria
      set_fact:
        selected_variant_file: "{{ variants | random }}"
      run_once: yes

    - name: Cargar datos de la variante
      include_vars:
        file: "tickets/{{ selected_variant_file }}"
        name: ticket_data

    - name: Establecer variables globales de la ejecución
      set_fact:
        global_service_name: "{{ current_service_name }}"
        global_service_user: "{{ current_service_user }}"
        global_variant: "{{ ticket_data.variant }}"
        global_selected_variant: "{{ selected_variant_file }}"
      run_once: yes

# ------------------------------------------------------------------------------
# 2. PREPARAR BASELINE (como sysadmin-junior)
# ------------------------------------------------------------------------------
- name: J02 | Preparar baseline del sistema
  hosts: all
  remote_user: sysadmin-junior
  become: true
  gather_facts: true

  tasks:
    - name: Exportar variables globales desde admin01
      set_fact:
        global_service_name: "{{ hostvars['admin01'].global_service_name }}"
        global_service_user: "{{ hostvars['admin01'].global_service_user }}"
        current_config_file: "{{ hostvars['admin01'].current_config_file }}"
      when: inventory_hostname != 'admin01'

    - name: Preparar estado base
      import_tasks: tasks/base.yml

# ------------------------------------------------------------------------------
# 3. INYECTAR FALLO (como sysadmin-junior)
# ------------------------------------------------------------------------------
- name: J02 | Inyectar fallo
  hosts: web01
  remote_user: sysadmin-junior
  become: true
  gather_facts: false

  tasks:
    - name: Ejecutar inyección
      include_tasks: "inject/{{ hostvars['admin01'].global_selected_variant }}"

# ------------------------------------------------------------------------------
# 4. VERIFICAR SERVICIO (como sysadmin-junior)
# ------------------------------------------------------------------------------
- name: J02 | Verificar estado del servicio
  hosts: web01
  remote_user: sysadmin-junior
  become: true
  gather_facts: false

  tasks:
    - name: Comprobar estado real del servicio
      systemd:
        name: "{{ hostvars['admin01'].global_service_name }}.service"
      register: service_status
      failed_when: false
      changed_when: false

    - name: Determinar estado para ticket
      set_fact:
        final_state: >-
          {{ 'SERVICE DOWN'
             if (service_status is failed
             or (service_status.status is defined
             and service_status.status.ActiveState != 'active'))
             else 'SERVICE OPERATIONAL' }}
      delegate_to: admin01
      run_once: yes

# ------------------------------------------------------------------------------
# 5. MOSTRAR TICKET FINAL (como sysadmin-junior)
# ------------------------------------------------------------------------------
- name: J02 | Mostrar resumen final
  hosts: admin01
  remote_user: sysadmin-junior
  gather_facts: false

  tasks:
    - name: Preparar variables para show_ticket.yml
      set_fact:
        variant: "{{ global_variant }}"
        selected_variant_file: "{{ global_selected_variant }}"
        final_state: "{{ final_state | default('SERVICE DOWN') }}"
        service_user: "{{ global_service_user }}"
        service_name: "{{ global_service_name }}.service"
        service_dir: "/opt/{{ global_service_name }}"

    - name: Mostrar ticket
      import_tasks: tasks/show_ticket.yml
      run_once: yes
