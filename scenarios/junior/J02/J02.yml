---
# ==============================================================================
# J02 – Laboratorio de Firewalls y SELinux (Junior) - NOC Simulation
# ==============================================================================
#
# 🎯 TEMA PRINCIPAL
# Troubleshooting de seguridad y conectividad en Linux corporativo.
#
# 🎯 OBJETIVO
# Aprender a diagnosticar problemas de servicios causados por firewalld
# o SELinux, sin pistas explícitas. Simulación de tickets NOC:
# el usuario reporta síntoma ("no funciona") y el técnico debe determinar la causa.
#
# ==============================================================================
# VARIANTES DISPONIBLES (selección aleatoria)
# ==============================================================================
#
# variant_1.yml — Firewalld bloquea puerto HTTP
#   ✓ Ping funciona
#   ✓ HTTP → inaccesible
#   ✓ MariaDB OK
#   ✓ Lección: firewall TCP afecta servicios, no ICMP
#
# variant_2.yml — Firewalld bloquea puerto MariaDB
#   ✓ Ping funciona
#   ✓ HTTP → funciona
#   ✓ MariaDB → falla al conectar
#   ✓ Lección: firewall filtrando puertos críticos
#
# variant_3.yml — SELinux en enforcing bloquea Nginx
#   ✓ Ping funciona
#   ✓ HTTP → inaccesible
#   ✓ MariaDB OK
#   ✓ Lección: SELinux ≠ firewall, revisa logs / audit
#
# variant_4.yml — SELinux en enforcing bloquea MariaDB
#   ✓ Ping funciona
#   ✓ HTTP → OK
#   ✓ MariaDB → falla al conectar
#   ✓ Lección: SELinux bloqueando procesos, revisar audit.log
#
# ==============================================================================
# FILOSOFÍA LINUX / NOC (Junior → Senior)
# ==============================================================================
# - Observa el ecosistema completo antes de tocar nada
# - Diferencia entre ICMP, TCP/UDP y políticas de seguridad
# - "No responde" puede ser firewall o SELinux, no siempre fallo físico
# - Prioriza impacto al negocio antes que métricas técnicas
# - Documenta: qué funciona, qué falla y por qué
#
# ==============================================================================
# ECOSISTEMA DEL LABORATORIO
# ==============================================================================
#
# SERVER_EU (una VM, múltiples VIPs)
#   - 192.168.122.22 → IP administrativa (SSH / gestión)
#   - 192.168.122.50 → WEB (Nginx / HTTP)
#   - 192.168.122.60 → MariaDB (Backend real)
#   - 192.168.122.70 → HAProxy (Proxy TCP)
#
# CLIENT01 (192.168.122.21)
#   - Accede a HTTP y MariaDB vía proxy
#
# Flujo real de producción:
#   CLIENT → HAProxy (.70) → MariaDB (.60)
#   CLIENT → WEB (.50)
#
# ==============================================================================
# FLUJO REAL NOC
# ==============================================================================
# 1. Usuario reporta: "No hay conectividad a servicio"
# 2. NOC analiza síntomas, no asume causas
# 3. Se identifica impacto real en negocio
# 4. Se determina causa raíz (firewalld / SELinux)
# 5. Se documenta lección aprendida
# ==============================================================================

- name: J02 - Orquestador de variantes de Firewalld y SELinux
  hosts: web
  become: yes
  gather_facts: no

  vars:
    variantes:
  #    - variant_1.yml
  #    - variant_2.yml
      - variant_3.yml
  #    - variant_4.yml

  tasks:
    - name: Elegir variante aleatoriamente
      set_fact:
        global_selected_variant: "{{ variantes | random }}"
      run_once: true

    - name: Debug - Verificar variante seleccionada
      debug:
        var: global_selected_variant
      run_once: true

    - name: Ejecutar la variante seleccionada
      include_tasks: "{{ global_selected_variant }}"
