# ==============================================================================
# J02 — Systemd Service Misconfiguration LAB
# ==============================================================================
# 
# PROPÓSITO: Simular incidente de servicio systemd mal configurado (RHCSA EX200)
# STUDENT: sysadmin-junior@redhat → Resuelve en web01
# 
# FLUJO ARCHITECTURA:
# 1. CATÁLOGOS  → vars/main.yml     (listas estáticas: services, users, ports...)
# 2. RANDOMIZACIÓN → vars/resolve.yml (fija 1 valor por categoría → GLOBALES)
# 3. ORQUESTACIÓN → J02.yml         (coordina plays entre hosts)
# 4. EJECUCIÓN   → tasks/base.yml + inject/variant_X.yml
# 
# VARIABLES GLOBALES PUBLICADAS por resolve.yml:
#   global_service_name, service_dir, global_service_user, config_dir, log_dir
#   global_selected_variant (variant_1.yml → variant_4.yml)
# 
# DEPENDENCIAS:
#   - engine/inventory.yml (admin01, web01, client01)
#   - engine/ansible_wrapper.sh (logging, DB tracking)
# 
# EJECUCIÓN: ./ansible_wrapper.sh J02
# RESULTADO: Ticket en admin01:/tmp/J02_ticket.txt + Servicio caído en web01
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. PREPARAR USUARIO sysadmin-junior (wheel + sudo NOPASSWD)
# ------------------------------------------------------------------------------
- name: J02 | Crear usuario corporativo
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Crear usuario sysadmin-junior
      user:
        name: sysadmin-junior
        comment: "Junior System Administrator"
        shell: /bin/bash
        groups: "wheel"
        append: yes
        password: "{{ 'redhat' | password_hash('sha512') }}"
        state: present

    - name: Configurar sudo sin password
      copy:
        dest: /etc/sudoers.d/sysadmin-junior
        content: |
          sysadmin-junior ALL=(ALL) NOPASSWD: ALL
        validate: /usr/sbin/visudo -cf %s

# ------------------------------------------------------------------------------
# 1. ORQUESTADOR CENTRAL (admin01) — Carga + Resuelve + Randomiza
# ------------------------------------------------------------------------------
- name: J02 | Configuración inicial y randomización
  hosts: admin01
  remote_user: sysadmin-junior
  become: true
  gather_facts: false

  tasks:
    - name: 1. Cargar catálogos base
      include_vars: 
        file: vars/main.yml

    - name: 2. Resolver TODAS las variables (random + derivadas)
      include_tasks: vars/resolve.yml
      run_once: yes

    - name: 3. Cargar variante del ticket
      include_vars:
        file: "tickets/{{ global_selected_variant }}"
        name: ticket_data

    - name: 4. Publicar variante global
      set_fact:
        global_variant: "{{ ticket_data.variant }}"
      run_once: yes

# ------------------------------------------------------------------------------
# 2. PROPAGAR VARIABLES → TODOS los hosts + USUARIOS + BASELINE
# ------------------------------------------------------------------------------
- name: J02 | Preparar baseline del sistema
  hosts: all
  remote_user: sysadmin-junior
  become: true
  gather_facts: true

  tasks:
    - name: Propagar variables globales desde admin01
      set_fact:
        global_service_name: "{{ hostvars['admin01'].global_service_name }}"
        global_service_user: "{{ hostvars['admin01'].global_service_user }}"
        global_config_file: "{{ hostvars['admin01'].global_config_file }}"
        global_log_file: "{{ hostvars['admin01'].global_log_file }}"  
        global_selected_variant: "{{ hostvars['admin01'].global_selected_variant }}"
        global_variant: "{{ hostvars['admin01'].global_variant }}"
        service_dir: "{{ hostvars['admin01'].service_dir }}"
        config_dir: "{{ hostvars['admin01'].config_dir }}"
        log_dir: "{{ hostvars['admin01'].log_dir }}"
        service_port: "{{ hostvars['admin01'].service_port }}"
        log_path: "{{ hostvars['admin01'].log_path }}"
        config_path: "{{ hostvars['admin01'].config_path }}" 
        selected_service: "{{ hostvars['admin01'].selected_service }}"
      when: inventory_hostname != 'admin01'

    # 🔧 NUEVO: Crear usuario del servicio ANTES de base.yml
    - name: Crear usuario del servicio en todos los hosts
      user:
        name: "{{ global_service_user }}"
        system: yes
        shell: /sbin/nologin
        comment: "Systemd service user for {{ global_service_name }}"
        create_home: no
        state: present
      register: service_user_created

    - name: Crear grupo del servicio (si no existe)
      group:
        name: "{{ global_service_user }}"
        system: yes
        state: present

    - name: Crear estructura base del servicio
      import_tasks: tasks/base.yml

# ------------------------------------------------------------------------------
# 3. INYECTAR FALLO ESPECÍFICO (solo web01)
# ------------------------------------------------------------------------------
- name: J02 | Inyectar fallo
  hosts: web01
  remote_user: sysadmin-junior
  become: true
  gather_facts: false

  tasks:
    - name: Inyectar variante seleccionada
      include_tasks: "inject/{{ hostvars['admin01'].global_selected_variant }}"

# ------------------------------------------------------------------------------
# 4. VERIFICAR + DETERMINAR ESTADO FINAL
# ------------------------------------------------------------------------------
- name: J02 | Verificar estado del servicio
  hosts: web01
  remote_user: sysadmin-junior
  become: true
  gather_facts: false

  tasks:
    - name: Comprobar estado real del servicio
      systemd:
        name: "{{ hostvars['admin01'].global_service_name }}.service"
      register: service_status
      failed_when: false
      changed_when: false

    - name: Determinar estado para ticket
      set_fact:
        final_state: >-
          {{ 'SERVICE DOWN'
             if (service_status is failed
             or (service_status.status is defined
             and service_status.status.ActiveState != 'active'))
             else 'SERVICE OPERATIONAL' }}
      delegate_to: admin01
      run_once: yes

# ------------------------------------------------------------------------------
# 5. TICKET FINAL (solo admin01)
# ------------------------------------------------------------------------------
- name: J02 | Mostrar resumen final
  hosts: admin01
  remote_user: sysadmin-junior
  gather_facts: false

  tasks:
    - name: Preparar contexto del ticket
      set_fact:
        variant: "{{ global_variant }}"
        selected_variant_file: "{{ global_selected_variant }}"
        final_state: "{{ final_state | default('SERVICE DOWN') }}"

    - name: Generar ticket para student
      import_tasks: tasks/show_ticket.yml
      run_once: yes
