# ==============================================================================
# TICKET PARA LA VARIANTE 2
# ==============================================================================

variant:
  description: |
    Un servicio del sistema está configurado con dependencias de systemd de tipo
    Wants y Requires incorrectas o incompletas. Algunas dependencias críticas han
    sido debilitadas o eliminadas, mientras que se han agregado dependencias hacia
    servicios que fallan o no existen. Como resultado, systemd no puede satisfacer
    correctamente los requisitos necesarios para iniciar el servicio principal.

  symptoms:
    - "`systemctl start <service>.service` falla con error de dependencias"
    - "`systemctl status` muestra fallos relacionados con unidades requeridas"
    - "El journal indica dependencias Requires inválidas o no satisfechas"
    - "`systemctl list-dependencies` muestra unidades inexistentes o fallidas"
    - "La red se inicia, pero puede no estar completamente operativa al arranque"
    - "Un montaje de sistema de archivos remoto falla y bloquea el servicio"

  task: |
    Diagnosticar y corregir las dependencias Wants, Requires y After incorrectas
    en la configuración de systemd del servicio afectado. Identificar qué
    dependencias son realmente críticas y deben ser marcadas como Requires,
    cuáles deben ser opcionales mediante Wants, y eliminar dependencias hacia
    unidades inexistentes o inestables. Asegurar que todas las dependencias
    necesarias estén correctamente definidas para permitir un arranque fiable.

  restrictions:
    - "NO eliminar unit files utilizados por otros sistemas"
    - "NO debilitar dependencias críticas solo para forzar el arranque"
    - "NO usar IgnoreOnIsolate para evadir problemas de dependencias"
    - "NO modificar servicios del sistema fuera del servicio afectado"
    - "La solución debe respetar la diferencia semántica entre Wants y Requires"
    - "Los cambios deben permitir un arranque consistente tras reinicio"
