# ==============================================================================
# TICKET PARA LA VARIANTE 3 
# ==============================================================================

variant:
  description: |
    El servicio {{ global_service_name }}.service está configurado con múltiples
    condiciones (Condition*) y aserciones (Assert*) de systemd que están fallando,
    previniendo que el servicio se cargue o inicie. Estas condiciones verifican
    existencia de archivos, contenido, tipo de virtualización y parámetros del
    kernel que no coinciden con el entorno actual, causando que systemd omita
    o rechace la activación del servicio.

  symptoms:
    - "`systemctl start {{ global_service_name }}.service` no produce error pero no inicia"
    - "`systemctl status` muestra 'inactive (dead)' sin mensajes de error claros"
    - "`systemctl cat {{ global_service_name }}.service` muestra múltiples Condition/Assert"
    - "Journal no contiene errores de inicio del servicio (se omite silenciosamente)"
    - "`systemd-analyze verify` puede mostrar advertencias sobre condiciones"
    - "Archivos de condición como /etc/{{ global_service_name }}/enabled no existen"
    - "Script ExecCondition /usr/local/bin/check-{{ global_service_name }}.sh falla"

  task: |
    Diagnosticar y corregir las condiciones y aserciones de systemd que están
    bloqueando el inicio de {{ global_service_name }}.service. Identificar qué
    condiciones están fallando, determinar si son necesarias, y o bien corregir
    el entorno para satisfacerlas o ajustar/remover las condiciones incorrectas.
    Asegurar que el servicio pueda cargarse e iniciarse normalmente.

  restrictions:
    - "NO eliminar todas las condiciones/assertions indiscriminadamente"
    - "NO modificar parámetros del kernel o tipo de virtualización del host"
    - "NO usar '--skip-conditions' o '--force' al iniciar el servicio"
    - "NO cambiar la lógica del script check-{{ global_service_name }}.sh (es requerido)"
    - "Debe mantenerse al menos una condición de seguridad si era requerida"
    - "Las correcciones deben respetar la intención original de las condiciones"