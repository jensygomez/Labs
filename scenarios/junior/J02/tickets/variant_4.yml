# ==============================================================================
# TICKET PARA LA VARIANTE 4
# ==============================================================================

variant:
  description: |
    Un servicio del sistema está configurado con límites de recursos de systemd
    excesivamente restrictivos que impiden su funcionamiento normal. Los límites
    de descriptores de archivo, número de procesos, memoria, CPU y otros recursos
    están definidos con valores tan bajos que el servicio no puede ejecutarse
    correctamente o se comporta de manera inestable. El script de inicio del
    servicio valida explícitamente algunos de estos límites y falla si no se
    cumplen los valores mínimos esperados.

  symptoms:
    - "El servicio inicia pero se detiene inmediatamente o presenta inestabilidad"
    - "`systemctl status <service>.service` muestra estados como 'failed' o 'exited'"
    - "Los logs del servicio reportan errores relacionados con descriptores de archivo"
    - "El servicio puede ser terminado por el OOM killer debido a límites de memoria bajos"
    - "`journalctl -u <service>.service` muestra códigos de salida 1 o 137 (OOM)"
    - "El script de inicio indica recursos insuficientes (FDs, procesos, memoria)"
    - "Degradación severa de rendimiento debido a límites de CPU restrictivos"

  task: |
    Diagnosticar y ajustar los límites de recursos definidos en systemd para el
    servicio, asegurando que sean coherentes con sus requisitos reales de
    ejecución. Identificar qué límites son excesivamente restrictivos, definir
    valores apropiados basados en el comportamiento esperado y las validaciones
    del script de inicio, y aplicar configuraciones que permitan un
    funcionamiento estable sin asignar recursos innecesarios.

  restrictions:
    - "NO configurar límites como 'infinity' ni valores desproporcionadamente altos sin justificación"
    - "NO eliminar las validaciones de recursos implementadas en el script de inicio"
    - "NO deshabilitar completamente el OOM killer para el servicio"
    - "Los límites deben ser realistas y acordes al uso esperado"
    - "Debe mantenerse algún nivel de limitación por motivos de seguridad y estabilidad"
    - "Los cambios deben considerar el impacto global en el sistema y otros servicios"
