# scenarios/junior/J02/tickets/variant_1.yml
# ==============================================================================
# TICKET PARA LA VARIANTE 1
# ==============================================================================

variant:
  description: |
    Un servicio del sistema está configurado con dependencias de systemd
    invertidas y conflictivas, creando un ciclo de dependencia circular que
    impide su inicio. El unit file contiene configuración válida, pero el
    orden de arranque y las relaciones entre servicios están mal definidas,
    causando que systemd no pueda resolver correctamente la secuencia de inicio.

  symptoms:
    - "`systemctl start <service>.service` falla inmediatamente"
    - "`systemctl status` muestra 'dependency failed' o código de salida 1"
    - "El journal indica 'Job for <service>.service/start failed'"
    - "`systemd-analyze critical-chain` muestra ciclos de dependencia"
    - "Un servicio dependiente también queda bloqueado"
    - "network.target se activa, pero network-online.target no está garantizado"

  task: |
    Diagnosticar y resolver dependencias circulares y conflictos en la
    configuración de systemd que impiden el inicio del servicio.
    Identificar dependencias invertidas, eliminar ciclos y asegurar que
    todos los requisitos estén disponibles antes del arranque.

  restrictions:
    - "NO modificar ni eliminar servicios dependientes críticos"
    - "NO cambiar el usuario configurado en el unit file"
    - "NO deshabilitar servicios del sistema para evadir dependencias"
    - "NO usar systemctl mask como solución"
    - "La corrección debe permitir que todos los servicios inicien en orden correcto"
    - "Los cambios deben persistir tras un reboot"
