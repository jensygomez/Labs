---
# ==============================================================================
# J02 – Laboratorio de Firewalls y SELinux (Junior) - NOC Simulation
# ==============================================================================
#
# 🎯 TEMA PRINCIPAL
# Troubleshooting de seguridad y conectividad en Linux corporativo con DNS production.
#
# 🎯 OBJETIVO
# Diagnosticar problemas causados por firewalld/SELinux usando nombres DNS reales.
# Simulación tickets NOC: cliente reporta "www.paginaweb.com no funciona".
#
# ==============================================================================
# VARIANTES DISPONIBLES (selección aleatoria - DNS-aware)
# ==============================================================================
#
# variant_1.yml — Firewalld bloquea HTTP (80/tcp)
#   ✓ ping www.paginaweb.com → OK (192.168.122.50)
#   ✗ curl http://www.paginaweb.com → timeout  
#   ✓ mysql -h proxy.paginaweb.com → OK (192.168.122.70)
#   ✓ Lección: firewall TCP ≠ ICMP
#
# variant_2.yml — Firewalld bloquea MariaDB (3306/tcp)
#   ✓ ping www.paginaweb.com → OK  
#   ✓ curl http://www.paginaweb.com → 200 OK
#   ✗ mysql -h proxy.paginaweb.com → timeout (192.168.122.70)
#   ✓ Lección: firewall puertos críticos de negocio
#
# variant_3.yml — SELinux enforcing bloquea Nginx
#   ✓ ping www.paginaweb.com → OK (192.168.122.50)
#   ✗ curl http://www.paginaweb.com → 403 Forbidden
#   ✓ mysql -h proxy.paginaweb.com → OK (192.168.122.70)
#   ✓ Lección: SELinux logs + nginx error.log "Permission denied (13)"
#
# variant_4.yml — SELinux enforcing bloquea MariaDB
#   ✓ ping www.paginaweb.com → OK
#   ✓ curl http://www.paginaweb.com → 200 OK
#   ✗ mysql -h proxy.paginaweb.com → SELinux denied
#   ✓ Lección: audit.log + semanage fcontext
#
# ==============================================================================
# FILOSOFÍA LINUX / NOC (Junior → Senior)
# ==============================================================================
# - Siempre verifica: ping → nslookup → nc → servicio específico
# - "No funciona" = firewall/SELinux 80% de casos (no cables rotos)
# - Prioriza servicios críticos (MariaDB > HTTP logs)
# - Documenta: síntoma → diagnóstico → causa raíz → fix
#
# ==============================================================================
# INFRAESTRUCTURA COMPLETA (libvirt + VIPs + DNS production)
# ==============================================================================
#
# 🖥️ SERVER_EU (VM única - Rocky Linux 9 / RHEL9 compatible)
#   📍 192.168.122.22  → IP administrativa (SSH student/senha123)
#   🌐 192.168.122.50  → www.paginaweb.com (Nginx HTTP/HTTPS)
#   🗄️ 192.168.122.60  → basededatos.paginaweb.com (MariaDB 10.x)
#   🔄 192.168.122.70  → proxy.paginaweb.com (HAProxy TCP MariaDB)
#   
# 💻 CLIENT01 (VM cliente - 192.168.122.21)
#   🔗 /etc/hosts → www.paginaweb.com, proxy.paginaweb.com, basededatos.paginaweb.com
#   🧪 Tests: curl www.paginaweb.com, mysql -h proxy.paginaweb.com
#
# 🌐 DNS Production (/etc/hosts - BIND9 removido por estabilidad)
# ```
# 192.168.122.50  www.paginaweb.com paginaweb.com
# 192.168.122.60  basededatos.paginaweb.com db.paginaweb.com db  
# 192.168.122.70  proxy.paginaweb.com proxy-db.paginaweb.com proxy
# ```
#
# 🔥 SERVICIOS corriendo (confirmado):
#   ✅ nginx: 0.0.0.0:80, 0.0.0.0:443
#   ✅ mariadbd: 192.168.122.60:3306 (user_prueba/Pass1234!)
#   ✅ haproxy: 192.168.122.70:3306 → MariaDB(.60)
#   ✅ Firewall: http https ssh dns 3306/tcp ✅
#
# 🔄 FLUJO PRODUCCIÓN REAL:
#   CLIENT → www.paginaweb.com:80 → Nginx(.50)
#   CLIENT → proxy.paginaweb.com:3306 → HAProxy(.70) → MariaDB(.60)
#   ADMIN → 192.168.122.22:22 → SSH gestión
#
# ==============================================================================
# FLUJO REAL TICKET NOC (DNS Production)
# ==============================================================================
# 1. CLIENTE: "www.paginaweb.com caído" / "basededatos.paginaweb.com lento"
# 2. NOC valida conectividad:
#    ping www.paginaweb.com ✓ | curl → FAIL | mysql proxy.paginaweb.com ✓
# 3. Diagnóstico sistemático: netstat/ss → firewall-cmd → audit.log
# 4. Causa raíz: firewalld/SELinux → fix específico
# 5. Documentación: síntoma → diagnóstico → resolución
# ==============================================================================

- name: J02 - Orquestador de variantes Firewalld + SELinux (DNS Production)
  hosts: web
  become: yes
  gather_facts: no

  vars:
    variantes:
      - variant_1.yml
      - variant_2.yml
      - variant_3.yml
      - variant_4.yml

  tasks:
    - name: Elegir variante aleatoriamente
      set_fact:
        global_selected_variant: "{{ variantes | random }}"
      run_once: true

    - name: Debug - Variante seleccionada
      debug:
        msg: "🎲 Ejecutando variante: {{ global_selected_variant }}"
      run_once: true

    - name: Ejecutar variante seleccionada
      include_tasks: "{{ global_selected_variant }}"
