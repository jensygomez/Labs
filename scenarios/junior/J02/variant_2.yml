---
# ==============================================================================
# VARIANT_2.yml — Firewalld bloquea puerto MariaDB (3306/tcp)
# ==============================================================================
#
# 🎯 PROPÓSITO:
# Simular un incidente donde el servicio de base de datos deja de ser accesible
# desde el cliente debido a una política de firewall, mientras otros servicios
# continúan funcionando normalmente.
#
# Este escenario reproduce fallos reales en:
#   - Cambios de firewall mal documentados
#   - Hardening incompleto
#   - Errores humanos durante mantenimiento
#
# ------------------------------------------------------------------------------
# 🔥 FALLA INTRODUCIDA:
# - Se elimina el puerto 3306/tcp de la zona activa de firewalld en SERVER_EU
# - El backend MariaDB sigue funcionando localmente
# - HAProxy no puede alcanzar el backend
#
# ------------------------------------------------------------------------------
# 🧪 SÍNTOMAS ESPERADOS (DESDE CLIENT01):
#
# ✔ Ping → FUNCIONA
# ✔ HTTP → FUNCIONA
# ✖ MariaDB (vía proxy .70) → FALLA
#
# Error típico:
#   ERROR 2002 (HY000): Can't connect to MySQL server
#
# ------------------------------------------------------------------------------
# 🧠 LECCIÓN CLAVE (NOC / SENIOR):
#
# - ICMP no valida servicios de negocio
# - HTTP funcionando ≠ infraestructura sana
# - Firewalld puede bloquear servicios sin afectar otros
# - Siempre validar puertos críticos end-to-end
#
# ------------------------------------------------------------------------------
# ⚠ IMPORTANTE:
# Esta variante NO aplica rollback automático.
# La corrección debe realizarse como parte del diagnóstico del alumno
# o mediante una variante correctiva separada.
# ==============================================================================




# ------------------------------------------------------------------------------
# INYECCIÓN DEL FALLO
# ------------------------------------------------------------------------------

- name: "[VARIANT_FW_MYSQL] Detectar zona activa de firewalld"
  command: firewall-cmd --get-active-zones
  register: active_zone
  changed_when: false
  become: yes

- name: "[VARIANT_FW_MYSQL] Extraer zona activa"
  set_fact:
    server_zone: "{{ active_zone.stdout.split()[0] }}"

- name: "[VARIANT_FW_MYSQL] Verificar puertos antes de bloquear MariaDB"
  command: firewall-cmd --zone={{ server_zone }} --list-ports
  register: ports_before
  changed_when: false

- name: "[VARIANT_FW_MYSQL] Bloquear puerto MariaDB (3306/tcp)"
  command: firewall-cmd --zone={{ server_zone }} --remove-port=3306/tcp --permanent
  become: yes

- name: "[VARIANT_FW_MYSQL] Recargar firewalld para aplicar cambios"
  command: firewall-cmd --reload
  become: yes

- name: "[VARIANT_FW_MYSQL] Verificar puertos después del bloqueo"
  command: firewall-cmd --zone={{ server_zone }} --list-ports
  register: ports_after
  changed_when: false

- name: "[VARIANT_FW_MYSQL] Debug - Estado final del firewall"
  debug:
    msg:
      - "Puertos ANTES del bloqueo: {{ ports_before.stdout }}"
      - "Puertos DESPUÉS del bloqueo: {{ ports_after.stdout }}"



- name: "[TICKET NOC] INC-J02-V2 - Aplicación no conecta a base de datos"
  debug:
    msg:
      - "========================================================================="
      - "| 🎫 INC-J02-V2 – APLICACIÓN SIN ACCESO A BASE DE DATOS                 |"
      - "| PRIORIDAD: 🔴 ALTA | IMPACTO: SERVICIO CRÍTICO                       |"
      - "========================================================================="
      - "| 📋 DESCRIPCIÓN USUARIO:                                               |"
      - "| 'La aplicación abre, pero no muestra datos.'                          |"
      - "| 'El equipo web responde, pero la base no conecta.'                    |"
      - "-------------------------------------------------------------------------"
      - "| 📊 METADATOS TÉCNICOS:                                                |"
      - "| • Origen: CLIENT01 (192.168.122.21)                                  |"
      - "| • Proxy DB: HAProxy (192.168.122.70)                                 |"
      - "| • Backend DB: MariaDB (192.168.122.60)                               |"
      - "| • Protocolo afectado: TCP/3306                                       |"
      - "-------------------------------------------------------------------------"
      - "| 💭 OBSERVACIONES INICIALES:                                            |"
      - "| • HTTP responde, ¿qué dependencia falta?                              |"
      - "| • ¿Es red, servicio o seguridad?                                      |"
      - "| • ¿Proxy o backend?                                                   |"
      - "-------------------------------------------------------------------------"
      - "| 🎯 TU MISIÓN:                                                          |"
      - "| Diagnosticar con mentalidad NOC                                       |"
      - "| Confirmar impacto real al negocio                                     |"
      - "| Identificar causa raíz                                                 |"
      - "======================================================================== "
      - "| ⏰ INICIAR DIAGNÓSTICO → Presiona ENTER cuando estés listo            |"
      - "======================================================================== "
  run_once: true
