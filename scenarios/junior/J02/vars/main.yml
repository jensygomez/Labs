---
# scenarios/junior/J02/vars/main.yml
# ==============================================================================
# Variables base — LAB J02
# SOLO catálogos y valores estáticos
# ==============================================================================

random_elements:
  services:
    - internal-api
    - data-processor
    - auth-gateway
    - file-sync
    - notification-engine
    - audit-logger
    - metrics-collector
    - report-generator
    - cache-manager
    - backup-coordinator

  users:
    - svc-internal
    - svc-process
    - svc-gateway
    - svc-sync
    - svc-notify
    - svc-audit
    - svc-metrics
    - svc-reports
    - svc-cache
    - svc-backup

  config_files:
    - application.conf
    - settings.yaml
    - config.properties
    - env.cfg
    - parameters.json
    - options.toml
    - runtime.conf
    - service.yaml
    - defaults.cfg
    - main.json

  log_files:
    - app.log
    - service.log
    - debug.log
    - error.log
    - trace.log
    - access.log
    - system.log
    - events.log
    - audit.log
    - performance.log

  ports:
    - 8080
    - 8888
    - 9000
    - 9090
    - 10000
    - 10080
    - 11000
    - 12000
    - 13000
    - 14000

# Targets de systemd (para variantes)
systemd_targets:
  - multi-user.target
  - graphical.target
  - network-online.target
  - remote-fs.target
  - nss-lookup.target
  - time-sync.target
  - basic.target
  - sysinit.target

# Límites posibles de recursos
resource_limits:
  nofile: [256, 512, 1024, 2048]
  nproc: [50, 100, 200, 500]
  core: [0, 1, "unlimited"]
  memlock: [65536, 131072, 262144]

# Variantes disponibles del incidente
variants:
  - variant_1.yml
  - variant_2.yml
  - variant_3.yml
  - variant_4.yml
