# Servicio
service_name: internal-api
service_user: apiuser
service_dir: /opt/internal-api

# Archivos
start_script: "{{ service_dir }}/start.sh"
config_file: "{{ service_dir }}/config.env"
log_file: /var/log/lab_j01.log

# Variantes disponibles
variants:
  - variant_1.yml
  - variant_2.yml
  - variant_3.yml
  - variant_4.yml
  # - variant_5.yml  # (opcional, futuro)

# Seguridad
service_shell: /sbin/nologin
