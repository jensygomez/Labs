---
# Variables de sistema
corporate_user: sysadmin-junior
domain: example.com
service_name: internal-api.service
service_user: internal-api
service_dir: /opt/internal-api

# Variantes disponibles
variants:
  - variant_1.yml
  - variant_2.yml
  - variant_3.yml
  - variant_4.yml

# Configuración del servicio
service_port: 8080
service_timeout: 30
log_dir: /var/log/internal-api
max_log_size: 100M
