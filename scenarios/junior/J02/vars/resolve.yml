# scenarios/junior/J02/tasks/resolve.yml
# ==============================================================================
# RESOLUCIÓN DE VARIABLES — LAB J02
# ------------------------------------------------------------------------------
# RESPONSABILIDAD:
#   Este archivo actúa como el "motor de resolución" del laboratorio J02.
#   Convierte catálogos abstractos (definidos en vars/main.yml) en valores
#   concretos y definitivos que permanecerán fijos durante toda la ejecución.
#
# QUE HACE:
#   - Selecciona aleatoriamente un servicio, usuario, archivo de configuración,
#     archivo de log y puerto desde catálogos predefinidos
#   - Deriva rutas estándar (service_dir, config_dir, log_dir, etc.)
#   - Selecciona la variante del incidente a inyectar
#   - Publica variables globales para TODOS los demás tasks y variantes
#
# QUE NO HACE:
#   - NO crea usuarios
#   - NO crea archivos ni directorios
#   - NO modifica el sistema
#   - NO introduce fallos
#
# PRINCIPIO DE DISEÑO:
#   - Determinismo por ejecución:
#       Una vez resueltas aquí, las variables NO cambian durante el lab.
#   - Separación de responsabilidades:
#       Catálogos → vars/main.yml
#       Resolución → resolve.yml
#       Ejecución  → base.yml / variants
#
# DEPENDENCIAS (OBLIGATORIAS):
#   Requiere que estén cargadas previamente:
#     - vars/main.yml
#
# VARIABLES PUBLICADAS (USO GLOBAL):
#   - global_service_name
#   - global_service_user
#   - service_dir
#   - config_dir
#   - config_path
#   - log_dir
#   - log_path
#   - service_port
#   - global_selected_variant
#
# QUIÉN LO USA:
#   - tasks/base.yml
#   - inject/variant_*.yml
#   - tickets/variant_*.yml
#   - scripts de verificación del lab
#
# ORDEN DE EJECUCIÓN:
#   Debe ejecutarse UNA SOLA VEZ y ANTES de cualquier task operativo.
# ==============================================================================

- name: Seleccionar elementos aleatorios del laboratorio
  set_fact:
    selected_service: "{{ random_elements.services | random }}"
    selected_user: "{{ random_elements.users | random }}"
    selected_config_file: "{{ random_elements.config_files | random }}"
    selected_log_file: "{{ random_elements.log_files | random }}"
    selected_port: "{{ random_elements.ports | random }}"
  run_once: true

- name: Resolver variables globales del servicio
  set_fact:
    global_service_name: "{{ selected_service }}"
    global_service_user: "{{ selected_user }}"
    global_config_file: "{{ selected_config_file }}"     
    global_log_file: "{{ selected_log_file }}" 
    service_dir: "/opt/{{ selected_service }}"
    config_dir: "/etc/{{ selected_service }}"
    config_path: "/etc/{{ selected_service }}/{{ selected_config_file }}"
    log_dir: "/var/log/{{ selected_service }}"
    log_path: "/var/log/{{ selected_service }}/{{ selected_log_file }}"
    service_port: "{{ selected_port }}"
  run_once: true

- name: Seleccionar variante del incidente
  set_fact:
    global_selected_variant: "{{ variants | random }}"
  run_once: true

- name: Marcar resolución de variables completada
  set_fact:
    j02_resolved: true
  run_once: true
