---
- name: "OPS-1070 - Diagnostico de Frontends (Nginx/Proxy)"
  hosts: frontends
  gather_facts: false

  tasks:
    - name: "1.1 - Verificar limite de archivos abiertos (ulimit) en Nginx"
      ansible.builtin.shell: "ulimit -n"
      register: nginx_ulimit
      changed_when: false

    - name: "1.2 - Mostrar solo frontends con ulimit bajo (< 65535)"
      ansible.builtin.debug:
        msg: "ATENCION {{ inventory_hostname }} tiene un ulimit de {{ nginx_ulimit.stdout }}"
      when: nginx_ulimit.stdout | int < 65535
