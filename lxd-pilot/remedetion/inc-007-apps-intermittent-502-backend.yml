---
- name: "OPS-1070 - Diagnostico Tarea 1: Verificación de ulimit en Frontends"
  hosts: frontends
  gather_facts: false

  tasks:
    - name: "1.1 - Obtener ulimit -n del sistema"
      ansible.builtin.shell: "ulimit -n"
      register: sys_ulimit
      changed_when: false

    - name: "1.2 - Alertar solo si ulimit es insuficiente (< 65535)"
      ansible.builtin.debug:
        msg: "ANOMALÍA DETECTADA: {{ inventory_hostname }} tiene ulimit -n = {{ sys_ulimit.stdout }}"
      when: sys_ulimit.stdout | int < 65535
