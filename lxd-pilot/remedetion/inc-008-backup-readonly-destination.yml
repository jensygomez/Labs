---
- name: Remediation - INC-008 Backup Readonly Destination
  hosts: backup_server
  gather_facts: false

  tasks:
    - name: 1. Remover Atributo inmutable de /backup/destination si estuviera activo
      ansible.builtin.shell: |
        if lsattr -d /backup/destination | awk '{print $1}' | grep -q 'i'; then
            chattr -i /backup/destination
            echo "changed"
        else
            echo "ok"
        fi
      register: chattr_result
      changed_when: "'changed' in chattr_result.stdout"
    - name: 1b. Asegurar permisos y propietarios en /backup/destination
      ansible.builtin.file:
        path: /backup/destination
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: 2. Desplegar script de backup mejorado con validaciones estrictas
      ansible.builtin.copy:
        dest: /usr/local/bin/nightly-backup.sh
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          BACKUP_SRC="/var/lib/appdata"
          BACKUP_DST="/backup/destination"
          LOG_FILE="/var/log/backup.log"
          DATE=$(date +%Y%m%d)
          TARGET_DIR="$BACKUP_DST/$DATE"

          log() {
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a "$LOG_FILE"
          }

          log "Starting nightly backup..."

          if [ ! -w "$BACKUP_DST" ]; then
              log "ERROR: Destination directory $BACKUP_DST is not writable." >&2
              exit 1
          fi

          mkdir -p "$TARGET_DIR"

          if rsync -aq "$BACKUP_SRC/" "$TARGET_DIR/"; then
              FILE_COUNT=$(ls -A "$TARGET_DIR" | wc -l)
              if [ "$FILE_COUNT" -gt 0 ]; then
                  SIZE=$(du -sh "$TARGET_DIR" | cut -f1)
                  log "Backup completed successfully. Copied $FILE_COUNT files ($SIZE)."
                  exit 0
              else
                  log "ERROR: Backup completed but destination folder is empty." >&2
                  exit 1
              fi
          else
              log "ERROR: rsync failed to copy data." >&2
              exit 1
          fi
        
    


    - name: 3. Ejecutar el script de backup manualmente
      ansible.builtin.command: /usr/local/bin/nightly-backup.sh
      register: backup_exec
      changed_when: true

    - name: 4. Validar el contenido copiado en /backup/destination
      ansible.builtin.command: ls -lh /backup/destination/
      register: backup_ls
      changed_when: false

    - name: 5. Mostrar salida de la ejecucion y verificacion
      ansible.builtin.debug:
        msg:
          - "--- Salida del Script ---"
          - "{{ backup_exec.stdout_lines }}"
          - "--- Directorio de Destino ---"
          - "{{ backup_ls.stdout_lines }}"
