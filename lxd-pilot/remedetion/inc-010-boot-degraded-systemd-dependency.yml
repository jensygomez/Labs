
---
- name: Remediation INC-010 - Restaurar Sincronizacion S3
  hosts: app_fleet
  become: true

  tasks:
  - name: Tarea 1 - Crear Archivo de Variables de Entorno para S3
    ansible.builtin.copy:
      dest: /etc/s3-backend.env
      owner: root
      group: root
      mode: '0644'
      content: |
        FAKECLOUD_ENDPOINT=http://10.45.223.1:4566
        BUCKET_NAME=central-orders
        AWS_ACCESS_KEY_ID=test
        AWS_SECRET_ACCESS_KEY=test
        AWS_DEFAULT_REGION=us-east-1

  - name: Tarea 2 - Iniciar y Habilitar s3-backend.service
    ansible.builtin.systemd:
      name: s3-backend.service
      state: restarted
      enabled: true
      daemon_reload: true

  - name: Tarea 3 - Iniciar order-sync.service
    ansible.builtin.systemd:
      name: order-sync.service
      state: started
      enabled: true

  - name: Tarea 4 - Validar que systemd no reporte estado degraded
    ansible.builtin.command: systemctl is-system-running
    register: system_status
    changed_when: false
    failed_when: system_status.rc != 0 and system_status.stdout != "running"


