---
- name: Remediation INC-009 - Cross DB Password mismatch
  hosts: fleet
  become: false
  gather_facts: false

  tasks:
 
    - name: Tarea 1 - Verify fleet connectivity
      ansible.builtin.ping:
 
    - name: Tarea 2 - read current database password
      ansible.builtin.shell: "source /etc/account-service/db.env && echo $DB_PASS"
      args:
        executable: /bin/bash
      register: db_password
      changed_when : false
      no_log: true

    - name: Tarea 3 - Ensure correct database password
      ansible.builtin.lineinfile:
        path: /etc/account-service/db.env
        regexp: '^DB_PASS='
        line: 'DB_PASS=Pg2026Rotated!'
        owner: root
        group: root
        mode: '0600'

    - name: Tarea 4 - Validate heartbeat database write
      ansible.builtin.shell: /usr/local/bin/heartbeat.sh
      register: heartbeat_result
      changed_when: false

    - name: Tarea 5 - Validate heartbeat records
      ansible.builtin.shell: >
        lxc exec server04 -- su - postgres -c
        "psql -d accountsdb -t -A -c
        \"SELECT count(DISTINCT node) FROM heartbeat
        WHERE node IN ('server01','server02','server03');\""
      delegate_to: localhost
      become: false
      register: heartbeat_check
      changed_when: false

    - name: Tarea 6 - Fail if not all fleet nodes have heartbeat
      ansible.builtin.assert:
        that:
          - heartbeat_check.stdout | trim == "3"
        fail_msg: "Heartbeat validation failed: not all 3 fleet nodes are reporting."
        success_msg: "All 3 fleet nodes are reporting heartbeats."
      delegate_to: localhost
      run_once: true


