# profile-lab.yml
config:
  limits.memory: 512MB
  user.user-data: |
    #cloud-config
    package_update: true
    packages:
      - openssh-server
      - python3
      - python3-pip
    ssh_authorized_keys:
      - ssh-ed25519 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN+gsGnVlOOJXtW6Wz87hc1CPhOz++T2lCoB6F3Eksbg jensyg@lxd-fleet
    users:
      - default
      - name: labadmin
        sudo: ALL=(ALL) NOPASSWD:ALL
        groups: wheel, users
        shell: /bin/bash
        lock_passwd: true
    ssh_pwauth: false
    disable_root: true

description: Perfil base barebone para los 10 servidores del laboratorio
devices:
  eth0:
    name: eth0
    network: lab-net
    type: nic
  root:
    path: /
    pool: default
    type: disk
name: profile-lab
