---
# =====================================================================
# INC-011 | setup.yml  (Capa 2: despliegue de la aplicación)
# Incident: LVM volume extended but filesystem not grown.
# Idempotente: puede re-ejecutarse sin romper el estado.
# =====================================================================

# ---------------------------------------------------------------------
# PLAY 1: Crear el bucket S3 para backup logs (en FakeCloud, desde el host)
# ---------------------------------------------------------------------
- name: "INC-011 | Create S3 bucket for backup logs"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    fakecloud_endpoint: "http://10.45.223.1:4566"
    bucket_name: "backup-logs"
  environment:
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_DEFAULT_REGION: us-east-1
  tasks:
    - name: Create backup-logs bucket (ignore if exists)
      command: aws --endpoint-url {{ fakecloud_endpoint }} s3 mb s3://{{ bucket_name }}
      register: bucket_result
      failed_when: false
      changed_when: bucket_result.rc == 0

# ---------------------------------------------------------------------
# PLAY 2: Desplegar LVM data volume + backup app en los 3 nodos
# ---------------------------------------------------------------------
- name: "INC-011 | Deploy LVM data volume + backup app"
  hosts: app_fleet
  become: true
  vars:
    fakecloud_endpoint: "http://10.45.223.1:4566"
    bucket_name: "backup-logs"
  tasks:
    - name: Install lvm2 and e2fsprogs
      package:
        name: "{{ item }}"
        state: present
      loop:
        - lvm2
        - e2fsprogs

    - name: Deploy LVM setup script (idempotent, loop-device safe)
      copy:
        dest: /usr/local/bin/setup-lvm.sh
        mode: '0755'
        content: |
          #!/bin/bash
          set -e
          DISK_IMG=/var/lvm-disk.img
          VG=datavg
          LV=datalv
          MOUNT=/data

          # --- Ensure loop device nodes exist (LXC may not expose them).
          # Requires the 'loop' driver loaded on the HOST:
          #   sudo modprobe loop max_loop=16
          for i in $(seq 0 7); do
            [ -e /dev/loop$i ] || mknod /dev/loop$i b 7 $i 2>/dev/null || true
          done

          # --- Sparse backing disk (512MB) ---
          [ -f $DISK_IMG ] || truncate -s 512M $DISK_IMG

          # --- Attach loop device if not already attached ---
          losetup -j $DISK_IMG | grep -q $DISK_IMG || losetup -f $DISK_IMG
          LOOP=$(losetup -j $DISK_IMG | head -1 | cut -d: -f1)

          # --- VG (only if missing) ---
          if ! vgs $VG &>/dev/null; then
            pvcreate $LOOP
            vgcreate $VG $LOOP
          fi

          # --- LV: only 200MB of the ~512MB VG.
          # The remaining free space is what the fault will "extend into". ---
          if ! lvs $VG/$LV &>/dev/null; then
            lvcreate -L 200M -n $LV $VG
            mkfs.ext4 -q /dev/$VG/$LV
          fi

          # --- Mount ---
          mkdir -p $MOUNT
          mountpoint -q $MOUNT || mount /dev/$VG/$LV $MOUNT

          # --- Seed ~100MB of "order data" (~50% of the 200MB filesystem) ---
          [ -f $MOUNT/orders.db ] || dd if=/dev/urandom of=$MOUNT/orders.db bs=1M count=100 2>/dev/null

    - name: Run LVM setup
      command: /usr/local/bin/setup-lvm.sh
      register: lvm_setup
      changed_when: "'datavg' in lvm_setup.stdout or lvm_setup.rc == 0"

    - name: Deploy backup-to-S3 script (simulated app)
      copy:
        dest: /usr/local/bin/app-backup.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Simulated app: writes a heartbeat to /data, then uploads log to S3.
          # When /data is full, the write fails -> this is the visible symptom.
          echo "[$(date -Is)] order heartbeat from $(hostname)" >> /data/app.log
          aws --endpoint-url {{ fakecloud_endpoint }} \
            s3 cp /data/app.log s3://{{ bucket_name }}/$(hostname)/app.log >/dev/null 2>&1

    - name: Deploy backup systemd service
      copy:
        dest: /etc/systemd/system/app-backup.service
        content: |
          [Unit]
          Description=App log backup to S3
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/app-backup.sh

    - name: Deploy backup timer (every 60s)
      copy:
        dest: /etc/systemd/system/app-backup.timer
        content: |
          [Unit]
          Description=Run app backup every 60s
          [Timer]
          OnBootSec=15s
          OnUnitActiveSec=60s
          [Install]
          WantedBy=timers.target

    - name: Enable and start backup timer
      systemd:
        name: app-backup.timer
        enabled: yes
        state: started
        daemon_reload: yes

# ---------------------------------------------------------------------
# PLAY 3: Inyectar regla de alerta Prometheus para /data exhaustion
# ---------------------------------------------------------------------
- name: "INC-011 | Inject Prometheus alert rule"
  hosts: monitoring_node
  become: true
  tasks:
    - name: Ensure Prometheus rules directory exists
      file:
        path: /opt/prometheus/rules
        state: directory

    - name: Deploy alert rule for /data exhaustion
      copy:
        dest: /opt/prometheus/rules/inc-011-alerts.yml
        content: |
          groups:
            - name: inc-011-storage
              rules:
                - alert: DataVolumeNearlyFull
                  expr: (node_filesystem_avail_bytes{mountpoint="/data"} / node_filesystem_size_bytes{mountpoint="/data"}) * 100 < 10
                  for: 1m
                  labels:
                    severity: warning
                    incident: inc-011
                  annotations:
                    summary: "Data volume nearly full on {{ '{{' }} $labels.instance {{ '}}' }}"

    - name: Check if rule_files already configured in prometheus.yml
      command: grep -q "rule_files" /opt/prometheus/prometheus.yml
      register: rule_files_check
      failed_when: false
      changed_when: false

    - name: Add rule_files to prometheus.yml if missing
      lineinfile:
        path: /opt/prometheus/prometheus.yml
        insertbefore: "scrape_configs:"
        line: |
          rule_files:
            - /opt/prometheus/rules/*.yml
      when: rule_files_check.rc != 0

    - name: Reload Prometheus
      shell: pkill -HUP prometheus || true
