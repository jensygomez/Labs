---
- name: "INC-010 | Deploy order pipeline (S3 backend)"
  hosts: app_fleet
  become: true
  vars:
    fakecloud_endpoint: "http://10.45.223.1:4566"
    bucket_name: "central-orders"
    mount_point: "/mnt/central-orders"
    textfile_dir: "/var/lib/node_exporter/textfile_collector"

  tasks:

    # --- Directorios base ---
    - name: Create required directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /var/spool/orders
        - /var/lib/order-sync
        - "{{ mount_point }}"
        - "{{ textfile_dir }}"

    # --- order-gen: simula tráfico real ---
    - name: Deploy order-gen script
      copy:
        dest: /usr/local/bin/order-gen.sh
        mode: '0755'
        content: |
          #!/bin/bash
          mkdir -p /var/spool/orders
          echo "{\"node\":\"$(hostname)\",\"order_id\":\"$(date +%s%N)\",\"ts\":\"$(date -Is)\"}" > /var/spool/orders/order-$(date +%s%N).json

    - name: Deploy order-gen systemd unit
      copy:
        dest: /etc/systemd/system/order-gen.service
        content: |
          [Unit]
          Description=Generate a simulated order file

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/order-gen.sh

    - name: Deploy order-gen timer
      copy:
        dest: /etc/systemd/system/order-gen.timer
        content: |
          [Unit]
          Description=Run order-gen every 20s

          [Timer]
          OnBootSec=10s
          OnUnitActiveSec=20s

          [Install]
          WantedBy=timers.target

    # --- s3-backend: verifica conectividad con S3 ---
    - name: Deploy s3-backend script
      copy:
        dest: /usr/local/bin/s3-backend.sh
        mode: '0755'
        content: |
          #!/bin/bash
          LOG_FILE=/var/log/s3-backend.log
          MOUNT_POINT={{ mount_point }}
          mkdir -p $MOUNT_POINT

          RESULT=$(aws --endpoint-url {{ fakecloud_endpoint }} s3 ls s3://{{ bucket_name }} 2>&1)
          if [ $? -eq 0 ]; then
              echo "[$(date)] S3 backend connected" >> $LOG_FILE
              touch $MOUNT_POINT/.s3-mounted
              exit 0
          else
              echo "[$(date)] S3 backend FAILED: $RESULT" >> $LOG_FILE
              exit 1
          fi

    - name: Deploy s3-backend systemd unit (CORRECT ordering)
      copy:
        dest: /etc/systemd/system/s3-backend.service
        content: |
          [Unit]
          Description=S3 Backend Connectivity Check
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/bin/s3-backend.sh

          [Install]
          WantedBy=multi-user.target

    # --- order-sync: sincroniza a S3 ---
    - name: Deploy order-sync script
      copy:
        dest: /usr/local/bin/order-sync.sh
        mode: '0755'
        content: |
          #!/bin/bash
          LOG_FILE=/var/log/order-sync.log
          METRICS_FILE={{ textfile_dir }}/order_sync.prom
          export AWS_ACCESS_KEY_ID=test
          export AWS_SECRET_ACCESS_KEY=test
          export AWS_DEFAULT_REGION=us-east-1

          mkdir -p {{ textfile_dir }}

          RESULT=$(aws --endpoint-url {{ fakecloud_endpoint }} s3 sync /var/spool/orders/ s3://{{ bucket_name }}/$(hostname)/ 2>&1)
          if [ $? -eq 0 ]; then
              echo "[$(date)] sync OK" >> $LOG_FILE
              touch /var/lib/order-sync/last_ok
              echo "order_sync_success 1" > $METRICS_FILE
              echo "order_sync_last_success_timestamp $(date +%s)" >> $METRICS_FILE
          else
              echo "[$(date)] sync FAILED: $RESULT" >> $LOG_FILE
              echo "order_sync_success 0" > $METRICS_FILE
              echo "order_sync_last_success_timestamp $(date +%s)" >> $METRICS_FILE
          fi

    - name: Deploy order-sync systemd unit
      copy:
        dest: /etc/systemd/system/order-sync.service
        content: |
          [Unit]
          Description=Sync local orders to central S3 storage
          Requires=s3-backend.service
          After=s3-backend.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/order-sync.sh

    - name: Deploy order-sync timer
      copy:
        dest: /etc/systemd/system/order-sync.timer
        content: |
          [Unit]
          Description=Run order-sync every 60s

          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=60s

          [Install]
          WantedBy=timers.target

    # --- /health endpoint (independiente) ---
    - name: Deploy /health endpoint
      copy:
        dest: /usr/share/nginx/html/health
        content: "OK"

    # --- Activar todo ---
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable and start services
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop:
        - s3-backend.service
        - order-gen.timer
        - order-sync.timer
        - nginx

---
- name: "INC-010 | Create S3 bucket in FakeCloud"
  hosts: localhost
  connection: local
  vars:
    fakecloud_endpoint: "http://10.45.223.1:4566"
    bucket_name: "central-orders"
  environment:
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_DEFAULT_REGION: us-east-1

  tasks:
    - name: Create S3 bucket
      command: >
        aws --endpoint-url {{ fakecloud_endpoint }}
        s3 mb s3://{{ bucket_name }}
      register: bucket_result
      failed_when: false
      changed_when: bucket_result.rc == 0

---
- name: "INC-010 | Inject Prometheus alert rule"
  hosts: monitoring_node
  become: true

  tasks:
    - name: Create rules directory
      file:
        path: /opt/prometheus/rules
        state: directory

    - name: Deploy alert rule
      copy:
        dest: /opt/prometheus/rules/inc-010-alerts.yml
        content: |
          groups:
            - name: inc-010-order-sync
              rules:
                - alert: OrderSyncFailing
                  expr: order_sync_success == 0
                  for: 2m
                  labels:
                    severity: warning
                    incident: inc-010
                  annotations:
                    summary: "Order sync failing on {{ $labels.instance }}"

    - name: Add rule_files to prometheus.yml if missing
      lineinfile:
        path: /opt/prometheus/prometheus.yml
        insertbefore: "scrape_configs:"
        line: |
          rule_files:
            - /opt/prometheus/rules/*.yml
      when: "'rule_files' not in lookup('file', '/opt/prometheus/prometheus.yml')"

    - name: Reload Prometheus
      shell: pkill -HUP prometheus || true
