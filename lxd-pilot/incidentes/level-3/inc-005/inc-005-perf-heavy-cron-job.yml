---
# ==============================================================================
# INCIDENT INJECTION: inc-005-perf-heavy-cron-job
# ==============================================================================
# WARNING: This playbook intentionally degrades system performance.
# DO NOT RUN IN PRODUCTION. For lab use only.
# ==============================================================================

- name: Inject Incident INC-005 (Heavy Cron Job)
  hosts: all_nodes
  become: yes
  gather_facts: no
  tasks:
    - name: Ensure /usr/local/bin exists
      file:
        path: /usr/local/bin
        state: directory
        mode: '0755'

# ==============================================================================
# DO NOT READ — ROOT CAUSE
# The fault is injected ONLY on node02. 
# A poorly optimized script is scheduled to run every minute, causing 
# severe CPU and I/O wait spikes.
# ==============================================================================
- name: Inject Fault on Culprit Node
  hosts: node02
  become: yes
  tasks:
    - name: Deploy the poorly optimized log analysis script
      copy:
        dest: /usr/local/bin/heavy-log-scan.sh
        content: |
          #!/bin/bash
          # Simulates a heavy, poorly optimized log analysis job
          # Scans all log files and forces disk I/O and CPU usage
          find /var/log -type f -name "*.log" -exec grep -l "ERROR" {} \; > /dev/null 2>&1
        mode: '0755'
        owner: root
        group: root

    - name: Schedule the heavy job to run every minute
      copy:
        dest: /etc/cron.d/heavy-log-scan
        content: |
          # Heavy log scan job - runs every minute
          * * * * * root /usr/local/bin/heavy-log-scan.sh
        mode: '0644'
        owner: root
        group: root

# ==============================================================================
# TICKET DELIVERY MECHANISM - IN ENGLISH, FOR ALL FLEET NODES
# ==============================================================================
- name: Deploy full incident ticket to MOTD
  hosts: fleet
  become: yes
  tasks:
    - name: Deploy complete incident ticket to /etc/motd
      copy:
        dest: /etc/motd
        content: |
          ======================================================================
          OPS-1042 - INCIDENT - P2
          ======================================================================
          REPORTED BY: Zabbix Monitoring        TIME: 03:14 AM
          SUMMARY: Intermittent high load average on one of the fleet nodes
          ======================================================================
          
          DESCRIPTION:
          Automatic alert: one of the application fleet nodes (node01/02/03)
          is reporting intermittent load spikes (load average > 3.0) and
          high I/O wait (>40%). The problem is not constant -- it appears
          and disappears in approximately 1-minute cycles. The load balancer
          is still functioning, but the client reports intermittent slowness
          in the backend APIs during these spikes.
          
          The Zabbix dashboard shows that one node has a different behavior
          pattern than the others, but it is not clear which one is the
          source of the problem.
          
          NOTES FROM PREVIOUS SHIFT (Night L1):
          "I logged in around 02:15 AM and saw a `find` process consuming
          100% CPU on one of the nodes. I killed it with `kill -9 <pid>` and
          the load average immediately dropped to 0.1. I assumed it was just
          a late-running nightly maintenance task. I didn't see any other
          issues. I left the ticket open for the next shift because I didn't
          have time to investigate further, but it seems like a false positive."
          
          CLIENT IMPACT: Intermittent latency and sporadic timeouts in the
          backend APIs during load spikes. The development team reports that
          some requests are taking >5 seconds when they should take <500ms.
          
          RESOLUTION CRITERIA:
          1. Identify which node in the fleet is causing the load spikes.
          2. Identify the root cause of the `find` process that appears periodically.
          3. Determine why the problem "returns" after killing the process.
          4. Remove or reschedule the problematic task permanently.
          5. Verify that the load average stays <1.0 for at least 10 minutes.
          6. Automate the fix in an idempotent playbook (remediation/remediate-inc-005.yml).
          
          PRIORITY: P2 - Service degradation, but not a complete outage.
          ======================================================================
        mode: '0644'
