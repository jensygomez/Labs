---
# roles/inc-010/tasks/deploy.yml
# Deploys the order-gen -> aws-creds-setup -> s3-backend -> order-sync
# pipeline on the app fleet, and the Prometheus alert rule on monitoring.
# Idempotent: re-running this only changes what actually differs.

- name: Create S3 bucket in FakeCloud (control host)
  ansible.builtin.command: >
    aws --endpoint-url {{ fakecloud_endpoint }}
    s3 mb s3://{{ bucket_name }}
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_key }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
  delegate_to: localhost
  run_once: true
  register: _mb_result
  failed_when:
    - _mb_result.rc != 0
    - "'BucketAlreadyOwnedByYou' not in _mb_result.stderr"
    - "'BucketAlreadyExists' not in _mb_result.stderr"
  changed_when: "'make_bucket' in _mb_result.stdout"

- name: Ensure required directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /var/spool/orders
    - /var/lib/order-sync
    - "{{ node_exporter_textfile_dir }}"

# --- order-gen ---
- name: Deploy order-gen script
  ansible.builtin.template:
    src: order-gen.sh.j2
    dest: /usr/local/bin/order-gen.sh
    mode: '0755'

- name: Deploy order-gen service + timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
  loop:
    - order-gen.service
    - order-gen.timer
  notify: reload systemd

# --- aws-creds-setup ---
- name: Deploy aws-creds-setup script
  ansible.builtin.template:
    src: aws-creds-setup.sh.j2
    dest: /usr/local/bin/aws-creds-setup.sh
    mode: '0755'

- name: Deploy aws-creds-setup service
  ansible.builtin.template:
    src: aws-creds-setup.service.j2
    dest: /etc/systemd/system/aws-creds-setup.service
  notify: reload systemd

# --- s3-backend (healthy version: with_dependency=true) ---
- name: Deploy s3-backend script
  ansible.builtin.template:
    src: s3-backend.sh.j2
    dest: /usr/local/bin/s3-backend.sh
    mode: '0755'

- name: Deploy s3-backend service (healthy, with dependency ordering)
  ansible.builtin.template:
    src: s3-backend.service.j2
    dest: /etc/systemd/system/s3-backend.service
  vars:
    with_dependency: true
  notify: reload systemd

# --- order-sync ---
- name: Deploy order-sync script
  ansible.builtin.template:
    src: order-sync.sh.j2
    dest: /usr/local/bin/order-sync.sh
    mode: '0755'

- name: Deploy order-sync service + timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
  loop:
    - order-sync.service
    - order-sync.timer
  notify: reload systemd

- name: Flush handlers before enabling units
  ansible.builtin.meta: flush_handlers

- name: Enable and start pipeline units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - aws-creds-setup.service
    - s3-backend.service
    - order-gen.timer
    - order-sync.timer

# --- Prometheus alert rule (monitoring host only) ---
- name: Ensure Prometheus rules directory exists
  ansible.builtin.file:
    path: "{{ prometheus_rules_dir }}"
    state: directory
    mode: '0755'
  when: inventory_hostname == 'monitoring'

- name: Deploy inc-010 Prometheus alert rules
  ansible.builtin.template:
    src: inc-010-alerts.yml.j2
    dest: "{{ prometheus_rules_dir }}/inc-010-alerts.yml"
  when: inventory_hostname == 'monitoring'
  notify: reload prometheus

- name: Ensure prometheus.yml references the rules directory
  ansible.builtin.blockinfile:
    path: /opt/prometheus/prometheus.yml
    insertbefore: '^scrape_configs:'
    marker: "# {mark} ANSIBLE MANAGED - rule_files"
    block: |
      rule_files:
        - {{ prometheus_rules_dir }}/*.yml
  when: inventory_hostname == 'monitoring'
  notify: reload prometheus
