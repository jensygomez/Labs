---
# roles/inc-010/tasks/inject_fault.yml
# Injects the fault on {{ fault_node }} only, then reboots the whole
# app_fleet to trigger the boot race. Expected to be included from a
# play whose `hosts:` is the app_fleet group (so the reboot task below
# runs natively per-host, in parallel, without delegate_to tricks).
#
# ROOT CAUSE (do not read before attempting the lab): without
# Requires=/After=aws-creds-setup.service, systemd starts both units in
# parallel at boot. s3-backend.sh checks a readiness flag file written by
# aws-creds-setup.sh; if s3-backend runs first, the flag is missing and
# the check fails deterministically, exit 1. order-sync.service declares
# Requires=s3-backend.service, so it fails too, and the node's overall
# boot state becomes "degraded". nginx's /health is a fully independent
# unit and keeps returning 200 OK, so external/LB monitoring never
# catches it.

- name: "Re-deploy s3-backend.service on {{ fault_node }} WITHOUT dependency ordering"
  ansible.builtin.template:
    src: s3-backend.service.j2
    dest: /etc/systemd/system/s3-backend.service
  vars:
    with_dependency: false
  delegate_to: "{{ fault_node }}"
  run_once: true

- name: "Reload systemd and re-enable s3-backend.service on {{ fault_node }}"
  ansible.builtin.systemd:
    name: s3-backend.service
    daemon_reload: true
    enabled: true
  delegate_to: "{{ fault_node }}"
  run_once: true

- name: Reboot this fleet node to trigger the maintenance-window boot race
  ansible.builtin.reboot:
    reboot_timeout: 60
    connect_timeout: 5
    post_reboot_delay: 5

- name: Wait for a couple of order-sync cycles to run post-reboot
  ansible.builtin.pause:
    seconds: 90
  run_once: true
