---
# roles/common/tasks/deploy_ticket.yml
# Reusable: writes the incident ticket to /etc/motd on every host in the play.
# Call with: include_role: name=common, tasks_from=deploy_ticket
# Requires: ticket_text (string) defined by the calling incident role.

- name: Deploy incident ticket to /etc/motd
  ansible.builtin.copy:
    content: "{{ ticket_text }}"
    dest: /etc/motd
    mode: '0644'
