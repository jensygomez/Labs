---
# roles/common/tasks/assert_boot_state.yml
# Reusable: asserts systemctl is-system-running matches an expected value
# on a specific host. Requires: assert_boot_target_host, assert_boot_expected_state

- name: "Check systemd boot state on {{ assert_boot_target_host }}"
  ansible.builtin.command: systemctl is-system-running
  register: _boot_state
  changed_when: false
  failed_when: false
  delegate_to: "{{ assert_boot_target_host }}"

- name: "Assert boot state on {{ assert_boot_target_host }} is '{{ assert_boot_expected_state }}'"
  ansible.builtin.assert:
    that:
      - _boot_state.stdout.strip() == assert_boot_expected_state
    fail_msg: >-
      Expected {{ assert_boot_target_host }} to be
      '{{ assert_boot_expected_state }}' but systemctl is-system-running
      reported '{{ _boot_state.stdout }}'
    success_msg: >-
      {{ assert_boot_target_host }} boot state confirmed:
      '{{ _boot_state.stdout }}'
