---
- name: "OPS-1060 - Estandarización y Corrección de Systemd Service"
  hosts: node01,node02,node03  # Limitado estrictamente a los nodos de la aplicación
  become: true
  gather_facts: false

  tasks:
    - name: Tarea 1 - Asegurar el archivo de configuración correcto para myapp.service
      ansible.builtin.copy:
        dest: /etc/systemd/system/myapp.service
        content: |
          [Unit]
          Description=My App Log Writer
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=appuser
          Group=appuser
          ExecStart=/usr/local/bin/myapp-writer.sh
          Restart=always

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'
      register: service_file

    - name: Tarea 2 - Recargar daemon de systemd solo si hubo cambios
      ansible.builtin.systemd:
        daemon_reload: true
      when: service_file.changed

    - name: Tarea 3 - Asegurar que el servicio esté activo y reiniciado si cambió la config
      ansible.builtin.systemd:
        name: myapp
        state: restarted
        enabled: true
      when: service_file.changed
