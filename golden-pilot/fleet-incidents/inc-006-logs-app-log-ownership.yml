==============================================================================
INCIDENT INJECTION: inc-006-logs-app-log-ownership
==============================================================================
WARNING: This playbook intentionally breaks application logging across the fleet.
DO NOT RUN IN PRODUCTION. For lab use only.
==============================================================================
---
- name: Inject Incident INC-006 (App Log Ownership / NFS Permissions)
  hosts: all_nodes
  become: yes
  gather_facts: no
  tasks:
    - name: Ensure 'appuser' exists with consistent UID/GID across all nodes
      user:
        name: appuser
        uid: 1001
        group: appuser
        state: present
        create_home: no

==============================================================================
STORAGE NODE SETUP (node04)
==============================================================================
- name: Configure NFS Server on Storage Node
  hosts: node04
  become: yes
  tasks:
    - name: Install NFS server utilities
      dnf:
        name: nfs-utils
        state: present

    - name: Create shared log directory
      file:
        path: /srv/nfs/app-logs
        state: directory
        owner: appuser
        group: appuser
        mode: '0755'

    - name: Configure NFS export with root_squash
      copy:
        dest: /etc/exports.d/app-logs.exports
        content: "/srv/nfs/app-logs 192.168.122.0/24(rw,sync,root_squash,all_squash,anonuid=1001,anongid=1001)\n"
        mode: '0644'

    - name: Export filesystems and start NFS server
      shell: |
        exportfs -arv
        systemctl enable --now nfs-server
      changed_when: true

==============================================================================
FLEET NODES SETUP (node01-03)
==============================================================================
- name: Configure NFS Clients and Deploy App on Fleet
  hosts: fleet
  become: yes
  tasks:
    - name: Install NFS client utilities
      dnf:
        name: nfs-utils
        state: present

    - name: Create local mount point for shared logs
      file:
        path: /var/log/myapp
        state: directory
        owner: appuser
        group: appuser
        mode: '0755'

    - name: Mount NFS share in /etc/fstab
      mount:
        path: /var/log/myapp
        src: 192.168.122.14:/srv/nfs/app-logs
        fstype: nfs
        opts: defaults,_netdev
        state: mounted

    - name: Deploy dummy application script
      copy:
        dest: /usr/local/bin/myapp-writer.sh
        content: |
          #!/bin/bash
          # Dummy app that writes a log line every 5 seconds
          while true; do
            echo "$(date '+%Y-%m-%d %H:%M:%S') - INFO - Application heartbeat from $(hostname)" >> /var/log/myapp/app.log
            sleep 5
          done
        mode: '0755'
        owner: appuser
        group: appuser

    - name: Deploy systemd service for the application
      copy:
        dest: /etc/systemd/system/myapp.service
        content: |
          [Unit]
          Description=My App Log Writer
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=appuser
          Group=appuser
          ExecStart=/usr/local/bin/myapp-writer.sh
          Restart=always

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Start and enable the application service
      systemd:
        name: myapp
        state: started
        enabled: yes
        daemon_reload: yes

==============================================================================
DO NOT READ — ROOT CAUSE
The fault is injected ONLY on node03.
The systemd service on node03 is modified to remove the 'User=appuser' 
directive. The app runs as 'root'. Because the NFS server (node04) 
has 'root_squash' enabled, the 'root' writes are mapped to 'nobody'.
The other nodes (running as 'appuser') get "Permission denied" when 
trying to write to the shared log file created by node03.
==============================================================================
- name: Inject Fault on Culprit Node
  hosts: node03
  become: yes
  tasks:
    - name: Break the systemd service by removing the User directive
      copy:
        dest: /etc/systemd/system/myapp.service
        content: |
          [Unit]
          Description=My App Log Writer
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          # User=appuser  <-- REMOVED BY PREVIOUS ADMIN "FOR TESTING"
          # Group=appuser <-- REMOVED BY PREVIOUS ADMIN "FOR TESTING"
          ExecStart=/usr/local/bin/myapp-writer.sh
          Restart=always

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Restart the broken service so it runs as root
      systemd:
        name: myapp
        state: restarted
        daemon_reload: yes

==============================================================================
TICKET DELIVERY MECHANISM - IN ENGLISH, FOR ALL FLEET & STORAGE NODES
==============================================================================
- name: Deploy full incident ticket to MOTD
  hosts: all_nodes
  become: yes
  tasks:
    - name: Deploy complete incident ticket to /etc/motd
      copy:
        dest: /etc/motd
        content: |
          ======================================================================
          OPS-1060 - INCIDENT - P2
          ======================================================================
          REPORTED BY: App Dev Team             TIME: 09:45 AM
          SUMMARY: Application logging failures and "Permission denied" errors
          ======================================================================
          DESCRIPTION:
           The backend application across the fleet (node01/02/03) writes its 
           runtime logs to a shared NFS directory hosted on the storage node 
           (node04) at /var/log/myapp. 
           
           The development team is reporting that logs are missing, and the 
           application logs on node04 show "Permission denied" errors. 
           The application is supposed to run as 'appuser', but it seems 
           some nodes are failing to write to the shared log file.
           
           NOTES FROM PREVIOUS SHIFT (Night L1):
           "I checked the storage node (node04) and the NFS export permissions 
           look perfectly fine (owned by appuser). I also checked `dmesg` on 
           the fleet nodes and saw some NFS stale file handle warnings, so I 
           remounted the NFS share on node01 and node02. That didn't fix it. 
           I think the NFS server might be dropping packets or there's a 
           network routing issue. I'll escalate to the network team tomorrow."
           
           CLIENT IMPACT: We are losing critical application logs, making it 
           impossible to debug production issues. The app itself is running, 
           but logging is broken.
           
           RESOLUTION CRITERIA:
           1. Identify which node(s) in the fleet are failing to write to the shared log.
           2. Investigate the actual ownership/permissions of the shared log file on the NFS server.
           3. Determine why the previous shift's "remount" didn't fix the issue.
           4. Identify the root cause of the permission mismatch (Hint: Look at how the app runs locally vs how NFS maps UIDs).
           5. Fix the configuration on the affected node(s) permanently.
           6. Verify that all nodes can successfully write to the shared log.
           7. Automate the fix in TWO idempotent playbooks:
              - triage/triage-inc-006.yml (detect affected servers in a 1000-server fleet)
              - remediation/remediate-inc-006.yml (fix only the affected servers)
           
           PRIORITY: P2 - Loss of observability, potential compliance violation.
           ======================================================================
        mode: '0644'
