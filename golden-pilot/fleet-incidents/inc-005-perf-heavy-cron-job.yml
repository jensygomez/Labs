---
# ==============================================================================
# INCIDENT INJECTION: inc-005-perf-heavy-cron-job
# ==============================================================================
# WARNING: This playbook intentionally degrades system performance.
# DO NOT RUN IN PRODUCTION. For lab use only.
# ==============================================================================

- name: Inject Incident INC-005 (Heavy Cron Job)
  hosts: all_nodes
  become: yes
  gather_facts: no
  tasks:
    - name: Ensure /usr/local/bin exists
      file:
        path: /usr/local/bin
        state: directory
        mode: '0755'

# ==============================================================================
# DO NOT READ — ROOT CAUSE
# The fault is injected ONLY on node02. 
# A poorly optimized script is scheduled to run every minute, causing 
# severe CPU and I/O wait spikes.
# ==============================================================================
- name: Inject Fault on Culprit Node
  hosts: node02
  become: yes
  tasks:
    - name: Deploy the poorly optimized log analysis script
      copy:
        dest: /usr/local/bin/heavy-log-scan.sh
        content: |
          #!/bin/bash
          # Simulates a heavy, poorly optimized log analysis job
          # Scans all log files and forces disk I/O and CPU usage
          find /var/log -type f -name "*.log" -exec grep -l "ERROR" {} \; > /dev/null 2>&1
        mode: '0755'
        owner: root
        group: root

    - name: Schedule the heavy job to run every minute
      copy:
        dest: /etc/cron.d/heavy-log-scan
        content: |
          # Heavy log scan job - runs every minute
          * * * * * root /usr/local/bin/heavy-log-scan.sh
        mode: '0644'
        owner: root
        group: root

# ==============================================================================
# TICKET DELIVERY MECHANISM (Visible on all fleet nodes for alerting)
# ==============================================================================
- name: Configure Alerting and Ticket Delivery
  hosts: fleet
  become: yes
  tasks:
    - name: Set high-stress MOTD banner with ANSI colors
      copy:
        dest: /etc/motd
        content: |
          \033[1;31m======================================================================\033[0m
          \033[1;31mOPS-1042 - INCIDENT - P2\033[0m
          \033[1;31m======================================================================\033[0m
          \033[1;33mREPORTADO POR:\033[0m Zabbix Monitoring        \033[1;33mHORA:\033[0m 03:14 AM
          \033[1;33mRESUMEN:\033[0m \033[1;37mIntermittent high load average on fleet nodes\033[0m
          \033[1;31m======================================================================\033[0m
          
          \033[1;33mACTION REQUIRED:\033[0m Triage immediately. See \033[1;36m~/TICKET.md\033[0m for full details.
          
        mode: '0644'

    - name: Deploy professional Jira-style incident ticket
      copy:
        dest: /home/jensyg/TICKET.md
        content: |
          ======================================================================
          OPS-1042 - INCIDENT - P2
          ======================================================================
          REPORTADO POR: Zabbix Monitoring        HORA: 03:14 AM
          RESUMEN: Intermittent high load average on fleet nodes
          ======================================================================
          
          DESCRIPCION:
          Alerta automatica: los nodos de la flota de aplicacion (node01/02/03)
          estan reportando picos intermitentes de carga (load average > 3.0) y
          alto I/O wait (>40%). El problema no es constante -- aparece y desaparece
          en ciclos de aproximadamente 1 minuto. El balanceador de carga sigue
          funcionando, pero el cliente reporta lentitud intermitente en las APIs
          de backend durante estos picos.
          
          El dashboard de Zabbix muestra que los 3 nodos tienen el mismo patron
          de comportamiento, pero no esta claro si todos estan afectados por igual
          o si uno es el origen del problema.
          
          NOTAS DEL TURNO ANTERIOR (L1 nocturno):
          "Me conecte alrededor de las 02:15 AM y vi un proceso `find` consumiendo
          100% CPU en uno de los nodos. Lo mate con `kill -9 <pid>` y el load average
          bajo inmediatamente a 0.1. Asumi que era solo una tarea de mantenimiento
          nocturno que se ejecuto tarde. No vi otros problemas. Deje el ticket abierto
          para el proximo turno porque no tuve tiempo de revisar mas a fondo, pero
          parece un falso positivo."
          
          IMPACTO AL CLIENTE: Latencia intermitente y timeouts esporadicos en las
          APIs de backend durante los picos de carga. El equipo de desarrollo reporta
          que algunas requests estan tardando >5 segundos cuando deberian tomar <500ms.
          
          CRITERIO DE RESOLUCION:
          1. Identificar cual nodo(s) de la flota estan causando los picos de carga.
          2. Identificar la causa raiz del proceso `find` que aparece periodicamente.
          3. Determinar por que el problema "regresa" despues de matar el proceso.
          4. Remover o reprogramar la tarea problematica de forma permanente.
          5. Verificar que el load average se mantiene <1.0 durante al menos 10 minutos.
          6. Automatizar el fix en un playbook idempotente (remediation/remediate-inc-005.yml).
          
          PRIORIDAD: P2 - Degradacion de servicio, pero no outage completo.
          ======================================================================
        owner: jensyg
        group: jensyg
        mode: '0644'
