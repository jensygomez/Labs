# inventory/inventory.ini

[all:vars]
# Usuario y puerto comunes para todas las VMs
ansible_user=vagrant
ansible_port=22

# Clave privada: asumimos que estamos en el directorio raíz del toolkit
# y que el laboratorio activo se encuentra en una subcarpeta definida por una variable de entorno o por el contexto.
# Para evitar hardcodear, podemos usar una variable que se pase al ejecutar:
# ansible-playbook -i inventory/inventory.ini -e "lab_path=fleet-incidents/inc-001-boot-fstab-mount-failure" ...
ansible_ssh_private_key_file="{{ lab_path | default('fleet-incidents/inc-001-boot-fstab-mount-failure') }}/.vagrant/machines/{{ inventory_hostname }}/libvirt/private_key"

# Opciones SSH (solo para desarrollo)
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[fleet]
node01 ansible_host=192.168.122.11
node02 ansible_host=192.168.122.12
node03 ansible_host=192.168.122.13

[storage]
node04 ansible_host=192.168.122.14

[all_nodes:children]
fleet
storage
