---
- name: Triage de Rendimiento (CPU, Memoria y Procesos)
  hosts: localhost
  connection: local
  become: true

  tasks:

    - name: 1. Obtener Carga Media del Sistema (Load Average)
      ansible.builtin.command: uptime
      register: system_uptime
      changed_when: false

    - name: 2. Identificar los Top 5 procesos por consumo de CPU
      ansible.builtin.shell: "ps -eo pid,user,%cpu,%mem,cmd --sort=-%cpu | head -n 6"
      register: top_cpu
      changed_when: false

    - name: 3. Identificar los Top 5 procesos por consumo de RAM
      ansible.builtin.shell: "ps -eo pid,user,%mem,%cpu,cmd --sort=-%mem | head -n 6"
      register: top_mem
      changed_when: false

    - name: 4. Inspeccionar Systemd Timers activos (tareas programadas modernas)
      ansible.builtin.command: systemctl list-timers --no-pager
      register: active_timers
      changed_when: false

    - name: === INFORME DE TRIAJE: CPU & PERFORMANCE ===
      ansible.builtin.debug:
        msg:
          - "--- UPTIME Y LOAD AVERAGE ---"
          - "{{ system_uptime.stdout }}"
          - "--- TOP CONSUMIDORES DE CPU ---"
          - "{{ top_cpu.stdout_lines }}"
          - "--- TOP CONSUMIDORES DE MEMORIA ---"
          - "{{ top_mem.stdout_lines }}"
          - "--- TAREAS PROGRAMADAS (TIMERS) ---"
          - "{{ active_timers.stdout_lines }}"
