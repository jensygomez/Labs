---
- name: Triage Systemd y logs
  hosts: all_nodes
  become: true
  vars:
    journal_lines: 20

  tasks:
    - name: Obtener estado de servicios
      ansible.builtin.service_facts:
      register: services

    - name: Listar servicios en failed
      ansible.builtin.set_fact:
        failed_services: "{{ services.ansible_facts.services | dict2items | selectattr('value.state', 'equalto', 'failed') | map(attribute='key') | list }}"

    - name: Estado del sistema
      ansible.builtin.command: systemctl is-system-running
      register: system_state
      failed_when: false
      changed_when: false

    - name: Últimos errores del journal
      ansible.builtin.command: "journalctl -p err..emerg -n {{ journal_lines }} --no-pager"
      register: journal_errors
      changed_when: false
      ignore_errors: true

    - name: Mostrar informe
      ansible.builtin.debug:
        msg:
          - "Host: {{ ansible_hostname }}"
          - "Estado sistema: {{ system_state.stdout | default('desconocido') }}"
          - "Servicios fallidos: {{ failed_services | join(', ') if failed_services else 'Ninguno' }}"
          - "Logs: {{ journal_errors.stdout | default('Sin errores') }}"
