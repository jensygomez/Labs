---
- name: Triage de Red, Puertos y Sockets Escuchando
  hosts: localhost
  connection: local
  become: true

  tasks:

    - name: 1. Auditar sockets y puertos en escucha (TCP/UDP)
      ansible.builtin.shell: "ss -tulpn | grep LISTEN"
      register: listening_ports
      changed_when: false

    - name: 2. Verificar estado de interfaces de red
      ansible.builtin.command: ip -brief addr
      register: ip_addresses
      changed_when: false

    - name: 3. Comprobar resolución DNS local y servidor NameServer
      ansible.builtin.command: cat /etc/resolv.conf
      register: resolv_conf
      changed_when: false

    - name: 4. Comprobar reglas de Firewall activas (IPTables / Nftables / Firewalld)
      ansible.builtin.shell: "firewall-cmd --state 2>/dev/null || iptables -L -n -v | head -n 15"
      register: firewall_status
      failed_when: false
      changed_when: false

    - name: === INFORME DE TRIAJE: NETWORK & PORTS ===
      ansible.builtin.debug:
        msg:
          - "--- PUERTOS EN ESCUCHA (LISTEN) ---"
          - "{{ listening_ports.stdout_lines }}"
          - "--- INTERFACES E IPS CONFIGURADAS ---"
          - "{{ ip_addresses.stdout_lines }}"
          - "--- SERVIDORES DNS CONFIGURADOS ---"
          - "{{ resolv_conf.stdout_lines }}"
          - "--- ESTADO DE FIREWALL ---"
          - "{{ firewall_status.stdout_lines }}"
