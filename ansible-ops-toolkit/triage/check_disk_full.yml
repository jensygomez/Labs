---
- name: Triaje de Problemas de Disco (Disk Full / NFS / Logs)
  hosts: all_nodes
  become: true
  vars:
    disk_threshold: 80           # Alerta si uso > 80%
    large_file_size: 100         # Archivos > 100MB
    nfs_mounts:                  # Puntos de montaje NFS a revisar
      - /var/log/app-metrics

  tasks:
    # ------------------------------------------------------------
    # 1. RECOPILACIÓN DE DATOS
    # ------------------------------------------------------------
    - name: Obtener uso de disco de todas las particiones
      ansible.builtin.shell:
        cmd: df -h --output=target,used,size,pcent | tail -n +2 | sed 's/  */ /g'
      register: disk_usage
      changed_when: false
      ignore_errors: true

    - name: Obtener puntos de montaje NFS
      ansible.builtin.shell:
        cmd: mount -t nfs,nfs4 | awk '{print $3}'
      register: nfs_mounts_current
      changed_when: false
      ignore_errors: true

    - name: Buscar archivos grandes (> {{ large_file_size }}MB) en /var/log
      ansible.builtin.find:
        paths: /var/log
        file_type: file
        size: "{{ large_file_size }}m"
        recurse: yes
      register: large_files
      ignore_errors: true

    - name: Verificar proceso app-metrics-writer.sh
      ansible.builtin.shell:
        cmd: ps aux | grep app-metrics-writer | grep -v grep || echo "No running"
      register: metrics_process
      changed_when: false
      ignore_errors: true

    - name: Verificar tasa de crecimiento del ARCHIVO COMPARTIDO (ultimos 10 segundos)
      # OJO: /var/log/app-metrics es un mount NFS -- los 3 nodos de la
      # flota escriben al MISMO archivo fisico en node04. Este numero
      # es el crecimiento TOTAL combinado, no la contribucion de este
      # nodo en particular. Sirve para saber "algo esta creciendo rapido
      # en la flota", pero NO para saber "cual nodo es el culpable".
      # Para eso, ver la tarea siguiente (medicion por-proceso).
      ansible.builtin.shell:
        cmd: |
          LOGFILE="/var/log/app-metrics/metrics.log"
          if [ -f "$LOGFILE" ]; then
            SIZE_BEFORE=$(stat -c %s "$LOGFILE")
            sleep 10
            SIZE_AFTER=$(stat -c %s "$LOGFILE")
            GROWTH=$(( (SIZE_AFTER - SIZE_BEFORE) / 10 ))
            echo "Crecimiento compartido: ${GROWTH} bytes/segundo"
          else
            echo "Archivo de log no existe"
          fi
      register: log_growth
      changed_when: false
      ignore_errors: true
      when: "'/var/log/app-metrics' in nfs_mounts_current.stdout_lines"

    - name: Medir escritura REAL de ESTE nodo via /proc/PID/io (aisla al culpable)
      # A diferencia del crecimiento del archivo compartido, write_bytes
      # en /proc/<PID>/io es un contador que el kernel lleva POR PROCESO,
      # sin importar que otros procesos escriban al mismo archivo. Esto
      # SI permite distinguir cual nodo especifico esta escribiendo de mas.
      ansible.builtin.shell:
        cmd: |
          PID=$(pgrep -f app-metrics-writer.sh | head -n1)
          if [ -n "$PID" ] && [ -f "/proc/$PID/io" ]; then
            W1=$(grep '^write_bytes:' "/proc/$PID/io" | awk '{print $2}')
            sleep 5
            W2=$(grep '^write_bytes:' "/proc/$PID/io" | awk '{print $2}')
            DIFF=$(( (W2 - W1) / 5 ))
            echo "PID=${PID} write_bytes_per_sec=${DIFF}"
          else
            echo "PROCESO_NO_ENCONTRADO"
          fi
      register: proc_io_growth
      changed_when: false
      ignore_errors: true

    # ------------------------------------------------------------
    # 2. ANÁLISIS Y DETECCIÓN DE PROBLEMAS
    # ------------------------------------------------------------
    - name: Detectar particiones con uso > {{ disk_threshold }}%
      ansible.builtin.set_fact:
        high_usage_partitions: >-
          {{
            disk_usage.stdout_lines
            | select('search', '([0-9]+)%')
            | map('regex_replace', '.* ([0-9]+)%.*', '\1')
            | map('int')
            | select('>', disk_threshold)
            | list
          }}
      when: disk_usage.stdout is defined

    - name: Detectar si el NFS está montado y escribible
      ansible.builtin.shell:
        cmd: |
          MOUNT_POINT="/var/log/app-metrics"
          if mount | grep -q "$MOUNT_POINT"; then
            if touch "$MOUNT_POINT/.write_test" 2>/dev/null; then
              rm -f "$MOUNT_POINT/.write_test"
              echo "OK - Montado y escribible"
            else
              echo "ERROR - Montado pero NO escribible"
            fi
          else
            echo "NO_MONTADO"
          fi
      register: nfs_writable
      changed_when: false
      ignore_errors: true
      when: "'/var/log/app-metrics' in nfs_mounts_current.stdout_lines"

    # ------------------------------------------------------------
    # 3. PRE-CALCULAR LAS LÍNEAS DE DIAGNÓSTICO (antes del informe)
    #
    # IMPORTANTE: dentro de una lista de "msg:", cada elemento es su
    # propia plantilla Jinja CERRADA en si misma. No se puede abrir
    # un {% if %} en un elemento y su {% endif %} en otro. Por eso
    # toda la logica condicional se resuelve ACA con set_fact, y el
    # informe de abajo solo muestra el resultado ya calculado.
    #
    # Tambien OJO con las barras invertidas en bloques ">-": en YAML
    # sin comillas, "\d" es UNA barra + d (correcto para regex). Si
    # escribis "\\d" te queda una barra invertida LITERAL seguida de
    # d, que nunca matchea nada -- ese fue el bug de la version anterior.
    # ------------------------------------------------------------
    - name: Calcular línea de diagnóstico -- uso de disco
      ansible.builtin.set_fact:
        diag_disco: >-
          {{
            ('⚠️  ALERTA: Partición(es) con uso > ' ~ disk_threshold ~ '%')
            if (high_usage_partitions | default([]) | length > 0)
            else '✅ Uso de disco dentro de lo normal.'
          }}

    - name: Calcular línea de diagnóstico -- estado del NFS
      ansible.builtin.set_fact:
        diag_nfs: >-
          {{
            '❌ CRÍTICO: NFS montado pero NO escribible (probablemente lleno).'
            if (nfs_writable.stdout is defined and 'ERROR' in nfs_writable.stdout)
            else (
              '❌ CRÍTICO: NFS NO montado en el punto esperado.'
              if (nfs_writable.stdout is defined and 'NO_MONTADO' in nfs_writable.stdout)
              else '✅ NFS OK'
            )
          }}

    - name: Calcular línea de diagnóstico -- crecimiento compartido
      ansible.builtin.set_fact:
        diag_crecimiento: >-
          {{
            '🚨 ALERTA: El ARCHIVO COMPARTIDO crece > 1KB/seg (algun nodo esta sobre-escribiendo).'
            if (
              log_growth.stdout is defined
              and (log_growth.stdout | regex_search('\d+') | default('0')) | int > 1000
            )
            else '✅ Crecimiento del archivo compartido normal'
          }}

    - name: Calcular línea de diagnóstico -- culpable local (por proceso)
      ansible.builtin.set_fact:
        diag_culprit: >-
          {{
            ('🎯 ESTE NODO ES EL CULPABLE: su proceso escribe ' ~
             (proc_io_growth.stdout | regex_replace('.*write_bytes_per_sec=', '')) ~
             ' bytes/seg -- muy por encima de un escritor normal.')
            if (
              proc_io_growth.stdout is defined
              and 'write_bytes_per_sec' in proc_io_growth.stdout
              and (proc_io_growth.stdout | regex_replace('.*write_bytes_per_sec=', '')) | int > 1000
            )
            else '✅ La escritura de ESTE nodo especifico es normal.'
          }}

    # ------------------------------------------------------------
    # 4. INFORME ESTRUCTURADO EN PANTALLA
    # ------------------------------------------------------------
    - name: "=== INFORME DE TRIAJE DE DISCO ==="
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════════════════════╗"
          - "║  INFORME DE DISCO - {{ ansible_hostname }}"
          - "╚══════════════════════════════════════════════════════════╝"
          - ""
          - "📊 USO DE DISCO:"
          - "{{ disk_usage.stdout_lines | default(['No disponible']) }}"
          - ""
          - "📂 ARCHIVOS GRANDES (> {{ large_file_size }}MB) EN /var/log:"
          - "{{ large_files.files | map(attribute='path') | list | default(['Ninguno']) }}"
          - ""
          - "🔗 PUNTOS DE MONTAJE NFS DETECTADOS:"
          - "{{ nfs_mounts_current.stdout_lines | default(['Ninguno']) }}"
          - ""
          - "✍️ ESTADO DE ESCRITURA EN NFS:"
          - "{{ nfs_writable.stdout | default('N/A') }}"
          - ""
          - "🔄 PROCESO DE LOGGING:"
          - "{{ metrics_process.stdout_lines | default(['No detectado']) }}"
          - ""
          - "📈 CRECIMIENTO DEL ARCHIVO COMPARTIDO (contaminado por los 3 nodos):"
          - "{{ log_growth.stdout | default('N/A') }}"
          - ""
          - "🎯 ESCRITURA REAL DE ESTE NODO (aislada, via /proc/PID/io):"
          - "{{ proc_io_growth.stdout | default('N/A') }}"
          - ""
          - "────────────────────────────────────────────────────────────"
          - "🔍 DIAGNÓSTICO RÁPIDO:"
          - "{{ diag_disco }}"
          - "{{ diag_nfs }}"
          - "{{ diag_crecimiento }}"
          - "{{ diag_culprit }}"
          - ""
          - "╔══════════════════════════════════════════════════════════╗"
          - "║  Para remediación, revisa: remediation/inc-002-*.yml"
          - "╚══════════════════════════════════════════════════════════╝"
