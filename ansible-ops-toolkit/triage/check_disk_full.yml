---
- name: Triage de Problemas de Disco (Disk Full / NFS / Logs)
  hosts: all_nodes
  become: true
  gather_facts: true   # Necesario para obtener información de discos y montajes

  vars:
    # Directorios críticos a revisar (puedes ampliarlos)
    critical_dirs:
      - /
      - /var
      - /var/log
      - /var/log/app-metrics   # Específico de nuestro incidente
      - /srv/nfs               # Posible punto de montaje NFS
    # Tamaño mínimo para considerar un archivo "grande" (en MB)
    large_file_threshold: 50

  tasks:

    # 1. INFORMACIÓN GENERAL DEL SISTEMA
    - name: "=== INFORMACIÓN GENERAL ==="
      ansible.builtin.debug:
        msg: "Host: {{ ansible_hostname }} - Fecha: {{ ansible_date_time.iso8601 }}"

    # 2. USO DE DISCO EN DIRECTORIOS CRÍTICOS
    - name: "=== USO DE DISCO EN DIRECTORIOS CRÍTICOS ==="
      ansible.builtin.debug:
        msg: "{{ item }}"
      loop: "{{ critical_dirs }}"
      vars:
        # Obtenemos el uso de disco para cada directorio
        df_output: "{{ lookup('pipe', 'df -h ' ~ item ~ ' 2>/dev/null') }}"
      loop_control:
        label: "{{ item }}"
      when: item is not none
      ignore_errors: true

    # 3. LISTAR ARCHIVOS GRANDES EN DIRECTORIOS CLAVE
    - name: "=== ARCHIVOS GRANDES (> {{ large_file_threshold }} MB) EN /var/log Y SUBDIRECTORIOS ==="
      ansible.builtin.shell:
        cmd: |
          find /var/log -type f -size +{{ large_file_threshold }}M -exec ls -lh {} \; 2>/dev/null || echo "No large files found"
      register: large_files
      changed_when: false
      ignore_errors: true

    - name: Mostrar archivos grandes
      ansible.builtin.debug:
        msg: "{{ large_files.stdout_lines }}"
      when: large_files.stdout_lines | length > 0

    # 4. IDENTIFICAR PROCESOS QUE ESCRIBEN EN /var/log (o en montajes NFS)
    - name: "=== PROCESOS ESCRIBIENDO EN /var/log (usando lsof) ==="
      ansible.builtin.shell:
        cmd: |
          lsof +D /var/log 2>/dev/null | head -20 || echo "No processes found"
      register: lsof_log
      changed_when: false
      ignore_errors: true

    - name: Mostrar procesos
      ansible.builtin.debug:
        msg: "{{ lsof_log.stdout_lines }}"
      when: lsof_log.stdout_lines | length > 0

    # 5. VERIFICAR ESTADO DE NFS (si existe)
    - name: "=== ESTADO DE MONTURAS NFS ==="
      ansible.builtin.shell:
        cmd: |
          mount -t nfs,nfs4 2>/dev/null | awk '{print $3}' | while read m; do
            echo "Montura: $m"
            df -h $m 2>/dev/null | tail -1
            echo "---"
          done
      register: nfs_mounts
      changed_when: false
      ignore_errors: true

    - name: Mostrar información de NFS
      ansible.builtin.debug:
        msg: "{{ nfs_mounts.stdout_lines }}"
      when: nfs_mounts.stdout_lines | length > 0

    # 6. VERIFICAR SI HAY ERRORES DE "NO SPACE" EN EL JOURNAL RECIENTE
    - name: "=== ERRORES DE DISCO LLENO (journalctl) ==="
      ansible.builtin.command:
        cmd: journalctl -p err -g "No space left on device" -n 10 --no-pager
      register: disk_errors
      changed_when: false
      ignore_errors: true

    - name: Mostrar errores de disco
      ansible.builtin.debug:
        msg: "{{ disk_errors.stdout_lines }}"
      when: disk_errors.stdout_lines | length > 0

    # 7. RESUMEN VISUAL (BONITO) CON EMOJIS
    - name: "=== RESUMEN FINAL ==="
      ansible.builtin.debug:
        msg:
          - "✅ **TRIAGE COMPLETADO** para {{ ansible_hostname }}"
          - "📌 **Uso de disco en directorios críticos:**"
          - "  - /: {{ lookup('pipe', 'df -h / | tail -1 | awk \"{print \\$5}\"') }} usado ({{ lookup('pipe', 'df -h / | tail -1 | awk \"{print \\$4}\"') }} libre)"
          - "  - /var/log: {{ lookup('pipe', 'df -h /var/log 2>/dev/null | tail -1 | awk \"{print \\$5}\"') }} usado ({{ lookup('pipe', 'df -h /var/log 2>/dev/null | tail -1 | awk \"{print \\$4}\"') }} libre)"
          - "  - /var/log/app-metrics: {{ lookup('pipe', 'df -h /var/log/app-metrics 2>/dev/null | tail -1 | awk \"{print \\$5}\"') }} usado ({{ lookup('pipe', 'df -h /var/log/app-metrics 2>/dev/null | tail -1 | awk \"{print \\$4}\"') }} libre)"
          - "📂 **Archivos grandes (> {{ large_file_threshold }}MB) en /var/log:**"
          - "  {{ large_files.stdout_lines | default(['Ninguno']) }}"
          - "🔄 **Procesos escribiendo en /var/log:**"
          - "  {{ lsof_log.stdout_lines | default(['Ninguno']) }}"
          - "📡 **Monturas NFS:**"
          - "  {{ nfs_mounts.stdout_lines | default(['No hay NFS']) }}"
          - "💥 **Errores de espacio en disco:**"
          - "  {{ disk_errors.stdout_lines | default(['Ninguno']) }}"
      run_once: false   # se ejecuta en cada nodo
