---
- name: Triaje General de Red, Puertos y Firewall (Network & Firewalld Health Check)
  hosts: all_nodes
  become: true
  vars:
    target_port: 8080            # Puerto TCP a inspeccionar
    target_service: "app-api"    # Nombre del servicio systemd esperado

  tasks:
    # ------------------------------------------------------------
    # 1. VERIFICACIÓN LOCAL DEL PROCESO Y SOCKET
    # ------------------------------------------------------------
    - name: Verificar si el servicio systemd está activo
      ansible.builtin.systemd:
        name: "{{ target_service }}"
      register: service_status
      ignore_errors: true

    - name: Verificar si el puerto {{ target_port }} está escuchando localmente (ss)
      ansible.builtin.shell:
        cmd: "ss -tulpn | grep ':{{ target_port }} ' || echo 'NOT_LISTENING'"
      register: port_listening
      changed_when: false

    - name: Probar conectividad HTTP local (Loopback 127.0.0.1)
      ansible.builtin.shell:
        cmd: "curl -s -o /dev/null -w '%{http_code}' --connect-timeout 2 http://127.0.0.1:{{ target_port }} || echo 'FAILED'"
      register: local_curl
      changed_when: false

    # ------------------------------------------------------------
    # 2. VERIFICACIÓN DE FIREWALLD Y REGLAS DE RED
    # ------------------------------------------------------------
    - name: Verificar estado de Firewalld
      ansible.builtin.command:
        cmd: systemctl is-active firewalld
      register: firewalld_status
      changed_when: false
      ignore_errors: true

    - name: Obtener zona activa y puertos permitidos en Firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --list-ports
      register: firewalld_ports
      changed_when: false
      when: firewalld_status.stdout == 'active'
      ignore_errors: true

    - name: Obtener servicios permitidos en Firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --list-services
      register: firewalld_services
      changed_when: false
      when: firewalld_status.stdout == 'active'
      ignore_errors: true

    # ------------------------------------------------------------
    # 3. EVALUACIÓN Y PRE-CALCULO DE DIAGNÓSTICO
    # ------------------------------------------------------------
    - name: Evaluar salud del socket local
      ansible.builtin.set_fact:
        diag_socket: >-
          {{
            '✅ El proceso escucha localmente en el puerto ' ~ target_port
            if (port_listening.stdout != 'NOT_LISTENING')
            else '❌ CRÍTICO: El proceso NO está escuchando en el puerto ' ~ target_port
          }}

    - name: Evaluar estado del servicio
      ansible.builtin.set_fact:
        diag_service: >-
          {{
            '✅ Servicio ' ~ target_service ~ ' está ACTIVE.'
            if (service_status.status.ActiveState | default('') == 'active')
            else '❌ CRÍTICO: Servicio ' ~ target_service ~ ' NO está activo.'
          }}

    - name: Evaluar regla de Firewall para puerto {{ target_port }}
      ansible.builtin.set_fact:
        diag_firewall: >-
          {{
            '✅ Puerto ' ~ target_port ~ '/tcp PERMITIDO en firewalld.'
            if (
              firewalld_status.stdout == 'active'
              and (target_port ~ '/tcp') in (firewalld_ports.stdout | default(''))
            )
            else (
              '🎯 NODO AFECTADO / CULPABLE: Firewalld está ACTIVO pero el puerto ' ~ target_port ~ '/tcp NO está permitido.'
              if (firewalld_status.stdout == 'active')
              else 'ℹ️ Firewalld está inactivo.'
            )
          }}

    # ------------------------------------------------------------
    # 4. INFORME ESTRUCTURADO EN PANTALLA
    # ------------------------------------------------------------
    - name: "=== INFORME DE TRIAJE DE RED Y FIREWALL ==="
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════════════════════╗"
          - "║  INFORME DE RED / FIREWALL - {{ ansible_hostname }}"
          - "╚══════════════════════════════════════════════════════════╝"
          - ""
          - "⚙️ ESTADO DEL SERVICIO SYSTEMD ({{ target_service }}):"
          - "State: {{ service_status.status.ActiveState | default('N/A') }}"
          - ""
          - "🔌 PUERTO LOCAL (ss -tulpn):"
          - "{{ port_listening.stdout }}"
          - ""
          - "🌐 RESPUESTA LOCAL (curl 127.0.0.1:{{ target_port }}):"
          - "HTTP Code: {{ local_curl.stdout }}"
          - ""
          - "🛡️ ESTADO DE FIREWALLD:"
          - "Status: {{ firewalld_status.stdout }}"
          - "Puertos abiertos: {{ firewalld_ports.stdout | default('Ninguno') }}"
          - "Servicios abiertos: {{ firewalld_services.stdout | default('Ninguno') }}"
          - ""
          - "────────────────────────────────────────────────────────────"
          - "🔍 DIAGNÓSTICO RÁPIDO:"
          - "{{ diag_service }}"
          - "{{ diag_socket }}"
          - "{{ diag_firewall }}"
          - "=========================================================="
