---
- name: "INC-002: Remediation for /var/log/app-metrics disk full"
  hosts: all
  become: true  # Equivale a usar 'sudo' en la CLI

  tasks:
    # -------------------------------------------------------------
    # 1. LIMPIEZA INICIAL DE ARCHIVOS LENTOS / PESADOS
    # -------------------------------------------------------------
    - name: Remove static legacy log file if present
      ansible.builtin.file:
        path: /var/log/app-metrics/legacy-debug.log.1.gz
        state: absent

    - name: Truncate oversized metrics log file
      ansible.builtin.command:
        cmd: truncate -s 0 /var/log/app-metrics/metrics.log
      register: truncate_result
      changed_when: truncate_result.rc == 0

    # -------------------------------------------------------------
    # 2. SOLUCIÓN PERMANENTE: LOGROTATE
    # -------------------------------------------------------------
    - name: Create logrotate policy for app-metrics
      ansible.builtin.copy:
        dest: /etc/logrotate.d/app-metrics
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/log/app-metrics/metrics.log {
              size 50M
              rotate 4
              copytruncate
              compress
              delaycompress
              missingok
              notifempty
          }

    - name: Force test run of logrotate configuration
      ansible.builtin.command:
        cmd: logrotate --force /etc/logrotate.d/app-metrics
      register: logrotate_test
      changed_when: logrotate_test.rc == 0

    # -------------------------------------------------------------
    # 3. GARANTIZAR EL SERVICIO AFECTADO
    # -------------------------------------------------------------
    - name: Ensure app-metrics service is running and enabled
      ansible.builtin.systemd:
        name: app-metrics.service
        state: started
        enabled: true

    # -------------------------------------------------------------
    # 4. CAPTURAR DATOS DE AUDITORÍA
    # -------------------------------------------------------------
    - name: Check partition usage after remediation
      ansible.builtin.shell:
        cmd: df -h /var/log/app-metrics | tail -n 1
      register: disk_status
      changed_when: false

    - name: Check status of app-metrics service
      ansible.builtin.command:
        cmd: systemctl is-active app-metrics.service
      register: service_status
      changed_when: false

    # -------------------------------------------------------------
    # 5. GUARDAR INFORME DE AUDITORÍA EN UN ARCHIVO .TXT
    # -------------------------------------------------------------
    - name: Guardar informe de remediación en /var/log/remediation_inc002.txt
      ansible.builtin.copy:
        dest: "/var/log/remediation_inc002.txt"
        owner: root
        group: root
        mode: '0644'
        content: |
          ==========================================================
                    INFORME DE REMEDIACIÓN - INCIDENTE #02
                    Fecha: {{ ansible_date_time.iso8601 }}
          ==========================================================
          1. FALSA ALERTA: Archivo estático legacy-debug.log.1.gz auditado/eliminado.
          2. LIMPIEZA INICIAL: /var/log/app-metrics/metrics.log truncado a 0 bytes.
          3. PERSISTENCIA: Regla /etc/logrotate.d/app-metrics desplegada (size 50M, copytruncate).
          4. ESTADO DE ESPACIO:
             {{ disk_status.stdout }}
          5. ESTADO SYSTEMD: app-metrics.service está {{ service_status.stdout | upper }}
          ==========================================================
          RESULTADO FINAL: SERVICIO Y ALMACENAMIENTO OPERATIVOS Y SATISFACTORIOS
          ==========================================================
