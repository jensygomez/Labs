---
- name: INC-004 - SSH Permission Audit & Remediation
  hosts: fleet
  become: true
  gather_facts: false

  vars:
    ssh_permissions:
      - path: /home/appuser
        owner: appuser
        group: appuser
        mode: "0755"

      - path: /home/appuser/.ssh
        owner: appuser
        group: appuser
        mode: "0700"

      - path: /home/appuser/.ssh/authorized_keys
        owner: appuser
        group: appuser
        mode: "0600"

  tasks:

    - name: Verify Ansible connectivity
      ansible.builtin.ping:

    - name: Audit SSH permission structure
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ ssh_permissions }}"
      register: ssh_permission_audit

    - name: Show audit report
      ansible.builtin.debug:
        msg: |
          Host: {{ inventory_hostname }}
          Path: {{ item.item.path }}
          Owner: {{ item.stat.pw_name }}
          Group: {{ item.stat.gr_name }}
          Current Mode: {{ item.stat.mode }}
          Expected Mode: {{ item.item.mode }}
          Status: {{ 'OK' if item.stat.mode == item.item.mode else 'REMEDIATION REQUIRED' }}
      loop: "{{ ssh_permission_audit.results }}"

    - name: Remediate incorrect SSH permissions
      ansible.builtin.file:
        path: "{{ item.item.path }}"
        owner: "{{ item.item.owner }}"
        group: "{{ item.item.group }}"
        mode: "{{ item.item.mode }}"
      loop: "{{ ssh_permission_audit.results }}"
      when: >
        item.stat.mode != item.item.mode or
        item.stat.pw_name != item.item.owner or
        item.stat.gr_name != item.item.group
