---
- name: Remediar Incidente #02 - Runaway Writer (Centralized NFS log partition full)
  hosts: fleet
  become: true
  tasks:
    # -------------------------------------------------------------
    # 1. ASEGURAR EL SCRIPT DE ESCRITURA CORRECTO (detecta Y corrige)
    # -------------------------------------------------------------
    - name: Asegurar que app-metrics-writer.sh tenga el contenido correcto (no-debug)
      ansible.builtin.copy:
        dest: /usr/local/bin/app-metrics-writer.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          while true; do
            echo "[$(date -Iseconds)] metric_sample cpu=$(shuf -i 1-100 -n1) mem=$(shuf -i 1-100 -n1)" >> /var/log/app-metrics/metrics.log
            sleep 5
          done
      register: writer_fix

    # -------------------------------------------------------------
    # 2. REINICIAR EL SERVICIO SOLO SI EL SCRIPT REALMENTE CAMBIO
    # -------------------------------------------------------------
    - name: Recargar systemd (por si acaso) antes de reiniciar
      ansible.builtin.systemd:
        daemon_reload: true
      when: writer_fix.changed

    - name: Reiniciar app-metrics.service si el writer fue corregido
      ansible.builtin.systemd:
        name: app-metrics.service
        state: restarted
        enabled: true
      when: writer_fix.changed

    # -------------------------------------------------------------
    # 3. FIX PERMANENTE: logrotate para evitar que esto vuelva a pasar
    # -------------------------------------------------------------
    - name: Instalar configuracion de logrotate para metrics.log
      ansible.builtin.copy:
        dest: /etc/logrotate.d/app-metrics
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/log/app-metrics/metrics.log {
              size 50M
              rotate 3
              compress
              missingok
              notifempty
              copytruncate
          }
      register: logrotate_fix

    # -------------------------------------------------------------
    # 4. RECOLECTAR DATOS ACTUALES PARA EL INFORME
    # -------------------------------------------------------------
    - name: Consultar estado actual de app-metrics para el informe
      ansible.builtin.command: systemctl is-active app-metrics.service
      register: app_status
      failed_when: false
      changed_when: false

    - name: Consultar uso actual del punto de montaje /var/log/app-metrics
      ansible.builtin.shell:
        cmd: df -h --output=used,size,pcent /var/log/app-metrics | tail -n1
      register: disk_status
      failed_when: false
      changed_when: false

    - name: Consultar tamaño actual de metrics.log
      ansible.builtin.stat:
        path: /var/log/app-metrics/metrics.log
      register: metrics_file_stat

    # -------------------------------------------------------------
    # 5. MOSTRAR INFORME DIRECTAMENTE EN PANTALLA
    # -------------------------------------------------------------
    - name: Mostrar informe de remediación
      ansible.builtin.debug:
        msg: "{{ informe.split('\n') }}"
      vars:
        informe: |
          ==========================================================
                          INFORME DE REMEDIACIÓN - INCIDENTE #02
                          Fecha: {{ ansible_date_time.iso8601 }}
                          Nodo: {{ inventory_hostname }}
          ==========================================================
          1. FALSA ALERTA: legacy-debug.log.1.gz -- descartado
          2. WRITER: app-metrics-writer.sh corregido a versión normal.
             Cambio aplicado en este nodo: {{ writer_fix.changed }}
          3. LOGROTATE: configuración preventiva instalada/verificada.
             Cambio aplicado en este nodo: {{ logrotate_fix.changed }}
          4. ESTADO SYSTEMD: app-metrics está {{ app_status.stdout | upper }}
          5. USO DE DISCO (/var/log/app-metrics): {{ disk_status.stdout | trim }}
          6. TAMAÑO ACTUAL DE metrics.log: {{ ((metrics_file_stat.stat.size | default(0)) / 1024) | round(1) }} KB
          ==========================================================
          RESULTADO FINAL: FLOTA OPERATIVA, ESCRITURA NORMALIZADA
          ==========================================================
