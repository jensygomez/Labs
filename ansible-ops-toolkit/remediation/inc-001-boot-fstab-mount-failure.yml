---
- name: Remediar Incidente #01 - Ghost Reboot (Storage & Service Recovery)
  hosts: fleet
  become: true
  tasks:
    # -------------------------------------------------------------
    # 1. IDENTIFICAR Y DESCARTAR LA FALSA ALERTA (legacy-daemon)
    # -------------------------------------------------------------
    - name: Deshabilitar y detener el servicio falso (legacy-daemon)
      ansible.builtin.systemd:
        name: legacy-daemon.service
        state: stopped
        enabled: false

    # -------------------------------------------------------------
    # 2. ASEGURAR LA RUTA CORRECTA PARA /data (detecta Y corrige)
    # -------------------------------------------------------------
    - name: Asegurar que /etc/fstab tenga la linea NFS correcta para /data
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '.*:/srv/nfs/appdata\s+/data\s+nfs.*'
        line: "192.168.122.14:/srv/nfs/appdata /data nfs defaults,_netdev,x-systemd.automount,x-systemd.mount-timeout=15 0 0"
        state: present
      register: fstab_fix

    - name: Montar /data si la entrada de fstab cambio
      ansible.builtin.command: mount -a
      when: fstab_fix.changed
      register: mount_result
      changed_when: false

    # -------------------------------------------------------------
    # 3. RECARGAR SYSTEMD Y RESTAURAR EL SERVICIO PRINCIPAL
    #    (solo si el fstab realmente cambio en este nodo)
    # -------------------------------------------------------------
    - name: Forzar recarga de daemon de systemd para actualizar los mountpoints
      ansible.builtin.systemd:
        daemon_reload: true
      when: fstab_fix.changed

    - name: Iniciar y habilitar de forma persistente el servicio app-backend
      ansible.builtin.systemd:
        name: app-backend.service
        state: restarted
        enabled: true
      when: fstab_fix.changed

    # -------------------------------------------------------------
    # 4. RECOLECTAR DATOS ACTUALES PARA EL INFORME
    # -------------------------------------------------------------
    - name: Consultar estado actual de app-backend para el informe
      ansible.builtin.command: systemctl is-active app-backend.service
      register: app_status
      failed_when: false
      changed_when: false

    - name: Consultar contenido de /data/status para el informe
      ansible.builtin.command: cat /data/status
      register: app_file_status
      failed_when: false
      changed_when: false

    # -------------------------------------------------------------
    # 5. GUARDAR INFORME DE AUDITORÍA EN UN ARCHIVO .TXT
    # -------------------------------------------------------------
    - name: Guardar informe de remediación en /var/log/remediation_inc001.txt
      ansible.builtin.copy:
        dest: "/var/log/remediation_inc001.txt"
        content: |
          ==========================================================
                 INFORME DE REMEDIACIÓN - INCIDENTE #01
                 Fecha: {{ ansible_date_time.iso8601 }}
                 Nodo: {{ inventory_hostname }}
          ==========================================================
          1. ALERTA FALSA: legacy-daemon.service detenido.
          2. PERSISTENCIA: /etc/fstab -> 192.168.122.14:/srv/nfs/appdata
             Cambio aplicado en este nodo: {{ fstab_fix.changed }}
          3. ALMACENAMIENTO: Punto de montaje /data activo.
          4. ESTADO SYSTEMD: app-backend está {{ app_status.stdout | upper }}
          5. LOG DE LA APP:
          {{ app_file_status.stdout }}
          ==========================================================
          RESULTADO FINAL: APLICACIÓN OPERATIVA Y SATISFACTORIA
          ==========================================================
