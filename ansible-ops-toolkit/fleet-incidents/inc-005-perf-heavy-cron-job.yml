# -*- mode: ruby -*-
# vi: set ft=ruby :
# INC-005: The Cron Storm (Overlapping heavy background jobs)
# Topology: node01/02/03 = app fleet | node04 = backup storage (NFS)
# DO NOT open this file line-by-line before finishing triage if you want
# to practice cold diagnostics -- the affected node and root cause are
# hardcoded below, marked. Always start from the ticket.

IP = {
  "node01" => "192.168.122.11",
  "node02" => "192.168.122.12",
  "node03" => "192.168.122.13",
  "node04" => "192.168.122.14",
}

STORAGE_IP = IP["node04"]
STORAGE_EXPORT = "/srv/nfs/backups"

Vagrant.configure("2") do |config|

  # ============================================================
  # INYECTAR TU CLAVE SSH EN TODAS LAS VMs
  # ============================================================
  public_key = File.read(File.expand_path("~/.ssh/id_ed25519.pub")).strip
  config.vm.provision "shell", privileged: false, inline: <<-SHELL
    echo "#{public_key}" >> /home/vagrant/.ssh/authorized_keys
    chmod 600 /home/vagrant/.ssh/authorized_keys
  SHELL

  # ============================================================
  # GLOBAL PROVISIONING -- Minimal, only what's functionally required
  # ============================================================
  config.vm.provision "shell", privileged: true, inline: <<-SHELL
    echo "Installing base utilities (cron, nfs, compression)..."
    dnf install -y nfs-utils cronie tar gzip
    systemctl enable --now crond
  SHELL

  # ============================================================
  # NODE04 -- Backup storage, exports a dedicated volume
  # ============================================================
  config.vm.define "node04" do |n|
    n.vm.box = "almalinux/9"
    n.vm.hostname = "node04"
    n.vm.network "private_network",
      ip: IP["node04"], libvirt__network_name: "mgmt-net", libvirt__dhcp_enabled: false
    n.vm.provider "libvirt" do |lv|
      lv.memory = 1024
      lv.cpus = 1
      lv.driver = "kvm"
    end

    n.vm.provision "shell", privileged: true, inline: <<-SHELL
      echo "==> node04: setting up centralized backup storage..."
      dnf install -y nfs-utils
      mkdir -p #{STORAGE_EXPORT}
      chown -R nobody:nobody #{STORAGE_EXPORT}
      chmod -R 777 #{STORAGE_EXPORT}
      
      echo "#{STORAGE_EXPORT} 192.168.122.0/24(rw,sync,no_subtree_check,no_root_squash)" > /etc/exports
      systemctl enable --now rpcbind
      exportfs -ra
      systemctl enable --now nfs-server
      
      if systemctl is-active --quiet firewalld; then
        firewall-cmd --permanent --add-service=nfs --add-service=rpc-bind --add-service=mountd
        firewall-cmd --reload
      fi
      echo "==> node04 ready. Export:"
      exportfs -v
    SHELL
  end

  # ============================================================
  # FLEET: node01, node02, node03 -- Identical baseline
  # ============================================================
  ["node01", "node02", "node03"].each do |node|
    config.vm.define node do |n|
      n.vm.box = "almalinux/9"
      n.vm.hostname = node
      n.vm.network "private_network",
        ip: IP[node], libvirt__network_name: "mgmt-net", libvirt__dhcp_enabled: false
      n.vm.provider "libvirt" do |lv|
        lv.memory = 1024
        lv.cpus = 1
        lv.driver = "kvm"
      end

      n.vm.provision "shell", privileged: true, inline: <<-SHELL
        echo "==> #{node}: waiting for node04 NFS export..."
        RETRY=0
        until showmount -e #{STORAGE_IP} 2>/dev/null | grep -q "#{STORAGE_EXPORT}"; do
          RETRY=$((RETRY + 1))
          if [ "$RETRY" -ge 30 ]; then
            echo "FATAL: node04 did not respond in time" >&2
            exit 1
          fi
          sleep 5
        done
        
        mkdir -p /mnt/backups
        echo "#{STORAGE_IP}:#{STORAGE_EXPORT} /mnt/backups nfs defaults,_netdev,x-systemd.automount,x-systemd.mount-timeout=15 0 0" >> /etc/fstab
        mount -a
        
        # Create dummy app log generator to simulate production logs
        mkdir -p /var/log/app
        cat > /usr/local/bin/app-log-gen.sh <<-'LOGGEN'
#!/bin/bash
while true; do
  echo "[$(date -Iseconds)] INFO: Request processed successfully user_id=$(shuf -i 1000-9999 -n1)" >> /var/log/app/access.log
  sleep 2
done
LOGGEN
        chmod +x /usr/local/bin/app-log-gen.sh
        
        cat > /etc/systemd/system/app-log-gen.service <<-'UNIT'
[Unit]
Description=App Log Generator
[Service]
Type=simple
ExecStart=/usr/local/bin/app-log-gen.sh
Restart=always
[Install]
WantedBy=multi-user.target
UNIT
        systemctl daemon-reload
        systemctl enable --now app-log-gen.service
        
        # Pre-generate some historical logs so the backup has something heavy to compress
        for i in {1..5}; do
          dd if=/dev/urandom of=/var/log/app/historical-$i.log bs=1M count=10 status=none
        done

        # Normal backup script (runs fast, uses lockfile)
        cat > /usr/local/bin/nightly-backup.sh <<-'BACKUP'
#!/bin/bash
LOCKFILE=/tmp/backup.lock
if [ -f "$LOCKFILE" ]; then
  echo "Backup already running, exiting."
  exit 0
fi
touch $LOCKFILE
trap "rm -f $LOCKFILE" EXIT

echo "[$(date)] Starting nightly backup..."
# Simulate heavy processing/compression
tar -czf /mnt/backups/backup-$(hostname)-$(date +%Y%m%d%H%M%S).tar.gz /var/log/app/ 2>/dev/null
echo "[$(date)] Backup complete."
BACKUP
        chmod +x /usr/local/bin/nightly-backup.sh

        # Normal cron job: Runs at 2:00 AM daily
        echo "0 2 * * * root /usr/local/bin/nightly-backup.sh" > /etc/cron.d/nightly-backup
        chmod 644 /etc/cron.d/nightly-backup
        
        echo "==> #{node}: baseline complete."
      SHELL

      # Ticket lives on every fleet node
      n.vm.provision "shell", privileged: false, inline: <<-SHELL
        cat > ~/TICKET_INC-005.txt <<-'TICKET'
======================================================================
INC-005 - INCIDENT - P2
REPORTED BY: Datadog / System Health Monitor          TIME: 03:30 AM
SUMMARY: High CPU/IO Load causing application timeouts on one fleet node
DESCRIPTION:
Automated alert: One of the application nodes in the fleet (node01/02/03)
is experiencing severe performance degradation. Load average is spiking
above 15.0, and disk I/O wait is critically high. The application's
health check endpoint is timing out, causing the load balancer to 
periodically drop the node from the active pool.

NOTES FROM PREVIOUS SHIFT (L1 night):
"I logged into the nodes and saw that one node had massive CPU and iowait.
I checked the app logs in /var/log/app and noticed they were growing, so 
I assumed the app was stuck in a logging loop or doing full table scans. 
I restarted the app-log-gen service and cleared out the old log files to 
free up I/O. The load dropped temporarily, but 10 minutes later the 
exact same spike happened. I suspect the application code has a memory 
leak or a bad query that triggers under load. Leaving for day shift."

CLIENT IMPACT: Intermittent 504 Gateway Timeouts for end users.

RESOLUTION CRITERIA:
1. Identify and discard the false negative (the app logging loop theory).
2. Isolate which specific node is experiencing the load spike.
3. Diagnose the root cause of the CPU/IO storm (look at process trees, 
   cron schedules, and overlapping executions).
4. Fix the scheduling/execution logic to prevent resource starvation.
5. Automate the audit and fix as an idempotent Ansible playbook.
======================================================================
TICKET
        echo "Ticket available at ~/TICKET_INC-005.txt"
      SHELL
    end
  end

  # ============================================================
  # ROOT CAUSE -- ONLY on the chosen node. DO NOT READ if you want
  # to practice cold diagnostics.
  # Affected node: node03
  # Fault: The nightly backup cron job was accidentally modified to 
  # run every minute (* * * * *) instead of daily. Furthermore, the 
  # backup script was modified by a previous admin to remove the 
  # lockfile check and added a 'sleep 120' to simulate a slow network 
  # write, causing overlapping instances that quickly consume all CPU/IO.
  # ============================================================
  config.vm.define "node03" do |n|
    n.vm.provision "shell", privileged: true, inline: <<-SHELL
      echo "[FAULT] Injecting INC-005 cron storm on node03..."
      
      # 1. Break the backup script: remove lockfile, add artificial delay
      cat > /usr/local/bin/nightly-backup.sh <<-'BROKEN_BACKUP'
#!/bin/bash
# Lockfile removed by previous admin to "fix" a skipped backup issue
echo "[$(date)] Starting nightly backup..."
# Simulate slow NFS write / heavy processing
sleep 120 
tar -czf /mnt/backups/backup-$(hostname)-$(date +%Y%m%d%H%M%S).tar.gz /var/log/app/ 2>/dev/null
echo "[$(date)] Backup complete."
BROKEN_BACKUP
      chmod +x /usr/local/bin/nightly-backup.sh

      # 2. Break the cron schedule: run every minute
      echo "* * * * * root /usr/local/bin/nightly-backup.sh" > /etc/cron.d/nightly-backup
      chmod 644 /etc/cron.d/nightly-backup
      
      # Restart cron to pick up changes immediately
      systemctl restart crond

      # Re-injection script for Phase 2 idempotency testing
      cat > /home/vagrant/break-cron-storm.sh <<-'BREAK'
#!/bin/bash
set -e
echo "Re-injecting INC-005 (cron storm on $(hostname))..."

# Kill any existing backup processes to reset state
pkill -f nightly-backup.sh || true
pkill -f "tar -czf" || true
rm -f /tmp/backup.lock

# Re-break the script
cat > /usr/local/bin/nightly-backup.sh <<-'BROKEN_BACKUP'
#!/bin/bash
echo "[$(date)] Starting nightly backup..."
sleep 120 
tar -czf /mnt/backups/backup-$(hostname)-$(date +%Y%m%d%H%M%S).tar.gz /var/log/app/ 2>/dev/null
echo "[$(date)] Backup complete."
BROKEN_BACKUP
chmod +x /usr/local/bin/nightly-backup.sh

# Re-break the cron
echo "* * * * * root /usr/local/bin/nightly-backup.sh" > /etc/cron.d/nightly-backup
chmod 644 /etc/cron.d/nightly-backup
systemctl restart crond

echo "Incident re-injected. Wait ~2 minutes for the storm to build, then run your Ansible playbook."
BREAK
      chmod +x /home/vagrant/break-cron-storm.sh
      chown vagrant:vagrant /home/vagrant/break-cron-storm.sh
      
      echo "[FAULT] Ready. Cron storm will initiate on the next minute mark."
    SHELL
  end

end
