# -*- mode: ruby -*-
# vi: set ft=ruby :

# INC-002: The Runaway Writer (Centralized NFS log partition full)
# Topology: node01/02/03 = app fleet | node04 = centralized log storage (NFS)
# DO NOT open this file line-by-line before finishing triage if you want 
# to practice cold diagnostics -- the affected node and root cause are 
# hardcoded below, marked. Always start from the ticket.

IP = {
  "node01" => "192.168.122.11",
  "node02" => "192.168.122.12",
  "node03" => "192.168.122.13",
  "node04" => "192.168.122.14",
}

STORAGE_IP = IP["node04"]
STORAGE_EXPORT = "/srv/nfs/app-logs"

Vagrant.configure("2") do |config|

  # ============================================================
  # GLOBAL PROVISIONING -- Minimal, only what's functionally required
  # ============================================================
  config.vm.provision "shell", privileged: true, inline: <<-SHELL
    echo "Installing base NFS client tools..."
    dnf install -y nfs-utils
  SHELL

  # ============================================================
  # NODE04 -- Centralized log storage, exports a dedicated 500MB volume
  # ============================================================
  config.vm.define "node04" do |n|
    n.vm.box = "almalinux/9"
    n.vm.hostname = "node04"
    n.vm.network "private_network",
      ip: IP["node04"], libvirt__network_name: "mgmt-net", libvirt__dhcp_enabled: false
    n.vm.provider "libvirt" do |lv|
      lv.memory = 1024
      lv.cpus = 1
      lv.driver = "kvm"
    end

    n.vm.provision "shell", privileged: true, inline: <<-SHELL
      echo "==> node04: setting up centralized log storage..."
      dnf install -y nfs-utils

      # Create a dedicated 500MB loopback device for the log export
      # to simulate a strictly sized remote partition
      dd if=/dev/zero of=/var/log-storage.img bs=1M count=500 status=none
      mkfs.ext4 -F /var/log-storage.img
      
      mkdir -p #{STORAGE_EXPORT}
      mount -o loop /var/log-storage.img #{STORAGE_EXPORT}
      echo "/var/log-storage.img #{STORAGE_EXPORT} ext4 loop,defaults 0 0" >> /etc/fstab

      # Pre-populate the FALSE NEGATIVE: a large, static, compressed legacy log
      dd if=/dev/urandom of=#{STORAGE_EXPORT}/legacy-debug.log.1.gz bs=1M count=150 status=none
      
      chown -R nobody:nobody #{STORAGE_EXPORT}
      chmod -R 777 #{STORAGE_EXPORT}

      echo "#{STORAGE_EXPORT} 192.168.122.0/24(rw,sync,no_subtree_check,no_root_squash)" > /etc/exports
      systemctl enable --now rpcbind
      exportfs -ra
      systemctl enable --now nfs-server

      if systemctl is-active --quiet firewalld; then
        firewall-cmd --permanent --add-service=nfs --add-service=rpc-bind --add-service=mountd
        firewall-cmd --reload
      fi
      echo "==> node04 ready. Export:"
      exportfs -v
    SHELL
  end

  # ============================================================
  # FLEET: node01, node02, node03 -- Identical baseline
  # ============================================================
  ["node01", "node02", "node03"].each do |node|
    config.vm.define node do |n|
      n.vm.box = "almalinux/9"
      n.vm.hostname = node
      n.vm.network "private_network",
        ip: IP[node], libvirt__network_name: "mgmt-net", libvirt__dhcp_enabled: false
      n.vm.provider "libvirt" do |lv|
        lv.memory = 1024
        lv.cpus = 1
        lv.driver = "kvm"
      end

      n.vm.provision "shell", privileged: true, inline: <<-SHELL
        echo "==> #{node}: waiting for node04 NFS export..."
        RETRY=0
        until showmount -e #{STORAGE_IP} 2>/dev/null | grep -q "#{STORAGE_EXPORT}"; do
          RETRY=$((RETRY + 1))
          if [ "$RETRY" -ge 30 ]; then
            echo "FATAL: node04 did not respond in time" >&2
            exit 1
          fi
          sleep 5
        done

        mkdir -p /var/log/app-metrics
        echo "#{STORAGE_IP}:#{STORAGE_EXPORT} /var/log/app-metrics nfs defaults,_netdev,x-systemd.automount,x-systemd.mount-timeout=15 0 0" >> /etc/fstab
        mount -a

        # Normal app-metrics writer (1 line every 5 seconds)
        cat > /usr/local/bin/app-metrics-writer.sh <<-'WRITER'
#!/bin/bash
while true; do
  echo "[$(date -Iseconds)] metric_sample cpu=$(shuf -i 1-100 -n1) mem=$(shuf -i 1-100 -n1)" >> /var/log/app-metrics/metrics.log
  sleep 5
done
WRITER
        chmod +x /usr/local/bin/app-metrics-writer.sh

        cat > /etc/systemd/system/app-metrics.service <<-'UNIT'
[Unit]
Description=App Metrics Collector
RequiresMountsFor=/var/log/app-metrics
After=remote-fs.target network-online.target
Wants=network-online.target
StartLimitIntervalSec=60
StartLimitBurst=3

[Service]
Type=simple
ExecStart=/usr/local/bin/app-metrics-writer.sh
Restart=on-failure
RestartSec=5

[Install]
WantedBy=multi-user.target
UNIT
        systemctl daemon-reload
        systemctl enable --now app-metrics.service
        echo "==> #{node}: baseline complete."
      SHELL

      # Ticket lives on every fleet node
      n.vm.provision "shell", privileged: false, inline: <<-SHELL
        cat > ~/TICKET_INC-002.txt <<-'TICKET'
======================================================================
INC-002 - INCIDENT - P2
REPORTED BY: PagerDuty via Prometheus Node Exporter    TIME: 02:45 AM
SUMMARY: Centralized log partition 100% full, fleet nodes reporting write errors
DESCRIPTION:
Automated alert: The centralized log partition /var/log/app-metrics 
(backed by NFS export on node04) has reached 100% capacity. All three 
fleet nodes (node01/02/03) are reporting "No space left on device" 
errors in their application logs. The metrics collection pipeline is 
stalled, causing blind spots in our monitoring dashboard.

NOTES FROM PREVIOUS SHIFT (L1 night):
"Logged into node04 and saw the NFS share was completely full. Noticed 
a massive file called 'legacy-debug.log.1.gz' (150MB) sitting there. 
I deleted it, which freed up space, but the disk filled up again within 
15 minutes. I assumed the app was aggressively recreating it or there's 
a runaway process writing to it. Didn't have time to trace the actual 
writer across the fleet. Leaving ticket open for day shift."

CLIENT IMPACT: Monitoring blind spots, delayed alerting for production issues.

RESOLUTION CRITERIA:
1. Identify and discard the false negative (the static legacy log).
2. Identify the actual source of the rapid disk fill (which node/process).
3. Stop the runaway logging and restore normal write operations.
4. Implement a permanent fix (logrotate on the centralized share) to 
   prevent future fills.
5. Automate the fix as an idempotent Ansible playbook that does not 
   affect healthy nodes.
======================================================================
TICKET
        echo "Ticket available at ~/TICKET_INC-002.txt"
      SHELL
    end
  end

  # ============================================================
  # ROOT CAUSE -- ONLY on the chosen node. DO NOT READ if you want
  # to practice cold diagnostics.
  # Affected node: node02
  # Fault: The app-metrics-writer.sh was accidentally left in DEBUG 
  # mode, writing massive payloads every 0.05s instead of normal 
  # metrics every 5s, rapidly filling the remote NFS share.
  # ============================================================
  config.vm.define "node02" do |n|
    n.vm.provision "shell", privileged: true, inline: <<-SHELL
      echo "[FAULT] Injecting INC-002 runaway writer on node02..."
      
      # Overwrite the normal writer with the DEBUG mode writer
      cat > /usr/local/bin/app-metrics-writer.sh <<-'DEBUGWRITER'
#!/bin/bash
while true; do
  echo "[$(date -Iseconds)] DEBUG metric_sample cpu=$(shuf -i 1-100 -n1) mem=$(shuf -i 1-100 -n1) extra_data=$(head -c 500 /dev/urandom | base64)" >> /var/log/app-metrics/metrics.log
  sleep 0.05
done
DEBUGWRITER
      chmod +x /usr/local/bin/app-metrics-writer.sh
      
      systemctl restart app-metrics.service

      # Re-injection script for Phase 2 idempotency testing
      cat > /home/vagrant/break-diskfull.sh <<-'BREAK'
#!/bin/bash
set -e
echo "Re-injecting INC-002 (runaway debug logging on $(hostname))..."

systemctl stop app-metrics.service 2>/dev/null || true

cat > /usr/local/bin/app-metrics-writer.sh <<-'DEBUGWRITER'
#!/bin/bash
while true; do
  echo "[$(date -Iseconds)] DEBUG metric_sample cpu=$(shuf -i 1-100 -n1) mem=$(shuf -i 1-100 -n1) extra_data=$(head -c 500 /dev/urandom | base64)" >> /var/log/app-metrics/metrics.log
  sleep 0.05
done
DEBUGWRITER
chmod +x /usr/local/bin/app-metrics-writer.sh

# Clear existing logs to simulate a fresh fill
rm -f /var/log/app-metrics/metrics.log*
rm -f /etc/logrotate.d/app-metrics

systemctl start app-metrics.service
echo "Incident re-injected. Run your Ansible playbook, then validate."
BREAK
      chmod +x /home/vagrant/break-diskfull.sh
      chown vagrant:vagrant /home/vagrant/break-diskfull.sh
      
      echo "[FAULT] Ready."
    SHELL
  end

end
