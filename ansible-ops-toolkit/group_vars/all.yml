---
# group_vars/all.yml
#
# Applies to every lab, every incident, no per-lab editing required.
# Works because every lab's Vagrantfile injects Jensy's own personal
# SSH public key (~/.ssh/id_ed25519.pub) into each VM's
# authorized_keys during provisioning -- so the SAME private key
# authenticates against every lab, regardless of which inc-XXX it is.
#
# This replaces the old approach of pointing at Vagrant's per-VM
# auto-generated key under .vagrant/machines/<node>/libvirt/private_key,
# which required regenerating the inventory for every single lab.

ansible_user: vagrant
ansible_port: 22
ansible_ssh_private_key_file: ~/.ssh/id_ed25519
ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
