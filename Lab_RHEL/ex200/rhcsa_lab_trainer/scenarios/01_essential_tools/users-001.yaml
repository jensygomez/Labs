id: users-001
name: Gestión de usuarios y grupos
module: Essential Tools
type: dynamic
description: 'Ejercicio dinámico RHCSA: Gestión de usuarios y grupos'
points: 150
repetitions_required: 18
globals:
  nombre:
  - ana
  - carlos
  - Laura
  - Maria
  - Pedro
  - Sofia
  - Jose
  apellido:
  - Gomez
  - Rodriguez
  - Fernandez
  - Martinez
  - Sanchez
  Departamento:
  - IT
  - HR
  - Aadmin
  - Finance
  grupo:
  - Dev
  - HR
  - Wheel
  - Docker
scenarios:
- Crear los usuarios {{nombre}} {{apellido}} y {{nombre}} {{apellido}} del departamento {{Departamento}} con grupo secundario {{grupo}}
- 'El jefe de {{Departamento}} necesita 2 nuevos empleados: {{nombre}} {{apellido}} y {{nombre}} {{apellido}} con acceso al grupo {{grupo}}'
- Añadir los usuarios {{nombre}} {{apellido}} al grupo wheel con permiso sudo sin contraseña
- Crear usuario {{nombre}} {{apellido}} con caducidad de cuenta en 90 días y contraseña mínima de 12 caracteres
- Generar clave SSH para {{nombre}} {{apellido}} y colocarla en authorized_keys
levels:
  basic:
    repetitions: 4
    points_per_rep: 25
    pre_setup: []
    allowed_scenarios: [0, 1]
    validation:
      - "id {{nombre}}"
      - "getent group {{grupo}}"
  intermediate:
    repetitions: 6
    points_per_rep: 35
    pre_setup: ["userdel -r {{nombre}} 2>/dev/null || true"]
    allowed_scenarios: [0, 1, 2]
    validation:
      - "id {{nombre}}"
      - "groups {{nombre}} | grep {{grupo}}"
      - "getent passwd {{nombre}} | cut -d: -f6 | grep /home"
  advanced:
    repetitions: 8
    points_per_rep: 45
    pre_setup: ["useradd -m -G {{grupo}} {{nombre}}"]
    allowed_scenarios: [2, 3, 4]
    validation:
      - "sudo -l -U {{nombre}} | grep -q {{grupo}} || sudo -l -U {{nombre}} | grep NOPASSWD"
      - "chage -l {{nombre}} | grep '90'"
      - "test -d /home/{{nombre}}/.ssh && echo 'SSH OK'"
