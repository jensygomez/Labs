    validations:
      # Validación 1: /dev/loop16p1 ahora es un PV
      - command: "pvs /dev/loop16p1 --noheadings -o pv_name 2>/dev/null || echo 'NO_PV'"
        expected_output: "/dev/loop16p1"
        match_type: "exact"
        description: "/dev/loop16p1 convertido a Physical Volume"
