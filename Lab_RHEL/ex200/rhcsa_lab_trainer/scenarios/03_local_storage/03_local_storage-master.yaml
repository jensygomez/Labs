      # Validación 2: VG creado con el PV
      - command: "pvs /dev/loop16p1 --noheadings -o vg_name 2>/dev/null"
        expected_output: "vg_convertido"
        match_type: "contains"  # El nombre exacto puede variar
        description: "PV asignado a un Volume Group"
        weight: 3
      
      # Validación 3: LV creado con tamaño similar
      - command: "lvs --noheadings --units m -o lv_size 2>/dev/null | head -1 | awk '{print int(\$1)}' || echo '0'"
        expected_range:
          min: "1800"  # ~2GB
          max: "2200"
        match_type: "range_numeric"
        description: "LV creado con tamaño ~2GB"
        weight: 4
      
      # Validación 4: Nuevo punto de montaje /mnt/nuevo_legacy creado
      - command: "test -d /mnt/nuevo_legacy && echo 'DIR_EXISTE' || echo 'DIR_NO_EXISTE'"
        expected_output: "DIR_EXISTE"
        match_type: "exact"
        description: "Nuevo directorio de montaje /mnt/nuevo_legacy creado"
        weight: 3
      
      # Validación 5: Datos migrados (archivo data.bin presente)
      - command: "test -f /mnt/nuevo_legacy/data.bin && echo 'DATOS_MIGRADOS' || echo 'DATOS_FALTANTES'"
        expected_output: "DATOS_MIGRADOS"
        match_type: "exact"
        description: "Archivo data.bin migrado al nuevo filesystem"
        weight: 5
      
      # Validación 6: Tamaño del archivo preservado (~50MB)
