module: "3. Local Storage"
submodule: "3.2 Administración Lógica de Volúmenes (LVM)"
labs_count: 16
type: "static"
version: "2025.1"

labs:

  # ────────────────────────────────
  # LAB 001 — Crear Physical Volume
  # ────────────────────────────────
  - id: lab-lvm-001
    title: "Crear Physical Volume (PV)"
    subtitle: "Fundamentos iniciales de LVM"
    difficulty: 1
    points: 20
    repetitions_required: 5

    setup: |
      mkdir -p /root/disks
      dd if=/dev/zero of=/root/disks/loop1.img bs=1M count=2048
      losetup /dev/loop1 /root/disks/loop1.img
      wipefs -a /dev/loop1 || true

    scenario: |
      El servidor acaba de llegar del proveedor. El disco /dev/loop1 está totalmente limpio.
      El jefe solicita:
      "Convierte /dev/loop1 en un Physical Volume para preparar el almacenamiento."

    validations:
      # Validación 1: PV existe
      - command: "pvs /dev/loop1 --noheadings -o pv_name 2>/dev/null || echo 'NO_ES_PV'"
        expected_output: "/dev/loop1"
        match_type: "exact"
        description: "/dev/loop1 existe como Physical Volume"
        weight: 3
      
      # Validación 2: Tamaño aproximado 2GB
      - command: "pvs /dev/loop1 --noheadings --units m -o pv_size 2>/dev/null || echo '0'"
        expected_range:
          min: "1800"
          max: "2200"
        match_type: "range_numeric"
        description: "Tamaño aproximado 2GB (±100MB)"
        weight: 2
      
      # Validación 3: Formato LVM2
      - command: "pvs /dev/loop1 --noheadings -o pv_fmt 2>/dev/null || echo 'NO_FMT'"
        expected_output: "lvm2"
        match_type: "exact"
        description: "Formato LVM2 correcto"
        weight: 2
      
      # Validación 4: Estado válido
      - command: "pvs /dev/loop1 --noheadings -o pv_attr 2>/dev/null || echo 'NO_ATTR'"
        expected_values:
          - "---"
          - "a--"
        match_type: "in_list"
        description: "PV en estado válido (--- o a--)"
        weight: 1
      
      # Validación 5: No está en VG
      - command: "pvs /dev/loop1 --noheadings -o vg_name 2>/dev/null"
        expected_output: ""
        match_type: "exact"
        description: "PV no está en ningún Volume Group (aún)"
        weight: 2

  # ────────────────────────────────
  # LAB 002 — Crear VG con dos discos
  # ────────────────────────────────
  - id: lab-lvm-002
    title: "Crear Volume Group (VG) con 2 discos"
    subtitle: "Agrupación de almacenamiento"
    difficulty: 2
    points: 40
    repetitions_required: 5

    setup: |
      mkdir -p /root/disks
      dd if=/dev/zero of=/root/disks/loop2.img bs=1M count=2048
      losetup /dev/loop2 /root/disks/loop2.img
      wipefs -a /dev/loop2 || true
      dd if=/dev/zero of=/root/disks/loop3.img bs=1M count=2048
      losetup /dev/loop3 /root/disks/loop3.img
      wipefs -a /dev/loop3 || true

    scenario: |
      El sistema dispone de dos discos nuevos: /dev/loop2 y /dev/loop3.
      El jefe ordena:
      "Crea un Volume Group llamado vg_data usando ambos discos."

    validations:
      # Validación 1: VG existe
      - command: "vgs vg_data --noheadings -o vg_name 2>/dev/null || echo 'NO_VG'"
        expected_output: "vg_data"
        match_type: "exact"
        description: "Volume Group 'vg_data' existe"
        weight: 3
      
      # Validación 2: 2 PVs en VG
      - command: "vgs vg_data --noheadings -o pv_count 2>/dev/null || echo '0'"
        expected_output: "2"
        match_type: "exact"
        description: "VG tiene exactamente 2 PVs"
        weight: 4
      
      # Validación 3: Tamaño total ~4GB
      - command: "vgs vg_data --noheadings --units m -o vg_size 2>/dev/null || echo '0'"
        expected_range:
          min: "3500"
          max: "4500"
        match_type: "range_numeric"
        description: "Tamaño total ~4GB (2 discos de ~2GB)"
        weight: 2
      
      # Validación 4: /dev/loop2 en vg_data
      - command: "pvs /dev/loop2 --noheadings -o vg_name 2>/dev/null"
        expected_output: "vg_data"
        match_type: "exact"
        description: "/dev/loop2 está en vg_data"
        weight: 2
      
      # Validación 5: /dev/loop3 en vg_data
      - command: "pvs /dev/loop3 --noheadings -o vg_name 2>/dev/null"
        expected_output: "vg_data"
        match_type: "exact"
        description: "/dev/loop3 está en vg_data"
        weight: 2
      
      # Validación 6: VG activo
      - command: "vgs vg_data --noheadings -o vg_attr 2>/dev/null || echo 'NO_ATTR'"
        expected_output: "wz"
        match_type: "contains"
        description: "VG está activo (writable, resizeable)"
        weight: 1

  # ────────────────────────────────
  # LAB 003 — Crear LV dentro de un VG
  # ────────────────────────────────
  - id: lab-lvm-003
    title: "Crear Logical Volume (LV)"
    subtitle: "Administración básica de volúmenes"
    difficulty: 2
    points: 50
    repetitions_required: 5

    setup: |
      mkdir -p /root/disks
      dd if=/dev/zero of=/root/disks/loop4.img bs=1M count=2048
      losetup /dev/loop4 /root/disks/loop4.img
      wipefs -a /dev/loop4 || true
      dd if=/dev/zero of=/root/disks/loop5.img bs=1M count=2048
      losetup /dev/loop5 /root/disks/loop5.img
      wipefs -a /dev/loop5 || true
      pvcreate /dev/loop4
      pvcreate /dev/loop5
      vgcreate vg_apps /dev/loop4 /dev/loop5

    scenario: |
      Ya existe el Volume Group vg_apps con suficiente espacio disponible.
      El jefe pide:
      "Crea un Logical Volume llamado lv_home con tamaño 1G dentro del VG vg_apps."

    validations:
      # Validación 1: LV existe
      - command: "lvs vg_apps/lv_home --noheadings -o lv_name 2>/dev/null || echo 'NO_LV'"
        expected_output: "lv_home"
        match_type: "exact"
        description: "Logical Volume 'lv_home' existe"
        weight: 3
      
      # Validación 2: LV en VG correcto
      - command: "lvs vg_apps/lv_home --noheadings -o vg_name 2>/dev/null || echo 'NO_VG'"
        expected_output: "vg_apps"
        match_type: "exact"
        description: "lv_home está en el VG vg_apps"
        weight: 3
      
      # Validación 3: Tamaño ~1GB
      - command: "lvs vg_apps/lv_home --noheadings --units m -o lv_size 2>/dev/null || echo '0'"
        expected_range:
          min: "900"
          max: "1100"
        match_type: "range_numeric"
        description: "Tamaño aproximado 1GB (±50MB)"
        weight: 4
      
      # Validación 4: Estado del LV
      - command: "lvs vg_apps/lv_home --noheadings -o lv_attr 2>/dev/null || echo 'NO_ATTR'"
        expected_values:
          - "-wi-------"
          - "-wi-a-----"
          - "-wi-ao----"
        match_type: "in_list"
        description: "LV en estado válido"
        weight: 2
      
      # Validación 5: Dispositivo existe
      - command: "test -b /dev/vg_apps/lv_home && echo 'EXISTE' || echo 'NO_EXISTE'"
        expected_output: "EXISTE"
        match_type: "exact"
        description: "Dispositivo /dev/vg_apps/lv_home creado"
        weight: 2
      
      # Validación 6: Espacio libre disminuyó
      - command: "vgs vg_apps --noheadings --units m -o vg_free 2>/dev/null || echo '0'"
        expected_range:
          min: "2500"
          max: "3500"
        match_type: "range_numeric"
        description: "Espacio libre disminuyó apropiadamente (~1GB usado)"
        weight: 1

  # ────────────────────────────────
  # 📌 INTERMEDIO (4–11)
  # ────────────────────────────────

  # ────────────────────────────────
  # LAB 004 — Crear filesystem y montar permanentemente
  # ────────────────────────────────
  - id: lab-lvm-004
    title: "Crear filesystem y montar un LV"
    subtitle: "Creación de filesystem y persistencia"
    difficulty: 3
    points: 60
    repetitions_required: 5

    setup: |
      mkdir -p /root/disks
      dd if=/dev/zero of=/root/disks/loop6.img bs=1M count=2048
      losetup /dev/loop6 /root/disks/loop6.img
      wipefs -a /dev/loop6 || true
      dd if=/dev/zero of=/root/disks/loop7.img bs=1M count=2048
      losetup /dev/loop7 /root/disks/loop7.img
      wipefs -a /dev/loop7 || true
      pvcreate /dev/loop6
      pvcreate /dev/loop7
      vgcreate vg_storage /dev/loop6 /dev/loop7
      lvcreate -n lv_data -L 800M vg_storage

    scenario: |
      El LV lv_data existe dentro del VG vg_storage, pero aún no tiene filesystem.
      El jefe ordena:
      "Crea un filesystem ext4 y móntalo permanentemente en /mnt/data."

    validations:
      # Validación 1: Filesystem ext4 creado
      - command: "blkid -s TYPE -o value /dev/vg_storage/lv_data 2>/dev/null || echo 'NO_FS'"
        expected_output: "ext4"
        match_type: "exact"
        description: "Filesystem ext4 creado en el LV"
        weight: 3
      
      # Validación 2: Montado en /mnt/data
      - command: "mount | grep '/dev/mapper/vg_storage-lv_data' | grep '/mnt/data' && echo 'MONTADO' || echo 'NO_MONTADO'"
        expected_output: "MONTADO"
        match_type: "exact"
        description: "LV montado en /mnt/data"
        weight: 3
      
      # Validación 3: Espacio usado aprox 800MB
      - command: "df -B1M /mnt/data 2>/dev/null | tail -1 | awk '{print $2}' || echo '0'"
        expected_range:
          min: "750"  # 750MB
          max: "850"  # 850MB
        match_type: "range_numeric"
        description: "Tamaño del filesystem ~800MB"
        weight: 2
      
      # Validación 4: Entrada en /etc/fstab
      - command: "grep '/mnt/data' /etc/fstab | grep -q 'vg_storage' && echo 'EN_FSTAB' || echo 'NO_FSTAB'"
        expected_output: "EN_FSTAB"
        match_type: "exact"
        description: "Entrada correcta en /etc/fstab"
        weight: 4
      
      # Validación 5: Persistencia después de desmontar/remontar
      - command: "umount /mnt/data 2>/dev/null; mount -a 2>&1 | grep -q '/mnt/data' || echo 'OK'; mount | grep '/mnt/data' && echo 'PERSISTENTE' || echo 'NO_PERSISTENTE'"
        expected_output: "PERSISTENTE"
        match_type: "exact"
        description: "Montaje persistente (sobrevive a mount -a)"
        weight: 3


  # ────────────────────────────────
  # LAB 005 — Extender LV en caliente
  # ────────────────────────────────
  - id: lab-lvm-005
    title: "Extender Logical Volume en caliente"
    subtitle: "Administración dinámica de capacidad"
    difficulty: 4
    points: 70
    repetitions_required: 5

    setup: |
      mkdir -p /root/disks
      dd if=/dev/zero of=/root/disks/loop8.img bs=1M count=2048
      losetup /dev/loop8 /root/disks/loop8.img
      wipefs -a /dev/loop8 || true
      dd if=/dev/zero of=/root/disks/loop9.img bs=1M count=2048
      losetup /dev/loop9 /root/disks/loop9.img
      wipefs -a /dev/loop9 || true
      pvcreate /dev/loop8
      pvcreate /dev/loop9
      vgcreate vg_logs /dev/loop8 /dev/loop9
      lvcreate -n lv_logs -L 600M vg_logs
      mkfs.xfs /dev/vg_logs/lv_logs
      mkdir -p /mnt/logs
      mount /dev/vg_logs/lv_logs /mnt/logs

    scenario: |
      El LV lv_logs está montado en /mnt/logs y empieza a quedarse sin espacio.
      El jefe indica:
      "Extiende lv_logs en 400M y redimensiona el filesystem en línea."

    validations:
      # Validación 1: Tamaño LV aumentado a ~1GB
      - command: "lvs vg_logs/lv_logs --noheadings --units m -o lv_size 2>/dev/null || echo '0'"
        expected_range:
          min: "950"   # 950MB
          max: "1050"  # 1050MB
        match_type: "range_numeric"
        description: "LV extendido a ~1GB (600M + 400M)"
        weight: 4
      
      # Validación 2: Filesystem XFS extendido
      - command: "df -B1M /mnt/logs 2>/dev/null | tail -1 | awk '{print $2}' || echo '0'"
        expected_range:
          min: "950"   # 950MB
          max: "1050"  # 1050MB
        match_type: "range_numeric"
        description: "Filesystem XFS redimensionado en línea"
        weight: 4
      
      # Validación 3: Filesystem sigue montado durante extensión
      - command: "mount | grep '/mnt/logs' && echo 'MONTADO_DURANTE' || echo 'DESMONTADO'"
        expected_output: "MONTADO_DURANTE"
        match_type: "exact"
        description: "Filesystem permaneció montado durante extensión"
        weight: 3
      
      # Validación 4: Filesystem sigue siendo XFS
      - command: "blkid -s TYPE -o value /dev/vg_logs/lv_logs 2>/dev/null || echo 'NO_FS'"
        expected_output: "xfs"
        match_type: "exact"
        description: "Filesystem sigue siendo XFS después de extender"
        weight: 2
      
      # Validación 5: Datos preservados (verificar algún archivo de prueba)
      - command: "test -d /mnt/logs && echo 'DATOS_OK' || echo 'DATOS_PERDIDOS'"
        expected_output: "DATOS_OK"
        match_type: "exact"
        description: "Datos preservados después de extender"
        weight: 2



  # ────────────────────────────────
  # LAB 006 — Agregar Physical Volume a un VG
  # ────────────────────────────────
  - id: lab-lvm-006
    title: "Agregar Physical Volume a un VG"
    subtitle: "Ampliación de grupos de volúmenes"
    difficulty: 3
    points: 60
    repetitions_required: 5

    setup: |
      mkdir -p /root/disks
      dd if=/dev/zero of=/root/disks/loop10.img bs=1M count=2048
      losetup /dev/loop10 /root/disks/loop10.img
      wipefs -a /dev/loop10 || true
      pvcreate /dev/loop10
      vgcreate vg_main /dev/loop10
      dd if=/dev/zero of=/root/disks/loop11.img bs=1M count=2048
      losetup /dev/loop11 /root/disks/loop11.img
      wipefs -a /dev/loop11 || true

    scenario: |
      El Volume Group vg_main está funcionando con un único disco (PV).
      El jefe ordena:
      "Agrega el disco /dev/loop11 al VG vg_main."

    validations:
      # Validación 1: /dev/loop11 es un PV
      - command: "pvs /dev/loop11 --noheadings -o pv_name 2>/dev/null || echo 'NO_PV'"
        expected_output: "/dev/loop11"
        match_type: "exact"
        description: "/dev/loop11 es un Physical Volume"
        weight: 3
      
      # Validación 2: VG tiene 2 PVs
      - command: "vgs vg_main --noheadings -o pv_count 2>/dev/null || echo '1'"
        expected_output: "2"
        match_type: "exact"
        description: "VG vg_main tiene 2 PVs"
        weight: 4
      
      # Validación 3: /dev/loop11 está en vg_main
      - command: "pvs /dev/loop11 --noheadings -o vg_name 2>/dev/null"
        expected_output: "vg_main"
        match_type: "exact"
        description: "/dev/loop11 pertenece a vg_main"
        weight: 3
      
      # Validación 4: Tamaño total aumentó a ~4GB
      - command: "vgs vg_main --noheadings --units m -o vg_size 2>/dev/null || echo '0'"
        expected_range:
          min: "3800"  # 3.8GB
          max: "4200"  # 4.2GB
        match_type: "range_numeric"
        description: "Tamaño total del VG ~4GB (2 discos de ~2GB)"
        weight: 2
      
      # Validación 5: VG sigue activo
      - command: "vgs vg_main --noheadings -o vg_attr 2>/dev/null || echo 'INACTIVO'"
        expected_output: "wz"
        match_type: "contains"
        description: "VG sigue activo después de agregar PV"
        weight: 2



  # ────────────────────────────────
  # LAB 007 — Reducir un LV ext4 desmontado
  # ────────────────────────────────
  - id: lab-lvm-007
    title: "Reducir Logical Volume (EXT4)"
    subtitle: "Reducción segura de un LV"
    difficulty: 5
    points: 80
    repetitions_required: 5

    setup: |
      mkdir -p /root/disks
      dd if=/dev/zero of=/root/disks/loop12.img bs=1M count=2048
      losetup /dev/loop12 /root/disks/loop12.img
      wipefs -a /dev/loop12 || true
      dd if=/dev/zero of=/root/disks/loop13.img bs=1M count=2048
      losetup /dev/loop13 /root/disks/loop13.img
      wipefs -a /dev/loop13 || true
      pvcreate /dev/loop12
      pvcreate /dev/loop13
      vgcreate vg_ext /dev/loop12 /dev/loop13
      lvcreate -n lv_home -L 1G vg_ext
      mkfs.ext4 /dev/vg_ext/lv_home
      mkdir -p /mnt/home_ext
      mount /dev/vg_ext/lv_home /mnt/home_ext
      umount /mnt/home_ext

    scenario: |
      El LV lv_home (EXT4) está desmontado y tiene espacio libre.
      El jefe solicita:
      "Reduce lv_home en 300M de forma segura."

    validations:
      # Validación 1: LV reducido a ~700MB
      - command: "lvs vg_ext/lv_home --noheadings --units m -o lv_size 2>/dev/null || echo '0'"
        expected_range:
          min: "650"   # 650MB
          max: "750"   # 750MB
        match_type: "range_numeric"
        description: "LV reducido de 1GB a ~700MB"
        weight: 4
      
      # Validación 2: Filesystem EXT4 íntegro
      - command: "fsck.ext4 -n /dev/vg_ext/lv_home 2>&1 | grep -q 'clean' && echo 'FS_OK' || echo 'FS_CORRUPTO'"
        expected_output: "FS_OK"
        match_type: "exact"
        description: "Filesystem EXT4 íntegro después de reducir"
        weight: 5
      
      # Validación 3: Se puede montar después de reducir
      - command: "mount /dev/vg_ext/lv_home /mnt/home_ext 2>&1 && echo 'MONTABLE' || echo 'NO_MONTABLE'; umount /mnt/home_ext 2>/dev/null"
        expected_output: "MONTABLE"
        match_type: "exact"
        description: "LV montable después de reducción"
        weight: 4
      
      # Validación 4: Filesystem usa tamaño reducido
      - command: "mount /dev/vg_ext/lv_home /mnt/home_ext 2>/dev/null; df -B1M /mnt/home_ext 2>/dev/null | tail -1 | awk '{print $2}' || echo '0'; umount /mnt/home_ext 2>/dev/null"
        expected_range:
          min: "650"
          max: "750"
        match_type: "range_numeric"
        description: "Filesystem usa el nuevo tamaño reducido"
        weight: 3
      
      # Validación 5: Datos preservados (archivo de prueba)
      - command: "mount /dev/vg_ext/lv_home /mnt/home_ext 2>/dev/null; test -d /mnt/home_ext/lost+found && echo 'DATOS_OK' || echo 'DATOS_PERDIDOS'; umount /mnt/home_ext 2>/dev/null"
        expected_output: "DATOS_OK"
        match_type: "exact"
        description: "Estructura de datos básica preservada"
        weight: 2


  # ────────────────────────────────
  # LAB 008 — Extender un LV lleno al 100%
  # ────────────────────────────────
  - id: lab-lvm-008
    title: "Extender LV lleno"
    subtitle: "Recuperación de espacio en escenarios críticos"
    difficulty: 4
    points: 70
    repetitions_required: 5

    setup: |
      mkdir -p /root/disks
      dd if=/dev/zero of=/root/disks/loop14.img bs=1M count=2048
      losetup /dev/loop14 /root/disks/loop14.img
      wipefs -a /dev/loop14 || true
      dd if=/dev/zero of=/root/disks/loop15.img bs=1M count=2048
      losetup /dev/loop15 /root/disks/loop15.img
      wipefs -a /dev/loop15 || true
      pvcreate /dev/loop14
      pvcreate /dev/loop15
      vgcreate vg_full /dev/loop14 /dev/loop15
      lvcreate -n lv_full -L 300M vg_full
      mkfs.xfs /dev/vg_full/lv_full
      mkdir -p /mnt/full
      mount /dev/vg_full/lv_full /mnt/full
      dd if=/dev/zero of=/mnt/full/bigfile.bin bs=1M || true

    scenario: |
      El LV lv_full está completamente lleno.
      El jefe indica:
      "Extiende lv_full y luego el filesystem hasta recuperar espacio disponible."

    validations:
      # Validación 1: LV extendido más allá de 300MB
      - command: "lvs vg_full/lv_full --noheadings --units m -o lv_size 2>/dev/null || echo '0'"
        expected_range:
          min: "350"   # >300MB
          max: "1000"  # Hasta 1GB
        match_type: "range_numeric"
        description: "LV extendido más allá del tamaño original (300MB)"
        weight: 4
      
      # Validación 2: Filesystem extendido
      - command: "df -B1M /mnt/full 2>/dev/null | tail -1 | awk '{print $2}' || echo '0'"
        expected_range:
          min: "350"   # >300MB
          max: "1000"  # Hasta 1GB
        match_type: "range_numeric"
        description: "Filesystem extendido"
        weight: 4
      
      # Validación 3: Espacio disponible > 0%
      - command: "df /mnt/full 2>/dev/null | tail -1 | awk '{print $5}' | sed 's/%//' || echo '100'"
        expected_range:
          min: "0"
          max: "95"   # Menos del 95% usado
        match_type: "range_numeric"
        description: "Espacio disponible recuperado (<95% usado)"
        weight: 3
      
      # Validación 4: Filesystem sigue siendo XFS
      - command: "blkid -s TYPE -o value /dev/vg_full/lv_full 2>/dev/null || echo 'NO_FS'"
        expected_output: "xfs"
        match_type: "exact"
        description: "Filesystem sigue siendo XFS"
        weight: 2
      
      # Validación 5: Se pueden escribir nuevos datos
      - command: "dd if=/dev/zero of=/mnt/full/testfile.bin bs=1M count=10 2>&1 && echo 'ESCRIBIBLE' || echo 'NO_ESCRIBIBLE'"
        expected_output: "ESCRIBIBLE"
        match_type: "exact"
        description: "Se pueden escribir nuevos datos después de extender"
        weight: 2



  # ────────────────────────────────
  # LAB 009 — Corregir entrada incorrecta en /etc/fstab
  # ────────────────────────────────
  - id: lab-lvm-009
    title: "Corregir entrada incorrecta en /etc/fstab"
    subtitle: "Solución de problemas de montaje"
    difficulty: 3
    points: 60
    repetitions_required: 4

    setup: |
      mkdir -p /root/disks
      dd if=/dev/zero of=/root/disks/loop16.img bs=1M count=2048
      losetup /dev/loop16 /root/disks/loop16.img
      wipefs -a /dev/loop16 || true
      pvcreate /dev/loop16
      vgcreate vg_fstab /dev/loop16
      lvcreate -n lv_cfg -L 400M vg_fstab
      mkfs.ext4 /dev/vg_fstab/lv_cfg
      mkdir -p /mnt/cfg
      echo "UUID=WRONG-UUID /mnt/cfg ext4 defaults 0 0" >> /etc/fstab

    scenario: |
      Una entrada incorrecta en /etc/fstab impide el montaje automático.
      El jefe ordena:
      "Corrige la entrada para que /mnt/cfg monte correctamente."

    validations:
      # Validación 1: mount -a no produce errores
      - command: "mount -a 2>&1 | grep -v 'already mounted' | wc -l"
