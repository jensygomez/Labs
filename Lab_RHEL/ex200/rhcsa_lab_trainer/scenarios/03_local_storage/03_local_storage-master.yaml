      dd if=/dev/zero of=/root/disks/loop17.img bs=1M count=2048
      losetup /dev/loop17 /root/disks/loop17.img
      wipefs -a /dev/loop17 || true
      dd if=/dev/zero of=/root/disks/loop18.img bs=1M count=2048
      losetup /dev/loop18 /root/disks/loop18.img
      wipefs -a /dev/loop18 || true
      pvcreate /dev/loop17
      pvcreate /dev/loop18
      vgcreate vg_rapido /dev/loop17 /dev/loop18

    scenario: |
      Tienes dos discos idénticos y necesitas crear un LV de alto rendimiento
      para una base de datos crítica.
      El jefe ordena:
      "Crea un Logical Volume de 1.5G en modo striped (-i2) sobre ambos discos y formatealo con XFS."

    validations:
      # Validación 1: LV creado en modo striped
      - command: "lvs --noheadings -o segtype 2>/dev/null | grep -i 'striped' | head -1 || echo 'NO_STRIPED'"
        expected_output: "striped"
        match_type: "contains"
        description: "LV creado en modo striped"
        weight: 5
      
      # Validación 2: LV con 2 stripes
      - command: "lvs --noheadings -o stripes 2>/dev/null | head -1 || echo '0'"
        expected_output: "2"
        match_type: "exact"
        description: "LV con 2 stripes (uno por disco)"
        weight: 5
      
      # Validación 3: Tamaño ~1.5GB
      - command: "lvs --noheadings --units m -o lv_size 2>/dev/null | head -1 | awk '{print int(\$1)}' || echo '0'"
        expected_range:
          min: "1300"  # 1.4GB
          max: "1700"  # 1.6GB
        match_type: "range_numeric"
        description: "LV con tamaño ~1.5GB"
        weight: 4
      
      # Validación 4: Filesystem XFS creado
      - command: "blkid -s TYPE -o value $(lvs --noheadings -o lv_path 2>/dev/null | head -1) 2>/dev/null || echo 'NO_FS'"
        expected_output: "xfs"
        match_type: "exact"
        description: "Filesystem XFS creado en el LV"
        weight: 4
      
      # Validación 5: LV montado (si se pidió montar)
      - command: "mount | grep 'vg_rapido' && echo 'MONTADO' || echo 'NO_MONTADO'"
        expected_output: "MONTADO"
        match_type: "exact"
        description: "LV striped montado y listo para usar"
        weight: 3
      
      # Validación 6: Datos distribuidos en ambos discos (verificación indirecta)
      - command: "pvs --noheadings --units m -o pv_used /dev/loop17 2>/dev/null | awk '{print int(\$1)}' || echo '0'"
        expected_range:
          min: "450"  # ~750MB por disco (1.5GB/2)
          max: "950"
        match_type: "range_numeric"
        description: "Datos distribuidos en /dev/loop17"
        weight: 3