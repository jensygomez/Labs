        expected_range:
          min: "40"  # ~50MB
          max: "60"
        match_type: "range_numeric"
        description: "Archivo data.bin mantiene tamaño ~50MB"
        weight: 4
      
      # Validación 7: Filesystem montado y accesible
      - command: "mount | grep '/mnt/nuevo_legacy' && echo 'MONTADO' || echo 'DESMONTADO'"
        expected_output: "MONTADO"
        match_type: "exact"
        description: "Nuevo filesystem montado"
        weight: 3


  # ────────────────────────────────
