  # ────────────────────────────────
  - id: lab-lvm-016
    title: "LVM Avanzado – LV dividido en varias particiones (striped LV)"
    subtitle: "Striping para mejor performance"
    difficulty: 5
    points: 420
    repetitions_required: 12

    setup: |
