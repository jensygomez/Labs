        weight: 3
      
      # Validación 4: Entrada en fstab es válida (usa dispositivo o UUID correcto)
      - command: "grep '/mnt/cfg' /etc/fstab | egrep -q '(^/dev/|UUID=[a-f0-9-]+)' && echo 'ENTRADA_VALIDA' || echo 'ENTRADA_INVALIDA'"
