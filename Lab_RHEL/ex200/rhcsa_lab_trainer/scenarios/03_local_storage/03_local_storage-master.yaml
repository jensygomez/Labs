  # ────────────────────────────────
  # LAB 010 — Extender LV con XFS en un VG grande
  # ────────────────────────────────
  - id: lab-lvm-010
    title: "Extender filesystem XFS"
    subtitle: "Redimensionamiento online en XFS"
    difficulty: 4
    points: 75
    repetitions_required: 5

    setup: |
      mkdir -p /root/disks
      dd if=/dev/zero of=/root/disks/loop17.img bs=1M count=2048
      losetup /dev/loop17 /root/disks/loop17.img
      wipefs -a /dev/loop17 || true
      dd if=/dev/zero of=/root/disks/loop18.img bs=1M count=2048
      losetup /dev/loop18 /root/disks/loop18.img
      wipefs -a /dev/loop18 || true
      pvcreate /dev/loop17
      pvcreate /dev/loop18
      vgcreate vg_xfs /dev/loop17 /dev/loop18
      lvcreate -n lv_xdata -L 500M vg_xfs
      mkfs.xfs /dev/vg_xfs/lv_xdata
      mkdir -p /mnt/xdata
      mount /dev/vg_xfs/lv_xdata /mnt/xdata

    scenario: |
      El filesystem XFS existe en el LV lv_xdata, pero el VG vg_xfs tiene mucho espacio libre.
      El jefe solicita:
      "Extiende lv_xdata y luego ejecuta xfs_growfs."

    validations:
      # Validación 1: LV extendido (>500MB)
      - command: "lvs vg_xfs/lv_xdata --noheadings --units m -o lv_size 2>/dev/null || echo '0'"
        expected_range:
          min: "550"   # >500MB
          max: "1500"  # Hasta 1.5GB
        match_type: "range_numeric"
        description: "LV extendido más allá de 500MB"
        weight: 3
      
      # Validación 2: xfs_growfs ejecutado (filesystem extendido)
      - command: "df -B1M /mnt/xdata 2>/dev/null | tail -1 | awk '{print $2}' || echo '0'"
        expected_range:
          min: "550"   # >500MB
          max: "1500"  # Hasta 1.5GB
        match_type: "range_numeric"
        description: "Filesystem XFS redimensionado con xfs_growfs"
        weight: 4
      
      # Validación 3: xfs_growfs no produjo errores (filesystem montado)
      - command: "mount | grep '/mnt/xdata' && echo 'MONTADO_DURANTE' || echo 'DESMONTADO'"
        expected_output: "MONTADO_DURANTE"
        match_type: "exact"
        description: "Filesystem permaneció montado durante xfs_growfs"
        weight: 3
      
      # Validación 4: Filesystem sigue siendo XFS
      - command: "blkid -s TYPE -o value /dev/vg_xfs/lv_xdata 2>/dev/null || echo 'NO_FS'"
        expected_output: "xfs"
        match_type: "exact"
        description: "Filesystem sigue siendo XFS"
        weight: 2
      
      # Validación 5: Datos preservados
      - command: "test -d /mnt/xdata && echo 'DATOS_OK' || echo 'DATOS_PERDIDOS'"
        expected_output: "DATOS_OK"
        match_type: "exact"
        description: "Datos preservados después de extender XFS"
        weight: 2
      
      # Validación 6: Se puede escribir después de extender
      - command: "touch /mnt/xdata/test_after_grow && echo 'ESCRIBIBLE' || echo 'NO_ESCRIBIBLE'"
        expected_output: "ESCRIBIBLE"
        match_type: "exact"
        description: "Se puede escribir después de xfs_growfs"
        weight: 1



  # ────────────────────────────────
  # LAB 011 — Actualizar UUID en fstab sin desmontar
  # ────────────────────────────────
  - id: lab-lvm-011
    title: "Actualizar UUID en /etc/fstab"
    subtitle: "Gestión de montajes y persistencia"
    difficulty: 3
    points: 60
    repetitions_required: 4

    setup: |
      mkdir -p /root/disks
      dd if=/dev/zero of=/root/disks/loop19.img bs=1M count=2048
      losetup /dev/loop19 /root/disks/loop19.img
      wipefs -a /dev/loop19 || true
      pvcreate /dev/loop19
      vgcreate vg_uuid /dev/loop19
      lvcreate -n lv_uuid -L 450M vg_uuid
      mkfs.ext4 /dev/vg_uuid/lv_uuid
      mkdir -p /mnt/uuidtest
      mount /dev/vg_uuid/lv_uuid /mnt/uuidtest
      ORIGINAL_UUID=$(blkid -s UUID -o value /dev/vg_uuid/lv_uuid)
      mkfs.ext4 -F /dev/vg_uuid/lv_uuid
      NEW_UUID=$(blkid -s UUID -o value /dev/vg_uuid/lv_uuid)
      echo "UUID=${ORIGINAL_UUID} /mnt/uuidtest ext4 defaults 0 0" >> /etc/fstab

    scenario: |
      El filesystem del LV lv_uuid fue recreado y ahora tiene un UUID diferente,
      pero /etc/fstab aún contiene el UUID anterior.
      El jefe indica:
      "Actualiza el UUID en fstab sin desmontar el filesystem."

    validations:
      # Validación 1: Filesystem actualmente montado
      - command: "mount | grep '/mnt/uuidtest' && echo 'MONTADO' || echo 'DESMONTADO'"
        expected_output: "MONTADO"
        match_type: "exact"
        description: "Filesystem permanece montado durante el ejercicio"
        weight: 3
      
      # Validación 2: UUID en fstab coincide con UUID actual
      - command: "CURRENT_UUID=$(blkid -s UUID -o value /dev/vg_uuid/lv_uuid 2>/dev/null); grep '/mnt/uuidtest' /etc/fstab | grep -q \"UUID=${CURRENT_UUID}\" && echo 'UUID_CORRECTO' || echo 'UUID_INCORRECTO'"
        expected_output: "UUID_CORRECTO"
        match_type: "exact"
        description: "UUID en fstab coincide con UUID actual del filesystem"
        weight: 5
      
      # Validación 3: mount -a funciona sin errores
      - command: "mount -a 2>&1 | grep -v 'already mounted' | wc -l"
        expected_range:
          min: "0"
          max: "1"
        match_type: "range_numeric"
        description: "mount -a no produce errores"
        weight: 3
      
      # Validación 4: Persistencia después de reboot simulado
      - command: "umount /mnt/uuidtest 2>/dev/null; mount -a 2>&1; mount | grep '/mnt/uuidtest' && echo 'PERSISTENTE' || echo 'NO_PERSISTENTE'"
        expected_output: "PERSISTENTE"
        match_type: "exact"
        description: "Montaje funciona después de umount + mount -a"
        weight: 3
      
      # Validación 5: UUID antiguo NO está en fstab
      - command: "OLD_UUID=$(grep 'WRONG-UUID\|ORIGINAL' /etc/fstab 2>/dev/null | head -1 | grep -o 'UUID=[^ ]*' | cut -d= -f2); if [ -z \"$OLD_UUID\" ]; then echo 'UUID_ANTIGUO_ELIMINADO'; else echo 'UUID_ANTIGUO_PRESENTE'; fi"
        expected_output: "UUID_ANTIGUO_ELIMINADO"
        match_type: "exact"
        description: "UUID antiguo no está presente en fstab"
        weight: 2




  # ────────────────────────────────
  # LAB 012 — Migración de datos con pvmove
  # ────────────────────────────────
  - id: lab-lvm-012
    title: "LVM Avanzado – Migración de datos con pvmove"
    subtitle: "Movimiento de datos sin downtime"
    difficulty: 4
    points: 350
    repetitions_required: 10

    setup: |
      mkdir -p /root/disks
      dd if=/dev/zero of=/root/disks/loop10.img bs=1M count=2048
      losetup /dev/loop10 /root/disks/loop10.img
      wipefs -a /dev/loop10 || true
      dd if=/dev/zero of=/root/disks/loop11.img bs=1M count=2048
      losetup /dev/loop11 /root/disks/loop11.img
      wipefs -a /dev/loop11 || true
      pvcreate /dev/loop10
      pvcreate /dev/loop11
      vgcreate vg_migracao /dev/loop10 /dev/loop11
      lvcreate -n lv_mover -L 800M vg_migracao
      mkfs.xfs /dev/vg_migracao/lv_mover
      mkdir -p /mnt/mover
      mount /dev/vg_migracao/lv_mover /mnt/mover
      dd if=/dev/urandom of=/mnt/mover/testfile.bin bs=5M count=20

    scenario: |
      Tienes un VG con dos PVs y un LV con datos importantes.
      El disco /dev/loop10 necesita ser reemplazado por mantenimiento.
      El jefe ordena:
      "Migra todos los datos de /dev/loop10 a /dev/loop11 usando pvmove sin downtime."

    validations:
      # Validación 1: Datos migrados de loop10 a loop11
      - command: "pvs /dev/loop10 --noheadings --units m -o pv_used 2>/dev/null | awk '{print int(\$1)}' || echo '9999'"
        expected_range:
          min: "0"
          max: "50"  # Casi 0MB usados (tolerancia)
        match_type: "range_numeric"
        description: "/dev/loop10 con menos de 50MB usados (datos migrados)"
        weight: 5
      
      # Validación 2: Datos ahora en loop11
      - command: "pvs /dev/loop11 --noheadings --units m -o pv_used 2>/dev/null | awk '{print int(\$1)}' || echo '0'"
        expected_range:
          min: "700"  # ~800MB usados
          max: "900"
        match_type: "range_numeric"
        description: "/dev/loop11 con ~800MB usados (datos migrados aquí)"
        weight: 5
      
      # Validación 3: Filesystem sigue montado y accesible durante migración
      - command: "mount | grep '/mnt/mover' && echo 'MONTADO_DURANTE' || echo 'DESMONTADO'"
        expected_output: "MONTADO_DURANTE"
        match_type: "exact"
        description: "Filesystem permaneció montado durante pvmove"
        weight: 4
      
      # Validación 4: Datos preservados (archivo testfile.bin)
      - command: "test -f /mnt/mover/testfile.bin && echo 'DATOS_PRESERVADOS' || echo 'DATOS_PERDIDOS'"
        expected_output: "DATOS_PRESERVADOS"
        match_type: "exact"
        description: "Archivo de datos preservado después de migración"
        weight: 4
      
      # Validación 5: Filesystem sigue siendo XFS y funcional
      - command: "blkid -s TYPE -o value /dev/vg_migracao/lv_mover 2>/dev/null || echo 'NO_FS'"
        expected_output: "xfs"
        match_type: "exact"
        description: "Filesystem sigue siendo XFS después de migración"
        weight: 3
      
      # Validación 6: Tamaño del LV se mantiene
      - command: "lvs vg_migracao/lv_mover --noheadings --units m -o lv_size 2>/dev/null | awk '{print int(\$1)}' || echo '0'"
        expected_range:
          min: "700"
          max: "900"
        match_type: "range_numeric"
        description: "LV mantiene tamaño ~800MB después de migración"
        weight: 3  

