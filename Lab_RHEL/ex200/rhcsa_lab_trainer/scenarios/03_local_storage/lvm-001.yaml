id: lvm-001
name: Administración Lógica de Volúmenes (LVM)
module: Local Storage
type: dynamic
description: "Ejercicio dinámico RHCSA: Administración completa de LVM (EX200)"
points: 220
repetitions_required: 20
difficulty: 1

globals:
  disk: ["/dev/loop1", "/dev/loop2", "/dev/loop3", "/dev/loop4", "/dev/loop5"]
  pv_name: ["pv_geral"]
  vg_name: ["vg_data", "vg_apps", "vg_backup", "vg_logs"]
  lv_name: ["lv_data", "lv_home", "lv_logs"]
  size: ["500M", "1G", "2G"]
  fs: ["xfs", "ext4"]
  mount_point: ["/mnt/data", "/mnt/storage", "/mnt/backup", "/mnt/logs"]
  extend_size: ["+200M", "+500M", "+1G"]

scenarios:

  # ────────────────────────────────
  # 📌 BÁSICO (0–2)
  # ────────────────────────────────

  - |
      **Escenario:** El equipo acaba de llegar del proveedor y solo cuenta con el disco {{disk}}, totalmente limpio y sin uso previo.
      **Tarea del jefe:** “Antes de continuar con el despliegue del servidor, necesito que prepares el disco inicial. Convierte {{disk}} en un Physical Volume para que podamos empezar a trabajar con LVM.”
      **Resultado esperado:** `pvs` muestra {{disk}} como un PV válido y activo.

      **Setup de la máquina (via SSH):**
        # Crear carpeta donde estarán los discos loop
        mkdir -p /root/disks
        dd if=/dev/zero of=/root/disks/{{disk | replace('/dev/','') }}.img bs=1M count=2048
        losetup {{disk}} /root/disks/{{disk | replace('/dev/','') }}.img
        wipefs -a {{disk}} || true

  - |
      **Escenario:** El sistema tiene disponibles los discos {{disk}} y {{disk_extra}}, ambos sin particiones ni configuración previa.
      **Tarea del jefe:** “Vamos a consolidar el almacenamiento del servidor. Usa los discos disponibles para crear un nuevo Volume Group llamado {{vg_name}}.”
      **Resultado esperado:** `vgs` lista {{vg_name}} mostrando 2 PVs asignados correctamente.

      **Setup de la máquina (via SSH):**
        mkdir -p /root/disks
        dd if=/dev/zero of=/root/disks/{{disk | replace('/dev/','')}}.img bs=1M count=2048
        losetup {{disk}} /root/disks/{{disk | replace('/dev/','')}}.img
        wipefs -a {{disk}} || true
        dd if=/dev/zero of=/root/disks/{{disk_extra | replace('/dev/','')}}.img bs=1M count=2048
        losetup {{disk_extra}} /root/disks/{{disk_extra | replace('/dev/','')}}.img
        wipefs -a {{disk_extra}} || true

  - |
      **Escenario:** Ya existe el Volume Group {{vg_name}} y cuenta con espacio libre suficiente para crear un volumen lógico.
      **Tarea del jefe:** “Necesito un Logical Volume dentro de {{vg_name}} para comenzar a organizar los datos. Crea un LV llamado {{lv_name}} con un tamaño de {{size}}.”
      **Resultado esperado:** `lvs` muestra {{lv_name}} con el tamaño solicitado ({{size}}).

      **Setup de la máquina (via SSH):**
        mkdir -p /root/disks

        # Crear 2 discos loop para formar un VG
        # (solo si el VG no está aún creado)
        for d in loop1 loop2; do
            dd if=/dev/zero of=/root/disks/$d.img bs=1M count=2048
            losetup /dev/$d /root/disks/$d.img
            wipefs -a /dev/$d || true
        done

        # Crear el VG requerido
        pvcreate /dev/loop1
        pvcreate /dev/loop2
        vgcreate {{vg_name}} /dev/loop1 /dev/loop2


  # ────────────────────────────────
  # 📌 INTERMEDIO (3–11)
  # ────────────────────────────────

  - |
      **Escenario:** Existe un LV {{lv_name}} sin filesystem.
      **Tarea:** Crear filesystem {{fs}} y montarlo permanentemente en {{mount_point}}.
      **Resultado esperado:** `df -h` muestra {{mount_point}} y /etc/fstab contiene la entrada correcta.

  - |
      **Escenario:** LV {{lv_name}} está montado y en uso en {{mount_point}}.
      **Tarea:** Extender {{lv_name}} en {{extend_size}} y redimensionar el filesystem online.
      **Resultado esperado:** `lvs` muestra el aumento de tamaño y `df -h` refleja el cambio.

  - |
      **Escenario:** VG {{vg_name}} actualmente utiliza solo {{disk}}.
      **Tarea:** Agregar {{disk_extra}} al VG.
      **Resultado esperado:** `vgs -o +pv_count` muestra mayor cantidad de PVs.

  - |
      **Escenario:** LV {{lv_name}} (ext4) está desmontado y tiene espacio libre.
      **Tarea:** Reducir su tamaño en {{extend_size}} de forma segura.
      **Resultado esperado:** Tamaño reducido sin corrupción del filesystem.

  - |
      **Escenario:** Existe un LV lleno (100% en uso).
      **Tarea:** Extender el LV y el filesystem hasta recuperar espacio disponible.
      **Resultado esperado:** `df -h` muestra menor porcentaje de uso.

  - |
      **Escenario:** Entrada incorrecta en /etc/fstab impide el montaje automático.
      **Tarea:** Corregir la entrada y montar correctamente en {{mount_point}}.
      **Resultado esperado:** `mount -a` no produce errores.

  - |
      **Escenario:** Existe un filesystem XFS en el LV {{lv_name}}, pero el tamaño del VG es mayor.
      **Tarea:** Extender el LV y redimensionar el XFS.
      **Resultado esperado:** `xfs_growfs` ejecutado correctamente.

  - |
      **Escenario:** El LV {{lv_name}} está formateado y montado; se verifica UUID nuevo tras formateo.
      **Tarea:** Actualizar el nuevo UUID en /etc/fstab sin desmontar.
      **Resultado esperado:** Montaje persistente funciona tras `reboot`.

  # ────────────────────────────────
  # 📌 AVANZADO (12–20)
  # ────────────────────────────────

  - |
      **Escenario:** El LV {{lv_name}} está activo en {{vg_name}}.
      **Tarea:** Crear un snapshot llamado snap_{{lv_name}} con tamaño {{size}}.
      **Resultado esperado:** `lvs` muestra snapshot tipo `S`.

  - |
      **Escenario:** Existe un snapshot snap_{{lv_name}}.
      **Tarea:** Restaurar snapshot sobre el LV original.
      **Resultado esperado:** LV regresa al estado anterior.

  - |
      **Escenario:** El PV {{disk}} debe ser retirado del sistema.
      **Tarea:** Migrar todo el LV con `pvmove` hacia {{disk_extra}}.
      **Resultado esperado:** `pvs` muestra {{disk}} sin asignaciones.

  - |
      **Escenario:** El VG {{vg_name}} dispone de espacio libre.
      **Tarea:** Crear un thin pool pool_{{vg_name}} y un thin LV thin_{{lv_name}}.
      **Resultado esperado:** `lvs` muestra tipos `t` y `V`.

  - |
      **Escenario:** Existe un disco rápido {{disk_extra}} para caching.
      **Tarea:** Crear y asociar un LV de caché al LV {{lv_name}}.
      **Resultado esperado:** `lvs -o lv_name,cache_mode` muestra caché activo.

  - |
      **Escenario:** Se necesita clonar el LV para pruebas.
      **Tarea:** Crear clone_{{lv_name}} con mismo tamaño que el original.
      **Resultado esperado:** `lvs` lista clone_{{lv_name}}.

  - |
      **Escenario:** Se requiere limpiar la infraestructura LVM para reprovisionar.
      **Tarea:** Eliminar todos los LVs del VG {{vg_name}}, luego el VG completo y finalmente los PV.
      **Resultado esperado:** `pvs`, `lvs`, `vgs` no muestran recursos asociados.

  - |
      **Escenario:** Disco {{disk}} tiene una partición LVM2 antigua que causa advertencias.
      **Tarea:** Reescribir partición LVM, actualizar firma y reactivar el PV.
      **Resultado esperado:** No aparecen “unknown metadata” ni “ignored PV”.

  - |
      **Escenario:** El sistema contiene un LV que no puede montarse por corrupción.
      **Tarea:** Reparar el filesystem usando herramientas apropiadas (fsck para ext4, xfs_repair para xfs).
      **Resultado esperado:** LV vuelve a montarse correctamente.

levels:

  basic:
    repetitions: 5
    points_per_rep: 25
    pre_setup:
      - "losetup -d /dev/loop1 /dev/loop2 /dev/loop3 2>/dev/null || true"
      - "losetup /dev/loop1 /rhcsa-labs/disks/loop1.img"
      - "losetup /dev/loop2 /rhcsa-labs/disks/loop2.img"
    allowed_scenarios: [0, 1, 2]
    validation:
      - "pvs"
      - "vgs"
      - "lvs"

  intermediate:
    repetitions: 7
    points_per_rep: 35
    pre_setup:
      - "losetup -d /dev/loop{1,2,3} 2>/dev/null || true"
      - "losetup /dev/loop1 /rhcsa-labs/disks/loop1.img"
      - "losetup /dev/loop2 /rhcsa-labs/disks/loop2.img"
      - "losetup /dev/loop3 /rhcsa-labs/disks/loop3.img"
      - "pvcreate /dev/loop1 /dev/loop2"
      - "vgcreate {{vg_name}} /dev/loop1 /dev/loop2"
      - "lvcreate -n {{lv_name}} -L {{size}} {{vg_name}}"
    allowed_scenarios: [3, 4, 5, 6, 7, 8, 9, 10]
    validation:
      - "df -h"
      - "vgs | grep {{vg_name}}"
      - "lvs /dev/{{vg_name}}/{{lv_name}}"

  advanced:
    repetitions: 8
    points_per_rep: 45
    pre_setup:
      - "losetup -d /dev/loop{1,2,3} 2>/dev/null || true"
      - "losetup /dev/loop1 /rhcsa-labs/disks/loop1.img"
      - "losetup /dev/loop2 /rhcsa-labs/disks/loop2.img"
      - "losetup /dev/loop3 /rhcsa-labs/disks/loop3.img"
      - "pvcreate /dev/loop1 /dev/loop2 /dev/loop3"
      - "vgcreate {{vg_name}} /dev/loop1 /dev/loop2 /dev/loop3"
      - "lvcreate -n {{lv_name}} -L {{size}} {{vg_name}}"
    allowed_scenarios: [11, 12, 13, 14, 15, 16, 17, 18, 19]
    validation:
      - "lvs"
      - "pvs"
      - "vgs"
