---
# ==============================================================================
# SYSTECH-HA-001 - Enterprise Linux HA Infrastructure
# ==============================================================================
#
# SECUENCIA DE EJECUCIÓN (Comandos de orquestación):
#
# 1. Ejecutar todo el stack completo:
#    ansible-playbook site.yml
#
# 2. Despliegue fase por fase (Útil para pruebas o reconstrucción modular):
#    Fase 01 (Baseline):   ansible-playbook site.yml --tags baseline
#    Fase 02 (VIP HA):     ansible-playbook site.yml --tags keepalived
#    Fase 09b (LB HA):     ansible-playbook site.yml --tags haproxy
#    Fase 10 (Web Stack):  ansible-playbook site.yml --tags nginx
#
# ==============================================================================

# ------------------------------------------------------------------------------
# FASE 01: BASELINE DE SEGURIDAD Y CONFIGURACIÓN BASE
# Comando individual: ansible-playbook site.yml --tags baseline
# ------------------------------------------------------------------------------
- name: "Phase 01 - Apply Linux Baseline to all nodes"
  hosts: ha_nodes:storage_nodes
  become: true
  gather_facts: true
  roles:
    - role: linux_baseline
      tags: baseline

# ------------------------------------------------------------------------------
# FASE 02: ALTA DISPONIBILIDAD - RED / VIP (KEEPALIVED)
# Comando individual: ansible-playbook site.yml --tags keepalived
# ------------------------------------------------------------------------------
- name: "Phase 02 - High Availability VIP Layer (Keepalived)"
  hosts: ha_nodes
  become: true
  gather_facts: true
  roles:
    - role: keepalived
      tags: keepalived

# ------------------------------------------------------------------------------
# FASE 06 / 07 / 08: ALMACENAMIENTO Y SERVICIOS CORE DE INFRAESTRUCTURA
# Comando individual: ansible-playbook site.yml --tags storage
# ------------------------------------------------------------------------------
#- name: "Phase 06/07/08 - Storage Foundation & Services"
#  hosts: storage_nodes
#  become: true
#  gather_facts: true
#  roles:
#    - role: storage
#      tags: storage


# ------------------------------------------------------------------------------
# FASE 09B: ALTA DISPONIBILIDAD - BALANCEADOR DE CARGA (HAPROXY)
# Comando individual: ansible-playbook site.yml --tags haproxy
# ------------------------------------------------------------------------------
- name: "Phase 09b - High Availability Load Balancer Layer (HAProxy)"
  hosts: ha_nodes
  become: true
  gather_facts: true
  roles:
    - role: haproxy
      tags: haproxy


# ------------------------------------------------------------------------------
# FASE 10: CAPA DE APLICACIÓN WEB (NGINX BACKENDS)
# Comando individual: ansible-playbook site.yml --tags nginx
# NOTA: Próxima fase a implementar para completar el stack end-to-end.
# ------------------------------------------------------------------------------
- name: "Phase 10 - Web Application Stack (Nginx Backends)"
  hosts: ha_nodes
  become: true
  gather_facts: true
  roles:
    - role: nginx
      tags: nginx


