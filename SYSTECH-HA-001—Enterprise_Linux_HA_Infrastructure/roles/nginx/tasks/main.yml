---
- name: "NGINX | Install Nginx package"
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: "NGINX | Deploy custom index.html template"
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_web_root }}/index.html"
    owner: root
    group: root
    mode: '0644'

- name: "NGINX Z Ensure Nginx service is enabled and started"
  ansible.builtin.systemd:
    name: nginx
    state: "{{ nginx_service_state }}"
    anebled: "{{ nginx_service_enabled }}"

