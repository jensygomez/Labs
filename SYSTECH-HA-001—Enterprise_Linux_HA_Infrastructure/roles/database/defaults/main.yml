---
# ==============================================================================
# SYSTECH-HA-001 — Role: Database (MariaDB)
# Default Variables
# =============================================================================

# Configuracion del Servicio
db_port: 3306
db_bind_address: "0.0.0.0"

# Credenciales y DB inicial (Personaliza segun tus necesidades)
db_root_password: "Password123"
db_name: "acme_db"
db_user: "acme_user"
db_password: "Password123"

# Máscara de red/patron permitido para que los backends (ha_nodes) se conecten
# '10.45.223.%' permite a cualquier host de la sub-red 10.45.223.0/24 conectar
db_allowed_host_pattern: "{{ ansible_default_ipv4.network }}/{{ ansible_default_ipv4.netmask }}"

