---
- name: "BASELINE | Fast CLI package installation"
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: "BASELINE | Install baseline CLI packages"
  ansible.builtin.dnf:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - net-tools
      - bind-utils
      - pciutils
      - tar
      - rsync
      - policycoreutils-python-utils

- name: "BASELINE | Set system timezone"
  community.general.timezone:
    name: "America/Sao_Paulo"

- name: "BASELINE | Create sysadmin user"
  ansible.builtin.group:
    name: sysadmin
    state: present

- name: "BASELINE | Create sysadmin user"
  ansible.builtin.user:
    name: sysadmin
    group: sysadmin
    groups: wheel
    append: true
    shell: /bin/bash
    state: present

- name: "BASELINE | Configure passwordless sudo for sysadmin"
  ansible.builtin.copy:
    content: "sysadmin ALL=(ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/sysadmin
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'


