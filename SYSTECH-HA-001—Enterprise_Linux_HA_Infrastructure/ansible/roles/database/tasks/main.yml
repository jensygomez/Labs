---
# ==============================================================================
# SYSTECH-HA-001 — Role: Database Tasks
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. INSTALACIÓN DE PAQUETES (Multi-familia OS)
# ------------------------------------------------------------------------------
- name: Install MariaDB and Python MySQL client (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - mariadb-server
      - mariadb-client
      - python3-pymysql
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install MariaDB and Python MySQL client (RedHat/AlmaLinux)
  ansible.builtin.dnf:
    name:
      - mariadb-server
      - mariadb
      - python3-pymysql
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

# ------------------------------------------------------------------------------
# 2. GESTIÓN DEL SERVICIO Y CONFIGURACIÓN DE RED
# ------------------------------------------------------------------------------
- name: Ensure MariaDB service is started and enabled
  ansible.builtin.service:
    name: "{{ 'mariadb' if ansible_facts['os_family'] == 'RedHat' else 'mysql' }}"
    state: started
    enabled: true

- name: Deploy MariaDB server configuration template
  ansible.builtin.template:
    src: 50-server.cnf.j2
    dest: "{{ '/etc/my.cnf.d/mariadb-server.cnf' if ansible_facts['os_family'] == 'RedHat' else '/etc/mysql/mariadb.conf.d/50-server.cnf' }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart mariadb

- name: Flush handlers to apply config before setting up users
  ansible.builtin.meta: flush_handlers

# ------------------------------------------------------------------------------
# 3. ENDURECIMIENTO Y CREACIÓN DE USUARIOS (Efecto mariadb_secure_installation)
# ------------------------------------------------------------------------------
- name: Set MariaDB root password
  ansible.mysql.mysql_user:
    name: root
    host: "{{ item }}"
    password: "{{ db_root_password }}"
    login_user: root
    login_password: "{{ db_root_password }}"
    login_unix_socket: "{{ '/var/run/mysqld/mysqld.sock' if ansible_facts['os_family'] == 'Debian' else omit }}"
    check_implicit_admin: true
    state: present
  loop:
    - localhost
    - 127.0.0.1
    - ::1

- name: Create /root/.my.cnf with root credentials for idempotency
  ansible.builtin.template:
    src: my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: '0600'

- name: Remove anonymous users
  ansible.mysql.mysql_user:
    name: ''
    host_all: true
    state: absent
    login_user: root
    login_password: "{{ db_root_password }}"

- name: Remove test database
  ansible.mysql.mysql_db:
    name: test
    state: absent
    login_user: root
    login_password: "{{ db_root_password }}"

# ------------------------------------------------------------------------------
# 4. PROVISIÓN DE BASE DE DATOS Y USUARIOS DE APLICACIÓN
# ------------------------------------------------------------------------------
- name: Create application database
  ansible.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_user: root
    login_password: "{{ db_root_password }}"

- name: Create application user with remote access from current subnet
  ansible.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "{{ db_allowed_host_pattern }}"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_user: root
    login_password: "{{ db_root_password }}"
