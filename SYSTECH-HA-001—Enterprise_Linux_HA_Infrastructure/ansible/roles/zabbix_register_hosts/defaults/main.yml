---
# roles/zabbix_register_hosts/defaults/main.yml

# La API vive en la raíz, no en /zabbix/ (confirmado: la GUI responde en
# http://10.10.10.40/zabbix.php..., no /zabbix/zabbix.php...)
zabbix_api_server_url : "http://10.10.10.40"

zabbix_api_login_user: "Admin"
zabbix_api_login_password: "{{ vault_zabbix_admin_password }}"

# Grupo de hosts y template dentro de Zabbix (deben existir o el módulo
# los crea si tiene permisos; "Linux servers" y la plantilla activa vienen
# incluidos por default en Zabbix 7.0)
#

zabbix_host_group: "Linux servers"
zabbix_agent_template: "Linux by Zabbix agent active"

zabbix_agent_listen_port: 10050
