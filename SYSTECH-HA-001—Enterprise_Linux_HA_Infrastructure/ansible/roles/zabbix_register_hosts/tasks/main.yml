---
# roles/zabbix_register_hosts/tasks/main.yml
#
# Se ejecuta con hosts: <grupo de nodos a monitorear> (ej. ha_nodes:lb_nodes)
# pero cada tarea se delega a localhost (el contenedor de control), porque
# es una llamada a la API HTTP de Zabbix, no una acción sobre el nodo remoto.
# El bucle "por host" ocurre naturalmente: Ansible ejecuta este play una vez
# por cada host del grupo, y cada corrida usa sus propias variables
# (inventory_hostname, ansible_host) delegando la llamada API a localhost.

- name: "010 | Registrar {{ inventory_hostname }} en Zabbix vía API"
  community.zabbix.zabbix_host:
    server_url: "{{ zabbix_api_server_url }}"
    login_user: "{{ zabbix_api_login_user }}"
    login_password: "{{ zabbix_api_login_password }}"
    host_name: "{{ inventory_hostname }}"
    visible_name: "{{ inventory_hostname }}"
    host_groups:
      - "{{ zabbix_host_group }}"
    link_templates:
      - "{{ zabbix_agent_template }}"
    interfaces:
      - type: agent
        main: 1
        useip: 1
        ip: "{{ ansible_host }}"
        dns: ""
        port: "{{ zabbix_agent_listen_port }}"
    state: present
  delegate_to: localhost
  become: false

