---
- name: "NGINX | Install Nginx package"
  ansible.builtin.package:
    name: nginx
    state: present

- name: "NGINX | Deploy main nginx.conf (without default server block)"
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
    validate: "nginx -t -c %s"
  notify: "restart nginx"


- name: "NGINX | Deploy server configuration block"
  ansible.builtin.template:
    src: default.conf.j2
    dest: /etc/nginx/conf.d/default.conf
    owner: root
    group: root
    mode: '0644'
  
  notify: "restart nginx"

- name: Allow Nginx to connect to backend app over network (SELinux)
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
  when: ansible_facts['os_family'] == "RedHat"

- name: "NGINX | Deploy custom index.html template"
  ansible.builtin.template:
    src: index.html.j2
    dest: /usr/share/nginx/html/index.html
    owner: root
    group: root
    mode: '0644'

- name: "NGINX | Validate full configuration after conf.d changes"
  ansible.builtin.command: nginx -t
  changed_when: false
- name: "NGINX | Ensure Nginx service is enabled and started"
  ansible.builtin.systemd:
    name: nginx
    state: "{{ nginx_service_state }}"
    enabled: "{{ nginx_service_enabled }}"

- name: "NGINX | Ensure custom port is allowed by SELinux"
  community.general.seport:
    ports: "{{ nginx_port }}"
    proto: tcp
    setype: http_port_t
    state: present
  when: ansible_selinux.status == "enabled"
