---
# roles/zabbix_agent/defaults/main.yml

# Versión de Zabbix a instalar (debe coincidir con el server: 7.0 LTS)
zabbix_version: "7.0"

# IP del Zabbix Server (zabbix - 10.10.10.40)
zabbix_server_ip: "10.10.10.40"

# Checks pasivos: el server pregunta al agente (requiere Server=)
zabbix_agent_passive_checks: true

# Checks activos: el agente reporta al server por su cuenta (requiere ServerActive=)
zabbix_agent_active_checks: true

# Puerto del agente
zabbix_agent_listen_port: 10050

# Hostname que se registrará en Zabbix (debe coincidir EXACTO con el
# nombre del host creado en la interfaz web de Zabbix)
zabbix_agent_hostname: "{{ inventory_hostname }}"

# Buffers / timing de checks activos (valores por defecto de zabbix-agent2)
zabbix_agent_refresh_active_checks: 120
zabbix_agent_buffer_send: 5
zabbix_agent_buffer_size: 100

# Log
zabbix_agent_log_file: "/var/log/zabbix/zabbix_agent2.log"
zabbix_agent_log_file_size: 1

# Gestión de firewall (firewalld en Alma/RHEL, ufw en Ubuntu).
# Déjalo en true si tienes firewall activo en los nodos; en un LXC/VM de
# laboratorio recién creado normalmente NO hay firewall activo (linux_baseline
# no lo menciona), así que el default es false para no romper nada.
zabbix_agent_manage_firewall: false

# Repos oficiales de Zabbix por familia de SO
zabbix_repo_rpm_url: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/rhel/9/x86_64/zabbix-release-{{ zabbix_version }}-1.el9.noarch.rpm"
zabbix_repo_deb_url: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/ubuntu/pool/main/z/zabbix-release/zabbix-release_{{ zabbix_version }}-1+ubuntu24.04_all.deb"

