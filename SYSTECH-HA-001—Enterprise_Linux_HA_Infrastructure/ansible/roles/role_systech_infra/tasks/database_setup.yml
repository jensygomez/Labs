---
- name: "Instalar paquetes de PostgreSQL, Firewalld e iSCSI Initiator"
  ansible.builtin.dnf:
    name:
      - postgresql-server
      - postgresql-contrib
      - python3-psycopg2
      - iscsi-initiator-utils
      - firewalld
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: "Asegurar que Firewalld esté activo e iniciado"
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: "Permitir puerto de PostgreSQL en Firewalld"
  ansible.posix.firewalld:
    service: postgresql
    permanent: true
    state: enabled
    immediate: true

- name: "Instalar paquetes necesarios para SELinux"
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  when: ansible_selinux.status == "enabled"

# --- CONFIGURACIÓN iSCSI INITIATOR ---

- name: "Configurar Initiator Name"
  ansible.builtin.copy:
    dest: /etc/iscsi/initiatorname.iscsi
    content: "InitiatorName={{ iscsi_initiator_iqn }}\n"
    mode: '0600'

- name: "Garantizar que el servicio iSCSI Initiator esté activo"
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: true

- name: "Descubrir iSCSI Target en storage01"
  ansible.builtin.command:
    cmd: "iscsiadm -m discovery -t st -p {{ storage_host_ip }}"
  register: discovery_out
  changed_when: false

- name: "Login al iSCSI Target"
  ansible.builtin.command:
    cmd: "iscsiadm -m node -T {{ iscsi_target_iqn }} -p {{ storage_host_ip }} --login"
  register: login_out
  changed_when: "'successful' in login_out.stdout"
  failed_when:
    - login_out.rc != 0
    - "'already present' not in login_out.stderr"

- name: "Esperar y obtener el dispositivo de bloque iSCSI dinámicamente"
  ansible.builtin.shell: |
    sleep 2
    iscsiadm -m session -P 3 | grep 'Attached scsi disk' | awk '{print $4}' | head -n 1
  register: iscsi_device
  until: iscsi_device.stdout | length > 0
  retries: 5
  delay: 2

- name: "Crear Filesystem XFS en el disco iSCSI (Bloque local)"
  community.general.filesystem:
    fstype: xfs
    dev: "/dev/{{ iscsi_device.stdout }}"
    force: false

- name: "Obtener UUID del disco iSCSI"
  ansible.builtin.command:
    cmd: "blkid -s UUID -o value /dev/{{ iscsi_device.stdout }}"
  register: disk_uuid
  changed_when: false

# --- MONTAJE Y PREPARACIÓN PARA POSTGRESQL ---

- name: "Preparar directorio de datos de PostgreSQL"
  ansible.builtin.file:
    path: /var/lib/pgsql/data
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: "Montar disco iSCSI en /var/lib/pgsql/data"
  ansible.posix.mount:
    path: /var/lib/pgsql/data
    src: "UUID={{ disk_uuid.stdout }}"
    fstype: xfs
    opts: "_netdev,nofail" # _netdev es CRÍTICO para esperar a la red en el boot
    state: mounted

- name: "Asegurar permisos recursivos de postgres"
  ansible.builtin.file:
    path: /var/lib/pgsql/data
    owner: postgres
    group: postgres
    mode: '0700'
    recurse: true

# --- CONFIGURACIÓN POSTGRESQL ---

- name: "Inicializar base de datos PostgreSQL si no está inicializada"
  ansible.builtin.shell:
    cmd: |
      if [ ! -f /var/lib/pgsql/data/PG_VERSION ]; then
        postgresql-setup --initdb
      fi
    creates: /var/lib/pgsql/data/PG_VERSION
  become: true
  become_user: postgres

- name: "Configurar escuchas en PostgreSQL (listen_addresses)"
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/postgresql.conf
    regexp: "^#?listen_addresses ="
    line: "listen_addresses = '*'"

- name: "Configurar accesos pg_hba.conf para el grupo app_nodes"
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: /var/lib/pgsql/data/pg_hba.conf
    owner: postgres
    group: postgres
    mode: '0600'

- name: "Asegurar propiedad postgres en archivos generados por initdb"
  ansible.builtin.file:
    path: /var/lib/pgsql/data
    owner: postgres
    group: postgres
    recurse: true

# --- SELinux (AHORA SÍ FUNCIONARÁ AL 100%) ---

- name: "Configurar contexto SELinux para el directorio de datos"
  ansible.builtin.command:
    cmd: semanage fcontext -a -t postgresql_db_t "/var/lib/pgsql/data(/.*)?"
  when: ansible_selinux.status == "enabled"
  register: semanage_out
  changed_when: "'already defined' not in semanage_out.stderr"
  failed_when:
    - semanage_out.rc != 0
    - "'already defined' not in semanage_out.stderr"

- name: "Aplicar contexto SELinux recursivamente"
  ansible.builtin.command:
    cmd: restorecon -Rv /var/lib/pgsql/data
  when: ansible_selinux.status == "enabled"
  register: restorecon_out
  changed_when: restorecon_out.stdout | length > 0

- name: "Asegurar SELinux en modo enforcing (Sin hacks)"
  ansible.builtin.command:
    cmd: setenforce 1
  when: ansible_selinux.status == "enabled"
  ignore_errors: true

- name: "Iniciar y habilitar servicio PostgreSQL"
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

# --- CREACIÓN DE BD Y DATOS ---

- name: "Crear Base de Datos del proyecto"
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    state: present
  become: true
  become_user: postgres

- name: "Crear Usuario de la Base de Datos con privilegios"
  community.postgresql.postgresql_user:
    db: "{{ db_name }}"
    name: "{{ db_user }}"
    password: "{{ db_pass }}"
    priv: "ALL"
    state: present
  become: true
  become_user: postgres

- name: "Crear tabla de empleados y datos ficticios"
  community.postgresql.postgresql_query:
    db: "{{ db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS employees (
        id SERIAL PRIMARY KEY,
        first_name VARCHAR(50) NOT NULL,
        last_name VARCHAR(50) NOT NULL,
        department VARCHAR(50) NOT NULL,
        salary NUMERIC(10, 2) NOT NULL,
        hire_date DATE NOT NULL
      );

      DELETE FROM employees;

      INSERT INTO employees (first_name, last_name, department, salary, hire_date) VALUES
      ('Alice', 'Smith', 'RH', 1200.00, '2021-03-15'),
      ('Alexander', 'Gomez', 'IT', 2500.00, '2023-01-10'),
      ('Andrew', 'Silva', 'RH', 950.00, '2020-05-20'),
      ('Beatriz', 'Lopez', 'Finance', 1800.00, '2024-02-01'),
      ('Carlos', 'Mendoza', 'IT', 3100.00, '2019-11-12'),
      ('Ana', 'Martinez', 'RH', 1100.00, '2022-08-30'),
      ('Arthur', 'Perez', 'DevOps', 2800.00, '2025-01-15');
  become: true
  become_user: postgres
  
- name: "Otorgar permisos sobre la tabla employees a app_user"
  community.postgresql.postgresql_query:
    db: "{{ db_name }}"
    query: "GRANT ALL PRIVILEGES ON TABLE employees TO {{ db_user }};"
  become: true
  become_user: postgres
  
- name: "Otorgar permisos sobre todas las tablas del esquema public a app_user"
  community.postgresql.postgresql_query:
    db: "{{ db_name }}"
    query: "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO {{ db_user }};"
  become: true
  become_user: postgres
