---
# ==============================================================================
# POSTGRESQL PLAYBOOK (NFS BACKEND FOR LXC)
# ==============================================================================

- name: "Instalar paquetes necesarios (PostgreSQL, Client NFS y Firewalld)"
  ansible.builtin.dnf:
    name:
      - postgresql-server
      - postgresql-contrib
      - python3-psycopg2
      - nfs-utils
      - firewalld
    state: present
    update_cache: true

- name: "Asegurar servicio Firewalld activo"
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: "Abrir puerto 5432 (PostgreSQL) en Firewalld"
  ansible.posix.firewalld:
    service: postgresql
    permanent: true
    state: enabled
    immediate: true

# --- MONTAJE NFS PARA DATOS DE POSTGRESQL ---

- name: "Asegurar que existe el directorio /var/lib/pgsql/data"
  ansible.builtin.file:
    path: /var/lib/pgsql/data
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: "Montar export NFS de storage01 en /var/lib/pgsql/data"
  ansible.posix.mount:
    path: /var/lib/pgsql/data
    src: "10.10.10.50:/exports/pgdata"
    fstype: nfs
    opts: "vers=4,noatime,nolock,_netdev"
    state: mounted

- name: "Garantizar ownership del usuario postgres en /var/lib/pgsql/data"
  ansible.builtin.file:
    path: /var/lib/pgsql/data
    owner: postgres
    group: postgres
    mode: '0700'

# --- INICIALIZACIÓN Y CONFIGURACIÓN DE POSTGRESQL ---

- name: "Inicializar cluster de PostgreSQL si no existe PG_VERSION"
  ansible.builtin.shell:
    cmd: "postgresql-setup --initdb"
    creates: /var/lib/pgsql/data/PG_VERSION
  become: true
  become_user: postgres

- name: "Configurar listen_addresses en postgresql.conf"
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/postgresql.conf
    regexp: "^#?listen_addresses ="
    line: "listen_addresses = '*'"

- name: "Configurar accesos de red en pg_hba.conf"
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/pg_hba.conf
    line: "host    all             all             10.10.10.0/24           scram-sha-256"
    state: present

- name: "Iniciar y habilitar el servicio PostgreSQL"
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

# --- APROVISIONAMIENTO DE LA BASE DE DATOS Y TABLAS ---

- name: "Crear Base de Datos principal"
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    state: present
  become: true
  become_user: postgres

- name: "Crear Usuario de aplicación"
  community.postgresql.postgresql_user:
    db: "{{ db_name }}"
    name: "{{ db_user }}"
    password: "{{ db_pass }}"
    priv: "ALL"
    state: present
  become: true
  become_user: postgres

- name: "Poblar esquema y datos de prueba"
  community.postgresql.postgresql_query:
    db: "{{ db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS employees (
        id SERIAL PRIMARY KEY,
        first_name VARCHAR(50) NOT NULL,
        last_name VARCHAR(50) NOT NULL,
        department VARCHAR(50) NOT NULL,
        salary NUMERIC(10, 2) NOT NULL,
        hire_date DATE NOT NULL
      );

      DELETE FROM employees;

      INSERT INTO employees (first_name, last_name, department, salary, hire_date) VALUES
      ('Alice', 'Smith', 'RH', 1200.00, '2021-03-15'),
      ('Alexander', 'Gomez', 'IT', 2500.00, '2023-01-10'),
      ('Andrew', 'Silva', 'RH', 950.00, '2020-05-20'),
      ('Beatriz', 'Lopez', 'Finance', 1800.00, '2024-02-01'),
      ('Carlos', 'Mendoza', 'IT', 3100.00, '2019-11-12'),
      ('Ana', 'Martinez', 'RH', 1100.00, '2022-08-30'),
      ('Arthur', 'Perez', 'DevOps', 2800.00, '2025-01-15');
  become: true
  become_user: postgres

- name: "Otorgar privilegios sobre esquemas"
  community.postgresql.postgresql_query:
    db: "{{ db_name }}"
    query: "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO {{ db_user }};"
  become: true
  become_user: postgres
