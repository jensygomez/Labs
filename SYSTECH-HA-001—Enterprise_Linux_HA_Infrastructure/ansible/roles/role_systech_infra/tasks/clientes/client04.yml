# ==============================================================================
# CLIENT04 — CONSOLIDADOR BATCH + ROTACIÓN DE EVIDENCIAS (DURACIÓN VARIABLE)
# ==============================================================================
# Simula un proceso batch que, cada ciclo, ejecuta UNA petición prolongada
# hacia la VIP (10.10.10.30) atendida por un app node (round-robin HAProxy).
# El servidor lee TODOS los archivos .txt generados por client01/02/03 en
# /var/www/html/uploads (NFS webdata en storage01), los empaqueta en un
# archivo consolidado único y aplica rotación borrando los más antiguos
# si exceden el límite de retención.
#
# A diferencia de client01/02 (ciclos fijos), client04 introduce variabilidad
# real (como client03): cada ciclo elige duración y descanso ALEATORIOS
# dentro de rangos configurables.
#
# Rangos configurables vía --extra-vars:
#   client04_ocupacion_min / client04_ocupacion_max  (default: 10-25s)
#   client04_descanso_min  / client04_descanso_max   (default: 30-90s)
#   client04_max_keep                               (default: 20 archivos)
#
# El servicio se ejecuta como traffic-client04.service (systemd).
#
# ORDEN DE TAREAS (fix del bug original):
#   1. Instalar dependencias (curl, jq)
#   2. Copiar el script client04_traffic.sh
#   3. Copiar la unit file traffic-client04.service
#   4. daemon_reload + enable + start (única tarea systemd, cubre arranque
#      inicial Y reinicio en corridas posteriores gracias a 'state: started'
#      + 'handlers'/notify si el contenido del script cambió)
#
# NOTA: se eliminó el 'state: restarted' que corría ANTES de que existiera
# el .service — esa tarea era fatal en un host sin despliegue previo
# (systemd no puede reiniciar una unidad que no existe) y abortaba el play
# antes de llegar a copiar el .service. En client01/02/03 el mismo bug
# estaba "tapado" porque ya tenían el .service de un despliegue anterior.
# ==============================================================================
---
- name: "Instalar utilidades requeridas (Debian/Ubuntu)"
  ansible.builtin.apt:
    name: ['curl', 'jq']
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: "Instalar utilidades requeridas (RHEL/AlmaLinux)"
  ansible.builtin.dnf:
    name: ['curl', 'jq']
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: "Desplegar script de tráfico cíclico para Client04 (Consolidador Batch Variable)"
  ansible.builtin.copy:
    dest: /usr/local/bin/client04_traffic.sh
    mode: '0755'
    content: |
      #!/bin/bash
      VIP="10.10.10.30"
      # Rangos controlados por Ansible
      OCUPA_MIN={{ client04_ocupacion_min | default(10) }}
      OCUPA_MAX={{ client04_ocupacion_max | default(25) }}
      DESCANSO_MIN={{ client04_descanso_min | default(30) }}
      DESCANSO_MAX={{ client04_descanso_max | default(90) }}
      # Número máximo de archivos .txt a mantener en total (incluye consolidados)
      TOTAL_MAX={{ client04_max_keep | default(20) }}

      echo "[$(date +'%T')] === INICIANDO CONSOLIDADOR BATCH (Ocupa: ${OCUPA_MIN}-${OCUPA_MAX}s, Descansa: ${DESCANSO_MIN}-${DESCANSO_MAX}s, Retención total: ${TOTAL_MAX}) ==="

      while true; do
          DURATION=$(( (RANDOM % (OCUPA_MAX - OCUPA_MIN + 1)) + OCUPA_MIN ))
          DESCANSO=$(( (RANDOM % (DESCANSO_MAX - DESCANSO_MIN + 1)) + DESCANSO_MIN ))

          echo "[$(date +'%T')] ---> EJECUTANDO CONSOLIDACIÓN (Ocupará el servidor ${DURATION}s)"
          curl -s -m $((DURATION + 30)) "http://${VIP}/?action=consolidate_audit&duration=${DURATION}&total_max=${TOTAL_MAX}" \
            | jq -c '{nodo: .atendido_por, accion: .accion, leidos: .archivos_leidos, eliminados: .archivos_eliminados, consolidado: .consolidado_creado}'

          echo "[$(date +'%T')] ---> CONSOLIDACIÓN FINALIZADA. Liberando servidor y esperando ${DESCANSO}s..."
          sleep ${DESCANSO}
      done
  register: client04_script

- name: "Configurar servicio systemd para ejecutar el ciclo continuamente"
  ansible.builtin.copy:
    dest: /etc/systemd/system/traffic-client04.service
    mode: '0644'
    content: |
      [Unit]
      Description=Consolidador batch de evidencias Client04 (duración variable)
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/client04_traffic.sh
      Restart=on-failure
      RestartSec=10
      StandardOutput=append:/var/log/client04_traffic.log
      StandardError=append:/var/log/client04_traffic.log

      [Install]
      WantedBy=multi-user.target
  register: client04_unit

- name: "Recargar systemd, habilitar e iniciar el servicio cíclico"
  ansible.builtin.systemd:
    name: traffic-client04
    state: started
    enabled: true
    daemon_reload: true

- name: "Reiniciar el servicio si el script o la unit file cambiaron (idempotente)"
  ansible.builtin.systemd:
    name: traffic-client04
    state: restarted
  when: client04_script.changed or client04_unit.changed
