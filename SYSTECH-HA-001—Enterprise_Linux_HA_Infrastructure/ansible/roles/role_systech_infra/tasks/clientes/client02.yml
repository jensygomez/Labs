# ==============================================================================
# CLIENT02 — CICLO DE OCUPACIÓN/DESCANSO CONTRA STORAGE (NFS webdata)
# ==============================================================================
# Simula un cliente que ejecuta UNA petición de escritura por ciclo hacia la
# VIP (10.10.10.30), la cual es atendida por un app node (round-robin HAProxy)
# y escribe UN solo archivo .txt en /var/www/html/uploads (NFS storage01).
# Duración de la ocupación: {{ client02_ocupacion_segundos | default(60) }}s
#   (tiempo que el curl mantiene la conexión abierta, vía sleep() en el PHP).
# Tiempo de descanso entre ciclos: {{ client02_descanso_segundos | default(60) }}s
#   (sin peticiones activas — el script duerme antes de repetir el ciclo).
# Ambos valores son configurables vía --extra-vars sin tocar el script,
# ya que se inyectan como variables Ansible al momento del despliegue.
# El servicio se ejecuta como traffic-client02.service (systemd), con
# reinicio automático (Restart=on-failure) solo ante fallos inesperados —
# el ciclo normal ocupa/descansa lo controla el propio bucle while true.
# ==============================================================================
---
- name: "Instalar utilidades requeridas (Debian/Ubuntu)"
  ansible.builtin.apt:
    name: ['curl', 'jq']
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: "Instalar utilidades requeridas (RHEL/AlmaLinux)"
  ansible.builtin.dnf:
    name: ['curl', 'jq']
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: "Desplegar script de tráfico cíclico para Client02 (Ocupa y Suelta)"
  ansible.builtin.copy:
    dest: /usr/local/bin/client02_traffic.sh
    mode: '0755'
    content: |
      #!/bin/bash
      VIP="10.10.10.30"
      
      # Variables controladas por Ansible (puedes cambiarlas con --extra-vars)
      DURATION={{ client02_ocupacion_segundos | default(60) }}
      DESCANSO={{ client02_descanso_segundos | default(60) }}

      echo "[$(date +'%T')] === INICIANDO SERVICIO CÍCLICO (Ocupa: ${DURATION}s, Descansa: ${DESCANSO}s) ==="

      while true; do
          echo "[$(date +'%T')] ---> ENVIANDO PETICIÓN ÚNICA (Ocupará el servidor ${DURATION}s)"
          
          # curl con timeout un poco mayor a la duración para evitar cortes prematuros
          curl -s -m $((DURATION + 15)) "http://${VIP}/?action=storage_write&duration=${DURATION}" | jq -c '{nodo: .atendido_por, accion: .accion, archivo: .archivo_creado}'
          
          echo "[$(date +'%T')] ---> PETICIÓN FINALIZADA. Liberando servidor y esperando ${DESCANSO}s..."
          
          # El script duerme, garantizando CERO peticiones durante este tiempo
          sleep ${DESCANSO}
      done

- name: "Configurar servicio systemd para ejecutar el ciclo continuamente"
  ansible.builtin.copy:
    dest: /etc/systemd/system/traffic-client02.service
    mode: '0644'
    content: |
      [Unit]
      Description=Generador de tráfico cíclico Client02 (Ocupa/Suelta controlado)
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/client02_traffic.sh
      # Restart=only actúa si el script falla inesperadamente (ej. caída de red).
      # El ciclo normal lo maneja el bucle 'while true' del script.
      Restart=on-failure
      RestartSec=10
      StandardOutput=append:/var/log/client02_traffic.log
      StandardError=append:/var/log/client02_traffic.log

      [Install]
      WantedBy=multi-user.target

- name: "Recargar systemd, habilitar e iniciar el servicio cíclico"
  ansible.builtin.systemd:
    name: traffic-client02
    state: started
    enabled: true
    daemon_reload: true
