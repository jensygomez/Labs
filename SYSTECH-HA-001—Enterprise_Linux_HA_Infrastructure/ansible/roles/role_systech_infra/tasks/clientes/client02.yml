# ==============================================================================
# CLIENT02 — ESCRITURA EN STORAGE (NFS webdata) CON DURACIÓN VARIABLE
# ==============================================================================
# Simula un cliente que ejecuta UNA petición de escritura por ciclo hacia la
# VIP (10.10.10.30), la cual es atendida por un app node (round-robin HAProxy)
# y escribe UN solo archivo .txt en /var/www/html/uploads (NFS storage01).

# A diferencia de versiones anteriores con ciclos fijos, client02 introduce
# variabilidad real: cada ciclo elige una duración de ocupación y un descanso
# ALEATORIOS dentro de un rango configurable, simulando que no todos los
# procesos de escritura tardan lo mismo ni se ejecutan con la misma cadencia.

# Rangos configurables vía --extra-vars:
#   client02_ocupacion_min / client02_ocupacion_max  (default: 15-45s)
#   client02_descanso_min  / client02_descanso_max   (default: 20-60s)

# El servicio se ejecuta como traffic-client02.service (systemd).
#==============================================================================
---
- name: "Instalar utilidades requeridas (Debian/Ubuntu)"
  ansible.builtin.apt:
    name: ['curl', 'jq']
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: "Instalar utilidades requeridas (RHEL/AlmaLinux)"
  ansible.builtin.dnf:
    name: ['curl', 'jq']
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: "Desplegar script de tráfico cíclico para Client02 (Escritura NFS Variable)"
  ansible.builtin.copy:
    dest: /usr/local/bin/client02_traffic.sh
    mode: '0755'
    content: |
      #!/bin/bash
      VIP="10.10.10.30"
      # Rangos controlados por Ansible (puedes cambiarlos con --extra-vars)
      OCUPA_MIN={{ client02_ocupacion_min | default(15) }}
      OCUPA_MAX={{ client02_ocupacion_max | default(45) }}
      DESCANSO_MIN={{ client02_descanso_min | default(20) }}
      DESCANSO_MAX={{ client02_descanso_max | default(60) }}

      echo "[$(date +'%T')] === INICIANDO SERVICIO CÍCLICO (Ocupa: ${OCUPA_MIN}-${OCUPA_MAX}s, Descansa: ${DESCANSO_MIN}-${DESCANSO_MAX}s) ==="

      while true; do
          DURATION=$(( (RANDOM % (OCUPA_MAX - OCUPA_MIN + 1)) + OCUPA_MIN ))
          DESCANSO=$(( (RANDOM % (DESCANSO_MAX - DESCANSO_MIN + 1)) + DESCANSO_MIN ))

          echo "[$(date +'%T')] ---> ENVIANDO PETICIÓN DE ESCRITURA (Ocupará el servidor ${DURATION}s)"
          curl -s -m $((DURATION + 15)) "http://${VIP}/?action=storage_write&duration=${DURATION}" \
            | jq -c '{nodo: .atendido_por, accion: .accion, archivo: .archivo_creado}'

          echo "[$(date +'%T')] ---> PETICIÓN FINALIZADA. Liberando servidor y esperando ${DESCANSO}s..."
          sleep ${DESCANSO}
      done

    
- name: "Configurar servicio systemd para ejecutar el ciclo continuamente"
  ansible.builtin.copy:
    dest: /etc/systemd/system/traffic-client02.service
    mode: '0644'
    content: |
      [Unit]
      Description=Generador de tráfico cíclico Client02 (Escritura NFS, duración variable)
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/client02_traffic.sh
      Restart=on-failure
      RestartSec=10
      StandardOutput=append:/var/log/client02_traffic.log
      StandardError=append:/var/log/client02_traffic.log

      [Install]
      WantedBy=multi-user.target

- name: "Recargar systemd, habilitar e iniciar el servicio cíclico"
  ansible.builtin.systemd:
    name: traffic-client02
    state: started
    enabled: true
    daemon_reload: true
    
- name: "Reiniciar el servicio si el script o la unit file cambiaron (idempotente)"
  ansible.builtin.systemd:
    name: traffic-client02
    state: restarted
  when: client02_script.changed or client02_unit.changed
