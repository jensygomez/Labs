---
- name: "Instalar utilidades requeridas (Debian/Ubuntu)"
  ansible.builtin.apt:
    name: ['curl', 'jq']
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: "Instalar utilidades requeridas (RHEL/AlmaLinux)"
  ansible.builtin.dnf:
    name: ['curl', 'jq']
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: "Desplegar script de tráfico para Client02 (ocupación prolongada)"
  ansible.builtin.copy:
    dest: /usr/local/bin/client02_traffic.sh
    mode: '0755'
    content: |
      #!/bin/bash
      VIP="10.10.10.30"
      DURATION={{ client02_ocupacion_segundos | default(20) }}
      
      echo "[$(date +'%T')] --- INICIANDO ocupación de ${DURATION} segundos ---"
      curl -s "http://${VIP}/?action=storage_write&duration=${DURATION}" | jq -c '{nodo: .atendido_por, accion: .accion, archivo: .archivo_creado}'
      echo "[$(date +'%T')] --- OCUPACIÓN FINALIZADA ---"

- name: "Configurar servicio systemd con RestartSec={{ client02_descanso_segundos | default(45) }}"
  ansible.builtin.copy:
    dest: /etc/systemd/system/traffic-client02.service
    mode: '0644'
    content: |
      [Unit]
      Description=Generador de tráfico Client02 (ocupación controlada)
      After=network.target
      
      [Service]
      Type=simple
      ExecStart=/usr/local/bin/client02_traffic.sh
      Restart=always
      RestartSec={{ client02_descanso_segundos | default(40) }}
      StandardOutput=append:/var/log/client02_traffic.log
      StandardError=append:/var/log/client02_traffic.log
      
      [Install]
      WantedBy=multi-user.target

- name: "Habilitar e iniciar el servicio"
  ansible.builtin.systemd:
    name: traffic-client02
    state: started
    enabled: true
    daemon_reload: true
