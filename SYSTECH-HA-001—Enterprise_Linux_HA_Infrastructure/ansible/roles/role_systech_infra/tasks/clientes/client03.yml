---
- name: "Instalar utilidades requeridas (Debian/Ubuntu)"
  ansible.builtin.apt:
    name: ['curl', 'jq']
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: "Instalar utilidades requeridas (RHEL/AlmaLinux)"
  ansible.builtin.dnf:
    name: ['curl', 'jq']
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: "Desplegar script de tráfico para Client03 (Ciclo Reporte Analítico - 12s)"
  ansible.builtin.copy:
    dest: /usr/local/bin/client03_traffic.sh
    mode: '0755'
    content: |
      #!/bin/bash
      VIP="10.10.10.30"
      
      echo "[$(date +'%T')] SOLICITANDO Reporte Analítico Masivo (LENTO - 12s)..."
      curl -s "http://${VIP}/?action=heavy_report" | jq -c '{nodo: .atendido_por, accion: .accion}'
      sleep 3
      echo "[$(date +'%T')] --- RONDA CLIENTE 03 FINALIZADA. El script termina y descansa ---"

- name: "Crear servicio systemd para Client03 con pausa entre ejecuciones"
  ansible.builtin.copy:
    dest: /etc/systemd/system/traffic-client03.service
    mode: '0644'
    content: |
      [Unit]
      Description=Generador de tráfico Client03 (Heavy Report Load controlado por Systemd)
      After=network.target
      
      [Service]
      Type=simple
      ExecStart=/usr/local/bin/client03_traffic.sh
      Restart=always
      RestartSec=20
      StandardOutput=append:/var/log/client03_traffic.log
      StandardError=append:/var/log/client03_traffic.log
      
      [Install]
      WantedBy=multi-user.target

- name: "Habilitar e iniciar el servicio"
  ansible.builtin.systemd:
    name: traffic-client03
    state: started
    enabled: true
    daemon_reload: true
