# ==============================================================================
# CLIENT01 — CICLO DE OCUPACIÓN/DESCANSO CON CONSULTA SQL + EVIDENCIA EN STORAGE
# ==============================================================================
# Simula un cliente que ejecuta UNA consulta SQL por ciclo hacia la VIP
# (10.10.10.30), atendida por un app node (round-robin HAProxy), que a su vez
# consulta PostgreSQL en db01 (datos físicos en storage01 vía NFS pgdata).
# Como evidencia de que la consulta se completó con éxito, el app node que
# atendió la petición escribe UN archivo .txt en /var/www/html/uploads
# (NFS webdata en storage01), igual que hace client02.
# Duración de la ocupación: {{ client01_ocupacion_segundos | default(60) }}s
#   (tiempo que el curl mantiene la conexión abierta, vía sleep() en el PHP,
#    simulando carga sostenida en el servidor que atendió la petición).
# Tiempo de descanso entre ciclos: {{ client01_descanso_segundos | default(60) }}s
#   (sin peticiones activas — el script duerme antes de repetir el ciclo).
# Ambos valores son configurables vía --extra-vars sin tocar el script,
# ya que se inyectan como variables Ansible al momento del despliegue.
# El servicio se ejecuta como traffic-client01.service (systemd), con
# reinicio automático (Restart=on-failure) solo ante fallos inesperados —
# el ciclo normal ocupa/descansa lo controla el propio bucle while true.
# ==============================================================================
---
- name: "Instalar utilidades requeridas (Debian/Ubuntu)"
  ansible.builtin.apt:
    name: ['curl', 'jq']
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: "Instalar utilidades requeridas (RHEL/AlmaLinux)"
  ansible.builtin.dnf:
    name: ['curl', 'jq']
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: "Desplegar script de tráfico cíclico para Client01 (Consulta SQL + Evidencia)"
  ansible.builtin.copy:
    dest: /usr/local/bin/client01_traffic.sh
    mode: '0755'
    content: |
      #!/bin/bash
      VIP="10.10.10.30"

      # Variables controladas por Ansible (puedes cambiarlas con --extra-vars)
      DURATION={{ client01_ocupacion_segundos | default(60) }}
      DESCANSO={{ client01_descanso_segundos | default(60) }}

      echo "[$(date +'%T')] === INICIANDO SERVICIO CÍCLICO (Ocupa: ${DURATION}s, Descansa: ${DESCANSO}s) ==="

      while true; do
          echo "[$(date +'%T')] ---> ENVIANDO CONSULTA SQL (Ocupará el servidor ${DURATION}s)"

          curl -s -m $((DURATION + 15)) "http://${VIP}/?action=client01_query&duration=${DURATION}" | jq -c '{nodo: .atendido_por, accion: .accion, resultados: .total_resultados, archivo: .archivo_creado}'

          echo "[$(date +'%T')] ---> CONSULTA FINALIZADA. Liberando servidor y esperando ${DESCANSO}s..."

          sleep ${DESCANSO}
      done

- name: "Configurar servicio systemd para ejecutar el ciclo continuamente"
  ansible.builtin.copy:
    dest: /etc/systemd/system/traffic-client01.service
    mode: '0644'
    content: |
      [Unit]
      Description=Generador de tráfico cíclico Client01 (Consulta SQL + Evidencia, controlado por Systemd)
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/client01_traffic.sh
      Restart=on-failure
      RestartSec=10
      StandardOutput=append:/var/log/client01_traffic.log
      StandardError=append:/var/log/client01_traffic.log

      [Install]
      WantedBy=multi-user.target

- name: "Recargar systemd, habilitar e iniciar el servicio cíclico"
  ansible.builtin.systemd:
    name: traffic-client01
    state: started
    enabled: true
    daemon_reload: true
