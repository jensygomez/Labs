---
# ==============================================================================
# DNS CLIENT SETUP (Configurar resolv.conf en todos los nodos)
# ==============================================================================
- name: "Detener systemd-resolved en clientes para evitar conflictos de caché"
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  ignore_errors: true
  tags: ['network', 'dns_client']

- name: "Eliminar symlink de resolv.conf si existe (común en Ubuntu)"
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  tags: ['network', 'dns_client']

- name: "Desplegar /etc/resolv.conf apuntando a dns01 (10.10.10.20)"
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Gestionado por Ansible - SYSTECH DNS Centralizado
      search lab.systech.internal
      nameserver 10.10.10.20
      nameserver 8.8.8.8
    owner: root
    group: root
    mode: '0644'
  tags: ['network', 'dns_client']

- name: "Verificar resolución DNS desde el nodo (prueba de humo)"
  ansible.builtin.command: "dig +short app01.lab.systech.internal @10.10.10.20"
  register: dns_test
  changed_when: false
  failed_when: false
  tags: ['network', 'dns_client']

- name: "Mostrar resultado de validación DNS"
  ansible.builtin.debug:
    msg: "Prueba de resolución para app01.lab.systech.internal: {{ dns_test.stdout | default('FALLIDA') }}"
  tags: ['network', 'dns_client']
