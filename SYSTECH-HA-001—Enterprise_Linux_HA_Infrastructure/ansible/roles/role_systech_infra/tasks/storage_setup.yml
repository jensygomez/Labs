---
# ==============================================================================
# STORAGE SETUP — AlmaLinux 9 (VM)
# ==============================================================================

- name: "Instalar paquetes de NFS, LVM e iSCSI"
  ansible.builtin.dnf:
    name:
      - nfs-utils
      - lvm2
      - firewalld
      - targetcli
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: "Crear grupo postgres en storage01 con GID 26"
  ansible.builtin.group:
    name: postgres
    gid: 26
    system: true
  when: ansible_hostname == "storage01"

- name: "Crear usuario postgres en storage01 con UID 26"
  ansible.builtin.user:
    name: postgres
    uid: 26
    group: postgres
    create_home: false
    system: true
  when: ansible_hostname == "storage01"

- name: "Crear Volume Group en storage01"
  community.general.lvg:
    vg: "vg_storage"
    pvs: "/dev/sdb,/dev/sdc,/dev/sdd,/dev/sde"
  when: ansible_os_family == "RedHat"

- name: "Crear Logical Volumes para NFS"
  community.general.lvol:
    vg: "vg_storage"
    lv: "{{ item.lv_name }}"
    size: "{{ item.lv_size }}"
  loop: "{{ nfs_exports }}"
  when: ansible_os_family == "RedHat"

- name: "Crear Filesystem XFS en los LVs de NFS"
  community.general.filesystem:
    fstype: xfs
    dev: "/dev/vg_storage/{{ item.lv_name }}"
  loop: "{{ nfs_exports }}"
  when: ansible_os_family == "RedHat"

- name: "Crear directorios de exportación NFS"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0777'
  loop: "{{ nfs_exports }}"
  when: ansible_os_family == "RedHat"

- name: "Montar LVs en los puntos de exportación NFS"
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "/dev/vg_storage/{{ item.lv_name }}"
    fstype: xfs
    state: mounted
  loop: "{{ nfs_exports }}"
  when: ansible_os_family == "RedHat"

- name: "Configurar archivo /etc/exports"
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    mode: '0644'
  notify: Restart NFS
  when: ansible_os_family == "RedHat"

- name: "Asegurar que los servicios de NFS y Firewalld estén activos"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - nfs-server
    - firewalld
  when: ansible_os_family == "RedHat"

- name: "Permitir servicios NFS en Firewalld"
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - nfs
    - mountd
    - rpc-bind
  when: ansible_os_family == "RedHat"

