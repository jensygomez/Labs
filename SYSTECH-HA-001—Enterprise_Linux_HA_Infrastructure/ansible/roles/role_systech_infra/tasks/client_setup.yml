---
# ==============================================================================
# CLIENT SETUP - Cliente de Pruebas y Generador de Tráfico
# ==============================================================================
# Este nodo se usa para:
# 1. Generar tráfico continuo hacia la VIP (10.10.10.30)
# 2. Validar resolución DNS de toda la infraestructura
# 3. Diagnosticar problemas de red y conectividad
# ==============================================================================

- name: "Instalar paquetes básicos y utilidades"
  ansible.builtin.apt:
    name:
      - curl
      - python3
      - jq
      - wget
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  tags: ['client', 'client_basic']

# ==============================================================================
# HERRAMIENTAS DE DIAGNÓSTICO DE RED Y DNS
# ==============================================================================
- name: "Instalar herramientas de diagnóstico de red y DNS"
  ansible.builtin.apt:
    name:
      - dnsutils          # dig, nslookup, host
      - iputils-ping      # ping
      - traceroute        # traceroute
      - net-tools         # netstat, ifconfig (legacy pero útil)
      - iproute2          # ip, ss (moderno)
      - telnet            # pruebas de puertos TCP
      - netcat-openbsd    # nc (pruebas de conectividad)
    state: present
  when: ansible_os_family == "Debian"
  tags: ['client', 'network_tools']

# ==============================================================================
# SCRIPT DE TRÁFICO CONTINUO (Visual Dashboard)
# ==============================================================================
- name: "Desplegar script de tráfico continuo (Visual Dashboard)"
  ansible.builtin.copy:
    dest: /usr/local/bin/infinite_traffic.sh
    mode: '0755'
    content: |
      #!/bin/bash
      # ====================================================================
      # SYSTECH LAB — REAL-TIME TRAFFIC & HEALTH MONITOR (Visual Dashboard)
      # ====================================================================
      VIP="10.10.10.30"
      URL="http://${VIP}/"
      
      print_header() {
          clear
          echo "=================================================================="
          echo "       SYSTECH LAB — REAL-TIME TRAFFIC & HEALTH MONITOR           "
          echo "=================================================================="
          printf "+------------+--------+--------+-----------+--------------------+\n"
          printf "| %-10s | %-6s | %-6s | %-9s | %-18s |\n" "TIME" "HTTP" "NODE" "LATENCY" "APP STATUS"
          printf "+------------+--------+--------+-----------+--------------------+\n"
      }
      
      print_header
      
      while true; do
          TIMESTAMP=$(date +"%H:%M:%S")
          RESPONSE=$(curl -s -w "\n%{http_code} %{time_total}" --max-time 5 -o /tmp/traffic_body.json "$URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1 | awk '{print $1}')
          LATENCY=$(echo "$RESPONSE" | tail -n 1 | awk '{print $2}')
          
          if [ -f /tmp/traffic_body.json ] && [ "$HTTP_CODE" == "200" ]; then
              NODE=$(grep -o '"atendido_por": *"[^"]*"' /tmp/traffic_body.json | cut -d'"' -f4)
              APP_STATUS=$(grep -o '"status": *"[^"]*"' /tmp/traffic_body.json | cut -d'"' -f4)
              [ -z "$NODE" ] && NODE="unknown"
              [ -z "$APP_STATUS" ] && APP_STATUS="unknown"
          else
              NODE="---"
              APP_STATUS="ERROR"
          fi
          
          if [ "$HTTP_CODE" == "200" ]; then
              COLOR="\e[32m"
          elif [ "$HTTP_CODE" == "502" ]; then
              COLOR="\e[31m"
          else
              COLOR="\e[33m"
          fi
          
          RESET="\e[0m"
          printf "| ${COLOR}%-10s | %-6s | %-6s | %-9s | %-18s${RESET} |\n" \
              "$TIMESTAMP" "$HTTP_CODE" "$NODE" "${LATENCY}s" "$APP_STATUS"
          
          sleep 2
      done
  tags: ['client', 'client_traffic']

# ==============================================================================
# SERVICIO SYSTEMD PARA TRÁFICO CONTINUO
# ==============================================================================
- name: "Crear servicio systemd para el tráfico continuo"
  ansible.builtin.copy:
    dest: /etc/systemd/system/infinite-scroll.service
    mode: '0644'
    content: |
      [Unit]
      Description=Generador de tráfico sintético continuo para HAProxy
      After=network.target
      
      [Service]
      Type=simple
      ExecStart=/usr/local/bin/infinite_traffic.sh
      Restart=always
      RestartSec=5
      User=root
      
      [Install]
      WantedBy=multi-user.target
  tags: ['client', 'client_service']

- name: "Recargar systemd, habilitar e iniciar el servicio de tráfico"
  ansible.builtin.systemd:
    name: infinite-scroll
    state: started
    enabled: true
    daemon_reload: true
  tags: ['client', 'client_service']
