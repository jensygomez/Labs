---
# ==============================================================================
# GUÍA DE EJECUCIÓN POR COMPONENTES (TAGS)
# ==============================================================================
# Este archivo orquesta el despliegue modular de toda la infraestructura.
#
# 1. Ejecutar TODO el stack (comportamiento por defecto):
#    ansible-playbook -i inventories/production/hosts.yml site.yml --ask-vault-pass
#
# 2. Ejecutar SOLO un componente específico:
#    ansible-playbook -i inventories/production/hosts.yml site.yml --tags 'lb' --ask-vault-pass
#    ansible-playbook -i inventories/production/hosts.yml site.yml --tags 'client01' --ask-vault-pass
#
# 3. Ejecutar múltiples componentes a la vez:
#    ansible-playbook -i inventories/production/hosts.yml site.yml --tags 'dns,lb,client' --ask-vault-pass
#
# 4. Listar todos los tags disponibles:
#    ansible-playbook -i inventories/production/hosts.yml site.yml --list-tags
# ==============================================================================

- name: "Configurar Almacenamiento (NFS + iSCSI)"
  ansible.builtin.include_tasks:
    file: storage_setup.yml
    apply:
      tags: ['storage']
  when: "'storage_nodes' in group_names"
  tags: ['storage']

- name: "Configurar Base de Datos (PostgreSQL + iSCSI)"
  ansible.builtin.include_tasks:
    file: database_setup.yml
    apply:
      tags: ['database', 'db']
  when: "'db_nodes' in group_names"
  tags: ['database', 'db']

- name: "Configurar Aplicación Web (Apache + PHP + NFS)"
  ansible.builtin.include_tasks:
    file: web_app_setup.yml
    apply:
      tags: ['web', 'app']
  when: "'app_nodes' in group_names"
  tags: ['web', 'app']

- name: "Configurar Load Balancers (HAProxy + Keepalived)"
  ansible.builtin.include_tasks:
    file: lb_setup.yml
    apply:
      tags: ['lb', 'loadbalancer']
  when: "'lb_nodes' in group_names"
  tags: ['lb', 'loadbalancer']
# ==============================================================================
# FREEIPA - SERVIDOR DE IDENTIDAD CENTRALIZADA
# ==============================================================================
# Despliega FreeIPA Server en freeipa01 para gestión centralizada de usuarios.
# Los clientes (app, db, lb) se unen al dominio mediante SSSD.
# ==============================================================================

- name: "Configurar Servidor FreeIPA (LDAP + Kerberos + DNS)"
  ansible.builtin.include_tasks:
    file: freeipa/freeipa_server_setup.yml
    apply:
      tags: ['freeipa', 'freeipa_server']
  when: "inventory_hostname == 'freeipa01'"
  tags: ['freeipa', 'freeipa_server']

- name: "Configurar Clientes FreeIPA (SSSD) en todos los nodos"
  ansible.builtin.include_tasks:
    file: freeipa/freeipa_client_setup.yml
    apply:
      tags: ['freeipa', 'freeipa_client']
  when: "'app_nodes' in group_names or 'db_nodes' in group_names or 'lb_nodes' in group_names"
  tags: ['freeipa', 'freeipa_client']
  
- name: "Poblar FreeIPA con datos de prueba (usuarios, grupos, HBAC, sudo)"
  ansible.builtin.include_tasks:
    file: freeipa_seed_data.yml
    apply:
      tags: ['freeipa_seed']
  when: "inventory_hostname == 'freeipa01'"
  tags: ['freeipa_seed']

# ==============================================================================
# CLIENTES - SIMULACIÓN DE TRÁFICO ASINCRÓNICO (3 PERFILES DISTINTOS)
# ==============================================================================
# Cada perfil se aplica SOLO a su host correspondiente (1:1 por nombre),
# no a todo el grupo client_nodes, para evitar que los 3 perfiles se
# desplieguen simultáneamente en los 3 hosts.
# ==============================================================================

- name: "Configurar Cliente 01 (A-B State Flip & Read Cycle)"
  ansible.builtin.include_tasks:
    file: clientes/client01.yml
    apply:
      tags: ['client', 'client01']
  when: "inventory_hostname == 'client01'"
  tags: ['client', 'client01']

- name: "Configurar Cliente 02 (Storage Simulation Cycle)"
  ansible.builtin.include_tasks:
    file: clientes/client02.yml
    apply:
      tags: ['client', 'client02']
  when: "inventory_hostname == 'client02'"
  tags: ['client', 'client02']

- name: "Configurar Cliente 03 (Heavy Analytical Report Load)"
  ansible.builtin.include_tasks:
    file: clientes/client03.yml
    apply:
      tags: ['client', 'client03']
  when: "inventory_hostname == 'client03'"
  tags: ['client', 'client03']

- name: "Configurar Cliente 04 (Heavy Analytical Report Load)"
  ansible.builtin.include_tasks:
    file: clientes/client04.yml
    apply:
      tags: ['client', 'client04']
  when: "inventory_hostname == 'client04'"
  tags: ['client', 'client04']

# ==============================================================================
# FREEIPA DNS - POBLACIÓN DINÁMICA DESDE EL INVENTARIO
# ==============================================================================
- name: "Poblar DNS de FreeIPA con todos los hosts del inventario y configurar resolv.conf"
  ansible.builtin.include_tasks:
    file: freeipa/freeipa_dns_setup.yml
    apply:
      tags: ['freeipa_dns']
  vars:
    dns_domain: "systech.local"
    freeipa_ip: "10.10.10.15"
  tags: ['freeipa_dns']

