---
# ==============================================================================
# GUÍA DE EJECUCIÓN POR COMPONENTES (TAGS)
# ==============================================================================
# Este archivo orquesta el despliegue modular de toda la infraestructura.
#
# 1. Ejecutar TODO el stack (comportamiento por defecto):
#    ansible-playbook -i inventories/production/hosts.yml site.yml --ask-vault-pass
#
# 2. Ejecutar SOLO un componente específico:
#    ansible-playbook -i inventories/production/hosts.yml site.yml --tags 'lb' --ask-vault-pass
#    ansible-playbook -i inventories/production/hosts.yml site.yml --tags 'client01' --ask-vault-pass
#
# 3. Ejecutar múltiples componentes a la vez:
#    ansible-playbook -i inventories/production/hosts.yml site.yml --tags 'dns,lb,client' --ask-vault-pass
#
# 4. Listar todos los tags disponibles:
#    ansible-playbook -i inventories/production/hosts.yml site.yml --list-tags
# ==============================================================================

- name: "Configurar Almacenamiento (NFS + iSCSI)"
  ansible.builtin.include_tasks:
    file: storage_setup.yml
    apply:
      tags: ['storage']
  when: "'storage_nodes' in group_names"
  tags: ['storage']

- name: "Configurar Base de Datos (PostgreSQL + iSCSI)"
  ansible.builtin.include_tasks:
    file: database_setup.yml
    apply:
      tags: ['database', 'db']
  when: "'db_nodes' in group_names"
  tags: ['database', 'db']

- name: "Configurar Aplicación Web (Apache + PHP + NFS)"
  ansible.builtin.include_tasks:
    file: web_app_setup.yml
    apply:
      tags: ['web', 'app']
  when: "'app_nodes' in group_names"
  tags: ['web', 'app']

- name: "Configurar Load Balancers (HAProxy + Keepalived)"
  ansible.builtin.include_tasks:
    file: lb_setup.yml
    apply:
      tags: ['lb', 'loadbalancer']
  when: "'lb_nodes' in group_names"
  tags: ['lb', 'loadbalancer']

# ==============================================================================
# CLIENTES - SIMULACIÓN DE TRÁFICO ASINCRÓNICO (3 PERFILES DISTINTOS)
# ==============================================================================
# Se despliegan los 3 perfiles para garantizar la desincronización temporal
# y simular comportamiento humano realista contra el VIP del Load Balancer.
# ==============================================================================


- name: "Configurar Cliente 01 (A-B State Flip & Read Cycle)"
  ansible.builtin.include_tasks:
    file: clientes/client01.yml
    apply:
      tags: ['client', 'client01']
  when: "'client_nodes' in group_names"
  tags: ['client', 'client01']

- name: "Configurar Cliente 02 (Storage Simulation Cycle)"
  ansible.builtin.include_tasks:
    file: clientes/client02.yml
    apply:
      tags: ['client', 'client02']
  when: "'client_nodes' in group_names"
  tags: ['client', 'client02']

- name: "Configurar Cliente 03 (Heavy Analytical Report Load)"
  ansible.builtin.include_tasks:
    file: clientes/client03.yml
    apply:
      tags: ['client', 'client03']
  when: "'client_nodes' in group_names"
  tags: ['client', 'client03']

# ==============================================================================
# DNS - SERVIDOR CENTRALIZADO
# ==============================================================================
- name: "Desplegar Servidor DNS (dnsmasq)"
  ansible.builtin.include_tasks:
    file: dns/main.yml
    apply:
      tags: ['dns', 'dns_server']
  when: "'dns_nodes' in group_names"
  tags: ['dns', 'dns_server']

# ==============================================================================
# RED - CONFIGURACIÓN DE CLIENTES DNS
# Importante: Esto debe ejecutarse en TODOS los nodos para que usen dns01.
# ==============================================================================
- name: "Configurar resolv.conf en todos los nodos para usar DNS Central"
  ansible.builtin.include_tasks:
    file: dns/network_setup.yml
    apply:
      tags: ['network', 'dns_client']
  when: "'dns_nodes' not in group_names"
  tags: ['network', 'dns_client']
