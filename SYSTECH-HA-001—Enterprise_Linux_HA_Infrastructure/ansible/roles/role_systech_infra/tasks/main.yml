---
# ==============================================================================
# GUÍA DE EJECUCIÓN POR COMPONENTES (TAGS)
# ==============================================================================
# Este archivo orquesta el despliegue modular de toda la infraestructura.
# Gracias a los tags, puedes ejecutar componentes específicos sin tocar 
# el resto del stack.
#
# 1. Ejecutar TODO el stack (comportamiento por defecto):
#    ansible-playbook -i inventories/production/hosts.yml site.yml --ask-vault-pass
#
# 2. Ejecutar SOLO un componente específico:
#    ansible-playbook -i inventories/production/hosts.yml site.yml --tags dns --ask-vault-pass
#    ansible-playbook -i inventories/production/hosts.yml site.yml --tags lb --ask-vault-pass
#    ansible-playbook -i inventories/production/hosts.yml site.yml --tags storage --ask-vault-pass
#    ansible-playbook -i inventories/production/hosts.yml site.yml --tags client --ask-vault-pass

#
# 3. Ejecutar múltiples componentes a la vez:
#    ansible-playbook -i inventories/production/hosts.yml site.yml --tags 'dns,lb' --ask-vault-pass
#
# 4. Ejecutar TODO EXCEPTO un componente (ej. saltar Zabbix si ya está listo):
#    ansible-playbook -i inventories/production/hosts.yml site.yml --skip-tags zabbix --ask-vault-pass
#
# 5. Listar todos los tags disponibles en este rol para consultar:
#    ansible-playbook -i inventories/production/hosts.yml site.yml --list-tags
# ==============================================================================

- name: "Configurar Almacenamiento (NFS + iSCSI)"
  ansible.builtin.include_tasks: storage_setup.yml
  when: "'storage_nodes' in group_names"
  tags: ['storage']

- name: "Configurar Base de Datos (PostgreSQL + iSCSI)"
  ansible.builtin.include_tasks: database_setup.yml
  when: "'db_nodes' in group_names"
  tags: ['database', 'db']

- name: "Configurar Aplicación Web (Apache + PHP + NFS)"
  ansible.builtin.include_tasks: web_app_setup.yml
  when: "'app_nodes' in group_names"
  tags: ['web', 'app']

- name: "Configurar Load Balancers (HAProxy + Keepalived)"
  ansible.builtin.include_tasks: lb_setup.yml
  when: "'lb_nodes' in group_names"
  tags: ['lb', 'loadbalancer']

- name: "Configurar Cliente de Pruebas"
  ansible.builtin.include_tasks: client_setup.yml
  when: "'client_nodes' in group_names"
  tags: ['client']

# ==============================================================================
# DNS - SERVIDOR CENTRALIZADO
# ==============================================================================
- name: "Desplegar Servidor DNS (dnsmasq)"
  ansible.builtin.include_tasks: dns/main.yml
  when: "'dns_nodes' in group_names"
  tags: ['dns', 'dns_server']

# ==============================================================================
# RED - CONFIGURACIÓN DE CLIENTES DNS
# Importante: Esto debe ejecutarse en TODOS los nodos (app, db, lb, client)
# para que usen dns01 como resolver.
# ==============================================================================
- name: "Configurar resolv.conf en todos los nodos para usar DNS Central"
  ansible.builtin.include_tasks: dns/network_setup.yml
  when: "'dns_nodes' not in group_names" # Opcional: para no aplicarlo a sí mismo, o déjalo en 'all'
  tags: ['network', 'dns_client']


# ==============================================================================
# ZABBIX - Monitoreo Centralizado
# Se agrega un include por fase. Cada fase tiene su propio sub-tag para 
# permitir ejecuciones granulares (ej. --tags zabbix_server).
# ==============================================================================
- name: "Zabbix Fase 1: Base de datos PostgreSQL"
  ansible.builtin.include_tasks: zabbix/01_postgresql_setup.yml
  when: "'monitoring_nodes' in group_names"
  tags: ['zabbix', 'zabbix_db']

- name: "Zabbix Fase 2: Repositorio + Esquema"
  ansible.builtin.include_tasks: zabbix/02_zabbix_repo_and_schema.yml
  when: "'monitoring_nodes' in group_names"
  tags: ['zabbix', 'zabbix_schema']

- name: "Zabbix Fase 3: zabbix-server"
  ansible.builtin.include_tasks: zabbix/03_zabbix_server_setup.yml
  when: "'monitoring_nodes' in group_names"
  tags: ['zabbix', 'zabbix_server']
  
- name: "Zabbix Fase 4: Frontend Web"
  ansible.builtin.include_tasks: zabbix/04_zabbix_frontend_setup.yml
  when: "'monitoring_nodes' in group_names"
  tags: ['zabbix', 'zabbix_frontend']
  
- name: "Zabbix Fase 5: Zabbix Agent en todos los nodos"
  ansible.builtin.include_tasks: zabbix/05_zabbix_agent_setup.yml
  # Nota: Sin 'when' de grupo, se ejecuta en TODOS los nodos (storage, db, app, lb, client, dns).
  tags: ['zabbix', 'zabbix_agent']
  
- name: "Zabbix Fase 6: Registro API de Hosts y Scenarios"
  ansible.builtin.include_tasks: zabbix/06_zabbix_api_config.yml
  # Se ejecuta una sola vez desde el control node al final del playbook.
  tags: ['zabbix', 'zabbix_api']
