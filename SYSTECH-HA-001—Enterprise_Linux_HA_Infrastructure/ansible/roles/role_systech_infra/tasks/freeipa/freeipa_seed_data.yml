# ---
# ==============================================================================
# FREEIPA SEED DATA PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
# ==============================================================================
# PLAYBOOK ID   : freeipa_seed_data
# VERSION       : 1.0
# AUTHOR        : SYSTECH-HA-001 Lab Team
# LAST UPDATE   : September 2026
# ==============================================================================
# PURPOSE       : Populate FreeIPA server with realistic test data for
#                 troubleshooting labs, including users, groups, HBAC rules,
#                 and sudo rules. This creates a multi-tier access control
#                 environment that mirrors enterprise production scenarios.
# 
# TARGET SERVER : freeipa01.systech.local (10.10.10.15)
# PREREQUISITES : 
#   - FreeIPA server must be fully installed and configured
#   - /etc/ipa/default.conf must exist
#   - Kerberos KDC must be running
#   - Admin password: 'StrongAdminpass123!'
#   
# EXECUTION     : 
#   ansible-playbook -i inventories/production/hosts.yml site.yml \
#     --tags 'freeipa_seed' --ask-vault-pass
#   
# IDEMPOTENCY   : This playbook is 100% idempotent. Safe to run multiple times.
#                 All commands use 'changed_when: false' and 'failed_when: false'
#                 to prevent errors if resources already exist.
# ==============================================================================
#  WHAT THIS PLAYBOOK CREATES:
# ==============================================================================
# 
# GROUPS (4):
#   • sysadmins  - System Administrators with full infrastructure access
#   • webdevs    - Web Developers with access only to app nodes
#   • dbas       - Database Administrators with access only to db01
#   • auditors   - Auditors with restricted access to client01
# 
# USERS (5):
#   • jensyg   (sysadmins)  - Lab admin user, full sudo access
#   • dev01    (webdevs)   - Developer account 1
#   • dev02    (webdevs)   - Developer account 2
#   • dba01    (dbas)      - DBA account
#   • audit01  (auditors)  - Auditor account
#   
#   All passwords: 'LabPassword123!'
# 
# HBAC RULES (Host-Based Access Control):
#   • allow_sysadmins_all      → sysadmins can SSH to ALL hosts
#   • allow_webdevs_apps       → webdevs can SSH to app01, app02, app03 ONLY
#   • allow_dbas_db01          → dbas can SSH to db01 ONLY
#   • allow_auditors_client01  → auditors can SSH to client01 ONLY
# 
# SUDO RULES:
#   • sysadmins_sudo_all   → sysadmins can run ALL commands on ALL hosts
#   • dbas_sudo_pgsql      → dbas can manage PostgreSQL on db01 only
#                            (systemctl restart/status postgresql-15, journalctl)
# 
# ==============================================================================
# 🎯 ACCESS MATRIX (Who can access what):
# ==============================================================================
# 
# User      | Group      | app01 | app02 | app03 | db01 | client01 | Sudo
# ----------|------------|-------|-------|-------|------|----------|------
# jensyg    | sysadmins  |  ✅   |  ✅   |  ✅   |  ✅  |    ✅    | ALL
# dev01     | webdevs    |  ✅   |  ✅   |  ✅   |  ❌  |    ❌    | NO
# dev02     | webdevs    |  ✅   |  ✅   |  ✅   |  ❌  |    ❌    | NO
# dba01     | dbas       |  ❌   |     |  ❌   |  ✅  |    ❌    | PGSQL
# audit01   | auditors   |  ❌   |  ❌   |  ❌   |  ❌  |    ✅    | NO
# 
# ==============================================================================
# 🔍 HOW TO VERIFY AFTER EXECUTION:
# ==============================================================================
# 
# # SSH to freeipa01
# ssh ansible@10.10.10.15
# sudo -i
# 
# # List all users
# ipa user-find
# 
# # List all groups
# ipa group-find
# 
# # List HBAC rules
# ipa hbacrule-find
# 
# # List sudo rules
# ipa sudorule-find
# 
# # Test user authentication from app01
# ssh jensyg@app01.systech.local
# # Password: LabPassword123!
# 
# # Test HBAC restriction (should FAIL)
# ssh dba01@app01.systech.local
# # Expected: "Access denied by HBAC rule"
# 
# ==============================================================================
#  USE CASES FOR TROUBLESHOOTING LABS:
# ==============================================================================
# 
# Incident 010: User authentication fails despite correct password
#   → Break: Lock/expire jensyg account on ONE app node (asymmetric state)
#   → Symptom: jensyg can login to app01 but NOT to app02
#   → Diagnosis: passwd -S, chage -l, check SSSD cache
# 
# Incident (Future): User cannot access specific host
#   → Break: Modify or delete HBAC rule
#   → Symptom: dev01 gets "Access denied" on app02 but works on app01
#   → Diagnosis: ipa hbacrule-show, check HBAC test tool
# 
# Incident (Future): Sudo not working for DBA
#   → Break: Corrupt sudo rule or SSSD sudo configuration
#   → Symptom: dba01 cannot restart PostgreSQL despite rule existing
#   → Diagnosis: sudo -l, /var/log/secure, sssd sudo logs
# 
# Incident (Future): HBAC allows unauthorized access
#   → Break: Misconfigure HBAC rule (wrong host/group)
#   → Symptom: audit01 can SSH to db01 when they shouldn't
#   → Diagnosis: ipa hbacrule-show, audit HBAC rules
# 
# ==============================================================================
# ⚠️ IMPORTANT NOTES:
# ==============================================================================
# 
# 1. KERBEROS TICKET: This playbook obtains a temporary Kerberos ticket for
#    the 'admin' user at the start. The ticket is stored in /tmp/krb5cc_seed_data
#    and is used for all subsequent ipa-* commands.
# 
# 2. NO ANSIBLE FREEIPA MODULES: We use raw 'ipa' commands via 
#    ansible.builtin.command instead of Ansible's ipa_* modules to:
#    - Avoid additional Python dependencies
#    - Keep the playbook transparent and educational
#    - Show exactly what commands are executed
# 
# 3. PASSWORD POLICY: All test users use the same password for lab convenience.
#    In production, this would violate security policies. Never do this in
#    real environments!
# 
# 4. HBAC ENFORCEMENT: HBAC rules are enforced by SSSD on client nodes.
#    If HBAC changes don't take effect immediately, SSSD cache may need
#    to be cleared: sssctl cache-remove <username>
# 
# 5. CLEANUP: To remove all seed data, run:
#    ipa user-del jensyg; ipa user-del dev01; ... (repeat for all users)
#    ipa group-del sysadmins; ipa group-del webdevs; ... (repeat for all groups)
#    ipa hbacrule-del allow_sysadmins_all; ... (repeat for all HBAC rules)
#    ipa sudorule-del sysadmins_sudo_all; ... (repeat for all sudo rules)
#    
#    Or simply uninstall FreeIPA completely: ipa-server-install --uninstall
# 
# ==============================================================================
#
---
# ==============================================================================
# FREEIPA SEED DATA - USERS, GROUPS, HBAC & SUDO RULES
# ==============================================================================
# PURPOSE: Populate FreeIPA with realistic test data for troubleshooting labs.
# NOTE   : Idempotencia REAL (no failed_when:false global). Cada tarea falla
#          de verdad ante un error real, y solo se ignora el caso puntual de
#          "el recurso ya existe" / "ya es miembro", que es lo que sí queremos
#          tolerar en una re-ejecución.
# ==============================================================================

- name: "Set seed data Kerberos ccache path as a fact"
  ansible.builtin.set_fact:
    seed_krb5cc: /tmp/krb5cc_seed_data

# -----------------------------------------------------------------------------
# PHASE 1: OBTAIN KERBEROS TICKET FOR ADMIN
# -----------------------------------------------------------------------------
- name: "Obtain Kerberos ticket for admin user"
  ansible.builtin.command:
    cmd: "kinit admin"
  args:
    stdin: "{{ freeipa_admin_password }}"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  register: kinit_result
  changed_when: false
  failed_when: kinit_result.rc != 0
  no_log: true

# NOTA: freeipa_admin_password debe venir de Ansible Vault (group_vars/vault.yml),
# no hardcodeada. Si todavía la tenés en texto plano en otro lado, ese es un
# segundo problema a corregir aparte de este.

# -----------------------------------------------------------------------------
# PHASE 2: CREATE GROUPS
# -----------------------------------------------------------------------------
- name: "Create groups"
  ansible.builtin.command:
    cmd: "ipa group-add {{ item.name }} --desc='{{ item.desc }}'"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  loop:
    - { name: "sysadmins", desc: "System Administrators with full access" }
    - { name: "webdevs",   desc: "Web Developers with access to app nodes" }
    - { name: "dbas",      desc: "Database Administrators with access to db01" }
    - { name: "auditors",  desc: "Auditors with restricted access to client01" }
  register: group_create_result
  changed_when: group_create_result.rc == 0
  failed_when: >
    group_create_result.rc != 0 and
    'already exists' not in group_create_result.stderr

# -----------------------------------------------------------------------------
# PHASE 3: CREATE USERS
# -----------------------------------------------------------------------------
# NOTA: se removió --gidnumber=<nombre_de_grupo> del comando original — ipa
# user-add espera un GID numérico ahí, no un nombre de grupo. La pertenencia
# a grupos ya se resuelve correctamente en la Fase 4 con group-add-member,
# así que ese parámetro sobraba y además era inválido.
- name: "Create users"
  ansible.builtin.command:
    cmd: >
      ipa user-add {{ item.uid }}
      --first='{{ item.first }}'
      --last='{{ item.last }}'
      --password
    stdin: "{{ item.password }}\n{{ item.password }}\n"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  loop:
    - { uid: "jensyg", first: "Jens",  last: "Admin", password: "{{ seed_users_password }}" }
    - { uid: "dev01",  first: "Dev",   last: "One",   password: "{{ seed_users_password }}" }
    - { uid: "dev02",  first: "Dev",   last: "Two",   password: "{{ seed_users_password }}" }
    - { uid: "dba01",  first: "DBA",   last: "One",   password: "{{ seed_users_password }}" }
    - { uid: "audit01",first: "Audit", last: "One",   password: "{{ seed_users_password }}" }
  register: user_create_result
  changed_when: user_create_result.rc == 0
  failed_when: >
    user_create_result.rc != 0 and
    'already exists' not in user_create_result.stderr
  no_log: true

# NOTA: seed_users_password (hoy "LabPassword123!") también debería moverse a
# Ansible Vault en lugar de vivir en texto plano dentro del playbook, sobre
# todo si este repo se sube a un remoto compartido.

# -----------------------------------------------------------------------------
# PHASE 4: ADD USERS TO GROUPS
# -----------------------------------------------------------------------------
- name: "Add users to their groups"
  ansible.builtin.command:
    cmd: "ipa group-add-member {{ item.group }} --users={{ item.users }}"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  loop:
    - { group: "sysadmins", users: "jensyg" }
    - { group: "webdevs",   users: "dev01,dev02" }
    - { group: "dbas",      users: "dba01" }
    - { group: "auditors",  users: "audit01" }
  register: group_member_result
  changed_when: >
    'Number of members added 0' not in group_member_result.stdout
  failed_when: group_member_result.rc != 0

# -----------------------------------------------------------------------------
# PHASE 5: CREATE HBAC RULES (Host-Based Access Control)
# -----------------------------------------------------------------------------
- name: "Create HBAC rules"
  ansible.builtin.command:
    cmd: "ipa hbacrule-add {{ item.name }} --desc='{{ item.desc }}'"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  loop:
    - { name: "allow_sysadmins_all",      desc: "Sysadmins can access all hosts" }
    - { name: "allow_webdevs_apps",       desc: "Web developers can access app nodes" }
    - { name: "allow_dbas_db01",          desc: "DBAs can access db01" }
    - { name: "allow_auditors_client01",  desc: "Auditors can access client01" }
  register: hbac_create_result
  changed_when: hbac_create_result.rc == 0
  failed_when: >
    hbac_create_result.rc != 0 and
    'already exists' not in hbac_create_result.stderr

- name: "Attach groups to HBAC rules"
  ansible.builtin.command:
    cmd: "ipa hbacrule-add-user {{ item.rule }} --groups={{ item.group }}"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  loop:
    - { rule: "allow_sysadmins_all",     group: "sysadmins" }
    - { rule: "allow_webdevs_apps",      group: "webdevs" }
    - { rule: "allow_dbas_db01",         group: "dbas" }
    - { rule: "allow_auditors_client01", group: "auditors" }
  register: hbac_user_result
  changed_when: >
    'Number of members added 0' not in hbac_user_result.stdout
  failed_when: hbac_user_result.rc != 0

- name: "Attach all hosts to sysadmins HBAC rule"
  ansible.builtin.command:
    cmd: "ipa hbacrule-add-host allow_sysadmins_all --hostcat=all"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  register: hbac_host_all_result
  changed_when: >
    'Number of members added 0' not in hbac_host_all_result.stdout
  failed_when: hbac_host_all_result.rc != 0

- name: "Attach specific hosts to scoped HBAC rules"
  ansible.builtin.command:
    cmd: "ipa hbacrule-add-host {{ item.rule }} --hosts={{ item.hosts }}"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  loop:
    - { rule: "allow_webdevs_apps",      hosts: "app01.systech.local,app02.systech.local,app03.systech.local" }
    - { rule: "allow_dbas_db01",         hosts: "db01.systech.local" }
    - { rule: "allow_auditors_client01", hosts: "client01.systech.local" }
  register: hbac_host_result
  changed_when: >
    'Number of members added 0' not in hbac_host_result.stdout
  failed_when: hbac_host_result.rc != 0

# -----------------------------------------------------------------------------
# PHASE 6: CREATE SUDO RULES
# -----------------------------------------------------------------------------
- name: "Create sudo rules"
  ansible.builtin.command:
    cmd: "ipa sudorule-add {{ item.name }} --desc='{{ item.desc }}'"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  loop:
    - { name: "sysadmins_sudo_all", desc: "Sysadmins have full sudo access" }
    - { name: "dbas_sudo_pgsql",    desc: "DBAs can run PostgreSQL commands" }
  register: sudo_create_result
  changed_when: sudo_create_result.rc == 0
  failed_when: >
    sudo_create_result.rc != 0 and
    'already exists' not in sudo_create_result.stderr

- name: "Attach groups to sudo rules"
  ansible.builtin.command:
    cmd: "ipa sudorule-add-user {{ item.rule }} --groups={{ item.group }}"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  loop:
    - { rule: "sysadmins_sudo_all", group: "sysadmins" }
    - { rule: "dbas_sudo_pgsql",    group: "dbas" }
  register: sudo_user_result
  changed_when: >
    'Number of members added 0' not in sudo_user_result.stdout
  failed_when: sudo_user_result.rc != 0

- name: "Attach all hosts to sysadmins sudo rule"
  ansible.builtin.command:
    cmd: "ipa sudorule-add-host sysadmins_sudo_all --hostcat=all"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  register: sudo_host_all_result
  changed_when: >
    'Number of members added 0' not in sudo_host_all_result.stdout
  failed_when: sudo_host_all_result.rc != 0

- name: "Attach db01 to dbas sudo rule"
  ansible.builtin.command:
    cmd: "ipa sudorule-add-host dbas_sudo_pgsql --hosts=db01.systech.local"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  register: sudo_host_db_result
  changed_when: >
    'Number of members added 0' not in sudo_host_db_result.stdout
  failed_when: sudo_host_db_result.rc != 0

- name: "Add PostgreSQL commands to dbas sudo rule"
  ansible.builtin.command:
    cmd: >
      ipa sudorule-add-allow-command dbas_sudo_pgsql
      --sudocmds='/usr/bin/systemctl restart postgresql-15,/usr/bin/systemctl status postgresql-15,/usr/bin/journalctl -u postgresql-15'
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  register: sudo_cmd_result
  changed_when: >
    'Number of members added 0' not in sudo_cmd_result.stdout
  failed_when: sudo_cmd_result.rc != 0

- name: "Add ALL commands to sysadmins sudo rule"
  ansible.builtin.command:
    cmd: "ipa sudorule-add-allow-command sysadmins_sudo_all --sudocmds=all"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  register: sudo_cmd_all_result
  changed_when: >
    'Number of members added 0' not in sudo_cmd_all_result.stdout
  failed_when: sudo_cmd_all_result.rc != 0

# -----------------------------------------------------------------------------
# PHASE 7: VERIFY AND DISPLAY SUMMARY
# -----------------------------------------------------------------------------
- name: "List all users created"
  ansible.builtin.command:
    cmd: "ipa user-find --all"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  register: user_list
  changed_when: false

- name: "List all groups created"
  ansible.builtin.command:
    cmd: "ipa group-find --all"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  register: group_list
  changed_when: false

- name: "List all HBAC rules"
  ansible.builtin.command:
    cmd: "ipa hbacrule-find --all"
  environment:
    KRB5CCNAME: "{{ seed_krb5cc }}"
  register: hbac_list
  changed_when: false

- name: "Display Seed Data Summary"
  ansible.builtin.debug:
    msg: |
      =========================================
      FREEIPA SEED DATA - RESULTADO DE ESTA CORRIDA
      =========================================

      USUARIOS ENCONTRADOS EN IPA:
      {{ user_list.stdout }}

      GRUPOS ENCONTRADOS EN IPA:
      {{ group_list.stdout }}
      =========================================
