---
- name: "Instalar Apache, PHP y módulos de Postgres"
  ansible.builtin.dnf:
    name:
      - httpd
      - php
      - php-pgsql
      - nfs-utils
      - firewalld
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

# ======================================================================
# --- BLOQUE DE MONTAJE NFS (CORREGIDO Y ROBUSTO) ---
# ======================================================================

- name: "Forzar desmontaje perezoso (lazy) de /var/www/html para limpiar estados Stale"
  ansible.builtin.shell:
    cmd: "umount -l /var/www/html || true"
  ignore_errors: true

- name: "Asegurar que el punto de montaje exista como directorio local"
  ansible.builtin.file:
    path: /var/www/html
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "Montar recurso NFS compartido para la Web"
  ansible.posix.mount:
    path: /var/www/html
    src: "{{ storage_host_ip }}:/exports/webdata"
    fstype: nfs
    opts: "rw,sync,noatime,nodev,nosuid,vers=4" # vers=4 evita bloqueos de negociación en RHEL 9
    state: mounted

# ======================================================================
# --- RESTO DEL DESPLIEGUE (INTACTO Y CORRECTO) ---
# ======================================================================

- name: "Desplegar aplicación PHP dinámica (Feed)"
  ansible.builtin.template:
    src: feed_app.php.j2
    dest: /var/www/html/index.php
    mode: '0644'

- name: "Habilitar booleano de SELinux para NFS y red en Apache"
  ansible.posix.seboolean:
    name: "{{ item }}"
    state: true
    persistent: true
  loop:
    - httpd_use_nfs
    - httpd_can_network_connect_db

- name: "Iniciar y habilitar Apache y Firewalld"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - httpd
    - firewalld

- name: "Permitir servicio HTTP en Firewalld"
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true
