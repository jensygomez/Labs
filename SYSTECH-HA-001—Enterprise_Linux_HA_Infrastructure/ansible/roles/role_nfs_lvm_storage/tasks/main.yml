---
- name: "Configurar Almacenamiento en Storage Server"
  ansible.builtin.include_tasks: storage_setup.yml
  when: "'storage_nodes' in group_names"

- name: "Configurar Servidor de Base de Datos"
  ansible.builtin.include_tasks: database_setup.yml
  when: "'db_nodes' in group_names"

- name: "Configurar Servidores de Aplicación Web"
  ansible.builtin.include_tasks: web_app_setup.yml
  when: "'app_nodes' in group_names"

- name: "Configurar Balanceadores de Carga (HAProxy/Keepalived)"
  ansible.builtin.include_tasks: lb_setup.yml
  when: "'lb_nodes' in group_names"

- name: "Configurar Cliente de Pruebas"
  ansible.builtin.include_tasks: client_setup.yml
  when: "'client_nodes' in group_names"

# ==============================================================================
# ZABBIX - se agrega un include por fase, dentro de tasks/zabbix/
# Fase 1 (activa): PostgreSQL únicamente.
# Fases futuras se van agregando acá mismo, una línea por archivo, a medida
# que cada una se valida.
# ==============================================================================
- name: "Configurar Monitoreo (Zabbix) - Fase 1: Base de datos"
  ansible.builtin.include_tasks: zabbix/01_postgresql_setup.yml
  when: "'monitoring_nodes' in group_names"

- name: "Configurar Monitoreo (Zabbix) - Fase 2: Repositorio + Esquema"
  ansible.builtin.include_tasks: zabbix/02_zabbix_repo_and_schema.yml
  when: "'monitoring_nodes' in group_names"

- name: "Configurar Monitoreo (Zabbix) - Fase 3: zabbix-server"
  ansible.builtin.include_tasks: zabbix/03_zabbix_server_setup.yml
  when: "'monitoring_nodes' in group_names"
  
- name: "Configurar Monitoreo (Zabbix) - Fase 4: Frontend Web"
  ansible.builtin.include_tasks: zabbix/04_zabbix_frontend_setup.yml
  when: "'monitoring_nodes' in group_names"
  
- name: "Configurar Monitoreo (Zabbix) - Fase 5: Zabbix Agent en todos los nodos"
  ansible.builtin.include_tasks: zabbix/05_zabbix_agent_setup.yml
  # Nota: Quitamos el 'when' de 'monitoring_nodes' para que se ejecute en TODOS los nodos
  # (storage, db, app, lb, client). Si solo quieres algunos, ajusta el grupo aquí.
