---
# ============================================================
# CONFIGURACIÓN DEL SERVIDOR STORAGE (storage01)
# ============================================================
- name: "STORAGE | Instalar paquetes necesarios (NFS y LVM)"
  ansible.builtin.dnf:
    name:
      - nfs-utils
      - lvm2
      - targetcli
      - firewalld
    state: present
  when: inventory_hostname in groups['storage_nodes']

- name: "STORAGE | Crear Physical Volume (PV) en los discos adicionales"
  community.general.lvg:
    vg: vg_webdata
    pvs:
      - /dev/sdb
      - /dev/sdc
    state: present
  when: inventory_hostname in groups['storage_nodes']

- name: "STORAGE | Crear Logical Volume (LV) lv_shared"
  community.general.lvol:
    vg: vg_webdata
    lv: lv_shared
    size: 100%FREE
    state: present
  when: inventory_hostname in groups['storage_nodes']

- name: "STORAGE | Formatear el LV con sistema de archivos XFS"
  community.general.filesystem:
    fstype: xfs
    dev: /dev/vg_webdata/lv_shared
  when: inventory_hostname in groups['storage_nodes']

- name: "STORAGE | Crear directorio para el recurso compartido NFS"
  ansible.builtin.file:
    path: /mnt/shared_webdata
    state: directory
    mode: '0777'
  when: inventory_hostname in groups['storage_nodes']

- name: "STORAGE | Montar el Logical Volume en /mnt/shared_webdata"
  ansible.posix.mount:
    path: /mnt/shared_webdata
    src: /dev/vg_webdata/lv_shared
    fstype: xfs
    state: mounted
  when: inventory_hostname in groups['storage_nodes']

- name: "STORAGE | Configurar exportación NFS en /etc/exports"
  ansible.builtin.copy:
    dest: /etc/exports
    content: |
      /mnt/shared_webdata 10.10.10.0/24(rw,sync,no_root_squash)
    mode: '0644'
  notify: Reload NFS Exports
  when: inventory_hostname in groups['storage_nodes']

- name: "STORAGE | Iniciar y habilitar servicios NFS y Firewalld"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - firewalld
    - nfs-server
  when: inventory_hostname in groups['storage_nodes']

- name: "STORAGE | Permitir servicios NFS en Firewalld"
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - nfs
    - rpc-bind
    - mountd
  when: inventory_hostname in groups['storage_nodes']

# ============================================================
# CONFIGURACIÓN DE CLIENTES NFS (app01, app02, app03)
# ============================================================
- name: "CLIENTS | Instalar paquetes NFS, Apache y utilidades"
  ansible.builtin.dnf:
    name:
      - nfs-utils
      - httpd
      - firewalld
    state: present
  when: inventory_hostname in groups['app_nodes']

- name: "CLIENTS | Habilitar booleano de SELinux para permitir uso de NFS en Apache"
  ansible.posix.seboolean:
    name: httpd_use_nfs
    state: true
    persistent: true
  when: inventory_hostname in groups['app_nodes']

- name: "CLIENTS | Montar exportación NFS en /var/www/html"
  ansible.posix.mount:
    path: /var/www/html
    src: 10.10.10.25:/mnt/shared_webdata
    fstype: nfs
    opts: defaults,_netdev
    state: mounted
  when: inventory_hostname in groups['app_nodes']

- name: "CLIENTS | Iniciar y habilitar Apache y Firewalld"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - firewalld
    - httpd
  when: inventory_hostname in groups['app_nodes']

- name: "CLIENTS | Permitir servicio HTTP en Firewalld"
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true
  when: inventory_hostname in groups['app_nodes']


