---
- name: "Instalar paquetes de NFS y LVM"
  ansible.builtin.dnf:
    name:
      - nfs-utils
      - lvm2
      - firewalld
      - targetcli # <--- NUEVO: Necesario para iSCSI Target
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"
    
- name: "Crear usuario postgres en storage01 con UID 26"
  ansible.builtin.user:
    name: postgres
    uid: 26
    group: postgres
    create_home: false
    system: true
  when: ansible_hostname == "storage01"
  
- name: "Crear Volume Group en storage01"
  community.general.lvg:
    vg: "vg_storage"
    pvs: "/dev/sdb,/dev/sdc,/dev/sdd,/dev/sde"

- name: "Crear Logical Volumes para NFS"
  community.general.lvol:
    vg: "vg_storage"
    lv: "{{ item.lv_name }}"
    size: "{{ item.lv_size }}"
  loop: "{{ nfs_exports }}"

- name: "Crear Filesystem XFS en los LVs de NFS"
  community.general.filesystem:
    fstype: xfs
    dev: "/dev/vg_storage/{{ item.lv_name }}"
  loop: "{{ nfs_exports }}"

- name: "Crear directorios de exportación NFS"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0777'
  loop: "{{ nfs_exports }}"

- name: "Montar LVs en los puntos de exportación NFS"
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "/dev/vg_storage/{{ item.lv_name }}"
    fstype: xfs
    state: mounted
  loop: "{{ nfs_exports }}"

- name: "Configurar archivo /etc/exports"
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    mode: '0644'
  notify: Restart NFS

- name: "Asegurar que los servicios de NFS y Firewalld estén activos"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - nfs-server
    - firewalld

- name: "Permitir servicios NFS en Firewalld"
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - nfs
    - mountd
    - rpc-bind

# ======================================================================
# --- NUEVA SECCIÓN: CONFIGURACIÓN iSCSI TARGET PARA DB01 ---
# ======================================================================

- name: "Crear Logical Volume exclusivo para iSCSI DB"
  community.general.lvol:
    vg: "vg_storage"
    lv: "{{ iscsi_lv_name }}"
    size: "{{ iscsi_lv_size }}"

- name: "Configurar iSCSI Target con targetcli"
  ansible.builtin.shell: |
    targetcli /backstores/block create db_lun /dev/vg_storage/{{ iscsi_lv_name }} || true
    targetcli /iscsi create {{ iscsi_target_iqn }} || true
    targetcli /iscsi/{{ iscsi_target_iqn }}/tpg1/acls create {{ iscsi_initiator_iqn }} || true
    targetcli /iscsi/{{ iscsi_target_iqn }}/tpg1/luns create /backstores/block/db_lun || true
    targetcli saveconfig
  changed_when: false

- name: "Asegurar servicio target (iSCSI) activo"
  ansible.builtin.systemd:
    name: target
    state: started
    enabled: true

- name: "Permitir puerto iSCSI (3260) en Firewalld"
  ansible.posix.firewalld:
    port: 3260/tcp
    permanent: true
    state: enabled
    immediate: true
