# ==============================================================================
# ZABBIX - FASE 5: Zabbix Agent 2 en todos los nodos
# ==============================================================================
# Alcance:
# - Instalar zabbix-agent2 en nodos Debian (Ubuntu) y RedHat (AlmaLinux)
# - Configurar Server, ServerActive y Hostname de forma dinámica
# - Abrir puerto 10050 en el firewall local de cada SO
# - Iniciar y habilitar el servicio
# ==============================================================================

- name: "[Debian] Descargar paquete zabbix-release"
  ansible.builtin.get_url:
    url: "https://repo.zabbix.com/zabbix/{{ zabbix_version | default('7.0') }}/ubuntu/pool/main/z/zabbix-release/zabbix-release_{{ zabbix_release_pkg_version | default('7.0-2') }}+ubuntu24.04_all.deb"
    dest: "/tmp/zabbix-release.deb"
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: "[Debian] Instalar repositorio zabbix-release"
  ansible.builtin.apt:
    deb: "/tmp/zabbix-release.deb"
    state: present
  when: ansible_os_family == "Debian"

- name: "[RedHat] Instalar repositorio zabbix-release directamente desde URL"
  ansible.builtin.dnf:
    name: "https://repo.zabbix.com/zabbix/{{ zabbix_version | default('7.0') }}/rhel/9/x86_64/zabbix-release-{{ zabbix_release_pkg_version | default('7.0-2') }}.el9.noarch.rpm"
    state: present
    disable_gpg_check: true # Opcional, pero a veces necesario con RPMs directos por URL
  when: ansible_os_family == "RedHat"

- name: "[Debian] Instalar zabbix-agent2"
  ansible.builtin.apt:
    name: zabbix-agent2
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: "[RedHat] Instalar zabbix-agent2"
  ansible.builtin.dnf:
    name: zabbix-agent2
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

# --- CONFIGURACIÓN DEL AGENTE (Idempotente con lineinfile) ---
- name: "Configurar Server (Zabbix Server IP)"
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agent2.conf
    regexp: '^Server='
    line: "Server={{ zabbix_server_ip | default('10.10.10.90') }}"

- name: "Configurar ServerActive (Zabbix Server IP)"
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agent2.conf
    regexp: '^ServerActive='
    line: "ServerActive={{ zabbix_server_ip | default('10.10.10.90') }}"

- name: "Configurar Hostname dinámico (Usando el nombre del inventario)"
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agent2.conf
    regexp: '^Hostname='
    line: "Hostname={{ inventory_hostname }}"

# --- FIREWALL ---
- name: "[RedHat] Permitir puerto 10050/tcp en firewalld"
  ansible.posix.firewalld:
    port: 10050/tcp
    permanent: true
    state: enabled
    immediate: true
  when: ansible_os_family == "RedHat"

- name: "[Debian] Permitir puerto 10050/tcp en ufw"
  community.general.ufw:
    rule: allow
    port: '10050'
    proto: tcp
  when: ansible_os_family == "Debian"

# --- SERVICIO ---
- name: "Asegurar que zabbix-agent2 esté iniciado y habilitado"
  ansible.builtin.systemd:
    name: zabbix-agent2
    state: restarted # 'restarted' para asegurar que tome los cambios de configuración
    enabled: true
