- name: "Instalar paquetes necesarios en el cliente de pruebas"
  ansible.builtin.apt:
    name:
      - curl
      - python3
      - jq
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: "Desplegar script de tráfico continuo en el cliente con formato SQL y métricas extendidas"
  ansible.builtin.copy:
    dest: /usr/local/bin/infinite_traffic.sh
    mode: '0755'
    content: |
      #!/bin/bash
      VIP="10.10.10.30"
      
      while true; do
        for q in {1..5}; do
          clear
          echo "=========================================================="
          echo "         SYSTECH LAB — DYNAMIC QUERY TRAFFIC              "
          echo "=========================================================="
          echo "Enviando Petición Q$q a la VIP ($VIP)..."
          echo "----------------------------------------------------------"
          
          START_TIME=$(date +%s%N)
          RESPONSE=$(curl -s --connect-timeout 3 --max-time 5 "http://${VIP}/index.php?q=${q}")
          END_TIME=$(date +%s%N)
          
          LATENCY_MS=$(( (END_TIME - START_TIME) / 1000000 ))

          if [ -z "$RESPONSE" ]; then
            echo " [!] ERROR: Sin respuesta de la VIP ${VIP} (Timeout o puerto 80 cerrado)"
          elif echo "$RESPONSE" | jq . >/dev/null 2>&1; then
            # Pasamos las variables de Bash a Python de forma segura vía entorno
            export PY_RESPONSE="$RESPONSE"
            export PY_LATENCY="$LATENCY_MS"
            
            python3 << 'PYTHON_SCRIPT'
      import sys, json, os
      
      response_str = os.environ.get("PY_RESPONSE", "{}")
      
      try:
          data = json.loads(response_str)
      except Exception as e:
          print("Error al parsear JSON:", e)
          sys.exit(1)
      
      latency = os.environ.get("PY_LATENCY", "0")
      status = data.get("status", "N/A").upper()
      node = data.get("atendido_por", "N/A")
      query = data.get("pregunta", "N/A")
      http_code = data.get("http_code", "200 OK")
      db_time = data.get("db_time_ms", "N/A")
      conn_active = data.get("active_connections", "N/A")
      cpu_load = data.get("cpu_load", "N/A")
      records = data.get("data", [])
      
      print(f"STATUS           : {status}")
      print(f"NODE SERVED      : {node}")
      print(f"HTTP CODE        : {http_code}")
      print(f"NETWORK LATENCY  : {latency} ms")
      if db_time != "N/A": print(f"DB EXEC TIME     : {db_time} ms")
      if conn_active != "N/A": print(f"ACTIVE CONNS     : {conn_active}")
      if cpu_load != "N/A": print(f"CPU LOAD         : {cpu_load}")
      print(f"QUERY EXECUTED   : {query}\n")
      
      if records and isinstance(records, list):
          headers = list(records[0].keys())
          widths = {h: len(h) for h in headers}
          for r in records:
              for h in headers:
                  widths[h] = max(widths[h], len(str(r.get(h, ""))))
          
          sep = "+" + "+".join("-" * (widths[h] + 2) for h in headers) + "+"
          head = "|" + "|".join(f" {h.upper():<{widths[h]}} " for h in headers) + "|"
          
          print(sep)
          print(head)
          print(sep)
          for r in records:
              row = "|" + "|".join(f" {str(r.get(h, '')):<{widths[h]}} " for h in headers) + "|"
              print(row)
          print(sep)
          print(f"({len(records)} rows in set)\n")
      PYTHON_SCRIPT
          else
            echo "Respuesta del servidor (no JSON):"
            echo "$RESPONSE"
          fi
          
          echo "----------------------------------------------------------"
          sleep 2
        done
      done
