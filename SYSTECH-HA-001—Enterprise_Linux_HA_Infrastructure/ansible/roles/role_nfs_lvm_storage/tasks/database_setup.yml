---
- name: "Instalar paquetes de PostgreSQL, Firewalld y clientes NFS"
  ansible.builtin.dnf:
    name:
      - postgresql-server
      - postgresql-contrib
      - python3-psycopg2
      - nfs-utils
      - firewalld
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: "Asegurar que Firewalld esté activo e iniciado"
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: "Permitir puerto de PostgreSQL en Firewalld"
  ansible.posix.firewalld:
    service: postgresql
    permanent: true
    state: enabled
    immediate: true

- name: "Instalar paquetes necesarios para SELinux"
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  when: ansible_selinux.status == "enabled"

- name: "Desactivar SELinux temporalmente (si está activo)"
  ansible.builtin.command:
    cmd: setenforce 0
  when: ansible_selinux.status == "enabled"
  ignore_errors: true
  
- name: "Crear punto de montaje NFS para datos de BD"
  ansible.builtin.file:
    path: /var/lib/pgsql/data
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: "Desmontar NFS si está montado (para limpiar)"
  ansible.posix.mount:
    path: /var/lib/pgsql/data
    state: unmounted
  ignore_errors: true

- name: "Eliminar contenido previo del directorio de datos"
  ansible.builtin.file:
    path: /var/lib/pgsql/data
    state: absent

- name: "Recrear directorio de datos con permisos correctos"
  ansible.builtin.file:
    path: /var/lib/pgsql/data
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: "Montar recurso NFS de BD desde storage01 usando IP"
  ansible.posix.mount:
    path: /var/lib/pgsql/data
    src: "{{ storage_host_ip }}:/exports/dbdata"
    fstype: nfs
    opts: "rw,sync,noatime,nodev,nosuid"
    state: mounted

- name: "Asegurar permisos recursivos del usuario postgres en la ruta NFS (después del montaje)"
  ansible.builtin.file:
    path: /var/lib/pgsql/data
    owner: postgres
    group: postgres
    mode: '0700'
    state: directory

- name: "Inicializar base de datos PostgreSQL si no está inicializada"
  ansible.builtin.shell:
    cmd: |
      if [ ! -f /var/lib/pgsql/data/PG_VERSION ]; then
        postgresql-setup --initdb
      fi
    creates: /var/lib/pgsql/data/PG_VERSION
  become: true
  become_user: postgres

- name: "Configurar escuchas en PostgreSQL (listen_addresses)"
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/postgresql.conf
    regexp: "^#?listen_addresses ="
    line: "listen_addresses = '*'"

- name: "Configurar accesos pg_hba.conf para el grupo app_nodes"
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: /var/lib/pgsql/data/pg_hba.conf
    owner: postgres
    group: postgres
    mode: '0600'

- name: "Asegurar propiedad postgres en archivos generados por initdb"
  ansible.builtin.file:
    path: /var/lib/pgsql/data
    owner: postgres
    group: postgres
    recurse: true

- name: "Desactivar SELinux temporalmente (si está activo)"
  ansible.builtin.command:
    cmd: setenforce 0
  when: ansible_selinux.status == "enabled"
  ignore_errors: true

- name: "Iniciar y habilitar servicio PostgreSQL"
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true


- name: "Crear Base de Datos del proyecto"
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    state: present
  become: true
  become_user: postgres

- name: "Crear Usuario de la Base de Datos con privilegios"
  community.postgresql.postgresql_user:
    db: "{{ db_name }}"
    name: "{{ db_user }}"
    password: "{{ db_pass }}"
    priv: "ALL"
    state: present
  become: true
  become_user: postgres

- name: "Crear tabla de empleados y datos ficticios"
  community.postgresql.postgresql_query:
    db: "{{ db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS employees (
        id SERIAL PRIMARY KEY,
        first_name VARCHAR(50) NOT NULL,
        last_name VARCHAR(50) NOT NULL,
        department VARCHAR(50) NOT NULL,
        salary NUMERIC(10, 2) NOT NULL,
        hire_date DATE NOT NULL
      );

      DELETE FROM employees;

      INSERT INTO employees (first_name, last_name, department, salary, hire_date) VALUES
      ('Alice', 'Smith', 'RH', 1200.00, '2021-03-15'),
      ('Alexander', 'Gomez', 'IT', 2500.00, '2023-01-10'),
      ('Andrew', 'Silva', 'RH', 950.00, '2020-05-20'),
      ('Beatriz', 'Lopez', 'Finance', 1800.00, '2024-02-01'),
      ('Carlos', 'Mendoza', 'IT', 3100.00, '2019-11-12'),
      ('Ana', 'Martinez', 'RH', 1100.00, '2022-08-30'),
      ('Arthur', 'Perez', 'DevOps', 2800.00, '2025-01-15');
  become: true
  become_user: postgres
  
- name: "Configurar contexto SELinux para el directorio de datos de PostgreSQL"
  ansible.builtin.command:
    cmd: semanage fcontext -a -t postgresql_db_t "/var/lib/pgsql/data(/.*)?"
  when: ansible_selinux.status == "enabled"
  ignore_errors: true

- name: "Aplicar contexto SELinux recursivamente"
  ansible.builtin.command:
    cmd: restorecon -Rv /var/lib/pgsql/data
  when: ansible_selinux.status == "enabled"
  ignore_errors: true

- name: "Reactivar SELinux en modo enforcing"
  ansible.builtin.command:
    cmd: setenforce 1
  when: ansible_selinux.status == "enabled"
  ignore_errors: true
