---
# Se calcula dinámicamente desde el grupo db_nodes en hosts.yml
db_host_ip: "{{ hostvars[groups['db_nodes'][0]]['ansible_host'] }}"

# Se calcula dinámicamente desde el grupo storage_nodes en hosts.yml
storage_host_ip: "{{ hostvars[groups['storage_nodes'][0]]['ansible_host'] }}"

# Configuración de exportaciones NFS (SOLO PARA LA WEB)
# Usamos sdb y sdc (2GB totales). Dejamos sdd y sde libres para iSCSI.
nfs_exports:
  - path: "/exports/webdata"
    vg_name: "vg_storage"
    lv_name: "lv_webdata"
    lv_size: "1.5G"
    pvs: ["/dev/sdb", "/dev/sdc"]
    client_export: "/exports/webdata *(rw,sync,no_root_squash,no_subtree_check)"

# Parámetros de la Base de Datos
db_name: "systech_db"
db_user: "app_user"
db_pass: "SecurePass123!"

# --- VARIABLES iSCSI (Ajustadas a tu hardware de 1GB) ---
iscsi_target_iqn: "iqn.2026-08.com.systech:storage01.db"
iscsi_initiator_iqn: "iqn.2026-08.com.systech:db01.initiator"
iscsi_lv_name: "lv_db_iscsi"
iscsi_lv_size: "1.5G"  # <--- CORREGIDO: Antes decía 10g
