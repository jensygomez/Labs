# ------------------------------------------------------------------------------
# FASE 01: BASELINE DE SEGURIDAD Y CONFIGURACIÓN BASE 
# Solo Aplica a las 3 VMS que tienen AlmaLinux9
# Comando individual: ansible-playbook -i ansible/inventories/production/hosts.yml ansible/site.yml --tags baseline --ask-vault-pass
# ------------------------------------------------------------------------------
- name: "Phase 01 - Apply Linux Baseline to all nodes"
  hosts: ha_nodes
# serial: 2
  become: true
  gather_facts: true
  roles:
    - role: linux_baseline
      tags: baseline


# ------------------------------------------------------------------------------
# FASE 02: CONFIGURACIONES DEL ZABBBIX SERVER
# MONITOREO: ZABBIX SERVER (LXC Container 10.10.10.40)
# ------------------------------------------------------------------------------
- name: "Phase Zabbix - Deploy Zabbix Monitoring Server"
  hosts: monitoring_nodes
  become: true
  gather_facts: true
  roles:
    - role: zabbix_server
      tags: zabbix_server

