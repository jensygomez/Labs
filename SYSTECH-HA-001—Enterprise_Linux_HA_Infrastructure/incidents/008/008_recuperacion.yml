---
- name: "System State Reconciliation - Incident 008"
  hosts: app_nodes
  become: true
  gather_facts: false
  vars:
    service_name: "nginx"
    service_port: 8080
    service_package: "nginx"
    marker_file: "/var/run/.incident_008_marker"

  tasks:
    - name: "10 - Check if incident marker exists"
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: check_marker

    - block:
        - name: "20 - Stop and disable {{ service_name }}"
          ansible.builtin.systemd:
            name: "{{ service_name }}"
            state: stopped
            enabled: false

        - name: "30 - Remove {{ service_package }} package"
          ansible.builtin.dnf:
            name: "{{ service_package }}"
            state: absent

        - name: "40 - Remove firewalld rule for port {{ service_port }}"
          ansible.posix.firewalld:
            port: "{{ service_port }}/tcp"
            permanent: true
            state: absent
            immediate: true
          when: ansible_os_family == "RedHat"

        - name: "50 - Restore SELinux context on config file (if exists)"
          ansible.builtin.command:
            cmd: "restorecon -v /etc/nginx/nginx.conf"
          when:
            - service_name == "nginx"
            - ansible_selinux is defined and ansible_selinux.status == "enabled"
          failed_when: false

        - name: "60 - Remove injection marker"
          ansible.builtin.file:
            path: "{{ marker_file }}"
            state: absent

        - name: "70 - Debug completion"
          ansible.builtin.debug:
            msg: "Reconciliation completed on {{ inventory_hostname }}. Service removed, firewall rule deleted."

      when: check_marker.stat.exists
