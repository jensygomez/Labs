---
# ==============================================================================
# INCIDENT INJECTION PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
# ==============================================================================
# INCIDENT ID   : 009
# TITLE         : Filesystem montado en modo solo lectura (Read-Only)
# TARGET NODE   : storage01 (10.10.10.50)
# TARGET FS     : /exports/webdata (XFS on LVM /dev/vg_storage/lv_webdata)
# DIFFICULTY    : 4/10 (L1 Junior)
# ESTIMATED TIME: 2 Hours
# ==============================================================================
#
# 📖 SCENARIO CONTEXT:
# Simulates a filesystem that encountered I/O errors during normal operation.
# The kernel detected the errors and protected the filesystem by remounting
# it as Read-Only. The L1 will see:
# - findmnt showing (ro,...)
# - dmesg showing I/O errors
# - NFS exports working but read-only
#
# 💥 WHAT THIS PLAYBOOK BREAKS:
# 1. Ensures the filesystem is mounted normally (RW)
# 2. Forces remount to Read-Only mode (simulating kernel protection)
# 3. Generates realistic I/O error logs in dmesg
# 4. Restarts NFS so clients see the RO state
#
# 🕵️ EXPECTED L1 DIAGNOSIS PATH:
# - findmnt /exports/webdata → shows (ro,...)
# - dmesg -T | tail -50 → shows I/O errors
# - Fix: Remount RW (mount -o remount,rw /exports/webdata)
# ==============================================================================

- name: "Incident 009 | Inject Read-Only Filesystem on storage01"
  hosts: storage01
  become: yes
  vars:
    incident_id: "009"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
    target_lv_path: "/dev/vg_storage/lv_webdata"
    target_mount: "/exports/webdata"

  tasks:
    # -------------------------------------------------------------------------
    # PHASE 1: PRE-FLIGHT & IDEMPOTENCY CHECK
    # -------------------------------------------------------------------------
    - name: "01 | Check if incident was already injected (Marker Guard)"
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: check_inject

    - name: "02 | Abort if incident is already active"
      ansible.builtin.debug:
        msg: "Incident {{ incident_id }} is already injected. Skipping."
      when: check_inject.stat.exists

    - name: "03 | Create marker file to prevent double-injection"
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: touch
        mode: '0644'
      when: not check_inject.stat.exists

    # -------------------------------------------------------------------------
    # PHASE 2: ENSURE FILESYSTEM IS MOUNTED NORMALLY
    # -------------------------------------------------------------------------
    - name: "04 | Stop NFS server to release filesystem locks"
      ansible.builtin.systemd:
        name: nfs-server
        state: stopped
      when: not check_inject.stat.exists

    - name: "05 | Ensure filesystem is mounted (RW mode)"
      ansible.builtin.mount:
        path: "{{ target_mount }}"
        src: "{{ target_lv_path }}"
        fstype: xfs
        state: mounted
      when: not check_inject.stat.exists

    - name: "06 | Verify filesystem is mounted and writable"
      ansible.builtin.command:
        cmd: "touch {{ target_mount }}/.healthcheck"
      changed_when: false
      when: not check_inject.stat.exists

    - name: "07 | Remove healthcheck file"
      ansible.builtin.file:
        path: "{{ target_mount }}/.healthcheck"
        state: absent
      when: not check_inject.stat.exists

    # -------------------------------------------------------------------------
    # PHASE 3: FORCE READ-ONLY MODE (Simulating kernel protection)
    # -------------------------------------------------------------------------
    - name: "08 | Force filesystem into Read-Only mode"
      ansible.builtin.command:
        cmd: "mount -o remount,ro {{ target_mount }}"
      when: not check_inject.stat.exists

    - name: "09 | Generate realistic I/O error logs in dmesg"
      ansible.builtin.shell: |
        # Simulate kernel detecting I/O errors
        echo "device-mapper: table: 253:0: error: replacing existing table" > /dev/kmsg || true
        echo "Buffer I/O error on dev dm-0, logical block 0, async page read" > /dev/kmsg || true
        echo "XFS (dm-0): metadata I/O error in \"xfs_buf_read_map_ranked\" at daddr 0 len 32 error -5" > /dev/kmsg || true
        echo "XFS (dm-0): Filesystem has been shut down due to log error" > /dev/kmsg || true
        echo "XFS (dm-0): remounting filesystem read-only" > /dev/kmsg || true
      ignore_errors: yes
      when: not check_inject.stat.exists

    - name: "10 | Wait for kernel to process errors"
      ansible.builtin.pause:
        seconds: 2
      when: not check_inject.stat.exists

    # -------------------------------------------------------------------------
    # PHASE 4: FINALIZE & EXPOSE TO CLIENTS
    # -------------------------------------------------------------------------
    - name: "11 | Start NFS server (it will export the RO filesystem)"
      ansible.builtin.systemd:
        name: nfs-server
        state: started
      when: not check_inject.stat.exists

    - name: "12 | Verify injection status"
      ansible.builtin.command:
        cmd: "findmnt -n -o OPTIONS {{ target_mount }}"
      register: final_mount_opts
      changed_when: false
      when: not check_inject.stat.exists

    - name: "13 | Display Injection Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 009 SUCCESSFULLY INJECTED
          =========================================
          Target: {{ target_mount }}
          Current State: {{ final_mount_opts.stdout | default('Unmounted/Failed') }}
          
          The filesystem is now Read-Only.
          L1 must check 'dmesg' and remount RW.
          =========================================
      when: not check_inject.stat.exists
