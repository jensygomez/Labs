---
# ==============================================================================
# INCIDENT RECOVERY PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
# ==============================================================================
# INCIDENT ID   : 009
# PURPOSE       : Revert the Read-Only filesystem injection on storage01.
# PREREQUISITE  : The injection playbook (009_incidente.yml) must have been 
#                 run previously, as this relies on the backup table located 
#                 at /tmp/.lv_webdata_original_table.bak.
# ==============================================================================

- name: "Recovery 009 | Restore Read-Only Filesystem on storage01"
  hosts: storage01
  become: yes
  vars:
    incident_id: "009"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
    target_lv_path: "/dev/vg_storage/lv_webdata"
    target_dm_name: "vg_storage-lv_webdata"
    target_mount: "/exports/webdata"
    backup_table_file: "/tmp/.lv_webdata_original_table.bak"

  tasks:
    - name: "01 | Check if incident marker exists (Was it actually injected?)"
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: check_inject

    - name: "02 | Abort if incident was not injected"
      ansible.builtin.debug:
        msg: "Incident {{ incident_id }} marker not found. Nothing to recover."
      when: not check_inject.stat.exists

    - name: "03 | Stop NFS server to release filesystem"
      ansible.builtin.systemd:
        name: nfs-server
        state: stopped
      when: check_inject.stat.exists

    - name: "04 | Unmount the broken/read-only filesystem"
      ansible.builtin.mount:
        path: "{{ target_mount }}"
        state: unmounted
      ignore_errors: yes
      when: check_inject.stat.exists

    - name: "05 | Read the original device-mapper table from backup"
      ansible.builtin.command:
        cmd: "cat {{ backup_table_file }}"
      register: original_table_content
      changed_when: false
      when: check_inject.stat.exists

    - name: "06 | Restore the original device-mapper table (Fix the 'dead disk')"
      ansible.builtin.command:
        cmd: "dmsetup load {{ target_dm_name }} --table '{{ original_table_content.stdout }}'"
      when: check_inject.stat.exists

    - name: "07 | Suspend and resume device-mapper to apply restored table"
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - "dmsetup suspend {{ target_dm_name }}"
        - "dmsetup resume {{ target_dm_name }}"
      when: check_inject.stat.exists

    - name: "08 | Run XFS repair to clear any dirty log state from the I/O errors"
      ansible.builtin.command:
        cmd: "xfs_repair {{ target_lv_path }}"
      register: xfs_repair_result
      changed_when: "'cleaning' in xfs_repair_result.stdout or 'rebuilding' in xfs_repair_result.stdout"
      when: check_inject.stat.exists

    - name: "09 | Mount the filesystem back in Read-Write mode"
      ansible.builtin.mount:
        path: "{{ target_mount }}"
        src: "{{ target_lv_path }}"
        fstype: xfs
        state: mounted
      when: check_inject.stat.exists

    - name: "10 | Restart NFS server"
      ansible.builtin.systemd:
        name: nfs-server
        state: started
      when: check_inject.stat.exists

    - name: "11 | Remove the incident marker file"
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: absent
      when: check_inject.stat.exists

    - name: "12 | Remove the backup table file"
      ansible.builtin.file:
        path: "{{ backup_table_file }}"
        state: absent
      when: check_inject.stat.exists

    - name: "13 | Display Recovery Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 009 SUCCESSFULLY RECOVERED
          =========================================
          - Device-mapper table restored.
          - XFS filesystem repaired and mounted RW.
          - NFS service restarted.
          - Marker and backup files cleaned up.
          =========================================
      when: check_inject.stat.exists
