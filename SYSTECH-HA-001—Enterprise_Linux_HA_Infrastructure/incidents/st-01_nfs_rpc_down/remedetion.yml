---
- name: Remediation - Ensure NFS Storage Service is Active and Enabled
  hosts: storage01
  gather_facts: true
  become: true

  tasks:
    - name: Ensure NFS server daemon is running and enabled on boot
      ansible.builtin.systemd_service:
        name: nfs-server
        state: started
        enabled: true

    - name: Ensure RPC bind service is running and enabled
      ansible.builtin.systemd_service:
        name: rpcbind
        state: started
        enabled: true

    - name: Force re-export of all NFS shares
      ansible.builtin.command:
        cmd: exportfs -ra
      register: exportfs_result
      changed_when: exportfs_result.rc == 0

    - name: Verify NFS RPC registration (TCP 2049)
      ansible.builtin.command:
        cmd: rpcinfo -p localhost
      register: rpc_check
      changed_when: false

    - name: Display RPC status summary
      ansible.builtin.debug:
        msg: "NFS Service status on {{ inventory_hostname }}: OK"
