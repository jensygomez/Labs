---
- name: "System State Reconciliation"
  hosts: app_nodes
  become: true
  gather_facts: true
  tasks:
    - name: "10"
      ansible.builtin.stat:
        path: /var/log/.audit_sync_marker
      register: check_inject

    - name: "20"
      ansible.builtin.systemd:
        name: sys-audit-sync
        state: stopped
        enabled: false
      when: check_inject.stat.exists

    - name: "30"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/sys-audit-sync.service
        - /usr/local/bin/sys-audit-sync.sh
        - /var/log/.audit_sync_marker
      when: check_inject.stat.exists

    - name: "40"
      ansible.builtin.shell:
        cmd: "> /var/log/sys-audit.log"
      when: check_inject.stat.exists

    - name: "50"
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
      when: check_inject.stat.exists

    - name: "60"
      ansible.builtin.debug:
        msg: "Reconciliation completed."
