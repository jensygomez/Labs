---
- name: "System State Reconciliation"
  hosts: app_nodes
  become: true
  gather_facts: true
  tasks:
    - name: "20"
      ansible.builtin.stat:
        path: /etc/httpd/conf/httpd.conf.orig
      register: backup_conf

    - name: "30"
      ansible.builtin.copy:
        src: /etc/httpd/conf/httpd.conf.orig
        dest: /etc/httpd/conf/httpd.conf
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when: backup_conf.stat.exists

    - name: "40"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/httpd/conf/httpd.conf.orig
        - /etc/httpd/conf/selinux_ports.orig
        - /tmp/maint_check.log
      when: backup_conf.stat.exists

    - name: "50"
      ansible.builtin.systemd:
        name: httpd
        state: restarted
      when: backup_conf.stat.exists

    - name: "60"
      ansible.builtin.command: systemctl is-active httpd
      register: httpd_status_after
      changed_when: false
      when: backup_conf.stat.exists

    - name: "70"
      ansible.builtin.debug:
        msg: "Task completed. httpd status: {{ httpd_status_after.stdout | default('skipped') }}"
