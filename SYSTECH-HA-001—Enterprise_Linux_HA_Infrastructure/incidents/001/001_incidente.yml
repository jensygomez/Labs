---
- name: "System Maintenance Validation"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "10"
      ansible.builtin.set_fact:
        target_node: "{{ groups['app_nodes'] | random }}"

    - name: "20"
      ansible.builtin.add_host:
        name: "{{ target_node }}"
        groups: incident_target

    - name: "30"
      ansible.builtin.debug:
        msg: "Target selected."

- name: "System Maintenance Validation - Execution"
  hosts: incident_target
  become: true
  gather_facts: true
  tasks:
    - name: "40"
      ansible.builtin.stat:
        path: /etc/httpd/conf/httpd.conf.bak_maint
      register: check_backup

    - name: "50"
      ansible.builtin.copy:
        src: /etc/httpd/conf/httpd.conf
        dest: /etc/httpd/conf/httpd.conf.bak_maint
        remote_src: true
      when: not check_backup.stat.exists

    - name: "60"
      ansible.builtin.lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^Listen '
        line: 'Listen 8099'
      when: not check_backup.stat.exists

    - name: "70"
      ansible.builtin.systemd:
        name: httpd
        state: restarted
      ignore_errors: true
      when: not check_backup.stat.exists

    - name: "80"
      ansible.builtin.command: systemctl is-active httpd
      register: svc_status
      changed_when: false
      failed_when: false

    - name: "90"
      ansible.builtin.debug:
        msg: "Execution completed. Status: {{ svc_status.stdout }}"
