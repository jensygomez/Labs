---
- name: "System Maintenance Validation"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "10"
      ansible.builtin.set_fact:
        nodo_incidente_001: "{{ groups['app_nodes'] | random }}"

    - name: "20"
      ansible.builtin.add_host:
        name: "{{ nodo_incidente_001 }}"
        groups: incident_001_target

    - name: "30"
      ansible.builtin.debug:
        msg: "Target selected."

- name: "System Maintenance Validation - Execution"
  hosts: incident_001_target
  become: true
  gather_facts: true
  tasks:
    - name: "50"
      ansible.builtin.stat:
        path: /etc/httpd/conf/httpd.conf.orig
      register: ya_inyectado

    - name: "60"
      ansible.builtin.copy:
        src: /etc/httpd/conf/httpd.conf
        dest: /etc/httpd/conf/httpd.conf.orig
        remote_src: true
      when: not ya_inyectado.stat.exists

    - name: "70"
      ansible.builtin.command: semanage port -l --nolocal --context
      register: selinux_ports_backup
      changed_when: false
      when: not ya_inyectado.stat.exists

    - name: "80"
      ansible.builtin.copy:
        content: "{{ selinux_ports_backup.stdout }}\n"
        dest: /etc/httpd/conf/selinux_ports.orig
        mode: '0644'
      when: not ya_inyectado.stat.exists

    # --- FALSOS POSITIVOS / DISTRACCIONES ---
    - name: "90"
      ansible.builtin.shell: |
        echo "$(date) - [INFO] Post-maintenance check: SELinux context for port 8099 verified and active." >> /var/log/messages
        echo "$(date) - [INFO] Firewall rules for 8099 verified." >> /var/log/messages
      when: not ya_inyectado.stat.exists

    - name: "91"
      ansible.builtin.shell: |
        echo "$(date) - [WARN] chronyd: System clock drift detected. Synchronizing..." >> /var/log/messages
      when: not ya_inyectado.stat.exists

    - name: "92"
      ansible.builtin.copy:
        content: |
          Maintenance Post-Check Report:
          - All nodes healthy.
          - Port 8099 open in firewalld.
          - SELinux permissive mode verified.
          - NTP synchronized.
        dest: /tmp/maint_check.log
        mode: '0644'
      when: not ya_inyectado.stat.exists
    # ----------------------------------------

    - name: "100"
      ansible.builtin.lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^Listen '
        line: 'Listen 8099'
      when: not ya_inyectado.stat.exists

    - name: "110"
      ansible.builtin.systemd:
        name: httpd
        state: restarted
      ignore_errors: true
      when: not ya_inyectado.stat.exists

    - name: "120"
      ansible.builtin.command: systemctl is-active httpd
      register: httpd_status
      changed_when: false
      failed_when: false

    - name: "130"
      ansible.builtin.debug:
        msg: "Execution completed. Status: {{ httpd_status.stdout }}"
