---
- name: "System Deployment Validation - Incident 004 Injection"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "10 - Select target node"
      ansible.builtin.set_fact:
        target_node: "{{ groups['app_nodes'] | random }}"

    - name: "20 - Add target to dynamic group"
      ansible.builtin.add_host:
        name: "{{ target_node }}"
        groups: incident_004_target

- name: "Inject Fault and Red Herrings"
  hosts: incident_004_target
  become: true
  gather_facts: true
  tasks:
    - name: "30 - Check if already injected"
      ansible.builtin.stat:
        path: /var/log/.reboot_marker_004
      register: check_inject

    # =========================================================
    # TRAMPA 1 (Falso Positivo DNS): Warning clásico de Apache
    # =========================================================
    - name: "40 - Inject fake Apache FQDN warning (DNS Red Herring)"
      ansible.builtin.lineinfile:
        path: /var/log/httpd/error_log
        line: "[{{ ansible_date_time.iso8601_basic_short }}] [core:warn] [pid 1234] AH00558: httpd: Could not reliably determine the server's fully qualified domain name, using {{ inventory_hostname }}.lab.systech.local. Set the 'ServerName' directive globally to suppress this message"
        insertbefore: BOF
        state: present
      when: not check_inject.stat.exists

    # =========================================================
    # TRAMPA 2 (Falso Positivo SELinux): Log en audit.log
    # =========================================================
    - name: "50 - Inject fake SELinux denial in audit log"
      ansible.builtin.lineinfile:
        path: /var/log/audit/audit.log
        line: "type=AVC msg=audit({{ ansible_date_time.epoch }}.123:456): avc:  denied  { name_bind } for  pid=1234 comm=\"httpd\" src=80 scontext=system_u:system_r:httpd_t:s0 tcontext=system_u:object_r:http_port_t:s0 tclass=tcp_socket"
        insertbefore: BOF
        state: present
      when: not check_inject.stat.exists

    # =========================================================
    # TRAMPA 3 (Falso Negativo): Systemd masked (Log falso en journal)
    # =========================================================
    - name: "60 - Inject fake systemd masked message"
      ansible.builtin.command:
        cmd: logger -t systemd -p err "httpd.service: Unit configuration is masked, refusing to start."
      when: not check_inject.stat.exists

    # =========================================================
    # CAUSA RAÍZ REAL: Servicio detenido y deshabilitado (Post-Reboot)
    # =========================================================
    - name: "70 - Stop and disable httpd (Simulate post-reboot state)"
      ansible.builtin.systemd:
        name: httpd
        enabled: false
        state: stopped
      when: not check_inject.stat.exists

    - name: "80 - Create injection marker"
      ansible.builtin.file:
        path: /var/log/.reboot_marker_004
        state: touch
        mode: '0600'
      when: not check_inject.stat.exists

    - name: "90 - Debug completion"
      ansible.builtin.debug:
        msg: "Incident 004 injected successfully on {{ inventory_hostname }}."
