# ==============================================================================
# INCIDENT INJECTION PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
# ==============================================================================
# PREREQUISITOS DE PLATAFORMA (ejecutar ANTES de cualquier incident_XXX.yml):
#
#   1. setup_users.yml
#      - Crea grupos, usuarios y reglas sudoers desde group_vars/all/system_users.yml
#      - 'jensyg' ya viene definido ahí con target_groups: ["all"] y password
#        real vía default_user_password ('LabPassword123!' hasheado con salt fijo)
#      - NO recrear usuarios dentro de un playbook de incidente: ya están sanos.
#
#   2. dns01.yml
#      - Configura /etc/hosts en TODOS los nodos de la infraestructura
#        (hosts: all) desde el inventario dinámico.
#      - NO duplicar esta tarea dentro de un playbook de incidente.
#
#   Un incident_XXX.yml SOLO debe encargarse de:
#     a) Resolución DNS del CONTROL NODE (dns01.yml no lo cubre, corre contra
#        'hosts: all' del inventario, no contra 'localhost').
#     b) Seleccionar el/los nodo(s) objetivo.
#     c) Inyectar el fallo puntual del escenario.
#     d) Decoys/logs realistas para practicar troubleshooting.
#
# ==============================================================================
# RESUMEN DE EJECUCIÓN (LÓGICA DEL INCIDENTE 010):
# 1. RESOLUCIÓN DE NOMBRES EN EL CONTROL NODE (PLAY 1): Actualiza /etc/hosts
#    localmente para permitir troubleshooting por nombre DNS desde el control node.
# 2. SELECCIÓN ALEATORIA (PLAY 2): Elige UN SOLO nodo al azar del grupo 'app_nodes' 
#    para crear un estado asimétrico en el clúster HA.
# 3. INYECCIÓN DEL FALLO (PLAY 3): Bloquea la contraseña y expira la cuenta únicamente
#    en el nodo seleccionado e inyecta los logs/falsos distractores (incluye tarea 57).
# ==============================================================================
# INCIDENT ID    : 010
# TITLE          : Usuario no puede autenticarse aunque la contraseña es correcta
# TARGET NODE    : Random node from app_nodes (Asymmetric Cluster State)
# TARGET USER    : jensyg (definido en group_vars/all/system_users.yml)
# DIFFICULTY     : 4/10 (L1 Junior)
# ESTIMATED TIME : 2 Hours
# ==============================================================================
---
# -----------------------------------------------------------------------------
# PLAY 1: POPULATE /ETC/HOSTS ON THE CONTROL NODE ITSELF
# (La resolución DNS de la infraestructura remota ya la gestiona dns01.yml)
# -----------------------------------------------------------------------------
- name: "Incident 010 - Ensure Name Resolution on Control Node"
  hosts: localhost
  connection: local
  become: yes
  gather_facts: false
  tasks:
    - name: "01 | Update /etc/hosts on control node with full inventory"
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED HOSTS (SYSTECH CONTROL NODE)"
        unsafe_writes: yes
        block: |
          {% for host in groups['all'] %}
          {% if hostvars[host].ansible_host is defined %}
          {{ hostvars[host].ansible_host }} {{ host }} {{ host }}.systech.local
          {% endif %}
          {% endfor %}

# -----------------------------------------------------------------------------
# PLAY 2: SELECT RANDOM NODE AND INJECT THE ASYMMETRIC FAULT
# -----------------------------------------------------------------------------
- name: "Incident 010 - Select Random Target and Inject Fault"
  hosts: localhost
  connection: local
  gather_facts: false
  become: no
  vars:
    target_group: "app_nodes"

  tasks:
    - name: "10 | Pick random target from {{ target_group }}"
      ansible.builtin.set_fact:
        target_node: "{{ groups[target_group] | random }}"

    - name: "20 | Add target to dynamic group"
      ansible.builtin.add_host:
        name: "{{ target_node }}"
        groups: incident_010_target

- name: "Incident 010 | Inject Locked and Expired User on Single Node"
  hosts: incident_010_target
  become: yes
  vars:
    incident_id: "010"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
    target_user: "jensyg"

  tasks:
    # --- Marker Guard ---
    - name: "30 | Check if incident was already injected"
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: check_inject

    - name: "31 | Abort if already active"
      ansible.builtin.debug:
        msg: "Incident {{ incident_id }} already injected on {{ inventory_hostname }}."
      when: check_inject.stat.exists

    - name: "32 | Create marker file"
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: touch
        mode: '0644'
      when: not check_inject.stat.exists

    # --- INJECT THE FAULT (Only on this random node) ---
    - name: "40 | Lock the user password (Asymmetric Fault)"
      ansible.builtin.command:
        cmd: "passwd -l {{ target_user }}"
      when: not check_inject.stat.exists

    - name: "41 | Expire the account in the past (Asymmetric Fault)"
      ansible.builtin.command:
        cmd: "chage -E 2020-01-01 {{ target_user }}"
      when: not check_inject.stat.exists

    # --- DECOYS & LOGS (Enhanced Realism) ---
    - name: "50 | Ensure /var/log/secure exists before writing"
      ansible.builtin.file:
        path: /var/log/secure
        state: touch
        mode: '0600'
      when: not check_inject.stat.exists

    - name: "51 | Generate realistic auth failure logs"
      ansible.builtin.lineinfile:
        path: /var/log/secure
        line: "{{ item }}"
        create: yes
        mode: '0600'
      loop:
        - "{{ '%b %d %H:%M:%S' | strftime }} {{ inventory_hostname }} sshd[{{ 10000 | random }}]: pam_unix(sshd:auth): authentication failure; logname= uid=0 euid=0 tty=ssh ruser= rhost=10.10.10.11 user={{ target_user }}"
        - "{{ '%b %d %H:%M:%S' | strftime }} {{ inventory_hostname }} sshd[{{ 10000 | random }}]: Account {{ target_user }} has expired"
        - "{{ '%b %d %H:%M:%S' | strftime }} {{ inventory_hostname }} sshd[{{ 10000 | random }}]: Failed password for {{ target_user }} from 10.10.10.11 port {{ 40000 | random }} ssh2"
      when: not check_inject.stat.exists

    - name: "51b | Look up current UID/GID for target_user"
      ansible.builtin.getent:
        database: passwd
        key: "{{ target_user }}"
      when: not check_inject.stat.exists

    - name: "52 | Add misleading comment to /etc/passwd"
      ansible.builtin.lineinfile:
        path: /etc/passwd
        regexp: "^{{ target_user }}:"
        line: "{{ target_user }}:x:{{ ansible_facts.getent_passwd[target_user][1] }}:{{ ansible_facts.getent_passwd[target_user][2] }}:Admin Account - UNDER SECURITY REVIEW:/home/{{ target_user }}:/bin/bash"
        state: present
      when: not check_inject.stat.exists

    - name: "53 | Create fake security audit log"
      ansible.builtin.copy:
        dest: /var/log/security_audit.log
        content: |
          [2026-09-01 22:15:33] SECURITY AUDIT - Credential Rotation
          User 'jensyg' flagged for review. Action taken: Account locked.
          Note: Script execution halted unexpectedly at 22:16:01.
          Next steps: Manual verification required on all cluster nodes.
        mode: '0644'
      when: not check_inject.stat.exists

    - name: "54 | Manipulate lastlog to show suspicious last login"
      ansible.builtin.command:
        cmd: "lastlog -u {{ target_user }} -t 365"
      ignore_errors: yes
      when: not check_inject.stat.exists

    - name: "55 | Create misleading .bashrc entry"
      ansible.builtin.lineinfile:
        path: "/home/{{ target_user }}/.bashrc"
        line: 'echo "WARNING: Account under security review - contact sysadmin@company.com"'
        create: yes
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'
      when: not check_inject.stat.exists

    - name: "56 | Create fake PAM debug log"
      ansible.builtin.copy:
        dest: /var/log/pam_debug.log
        content: |
          [2026-09-01 22:16:00] pam_unix(sshd:auth): user={{ target_user }} account expired
          [2026-09-01 22:16:00] pam_unix(sshd:auth): authentication failure
          [2026-09-01 22:16:01] Script terminated - manual intervention required
        mode: '0644'
      when: not check_inject.stat.exists

    - name: "57 | <DESCRIPCION_DE_TU_NUEVA_TAREA>"
      # Reemplaza este bloque con el módulo y los argumentos de tu tarea
      ansible.builtin.debug:
        msg: "Ejecutando tarea personalizada de inyección"
      when: not check_inject.stat.exists

    # --- FINALIZE ---
    - name: "60 | Display Injection Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 010 SUCCESSFULLY INJECTED
          =========================================
          Target Node : {{ inventory_hostname }} (ASYMMETRIC STATE)
          Target User : {{ target_user }}
          
          The user is LOCKED and EXPIRED ONLY ON THIS NODE.
          The user remains HEALTHY on the other app_nodes.
          
          L1 must check all nodes to detect the asymmetry.
          
          DECOYS INJECTED:
          - Misleading /etc/passwd comment
          - Fake security audit log
          - Fake PAM debug log
          - Misleading .bashrc warning
          - Realistic auth failure logs in /var/log/secure
          - <NUEVA_TAREA_INYECTADA_AQUI>
          =========================================
      when: not check_inject.stat.exists
