==============================================================================
INCIDENT INJECTION PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
==============================================================================
INCIDENT ID   : 010
TITLE         : Usuario no puede autenticarse aunque la contraseña es correcta
TARGET NODE   : Random node from app_nodes (Asymmetric Cluster State)
TARGET USER   : jensyg (UID 1001, GID 1001, group: sysadmins)
DIFFICULTY    : 4/10 (L1 Junior)
ESTIMATED TIME: 2 Hours
==============================================================================
SCENARIO CONTEXT:
The user 'jensyg' is a valid admin user that MUST exist on all app nodes
with the same UID/GID (1001/1001, group: sysadmins). However, a failed 
security audit script left the cluster in an ASYMMETRIC state: the account 
is locked/expired on ONLY ONE random node, while working perfectly on the others.
The L1 must realize that in an HA cluster, they must check ALL nodes.
==============================================================================

-----------------------------------------------------------------------------
PLAY 1: ENSURE HEALTHY BASELINE ON ALL APP NODES (Real HA Requirement)
-----------------------------------------------------------------------------
- name: "Incident 010 - Ensure User Exists on ALL App Nodes (HA Baseline)"
  hosts: app_nodes
  become: yes
  vars:
    target_user: "jensyg"
    target_password: "LabPassword123!"
    target_uid: 1001
    target_gid: 1001
    target_group: "sysadmins"
  
  tasks:
    - name: "01 | Ensure sysadmins group exists with GID 1001"
      ansible.builtin.group:
        name: "{{ target_group }}"
        gid: "{{ target_gid }}"
        state: present

    - name: "02 | Ensure user exists on ALL nodes with UID 1001 / GID 1001"
      ansible.builtin.user:
        name: "{{ target_user }}"
        uid: "{{ target_uid }}"
        group: "{{ target_group }}"
        shell: /bin/bash
        create_home: yes
        state: present

    - name: "03 | Set known good password on ALL nodes (SHA-512 hash)"
      ansible.builtin.user:
        name: "{{ target_user }}"
        password: "{{ target_password | password_hash('sha512') }}"
        update_password: always

    - name: "04 | Ensure account is NOT expired and NOT locked on ALL nodes"
      ansible.builtin.command:
        cmd: "chage -E -1 {{ target_user }}"

    - name: "05 | Unlock password just in case on ALL nodes"
      ansible.builtin.command:
        cmd: "passwd -u {{ target_user }}"
      ignore_errors: yes

-----------------------------------------------------------------------------
PLAY 2: SELECT RANDOM NODE AND INJECT THE ASYMMETRIC FAULT
-----------------------------------------------------------------------------
- name: "Incident 010 - Select Random Target and Inject Fault"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_group: "app_nodes"
  
  tasks:
    - name: "10 | Pick random target from {{ target_group }}"
      ansible.builtin.set_fact:
        target_node: "{{ groups[target_group] | random }}"

    - name: "20 | Add target to dynamic group"
      ansible.builtin.add_host:
        name: "{{ target_node }}"
        groups: incident_010_target

- name: "Incident 010 | Inject Locked and Expired User on Single Node"
  hosts: incident_010_target
  become: yes
  vars:
    incident_id: "010"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
    target_user: "jensyg"
    target_uid: 1001
    target_gid: 1001
  
  tasks:
    # --- Marker Guard ---
    - name: "30 | Check if incident was already injected"
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: check_inject

    - name: "31 | Abort if already active"
      ansible.builtin.debug:
        msg: "Incident {{ incident_id }} already injected on {{ inventory_hostname }}."
      when: check_inject.stat.exists

    - name: "32 | Create marker file"
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: touch
        mode: '0644'
      when: not check_inject.stat.exists

    # --- INJECT THE FAULT (Only on this random node) ---
    - name: "40 | Lock the user password (Asymmetric Fault)"
      ansible.builtin.command:
        cmd: "passwd -l {{ target_user }}"
      when: not check_inject.stat.exists

    - name: "41 | Expire the account in the past (Asymmetric Fault)"
      ansible.builtin.command:
        cmd: "chage -E 2020-01-01 {{ target_user }}"
      when: not check_inject.stat.exists

    # --- DECOYS & LOGS (Enhanced Realism) ---
    - name: "50 | Ensure /var/log/secure exists before writing"
      ansible.builtin.file:
        path: /var/log/secure
        state: touch
        mode: '0600'
      when: not check_inject.stat.exists

    - name: "51 | Generate realistic auth failure logs"
      ansible.builtin.lineinfile:
        path: /var/log/secure
        line: "{{ item }}"
        create: yes
        mode: '0600'
      loop:
        - "{{ '%b %d %H:%M:%S' | strftime }} {{ inventory_hostname }} sshd[{{ 10000 | random }}]: pam_unix(sshd:auth): authentication failure; logname= uid=0 euid=0 tty=ssh ruser= rhost=10.10.10.11 user={{ target_user }}"
        - "{{ '%b %d %H:%M:%S' | strftime }} {{ inventory_hostname }} sshd[{{ 10000 | random }}]: Account {{ target_user }} has expired"
        - "{{ '%b %d %H:%M:%S' | strftime }} {{ inventory_hostname }} sshd[{{ 10000 | random }}]: Failed password for {{ target_user }} from 10.10.10.11 port {{ 40000 | random }} ssh2"
      when: not check_inject.stat.exists

    - name: "52 | Add misleading comment to /etc/passwd"
      ansible.builtin.lineinfile:
        path: /etc/passwd
        regexp: "^{{ target_user }}:"
        line: "{{ target_user }}:x:{{ target_uid }}:{{ target_gid }}:Admin Account - UNDER SECURITY REVIEW:/home/{{ target_user }}:/bin/bash"
        state: present
      when: not check_inject.stat.exists

    - name: "53 | Create fake security audit log"
      ansible.builtin.copy:
        dest: /var/log/security_audit.log
        content: |
          [2026-09-01 22:15:33] SECURITY AUDIT - Credential Rotation
          User 'jensyg' flagged for review. Action taken: Account locked.
          Note: Script execution halted unexpectedly at 22:16:01.
          Next steps: Manual verification required on all cluster nodes.
        mode: '0644'
      when: not check_inject.stat.exists

    - name: "54 | Manipulate lastlog to show suspicious last login"
      ansible.builtin.command:
        cmd: "lastlog -u {{ target_user }} -t 365"
      ignore_errors: yes
      when: not check_inject.stat.exists

    - name: "55 | Create misleading .bashrc entry"
      ansible.builtin.lineinfile:
        path: "/home/{{ target_user }}/.bashrc"
        line: 'echo "WARNING: Account under security review - contact sysadmin@company.com"'
        create: yes
        owner: "{{ target_user }}"
        group: "{{ target_gid }}"
        mode: '0644'
      when: not check_inject.stat.exists

    - name: "56 | Create fake PAM debug log"
      ansible.builtin.copy:
        dest: /var/log/pam_debug.log
        content: |
          [2026-09-01 22:16:00] pam_unix(sshd:auth): user={{ target_user }} account expired
          [2026-09-01 22:16:00] pam_unix(sshd:auth): authentication failure
          [2026-09-01 22:16:01] Script terminated - manual intervention required
        mode: '0644'
      when: not check_inject.stat.exists

    # --- FINALIZE ---
    - name: "60 | Display Injection Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 010 SUCCESSFULLY INJECTED
          =========================================
          Target Node : {{ inventory_hostname }} (ASYMMETRIC STATE)
          Target User : {{ target_user }} (UID {{ target_uid }}, GID {{ target_gid }})
          
          The user is LOCKED and EXPIRED ONLY ON THIS NODE.
          The user remains HEALTHY on the other app_nodes.
          
          L1 must check all nodes to detect the asymmetry.
          
          DECOYS INJECTED:
          - Misleading /etc/passwd comment
          - Fake security audit log
          - Fake PAM debug log
          - Misleading .bashrc warning
          - Realistic auth failure logs in /var/log/secure
          =========================================
      when: not check_inject.stat.exists
