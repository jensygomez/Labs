==============================================================================
INCIDENT RECOVERY PLAYBOOK - SYSTECH-HA-001 LAB ENVIRONMENT
==============================================================================
INCIDENT ID   : 010
PURPOSE       : Restore the locked/expired user 'jensyg' on the target node.
NOTE          : Runs against all app_nodes. Only the node with the incident
                marker will execute the recovery tasks (Marker Guard filter).
==============================================================================
- name: "Recovery 010 | Restore Locked and Expired User"
  hosts: app_nodes
  become: yes
  vars:
    incident_id: "010"
    marker_file: "/var/run/.incident_{{ incident_id }}_marker"
    target_user: "jensyg"
    target_uid: 1001
    target_gid: 1001
  
  tasks:
    - name: "01 | Check if incident marker exists on this node"
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: check_inject

    - name: "02 | Unlock the user password"
      ansible.builtin.command:
        cmd: "passwd -u {{ target_user }}"
      register: unlock_result
      when: check_inject.stat.exists

    - name: "03 | Remove account expiration (set to never)"
      ansible.builtin.command:
        cmd: "chage -E -1 {{ target_user }}"
      when: check_inject.stat.exists

    - name: "04 | Restore /etc/passwd comment to normal"
      ansible.builtin.lineinfile:
        path: /etc/passwd
        regexp: "^{{ target_user }}:"
        line: "{{ target_user }}:x:{{ target_uid }}:{{ target_gid }}::/home/{{ target_user }}:/bin/bash"
        state: present
      when: check_inject.stat.exists

    - name: "05 | Remove fake security audit log"
      ansible.builtin.file:
        path: /var/log/security_audit.log
        state: absent
      when: check_inject.stat.exists

    - name: "06 | Remove fake PAM debug log"
      ansible.builtin.file:
        path: /var/log/pam_debug.log
        state: absent
      when: check_inject.stat.exists

    - name: "07 | Remove misleading .bashrc entry"
      ansible.builtin.lineinfile:
        path: "/home/{{ target_user }}/.bashrc"
        regexp: "^echo.*WARNING.*Account under security review"
        state: absent
      when: check_inject.stat.exists

    - name: "08 | Verify user status is now PS (Password Set, usable)"
      ansible.builtin.command:
        cmd: "passwd -S {{ target_user }}"
      register: final_status
      changed_when: false
      when: check_inject.stat.exists

    - name: "09 | Verify account expiration is never"
      ansible.builtin.command:
        cmd: "chage -l {{ target_user }}"
      register: final_chage
      changed_when: false
      when: check_inject.stat.exists

    - name: "10 | Remove the incident marker file"
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: absent
      when: check_inject.stat.exists

    - name: "11 | Display Recovery Summary"
      ansible.builtin.debug:
        msg: |
          =========================================
          INCIDENT 010 SUCCESSFULLY RECOVERED
          =========================================
          Target Node : {{ inventory_hostname }}
          Target User : {{ target_user }} (UID {{ target_uid }}, GID {{ target_gid }})
          
          passwd -S   : {{ final_status.stdout }}
          chage -l    : {{ final_chage.stdout_lines | select('match', '.*expires.*') | list }}
          
          CLEANUP COMPLETED:
          - Password unlocked.
          - Account expiration removed.
          - /etc/passwd comment restored.
          - Fake security audit log removed.
          - Fake PAM debug log removed.
          - Misleading .bashrc warning removed.
          - Marker file cleaned up.
          =========================================
      when: check_inject.stat.exists
