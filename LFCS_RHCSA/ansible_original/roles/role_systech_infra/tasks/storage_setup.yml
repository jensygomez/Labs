# ==============================================================================
# ROL: STORAGE SETUP — Nodo de Almacenamiento Centralizado (storage01)
# ==============================================================================
#
# IP: 10.10.10.50
# HOSTNAME: storage01
# SISTEMA OPERATIVO: AlmaLinux 9 (VM en Proxmox)
#
# PROPÓSITO:
#   Este nodo actúa como el almacenamiento centralizado de todo el clúster,
#   proporcionando volúmenes compartidos vía NFSv4 para:
#     - Código de la aplicación web (/exports/webdata) → montado en /var/www/html
#       de los app nodes (app01, app02, app03).
#     - Datos de PostgreSQL (/exports/pgdata) → montado en /var/lib/pgsql/data
#       del nodo de base de datos (db01).
#
# CARACTERÍSTICAS PRINCIPALES:
#   - Gestión de volúmenes lógicos (LVM) sobre discos físicos (/dev/sdb, /dev/sdc, /dev/sdd, /dev/sde).
#   - Exportaciones NFS con contextos SELinux apropiados (nfs_t).
#   - Firewalld configurado para permitir servicios NFS (nfs, mountd, rpc-bind).
#   - Incluye herramientas de gestión SELinux (policycoreutils-python-utils).
#
# DEPENDENCIAS:
#   - Los nodos de aplicación (app_nodes) montan /exports/webdata.
#   - El nodo de base de datos (db01) monta /exports/pgdata.
#   - Ambos montajes requieren que storage01 esté accesible y que los servicios
#     NFS estén activos.
#
# VARIABLES UTILIZADAS:
#   - nfs_exports: Lista de diccionarios con lv_name, lv_size y path.
#   - storage_host_ip: IP de storage01 (10.10.10.50) usada en otros roles.
#
# NOTAS DE SEGURIDAD:
#   - Los directorios exportados tienen permisos 0777 para permitir escritura
#     desde los clientes NFS (el control de acceso se gestiona a nivel de
#     usuario/grupo en los clientes).
#   - SELinux está en modo enforcing y se configuran contextos adecuados.
#
# RECUPERACIÓN ANTE FALLOS:
#   - Si storage01 falla, todo el clúster pierde acceso a los datos compartidos.
#   - Se recomienda implementar backups periódicos de los volúmenes LVM
#     (snapshots) y replicación a otro nodo para alta disponibilidad.
#


---
# ==============================================================================
# STORAGE SETUP — AlmaLinux 9 (VM)
# ==============================================================================

- name: "Instalar paquetes de NFS, LVM e iSCSI"
  ansible.builtin.dnf:
    name:
      - nfs-utils
      - lvm2
      - firewalld
      - targetcli
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: "Crear grupo postgres en storage01 con GID 26"
  ansible.builtin.group:
    name: postgres
    gid: 26
    system: true
  when: ansible_hostname == "storage01"

- name: "Crear usuario postgres en storage01 con UID 26"
  ansible.builtin.user:
    name: postgres
    uid: 26
    group: postgres
    create_home: false
    system: true
  when: ansible_hostname == "storage01"

- name: "Crear Volume Group en storage01"
  community.general.lvg:
    vg: "vg_storage"
    pvs: "/dev/sdb,/dev/sdc,/dev/sdd,/dev/sde"
  when: ansible_os_family == "RedHat"

- name: "Crear Logical Volumes para NFS"
  community.general.lvol:
    vg: "vg_storage"
    lv: "{{ item.lv_name }}"
    size: "{{ item.lv_size }}"
  loop: "{{ nfs_exports }}"
  when: ansible_os_family == "RedHat"

- name: "Crear Filesystem XFS en los LVs de NFS"
  community.general.filesystem:
    fstype: xfs
    dev: "/dev/vg_storage/{{ item.lv_name }}"
  loop: "{{ nfs_exports }}"
  when: ansible_os_family == "RedHat"

- name: "Crear directorios de exportación NFS"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0777'
  loop: "{{ nfs_exports }}"
  when: ansible_os_family == "RedHat"

- name: "Montar LVs en los puntos de exportación NFS"
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "/dev/vg_storage/{{ item.lv_name }}"
    fstype: xfs
    state: mounted
  loop: "{{ nfs_exports }}"
  when: ansible_os_family == "RedHat"

- name: "Configurar archivo /etc/exports"
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    mode: '0644'
  notify: Restart NFS
  when: ansible_os_family == "RedHat"

- name: "Asegurar que los servicios de NFS y Firewalld estén activos"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - nfs-server
    - firewalld
  when: ansible_os_family == "RedHat"

- name: "Permitir servicios NFS en Firewalld"
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - nfs
    - mountd
    - rpc-bind
  when: ansible_os_family == "RedHat"

