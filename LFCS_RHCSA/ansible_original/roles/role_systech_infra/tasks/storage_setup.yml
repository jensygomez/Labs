- name: "Instalar herramientas de gestión SELinux"
  ansible.builtin.dnf:
    name:
      - policycoreutils-python-utils
      - selinux-policy-targeted
    state: present
  when:
    - ansible_os_family == "RedHat"
    - ansible_selinux.status == "enabled"

- name: "Configurar contexto SELinux para exports NFS"
  ansible.builtin.command:
    cmd: "semanage fcontext -a -t nfs_t '{{ item.path }}(/.*)?'"
  loop: "{{ nfs_exports }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_selinux.status == "enabled"
  register: semanage_nfs
  changed_when: "'already defined' not in semanage_nfs.stderr"
  failed_when:
    - semanage_nfs.rc != 0
    - "'already defined' not in semanage_nfs.stderr"

- name: "Aplicar contexto SELinux recursivamente a exports NFS"
  ansible.builtin.command:
    cmd: "restorecon -Rv {{ item.path }}"
  loop: "{{ nfs_exports }}"
  when:
    - ansible_os_family == "RedHat"
    - ansible_selinux.status == "enabled"
  changed_when: true
  

- name: "Asegurar directorio de subidas NFS con permisos de escritura"
  ansible.builtin.file:
    path: "/exports/webdata/uploads"
    state: directory
    owner: root
    group: root
    mode: '0777'
  when: ansible_os_family == "RedHat"
