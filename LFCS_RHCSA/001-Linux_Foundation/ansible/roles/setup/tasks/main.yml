---
# Actualizar el sistema primero
- name: Actualizar todos los paquetes del sistema
  ansible.builtin.dnf:
    name: "*"
    state: latest
  when: update_system | bool
  tags:
    - update

# Habilitar EPEL (necesario para htop, strace, etc.)
- name: Instalar EPEL release
  ansible.builtin.dnf:
    name: epel-release
    state: present
  tags:
    - packages

- name: Habilitar CRB (CodeReady Builder) para más paquetes
  ansible.builtin.command:
    cmd: dnf config-manager --set-enabled crb
  changed_when: false
  failed_when: false
  tags:
    - packages

# Instalar paquetes del repositorio base
- name: Instalar paquetes base
  ansible.builtin.dnf:
    name:
      - acl
      - attr
      - firewalld
      - openssh-server
      - chrony
      - git
      - vim
      - nano
      - tree
      - lsof
      - tcpdump
      - net-tools
      - bind-utils
      - policycoreutils-python-utils
      - setools-console
      - audit
      - at
      - cronie
      - man-db
      - man-pages
      - info
    state: present
  tags:
    - packages

# Instalar paquetes de EPEL
- name: Instalar paquetes de EPEL
  ansible.builtin.dnf:
    name:
      - htop
      - strace
    state: present
  tags:
    - packages

# Orquestar subtareas
- name: Incluir tareas de creación de usuarios y grupos
  ansible.builtin.include_tasks: 01-users-groups.yml
  tags:
    - users
    - groups

- name: Incluir tareas de creación de estructura de directorios
  ansible.builtin.include_tasks: 02-directory-structure.yml
  tags:
    - directories

- name: Incluir tareas de creación de archivos y permisos
  ansible.builtin.include_tasks: 03-files-permissions.yml
  tags:
    - files
    - permissions

- name: Incluir tareas de configuración de red
  ansible.builtin.include_tasks: 04-networking-setup.yml
  tags:
    - networking
