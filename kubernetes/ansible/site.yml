---
- name: "Aprovisionamiento del Cluster de Kubernetes"
  hosts: all
  become: true
  vars:
    k8s_version: "v1.36"
  tasks:
    - name: "Configurar DNS"
      ansible.builtin.import_tasks: roles/dns.yml

- name: "Prerrequisitos de Kubernetes en todos los nodos"
  hosts: k8s_control_plane:k8s_workers
  become: true
  vars:
    k8s_version: "v1.36"
  tasks:
    - name: "Instalar containerd, kubeadm, kubelet, kubectl"
      ansible.builtin.import_tasks: roles/k8s_common.yml
  handlers:
    - name: Reiniciar containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted

- name: "Inicializar el Control Plane"
  hosts: k8s_control_plane
  become: true
  tasks:
    - name: "kubeadm init + Flannel"
      ansible.builtin.import_tasks: roles/k8s_master.yml

- name: "Unir los Workers al Cluster"
  hosts: k8s_workers
  become: true
  tasks:
    - name: "kubeadm join"
      ansible.builtin.import_tasks: roles/k8s_workers.yml
      
- name: "Unir los Workers al Cluster"
  hosts: k8s_workers
  become: true
  tasks:
    - name: "kubeadm join"
      ansible.builtin.import_tasks: roles/k8s_workers.yml

- name: "Etiquetar los workers con su rol"
  hosts: k8s_control_plane
  become: true
  become_user: ansible
  tasks:
    - name: "Etiquetar los nodos worker"
      ansible.builtin.command: >
        kubectl --kubeconfig=/home/ansible/.kube/config
        label node {{ item }} node-role.kubernetes.io/worker=worker --overwrite
      loop: "{{ groups['k8s_workers'] }}"
      changed_when: true    
