---
- name: "Inicializar el control plane con kubeadm"
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr=10.244.0.0/16
    --apiserver-advertise-address={{ ansible_host }}
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init

- name: "Crear directorio .kube para el usuario ansible"
  ansible.builtin.file:
    path: /home/ansible/.kube
    state: directory
    owner: ansible
    group: ansible
    mode: '0755'

- name: "Copiar admin.conf como kubeconfig del usuario ansible"
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ansible/.kube/config
    remote_src: true
    owner: ansible
    group: ansible
    mode: '0600'

- name: "Instalar Flannel (CNI)"
  become: true
  become_user: ansible
  ansible.builtin.command: >
    kubectl --kubeconfig=/home/ansible/.kube/config
    apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  register: flannel_apply
  changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"

- name: "Generar comando de join para los workers"
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_raw
  changed_when: false

- name: "Guardar comando de join como fact"
  ansible.builtin.set_fact:
    join_command: "{{ join_command_raw.stdout }}"
    

- name: "Etiquetar los nodos worker con su rol"
  become: true
  become_user: ansible
  ansible.builtin.command: >
    kubectl --kubeconfig=/home/ansible/.kube/config
    label node {{ item }} node-role.kubernetes.io/worker=worker --overwrite
  loop: "{{ groups['k8s_workers'] }}"
  changed_when: true
