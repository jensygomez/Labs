---
# roles/rhce.yml
# Preparación base para laboratorio RHCE (EX294)
# Asume: usuario 'ansible' ya inyectado por cloud-init con NOPASSWD y SSH key
# Se aplica a: rhce_control + rhce_managed (todos los nodos del lab)

- name: "Verificar que el usuario ansible existe (inyectado por cloud-init)"
  ansible.builtin.getent:
    database: passwd
    key: ansible
  register: ansible_user_check
  failed_when: ansible_user_check.ansible_facts.getent_passwd.ansible is not defined

- name: "Asegurar sudoers NOPASSWD para ansible (idempotente)"
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ansible
    content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: "Instalar paquetes base del laboratorio RHCE"
  ansible.builtin.dnf:
    name:
      - vim-enhanced
      - bash-completion
      - git
      - jq
      - tmux
      - tree
      - wget
      - lsof
      - tcpdump
      - bind-utils
      - net-tools
      - nmap-ncat
      - firewalld
      - python3
      - python3-pip
    state: present

- name: "Habilitar y arrancar firewalld (RHCE trabaja con firewalld)"
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: "Habilitar y arrancar qemu-guest-agent (ya viene del cloud-init)"
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

- name: "Configurar hostname al inventory_hostname"
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
    use: systemd

- name: "Configurar /etc/hosts con todos los nodos del lab"
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED RHCE LAB"
    block: |
      {% for host in groups['all'] %}
      {% if hostvars[host].ansible_host is defined %}
      {{ hostvars[host].ansible_host }} {{ host }} {{ host }}.lab.local
      {% endif %}
      {% endfor %}

# ============================================================
# Solo en el nodo de CONTROL: instalar ansible-core y colecciones
# ============================================================
- name: "Control | Instalar ansible-core y rhel-system-roles"
  ansible.builtin.dnf:
    name:
      - ansible-core
      - rhel-system-roles
    state: present
  when: inventory_hostname in groups['rhce_control']

- name: "Control | Instalar colecciones requeridas por EX294"
  ansible.builtin.command:
    cmd: "ansible-galaxy collection install {{ item }} --force-with-deps"
    creates: "/home/ansible/.ansible/collections/ansible_collections/{{ item.split('.')[0] }}/{{ item.split('.')[1] }}"
  loop:
    - ansible.posix
    - ansible.utils
    - community.general
    - redhat.rhel_system_roles
  become: true
  become_user: ansible
  when: inventory_hostname in groups['rhce_control']

- name: "Control | Configurar ansible.cfg base para el usuario ansible"
  ansible.builtin.copy:
    dest: /home/ansible/.ansible.cfg
    owner: ansible
    group: ansible
    mode: "0644"
    content: |
      [defaults]
      inventory = /home/ansible/inventory
      host_key_checking = False
      interpreter_python = auto_silent
      stdout_callback = yaml
      callbacks_enabled = profile_tasks, timer

      [privilege_escalation]
      become = True
      become_method = sudo
      become_user = root
      become_ask_pass = False
  when: inventory_hostname in groups['rhce_control']

- name: "Control | Crear directorio de práctica del examen"
  ansible.builtin.file:
    path: /home/ansible/rhce-lab
    state: directory
    owner: ansible
    group: ansible
    mode: "0755"
  when: inventory_hostname in groups['rhce_control']
