---
# roles/rhce.yml
# Preparación base para laboratorio RHCE (EX294)
# Precondición: usuario 'ansible' ya existe (inyectado por cloud-init)
#               con NOPASSWD y SSH key pública.
# Aplica a: rhce_control + rhce_managed

# ============================================================
# Validaciones (fallan temprano si el cloud-init no corrió bien)
# ============================================================
- name: "Validar que el usuario ansible existe"
  ansible.builtin.getent:
    database: passwd
    key: ansible
  register: _ansible_user_check

- name: "Fallar si el usuario ansible no existe"
  ansible.builtin.assert:
    that:
      - "'ansible' in (_ansible_user_check.ansible_facts.getent_passwd | default({}))"
    fail_msg: "El usuario 'ansible' no existe. Verifica que cloud-init corrió correctamente."
    success_msg: "Usuario ansible OK."

- name: "Validar que ansible tiene sudo NOPASSWD"
  ansible.builtin.command:
    cmd: sudo -n true
  become: true
  become_user: ansible
  changed_when: false
  register: _sudo_check
  failed_when: _sudo_check.rc != 0


# ============================================================
# Paquetes base y servicios
# ============================================================
- name: "Instalar paquetes base del laboratorio RHCE"
  ansible.builtin.dnf:
    name:
      - vim-enhanced
      - bash-completion
      - git
      - jq
      - tmux
      - tree
      - wget
      - lsof
      - tcpdump
      - bind-utils
      - net-tools
      - nmap-ncat
      - firewalld
      - python3
      - python3-pip
    state: present

- name: "Habilitar y arrancar firewalld"
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: "Habilitar y arrancar qemu-guest-agent"
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

# ============================================================
# Hostname (el /etc/hosts lo maneja dns_nodes.yml en site.yml,
# NO se duplica aquí)
# ============================================================
- name: "Configurar hostname al inventory_hostname"
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# ============================================================
# Solo en el nodo de CONTROL: ansible-core + colecciones
# ============================================================
- name: "Control | Instalar ansible-core y rhel-system-roles"
  ansible.builtin.dnf:
    name:
      - ansible-core
      - rhel-system-roles
    state: present
  when: inventory_hostname in groups['rhce_control']

- name: "Control | Crear directorio de colecciones para ansible"
  ansible.builtin.file:
    path: /home/ansible/.ansible/collections
    state: directory
    owner: ansible
    group: ansible
    mode: "0755"
  when: inventory_hostname in groups['rhce_control']

- name: "Control | Instalar colecciones requeridas por EX294"
  ansible.builtin.command:
    cmd: "ansible-galaxy collection install {{ item }}"
    creates: "/home/ansible/.ansible/collections/ansible_collections/{{ item.split('.')[0] }}/{{ item.split('.')[1] }}"
  loop:
    - ansible.posix
    - ansible.utils
    - community.general
  become: true
  become_user: ansible
  when: inventory_hostname in groups['rhce_control']

- name: "Control | Configurar ansible.cfg para el usuario ansible"
  ansible.builtin.copy:
    dest: /home/ansible/.ansible.cfg
    owner: ansible
    group: ansible
    mode: "0644"
    content: |
      [defaults]
      inventory = /home/ansible/inventory
      host_key_checking = False
      interpreter_python = auto_silent
      stdout_callback = yaml
      callbacks_enabled = profile_tasks, timer

      [privilege_escalation]
      become = True
      become_method = sudo
      become_user = root
      become_ask_pass = False
  when: inventory_hostname in groups['rhce_control']

- name: "Control | Crear directorio de práctica del examen"
  ansible.builtin.file:
    path: /home/ansible/rhce-lab
    state: directory
    owner: ansible
    group: ansible
    mode: "0755"
  when: inventory_hostname in groups['rhce_control']
 
- name: "Crear /root/.ansible/tmp con permisos correctos"
  ansible.builtin.file:
    path: /root/.ansible/tmp
    state: directory
    owner: root
    group: root
    mode: "0755"
