- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Avanzado"
  orden: 5
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: A service 'lab-forking-no-pidfile.service' is marked as active but systemd cannot track its main process correctly[cite: 15].
    Task: Fix a 'Type=forking' service.
    Technical Requirements:
    - Identify the missing 'PIDFile' directive in the [Service] section.
    - Modify the service to use a proper PID file or change its Type to 'simple' if appropriate for the command used.

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Avanzado"
  orden: 6
