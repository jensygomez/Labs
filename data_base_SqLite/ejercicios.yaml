      Run again and pipe stderr to debug.log.
    - Identify the logic bug: the script uses 'expr' which exits
      non-zero when the result is 0, causing 'set -e' to abort.
    - Create analisis_corregido.sh that fixes:
        a) Replace all 'expr' with $(( )) arithmetic.
        b) Replace all 'test' subshells with [[ ]] built-ins.
        c) Replace 'echo | tr' with ${var^^} / ${var,,}.
