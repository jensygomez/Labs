- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Avanzado"
  orden: 1
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: A system boots into emergency.target because /etc/fstab
    has an entry pointing to a non-existent device. You need to
    diagnose and fix it without reinstalling.
    Task: Simulate and repair an fstab corruption scenario.
    Technical Requirements:
    - Study the broken fstab example provided by the lab:
        cat /opt/labs/bloque10/recovery/fstab_roto.example
    - Simulate the error safely by adding a bad entry to fstab:
        cp /etc/fstab /etc/fstab.lab_bak
        echo "/dev/sdb99  /mnt/data_lab  xfs  defaults  0 0" >> /etc/fstab
    - Verify the entry would fail at boot without rebooting:
        mount -a 2>&1 | grep -i "error\|fail\|special"
      You should see a mount error for /dev/sdb99.
    - Fix the fstab by removing the bad entry:
        grep -v "/dev/sdb99" /etc/fstab.lab_bak > /etc/fstab
    - Verify fstab is now correct:
        mount -a && echo "fstab OK" || echo "fstab still broken"
    - Verify the restore matches the original:
        diff /etc/fstab /etc/fstab.lab_bak \
            && echo "fstab fully restored" || echo "diff found"
    - Document in /tmp/fstab_repair.txt the steps taken and
      what would happen at boot if left broken:
        emergency.target is activated when a required mount fails.

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Avanzado"
  orden: 2
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: On the RHCSA exam the most common recovery task is
    resetting the root password using rd.break.
    Task: Reset the root password of the system using the
    rd.break method via GRUB2.
    Technical Requirements:
    - This exercise requires a real reboot of the VM.
      Read the full procedure before starting:
        cat /opt/labs/bloque10/recovery/procedures/rd_break_procedure.txt
    - Steps to execute during the exercise:
        1. Reboot the VM:  systemctl reboot
        2. At GRUB menu press 'e' to edit the boot entry.
        3. Find the line starting with 'linux' or 'linuxefi'.
        4. Append at the end of that line:
             rd.break enforcing=0
        5. Press Ctrl+X to boot.
        6. At the (switch_root) prompt remount sysroot:
             mount -o remount,rw /sysroot
        7. Enter chroot:
             chroot /sysroot
        8. Change root password:
             passwd root
             (set new password: RootLabNew2024!)
        9. Create SELinux relabel file:
             touch /.autorelabel
       10. Exit and reboot:
             exit
             exit
    - After reboot verify:
        Login as root with new password: RootLabNew2024!
        getenforce   → should be Enforcing after relabel
    - Restore original password after verification:
        passwd root  (set back to your original password)

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Avanzado"
  orden: 3
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: A service is failing at boot and you need to use
    rescue.target to diagnose and fix it without the full
    system interfering.
    Task: Boot into rescue.target, diagnose a failing service
    and fix it from within rescue mode.
    Technical Requirements:
    - This exercise requires a reboot.
      Read the procedure before starting:
        cat /opt/labs/bloque10/recovery/procedures/rescue_target_procedure.txt
    - Before rebooting, break lab-broken-service intentionally:
        systemctl enable lab-broken-service.service
    - Reboot into rescue.target:
        1. At GRUB press 'e' to edit the boot entry.
        2. Append to the linux line:
             systemd.unit=rescue.target
        3. Press Ctrl+X to boot.
        4. Enter root password when prompted.
    - Once in rescue.target diagnose the broken service:
        systemctl status lab-broken-service.service
        journalctl -u lab-broken-service.service -n 20
        systemctl cat lab-broken-service.service
    - Fix the service by editing its ExecStart:
        systemctl edit --full lab-broken-service.service
        Change ExecStart to: /bin/true
        systemctl daemon-reload
    - Return to normal boot:
        systemctl default
    - Verify after full boot:
        systemctl status lab-broken-service.service
        systemctl disable lab-broken-service.service

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Avanzado"
  orden: 4
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: A remote server has no GUI and logs need to be
    centralized from multiple sources. You need to configure
    rsyslog to receive logs over the network.
    Task: Configure rsyslog as a log receiver on UDP port 514
    and send test messages to it from the local system.
    Technical Requirements:
    - Configure rsyslog to listen on UDP port 514:
        Create /etc/rsyslog.d/40-lab-receiver.conf:
          module(load="imudp")
          input(type="imudp" port="514")
          # Store remote logs separately
          template(name="RemoteLogs" type="string"
            string="/var/log/remote/%HOSTNAME%/%PROGRAMNAME%.log")
          if $fromhost-ip != '127.0.0.1' then ?RemoteLogs
          & stop
    - Create the remote logs directory:
        mkdir -p /var/log/remote
        chmod 755 /var/log/remote
    - Restart rsyslog and verify it listens on 514/udp:
        systemctl restart rsyslog
        ss -ulnp | grep 514
    - Configure rsyslog to also SEND logs to itself for testing:
        Create /etc/rsyslog.d/50-lab-sender.conf:
          *.info  @127.0.0.1:514
    - Restart rsyslog and generate test traffic:
        systemctl restart rsyslog
        logger -p user.info -t LAB_REMOTE "test remote log entry"
    - Verify the remote log was received:
        ls /var/log/remote/
        find /var/log/remote -name "*.log" -exec tail -3 {} \;
    - Clean up both config files and restart rsyslog.

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Avanzado"
  orden: 5
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: A custom logrotate configuration needs to handle
    multiple log files with different retention policies and
    post-rotation actions.
    Task: Create a complete logrotate configuration for the
    lab log files with post-rotation hooks.
    Technical Requirements:
    - Create /etc/logrotate.d/lab-advanced with this policy:
        /var/log/lab.log
        /var/log/lab_disk_check.log
        /var/log/lab_cron.log {
            daily
            rotate 14
            compress
            delaycompress
            missingok
            notifempty
            create 0640 root root
            dateext
            dateformat -%Y%m%d
            sharedscripts
            prerotate
                echo "$(date) – pre-rotation" >> /var/log/lab_rotate_audit.log
            endscript
            postrotate
                systemctl reload rsyslog > /dev/null 2>&1 || true
                echo "$(date) – post-rotation" >> /var/log/lab_rotate_audit.log
            endscript
        }
    - Verify the configuration syntax:
        logrotate -d /etc/logrotate.d/lab-advanced
    - Force rotation and verify date-suffixed files are created:
        logrotate -f /etc/logrotate.d/lab-advanced
        ls -lh /var/log/lab*.log*
    - Verify the audit log captured the pre/post scripts:
        cat /var/log/lab_rotate_audit.log
    - Run rotation a second time and verify rotate 14 behavior:
        logrotate -f /etc/logrotate.d/lab-advanced
        ls -lh /var/log/lab.log*

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Avanzado"
  orden: 6
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: chrony needs to be configured for an isolated
    network where internet NTP servers are unreachable.
    The system must act as its own NTP reference.
    Task: Configure chrony to use the local clock as a
    stratum 10 reference and verify synchronization.
    Technical Requirements:
    - Backup current chrony configuration:
        cp /etc/chrony.conf /etc/chrony.conf.bak_$(date +%Y%m%d)
    - Modify /etc/chrony.conf for isolated network:
        a) Comment out all existing 'pool' and 'server' lines:
             sed -i 's/^pool/#pool/g; s/^server/#server/g' /etc/chrony.conf
        b) Add local clock as source at stratum 10:
             echo "local stratum 10" >> /etc/chrony.conf
        c) Allow the local network to query this server:
             echo "allow 192.168.0.0/16" >> /etc/chrony.conf
    - Restart chronyd:
        systemctl restart chronyd
    - Verify the local clock is now the source:
        chronyc sources -v
        chronyc tracking
      The Reference ID should show LOCAL or 127.127.1.1
    - Verify stratum is 10:
        chronyc tracking | grep "Stratum"
    - Test that other systems could query this server:
        chronyc -h 127.0.0.1 tracking
    - Restore original configuration:
        cp /etc/chrony.conf.bak_$(date +%Y%m%d) /etc/chrony.conf
        systemctl restart chronyd
        chronyc sources -v

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Avanzado"
  orden: 7
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: A critical application needs to be monitored by
    systemd with automatic restart, resource limits and
    dependency on another service.
    Task: Create an advanced systemd service unit with
    restart policy, resource limits and a dependency chain.
    Technical Requirements:
    - Create the monitored application script:
        cat > /usr/local/bin/lab-app.sh << 'EOF'
        #!/bin/bash
        trap 'exit 0' SIGTERM
        COUNT=0
        while true; do
            COUNT=$((COUNT + 1))
            echo "$(date) app ciclo $COUNT"
            # Simulate random crash every ~20 cycles
            [[ $((RANDOM % 20)) -eq 0 ]] && exit 1
            sleep 3
        done
        EOF
        chmod +x /usr/local/bin/lab-app.sh
    - Create /etc/systemd/system/lab-app.service:
        [Unit]
        Description=Lab Application Service
        After=lab-boot-monitor.service
        Requires=lab-boot-monitor.service
        [Service]
        Type=simple
        ExecStart=/usr/local/bin/lab-app.sh
        Restart=on-failure
        RestartSec=5
        StartLimitInterval=60
        StartLimitBurst=3
        StandardOutput=journal
        StandardError=journal
        CPUQuota=20%
        MemoryLimit=64M
        [Install]
        WantedBy=multi-user.target
    - Enable and start the service:
        systemctl daemon-reload
        systemctl enable --now lab-app.service
    - Observe automatic restart behavior:
        watch -n2 systemctl status lab-app.service
        journalctl -u lab-app.service -f
      Wait for a crash and verify systemd restarts it.
    - Verify resource limits are applied:
        systemctl show lab-app.service | grep -E "CPU|Memory"
    - Clean up:
        systemctl disable --now lab-app.service
        rm /etc/systemd/system/lab-app.service
        rm /usr/local/bin/lab-app.sh
        systemctl daemon-reload

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Avanzado"
  orden: 8
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: You need to build a complete automated maintenance
    pipeline that runs weekly, generates a report, rotates logs
    and alerts if any check fails.
    Task: Create a systemd timer unit to replace a cron job
    and implement a complete maintenance workflow.
    Technical Requirements:
    - Create the maintenance script /usr/local/bin/lab-weekly.sh:
        #!/bin/bash
        set -euo pipefail
        LOG=/var/log/lab_weekly.log
        echo "=== Weekly maintenance $(date) ===" >> $LOG
        # Task 1: disk check
        df -h | awk 'NR>1{gsub(/%/,"",$5); if($5+0>80)
          print "ALERT: "$6" at "$5"%"}' >> $LOG
        # Task 2: rotate lab logs
        logrotate -f /etc/logrotate.d/lab >> $LOG 2>&1 || true
        # Task 3: failed services
        systemctl --failed --no-legend >> $LOG 2>&1 || true
        echo "=== Done ===" >> $LOG
    - Create the service unit /etc/systemd/system/lab-weekly.service:
        [Unit]
        Description=Lab Weekly Maintenance
        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/lab-weekly.sh
        StandardOutput=journal
        StandardError=journal
    - Create the timer unit /etc/systemd/system/lab-weekly.timer:
        [Unit]
        Description=Lab Weekly Maintenance Timer
        [Timer]
        OnCalendar=weekly
        Persistent=true
        [Install]
        WantedBy=timers.target
    - Enable the timer (not the service directly):
        systemctl daemon-reload
        systemctl enable --now lab-weekly.timer
    - Verify timer is active and see next trigger time:
        systemctl list-timers | grep lab-weekly
        systemctl status lab-weekly.timer
    - Trigger the service manually to test it:
        systemctl start lab-weekly.service
        journalctl -u lab-weekly.service -n 30
        cat /var/log/lab_weekly.log
    - Clean up:
        systemctl disable --now lab-weekly.timer
        rm /etc/systemd/system/lab-weekly.{service,timer}
        rm /usr/local/bin/lab-weekly.sh
        systemctl daemon-reload

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Avanzado"
  orden: 9
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: After a kernel panic or unexpected reboot you need
    to analyze what happened using only the journal and system
    logs from before the crash.
    Task: Analyze a previous boot's logs to identify the
    cause of a simulated system problem using journalctl
    and the lab log files.
    Technical Requirements:
    - List all recorded boots in the journal:
        journalctl --list-boots
      Note the boot IDs and their timestamps.
    - If there is more than one boot recorded, compare logs
      between boots:
        journalctl -b -1 -p err 2>/dev/null \
            || echo "Only one boot recorded – using current"
    - Analyze the simulated problem log:
        cat /opt/labs/bloque10/troubleshooting/log_analysis/sistema_problemas.log
    - For each problem found in sistema_problemas.log,
      identify and document:
        a) ATA disk errors → kernel messages, likely disk failure.
           Command to check: dmesg | grep -i "ata\|error\|fail"
        b) NTP sync failure → chrony cannot reach servers.
           Command to check: journalctl -u chronyd -b
        c) SSH brute force → multiple failed password attempts.
           Command to check: journalctl -u sshd | grep "Failed password"
           Count attempts from same IP:
             grep "Failed password" /var/log/secure | \
             awk '{print $11}' | sort | uniq -c | sort -rn
        d) OOM killer → out of memory, process killed.
           Command to check: dmesg | grep -i "oom\|killed process"
        e) Service failure → lab-broken-service failed.
           Command to check: journalctl -u lab-broken-service -b
    - Write a structured incident report in /tmp/incident_report.txt
      with: problem, evidence, likely cause, recommended fix.

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Avanzado"
  orden: 10
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: This is the final advanced challenge. A system has
    multiple simultaneous problems affecting boot, logging,
    scheduling and performance. You must fix them all.
    Task: Fix 5 independent problems on the system, each in
    its own area covered by this block.
    Technical Requirements:
    - PROBLEM 1 – Boot performance:
        lab-broken-service.service is enabled but fails,
        slowing down the boot sequence.
        Fix: disable it and verify boot time improves:
          systemctl disable lab-broken-service.service
          systemd-analyze blame | grep -v lab-broken
    - PROBLEM 2 – Journal not persistent:
        Verify /var/log/journal exists and Storage=persistent
        is set. If not, fix /etc/systemd/journald.conf.d/lab-persist.conf
        and restart journald:
          journalctl --disk-usage
          ls /var/log/journal/
    - PROBLEM 3 – Cron job missing:
        The disk check cron job is not installed for root.
        Install it correctly in /etc/cron.d/lab-final:
          */10 * * * * root \
            /opt/labs/bloque10/tareas/cron_scripts/check_disk.sh \
            >> /var/log/lab_disk_check.log 2>&1
        Verify: ls /etc/cron.d/lab-final
    - PROBLEM 4 – Wrong tuned profile:
        The active tuned profile is not optimized for a VM.
        Fix: apply virtual-guest profile:
          tuned-adm profile virtual-guest
          tuned-adm active | grep virtual-guest && echo "OK"
    - PROBLEM 5 – Time not synchronized:
        chronyd is stopped. Start it and verify synchronization:
          systemctl enable --now chronyd
          chronyc tracking | grep "Stratum"
          timedatectl status | grep "NTP service"
    - Final verification – all 5 fixes must pass:
        systemctl is-enabled lab-broken-service | grep disabled
        ls /var/log/journal/
        ls /etc/cron.d/lab-final
        tuned-adm active | grep virtual-guest
        systemctl is-active chronyd
      Print PASS or FAIL for each check.


# ======================================================================
