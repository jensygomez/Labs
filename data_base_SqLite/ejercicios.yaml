# ─── BLOQUE 10: BOOT, RECOVERY Y MANTENIMIENTO - INTERMEDIO ───

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Intermedio"
  orden: 1
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: A system is booting but one service is consistently
    slowing down the startup. You need to identify it and
    understand why it delays the boot sequence.
    Task: Perform a full boot performance analysis and identify
    the top bottlenecks using systemd-analyze tools.
    Technical Requirements:
    - Measure total boot time and save output:
        systemd-analyze > /tmp/boot_analysis.txt
        systemd-analyze blame >> /tmp/boot_analysis.txt
    - Identify units taking more than 1 second:
        systemd-analyze blame | awk '$1 ~ /s$/ {gsub(/s/,"",$1); if($1+0 > 1) print}'
    - Inspect the critical chain in detail:
        systemd-analyze critical-chain --no-pager >> /tmp/boot_analysis.txt
    - Check if lab-boot-monitor.service is in the chain:
        systemd-analyze critical-chain lab-boot-monitor.service
    - Enable lab-broken-service and measure its impact:
        systemctl enable lab-broken-service.service
        systemd-analyze blame | grep lab-broken
        systemctl disable lab-broken-service.service
    - Plot the critical path units and their start/finish times:
        systemd-analyze dot --no-pager 2>/dev/null | head -20
    - Final report: save all findings to /tmp/boot_analysis.txt
      and print the 3 slowest units with their times.

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Intermedio"
  orden: 2
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: You need to add a custom kernel parameter permanently
    to enable verbose boot logging for debugging purposes.
    Task: Add the parameter 'systemd.log_level=debug' to GRUB2
    on a test basis, verify it, then remove it cleanly.
    Technical Requirements:
    - Backup /etc/default/grub before any change:
        cp /etc/default/grub /etc/default/grub.bak_$(date +%Y%m%d)
    - Add the parameter to GRUB_CMDLINE_LINUX using sed:
        sed -i 's/\(GRUB_CMDLINE_LINUX=".*\)"/\1 systemd.log_level=debug"/' \
            /etc/default/grub
    - Verify the parameter was added correctly:
        grep GRUB_CMDLINE_LINUX /etc/default/grub
    - Regenerate grub.cfg and verify the parameter appears:
        grub2-mkconfig -o /boot/grub2/grub.cfg
        grep "systemd.log_level" /boot/grub2/grub.cfg
    - Remove the parameter (restore from backup):
        cp /etc/default/grub.bak_$(date +%Y%m%d) /etc/default/grub
        grub2-mkconfig -o /boot/grub2/grub.cfg
    - Verify the parameter is no longer present:
        grep "systemd.log_level" /boot/grub2/grub.cfg \
            && echo "ERROR: param still present" \
            || echo "OK: param removed"
    - Note: A reboot is required for the parameter to take effect,
      but for this exercise verification of grub.cfg is sufficient.

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Intermedio"
  orden: 3
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: The initramfs image is a critical component of the
    boot process. You need to know how to inspect and rebuild it.
    Task: Inspect the current initramfs image and rebuild it
    for the running kernel.
    Technical Requirements:
    - List all initramfs images on the system:
        ls -lh /boot/initramfs-*.img
    - Inspect the contents of the current initramfs
      without extracting it:
        lsinitrd /boot/initramfs-$(uname -r).img | head -40
    - Check which modules are included:
        lsinitrd /boot/initramfs-$(uname -r).img | grep "\.ko"
    - Rebuild the initramfs for the running kernel:
        dracut -f /boot/initramfs-$(uname -r).img $(uname -r)
      This is required after: kernel updates, driver changes,
      adding modules to /etc/dracut.conf.d/.
    - Verify the new image was created (check timestamp):
        ls -lh /boot/initramfs-$(uname -r).img
    - Check the image is valid:
        lsinitrd /boot/initramfs-$(uname -r).img > /dev/null \
            && echo "initramfs OK" || echo "initramfs CORRUPT"

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Intermedio"
  orden: 4
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: You need to configure rsyslog to separate logs by
    severity and send specific logs to a dedicated file.
    Task: Create a custom rsyslog rule that routes all
    authentication messages to a dedicated file and all
    critical messages to another.
    Technical Requirements:
    - Create /etc/rsyslog.d/30-lab-custom.conf with these rules:
        # Auth messages to dedicated file
        auth,authpriv.*    /var/log/lab_auth.log
        & stop
        # Critical and above to critical log
        *.crit             /var/log/lab_critical.log
        & stop
    - Restart rsyslog and verify no errors:
        systemctl restart rsyslog
        systemctl status rsyslog | grep -i "error\|fail"
    - Generate an auth log entry to test:
        logger -p auth.info -t LAB_AUTH "test auth message from lab"
        logger -p auth.warning -t LAB_AUTH "test auth warning from lab"
    - Verify messages arrived at /var/log/lab_auth.log:
        tail -5 /var/log/lab_auth.log
    - Generate a critical message:
        logger -p user.crit -t LAB_CRIT "critical test message"
    - Verify it arrived at /var/log/lab_critical.log:
        tail -5 /var/log/lab_critical.log
    - Clean up: remove /etc/rsyslog.d/30-lab-custom.conf
      and restart rsyslog.

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Intermedio"
  orden: 5
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: Journal logs must be persistent across reboots and
    their size must be controlled to prevent disk exhaustion.
    Task: Configure journald for persistent storage with size
    limits and verify the configuration is applied.
    Technical Requirements:
    - Verify current journal persistence configuration:
        cat /etc/systemd/journald.conf.d/lab-persist.conf
        journalctl --disk-usage
    - Modify the lab configuration to set stricter limits:
        Edit /etc/systemd/journald.conf.d/lab-persist.conf
        Set: SystemMaxUse=100M
             SystemMaxFileSize=10M
             MaxRetentionSec=1week
             Compress=yes
    - Restart journald and verify the configuration took effect:
        systemctl restart systemd-journald
        journalctl --disk-usage
    - Verify journal is stored on disk (persistent):
        ls -lh /var/log/journal/
    - Check how many boots are recorded in the journal:
        journalctl --list-boots
    - Vacuum the journal to enforce the size limit now:
        journalctl --vacuum-size=50M
        journalctl --disk-usage
    - Restore original lab configuration:
        Set SystemMaxUse back to 200M

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Intermedio"
  orden: 6
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: Scheduled tasks must be managed reliably. You need
    to implement a complete task scheduling setup for a
    production-like scenario.
    Task: Create a full scheduling setup using cron and at
    for automated system maintenance.
    Technical Requirements:
    - Create a system cron job in /etc/cron.d/lab-maintenance:
        # Run disk check every 15 minutes, log output
        */15 * * * * root \
          /opt/labs/bloque10/tareas/cron_scripts/check_disk.sh \
          >> /var/log/lab_disk_check.log 2>&1
        # Run cleanup every Sunday at 03:00
        0 3 * * 0 root \
          /opt/labs/bloque10/tareas/cron_scripts/cleanup_tmp.sh \
          >> /var/log/lab_cron.log 2>&1
    - Verify syntax is correct (crond reads /etc/cron.d/ files):
        crontab -l  (this shows user crontab, not /etc/cron.d)
        ls -la /etc/cron.d/lab-maintenance
    - Schedule a one-time task with 'at' to run in 2 minutes:
        echo "/opt/labs/bloque10/tareas/cron_scripts/report_gen.sh" \
          | at now + 2 minutes
    - Verify the at job is queued:
        atq
        at -l
    - Wait 2 minutes then verify execution:
        ls -lh /var/log/lab_daily_report_$(date +%Y%m%d).txt
    - List and remove the cron.d file:
        rm /etc/cron.d/lab-maintenance

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Intermedio"
  orden: 7
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: tuned profiles optimize system performance for
    specific workloads. This is tested in both LFCS and RHCSA.
    Task: Inspect available tuned profiles, apply the lab
    profile, verify its effects and switch to a standard profile.
    Technical Requirements:
    - Check the current active profile:
        tuned-adm active
    - List all available profiles with descriptions:
        tuned-adm list
    - Get a recommendation for this system:
        tuned-adm recommend
    - Inspect the lab custom profile:
        cat /etc/tuned/lab-perfil/tuned.conf
    - Apply the lab profile:
        tuned-adm profile lab-perfil
        tuned-adm active
    - Verify the cpu governor changed (if supported by VM):
        cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor \
            2>/dev/null || echo "CPU freq scaling not available in VM"
    - Check transparent hugepages setting:
        cat /sys/kernel/mm/transparent_hugepage/enabled
    - Switch to the recommended production profile:
        tuned-adm profile virtual-guest
        tuned-adm active
    - Verify the profile switch:
        tuned-adm active | grep virtual-guest \
            && echo "OK" || echo "FAIL"

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Intermedio"
  orden: 8
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: Process priority management is essential when a
    system is under heavy load. You need to adjust priorities
    of running and new processes.
    Task: Use nice and renice to manage process priorities
    while the system is under load.
    Technical Requirements:
    - Generate background CPU load for the exercise:
        bash /opt/labs/bloque10/performance/benchmarks/generar_carga.sh cpu 120 &
        LOAD_PID=$!
    - Observe the process priority with ps:
        ps -p $LOAD_PID -o pid,ni,pri,%cpu,cmd
    - Renice the process to priority +15 (low priority):
        renice -n 15 -p $LOAD_PID
        ps -p $LOAD_PID -o pid,ni,pri,%cpu,cmd
    - Launch a new process with high priority (nice -10):
        nice -n -10 bash -c 'sleep 30' &
        NICE_PID=$!
        ps -p $NICE_PID -o pid,ni,pri,%cpu,cmd
    - View all processes sorted by nice value:
        ps -eo pid,user,ni,pri,%cpu,cmd --sort=ni | head -20
    - Renice all processes of labtasks user to +10:
        renice -n 10 -u labtasks
    - Stop the load generator:
        kill $LOAD_PID 2>/dev/null
        kill $NICE_PID 2>/dev/null
    - Verify: only root can set negative nice values.
      Try as labtasks and observe the error:
        su - labtasks -c "nice -n -5 sleep 10"

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Intermedio"
  orden: 9
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: sar and iostat are the standard tools to analyze
    historical and real-time system performance. Mastering them
    is required for the LFCS exam.
    Task: Use sysstat tools to analyze system performance
    using both real-time and historical data.
    Technical Requirements:
    - Generate load to have data to analyze:
        bash /opt/labs/bloque10/performance/benchmarks/generar_carga.sh all 60 &
    - Capture real-time CPU metrics every 2 seconds, 5 samples:
        sar -u 2 5 | tee /tmp/sar_cpu.txt
      Identify: %user, %system, %iowait, %idle
    - Capture memory metrics:
        sar -r 2 5 | tee /tmp/sar_mem.txt
      Identify: kbmemfree, kbmemused, %memused
    - Capture disk activity:
        iostat -x 2 5 | tee /tmp/iostat.txt
      Identify: %util, await, r/s, w/s for each device
    - Capture load average over time:
        sar -q 2 5 | tee /tmp/sar_load.txt
      Identify: runq-sz (run queue), ldavg-1, ldavg-5
    - Read the sample files generated at setup time:
        cat /opt/labs/bloque10/performance/sar_data/sar_cpu_sample.txt
    - Compare: which metric shows the most pressure?
      Document findings in /tmp/performance_report.txt

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Intermedio"
  orden: 10
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: On the RHCSA exam you may be asked to create a
    custom systemd service that starts automatically at boot
    and integrates with the existing target structure.
    Task: Create a custom systemd service unit from scratch
    that runs a maintenance script at boot time.
    Technical Requirements:
    - Create the script the service will run:
        cat > /usr/local/bin/lab-startup.sh << 'EOF'
        #!/bin/bash
        echo "$(date) lab-startup ejecutado" >> /var/log/lab_startup.log
        df -h >> /var/log/lab_startup.log
        echo "---" >> /var/log/lab_startup.log
        EOF
        chmod +x /usr/local/bin/lab-startup.sh
    - Create the unit file /etc/systemd/system/lab-startup.service:
        [Unit]
        Description=Lab Startup Maintenance Script
        After=network.target
        Wants=network.target
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/usr/local/bin/lab-startup.sh
        StandardOutput=journal
        StandardError=journal
        [Install]
        WantedBy=multi-user.target
    - Reload systemd and enable the service:
        systemctl daemon-reload
        systemctl enable lab-startup.service
        systemctl start lab-startup.service
    - Verify the service ran correctly:
        systemctl status lab-startup.service
        journalctl -u lab-startup.service -n 20
        cat /var/log/lab_startup.log
    - Clean up:
        systemctl disable --now lab-startup.service
        rm /etc/systemd/system/lab-startup.service
        rm /usr/local/bin/lab-startup.sh
        systemctl daemon-reload



