# ─── BLOQUE 10: BOOT, RECOVERY Y MANTENIMIENTO - BÁSICO ───

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Basico"
  orden: 1
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You need to understand the boot sequence of a Linux
    system to be able to diagnose startup problems.
    Task: Analyze the boot process of the system and identify
    its key stages and timing.
    Technical Requirements:
    - Display the total boot time broken down by stages:
        systemd-analyze
      Note the time for: firmware, loader, kernel, userspace.
    - Display the top 10 slowest units at boot:
        systemd-analyze blame | head -10
    - Generate the boot chain dependency graph in text form:
        systemd-analyze critical-chain
    - Verify that lab-boot-monitor.service ran at last boot:
        journalctl -u lab-boot-monitor.service -b
    - Check the kernel version and boot parameters used:
        uname -r
        cat /proc/cmdline

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Basico"
  orden: 2
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You need to inspect and understand the GRUB2
    configuration before modifying it in a later task.
    Task: Inspect the current GRUB2 configuration without
    making any changes.
    Technical Requirements:
    - View the GRUB2 default settings file:
        cat /etc/default/grub
      Identify: GRUB_TIMEOUT, GRUB_CMDLINE_LINUX,
      GRUB_DEFAULT, GRUB_DISABLE_RECOVERY.
    - View the generated GRUB configuration:
        cat /boot/grub2/grub.cfg | grep -A5 "menuentry"
    - List all available kernel entries in GRUB:
        grub2-editenv list
        grep "^menuentry\|^submenu" /boot/grub2/grub.cfg
    - Compare the backup taken by the lab script with current:
        diff /opt/labs/bloque10/boot/grub_backup/grub.default.original \
             /etc/default/grub
      Output should be empty (no changes made yet).
    - Note the location of grub.cfg for BIOS vs UEFI systems:
        ls /boot/grub2/grub.cfg 2>/dev/null && echo "BIOS"
        ls /boot/efi/EFI/rocky/grub.cfg 2>/dev/null && echo "UEFI"

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Basico"
  orden: 3
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: A junior sysadmin needs to know how to safely
    modify GRUB2 timeout without breaking the system.
    Task: Change the GRUB2 boot timeout from its current
    value to 10 seconds and apply the change.
    Technical Requirements:
    - Edit /etc/default/grub and change GRUB_TIMEOUT to 10:
        sed -i 's/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=10/' /etc/default/grub
    - Verify the change before applying:
        grep GRUB_TIMEOUT /etc/default/grub
    - Regenerate grub.cfg (detect BIOS vs UEFI automatically):
        if [ -f /boot/grub2/grub.cfg ]; then
            grub2-mkconfig -o /boot/grub2/grub.cfg
        elif [ -f /boot/efi/EFI/rocky/grub.cfg ]; then
            grub2-mkconfig -o /boot/efi/EFI/rocky/grub.cfg
        fi
    - Verify the change was applied to grub.cfg:
        grep "set timeout" /boot/grub2/grub.cfg
    - Restore original value (5 seconds) after verification:
        sed -i 's/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=5/' /etc/default/grub
        grub2-mkconfig -o /boot/grub2/grub.cfg

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Basico"
  orden: 4
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You need to understand systemd targets to manage
    the system state and prepare for recovery scenarios.
    Task: Inspect and work with systemd targets on the running
    system without rebooting.
    Technical Requirements:
    - Display the current default target:
        systemctl get-default
    - List all available targets:
        systemctl list-units --type=target --all
    - Show the dependencies of multi-user.target:
        systemctl list-dependencies multi-user.target
    - Show which target is currently active:
        systemctl list-units --type=target --state=active
    - Compare multi-user.target and graphical.target:
        diff <(systemctl list-dependencies multi-user.target) \
             <(systemctl list-dependencies graphical.target)
    - Verify that lab-maintenance.target exists:
        systemctl status lab-maintenance.target
        systemctl cat lab-maintenance.target

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Basico"
  orden: 5
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: On the RHCSA exam you will be asked to change the
    default boot target permanently.
    Task: Change the default boot target to multi-user.target,
    verify it, then restore it to its original value.
    Technical Requirements:
    - Record the current default target:
        systemctl get-default
    - Change default to multi-user.target:
        systemctl set-default multi-user.target
    - Verify the symlink was updated:
        ls -la /etc/systemd/system/default.target
    - Verify with systemctl:
        systemctl get-default
    - Switch to multi-user target on the running system
      without rebooting:
        systemctl isolate multi-user.target
      Note: if you are in a GUI session it will be lost.
    - Return to the original default target:
        systemctl set-default graphical.target
        (or whatever the original was)
        systemctl isolate graphical.target

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Basico"
  orden: 6
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: journald is the primary log system on systemd-based
    distributions. You need to master its query syntax.
    Task: Use journalctl to query the system journal in multiple
    ways using the lab logs already generated.
    Technical Requirements:
    - Show all logs from the current boot:
        journalctl -b
    - Show only error and critical messages from this boot:
        journalctl -b -p err
    - Show logs from the last 30 minutes:
        journalctl --since "30 minutes ago"
    - Show logs for a specific unit:
        journalctl -u lab-boot-monitor.service
        journalctl -u sshd --since today
    - Show logs with custom tag generated by the lab:
        journalctl -t LAB_APP
        (if empty, generate first: bash /opt/labs/bloque10/logs/generar_logs_lab.sh)
    - Show disk usage of the journal:
        journalctl --disk-usage
    - Follow logs in real time (Ctrl+C to stop):
        journalctl -f

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Basico"
  orden: 7
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: rsyslog manages traditional log files. You need to
    understand its configuration and verify the lab rule is working.
    Task: Inspect the rsyslog configuration and verify that
    the lab logging rule routes messages correctly.
    Technical Requirements:
    - View the main rsyslog configuration:
        cat /etc/rsyslog.conf | grep -v "^#" | grep -v "^$"
    - View the lab rule created by the setup script:
        cat /etc/rsyslog.d/10-lab.conf
    - Generate 10 test log entries using the lab script:
        bash /opt/labs/bloque10/logs/generar_logs_lab.sh 10
    - Verify messages arrived at /var/log/lab.log:
        tail -20 /var/log/lab.log
    - Verify the same messages appear in the journal:
        journalctl -t LAB_APP --since "2 minutes ago"
    - Verify rsyslog service is active and has no errors:
        systemctl status rsyslog
        journalctl -u rsyslog -b -p err

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Basico"
  orden: 8
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: Log rotation prevents log files from filling the disk.
    You need to understand and verify logrotate configuration.
    Task: Inspect logrotate configuration and manually trigger
    rotation for the lab log file.
    Technical Requirements:
    - View the main logrotate configuration:
        cat /etc/logrotate.conf
    - View the lab-specific logrotate rule:
        cat /etc/logrotate.d/lab
    - List all logrotate configurations:
        ls /etc/logrotate.d/
    - Test the lab logrotate rule without applying it:
        logrotate -d /etc/logrotate.d/lab
      Read the output and verify it would rotate correctly.
    - Force rotation manually:
        logrotate -f /etc/logrotate.d/lab
    - Verify rotation happened:
        ls -lh /var/log/lab.log*
      You should see lab.log and lab.log.1.gz

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Basico"
  orden: 9
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: Time synchronization is critical for logs, TLS
    certificates and Kerberos authentication.
    Task: Verify and manage time synchronization using chrony
    and timedatectl.
    Technical Requirements:
    - Check overall time and NTP status:
        timedatectl status
      Note: NTP service active, synchronized, timezone, RTC time.
    - Check chrony synchronization details:
        chronyc tracking
      Identify: Reference ID, System time offset, Stratum.
    - List NTP sources and their quality:
        chronyc sources -v
      Identify the source marked with '*' (currently selected).
    - View chrony configuration:
        cat /etc/chrony.conf
    - Set the timezone to Europe/Madrid:
        timedatectl set-timezone Europe/Madrid
    - Verify the change:
        timedatectl status | grep "Time zone"
        date
    - List available timezones for Spain:
        timedatectl list-timezones | grep Europe/Madrid

- bloque: 10
  tema: "Boot, Recovery y Mantenimiento"
  nivel: "Basico"
  orden: 10
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: Scheduled tasks with cron are fundamental for
    automating sysadmin work. This is always present in LFCS.
    Task: Schedule two cron jobs using the lab scripts and
    verify they execute correctly.
    Technical Requirements:
    - View the existing system crontab files:
        ls /etc/cron.d/
        cat /etc/crontab
    - Schedule check_disk.sh to run every 5 minutes
      as root in the root crontab:
        crontab -e
        Add: */5 * * * * /opt/labs/bloque10/tareas/cron_scripts/check_disk.sh
    - Schedule cleanup_tmp.sh to run daily at 02:00:
        Add: 0 2 * * * /opt/labs/bloque10/tareas/cron_scripts/cleanup_tmp.sh
    - Verify both entries are installed:
        crontab -l
    - As user labtasks, schedule report_gen.sh every Monday at 08:00:
        su - labtasks -c "crontab -e"
        Add: 0 8 * * 1 /opt/labs/bloque10/tareas/cron_scripts/report_gen.sh
        su - labtasks -c "crontab -l"
    - Wait up to 5 minutes and verify check_disk.sh ran:
        tail -f /var/log/lab_disk_check.log



