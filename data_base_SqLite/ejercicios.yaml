    Technical Requirements:
    - Identify the current 'CPUQuota' percentage.
    - Use 'systemctl set-property' to change the CPUQuota to 50% dynamically.
    - Verify the change is reflected in the service's control group properties.

- bloque: 4
  tema: "Systemd & Processes"
