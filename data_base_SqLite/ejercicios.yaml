    Task: Correct the service execution identity.
    Technical Requirements:
    - Edit the unit file to use the 'nobody' user and 'nobody' group instead of the fake one.
    - Restart the service and verify it stays 'active (running)'.

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Intermedio"
  orden: 4
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: You need to prioritize a process that is critical for the system.
    Task: Change the scheduling priority of the 'cpu-hog.sh' process.
    Technical Requirements:
    - Find the PID of 'cpu-hog.sh'.
    - Use 'renice' to set its niceness to -5 (requires root).
    - Verify the change using 'top' or 'ps -o ni'.

- bloque: 4
  tema: "Systemd & Processes"
