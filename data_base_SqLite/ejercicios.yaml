        Write analizar.sh that processes app.log and outputs
        a JSON summary to /tmp/resultado.json using only
        printf and echo (no jq, no python):
          {"errors": N, "warnings": N, "info": N,
           "avg_response_ms": N, "incident_detected": true|false}
        An incident = 3 or more ERROR lines within 10 minutes.
        avg_response_ms = average of the millisecond values in
        INFO lines: "Request processed: Xms"
    - PART 3 – Data stats (db/metricas.csv):
        Write estadisticas.sh that calculates per column:
        min, max, sum and average using only bash arithmetic.
        Output a formatted table with printf.
        No awk, no python, no bc – pure bash $(( )).
    - PART 4 – Pipeline (pipeline.sh):
        Run setup.sh, analizar.sh and estadisticas.sh in order.
        If any step fails, save state to pipeline.state and exit 1.
        Accept --resume to skip already-completed steps
        (check pipeline.state for completed step names).
        On full success: print "EXAMEN SUPERADO" and exit 0.
        On any failure: print "EXAMEN FALLIDO: <step>" and exit 1.





# ======================================================================
# BLOQUE 10 - BOOT, RECOVERY Y MANTENIMIENTO DEL SISTEMA
