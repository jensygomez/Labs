    Task: Modify the unit file to allow it to be enabled.
    Technical Requirements:
    - Edit the file and add a proper [Install] section.
    - Set 'WantedBy=multi-user.target'.
    - Enable the service and verify the symlink creation.

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Intermedio"
  orden: 3
  dificultad: 4
  enunciado: |
