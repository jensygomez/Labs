    Task: Fix the dependency chain.
    Technical Requirements:
    - Identify why B is not running (it might be disabled or stopped).
    - Start 'lab-depend-b.service'.
    - Start 'lab-depend-a.service' and verify both are active.

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Intermedio"
  orden: 6
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: The 'lab-backup.timer' is active, but you need it to run every minute instead of its current schedule.
    Task: Modify the timer frequency.
    Technical Requirements:
    - Edit /etc/systemd/system/lab-backup.timer.
    - Change 'OnCalendar' to run every minute ('*:*:00').
    - Reload systemd and verify the next execution time with 'list-timers'.

