  enunciado: |
    Exam Scenario:
    Context: You need to analyze logs from a previous boot to diagnose a crash.
    Task: Retrieve logs from the last session.
    Technical Requirements:
    - Ensure persistent logging is enabled in /etc/systemd/journald.conf (Storage=persistent).
    - Use 'journalctl -b -1' to see the logs from the previous boot.


# ─── BLOQUE 4: SYSTEMD Y PROCESOS - AVANZADO ───

