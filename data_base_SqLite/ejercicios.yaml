    Technical Requirements:
    - Verificar o ficheiro /etc/resolv.conf.
    - Identificar se faltam nameservers ou se o NetworkManager não os está a gerar.
    - Corrigir a configuração na ligação 'lab-static'.

- bloque: 5
  tema: "Networking"
  nivel: "Troubleshooting"
  orden: 6
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: Uma "Rich Rule" no Firewalld está a impedir que um administrador específico aceda ao servidor.
    Task: Localizar e remover regras restritivas.
    Technical Requirements:
    - Listar todas as rich rules da zona 'public'.
    - Encontrar a regra que faz 'reject' ao IP 192.168.100.50.
    - Remover a regra de forma permanente.

- bloque: 5
  tema: "Networking"
  nivel: "Troubleshooting"
  orden: 7
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: A interface 'lab-net1' não sobe automaticamente após o boot.
    Task: Corrigir a ativação automática da ligação.
    Technical Requirements:
    - Verificar o parâmetro 'connection.autoconnect' via nmcli.
    - Alterar para 'yes'.
    - Reiniciar o sistema (ou o serviço NM) para validar.

- bloque: 5
  tema: "Networking"
  nivel: "Troubleshooting"
  orden: 8
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: O serviço web (porta 80) está ativo no servidor, mas o cliente recebe "Connection Refused".
    Task: Diagnosticar o bloqueio entre o serviço e a rede.
    Technical Requirements:
    - Verificar se o serviço está em 'listening' com 'ss -tunlp'.
    - Verificar se o Firewall tem a porta aberta.
    - Confirmar se o serviço está a ouvir em 0.0.0.0 ou apenas em 127.0.0.1.

- bloque: 5
  tema: "Networking"
  nivel: "Troubleshooting"
  orden: 9
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: O ficheiro /etc/hosts foi "sabotado" e o nome 'localhost' aponta para um IP errado.
    Task: Restaurar a resolução local básica.
    Technical Requirements:
    - Editar /etc/hosts.
    - Corrigir a entrada de loopback (127.0.0.1 localhost).
    - Validar com 'ping -c 1 localhost'.

- bloque: 5
  tema: "Networking"
  nivel: "Troubleshooting"
  orden: 10
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: O tráfego de saída do servidor está extremamente lento ou os pacotes são descartados intermitentemente.
    Task: Analisar a MTU da interface.
    Technical Requirements:
    - Verificar a MTU das interfaces com 'ip link show'.
    - Identificar se existe uma discrepância (ex: MTU 576 em vez de 1500).
    - Ajustar para o valor padrão e testar a performance.


# ======================================================================
# BLOQUE 6 SERVICIOS DE RED
# ======================================================================

# ─── BLOQUE 6: SERVICIOS DE RED - BÁSICO ───

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Basico"
  orden: 1
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You need to verify which network services were installed by the setup script.
    Task: Check the status of Apache, NFS, and Samba.
    Technical Requirements:
    - Use 'systemctl is-active' for httpd, nfs-server, and smb.
    - Confirm they are all in 'active' state.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Basico"
  orden: 2
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: You need to verify if the web server is delivering content locally.
    Task: Use a command-line tool to fetch the main page.
    Technical Requirements:
    - Use 'curl' or 'wget' against http://localhost.
    - Confirm you see the "Bienvenido al Lab" message.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Basico"
  orden: 3
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: You need to check the availability of NFS shares on the local server.
    Task: List the exported directories.
    Technical Requirements:
    - Use the 'showmount' command with the '-e' flag.
    - Identify the path being exported (e.g., /mnt/nfs_share).

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Basico"
  orden: 4
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: You need to verify the Samba shares without mounting them.
    Task: List shares available on the local machine.
    Technical Requirements:
    - Use 'smbclient -L localhost -N' (the -N flag is for no password).
    - Identify the share named 'publico'.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Basico"
  orden: 5
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You need to ensure the DNS server (BIND) is responding to queries.
    Task: Query the local DNS server for a common domain.
    Technical Requirements:
    - Use 'dig' or 'host' specifying @localhost.
    - Query for 'google.com' and check if you get an ANSWER section.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Basico"
  orden: 6
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: Time synchronization is critical for logs and security.
    Task: Check the status of the NTP (Chrony) synchronization.
    Technical Requirements:
    - Use 'chronyc sources -v'.
    - Identify if any server has a '*' next to it (indicating active sync).
    - Note the IP 1.2.3.4 (it should show an error or no sync).

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Basico"
  orden: 7
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You need to verify if the FTP server allows anonymous access.
    Task: Connect to the FTP server as an anonymous user.
    Technical Requirements:
    - Use 'ftp localhost' or 'lftp localhost'.
    - Log in with username 'anonymous' and any password.
    - Run 'ls' and then 'quit'.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Basico"
  orden: 8
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: You need to find where the services store their logs for future troubleshooting.
    Task: Identify the log files for Apache and Samba.
    Technical Requirements:
    - Locate the directory /var/log/httpd/ and /var/log/samba/.
    - List the files in those directories.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Basico"
  orden: 9
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: You need to confirm which ports are occupied by the newly started services.
    Task: Map services to their ports.
    Technical Requirements:
    - Use 'ss -tunlp'.
    - Match port 80 to httpd, port 53 to named, and ports 139/445 to smbd.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Basico"
  orden: 10
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: You need to check if the firewall is already prepared for these services.
    Task: List the currently allowed services in the default zone.
    Technical Requirements:
    - Use 'firewall-cmd --list-services'.
    - Identify which of the services (http, nfs, samba, dns, ftp) are NOT yet allowed.


# ─── BLOQUE 6: SERVICIOS DE RED - INTERMEDIO ───

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Intermedio"
  orden: 1
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: The containers lab-client1 and lab-client2 need to mount
    the NFS share, but the server only allows 127.0.0.1.
    Task: Fix the NFS export so the lab network can mount it.
    Technical Requirements:
    - Edit /etc/exports to allow 172.20.0.0/24 instead of 127.0.0.1.
    - Use 'exportfs -ra' to reload without restarting the service.
    - From lab-client1, mount /mnt/nfs_share on /mnt/lab_nfs.
    - Verify the file test.txt is visible inside the container.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Intermedio"
  orden: 2
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: The NFS mount disappears after every reboot of the container.
    Task: Make the NFS mount persistent inside lab-client1.
    Technical Requirements:
    - Add the mount entry to /etc/fstab inside lab-client1.
    - Use 'mount -a' to verify the fstab entry works.
    - Entry format: lab-server:/mnt/nfs_share /mnt/lab_nfs nfs defaults 0 0

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Intermedio"
  orden: 3
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: A developer needs to write files to the Samba share from lab-client2.
    Task: Connect and write to the Samba share from lab-client2.
    Technical Requirements:
    - From lab-client2, use 'smbclient //lab-server/publico -N'.
    - Upload a file using the 'put' command inside smbclient.
    - Verify the file exists on the host at /srv/samba/public/.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Intermedio"
  orden: 4
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: The team wants to mount the Samba share permanently.
    Task: Mount the Samba share via CIFS inside lab-client1.
    Technical Requirements:
    - Create mount point /mnt/lab_smb inside lab-client1.
    - Mount //lab-server/publico using 'mount -t cifs' with guest option.
    - Verify read/write access by creating a test file.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Intermedio"
  orden: 5
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: The BIND DNS server must respond to queries from the lab network,
    not just from localhost.
    Task: Configure BIND to accept queries from 172.20.0.0/24.
    Technical Requirements:
    - Edit /etc/named.conf on the host.
    - Change 'listen-on' to include 172.20.0.1.
    - Change 'allow-query' to include 172.20.0.0/24.
    - Restart named and verify with 'dig @172.20.0.1 google.com' from lab-client1.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Intermedio"
  orden: 6
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: You need to serve a custom internal domain for the lab environment.
    Task: Create a forward DNS zone for 'lab.local'.
    Technical Requirements:
    - Add a zone block for 'lab.local' in /etc/named.conf.
    - Create the zone file at /var/named/lab.local.zone.
    - Add an A record: server.lab.local → 172.20.0.1.
    - Verify with 'dig @172.20.0.1 server.lab.local' from lab-client1.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Intermedio"
  orden: 7
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: Apache must serve a second virtual host for an internal project.
    Task: Create a Virtual Host for 'proyecto.lab.local'.
    Technical Requirements:
    - Create /var/www/proyecto/ with an index.html saying "Proyecto Lab".
    - Add a VirtualHost block in /etc/httpd/conf.d/proyecto.conf.
    - Add 'proyecto.lab.local' to /etc/hosts pointing to 127.0.0.1.
    - Test with 'curl -H "Host: proyecto.lab.local" http://localhost'.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Intermedio"
  orden: 8
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: Security policy requires that Apache serves only HTTPS.
    Task: Enable SSL/TLS on Apache using a self-signed certificate.
    Technical Requirements:
    - Install 'mod_ssl'.
    - Generate a self-signed certificate with 'openssl req'.
    - Configure /etc/httpd/conf.d/ssl.conf to use your certificate.
    - Verify with 'curl -k https://localhost'.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Intermedio"
  orden: 9
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: Chrony is configured with a fake NTP server and time is drifting.
    Task: Fix the NTP configuration and force a time sync.
    Technical Requirements:
    - Remove the fake server '1.2.3.4' from /etc/chrony.conf.
    - Add 'pool pool.ntp.org iburst' as the NTP source.
    - Restart chronyd and verify sync with 'chronyc tracking'.
    - Confirm a source with '*' appears in 'chronyc sources'.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Intermedio"
  orden: 10
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: All the services configured so far need to be accessible
    from the lab network through the firewall.
    Task: Open all required service ports in firewalld.
    Technical Requirements:
    - Add services: http, https, nfs, samba, dns, ftp to the public zone.
    - Make all rules permanent.
    - Reload the firewall.
    - From lab-client1, verify HTTP access with curl http://lab-server.


# ─── BLOQUE 6: SERVICIOS DE RED - TROUBLESHOOTING ───

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Troubleshooting"
  orden: 1
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: A developer reports that curl http://localhost returns
    "Connection refused" even though httpd is installed.
    Task: Diagnose and fix Apache so it serves content locally.
    Setup (inject bug):
      systemctl stop httpd
      systemctl disable httpd
    Technical Requirements:
    - Confirm httpd is not running with 'systemctl status httpd'.
    - Identify the cause: service stopped and disabled.
    - Enable and start the service.
    - Verify with 'curl http://localhost' returns "Bienvenido al Lab".
    - Check that the service survives with 'systemctl is-enabled httpd'.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Troubleshooting"
  orden: 2
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: 'showmount -e localhost' returns nothing. The NFS share
    is not visible to any client.
    Setup (inject bug):
      systemctl stop nfs-server
      echo "" > /etc/exports
    Technical Requirements:
    - Verify nfs-server is stopped.
    - Identify that /etc/exports is empty.
    - Restore the export: /mnt/nfs_share 172.20.0.0/24(rw,sync,no_root_squash)
    - Start nfs-server and run 'exportfs -ra'.
    - Confirm from lab-client1 with 'showmount -e lab-server'.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Troubleshooting"
  orden: 3
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: lab-client1 can mount the NFS share but all files
    appear owned by 'nobody' and writes fail with "Permission denied".
    Setup (inject bug):
      chmod 555 /mnt/nfs_share
      chown root:root /mnt/nfs_share
    Technical Requirements:
    - From lab-client1, attempt to create a file on the NFS mount.
    - On the host, inspect /mnt/nfs_share permissions.
    - Identify the dual problem: wrong owner AND wrong permissions.
    - Fix: chown nobody:nobody and chmod 755 /mnt/nfs_share.
    - Verify write works from lab-client1 after fix.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Troubleshooting"
  orden: 4
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: 'smbclient -L localhost -N' shows no shares. The [publico]
    share has disappeared from the Samba configuration.
    Setup (inject bug):
      sed -i '/\[publico\]/,/directory mask/d' /etc/samba/smb.conf
      systemctl restart smb
    Technical Requirements:
    - Confirm the share is missing with 'smbclient -L localhost -N'.
    - Inspect /etc/samba/smb.conf and identify the missing block.
    - Restore the [publico] share configuration.
    - Restart smb and verify the share reappears.
    - Validate config syntax with 'testparm' before restarting.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Troubleshooting"
  orden: 5
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: 'dig @localhost google.com' times out. BIND is running
    but not answering queries.
    Setup (inject bug):
      sed -i 's/recursion yes/recursion no/' /etc/named.conf
      systemctl restart named
    Technical Requirements:
    - Confirm named is active with 'systemctl is-active named'.
    - Run 'dig @localhost google.com' and observe the REFUSED status.
    - Inspect /etc/named.conf and locate 'recursion no'.
    - Change back to 'recursion yes'.
    - Restart named and verify dig returns an ANSWER section.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Troubleshooting"
  orden: 6
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: The web server returns HTTP 403 Forbidden on every request,
    including the main page. The index.html file exists.
    Setup (inject bug):
      chmod 700 /var/www/html
      chown root:root /var/www/html
    Technical Requirements:
    - Run 'curl -v http://localhost' and confirm 403 response.
    - Check permissions on /var/www/html with 'ls -ld'.
    - Identify that Apache cannot read the directory (700 = owner only).
    - Fix: chmod 755 /var/www/html.
    - Verify curl returns 200 and "Bienvenido al Lab".

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Troubleshooting"
  orden: 7
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: chronyd is running but 'chronyc tracking' shows
    "Cannot talk to daemon". The service is active but unresponsive.
    Setup (inject bug):
      sed -i 's/^bindcmdaddress.*/bindcmdaddress 1.2.3.4/' /etc/chrony.conf
      systemctl restart chronyd
    Technical Requirements:
    - Run 'systemctl status chronyd' — confirm it shows active.
    - Run 'chronyc tracking' and observe the connection error.
    - Inspect /etc/chrony.conf and locate the wrong 'bindcmdaddress'.
    - Fix: change back to 'bindcmdaddress 127.0.0.1' or remove the line.
    - Restart and verify 'chronyc tracking' responds normally.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Troubleshooting"
  orden: 8
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: FTP anonymous login fails with "530 Login incorrect"
    even though vsftpd is running.
    Setup (inject bug):
      sed -i 's/anonymous_enable=YES/anonymous_enable=NO/' /etc/vsftpd/vsftpd.conf
      systemctl restart vsftpd
    Technical Requirements:
    - Connect with 'ftp localhost' using anonymous login.
    - Observe "530 Login incorrect" error.
    - Inspect /etc/vsftpd/vsftpd.conf and find 'anonymous_enable=NO'.
    - Fix: change to 'anonymous_enable=YES'.
    - Restart vsftpd and confirm anonymous login succeeds.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Troubleshooting"
  orden: 9
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: lab-client1 cannot reach http://lab-server even though
    httpd is running and responding on localhost.
    Setup (inject bug):
      firewall-cmd --permanent --zone=public --remove-service=http
      firewall-cmd --reload
    Technical Requirements:
    - From the host, confirm 'curl http://localhost' works.
    - From lab-client1, confirm 'curl http://lab-server' fails.
    - On the host, check firewall with 'firewall-cmd --list-services'.
    - Identify that 'http' is missing from the public zone.
    - Add the service permanently and reload.
    - Verify from lab-client1 that the request now succeeds.

- bloque: 6
  tema: "Servicios de Red"
  nivel: "Troubleshooting"
  orden: 10
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: named starts but immediately crashes. journalctl shows
    a syntax error but the line number is not obvious.
    Setup (inject bug):
      sed -i '0,/};/s/};/}/' /etc/named.conf
      systemctl restart named
    Technical Requirements:
    - Run 'systemctl status named' and see it failed.
    - Use 'journalctl -u named -n 30' to find the error message.
    - Use 'named-checkconf /etc/named.conf' to pinpoint the syntax error.
    - Identify the missing closing brace '};'.
    - Fix the file manually and verify with 'named-checkconf' before restart.
    - Confirm named is active after the fix.


# ======================================================================
# BLOQUE 7 SEGURIDAD
# ======================================================================
- bloque: 7
  tema: "Seguridad"
  nivel: "Basico"
  orden: 1
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You need to understand the current SELinux enforcement
    state before making any security changes.
    Task: Check the current SELinux mode and policy.
    Technical Requirements:
    - Use 'getenforce' to see the current mode.
    - Use 'sestatus' to see the full status including policy type.
    - Identify if SELinux is Enforcing, Permissive, or Disabled.
    - Locate the configuration file that sets the mode persistently
      at /etc/selinux/config.

- bloque: 7
  tema: "Seguridad"
  nivel: "Basico"
  orden: 2
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: Apache is serving content from /srv/web_lab but the page
    returns an error. You suspect a SELinux context issue.
    Task: Inspect the SELinux context of /srv/web_lab/index.html
    and compare it with a known correct context.
    Technical Requirements:
    - Use 'ls -Z /srv/web_lab/index.html' to see the current context.
    - Use 'ls -Z /var/www/html/index.html' to compare with a correct context.
    - Identify that /srv/web_lab/index.html has 'default_t' instead
      of 'httpd_sys_content_t'.
    - Do NOT fix it yet, only document the difference.

- bloque: 7
  tema: "Seguridad"
  nivel: "Basico"
  orden: 3
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You need to audit which users have sudo privileges
    on the system before a security review.
    Task: List all sudo rules currently configured.
    Technical Requirements:
    - Inspect /etc/sudoers with 'visudo -l' or 'cat /etc/sudoers'.
    - List all files inside /etc/sudoers.d/ with 'ls -l /etc/sudoers.d/'.
    - Identify the rule that gives devuser unrestricted NOPASSWD access.
    - Identify that opsuser and auditor have no sudo rules anywhere.

- bloque: 7
  tema: "Seguridad"
  nivel: "Basico"
  orden: 4
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: A security audit flagged that the password policy
    is too weak. You need to review the current configuration.
    Task: Inspect the current password quality policy and document
    why it is insecure.
    Technical Requirements:
    - Read /etc/security/pwquality.conf and identify: minlen=4,
      minclass=0, maxrepeat=10.
    - Read /etc/login.defs and locate PASS_MAX_DAYS and PASS_MIN_LEN.
    - Document why each value is insecure:
        minlen=4 is too short (recommended minimum is 12).
        PASS_MAX_DAYS=999 means passwords almost never expire.
        minclass=0 means no character complexity is required.

- bloque: 7
  tema: "Seguridad"
  nivel: "Basico"
  orden: 5
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: Before hardening SSH you need to document exactly
    which insecure options are currently active.
    Task: Audit the current SSH server configuration and verify
    root login works from lab-attacker (172.20.0.99).
    Technical Requirements:
    - Read /etc/ssh/sshd_config.d/99-lab-insecure.conf.  # CAMBIADO de 98 a 99
    - Identify all insecure directives: PermitRootLogin yes,
      PermitEmptyPasswords yes, MaxAuthTries 10, LogLevel INFO.  # CAMBIADO de QUIET a INFO
    - From lab-attacker verify root login is accepted:
        podman exec -it lab-attacker bash
        ssh root@172.20.0.1  # CAMBIADO de lab-server a IP
    - Document the security risk of each insecure directive.

- bloque: 7
  tema: "Seguridad"
  nivel: "Basico"
  orden: 6
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You need to find all files with SUID or SGID bits set
    on the system as part of a security baseline audit.
    Task: Search the filesystem for SUID and SGID binaries and
    identify which ones are unexpected.
    Technical Requirements:
    - Use 'find / -perm /4000 -type f 2>/dev/null' for SUID files.
    - Use 'find / -perm /2000 -type f 2>/dev/null' for SGID files.
    - Locate /usr/local/bin/cat_lab in the SUID results.
    - Explain why an unnecessary SUID binary is a security risk
      compared to standard expected binaries like passwd or sudo.

- bloque: 7
  tema: "Seguridad"
  nivel: "Basico"
  orden: 7
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: You need to verify the audit subsystem is active
    and understand its current configuration before adding rules.
    Task: Check auditd status and review existing rules.
    Technical Requirements:
    - Use 'systemctl status auditd' to confirm it is active.
    - Use 'auditctl -l' to list currently loaded rules.
    - Read /etc/audit/rules.d/lab.rules and confirm it has
      only a comment line with no custom watch rules.
    - Locate the audit log file at /var/log/audit/audit.log.

- bloque: 7
  tema: "Seguridad"
  nivel: "Basico"
  orden: 8
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: fail2ban is installed but not protecting SSH.
    You need to understand the current state before fixing it.
    Task: Inspect the fail2ban configuration and verify that
    brute force attempts from lab-attacker are not being blocked.
    Technical Requirements:
    - Use 'systemctl status fail2ban' to confirm it is running.
    - Use 'fail2ban-client status' to list all jails.
    - Read /etc/fail2ban/jail.d/lab-sshd.conf and identify
      that the sshd jail has 'enabled = false'.
    - From lab-attacker simulate 5 failed SSH logins:
        podman exec -it lab-attacker bash
        for i in $(seq 1 5); do
          ssh wronguser@lab-server 2>/dev/null || true; done
    - Verify the IP is NOT banned because the jail is disabled:
        fail2ban-client status sshd

- bloque: 7
  tema: "Seguridad"
  nivel: "Basico"
  orden: 9
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You need to understand the full firewall layout
    including all zones and their current rules before making
    any security changes.
    Task: Perform a complete audit of the firewalld configuration.
    Technical Requirements:
    - Use 'firewall-cmd --get-zones' to list all zones.
    - Use 'firewall-cmd --list-all-zones' to see full details.
    - Identify the custom zone 'lab-dmz' and its target DROP.
    - Confirm that masquerade is disabled in the public zone
      with 'firewall-cmd --zone=public --query-masquerade'.
    - From lab-client1 verify port 8080 is unreachable:
        podman exec -it lab-client1 bash
        curl http://172.20.0.1:8080  # CAMBIADO de lab-server a IP

- bloque: 7
  tema: "Seguridad"
  nivel: "Basico"
  orden: 10
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: You need to verify which zone each network interface
    belongs to and identify what is missing to fully secure the lab.
    Task: Map all interfaces to their firewalld zones and document
    the three security gaps in the current configuration.
    Technical Requirements:
    - Use 'firewall-cmd --get-active-zones' to see interface assignments.
    - Use 'nmcli con show' to list all connections.
    - Use 'firewall-cmd --zone=public --list-all' to inspect the
      full public zone configuration.
    - Identify the 3 security gaps:
        1. Port 8080 not open in any zone.
        2. Masquerade disabled in public zone.
        3. lab-dmz zone not assigned to any interface yet.
    # Nota: El host no tiene interfaz 'lab-net0', es solo un concepto
    # para el ejercicio - funciona igualmente.
- bloque: 7
  tema: "Seguridad"
  nivel: "Intermedio"
  orden: 1
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: Apache is failing to serve content from /srv/web_lab
    because SELinux is blocking access due to wrong file context.
    Task: Fix the SELinux context on /srv/web_lab so Apache
    can serve content correctly.
    Technical Requirements:
    - Use 'semanage fcontext' to define a persistent rule:
        semanage fcontext -a -t httpd_sys_content_t "/srv/web_lab(/.*)?"
    - Apply the rule with 'restorecon -Rv /srv/web_lab'.
    - Verify with 'ls -Z /srv/web_lab/index.html' that context
      is now httpd_sys_content_t.
    - Test with 'curl curl http://172.20.0.1:8080' returns
      "SELinux Lab Content".
    - Confirm the rule persists with:
        semanage fcontext -l | grep web_lab

- bloque: 7
  tema: "Seguridad"
  nivel: "Intermedio"
  orden: 2
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: A web application needs to make outbound network
    connections but SELinux is blocking them silently.
    Task: Identify and enable the correct SELinux boolean
    for Apache network connections.
    Technical Requirements:
    - Use 'getsebool -a | grep httpd' to list all httpd booleans.
    - Identify that 'httpd_can_network_connect' is off.
    - Enable it persistently:
        setsebool -P httpd_can_network_connect on
    - Verify with 'getsebool httpd_can_network_connect'.
    - Explain the difference between 'setsebool' (runtime only)
      and 'setsebool -P' (persistent across reboots).

- bloque: 7
  tema: "Seguridad"
  nivel: "Intermedio"
  orden: 3
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: devuser has unrestricted NOPASSWD sudo access which
    violates the principle of least privilege.
    Task: Replace devuser's rule with a restricted sudo policy
    that allows only specific commands.
    Technical Requirements:
    - Remove the current rule: rm /etc/sudoers.d/devuser
    - Create a new rule using 'visudo -f /etc/sudoers.d/devuser'
      that allows devuser ONLY to:
        /usr/bin/systemctl restart httpd
        /usr/bin/journalctl -u httpd
    - Test as devuser:
        sudo systemctl restart httpd   → must succeed
        sudo systemctl restart sshd    → must be rejected
    - Verify syntax with 'visudo -c -f /etc/sudoers.d/devuser'.

- bloque: 7
  tema: "Seguridad"
  nivel: "Intermedio"
  orden: 4
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: The password policy must be strengthened to meet
    the company security baseline requirements.
    Task: Enforce a strong password policy using pwquality
    and verify it rejects weak passwords.
    Technical Requirements:
    - Edit /etc/security/pwquality.conf:
        minlen = 12
        minclass = 3
        maxrepeat = 2
        dcredit = -1
        ucredit = -1
        lcredit = -1
        ocredit = -1
    - Edit /etc/login.defs:
        PASS_MAX_DAYS 90
        PASS_MIN_LEN  12
    - Test by trying to set a weak password for opsuser:
        echo "opsuser:abc" | chpasswd
      This must fail with a quality error.
    - Set a valid strong password:
        echo "opsuser:Secure@Lab2024" | chpasswd

- bloque: 7
  tema: "Seguridad"
  nivel: "Intermedio"
  orden: 5
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: The SSH server has multiple insecure settings that
    must be fixed without breaking legitimate user access.
    Task: Harden the SSH configuration and verify from
    lab-attacker (172.20.0.99) that root login is rejected.
    Technical Requirements:
    - Edit /etc/ssh/sshd_config.d/98-lab-insecure.conf:
        PermitRootLogin no
        MaxAuthTries 3
        PermitEmptyPasswords no
        X11Forwarding no
        LogLevel VERBOSE
    - Reload sshd: systemctl reload sshd
    - From lab-attacker verify root login is rejected:
        podman exec -it lab-attacker bash
        ssh root@172.20.0.1  → must return "Permission denied"
    - Verify devuser can still login successfully:
        ssh devuser@lab-server

- bloque: 7
  tema: "Seguridad"
  nivel: "Intermedio"
  orden: 6
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: /srv/shared_lab is a shared directory where any user
    can delete files owned by others because the sticky bit
    is not set.
    Task: Fix the shared directory with the sticky bit and verify
    the protection works correctly.
    Technical Requirements:
    - Verify the problem: as devuser create a file, then as
      opsuser try to delete it — it must succeed (the bug).
    - Apply the sticky bit: chmod +t /srv/shared_lab
    - Verify with 'ls -ld /srv/shared_lab' shows 't' at the end
      of the permission string.
    - Test again: opsuser must now get "Operation not permitted"
      when trying to delete a file owned by devuser.

- bloque: 7
  tema: "Seguridad"
  nivel: "Intermedio"
  orden: 7
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: Security policy requires that any access to
    /etc/lab_secrets/credentials.conf must be logged by auditd.
    Task: Create an audit watch rule for the credentials file
    and verify it generates events.
    Technical Requirements:
    - Add a persistent rule to /etc/audit/rules.d/lab.rules:
        -w /etc/lab_secrets/credentials.conf -p rwxa -k lab_secrets
    - Reload rules: augenrules --load
    - Trigger the rule: cat /etc/lab_secrets/credentials.conf
    - Search the audit log:
        ausearch -k lab_secrets
    - Verify the event shows the correct file, user, and action.

- bloque: 7
  tema: "Seguridad"
  nivel: "Intermedio"
  orden: 8
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: The SSH service is receiving brute force attempts.
    fail2ban must be activated to automatically ban attackers.
    Task: Enable the fail2ban SSH jail and verify it bans
    lab-attacker (172.20.0.99) after failed attempts.
    Technical Requirements:
    - Edit /etc/fail2ban/jail.d/lab-sshd.conf:
        enabled  = true
        maxretry = 3
        bantime  = 300
        findtime = 60
    - Restart fail2ban: systemctl restart fail2ban
    - From lab-attacker simulate 4 failed SSH logins:
        podman exec -it lab-attacker bash
        for i in $(seq 1 4); do
          ssh -o StrictHostKeyChecking=no \
          fakeuser@lab-server 2>/dev/null || true; done
    - On the host verify the ban:
        fail2ban-client status sshd

- bloque: 7
  tema: "Seguridad"
  nivel: "Intermedio"
  orden: 9
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: Port 8080 must be opened in the firewall so that
    the SELinux lab virtual host is reachable from the network.
    Task: Open port 8080 permanently in firewalld and verify
    access from lab-client1 (172.20.0.10).
    Technical Requirements:
    - Add port 8080/tcp to the public zone permanently:
        firewall-cmd --permanent --zone=public --add-port=8080/tcp
    - Reload the firewall: firewall-cmd --reload
    - From lab-client1 verify access:
        podman exec -it lab-client1 bash
        curl http://lab-server:8080
      Must return "SELinux Lab Content".
    - Verify the rule persists:
        firewall-cmd --zone=public --list-ports

- bloque: 7
  tema: "Seguridad"
  nivel: "Intermedio"
  orden: 10
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: lab-attacker (172.20.0.99) is conducting reconnaissance
    and must be blocked at the firewall level immediately.
    Task: Create a Rich Rule to drop all traffic from lab-attacker
    and verify the block from inside the container.
    Technical Requirements:
    - Add a permanent rich rule in the public zone:
        firewall-cmd --permanent --zone=public \
          --add-rich-rule='rule family="ipv4"
          source address="172.20.0.99"
          log prefix="BLOCKED_ATTACKER: " level="warning"
          drop'
    - Reload: firewall-cmd --reload
    - From lab-attacker verify all traffic is dropped:
        podman exec -it lab-attacker bash
        curl http://lab-server    → must time out
        ssh lab-server            → must time out
    - On the host verify log entries:
        journalctl -k | grep BLOCKED_ATTACKER

- bloque: 7
  tema: "Seguridad"
  nivel: "Avanzado"
  orden: 1
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: Apache is running and firewalld allows port 8080,
    but requests to /srv/web_lab return 403 Forbidden silently.
    The Apache error log shows "Permission denied" but Linux
    file permissions look correct.
    Task: Use SELinux audit tools to diagnose the AVC denial
    and apply a permanent fix.
    Technical Requirements:
    - Inject the problem:
        chcon -t default_t /srv/web_lab/index.html
        curl http://localhost:8080  → returns 403
    - Search for AVC denials:
        ausearch -m avc -ts recent
    - Use sealert to get a human-readable explanation:
        sealert -a /var/log/audit/audit.log
    - Identify the suggested fix from sealert output.
    - Apply the permanent fix:
        semanage fcontext -a -t httpd_sys_content_t "/srv/web_lab(/.*)?"
        restorecon -Rv /srv/web_lab
    - Verify curl returns 200 after the fix.
    - Explain the difference between 'chcon' (temporary, lost
      on relabel) and 'semanage + restorecon' (permanent).

- bloque: 7
  tema: "Seguridad"
  nivel: "Avanzado"
  orden: 2
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: Apache needs to listen on port 9090 for a new
    application but fails to start. firewalld allows the port
    but the service still cannot bind to it.
    Task: Identify that SELinux is blocking the non-standard
    port and add it to the allowed http_port_t type.
    Technical Requirements:
    - Add Listen 9090 to /etc/httpd/conf.d/ports_lab.conf.
    - Attempt to restart httpd — it will fail.
    - Check the error: journalctl -u httpd -n 20
    - Identify SELinux is blocking port 9090 binding.
    - List current allowed ports:
        semanage port -l | grep http_port_t
    - Add port 9090 permanently:
        semanage port -a -t http_port_t -p tcp 9090
    - Restart httpd and verify:
        curl http://localhost:9090
    - Confirm with: semanage port -l | grep 9090

- bloque: 7
  tema: "Seguridad"
  nivel: "Avanzado"
  orden: 3
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: The auditor user needs read-only access to system
    logs and service status but must never be able to modify
    anything or stop any service.
    Task: Configure a granular sudo policy for auditor using
    command aliases in sudoers.
    Technical Requirements:
    - Create /etc/sudoers.d/auditor using visudo:
        Cmnd_Alias AUDIT_CMDS = \
            /usr/bin/journalctl, \
            /usr/bin/ausearch, \
            /usr/bin/aureport, \
            /usr/bin/systemctl status *
        auditor ALL=(ALL) NOPASSWD: AUDIT_CMDS
    - Test as auditor:
        sudo journalctl -u httpd       → must succeed
        sudo ausearch -k lab_secrets   → must succeed
        sudo systemctl stop httpd      → must be rejected
        sudo rm /etc/passwd            → must be rejected
    - Verify with: sudo -l -U auditor

- bloque: 7
  tema: "Seguridad"
  nivel: "Avanzado"
  orden: 4
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: Security policy requires that user accounts are
    automatically locked after 3 consecutive failed login
    attempts to protect against brute force attacks.
    Task: Configure PAM account lockout using faillock and
    verify the lockout and unlock process.
    Technical Requirements:
    - Configure /etc/security/faillock.conf:
        deny = 3
        unlock_time = 600
        fail_interval = 900
    - Verify the configuration is active in
      /etc/pam.d/system-auth and /etc/pam.d/password-auth
      — both must reference pam_faillock.so.
    - Test: attempt 3 failed logins for opsuser then verify:
        faillock --user opsuser
      Output must show 3 failures and locked status.
    - Unlock manually and verify opsuser can log in again:
        faillock --user opsuser --reset

- bloque: 7
  tema: "Seguridad"
  nivel: "Avanzado"
  orden: 5
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: Password-based SSH must be disabled entirely.
    Only key-based authentication will be allowed going forward.
    Task: Enforce SSH key-only authentication and verify that
    password login is rejected from lab-attacker (172.20.0.99)
    while key login works from lab-client1 (172.20.0.10).
    Technical Requirements:
    - On the host generate a key pair for devuser:
        su - devuser
        ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""
    - Copy the public key to lab-client1:
        ssh-copy-id -i ~/.ssh/id_ed25519.pub labuser@172.20.0.10
    - Disable password auth in sshd config:
        PasswordAuthentication no
        AuthenticationMethods publickey
    - Reload sshd: systemctl reload sshd
    - From lab-attacker verify password login fails:
        podman exec -it lab-attacker bash
        ssh devuser@lab-server  → must return "Permission denied (publickey)"
    - From lab-client1 verify key login works:
        podman exec -it lab-client1 bash
        ssh -i ~/.ssh/id_ed25519 devuser@lab-server

- bloque: 7
  tema: "Seguridad"
  nivel: "Avanzado"
  orden: 6
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: /srv/labgroup_dir is shared by labgroup members but
    files created there inherit the creator's personal group
    instead of labgroup, causing access issues for other members.
    Task: Fix group inheritance using SGID and remove the
    unnecessary SUID from /usr/local/bin/cat_lab.
    Technical Requirements:
    - Verify the problem: as devuser create a file in
      /srv/labgroup_dir and confirm the group is not labgroup.
    - Apply SGID: chmod g+s /srv/labgroup_dir
    - Verify with 'ls -ld /srv/labgroup_dir' shows 's'
      in the group execute position.
    - Test again: new files created by devuser must now
      show labgroup as the group owner.
    - Remove unnecessary SUID from cat_lab:
        chmod u-s /usr/local/bin/cat_lab
    - Verify with: find /usr/local/bin -perm /4000
      Must return no results.

- bloque: 7
  tema: "Seguridad"
  nivel: "Avanzado"
  orden: 7
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: Compliance requires auditing all sudo usage and
    any modification to sudoers files and user/group databases.
    Task: Create comprehensive audit rules for privilege
    escalation monitoring.
    Technical Requirements:
    - Add to /etc/audit/rules.d/lab.rules:
        -a always,exit -F arch=b64 -S execve \
          -F path=/usr/bin/sudo -k sudo_usage
        -w /etc/sudoers -p wa -k sudoers_changes
        -w /etc/sudoers.d/ -p wa -k sudoers_changes
        -w /etc/passwd -p wa -k user_changes
        -w /etc/group  -p wa -k user_changes
    - Reload: augenrules --load
    - Trigger each rule:
        sudo ls /root
        echo "test" >> /etc/sudoers.d/test && \
          rm /etc/sudoers.d/test
    - Verify events were captured:
        ausearch -k sudo_usage
        ausearch -k sudoers_changes

- bloque: 7
  tema: "Seguridad"
  nivel: "Avanzado"
  orden: 8
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: fail2ban must integrate with firewalld to ban IPs
    using firewall rich rules instead of iptables directly,
    which is the correct approach on Rocky Linux 9.
    Task: Configure fail2ban to use the firewalld backend and
    verify the ban appears as a rich rule in firewalld.
    Technical Requirements:
    - Edit /etc/fail2ban/jail.d/lab-sshd.conf:
        [sshd]
        enabled  = true
        banaction = firewallcmd-rich-rules
        banaction_allports = firewallcmd-rich-rules
        maxretry = 3
        bantime  = 600
        findtime = 60
    - Restart fail2ban: systemctl restart fail2ban
    - From lab-attacker trigger the ban:
        podman exec -it lab-attacker bash
        for i in $(seq 1 4); do
          ssh -o StrictHostKeyChecking=no \
          fakeuser@lab-server 2>/dev/null || true; done
    - Verify the ban appears as a firewalld rich rule:
        firewall-cmd --zone=public --list-rich-rules
    - Unban manually and confirm the rule disappears:
        fail2ban-client set sshd unbanip 172.20.0.99

- bloque: 7
  tema: "Seguridad"
  nivel: "Avanzado"
  orden: 9
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: The lab-dmz zone must be assigned to the lab-net0
    interface and configured so only HTTP/HTTPS passes by default,
    with SSH allowed only from the lab network via a rich rule.
    Task: Assign lab-net0 to lab-dmz and validate zone behavior
    from lab-client1 (172.20.0.10).
    Technical Requirements:
    - Assign the interface permanently:
        firewall-cmd --permanent --zone=lab-dmz \
          --add-interface=lab-net0
    - Reload and verify: firewall-cmd --get-active-zones
    - From lab-client1 confirm HTTP works but SSH is dropped:
        podman exec -it lab-client1 bash
        curl http://lab-server    → must succeed
        ssh lab-server            → must be dropped
    - Add SSH only for the lab network via rich rule:
        firewall-cmd --permanent --zone=lab-dmz \
          --add-rich-rule='rule family="ipv4"
          source address="172.20.0.0/24"
          service name="ssh" accept'
    - Reload and verify SSH now works from lab-client1.

- bloque: 7
  tema: "Seguridad"
  nivel: "Avanzado"
  orden: 10
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: lab-client1 and lab-client2 cannot reach external
    networks because IP forwarding and masquerade are disabled
    on the host server.
    Task: Enable IP forwarding and masquerade so the host acts
    as a NAT gateway for the lab network.
    Technical Requirements:
    - Enable IP forwarding persistently:
        echo "net.ipv4.ip_forward = 1" \
          > /etc/sysctl.d/99-lab-forward.conf
        sysctl --system
    - Enable masquerade in the public zone permanently:
        firewall-cmd --permanent --zone=public \
          --add-masquerade
        firewall-cmd --reload
    - Verify masquerade is active:
        firewall-cmd --zone=public --query-masquerade
    - Verify IP forwarding value:
        sysctl net.ipv4.ip_forward  → must return 1
    - From lab-client1 verify external connectivity:
        podman exec -it lab-client1 bash
        curl -s https://example.com | grep -i "example"

- bloque: 7
  tema: "Seguridad"
  nivel: "Troubleshooting"
  orden: 1
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: Apache is running and firewalld allows port 80,
    but every request returns 403 Forbidden. The Apache error
    log shows "Permission denied" but file permissions look
    correct when checked with ls -l.
    Setup (inject bug):
      chcon -t var_t /var/www/html/index.html
      systemctl restart httpd
    Task: Diagnose and fix the SELinux denial blocking Apache
    following the correct diagnostic order.
    Technical Requirements:
    - Confirm httpd is active: systemctl is-active httpd
    - Confirm firewall allows http: firewall-cmd --list-services
    - Confirm file permissions look correct: ls -l /var/www/html/
    - Run 'curl http://localhost' and observe 403.
    - Use 'ausearch -m avc -ts recent' to find the AVC denial.
    - Identify the wrong context type 'var_t' on index.html.
    - Fix with: restorecon -v /var/www/html/index.html
    - Verify curl returns 200 and "Bienvenido al Lab".

- bloque: 7
  tema: "Seguridad"
  nivel: "Troubleshooting"
  orden: 2
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: A junior admin set SELinux to Permissive mode to
    fix an application issue and forgot to revert it. The
    security team detected it during a routine audit.
    Setup (inject bug):
      setenforce 0
      sed -i 's/SELINUX=enforcing/SELINUX=permissive/' \
        /etc/selinux/config
    Task: Restore SELinux to Enforcing mode safely without
    breaking any running services.
    Technical Requirements:
    - Confirm current mode with 'getenforce' — shows Permissive.
    - Check /etc/selinux/config — shows permissive.
    - Before switching back check for existing AVC denials
      that would block services in enforcing mode:
        ausearch -m avc -ts today
    - Fix /etc/selinux/config: SELINUX=enforcing
    - Switch runtime mode: setenforce 1
    - Verify 'getenforce' returns Enforcing.
    - Confirm httpd and sshd still respond after the switch:
        curl http://localhost
        systemctl is-active sshd

- bloque: 7
  tema: "Seguridad"
  nivel: "Troubleshooting"
  orden: 3
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: opsuser reports that 'sudo systemctl status httpd'
    fails with "sudo: command not found" despite having a
    sudoers rule. The rule was recently edited manually without
    using visudo.
    Setup (inject bug):
      echo "opsuser ALL=(ALL) /usr/bin/systemctl status httpd" \
        > /etc/sudoers.d/opsuser
      chmod 777 /etc/sudoers.d/opsuser
    Task: Find and fix the broken sudoers configuration.
    Technical Requirements:
    - Try the command: su - opsuser -c "sudo systemctl status httpd"
      and observe the error.
    - Run 'visudo -c' to check overall sudoers syntax.
    - Run 'visudo -c -f /etc/sudoers.d/opsuser'.
    - Identify the real problem: sudo silently ignores files
      with permissions other than 0440.
    - Fix: chmod 0440 /etc/sudoers.d/opsuser
    - Verify opsuser can now run the command successfully.

- bloque: 7
  tema: "Seguridad"
  nivel: "Troubleshooting"
  orden: 4
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: All users are locked out of the system after a
    junior admin edited /etc/pam.d/system-auth incorrectly.
    SSH with keys still works for root — that is your only
    access to the machine.
    Setup (inject bug):
      echo "auth required pam_deny.so" \
        >> /etc/pam.d/system-auth
    Task: Fix the PAM configuration to restore all user logins
    without rebooting the system.
    Technical Requirements:
    - Attempt login as devuser — it must fail completely.
    - As root inspect /etc/pam.d/system-auth carefully.
    - Identify the rogue 'auth required pam_deny.so' line
      at the end — it denies ALL authentication unconditionally.
    - Remove the line:
        sed -i '/auth required pam_deny.so/d' \
          /etc/pam.d/system-auth
    - Verify devuser can now log in successfully.
    - Explain why pam_deny.so at auth required position
      is catastrophic and how to prevent it in production.

- bloque: 7
  tema: "Seguridad"
  nivel: "Troubleshooting"
  orden: 5
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: After a maintenance window legitimate users cannot
    SSH into the server. They get "Connection refused" on port 22.
    The server is reachable via ping from lab-attacker.
    Setup (inject bug):
      sed -i 's/^#Port 22/Port 2222/' /etc/ssh/sshd_config
      systemctl restart sshd
      firewall-cmd --permanent --zone=public \
        --remove-service=ssh
      firewall-cmd --reload
    Task: Restore SSH access on the standard port 22.
    Technical Requirements:
    - From lab-attacker confirm port 22 is refused:
        podman exec -it lab-attacker bash
        ssh lab-server   → Connection refused
    - On the host check which port sshd is listening on:
        ss -tnlp | grep sshd
    - Identify sshd moved to port 2222.
    - Revert the port in /etc/ssh/sshd_config to 22.
    - Restore ssh service in firewalld public zone permanently.
    - Restart sshd and verify from lab-attacker:
        ssh devuser@lab-server   → must succeed on port 22.

- bloque: 7
  tema: "Seguridad"
  nivel: "Troubleshooting"
  orden: 6
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: Users in labgroup report they cannot write to
    /srv/labgroup_dir even though they are group members and
    the directory shows rwxrwxr-x permissions.
    Setup (inject bug):
      chown root:root /srv/labgroup_dir
      chmod 775 /srv/labgroup_dir
    Task: Diagnose and fix the group ownership problem so
    labgroup members can write to the directory.
    Technical Requirements:
    - As devuser attempt to create a file:
        su - devuser -c "touch /srv/labgroup_dir/test.txt"
      Observe "Permission denied".
    - Check directory ownership: ls -ld /srv/labgroup_dir
    - Identify the group owner is 'root' instead of 'labgroup'.
    - Verify devuser is actually in labgroup: groups devuser
    - Fix: chown root:labgroup /srv/labgroup_dir
    - Verify devuser can now write:
        su - devuser -c "touch /srv/labgroup_dir/fixed.txt"

- bloque: 7
  tema: "Seguridad"
  nivel: "Troubleshooting"
  orden: 7
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: The security team reports that audit rules are not
    being loaded after reboot even though the rules file exists
    at /etc/audit/rules.d/lab.rules.
    Setup (inject bug):
      chmod 000 /etc/audit/rules.d/lab.rules
      systemctl restart auditd
    Task: Diagnose why audit rules are not loading and fix
    the root cause.
    Technical Requirements:
    - Check loaded rules: auditctl -l
      Observe no custom rules are present.
    - Try manually reloading: augenrules --load
      Observe a permission denied error.
    - Identify the problem: /etc/audit/rules.d/lab.rules
      has permissions 000 — augenrules cannot read it.
    - Fix: chmod 640 /etc/audit/rules.d/lab.rules
    - Reload rules: augenrules --load
    - Verify: auditctl -l shows the -w /etc/lab_secrets rule.
    - Trigger the rule and confirm with ausearch -k lab_secrets.

- bloque: 7
  tema: "Seguridad"
  nivel: "Troubleshooting"
  orden: 8
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: fail2ban is running and the sshd jail is enabled
    but IPs are never getting banned despite multiple failed
    login attempts from lab-attacker. The fail2ban log shows
    no matches found.
    Setup (inject bug):
      sed -i 's|logpath.*|logpath = /var/log/auth.log|' \
        /etc/fail2ban/jail.d/lab-sshd.conf
      systemctl restart fail2ban
    Task: Find why fail2ban is not detecting failed attempts
    and fix the configuration.
    Technical Requirements:
    - From lab-attacker run 5 failed SSH attempts:
        podman exec -it lab-attacker bash
        for i in $(seq 1 5); do
          ssh -o StrictHostKeyChecking=no \
          fakeuser@lab-server 2>/dev/null || true; done
    - Check fail2ban log on the host:
        tail -50 /var/log/fail2ban.log
      Observe "File not found" error for /var/log/auth.log.
    - Identify the problem: Rocky Linux uses /var/log/secure
      not /var/log/auth.log (Debian/Ubuntu convention).
    - Fix: sed -i 's|/var/log/auth.log|/var/log/secure|' \
        /etc/fail2ban/jail.d/lab-sshd.conf
    - Restart fail2ban and repeat the failed attempts.
    - Verify: fail2ban-client status sshd shows banned IP.

- bloque: 7
  tema: "Seguridad"
  nivel: "Troubleshooting"
  orden: 9
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: A rich rule was added to block a specific attacker
    but now ALL traffic to the server is being dropped including
    from lab-client1. The admin cannot identify which rule
    is responsible.
    Setup (inject bug):
      firewall-cmd --permanent --zone=public \
        --add-rich-rule='rule family="ipv4"
        source address="0.0.0.0/0" drop'
      firewall-cmd --reload
    Task: Identify and remove the overly broad rich rule that
    is blocking all traffic.
    Technical Requirements:
    - From lab-client1 confirm all traffic is dropped:
        podman exec -it lab-client1 bash
        curl http://lab-server   → times out
    - On the host list all rich rules in the public zone:
        firewall-cmd --zone=public --list-rich-rules
    - Identify the rule dropping 0.0.0.0/0 (all traffic).
    - Remove the rule permanently:
        firewall-cmd --permanent --zone=public \
          --remove-rich-rule='rule family="ipv4"
          source address="0.0.0.0/0" drop'
    - Reload and verify from lab-client1 traffic is restored:
        curl http://lab-server   → must return 200.

- bloque: 7
  tema: "Seguridad"
  nivel: "Troubleshooting"
  orden: 10
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: An admin added firewall rules during an emergency
    without the --permanent flag. After a routine firewalld
    reload all services became unreachable again from lab-client1.
    Setup (inject bug):
      firewall-cmd --permanent --zone=public \
        --remove-service=http
      firewall-cmd --permanent --zone=public \
        --remove-service=https
      firewall-cmd --permanent --zone=public \
        --remove-port=8080/tcp
      firewall-cmd --reload
      firewall-cmd --zone=public --add-service=http
      firewall-cmd --zone=public --add-service=https
      firewall-cmd --zone=public --add-port=8080/tcp
    Task: Identify the gap between runtime and permanent
    firewall configuration and make all rules persistent.
    Technical Requirements:
    - From lab-client1 confirm HTTP works before reload:
        podman exec -it lab-client1 bash
        curl http://lab-server   → works (runtime rule active)
    - On the host reload the firewall:
        firewall-cmd --reload
    - From lab-client1 confirm HTTP is now broken:
        curl http://lab-server   → fails (runtime rule gone)
    - Identify the discrepancy between runtime and permanent:
        firewall-cmd --zone=public --list-services
        firewall-cmd --zone=public --permanent --list-services
    - Add all missing rules permanently and reload.
    - Verify from lab-client1 that all services survive
      a second firewall reload.

# ======================================================================
# BLOQUE 7 CONTENEDORES
