    Context: You need to investigate why 'lab-simple-failing.service' is not running.
    Task: Check the detailed status and recent logs of the service.
    Technical Requirements:
    - Use 'systemctl status' for the service.
    - Use 'journalctl -u' to see only the logs related to this specific unit. 
    - Identify the specific error (ExecStart path).

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Basico"
  orden: 4
  dificultad: 2
  enunciado: |
