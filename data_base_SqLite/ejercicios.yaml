    Technical Requirements:
    - Implement a retry() function with this signature:
        retry <max_attempts> <delay_seconds> <command...>
      It runs <command>, and if it fails retries up to
      <max_attempts> times waiting <delay_seconds> between each.
      On final failure, returns the last exit code.
      Prints to stderr: "Attempt N/MAX failed, retrying in Xs..."
    - Use retry() to check if a URL is reachable:
        retry 3 2 curl -sf --max-time 5 http://localhost
      (localhost likely has nothing, so it will fail – that's OK,
      the goal is to observe the retry behavior)
    - Implement exponential backoff variant retry_exp():
        delay doubles each attempt: 1s, 2s, 4s, 8s...
    - Implement a timeout wrapper using bash built-ins:
        run_with_timeout <seconds> <command>
        Uses: ( <command> ) & PID=$!; sleep N; kill $PID 2>/dev/null
    - Write a test that demonstrates all three behaviors
      with clear output showing each attempt.

