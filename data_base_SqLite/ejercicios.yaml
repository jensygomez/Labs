    Task: Stop the 'lab-log-generator.service' and ensure it doesn't start on the next reboot.
    Technical Requirements:
    - Stop the service immediately.
    - Disable the service.
    - Verify its status is 'inactive' and 'disabled'. [cite: 12, 13]

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Basico"
  orden: 5
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You are monitoring system performance.
    Task: Identify the top 5 processes consuming the most CPU.
    Technical Requirements:
    - Use 'top' or 'ps'.
    - If using 'ps', use 'ps aux --sort=-%cpu | head -n 6'.
    - Locate the process 'cpu-hog.sh' if it is running. [cite: 21, 53]

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Basico"
  orden: 6
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: A backup task is supposed to run periodically.
    Task: List all active timers on the system.
    Technical Requirements:
    - Use 'systemctl list-timers'. 
    - Identify the 'lab-backup.timer' and see when it is scheduled to run next.

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Basico"
  orden: 7
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: You need to find a specific event in the system logs.
    Task: View logs generated by the kernel today.
    Technical Requirements:
    - Use 'journalctl -k' or 'journalctl _TRANSPORT=kernel'.
    - Filter the output to show only logs since the current boot.

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Basico"
  orden: 8
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: A service configuration was manually edited on disk.
    Task: Make systemd aware of the changes without rebooting.
    Technical Requirements:
    - Run the command to reload the systemd manager configuration (daemon-reload). [cite: 14, 44]
    - Explain why this is necessary after editing a .service file.

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Basico"
  orden: 9
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You are managing background tasks.
    Task: Start a 'sleep 1000' command in the background.
    Technical Requirements:
    - Run the command using '&'.
    - Use the 'jobs' command to verify it is running.
    - Use 'fg' to bring it to the foreground and then 'Ctrl+C' to kill it.

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Basico"
  orden: 10
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: You need to identify the relationship between a service and its processes.
    Task: Find the PID (Process ID) of the 'lab-file-logger.service'.
    Technical Requirements:
    - Use 'systemctl status' or 'pgrep -f file-logger'. [cite: 48, 53]
    - Verify the PID exists in the 'ps aux' output.


# ─── BLOQUE 4: SYSTEMD Y PROCESOS - INTERMEDIO ───

