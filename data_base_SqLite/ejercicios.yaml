- bloque: 9
  tema: "Scripting Bash"
  nivel: "Avanzado"
  orden: 9
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: Advanced scripts must handle inter-process communication.
    Named pipes (FIFOs) allow decoupled producer-consumer patterns.
    Task: Implement a producer-consumer system using a named pipe
    to process jobs without race conditions.
    Technical Requirements:
    - Create a named pipe: mkfifo /tmp/lab_jobpipe
    - Producer process: reads cola.txt from
      /opt/labs/bloque09/avanzado/paralelo/cola.txt and writes
      each job line to the FIFO, then writes "DONE" as sentinel.
      Run in background: producer &
    - Consumer process: reads from the FIFO in a while loop.
        while IFS= read -r job; do
            [[ "$job" == "DONE" ]] && break
            process the job...
        done < /tmp/lab_jobpipe
    - The consumer processes each job (just echo + sleep 0.2)
      and writes results to /tmp/lab_results.txt.
    - Use trap to clean up the FIFO on EXIT:
        trap 'rm -f /tmp/lab_jobpipe' EXIT
    - After both finish, verify:
        wc -l /tmp/lab_results.txt  → must equal lines in cola.txt
    - Explain in a comment why this avoids race conditions
      compared to multiple writers on a plain file.

