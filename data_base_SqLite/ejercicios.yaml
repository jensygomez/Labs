    Task: Execute a long-running command using 'nohup'.
    Technical Requirements:
    - Run 'nohup sleep 2000 &'
    - Exit the shell and log back in.
    - Verify the 'sleep' process is still running and owned by PID 1 (init/systemd).

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Intermedio"
  orden: 9
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: 'lab-condition-failing.service' won't start because a required file is missing.
    Task: Satisfy the unit condition.
    Technical Requirements:
    - Check 'systemctl status' to see which 'ConditionPathExists' is failing.
    - Create the missing file (e.g., /etc/archivo-que-no-existe.conf).
    - Start the service and verify it runs successfully.

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Intermedio"
  orden: 10
