  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You need to verify the overall health of the system services.
    Task: Identify all services that have failed to start.
    Technical Requirements:
    - Use 'systemctl' to list only the units in 'failed' state.
    - Note the names of the lab services (starting with 'lab-') that are failing.

- bloque: 4
