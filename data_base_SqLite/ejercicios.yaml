# ─── BASIC LEVEL ───

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Basico"
  orden: 1
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: You have just taken over as the administrator of a Rocky Linux 9 server. The previous admin left the system with some organization issues.
    Task: Find all configuration files (.conf) in /etc that have been modified in the last 7 days.
    Technical Requirements:
    - Use the find command with the appropriate options.
    - Display the full list of files with their modification dates.
    - Identify which file is the most recent.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Basico"
  orden: 2
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: A colleague from the development team asks for help because they cannot execute a script.
    Task: The file /opt/app/backup_script.sh has incorrect permissions. It must be executable by the owner and the group, but only readable by others.
    Technical Requirements:
    - Change the permissions to 755 (rwxr-xr-x).
    - Verify that the owner is root.
    - Test that the script executes correctly.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Basico"
  orden: 3
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: The finance department needs to share files temporarily but is concerned about security.
    Task: The directory /var/tmp/public_shared allows users to delete files belonging to others. You must prevent this.
    Technical Requirements:
    - Apply the Sticky Bit to the directory.
    - Verify that users can create files but cannot delete those owned by others.
    - Test with users juan, maria, and carlos.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Basico"
  orden: 4
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: The audit team needs access to financial reports but must not modify them.
    Task: The file /data/reports/financial.txt must be readable by the 'auditors' group.
    Technical Requirements:
    - Use ACLs to grant read permission to the 'auditors' group.
    - Maintain existing permissions for the owner (maria) and group (accounting).
    - Verify that 'auditor' can read but not write.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Basico"
  orden: 5
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: The application cannot find its configuration file.
    Task: The symbolic link /opt/app.conf.current is broken. It should point to /etc/app/config/app.conf.
    Technical Requirements:
    - Fix the existing symbolic link.
    - Verify that it points to the correct destination using ls -l.
    - Test that the file can be read through the link.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Basico"
  orden: 6
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: You need to email all application logs, but the file is too large.
    Task: Compress /var/log/lab/app_large.log using gzip with maximum compression.
    Technical Requirements:
    - Create /tmp/app_large.log.gz with maximum compression.
    - Compare original size vs. compressed size.
    - Verify that the compressed file is readable with zcat.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Basico"
  orden: 7
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: The security team suspects that a system binary has been modified.
    Task: Verify the integrity of the httpd package using rpm.
    Technical Requirements:
    - Use 'rpm -V' to verify the httpd package.
    - Identify which files have been modified.
    - Document the changes found.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Basico"
  orden: 8
  dificultad: 1
  enunciado: |
    Exam Scenario:
    Context: You need to edit a configuration file in /etc, but it is very long and hard to navigate.
    Task: Open /tmp/vim_practice_long.txt in vim and practice efficient navigation.
    Technical Requirements:
    - Go directly to line 50 without using arrow keys.
    - Search for the word 'random' and jump to the next occurrence.
    - Copy lines 100-105 and paste them at the end of the file.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Basico"
  orden: 9
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: There is a file in /var/log/lab that has no valid owner (deleted user).
    Task: Find the orphan file and assign the correct owner.
    Technical Requirements:
    - Find files with UID/GID that do not exist in the system.
    - Identify /var/log/lab/orphan_file.txt.
    - Change owner to root:root.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Basico"
  orden: 10
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: The directory /data/shared has permissions that are too open (777) and is insecure.
    Task: Adjust the permissions so that only the owner and the group can access it.
    Technical Requirements:
    - Change directory permissions to 750 (rwxr-x---).
    - Ensure that files inside maintain 640 permissions.
    - Verify that other users cannot list the content.

# ─── INTERMEDIATE LEVEL ───

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Intermedio"
  orden: 1
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: Developers need to work in /projects/collaboration, but new files do not inherit the correct group.
    Task: Configure the directory so that all created files automatically belong to the 'developers' group.
    Technical Requirements:
    - Apply the SGID bit to the directory.
    - Create a test file to verify inheritance.
    - Ensure permissions are set to 2770.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Intermedio"
  orden: 2
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: User 'auditor' needs read-only access to /data/company/finance, but currently cannot enter.
    Task: Analyze current permissions and configure appropriate access.
    Technical Requirements:
    - The directory must be executable so 'auditor' can enter (+x permission on directory).
    - 'auditor' must be able to read files but not modify them.
    - Use ACLs to give specific access to 'auditor' without changing ownership.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Intermedio"
  orden: 3
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: There is a symbolic link pointing to another link, creating a chain. You need to understand the structure.
    Task: Analyze the link chain in /opt/app.conf.link3 and determine the final file.
    Technical Requirements:
    - Use ls -l and readlink to follow the chain.
    - Document the full path: link1 -> link2 -> link3 -> real file.
    - Create a direct link pointing to the final file.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Intermedio"
  orden: 4
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: You must backup /lab/compression/documents, but only files larger than 5MB.
    Task: Create a tar.gz file containing only files >5M.
    Technical Requirements:
    - Use find to identify files >5M.
    - Use tar with --files-from or a pipe with xargs.
    - Verify the size and content of the backup.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Intermedio"
  orden: 5
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: You need to install a group of related development packages but don't remember the exact group name.
    Task: Find and install the 'Development Tools' group using dnf.
    Technical Requirements:
    - List available groups and find 'Development Tools'.
    - Install the group without confirmation.
    - Verify that the packages in the group are installed.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Intermedio"
  orden: 6
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: The file /tmp/vim_practice_replace.txt has many occurrences of 'oldserver01' that must be changed.
    Task: Use vim to replace all occurrences of 'oldserver01' with 'newserver01' only in lines that are NOT comments.
    Technical Requirements:
    - Open the file in vim.
    - Use :g/^[^#]/s/oldserver01/newserver01/g.
    - Verify that comments (#) were not modified.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Intermedio"
  orden: 7
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: The directory /projects/shared has default ACLs configured, but they don't work as expected.
    Task: Analyze and fix the default ACLs so new files inherit read permissions for the 'auditors' group.
    Technical Requirements:
    - View current ACLs with getfacl.
    - Configure default ACL: d:g:auditors:rx.
    - Create a test file and verify inheritance.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Intermedio"
  orden: 8
  dificultad: 2
  enunciado: |
    Exam Scenario:
    Context: The script /opt/application/bin/start.sh fails because it cannot find a configuration file.
    Task: The problem is a broken link. Find it and fix it.
    Technical Requirements:
    - Identify which link is broken in the chain.
    - Fix the link to point to the real file (/opt/application/config/settings.conf.real).
    - Test that the script now works.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Intermedio"
  orden: 9
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: You need to compare the efficiency of different compression algorithms.
    Task: Compress /lab/compression/repetitive.log with gzip, bzip2, and xz, and compare sizes and times.
    Technical Requirements:
    - Create three compressed files with different algorithms.
    - Use 'time' to measure compression time.
    - Document final sizes and times.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Intermedio"
  orden: 10
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: A user reports they can read files in /data/private that they shouldn't.
    Task: Investigate why 'carlos' (who belongs to 'it') can read secret.txt when it should be restricted.
    Technical Requirements:
    - Analyze file permissions and ACLs.
    - Identify that the mask is limiting effective permissions.
    - Correct the mask so carlos's permissions are effective.

# ─── ADVANCED LEVEL ───

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Avanzado"
  orden: 1
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: You need to implement a collaboration system where multiple users can work in /projects/collaboration with different access levels.
    Task: Configure the directory with special permissions and ACLs for:
    - juan (developers): read/write/execute.
    - maria (accounting): read-only.
    - auditor (auditors): read-only, but cannot list content.
    Technical Requirements:
    - Use SGID for group inheritance.
    - Configure specific ACLs per user.
    - Test each access level.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Avanzado"
  orden: 2
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: As part of a security audit, you must identify all binaries with SUID/SGID in the system and justify if they are necessary.
    Task: Find all files with SUID/SGID in /usr/local/bin (those created for the lab) and determine which are security risks.
    Technical Requirements:
    - Use find with -perm to locate SUID/SGID.
    - Analyze each binary (cat_viewer, less_viewer, find_lab, vim_lab, cp_lab).
    - Remove SUID from those that should not have it.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Avanzado"
  orden: 3
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: The IT department needs a complex directory structure with different access levels for multiple teams.
    Task: Configure /data/company with the following structure:
    - /data/company/finance: rw for accounting, rx for auditors.
    - /data/company/hr: rw for hr, no one else can enter.
    - /data/company/it: rw for developers, r for operations, rx for auditors.
    Technical Requirements:
    - Use ACLs to implement all access levels.
    - Ensure new files inherit appropriate ACLs.
    - Document the final configuration with getfacl.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Avanzado"
  orden: 4
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: A critical backup (/tmp/corrupt_backup.tar.gz) is corrupt, and you need to recover as many files as possible.
    Task: Attempt to recover the contents of the corrupt backup.
    Technical Requirements:
    - Attempt to extract with tar (it will fail).
    - Use 'dd' to extract parts of the file.
    - Recover at least /etc/hostname from the backup.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Avanzado"
  orden: 5
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: You need to create a local package repository for servers without internet access.
    Task: Create a local repository in /var/www/html/repo-local using packages downloaded from a machine with internet.
    Technical Requirements:
    - Install createrepo (dnf install createrepo).
    - Create the directory structure.
    - Initialize the repository with createrepo.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Avanzado"
  orden: 6
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: You must simultaneously edit three related configuration files (vim_practice_file1.txt, file2.txt, file3.txt) to change IPs.
    Task: Open all three files in the same vim session and change the IPs according to:
    - prod-server-01: 10.0.0.10 -> 10.0.0.11
    - staging-server-01: 10.0.0.20 -> 10.0.0.21
    Technical Requirements:
    - Use vim -p or buffers to open files.
    - Perform the search and replace efficiently.
    - Save all changes.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Avanzado"
  orden: 7
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: The audit department needs a detailed report of specific files in /etc.
    Task: Generate a report of all files in /etc containing the string "lab_service".
    Technical Requirements:
    - The report must show: filename, size, inode, owner, and number of hard links.
    - Use a combination of find, stat, and awk to format the output.
    - Save the result in /tmp/lab_service_report.txt.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Avanzado"
  orden: 8
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: You are investigating space consumption in /var/log/lab.
    Task: Find all files in /var/log/lab that share the same inode.
    Technical Requirements:
    - Identify the duplicate files using find -samefile or by searching for a specific inode number.
    - Explain why this occurs (Hard Links).
    - Document the inode number and the related filenames.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Avanzado"
  orden: 9
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: Security policy requires monitoring files with unusual naming patterns.
    Task: Search /var/log for files that contain digits/numbers in their names.
    Technical Requirements:
    - Use find with regular expressions (-regex).
    - The pattern must match files like 'auth_practice.log' or any file with at least one digit.
    - Redirect the list to /tmp/numeric_logs.txt.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Avanzado"
  orden: 10
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: You are auditing the /usr/local/bin directory for system shortcuts.
    Task: Find all symbolic links in /usr/local/bin.
    Technical Requirements:
    - List the links and show exactly where they point.
    - Verify if the destination of each link actually exists.
    - Identify any "broken" links in that directory.

# ─── TROUBLESHOOTING (Bloque 1) ───

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Troubleshooting"
  orden: 1
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: An audit shows a file in /var/log/lab/ with a UID that does not exist in the system (orphan file).
    Task: Find the orphan file and fix its ownership.
    Technical Requirements:
    - Use find with the -nouser option.
    - Locate the file /var/log/lab/orphan_file.txt.
    - Change its owner and group to root:root.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Troubleshooting"
  orden: 2
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: A kernel trace indicates a process is accessing a file with a specific inode number (e.g., 123456).
    Task: Identify the file associated with that inode.
    Technical Requirements:
    - Use find with the -inum option.
    - Search the entire /var/log/lab directory.
    - Report the full path of the identified file.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Troubleshooting"
  orden: 3
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: User 'juan' reports he cannot enter /projects/dev even though he is part of the 'developers' group.
    Task: Diagnose and fix the directory access.
    Technical Requirements:
    - Check the execute (x) bit on the directory.
    - Ensure the group has appropriate permissions.
    - Fix it so 'juan' can enter without making the directory world-readable.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Troubleshooting"
  orden: 4
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: The file /var/log/lab/app_large.log is growing out of control and filling the disk.
    Task: Reclaim space safely and implement a manual rotation.
    Technical Requirements:
    - Empty the file content without deleting it (using truncation: > filename).
    - Verify the size becomes 0.
    - Explain why truncating is better than deleting for an active process.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Troubleshooting"
  orden: 5
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: Several "hidden" files in /var/log/lab are consuming disk space.
    Task: Locate hidden files (starting with dot) and evaluate them.
    Technical Requirements:
    - Find all files in /var/log/lab starting with ".".
    - Determine their size.
    - Delete only those that are temporary (.tmp) and keep the rest.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Troubleshooting"
  orden: 6
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: The httpd service is failing to serve /var/www/html/lab/index.html with a "403 Forbidden" error.
    Task: Diagnose and fix the permission issue.
    Technical Requirements:
    - Check the file permissions (should be 644).
    - Check the directory path permissions (parent directories must be +x).
    - Verify that the web server user (apache) can reach the file.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Troubleshooting"
  orden: 7
  dificultad: 3
  enunciado: |
    Exam Scenario:
    Context: An application in /opt/app needs to write to /opt/app/logs/application.log but fails.
    Task: Fix the logging failure.
    Technical Requirements:
    - Identify the user running the app.
    - Grant write permissions to the log directory and file.
    - Verify by attempting to append text to the log.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Troubleshooting"
  orden: 8
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: A backup script running as 'root' fails when trying to access /data/production.
    Task: Investigate the root cause.
    Technical Requirements:
    - Check for immutable attributes (lsattr).
    - Verify if the mount point is Read-Only.
    - Fix the access so the backup can proceed.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Troubleshooting"
  orden: 9
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: User 'carlos' (in group 'ti') can read /data/reports/hr.txt, which should be restricted to 'hr' group only.
    Task: Secure the file without breaking other services.
    Technical Requirements:
    - Remove 'carlos' or 'ti' group from ACLs if present.
    - Check for overly permissive 'other' permissions (777/666).
    - Set permissions to 640 and ensure proper group ownership.

- bloque: 1
  tema: "System Fundamentals"
  nivel: "Troubleshooting"
  orden: 10
  dificultad: 5
  enunciado: |
    Exam Scenario:
    Context: Developers in the 'developers' group cannot execute scripts in /projects/dev/scripts even though they have 'rwx' permissions.
    Task: Diagnose why execution is failing.
    Technical Requirements:
    - Check if the partition is mounted with the 'noexec' flag.
    - Check for ACL masks that might be filtering the execute bit.
    - Fix the issue and verify execution.