# ─── BLOQUE 9: SCRIPTING BASH - AVANZADO ───

- bloque: 9
  tema: "Scripting Bash"
  nivel: "Avanzado"
  orden: 1
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: Professional scripts need automated tests to verify
    they work correctly before deploying to production.
    Task: Write a mini test framework in bash and use it to test
    the functions in /opt/labs/bloque09/avanzado/testing/lib/utils.sh.
    Technical Requirements:
    - Create /opt/labs/bloque09/avanzado/testing/tests/framework.sh
      with these functions:
        assert_eq  <expected> <actual> <msg>  → PASS/FAIL
        assert_true  <cmd> <msg>              → PASS if exit 0
        assert_false <cmd> <msg>              → PASS if exit != 0
      Each function increments counters: PASS_COUNT and FAIL_COUNT.
      On FAIL, print: "[FAIL] <msg> – expected: <x> got: <y>"
      On PASS, print: "[PASS] <msg>"
    - Create tests/test_utils.sh that sources both framework.sh
      and lib/utils.sh, then runs at least 3 tests per function:
        validar_ip: "192.168.1.1" valid, "256.0.0.1" invalid,
                    "192.168.1.300" invalid (finds the bug)
        bytes_a_human: 500 → "500B", 2048 → "2KB", 2097152 → "2MB"
        generar_password: output length == 8 (finds the bug)
    - Final line must print:
        Tests: X passed, Y failed
    - Exit code: 0 if Y=0, 1 if Y>0.
    - Run with: bash tests/test_utils.sh

- bloque: 9
  tema: "Scripting Bash"
  nivel: "Avanzado"
  orden: 2
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: Deployment automation with rollback capability is
    a key skill for any Linux engineer.
