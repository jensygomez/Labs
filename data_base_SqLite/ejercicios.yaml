- bloque: 9
  tema: "Scripting Bash"
  nivel: "Troubleshooting"
  orden: 5
  dificultad: 4
  enunciado: |
    Exam Scenario:
    Context: A counter script that uses parallel processes almost
    never reaches the expected value due to a race condition.
    Task: Diagnose the race condition in
    /opt/labs/bloque09/troubleshooting/race_condition/contador_roto.sh
    and implement two different fixes.
    Technical Requirements:
    - Run the broken script 5 times and record results:
        for i in $(seq 1 5); do bash contador_roto.sh; done
      Confirm the output is inconsistent.
    - Explain in RACE_ANALYSIS.md why the race condition occurs:
        The read-modify-write sequence is not atomic.
        Two processes can read the same value simultaneously.
    - Fix A – flock (file locking) in contador_flock.sh:
        incrementar() {
            (
              flock -x 9
              local v=$(cat "$CONTADOR_FILE")
              echo $((v + 1)) > "$CONTADOR_FILE"
            ) 9>/var/lock/lab_contador.lock
        }
    - Fix B – atomic rename in contador_atomic.sh:
        incrementar() {
            local tmp=$(mktemp)
            local v=$(cat "$CONTADOR_FILE")
            echo $((v + 1)) > "$tmp"
            mv "$tmp" "$CONTADOR_FILE"
        }
    - Verify both fixes always reach 10:
        for i in $(seq 1 10); do bash contador_flock.sh; done

