    Context: A new service 'lab-no-install.service' was created, but it won't start automatically on boot.
    Task: Try to enable the service 'lab-no-install.service'.
    Technical Requirements:
    - Attempt to run 'systemctl enable lab-no-install.service'.
    - Explain why you get an error (Hint: look at the [Install] section of the unit file in /etc/systemd/system/). [cite: 15]

- bloque: 4
  tema: "Systemd & Processes"
  nivel: "Basico"
  orden: 3
  dificultad: 2
  enunciado: |
